給量が減る。こうして価格の変動によって需要量と供給量は一致する方向に調整され、均衡価格に落ち着く。その結果、社会が求める財に資源が効率的に配分される。","e":"ポイント：①超過需要→価格上昇 ②超過供給→価格下落 ③価格の変化で需要量・供給量が調整され均衡価格へ ④資源の最適配分"},{"t":"tf","s":"市場と価格","imp":1,"q":"価格の自動調節機能は、売り手が少数で、一部の企業が価格を左右できる市場で最も十分にはたらく。","a":false,"e":"誤り。正しくは、価格の自動調節機能が最もよくはたらくのは、多数の売り手と買い手がいて誰も単独では価格を左右できない完全競争市場である。売り手が少数の寡占・独占市場では、価格が企業の意図で決まりやすく、調節機能がはたらきにくい。"},{"t":"qa","s":"市場と価格","imp":2,"q":"多数の売り手と買い手が存在して誰も単独では価格に影響を与えられず、商品の質が同じで、市場への参入・退出が自由な市場を何というか。","a":"完全競争市場","alt":["完全競争"],"e":"完全競争市場では、売り手も買い手も市場で決まった価格を受け入れるだけの存在（プライス・テイカー）となる。現実の市場は完全競争の条件を満たさないことが多く、市場の失敗の原因にもなる。"},{"t":"ex","s":"曲線のシフト","imp":3,"q":"ある財の価格の変化による需要量の変化と、需要曲線そのものの移動（シフト）との違いを説明せよ。","a":"その財自体の価格が変化したときは、同じ需要曲線の上を点が移動するだけで、曲線そのものは動かない。これに対し、所得・嗜好・人口・関連する財の価格など、その財の価格以外の条件が変化したときは、どの価格においても需要量が変わるため、需要曲線全体が左右に移動する。","e":"ポイント：①自らの価格の変化→曲線上の移動 ②価格以外の条件の変化→曲線のシフト ③所得・嗜好・人口・代替財や補完財の価格など ④供給曲線も同様（原材料費・技術・税・補助金など）"},{"t":"mc","s":"曲線のシフト","imp":3,"q":"景気が回復して人々の所得が増加したとき、外食サービスの市場で起こると考えられることとして最も適当なものを一つ選べ。なお、外食サービスは所得が増えると需要が増えるものとする。","c":["需要曲線が右に移動し、均衡価格は上昇し、取引量は増加する。","需要曲線が左に移動し、均衡価格は下落し、取引量は減少する。","供給曲線が右に移動し、均衡価格は下落し、取引量は増加する。","供給曲線が左に移動し、均衡価格は上昇し、取引量は減少する。"],"a":0,"e":"所得の増加は買い手側の条件の変化なので、需要曲線が右に移動する。どの価格でも需要量が増えるので、均衡点は右上に移り、価格は上昇し取引量は増加する。所得の変化で動くのは供給曲線ではないので、供給曲線の移動を選んだ選択肢は誤り。需要曲線の左移動は所得が減少した場合である。"},{"t":"mc","s":"曲線のシフト","imp":3,"q":"パンの原材料である小麦の国際価格が大幅に上昇したとき、パンの市場で起こると考えられることとして最も適当なものを一つ選べ。","c":["需要曲線が左に移動し、均衡価格は下落し、取引量は減少する。","供給曲線が左に移動し、均衡価格は上昇し、取引量は減少する。","供給曲線が右に移動し、均衡価格は下落し、取引量は増加する。","需要曲線が右に移動し、均衡価格は上昇し、取引量は増加する。"],"a":1,"e":"原材料費の上昇は生産者側のコストの増加なので、どの価格でも供給量が減り、供給曲線が左（上）に移動する。その結果、均衡価格は上昇し、取引量は減少する。パンの値上がりで需要量が減るのは需要曲線上の移動であり、需要曲線そのものが動くわけではない点に注意する。"},{"t":"mc","s":"曲線のシフト","imp":3,"q":"技術革新によって液晶テレビの生産費用が大幅に下がったとき、液晶テレビの市場で起こると考えられることとして最も適当なものを一つ選べ。","c":["需要曲線が右に移動し、均衡価格は上昇し、取引量は増加する。","供給曲線が左に移動し、均衡価格は上昇し、取引量は減少する。","供給曲線が右に移動し、均衡価格は下落し、取引量は増加する。","需要曲線が左に移動し、均衡価格は下落し、取引量は減少する。"],"a":2,"e":"生産費用が下がると、同じ価格でもより多く供給できるようになるので、供給曲線が右（下）に移動する。均衡点は右下に移り、価格は下落し取引量は増加する。技術革新は生産者側の条件の変化であり、需要曲線を動かす要因ではない。"},{"t":"tf","s":"曲線のシフト","imp":3,"q":"ある財の価格が下がり、その財の需要量が増えたとき、需要曲線は右に移動したといえる。","a":false,"e":"誤り。正しくは、その財自体の価格が下がって需要量が増えるのは、同じ需要曲線の上を右下へ移動しただけであり、需要曲線そのものは動いていない。需要曲線が右に移動するのは、所得の増加や人気の高まりなど、価格以外の条件の変化によって、どの価格でも需要量が増える場合である。"},{"t":"mc","s":"曲線のシフト","imp":2,"q":"天候不順でコーヒー豆が不作となり、コーヒーの価格が大幅に上昇した。コーヒーの代わりに飲まれることの多い紅茶の市場で起こると考えられることとして最も適当なものを一つ選べ。","c":["紅茶の供給曲線が左に移動し、紅茶の価格は上昇する。","紅茶の需要曲線が左に移動し、紅茶の価格は下落する。","紅茶の需要曲線が右に移動し、紅茶の価格は上昇する。","紅茶の供給曲線が右に移動し、紅茶の価格は下落する。"],"a":2,"e":"紅茶はコーヒーの代替財である。コーヒーが値上がりすると、コーヒーの代わりに紅茶を買う人が増えるので、紅茶の需要曲線が右に移動し、紅茶の価格は上昇し取引量は増加する。コーヒー豆の不作は紅茶の生産条件を変えないので、紅茶の供給曲線は動かない。"},{"t":"mc","s":"曲線のシフト","imp":2,"q":"ある家庭用ゲーム機の価格が大幅に引き下げられ、ゲーム機の販売台数が急増した。そのゲーム機専用のゲームソフトの市場で起こると考えられることとして最も適当なものを一つ選べ。","c":["ゲームソフトの需要曲線が右に移動し、ゲームソフトの取引量は増加する。","ゲームソフトの需要曲線が左に移動し、ゲームソフトの取引量は減少する。","ゲームソフトの供給曲線が左に移動し、ゲームソフトの取引量は減少する。","ゲームソフトの需要曲線も供給曲線も移動せず、取引量は変わらない。"],"a":0,"e":"ゲーム機と専用ソフトは一緒に使う補完財である。ゲーム機が値下がりして持つ人が増えると、ソフトはどの価格でも多く求められるので、ソフトの需要曲線が右に移動し、価格は上昇し取引量は増加する。逆に、補完財の値上がりは需要曲線を左に移動させる。"},{"t":"qa","s":"曲線のシフト","imp":2,"q":"コーヒーと紅茶、バターとマーガリンのように、互いに代わりとして用いることができる関係にある財を何というか。","a":"代替財","e":"一方の財の価格が上がると、もう一方の財の需要が増える（需要曲線が右に移動する）。一緒に使われる財（補完財）では、一方の値上がりがもう一方の需要を減らす点と区別する。"},{"t":"qa","s":"曲線のシフト","imp":2,"q":"ゲーム機とゲームソフト、自動車とガソリンのように、一緒に用いられることで満足が得られる関係にある財を何というか。","a":"補完財","e":"一方の財の価格が上がると、もう一方の財の需要も減る（需要曲線が左に移動する）。例えばガソリンが大幅に値上がりすると、燃費の悪い自動車の需要が減る。"},{"t":"mc","s":"曲線のシフト","imp":3,"q":"政府がある商品の生産者に対し、販売1個あたり一定額の税を新たに課したとき、その商品の市場で起こると考えられることとして最も適当なものを一つ選べ。","c":["供給曲線が右に移動し、均衡価格は下落し、取引量は増加する。","需要曲線が右に移動し、均衡価格は上昇し、取引量は増加する。","需要曲線が左に移動し、均衡価格は下落し、取引量は減少する。","供給曲線が左に移動し、均衡価格は上昇し、取引量は減少する。"],"a":3,"e":"生産者にとって税は費用の増加と同じなので、供給曲線が左（上）に移動し、均衡価格は上昇し取引量は減少する。反対に、生産者に補助金を支給すると費用が下がったのと同じになり、供給曲線は右（下）に移動する。たばこ税などは、価格を上げて消費を減らす効果もねらっている。"},{"t":"tf","s":"曲線のシフト","imp":2,"q":"政府がある財の生産者に1個あたり一定額の補助金を支給すると、その財の供給曲線は右（下）に移動し、均衡価格は下落する。","a":true,"e":"正しい。補助金は生産費用を引き下げるのと同じ効果をもつので、供給曲線が右（下）に移動し、価格は下落し取引量は増加する。政策的に普及させたい財の生産に補助金を出すのは、この効果を利用したものである。"},{"t":"mc","s":"曲線のシフト","imp":3,"q":"ある財の需要曲線を右に移動させる要因として最も適当なものを一つ選べ。","c":["その財が健康によいとテレビで紹介され、人気が高まった。","その財を生産する工場で新しい機械が導入され、生産費用が下がった。","その財の価格が値下げされ、多くの人が買うようになった。","その財の原材料の価格が上昇した。"],"a":0,"e":"人気（嗜好）の高まりは、どの価格でも買いたい量を増やすので需要曲線を右に移動させる。生産費用の低下は供給曲線の右移動、原材料価格の上昇は供給曲線の左移動の要因である。その財自体の値下げによる需要量の増加は、需要曲線上の移動であって曲線のシフトではない。"},{"t":"mc","s":"曲線のシフト","imp":1,"q":"記録的な猛暑で清涼飲料水を買いたい人が増えると同時に、飲料メーカーの新工場が稼働して生産能力も増えた。清涼飲料水の市場について確実にいえることとして最も適当なものを一つ選べ。","c":["均衡価格は必ず上昇し、取引量は必ず減少する。","均衡価格は必ず下落し、取引量は必ず減少する。","取引量は増加するが、均衡価格が上がるか下がるかは両曲線の移動幅によって決まる。","均衡価格も取引量も変化しない。"],"a":2,"e":"猛暑で需要曲線が右に、生産能力の増加で供給曲線も右に移動する。どちらの移動も取引量を増やすので取引量は確実に増加するが、価格は需要の右移動で上がり供給の右移動で下がるので、どちらの移動が大きいかによって決まる。二つの曲線が同時に動く問題では、確実にいえることとそうでないことを分けて考える。"},{"t":"tf","s":"曲線のシフト","imp":1,"q":"ある地域の人口が大きく減少すると、一般にその地域で販売される多くの財の需要曲線は左に移動する。","a":true,"e":"正しい。人口が減ると買い手の数が減り、どの価格においても需要量が減るので、需要曲線は左に移動する。人口は所得や嗜好と同じく、需要曲線を移動させる要因の一つである。"},{"t":"mc","s":"曲線のシフト","imp":2,"q":"天候に恵まれてキャベツが大豊作となったとき、キャベツの市場で起こると考えられることとして最も適当なものを一つ選べ。","c":["キャベツの需要曲線が右に移動し、価格は上昇する。","キャベツの供給曲線が右に移動し、価格は下落する。","キャベツの供給曲線が左に移動し、価格は上昇する。","キャベツの需要曲線が左に移動し、価格は下落する。"],"a":1,"e":"豊作でどの価格でも出荷できる量が増えるので、供給曲線が右に移動し、価格は下落する。キャベツのような必需的な食品は需要の価格弾力性が小さいため、値下がりしても需要量があまり増えず、農家の収入がかえって減ることがある（豊作貧乏）。"},{"t":"tf","s":"曲線のシフト","imp":2,"q":"ある財の市場に新たに参入する生産者が増えると、その財の供給曲線は左に移動し、均衡価格は上昇する。","a":false,"e":"誤り。正しくは、生産者が増えるとどの価格においても供給量が増えるので、供給曲線は右に移動し、均衡価格は下落して取引量は増加する。供給曲線が左に移動するのは、生産者の撤退や原材料費の上昇などで供給量が減る場合である。"},{"t":"qa","s":"価格弾力性","imp":2,"q":"ある財の価格が変化したときに、その財の需要量がどれだけ変化するかの度合いを何というか。","a":"需要の価格弾力性","alt":["価格弾力性"],"e":"需要量の変化率÷価格の変化率で表す。価格が少し変わっただけで需要量が大きく変わる財は弾力性が大きく、需要曲線の傾きは緩やかになる。需要量があまり変わらない財は弾力性が小さく、傾きは急になる。"},{"t":"tf","s":"価格弾力性","imp":3,"q":"米や塩などの生活必需品は、価格が変化しても需要量があまり変化しないため、需要の価格弾力性が大きい。","a":false,"e":"誤り。正しくは、価格が変化しても需要量があまり変化しない生活必需品は、需要の価格弾力性が小さい。高級品や旅行などのぜいたく品は、値上がりすると購入を控え、値下がりすると購入を増やすので弾力性が大きい。"},{"t":"mc","s":"価格弾力性","imp":2,"q":"需要の価格弾力性が最も大きいと考えられる財として最も適当なものを一つ選べ。","c":["主食の米","水道水","高級腕時計","病気の治療に必要な医薬品"],"a":2,"e":"高級腕時計のようなぜいたく品は、なくても生活に困らないので、価格の変化に応じて需要量が大きく変化し、弾力性が大きい。米・水道水・医薬品は生活に欠かせない必需品で、価格が上がっても需要量をあまり減らせないため弾力性は小さい。"},{"t":"ex","s":"価格弾力性","imp":2,"q":"必需品とぜいたく品とで、需要の価格弾力性に違いが生じる理由を説明せよ。","a":"必需品は生活に欠かせないため、価格が上がっても購入を大きく減らすことができず、価格が下がっても大幅に買い増すことはないので、需要量の変化が小さく弾力性は小さい。ぜいたく品はなくても生活に困らないため、価格が上がれば購入を控え、下がれば購入を増やすので、需要量の変化が大きく弾力性は大きい。","e":"ポイント：①必需品は購入を減らしにくい→弾力性が小さい（需要曲線の傾きが急）②ぜいたく品は購入を控えやすい→弾力性が大きい（傾きが緩やか）③代わりになる財の有無も影響する"},{"t":"mc","s":"価格弾力性","imp":1,"q":"ある商品の価格を10％引き上げたところ、需要量が20％減少した。需要の価格弾力性（需要量の変化率÷価格の変化率）についての記述として最も適当なものを一つ選べ。","c":["弾力性は0.5で、価格の変化に鈍感な財である。","弾力性は2で、価格の変化に敏感な財である。","弾力性は2で、価格の変化に鈍感な財である。","弾力性は0.5で、価格の変化に敏感な財である。"],"a":1,"e":"需要の価格弾力性＝20％÷10％＝2である。1より大きいので価格の変化に敏感な（弾力的な）財といえ、ぜいたく品に多い。0.5は割る順序を逆にした誤りである。弾力性が1より大きい財では、値上げすると需要量が大きく減るため、売上高（価格×数量）はかえって減少する。"}]});</script>
<script>QDATA.push({"unit":"u15","questions":[{"t":"qa","s":"市場の失敗","imp":3,"q":"独占・寡占や公害、公共財の供給不足などのように、市場の価格メカニズムが十分にはたらかず、資源の効率的な配分が実現できないことを何というか。","a":"市場の失敗","e":"市場の失敗の主な例は、独占・寡占、外部経済・外部不経済、公共財の供給不足、情報の非対称性である。市場の失敗を補うために、政府が規制・課税・補助金・公共サービスの提供などを行う。"},{"t":"mc","s":"市場の失敗","imp":3,"q":"市場の失敗の例として適当でないものを一つ選べ。","c":["少数の企業が市場を支配し、製品の価格が高い水準に維持される。","工場からの排煙によって、周辺の住民に健康被害が生じる。","灯台の光のように、対価を払わない人の利用を妨げられないサービスが、市場では十分に供給されない。","冷夏で野菜の生産量が減って価格が上がり、野菜の需要量が減る。"],"a":3,"e":"不作で価格が上がり需要量が減るのは、価格の自動調節機能が正常にはたらいている状態であり、市場の失敗ではない。独占・寡占による高価格、排煙による健康被害（外部不経済）、灯台のような公共財の供給不足は、いずれも市場の失敗の典型例である。"},{"t":"tf","s":"市場の失敗","imp":2,"q":"市場の価格メカニズムは資源の効率的な配分をもたらすが、所得の公平な分配までは保証しないため、貧富の差の是正には政府の役割が必要となる。","a":true,"e":"正しい。市場では、能力や資産の差、病気や失業などによって所得の格差が生じ、拡大することもある。そこで政府は累進課税や社会保障などによって所得の再分配を行う。所得分配の不平等も市場の失敗（市場の限界）の一つとして扱われる。"},{"t":"qa","s":"外部経済と外部不経済","imp":3,"q":"ある経済主体の活動が、市場での取引を通さずに、他の経済主体に不利益を与えることを何というか。","a":"外部不経済","e":"公害が代表例である。工場は被害の費用を負担しないまま生産するので、生産が社会的に望ましい量より多くなる。逆に、市場を通さずに他者に利益を与えることを外部経済という。"},{"t":"qa","s":"外部経済と外部不経済","imp":3,"q":"ある経済主体の活動が、市場での取引を通さずに、他の経済主体に利益を与えることを何というか。","a":"外部経済","e":"養蜂家のミツバチが近くの果樹園の受粉を助ける、新駅の開業で周辺の地価が上がる、などが例である。利益を受ける人は対価を払わないので、外部経済をもたらす活動は社会的に望ましい量より少なくなりがちである。"},{"t":"mc","s":"外部経済と外部不経済","imp":3,"q":"次の事例のうち、外部不経済にあたるものとして最も適当なものを一つ選べ。","c":["工場の排水によって川が汚染され、下流の漁業者の漁獲量が減った。","原材料の値上がりによって、製品の価格が上がった。","近くに大型スーパーが開店し、商店街の店の売り上げが減った。","人気の高まりで、コンサートのチケットの価格が上がった。"],"a":0,"e":"排水による漁業被害は、市場の取引を通さずに第三者に不利益を与えているので外部不経済である。原材料の値上がりによる製品価格の上昇や、人気によるチケットの値上がりは、市場の価格を通じた変化である。大型スーパーとの競争による売り上げの減少も、消費者が市場で店を選んだ結果であり、外部不経済にはあたらない。"},{"t":"mc","s":"外部経済と外部不経済","imp":2,"q":"次の事例のうち、外部経済にあたるものとして最も適当なものを一つ選べ。","c":["原油価格の下落によって、ガソリンを安く買えるようになった。","養蜂家が飼うミツバチが、近くの果樹園の花の受粉を助け、果実の収穫が増えた。","工場の騒音のため、周辺の住民が夜に眠れなくなった。","商品の品質を高めた店が、客を増やして売り上げを伸ばした。"],"a":1,"e":"ミツバチによる受粉は、果樹園が対価を払わずに養蜂家の活動から利益を受けているので外部経済である。ガソリンの値下がりは市場の価格を通じた変化であり外部経済ではない。工場の騒音は外部不経済である。品質向上による売り上げ増は、市場での取引を通じた本人の利益である。"},{"t":"tf","s":"外部経済と外部不経済","imp":1,"q":"鉄道の新しい駅ができたことで、駅の周辺の住宅地の利便性が高まり、地価が上昇したことは、外部経済の例とされる。","a":true,"e":"正しい。周辺の住民や地主は、鉄道会社に対価を払っていないのに、新駅の開業によって利益を受けている。このように、市場の取引を通さずに第三者に利益が及ぶことが外部経済である。"},{"t":"mc","s":"外部経済と外部不経済","imp":2,"q":"次の事例のうち、外部不経済にあたらないものを一つ選べ。","c":["空港を発着する航空機の騒音に、周辺の住民が悩まされている。","自動車の排出ガスによって大気が汚染され、沿道の住民に健康被害が出た。","喫煙者のたばこの煙によって、周囲の人の健康が損なわれた。","ガソリン価格が上昇したため、運送会社の燃料費の負担が増えた。"],"a":3,"e":"ガソリンの値上がりによる費用の増加は、市場での価格の変化を通じた影響なので外部不経済ではない。航空機の騒音、自動車の排出ガス、たばこの煙（受動喫煙）は、いずれも市場の取引を通さずに第三者に不利益を与えているので外部不経済である。「市場（価格）を通しているかどうか」が判別のポイントである。"},{"t":"tf","s":"外部経済と外部不経済","imp":2,"q":"ある商品の人気が急に高まって品薄になり、その商品の価格が上昇したことは、外部不経済の例である。","a":false,"e":"誤り。正しくは、人気の高まりによる値上がりは、需要の増加が市場の価格に反映されたものであり、外部不経済ではない。外部不経済は、公害や騒音のように、市場の取引を通さずに第三者に不利益を与える場合をいう。"},{"t":"tf","s":"外部経済と外部不経済","imp":1,"q":"ある家の住人が庭に美しい花を植えたところ、通りかかる人々が無料でその景観を楽しめるようになったことは、外部経済の例である。","a":true,"e":"正しい。通行人は対価を払わずに、庭の景観という利益を受けている。このように、市場の取引を通さずに他者に利益を与えることが外部経済である。"},{"t":"tf","s":"外部経済と外部不経済","imp":3,"q":"外部不経済が発生している財は、市場にまかせておくと、社会的に望ましい量よりも少なく生産されてしまう。","a":false,"e":"誤り。正しくは、社会的に望ましい量よりも多く生産される。汚染物質を出す企業は、被害という社会的な費用を負担せずに生産できるため、その分だけ費用が実際より安く見え、過剰に生産してしまう。逆に外部経済をもたらす財は、望ましい量より少なく生産されやすい。"},{"t":"ex","s":"外部経済と外部不経済","imp":3,"q":"外部不経済に対して政府がとる対策と、そのねらいを説明せよ。","a":"公害を出す企業は被害の費用を負担しないため、生産量が社会的に望ましい水準より多くなる。そこで政府は、汚染物質の排出規制などの直接規制や、排出量に応じて課税する環境税などによって、企業に社会的な費用を負担させる。これを外部不経済の内部化といい、生産量を適正な水準に近づけることをねらう。","e":"ポイント：①企業が社会的費用を負担せず過剰生産 ②排出規制などの直接規制 ③環境税などの課税 ④外部不経済の内部化"},{"t":"qa","s":"外部経済と外部不経済","imp":1,"q":"外部不経済をもたらしている企業に、課税などによってその社会的な費用を負担させ、市場での取引に反映させることを何というか。","a":"外部不経済の内部化","alt":["内部化","外部性の内部化"],"e":"環境税（炭素税）や排出量取引などが内部化の手段である。汚染者が汚染防止の費用を負担すべきだという汚染者負担の原則（PPP）にもとづく考え方である。"},{"t":"qa","s":"公共財","imp":3,"q":"道路・公園・国防・警察などのように、多くの人が同時に利用でき、対価を払わない人の利用を妨げることも難しいため、市場では十分に供給されにくい財・サービスを何というか。","a":"公共財","e":"公共財は非競合性と非排除性という二つの性質をもつ。民間企業では採算がとれないので、政府や地方公共団体が租税を財源として供給する。"},{"t":"qa","s":"公共財","imp":2,"q":"公共財の性質のうち、ある人が利用しても、他の人が利用できる量が減らないという性質を何というか。","a":"非競合性","e":"例えば、一人が国防の恩恵を受けても、他の人の受ける恩恵は減らない。これに対し、一個のパンは一人が食べれば他の人は食べられない（競合性がある）。"},{"t":"qa","s":"公共財","imp":2,"q":"公共財の性質のうち、対価を支払わない人を利用から締め出すことが難しいという性質を何というか。","a":"非排除性","e":"例えば、打ち上げ花火や灯台の光は、料金を払っていない人も見ることができる。非排除性があると、対価を払わずに利用する人が現れる。"},{"t":"qa","s":"公共財","imp":3,"q":"費用を負担せずに、公共財などから得られる便益だけを受ける人を何というか。","a":"フリーライダー","alt":["ただ乗り","ただ乗りする人"],"e":"「ただ乗り」の意味。非排除性があるとフリーライダーが生じるので、企業は対価を回収できず、公共財は市場では十分に供給されない。地球環境問題でも、対策の費用を負担しない国がフリーライダーとして問題になる。"},{"t":"ex","s":"公共財","imp":2,"q":"公共財が市場では十分に供給されない理由を、その性質にふれて説明せよ。","a":"公共財には、対価を払わない人の利用を妨げられない非排除性と、多くの人が同時に利用しても減らない非競合性がある。そのため、費用を負担せずに利用するフリーライダーが生じ、企業は代金を回収できず利潤が見込めないので、市場では十分に供給されない。そこで政府が租税を財源として供給する。","e":"ポイント：①非排除性 ②非競合性 ③フリーライダーが生じ対価を回収できない ④政府が租税を財源に供給"},{"t":"tf","s":"公共財","imp":2,"q":"一般道路や消防のサービスは、料金を払った人だけが利用できるように容易に制限できるため、民間企業が市場をつうじて十分に供給できる。","a":false,"e":"誤り。正しくは、一般道路や消防は、料金を払わない人の利用を妨げることが難しい（非排除性）ため、フリーライダーが生じ、民間企業では十分に供給されない。そのため政府や地方公共団体が租税を財源として供給している。"},{"t":"qa","s":"情報の非対称性","imp":3,"q":"商品の売り手と買い手など、取引をする当事者の間で、もっている情報の量や質に差があることを何というか。","a":"情報の非対称性","e":"例えば中古車の売り手は車の欠陥を知っていても、買い手は外見からはわからない。情報の非対称性は逆選択やモラルハザードを引き起こし、市場の失敗の原因となる。"},{"t":"qa","s":"情報の非対称性","imp":2,"q":"情報の非対称性のために、買い手が品質を見分けられず、質の悪い商品ばかりが市場に残って良い商品が出回らなくなる現象を何というか。","a":"逆選択","alt":["逆淘汰","アドバース・セレクション"],"e":"中古車市場が典型例である。保険でも、健康に不安がある人ほど加入しようとするため保険会社の支払いが増えて保険料が上がり、健康な人が加入しなくなるという形で逆選択が起こる。"},{"t":"qa","s":"情報の非対称性","imp":2,"q":"保険に加入した人が安心して事故や病気を防ぐ注意を怠るようになるなど、相手から行動が見えないために規律が緩み、望ましくない行動が起こることを何というか。","a":"モラルハザード","alt":["道徳的危険","倫理の欠如"],"e":"もとは保険の分野の用語。経営に失敗しても政府が救済してくれると考えた金融機関が危険な融資を行うような場合にも使われる。契約後の行動の問題である点が、契約前の情報の差から生じる逆選択との違いである。"},{"t":"mc","s":"情報の非対称性","imp":2,"q":"次の事例のうち、モラルハザードにあたるものとして最も適当なものを一つ選べ。","c":["自動車保険に加入した人が、事故を起こしても保険金が出るからと、運転に注意を払わなくなった。","中古車市場で、買い手が品質を見分けられないため、質の良い中古車が出回らなくなった。","健康に不安のある人ほど医療保険に加入しようとするため、保険会社の支払いが増えた。","人気のある新製品の発売日に、店の前に長い行列ができた。"],"a":0,"e":"保険加入後に、保険会社から行動が見えないことをいいことに注意を怠るのはモラルハザードである。中古車市場で良い車が出回らなくなることや、健康に不安がある人ほど保険に加入することは、契約前の情報の差から生じる逆選択の例である。発売日の行列は一時的な超過需要であり、情報の非対称性とは関係ない。"},{"t":"mc","s":"政府の役割","imp":2,"q":"市場の失敗と、それに対する政府の対策の組み合わせとして適当でないものを一つ選べ。","c":["独占・寡占：独占禁止法にもとづいて企業の競争制限行為を規制する。","外部不経済：環境税を導入したり、汚染物質の排出を規制したりする。","公共財の供給不足：租税を財源として政府が道路や公園を整備する。","情報の非対称性：企業が商品について情報を表示することを禁止する。"],"a":3,"e":"情報の非対称性への対策は、商品の表示を義務づけたり、品質の基準や認証制度を設けたりして、買い手に情報が伝わるようにすることである。表示を禁止すれば情報の差はかえって広がるので適当でない。他の三つは、市場の失敗に対する政府の対策として適当である。"},{"t":"qa","s":"寡占市場","imp":3,"q":"少数の企業が、ある財・サービスの市場の大部分を占めている状態を何というか。","a":"寡占","alt":["寡占市場"],"e":"一社だけが市場を支配している状態を独占という。日本ではビール、自動車、携帯電話サービスなど多くの市場が寡占の状態にある。寡占市場では価格競争が起こりにくい。"},{"t":"qa","s":"寡占市場","imp":3,"q":"寡占市場において、有力な企業が設定した価格に他の企業が追随することで形成される、需要と供給の関係を反映しにくい価格を何というか。","a":"管理価格","e":"価格決定の主導権をもつ有力企業をプライス・リーダー（価格先導者）という。管理価格は、生産費が下がっても下がりにくい（価格の下方硬直性）。"},{"t":"qa","s":"寡占市場","imp":2,"q":"寡占市場で価格決定の主導権をもち、その企業が決めた価格に他社が追随するような有力企業を何というか。","a":"プライス・リーダー","alt":["価格先導者","プライスリーダー"],"e":"プライス・リーダーが価格を引き上げると他社もそれに合わせて値上げする。企業どうしが価格を取り決めればカルテルとして独占禁止法違反になるが、プライス・リーダーへの追随は明確な取り決めがなくても起こる。"},{"t":"qa","s":"寡占市場","imp":3,"q":"寡占市場で、技術革新などによって生産費が下がっても、製品の価格が下がりにくくなる傾向を何というか。","a":"価格の下方硬直性","alt":["下方硬直性"],"e":"一社が値下げすると他社も追随して値下げ競争となり、共倒れになるおそれがあるため、各社が価格の引き下げを避けることから生じる。消費者は本来より高い価格で買うことになる。"},{"t":"qa","s":"寡占市場","imp":2,"q":"広告・宣伝、デザイン、品質、アフターサービスなど、価格以外の面で企業が行う競争を何というか。","a":"非価格競争","e":"寡占市場では価格競争が避けられ、非価格競争が中心となる。多額の広告宣伝費は最終的に商品の価格に上乗せされ、消費者の負担になるという指摘もある。"},{"t":"qa","s":"寡占市場","imp":1,"q":"企業が、ブランドやデザイン、機能などで自社の商品と他社の商品との違いを強調し、消費者に区別させようとすることを何というか。","a":"製品差別化","alt":["製品の差別化","差別化"],"e":"非価格競争の代表的な手段である。商品の違いが認められれば、多少価格が高くても買ってもらえるので、企業は価格競争を避けることができる。"},{"t":"tf","s":"寡占市場","imp":3,"q":"寡占市場では、企業どうしの激しい価格競争が起こりやすく、生産費が下がるとすぐに製品の価格が引き下げられる。","a":false,"e":"誤り。正しくは、寡占市場では値下げ競争による共倒れを避けるため価格競争が起こりにくく、生産費が下がっても価格が下がりにくい（価格の下方硬直性）。代わりに広告・宣伝や製品差別化などの非価格競争が盛んになる。"},{"t":"ex","s":"寡占市場","imp":3,"q":"寡占市場で価格の下方硬直性が生じる理由と、それが消費者に与える影響を説明せよ。","a":"寡占市場では、一社が値下げすると他社も追随して値下げ競争になり、各社が利益を失うおそれがある。そのため各社は価格競争を避け、プライス・リーダーが設定した管理価格に従うようになる。その結果、技術革新で生産費が下がっても価格は下がりにくく、消費者は本来より高い価格で買わされることになる。","e":"ポイント：①値下げ競争による共倒れの回避 ②プライス・リーダーと管理価格 ③生産費が下がっても価格が下がらない ④消費者の不利益（非価格競争が中心に）"},{"t":"mc","s":"寡占市場","imp":2,"q":"非価格競争の例として最も適当なものを一つ選べ。","c":["人気俳優を起用したテレビCMを流し、商品のブランドイメージを高める。","競合する店よりも1円でも安い価格で商品を販売する。","同業の他社と協定を結び、販売価格を同じ水準にそろえる。","原材料を安く仕入れて生産費を下げ、商品を値下げする。"],"a":0,"e":"広告・宣伝でブランドイメージを高めるのは、価格以外の面での競争（非価格競争）である。他店より安く売ることや、生産費を下げて値下げすることは価格競争にあたる。他社と価格をそろえる協定はカルテルであり、独占禁止法で禁止されている。"}]});</script>
<script>QDATA.push({"unit":"u15","questions":[{"t":"qa","s":"独占の形態","imp":3,"q":"同じ産業の複数の企業が、それぞれの独立性を保ったまま、価格や生産量、販売地域などについて協定を結ぶことを何というか。","a":"カルテル","alt":["企業連合"],"e":"企業連合ともいう。競争を避けて価格を高く維持するもので、日本では独占禁止法の「不当な取引制限」として原則禁止されている。公共工事の入札で事前に落札者を決める入札談合もカルテルの一種である。"},{"t":"qa","s":"独占の形態","imp":2,"q":"同じ産業の複数の企業が合併し、一つの企業となって市場への支配力を強めることを何というか。","a":"トラスト","alt":["企業合同"],"e":"企業合同ともいう。カルテルが独立性を保った企業どうしの協定であるのに対し、トラストは企業そのものが一体化する点が違う。競争を実質的に制限する合併は独占禁止法で規制される。"},{"t":"qa","s":"独占の形態","imp":2,"q":"持株会社などが中心となり、株式の保有などによって、さまざまな産業の企業を支配下に置く企業集団を何というか。","a":"コンツェルン","alt":["企業連携"],"e":"戦前の日本の財閥（三井・三菱・住友・安田など）は、持株会社を頂点とするコンツェルンの典型である。戦後、GHQの指令で財閥解体が行われた。"},{"t":"mc","s":"独占の形態","imp":2,"q":"独占の形態についての記述として最も適当なものを一つ選べ。","c":["カルテルは、同じ産業の企業が独立性を保ったまま、価格や生産量について協定を結ぶものである。","トラストは、異なる産業の企業が独立性を保ったまま、販売地域について協定を結ぶものである。","コンツェルンは、同じ産業の企業どうしが合併して、一つの企業となるものである。","戦前の日本の財閥は、同業の企業どうしが価格の協定を結んだカルテルの典型である。"],"a":0,"e":"カルテル（企業連合）の説明として正しい。トラスト（企業合同）は同じ産業の企業が合併して一つになるものなので誤り。合併して一つの企業になるのはトラストであり、コンツェルンは持株会社などが株式保有で多くの企業を支配する形態なので誤り。財閥はコンツェルンの典型なので誤り。"},{"t":"qa","s":"独占禁止法","imp":3,"q":"1947年に制定された、私的独占や不当な取引制限、不公正な取引方法を禁止して、公正で自由な競争を促進することを目的とする法律を何というか。","a":"独占禁止法","alt":["独禁法","私的独占の禁止及び公正取引の確保に関する法律"],"e":"正式名称は「私的独占の禁止及び公正取引の確保に関する法律」。戦後の経済民主化の一環として制定された。運用は公正取引委員会が担う。"},{"t":"qa","s":"独占禁止法","imp":3,"q":"独占禁止法を運用するために設けられ、違反した企業に排除措置命令や課徴金納付命令を出すことができる行政委員会を何というか。","a":"公正取引委員会","alt":["公取委","公取"],"e":"内閣府の外局として置かれる行政委員会で、委員長と委員は独立して職権を行う。「市場の番人」ともよばれる。"},{"t":"mc","s":"独占禁止法","imp":3,"q":"次の行為のうち、独占禁止法で「不当な取引制限」として禁止されているものとして最も適当なものを一つ選べ。","c":["同業の企業どうしが話し合い、製品の販売価格をそろって引き上げることを申し合わせた。","メーカーが小売店に対し、自社が指定した価格より安く売らないよう強制した。","ある企業が品質の優れた製品を開発し、市場で大きなシェアを獲得した。","ある企業が独自に開発した技術について、特許権を取得した。"],"a":0,"e":"同業者による価格の申し合わせはカルテルであり、「不当な取引制限」にあたる。メーカーが小売価格を守らせる行為（再販売価格の拘束）も禁止されているが、こちらは「不公正な取引方法」に分類される。優れた製品でシェアを得ることや特許の取得は正当な事業活動で、違法ではない。独占禁止法の三本柱は、私的独占・不当な取引制限・不公正な取引方法の禁止である。"},{"t":"tf","s":"独占禁止法","imp":2,"q":"公共工事の入札で、参加する企業が事前に話し合って落札する企業や価格を決める入札談合は、独占禁止法の不当な取引制限にあたり、禁止されている。","a":true,"e":"正しい。入札談合はカルテルの一種であり、競争によって決まるはずの落札価格をつり上げ、税金のむだづかいにつながる。発注する側の公務員が談合に関与することは、官製談合として別の法律でも規制されている。"},{"t":"qa","s":"独占禁止法","imp":3,"q":"他の株式会社の株式を保有してその事業活動を支配することを主な事業とする会社で、1997年の独占禁止法改正によって設立が解禁されたものを何というか。","a":"持株会社","alt":["純粋持株会社","ホールディングス","ホールディングカンパニー"],"e":"戦前の財閥が持株会社を通じて多くの企業を支配したことから、戦後は財閥の復活を防ぐために禁止されていた。解禁後は「〇〇ホールディングス」という名称の会社が数多く設立されている。"},{"t":"tf","s":"独占禁止法","imp":2,"q":"財閥の復活を防ぐため、持株会社の設立は現在も独占禁止法によって全面的に禁止されている。","a":false,"e":"誤り。正しくは、持株会社は1997年の独占禁止法改正で解禁された。ただし、事業支配力が過度に集中する持株会社の設立は、現在も禁止されている。"},{"t":"qa","s":"独占禁止法","imp":2,"q":"カルテルや入札談合に参加した企業が、自らの違反を公正取引委員会に申告すると、課徴金が減額または免除される制度を何というか。","a":"課徴金減免制度","alt":["リーニエンシー","リーニエンシー制度"],"e":"2005年の独占禁止法改正で導入された（2006年施行）。課徴金とは、違反行為をした企業に国庫への納付を命じる金銭である。"},{"t":"ex","s":"独占禁止法","imp":2,"q":"課徴金減免制度（リーニエンシー制度）のしくみと、そのねらいを説明せよ。","a":"カルテルや入札談合に参加した企業が、自らの違反を公正取引委員会に自主的に申告すると、申告の順番などに応じて課徴金が減額または免除される制度である。カルテルは密かに行われて発見が難しいため、企業に申告を促し、違反の発見と解明を容易にすることがねらいである。","e":"ポイント：①違反を自主的に申告 ②申告の順番などに応じて課徴金を減免 ③密かに行われるカルテルの発見を容易にする ④2005年改正で導入"},{"t":"qa","s":"独占禁止法","imp":2,"q":"メーカーが小売店に販売価格を指示して守らせることは原則として禁止されているが、書籍・雑誌・新聞・音楽用CDなどの著作物には例外的に認められている。この制度を何というか。","a":"再販売価格維持制度","alt":["再販制度","再販売価格維持"],"e":"メーカーが決めた価格（定価）で販売させることを再販売価格維持という。著作物は文化の普及の観点から例外とされている。書籍や新聞が全国どこでも同じ価格で売られているのはこのためである。"},{"t":"tf","s":"独占禁止法","imp":1,"q":"独占禁止法は私的独占を禁止しているが、企業どうしの合併については一切規制していない。","a":false,"e":"誤り。正しくは、独占禁止法は、一定の取引分野における競争を実質的に制限することとなる合併を禁止しており、一定規模以上の企業の合併には公正取引委員会への事前の届出が必要である。"},{"t":"ex","s":"独占禁止法","imp":3,"q":"独占禁止法の目的と、禁止している主な行為を説明せよ。","a":"公正で自由な競争を促進し、一般消費者の利益を確保するとともに、国民経済の健全な発達をはかることを目的とする。そのために、他の企業を排除・支配する私的独占、カルテルや入札談合などの不当な取引制限、不当廉売や再販売価格の拘束などの不公正な取引方法を禁止し、公正取引委員会が運用している。","e":"ポイント：①公正で自由な競争の促進 ②消費者の利益の確保 ③私的独占・不当な取引制限・不公正な取引方法の禁止 ④公正取引委員会が運用"},{"t":"tf","s":"独占禁止法","imp":1,"q":"公正取引委員会は、他から指揮監督を受けずに独立して職権を行う行政委員会であり、独占禁止法違反の疑いがある企業に立ち入り検査を行うことができる。","a":true,"e":"正しい。公正取引委員会は内閣府の外局に置かれた行政委員会で、委員長と委員は独立して職権を行う。違反の疑いがあれば立ち入り検査などの調査を行い、違反を認定すれば排除措置命令や課徴金納付命令を出す。"},{"t":"qa","s":"企業の種類","imp":2,"q":"民間の個人や団体が出資し、利潤の追求を目的として経営する企業を何というか。","a":"私企業","e":"私企業には、個人企業と、会社などの法人企業がある。これに対し、国や地方公共団体が出資・経営する企業を公企業、両者が共同で出資する企業を公私合同企業という。"},{"t":"qa","s":"企業の種類","imp":2,"q":"国や地方公共団体が出資・経営し、利潤の追求よりも公共の利益を目的として事業を行う企業を何というか。","a":"公企業","e":"地方公共団体が経営する水道事業や市営バスなどの地方公営企業がその例である。かつての三公社（国鉄・電電公社・専売公社）や郵政事業は民営化された。"},{"t":"qa","s":"企業の種類","imp":2,"q":"国や地方公共団体と民間企業とが共同で出資して設立する事業体を、第一（公）・第二（民）に対して何というか。","a":"第三セクター","e":"公私合同企業の一種で、地方の鉄道（旧国鉄の赤字路線を引き継いだものなど）や地域開発・観光施設などに多い。経営が悪化し、出資した地方公共団体の財政負担となった例もある。"},{"t":"tf","s":"企業の種類","imp":1,"q":"第三セクターとは、民間企業だけが出資して設立した、公共性の高い事業を行う企業のことである。","a":false,"e":"誤り。正しくは、第三セクターは国や地方公共団体と民間企業とが共同で出資して設立する事業体である。国・地方公共団体を第一セクター、民間を第二セクターとよぶことから、この名がある。"},{"t":"qa","s":"会社法と会社の種類","imp":3,"q":"2006年に施行され、有限会社の新設を廃止し、合同会社を新たに設け、最低資本金制度を撤廃するなど、会社制度を大きく改めた法律を何というか。","a":"会社法","e":"それまで商法などに分かれていた会社に関する規定をまとめて制定された。会社の種類は、株式会社・合名会社・合資会社・合同会社の4種類となった。"},{"t":"qa","s":"会社法と会社の種類","imp":2,"q":"会社法で新たに設けられた会社で、出資者全員が有限責任でありながら、利益の配分や会社の運営のルールを定款で自由に決められるものを何というか。","a":"合同会社","alt":["LLC"],"e":"アメリカのLLC（有限責任会社）をモデルにしている。少人数での起業や、大企業どうしの共同事業などに使われる。出資者が経営にも当たる点で、所有と経営が分離した株式会社とは異なる。"},{"t":"qa","s":"会社法と会社の種類","imp":3,"q":"会社が倒産するなどして債務を返済できないとき、出資者が出資した金額の範囲内でのみ責任を負うことを何というか。","a":"有限責任","e":"これに対し、出資額にかかわらず、自分の財産をなげうってでも会社の債務の全額を返済する責任を負うことを無限責任という。株式会社の株主は全員が有限責任である。"},{"t":"mc","s":"会社法と会社の種類","imp":3,"q":"会社の種類と、その出資者（社員）の責任の組み合わせとして最も適当なものを一つ選べ。","c":["株式会社：有限責任の株主のみで構成される。","合名会社：有限責任社員のみで構成される。","合資会社：無限責任社員のみで構成される。","合同会社：無限責任社員と有限責任社員とで構成される。"],"a":0,"e":"株式会社の株主は全員が有限責任である。合名会社は無限責任社員のみ、合資会社は無限責任社員と有限責任社員の両方、合同会社は有限責任社員のみで構成されるので、他の三つは誤り。名前の似た合名・合資・合同の違いは頻出のひっかけである。"},{"t":"tf","s":"会社法と会社の種類","imp":3,"q":"会社法の施行により最低資本金制度が撤廃され、資本金が1円でも株式会社を設立できるようになった。","a":true,"e":"正しい。かつて株式会社には1,000万円、有限会社には300万円の最低資本金が必要だったが、会社法で撤廃され、起業しやすくなった。"},{"t":"tf","s":"会社法と会社の種類","imp":2,"q":"会社法が施行された後も、新たに有限会社を設立することができる。","a":false,"e":"誤り。正しくは、会社法の施行により有限会社の新設はできなくなった。それまでにあった有限会社は、特例有限会社として「有限会社」の名称のまま存続することが認められている。"},{"t":"ex","s":"会社法と会社の種類","imp":2,"q":"無限責任と有限責任の違いを説明し、それぞれの会社の種類との関係を述べよ。","a":"無限責任とは、会社が債務を返済できないとき、出資者が自分の財産を使ってでも債務の全額を返済する責任を負うことであり、有限責任とは出資額の範囲内でのみ責任を負うことである。合名会社は無限責任社員のみ、合資会社は無限責任社員と有限責任社員、株式会社と合同会社は有限責任の出資者のみで構成される。","e":"ポイント：①無限責任＝債務の全額に責任 ②有限責任＝出資額の範囲内 ③合名＝無限のみ、合資＝無限と有限 ④株式会社・合同会社＝有限のみ"},{"t":"qa","s":"会社法と会社の種類","imp":1,"q":"会社法の施行前から存在していた有限会社が、会社法のもとで「有限会社」の名称のまま存続している場合、その会社を何というか。","a":"特例有限会社","e":"法律上は株式会社の一種として扱われるが、商号に「有限会社」を用いることが義務づけられている。新たに有限会社を設立することはできない。"}]});</script>
<script>QDATA.push({"unit":"u15","questions":[{"t":"qa","s":"株式会社のしくみ","imp":3,"q":"株主によって構成され、取締役の選任や定款の変更などを決定する、株式会社の最高意思決定機関を何というか。","a":"株主総会","e":"株主総会では、原則として1株につき1票の議決権が与えられる（1人1票ではない）。多くの株式を持つ大株主ほど大きな発言力をもつ。"},{"t":"qa","s":"株式会社のしくみ","imp":3,"q":"株主総会で選任された取締役で構成され、会社の業務執行に関する重要な意思決定を行う機関を何というか。","a":"取締役会","e":"取締役会は、業務を執行する代表取締役（社長など）を選定し、その職務を監督する。株主総会が会社の基本的な事項を決め、取締役会が経営の方針を決めるという役割分担がある。"},{"t":"ex","s":"株式会社のしくみ","imp":2,"q":"株式会社の主な機関である株主総会・取締役会・監査役の役割を説明せよ。","a":"株主総会は株主で構成される最高意思決定機関で、取締役や監査役の選任、定款の変更などを決める。取締役会は株主総会で選ばれた取締役で構成され、業務執行の意思決定を行い、代表取締役を選んでその職務を監督する。監査役は、取締役の職務の執行や会計が適正かどうかを監査する。","e":"ポイント：①株主総会＝最高意思決定機関（役員の選任など）②取締役会＝業務執行の意思決定と監督 ③監査役＝取締役の職務執行・会計の監査"},{"t":"qa","s":"株式会社のしくみ","imp":2,"q":"株式会社が得た利益の一部を、株主に対して保有する株式数に応じて分配するものを何というか。","a":"配当","alt":["配当金","株主配当"],"e":"配当は会社に利益が出たときに支払われるもので、利益が出なければ支払われないこともある（無配）。株主は配当のほか、株価の値上がりによる利益（キャピタル・ゲイン）を得ることもある。"},{"t":"qa","s":"株式会社のしくみ","imp":3,"q":"大規模な株式会社で、会社を所有する株主と、実際に会社を経営する専門の経営者とが分かれることを何というか。","a":"所有と経営の分離","alt":["資本と経営の分離"],"e":"資本と経営の分離ともいう。経営者が株主の利益より自分の利益を優先するおそれがあるため、経営を監視するコーポレート・ガバナンス（企業統治）が重要になる。"},{"t":"ex","s":"株式会社のしくみ","imp":3,"q":"株式会社で所有と経営の分離が進む理由を説明せよ。","a":"株式会社は多くの人から出資を集めることができるため、大企業になると株主が多数に分散し、一人ひとりの持株比率は小さくなる。多くの株主は配当や株価の値上がりに関心をもつだけで経営には直接かかわらなくなるため、経営は株主総会で選ばれた専門的な知識をもつ経営者に委ねられるようになる。","e":"ポイント：①株主の多数化・分散 ②株主の関心は配当や株価 ③専門の経営者（取締役）に経営を委ねる ④所有者（株主）と経営者が分かれる"},{"t":"tf","s":"株式会社のしくみ","imp":3,"q":"株主総会では、保有する株式の数にかかわらず、株主1人につき1票の議決権が与えられる。","a":false,"e":"誤り。正しくは、株主総会では原則として1株につき1票の議決権が与えられる（1株1議決権）。そのため、多くの株式を保有する大株主ほど会社の意思決定に大きな影響力をもつ。1人1票は協同組合などのしくみである。"},{"t":"mc","s":"株式会社のしくみ","imp":2,"q":"株式会社についての記述として適当でないものを一つ選べ。","c":["株主は有限責任であり、会社が倒産しても出資額を失う以上の責任は負わない。","証券取引所で株式を売買できるようにすることを上場という。","経営者が株主の利益に反する経営をしないよう、社外取締役を置くなどの工夫が行われている。","株主は、会社に利益が出なかった年でも、出資額に応じた一定の配当を受け取ることが保証されている。"],"a":3,"e":"配当は会社の利益から支払われるもので、利益が出なければ支払われないこともあるので、これが適当でない。株主の有限責任、上場の説明、社外取締役による経営の監視は、いずれも適当である。"},{"t":"qa","s":"株式会社のしくみ","imp":2,"q":"経営陣から独立した立場で経営を監視するため、その会社や取引先などと利害関係のない外部から選ばれる取締役を何というか。","a":"社外取締役","e":"コーポレート・ガバナンスを強化するために導入が進められ、2019年の会社法改正により、上場会社などには社外取締役を置くことが義務づけられた（2021年施行）。"},{"t":"qa","s":"企業の資金調達","imp":3,"q":"企業の資金のうち、株式の発行や内部留保などによって調達した、返済する必要のない資金を何というか。","a":"自己資本","e":"内部留保とは、利益のうち配当などに回さずに社内に蓄えたものである。これに対し、銀行からの借入や社債の発行によって調達した返済の必要がある資金を他人資本という。"},{"t":"ex","s":"企業の資金調達","imp":2,"q":"企業の資金調達における自己資本と他人資本の違いを、具体的な調達方法をあげて説明せよ。","a":"自己資本は、新株の発行や、利益を社内に蓄えた内部留保などによって調達する、返済の必要のない資金である。他人資本は、銀行からの借入や社債の発行などによって調達する資金で、期限までに利子をつけて返済しなければならない。自己資本の割合が高い企業ほど、財務が安定しているとされる。","e":"ポイント：①自己資本＝株式発行・内部留保、返済不要 ②他人資本＝借入・社債、返済が必要（利子つき）③自己資本比率が高いほど財務は安定"},{"t":"tf","s":"企業の資金調達","imp":3,"q":"企業が社債を発行して調達した資金は、株式と同じく返済の必要がないので、自己資本に含まれる。","a":false,"e":"誤り。正しくは、社債は企業が発行する債券であり、期限が来たら利子をつけて返済しなければならないので他人資本である。返済の必要がない自己資本にあたるのは、株式の発行や内部留保で調達した資金である。"},{"t":"mc","s":"企業の資金調達","imp":2,"q":"企業の資金調達の方法のうち、自己資本の調達にあたるものとして最も適当なものを一つ選べ。","c":["新たに株式を発行して、投資家から資金を集める。","銀行から融資を受けて、設備投資の資金とする。","社債を発行して、投資家から資金を集める。","取引先の企業から資金を借り入れる。"],"a":0,"e":"株式の発行で集めた資金は返済の必要がないので自己資本である。銀行からの融資、社債の発行、他社からの借入は、いずれも返済の必要がある他人資本である。なお、株式や社債の発行のように資金の出し手から直接資金を集める方法を直接金融、銀行を仲立ちとする方法を間接金融という。"},{"t":"qa","s":"企業の社会的責任","imp":3,"q":"企業が利潤を追求するだけでなく、環境保全や地域社会への貢献、消費者や従業員への配慮など、社会の一員として果たすべき責任を何というか。","a":"企業の社会的責任","alt":["CSR"],"e":"英語の頭文字からCSRという。法令を守ることはもちろん、環境への配慮、社会貢献、情報開示なども含まれる。企業は株主だけでなく、さまざまなステークホルダーに対して責任を負うと考えられている。"},{"t":"qa","s":"企業の社会的責任","imp":2,"q":"企業が法令や社内の規則、社会の規範などを守って活動することを何というか。","a":"コンプライアンス","alt":["法令遵守"],"e":"「法令遵守」と訳される。食品の産地偽装やデータ改ざんなどの企業の不祥事が相次いだことから重視されるようになった。"},{"t":"qa","s":"企業の社会的責任","imp":2,"q":"企業が、株主や投資家などに対して、経営内容や財務状況などの情報を公開することを何というか。","a":"ディスクロージャー","alt":["情報開示","情報公開"],"e":"「情報開示」と訳される。投資家が正しい判断をするための前提となり、経営の透明性を高めて不正を防ぐ役割もある。"},{"t":"tf","s":"企業の社会的責任","imp":2,"q":"企業のアカウンタビリティとは、企業が法令や社会規範を守って活動することをいう。","a":false,"e":"誤り。正しくは、アカウンタビリティは「説明責任」のことで、企業が株主などのステークホルダーに対して、経営活動の内容や結果を説明する責任をいう。法令や社会規範を守ることはコンプライアンス（法令遵守）である。"},{"t":"qa","s":"企業の社会的責任","imp":3,"q":"株主をはじめとする利害関係者が経営者を監視し、企業が不正なく適正に運営されるようにするしくみを何というか。","a":"コーポレート・ガバナンス","alt":["企業統治","コーポレートガバナンス"],"e":"「企業統治」と訳される。社外取締役の設置や情報開示の徹底、内部統制の整備などによって、経営者の独走や不祥事を防ぐ。所有と経営の分離が進んだ大企業でとくに重要となる。"},{"t":"qa","s":"企業の社会的責任","imp":2,"q":"株主・従業員・消費者・取引先・地域住民など、企業の活動に利害関係をもつ人々や団体を何というか。","a":"ステークホルダー","alt":["利害関係者"],"e":"「利害関係者」と訳される。企業は株主の利益だけでなく、さまざまなステークホルダーの利益に配慮して経営すべきだという考え方が、CSRの基礎にある。"},{"t":"mc","s":"企業の社会的責任","imp":1,"q":"企業の活動に関する用語とその説明の組み合わせとして最も適当なものを一つ選べ。","c":["メセナ：コンサートや美術展を主催・支援するなど、企業が芸術・文化活動を支援すること。","フィランソロピー：企業が経営内容や財務状況を株主や投資家に公開すること。","ディスクロージャー：企業が寄付やボランティアなどの慈善活動・社会貢献活動を行うこと。","コンプライアンス：企業が株主に対して利益の一部を分配すること。"],"a":0,"e":"メセナはフランス語で芸術・文化の支援を意味する。フィランソロピーは企業による慈善活動・社会貢献活動であり、情報の公開はディスクロージャーなので誤り。ディスクロージャーは情報開示であり、慈善活動はフィランソロピーなので誤り。コンプライアンスは法令遵守であり、利益の分配は配当なので誤り。"},{"t":"qa","s":"企業の社会的責任","imp":2,"q":"企業の財務情報だけでなく、環境・社会・企業統治への取り組みも考慮して投資先を選ぶ投資を何というか。","a":"ESG投資","e":"Eは環境（Environment）、Sは社会（Social）、Gは企業統治（Governance）を表す。気候変動対策や人権への配慮、不祥事を防ぐ体制などが評価される。SDGs（持続可能な開発目標）の広がりとともに拡大している。"},{"t":"tf","s":"企業の社会的責任","imp":1,"q":"企業の社会的責任（CSR）には、法令を守ることだけでなく、環境保全や地域社会への貢献、従業員が働きやすい職場づくりなども含まれる。","a":true,"e":"正しい。CSRは、法令遵守を最低限の責任としたうえで、環境・人権・地域社会・従業員などさまざまなステークホルダーへの配慮を求める考え方である。CSRに積極的な企業は社会から信頼され、長期的な企業価値も高まると考えられている。"},{"t":"ex","s":"企業の社会的責任","imp":2,"q":"コーポレート・ガバナンス（企業統治）が重視されるようになった理由と、その具体的な方法を説明せよ。","a":"所有と経営が分離した大企業では、経営者が株主の利益より自分の利益を優先したり、不祥事を隠したりするおそれがある。実際に企業の不祥事も相次いだ。そこで、社外取締役を置いて経営を監視したり、ディスクロージャー（情報開示）を徹底したりして、企業が適正に運営されるようにするしくみが重視されている。","e":"ポイント：①所有と経営の分離による経営者の独走のおそれ ②企業の不祥事 ③社外取締役による監視 ④ディスクロージャーの徹底"},{"t":"qa","s":"現代の企業の動き","imp":3,"q":"企業が他の企業を合併したり買収したりすることを、英語の略称で何というか。","a":"M&A","alt":["合併・買収","エムアンドエー"],"e":"Merger（合併）and Acquisition（買収）の略。新しい事業分野への進出や規模の拡大を短期間で実現できる。株式を買い集めて経営権を握る買収には、相手企業の経営陣の同意を得ない敵対的買収もある。"},{"t":"qa","s":"現代の企業の動き","imp":1,"q":"M&Aなどによって、互いに関連のない多くの業種の企業を傘下に収め、多角的な経営を行う巨大企業を何というか。","a":"コングロマリット","alt":["複合企業"],"e":"「複合企業」と訳される。一つの業種の業績が悪くなっても他の業種で補えるので、経営の危険を分散できる。同じ業種の企業どうしの合併（トラスト）とは区別する。"},{"t":"qa","s":"現代の企業の動き","imp":2,"q":"複数の国に子会社や工場などの拠点をもち、世界的な規模で生産や販売を行う企業を何というか。","a":"多国籍企業","e":"人件費の安い国での生産や、現地市場での販売などを目的に海外へ進出する。巨大な多国籍企業の中には売上高が中小国のGDPを上回るものもあり、税率の低い国を利用した課税逃れ（租税回避）も国際的な問題となっている。"},{"t":"qa","s":"現代の企業の動き","imp":1,"q":"新しい技術やアイデアをもとに、大企業が手がけていない分野で新しい事業を起こす中小規模の企業を何というか。","a":"ベンチャー企業","alt":["ベンチャー","ベンチャー・ビジネス","ベンチャービジネス","スタートアップ"],"e":"スタートアップともいう。成長が見込まれるベンチャー企業には、ベンチャー・キャピタルとよばれる投資会社が株式の取得を通じて資金を提供する。起業を促すことは経済の活性化やイノベーションにつながる。"},{"t":"tf","s":"現代の企業の動き","imp":1,"q":"ベンチャー企業の中には、独自の技術やアイデアによって急成長し、証券取引所に株式を上場するものもある。","a":true,"e":"正しい。日本では新興企業向けの株式市場（東京証券取引所のグロース市場など）が設けられており、成長途上のベンチャー企業でも上場して広く資金を集めることができる。"}]});</script>
<script>QDATA.push({"unit":"u16","questions":[{"t":"qa","s":"ストックとフロー","imp":3,"q":"国内総生産（GDP）や国民所得のように、一定期間（1年間など）に生み出された経済量を何というか。","a":"フロー","e":"フローは「流れ」、ストックは「蓄え」と覚える。ある期間のフローが積み重なってストックになる。風呂にたとえると、蛇口から流れ込む水の量がフロー、たまっている水の量がストックである。"},{"t":"qa","s":"ストックとフロー","imp":3,"q":"国富のように、ある一時点において蓄積されている経済量を何というか。","a":"ストック","e":"ストックの例には国富のほか、預金残高や国債残高などがある。GDPや所得、消費などの「1年間に〜」と数えるものはフローである。"},{"t":"qa","s":"ストックとフロー","imp":3,"q":"ある時点で一国が保有する、住宅・建物・機械・土地などの実物資産（非金融資産）と対外純資産の合計を何というか。","a":"国富","e":"国富は一国の豊かさをストックの面から示す。国内の金融資産は、ある人の資産が別の人の負債となって相殺されるので国富には含まれず、外国に対する資産と負債の差額である対外純資産だけが加えられる。"},{"t":"tf","s":"ストックとフロー","imp":2,"q":"国富には、国民が保有する預金や株式などの国内の金融資産がすべて含まれる。","a":false,"e":"誤り。正しくは、国内の金融資産は、預金者の資産が銀行の負債になるように、資産と負債が国内で相殺されるため国富には含まれない。国富は、実物資産（住宅・建物・機械・土地など）と対外純資産の合計である。"},{"t":"mc","s":"ストックとフロー","imp":1,"q":"次のうち、フローにあたるものとして最も適当なものを一つ選べ。","c":["ある年の国内総生産（GDP）","ある年の年末時点での国富","ある時点での個人の預金残高","ある年度末時点での国債の発行残高"],"a":0,"e":"GDPは1年間など一定期間に生み出された付加価値の量なのでフローである。国富・預金残高・国債残高は、いずれもある時点に蓄積されている量なのでストックである。「残高」「〜時点」という言葉はストックの目印になる。"},{"t":"qa","s":"GDPと付加価値","imp":3,"q":"一定期間に国内で新たに生産された付加価値の合計を何というか。","a":"国内総生産","alt":["GDP"],"e":"GDPは、国内の総生産額から原材料などの中間生産物の額を差し引いて求める。国内で生産されたものであれば、外国企業の工場で生産されたものも含まれる。一国の経済規模を示す代表的な指標である。"},{"t":"qa","s":"GDPと付加価値","imp":3,"q":"企業などが生産した財・サービスの生産額から、原材料や燃料などの費用を差し引いた、新たに生み出された価値を何というか。","a":"付加価値","e":"付加価値は、その生産に関わった人々の賃金や企業の利潤などとして分配される。国内のすべての付加価値を合計したものがGDPである。"},{"t":"qa","s":"GDPと付加価値","imp":2,"q":"小麦粉の原料となる小麦のように、他の財やサービスの生産のために原材料や燃料として使われる財を何というか。","a":"中間生産物","alt":["中間財","中間投入物"],"e":"消費者が最終的に使う財・サービスを最終生産物という。GDPを計算するときは、中間生産物の価値を差し引かないと同じ価値を何度も数えてしまう（二重計算）。"},{"t":"mc","s":"GDPと付加価値","imp":3,"q":"ある国では、農家が小麦を100億円で製粉会社に売り、製粉会社はそれを小麦粉にして150億円でパン工場に売り、パン工場はパンを作って消費者に250億円で売った。この国ではほかに生産活動はなく、農家の原材料費は0とする。この国のGDPとして最も適当なものを一つ選べ。","c":["150億円","250億円","400億円","500億円"],"a":1,"e":"各段階の付加価値は、農家100億円、製粉会社150－100＝50億円、パン工場250－150＝100億円で、合計250億円がGDPである。これは最終生産物であるパンの価格と一致する。『500億円』は各段階の売上高を単純に合計して中間生産物を二重に数えた誤り。『400億円』は製粉会社とパン工場の売上高の合計、『150億円』は製粉会社とパン工場の付加価値だけを足した誤りである。"},{"t":"ex","s":"GDPと付加価値","imp":3,"q":"GDPを計算するときに、総生産額から中間生産物の額を差し引く理由を説明せよ。","a":"中間生産物の価値は、それを原材料として作られた次の段階の製品の価格の中にすでに含まれている。そのため、各段階の生産額を単純に合計すると、同じ価値を何度も数える二重計算になってしまう。そこで総生産額から中間生産物の額を差し引き、新たに生み出された付加価値だけを合計する。","e":"ポイント：①中間生産物の価値は次の段階の製品価格に含まれる ②単純に合計すると二重計算になる ③付加価値だけを合計する"},{"t":"tf","s":"GDPと付加価値","imp":3,"q":"日本の企業が海外の工場で生産した製品の価値は、日本の国内総生産（GDP）に含まれる。","a":false,"e":"誤り。正しくは、海外の工場での生産は、生産が行われた国のGDPに含まれる。GDPは「国内」での生産を数えるからである。その工場の利益のうち日本の親会社が受け取る分などは、海外からの所得として日本の国民総所得（GNI）に含まれる。"},{"t":"ex","s":"GDPと付加価値","imp":2,"q":"国内総生産（GDP）と国民総生産（GNP）の違いを説明せよ。","a":"GDPは、国籍に関係なく、一定期間に国内で生産された付加価値の合計である。GNPは、その国の国民（居住者）が国内外で生産した付加価値の合計で、GDPに海外からの所得を加え、海外への所得を差し引いて求める。現在はGNPに代わって、所得の面からとらえた国民総所得（GNI）が用いられる。","e":"ポイント：①GDP＝国内での生産（外国企業の国内生産も含む）②GNP＝国民（居住者）の国内外での生産 ③GNP＝GDP＋海外からの所得－海外への所得 ④現在はGNIを使う"},{"t":"qa","s":"国民所得の諸概念","imp":3,"q":"国内総生産（GDP）に、海外からの所得を加え、海外への所得を差し引いたものを、所得の面からとらえて何というか。","a":"国民総所得","alt":["GNI"],"e":"かつての国民総生産（GNP）と同じ大きさで、現在の統計ではGNPに代わってGNIが用いられる。ここでいう「国民」は国籍ではなく、その国に住む居住者を意味する。"},{"t":"qa","s":"国民所得の諸概念","imp":2,"q":"国民総生産（GNP）から固定資本減耗を差し引いたものを何というか。","a":"国民純生産","alt":["NNP"],"e":"GNPには、生産のために機械や建物がすり減った分（固定資本減耗）も含まれているので、それを差し引いて純粋に新しく生み出された価値を示すのがNNPである。"},{"t":"qa","s":"国民所得の諸概念","imp":2,"q":"機械や建物などの生産設備が、生産に使用されることで消耗し、その価値が減少した分を何というか。","a":"固定資本減耗","alt":["減価償却費","減価償却"],"e":"企業の会計では減価償却費にあたる。GNPからこれを差し引くとNNP（国民純生産）になる。「総（グロス）」は固定資本減耗を含み、「純（ネット）」は含まない、と覚える。"},{"t":"qa","s":"国民所得の諸概念","imp":2,"q":"国民純生産（NNP）から間接税を差し引き、補助金を加えて求める、生産要素の提供者が受け取った所得の合計を何というか。","a":"国民所得","alt":["NI"],"e":"狭い意味の国民所得（NI）で、賃金・利子・地代・利潤などの合計にあたる。NI＝NNP－（間接税－補助金）。GDP→GNI（GNP）→NNP→NIと順に求める流れをおさえる。"},{"t":"mc","s":"国民所得の諸概念","imp":3,"q":"ある国の国民総生産（GNP）が600兆円、固定資本減耗が100兆円、間接税が60兆円、補助金が10兆円であるとき、国民所得（NI）として最も適当なものを一つ選べ。","c":["430兆円","450兆円","500兆円","550兆円"],"a":1,"e":"NNP＝GNP－固定資本減耗＝600－100＝500兆円。NI＝NNP－間接税＋補助金＝500－60＋10＝450兆円である。『500兆円』はNNPで止めた誤り、『430兆円』は補助金も差し引いた誤り、『550兆円』は固定資本減耗を差し引き忘れた誤りである。"},{"t":"mc","s":"国民所得の諸概念","imp":2,"q":"ある国の国内総生産（GDP）が500兆円、海外からの所得が30兆円、海外への所得が10兆円であるとき、国民総所得（GNI）として最も適当なものを一つ選べ。","c":["480兆円","520兆円","530兆円","540兆円"],"a":1,"e":"GNI＝GDP＋海外からの所得－海外への所得＝500＋30－10＝520兆円である。海外からの純所得（30－10＝20兆円）を加えると考えてもよい。『540兆円』は海外への所得まで加えた誤り、『530兆円』は海外への所得を差し引き忘れた誤り、『480兆円』は加減を逆にした誤りである。"},{"t":"ex","s":"国民所得の諸概念","imp":1,"q":"国民純生産（NNP）から国民所得（NI）を求めるとき、間接税を差し引き、補助金を加える理由を説明せよ。","a":"NNPは市場価格で計算されており、市場価格には消費税などの間接税が上乗せされているが、間接税の分は政府に納められ、生産要素を提供した人の所得にはならないので差し引く。反対に、補助金は市場価格を引き下げているが生産者の所得になっているので加える。こうして生産要素の所得の合計としての国民所得が求められる。","e":"ポイント：①NNPは市場価格表示 ②間接税は価格に上乗せされるが所得にならない→差し引く ③補助金は価格を下げるが所得になる→加える ④生産要素の所得の合計がNI"},{"t":"tf","s":"国民所得の諸概念","imp":1,"q":"国民所得（NI）は、国民純生産（NNP）に間接税を加え、補助金を差し引いて求める。","a":false,"e":"誤り。正しくは、NNPから間接税を差し引き、補助金を加えて求める（NI＝NNP－間接税＋補助金）。間接税は価格に上乗せされているが所得にならず、補助金は価格を下げているが所得になるからである。加減の向きの逆転はよくあるひっかけである。"},{"t":"qa","s":"三面等価の原則","imp":3,"q":"国民所得を生産・分配・支出の三つの面からとらえると、それぞれの額が理論上等しくなるという原則を何というか。","a":"三面等価の原則","alt":["三面等価"],"e":"生産国民所得＝分配国民所得＝支出国民所得となる。生産された付加価値は誰かの所得として分配され、その所得は消費や投資として支出されるからである。"},{"t":"mc","s":"三面等価の原則","imp":2,"q":"分配面から見た国民所得（分配国民所得）を構成するものの組み合わせとして最も適当なものを一つ選べ。","c":["雇用者報酬・財産所得・企業所得","民間最終消費支出・政府最終消費支出・総固定資本形成","第一次産業・第二次産業・第三次産業の生産額","租税・社会保険料・公債金"],"a":0,"e":"分配国民所得は、賃金などの雇用者報酬、利子・配当・地代などの財産所得、企業の利潤などの企業所得からなる。消費支出や総固定資本形成（投資）は支出面、産業別の生産額は生産面の内訳である。租税・社会保険料・公債金は財政の収入にかかわる項目であり、国民所得の三面の内訳ではない。"},{"t":"tf","s":"三面等価の原則","imp":2,"q":"支出面から見た日本の国内総生産（国内総支出）のうち、最も大きな割合を占めるのは民間最終消費支出（家計の消費）である。","a":true,"e":"正しい。日本では民間最終消費支出が国内総支出の5割以上を占める。そのため、家計の消費が伸びるかどうかが景気に大きく影響する。ほかに政府最終消費支出、総固定資本形成（企業の設備投資・住宅投資・公共投資）、在庫変動、輸出－輸入がある。"},{"t":"ex","s":"三面等価の原則","imp":2,"q":"三面等価の原則が成り立つ理由を説明せよ。","a":"生産された付加価値は、賃金・利子・地代・利潤などとして、生産に関わった人々の所得に分配される。分配された所得は、消費や投資として支出される。生産されたが売れ残った商品も、企業が在庫として買ったものとみなして支出（在庫投資）に含めるので、生産・分配・支出の額は等しくなる。","e":"ポイント：①生産された付加価値は所得として分配 ②所得は消費・投資として支出 ③売れ残りは在庫投資として支出に計上 ④三つの面の額が一致"},{"t":"mc","s":"GDPに含まれないもの","imp":3,"q":"国内総生産（GDP）に計上されるものとして最も適当なものを一つ選べ。","c":["農家が自分で生産した米のうち、自家で消費した分","家族が家庭内で行った料理や掃除などの家事労働","地域の清掃などの無償のボランティア活動","個人が中古の自動車を売却して得た代金"],"a":0,"e":"農家の自家消費は、市場で取引されていなくても生産として計上される例外である。家事労働やボランティアは市場で取引されず価格がつかないので計上されない。中古品は生産されたときにすでに計上されているので、その売買代金は計上されない（ただし中古品販売業者の手数料などは新たなサービスとして計上される）。"},{"t":"tf","s":"GDPに含まれないもの","imp":2,"q":"持ち家に住んでいる人も家賃を支払っているとみなして、その家賃に相当する額がGDPに計上される。","a":true,"e":"正しい。これを帰属家賃という。借家に住む人の家賃はGDPに含まれるのに持ち家では含まれないと、持ち家の割合が変わるだけでGDPが変化してしまうため、持ち家も住宅サービスを生産・消費しているとみなす。農家の自家消費とともに、市場で取引されないのに計上される例外である。"},{"t":"tf","s":"GDPに含まれないもの","imp":3,"q":"株式や土地の値上がりによって得た売買益は、新たな価値を生み出したものとしてGDPに含まれる。","a":false,"e":"誤り。正しくは、株式や土地の売買は、すでにある資産の持ち主が変わっただけで新たな付加価値は生まれていないので、その売買益（キャピタル・ゲイン）はGDPに含まれない。ただし、売買を仲介した証券会社や不動産業者の手数料は、サービスの生産としてGDPに含まれる。"},{"t":"ex","s":"GDPに含まれないもの","imp":2,"q":"家事労働がGDPに含まれない理由と、そこから見えるGDPの限界を説明せよ。","a":"家事労働は市場で取引されず価格がつかないため、生産額を計測できずGDPには含まれない。しかし同じ料理や掃除でも、外食や家事代行サービスを利用すればGDPに計上される。このように、GDPは市場で取引されたものしか数えないため、人々の生活の豊かさや生活の質を正確には表せないという限界がある。","e":"ポイント：①市場で取引されず価格がつかない ②外食・家事代行なら計上される ③GDPは豊かさを正確に表さない（余暇や環境なども反映しない）"},{"t":"qa","s":"豊かさの指標","imp":2,"q":"国民総生産などから公害や環境破壊など福祉にマイナスとなる要素を差し引き、余暇や家事労働などの市場で取引されないプラスの要素を加えて算出した指標を何というか。","a":"国民純福祉","alt":["NNW"],"e":"NNWは1970年代に日本で試算された。経済成長の陰で公害が深刻化したことを背景に、GDPやGNPだけでは本当の豊かさを測れないという問題意識から生まれた指標である。"},{"t":"qa","s":"豊かさの指標","imp":1,"q":"国内総生産（GDP）から、環境の悪化や天然資源の減少による損失を差し引いて算出する指標を何というか。","a":"グリーンGDP","alt":["グリーンGNP","環境調整済国内純生産","EDP"],"e":"経済成長によって環境が損なわれてもGDPは減らず、公害対策の支出によってむしろ増えることもある。そこで環境への影響を考慮した指標として考えられた。"},{"t":"qa","s":"豊かさの指標","imp":2,"q":"ヒマラヤ山脈にある国ブータンが提唱した、経済的な豊かさよりも国民の幸福や精神的な充足を重視する指標を何というか。","a":"国民総幸福量","alt":["GNH","国民総幸福"],"e":"GNHは、心理的な幸福、健康、教育、文化、環境、良い統治などの分野から幸福を測ろうとする。GDPに代わる豊かさの考え方として注目されている。人間開発指数（HDI）は別の単元で学ぶ。"},{"t":"tf","s":"豊かさの指標","imp":1,"q":"GDPが増加すれば、国民の生活の豊かさや幸福度も必ず高まる。","a":false,"e":"誤り。正しくは、GDPが増えても豊かさや幸福度が高まるとは限らない。GDPは市場で取引された財・サービスの付加価値を数えたもので、余暇の増減や環境の悪化、所得の格差などは反映せず、公害の被害の処理費用などでも増える。そのためNNWやグリーンGDP、GNHなど、GDPを補う指標が考えられている。"}]});</script>
<script>QDATA.push({"unit":"u16","questions":[{"t":"qa","s":"名目と実質","imp":3,"q":"その年の市場価格をそのまま用いて計算した、物価の変動を含んだGDPを何というか。","a":"名目GDP","alt":["名目国内総生産"],"e":"物価が上がれば、生産量が変わらなくても名目GDPは増える。そのため、生産の実際の増減を見るには、物価変動の影響を取り除いた実質GDPを用いる。"},{"t":"qa","s":"名目と実質","imp":3,"q":"名目GDPから物価変動の影響を取り除き、基準年の価格で計算し直したGDPを何というか。","a":"実質GDP","alt":["実質国内総生産"],"e":"実質GDP＝名目GDP÷GDPデフレーター×100で求める。GDPデフレーターは、基準年を100として物価の水準を示す指数である。"},{"t":"mc","s":"名目と実質","imp":2,"q":"ある年の名目GDPが550兆円で、GDPデフレーター（基準年＝100）が110であったとき、この年の実質GDPとして最も適当なものを一つ選べ。","c":["440兆円","500兆円","550兆円","605兆円"],"a":1,"e":"GDPデフレーターは名目GDPを実質GDPに換算するための物価指数で、実質GDP＝名目GDP÷GDPデフレーター×100＝550÷110×100＝500兆円となる。デフレーター110は基準年より物価が10％高いことを示すので、物価上昇分を取り除くと実質GDPは名目より小さくなる。『605兆円』は1.1を掛けてしまった誤りである。"},{"t":"mc","s":"名目と実質","imp":3,"q":"ある国の名目GDPは、前年が500兆円、今年が510兆円であった。GDPデフレーターは前年が100、今年が102であった。今年の実質経済成長率として最も適当なものを一つ選べ。","c":["0％","2％","4％","－2％"],"a":0,"e":"今年の実質GDPは510÷102×100＝500兆円で、前年の実質GDP500兆円と同じなので、実質経済成長率は0％である。名目経済成長率は（510－500）÷500×100＝2％だが、これは物価が2％上がった分だけであり、生産量は増えていない。経済成長率は（今年のGDP－前年のGDP）÷前年のGDP×100で求める。"},{"t":"tf","s":"名目と実質","imp":2,"q":"名目経済成長率がプラスであれば、実質経済成長率も必ずプラスになる。","a":false,"e":"誤り。正しくは、物価の上昇率が名目経済成長率を上回れば、実質経済成長率はマイナスになる。例えば名目成長率が2％でも物価が3％上がっていれば、実質成長率はおよそ－1％となる。実質経済成長率は、おおよそ名目経済成長率から物価上昇率を差し引いた値になる。"},{"t":"ex","s":"名目と実質","imp":2,"q":"名目経済成長率と実質経済成長率の違いを説明せよ。","a":"名目経済成長率は、その年の価格で計算した名目GDPの増加率であり、物価の変動を含んでいる。実質経済成長率は、物価変動の影響を取り除いた実質GDPの増加率であり、生産量の実際の増減を示す。物価が上昇しているときは名目が実質を上回り、物価が下落しているときは実質が名目を上回る。","e":"ポイント：①名目は物価変動を含む ②実質は物価変動を取り除く（実際の生産量の変化）③インフレ時は名目＞実質、デフレ時は名目＜実質"},{"t":"tf","s":"名目と実質","imp":1,"q":"物価が下落するデフレーションの時期には、名目経済成長率が実質経済成長率を下回ることがある。","a":true,"e":"正しい。物価が下がると、生産量が増えていても価格の低下によって名目GDPは伸びにくくなるため、名目成長率が実質成長率を下回る。これを名目と実質の逆転（名実逆転）といい、デフレが続いた1990年代後半以降の日本でしばしば見られた。"},{"t":"ex","s":"経済成長の要因","imp":2,"q":"経済成長をもたらす主な要因を説明せよ。","a":"経済成長は、生産に必要な要素が増えたり、その効率が高まったりすることで実現する。主な要因は、設備投資による資本の蓄積、労働力人口の増加や教育による労働の質の向上、技術進歩（イノベーション）による生産性の向上である。少子高齢化で労働力が減る日本では、技術進歩などによって生産性を高めることがとくに重要になる。","e":"ポイント：①資本の蓄積（設備投資）②労働力の増加・質の向上 ③技術進歩による生産性の向上 ④日本では労働力減少のため生産性の向上が重要"},{"t":"qa","s":"景気変動","imp":2,"q":"資本主義経済において、経済活動が好況・後退・不況・回復の四つの局面を周期的に繰り返すことを何というか。","a":"景気変動","alt":["景気循環"],"e":"景気循環ともいう。後退が急激に起こり、企業の倒産や失業が激増する状態を恐慌という。政府や中央銀行は、財政政策や金融政策によって景気変動の幅を小さくしようとする。"},{"t":"mc","s":"景気変動","imp":2,"q":"景気の局面についての記述として最も適当なものを一つ選べ。","c":["好況期には生産や雇用が拡大し、物価は上昇する傾向がある。","不況期には商品の在庫が減少し、物価は上昇する傾向がある。","後退期には企業の倒産が減少し、失業者も減少する。","回復期には生産が縮小し、失業者が増加していく。"],"a":0,"e":"好況期には需要が大きく、生産・雇用・所得が拡大し、物価は上昇しやすい。不況期には売れ残りで在庫が増え、物価は下落しやすいので二つ目は誤り。後退期には倒産や失業者が増えるので三つ目は誤り。回復期には生産が増え、雇用も改善していくので四つ目は誤り。"},{"t":"qa","s":"景気変動","imp":2,"q":"約40か月を周期とする短期の景気の波で、企業の在庫投資の変動が主な原因とされるものを何というか。","a":"キチンの波","alt":["キチン循環","キチンサイクル"],"e":"短期波動ともいう。周期が短い順に、キチン（約40か月・在庫投資）、ジュグラー（約10年・設備投資）、クズネッツ（約20年・建設投資）、コンドラチェフ（約50年・技術革新）と覚える。"},{"t":"qa","s":"景気変動","imp":3,"q":"約10年を周期とする中期の景気の波で、企業の設備投資の変動が主な原因とされるものを何というか。","a":"ジュグラーの波","alt":["ジュグラー循環","ジュグラーサイクル"],"e":"中期波動ともいい、主循環ともよばれる。機械設備の耐用年数がおよそ10年であることから、設備の更新投資の時期が集中することで生じると説明される。"},{"t":"tf","s":"景気変動","imp":1,"q":"クズネッツの波は約20年を周期とする景気の波で、住宅やビルなどの建て替えにともなう建設投資の変動が主な原因とされる。","a":true,"e":"正しい。建築物の建て替えの周期がおよそ20年であることから、建設投資の波が生まれると説明される。アメリカの経済学者クズネッツが見いだした。"},{"t":"qa","s":"景気変動","imp":2,"q":"約50年を周期とする長期の景気の波で、技術革新などが主な原因とされるものを何というか。","a":"コンドラチェフの波","alt":["コンドラチェフ循環","コンドラチェフサイクル"],"e":"長期波動ともいう。ソ連の経済学者コンドラチェフが見いだし、シュンペーターは、蒸気機関・鉄道・電気・自動車などの大きな技術革新（イノベーション）が原因だと説明した。"},{"t":"mc","s":"景気変動","imp":3,"q":"景気の波とその主な原因の組み合わせとして最も適当なものを一つ選べ。","c":["ジュグラーの波：設備投資の変動","キチンの波：技術革新","クズネッツの波：在庫投資の変動","コンドラチェフの波：建設投資の変動"],"a":0,"e":"ジュグラーの波（約10年）の主な原因は設備投資の変動である。キチンの波（約40か月）は在庫投資、クズネッツの波（約20年）は建設投資、コンドラチェフの波（約50年）は技術革新が主な原因なので、他の三つは誤りである。"},{"t":"qa","s":"物価と物価指数","imp":3,"q":"家計が購入する商品やサービスの価格の動きを、基準年を100として示した指数で、総務省が作成するものを何というか。","a":"消費者物価指数","alt":["CPI"],"e":"日常生活に関わる物価の動きを示し、年金額の改定や金融政策の判断などにも使われる。日本銀行は、消費者物価の前年比上昇率2％を「物価安定の目標」としている。"},{"t":"qa","s":"物価と物価指数","imp":2,"q":"企業どうしの間で取引される原材料や製品などの価格の動きを示す指数で、日本銀行が作成するものを何というか。","a":"企業物価指数","alt":["CGPI"],"e":"かつては卸売物価指数とよばれた。原油などの原材料価格の変動は、まず企業物価指数に表れ、その後に消費者物価指数に波及することが多い。"},{"t":"tf","s":"物価と物価指数","imp":1,"q":"消費者物価指数は日本銀行が作成し、企業物価指数は総務省が作成している。","a":false,"e":"誤り。正しくは、消費者物価指数は総務省、企業物価指数は日本銀行が作成している。作成する機関の入れ替えはひっかけになりやすい。"},{"t":"qa","s":"インフレーション","imp":2,"q":"物価が持続的に上昇し、貨幣の価値が下がっていく現象を何というか。","a":"インフレーション","alt":["インフレ"],"e":"物価が上がると、同じ金額で買える商品の量が減るので、貨幣の価値（購買力）は下がる。逆に物価が持続的に下落する現象をデフレーションという。"},{"t":"qa","s":"インフレーション","imp":3,"q":"好景気による消費の増加や財政支出の拡大などで、需要が供給を上回ることによって起こるインフレーションを何というか。","a":"ディマンド・プル・インフレーション","alt":["ディマンド・プル・インフレ","ディマンドプル・インフレ","需要インフレ"],"e":"需要（demand）が物価を引っ張り（pull）上げるという意味。高度経済成長期や、過熱した好景気のときに起こりやすい。"},{"t":"qa","s":"インフレーション","imp":3,"q":"原材料費や賃金などの生産費用の上昇が、製品価格に転嫁されることによって起こるインフレーションを何というか。","a":"コスト・プッシュ・インフレーション","alt":["コスト・プッシュ・インフレ","コストプッシュ・インフレ","費用インフレ"],"e":"費用（cost）が物価を押し（push）上げるという意味。1970年代の石油危機による原油価格の高騰が典型例で、不況下でも物価が上がるスタグフレーションの原因となった。"},{"t":"mc","s":"インフレーション","imp":2,"q":"次の事例のうち、コスト・プッシュ・インフレーションにあたるものとして最も適当なものを一つ選べ。","c":["原油価格の高騰で輸送費や電気料金が上がり、さまざまな商品が値上がりした。","好景気で消費者の購買意欲が高まり、品不足になって商品が値上がりした。","政府が大規模な公共事業を行って需要が拡大し、物価が上昇した。","技術革新によって生産費用が下がり、多くの製品の価格が下落した。"],"a":0,"e":"原油高による費用の上昇が価格に転嫁されるのはコスト・プッシュ・インフレである。購買意欲の高まりや公共事業による需要拡大で物価が上がるのは、需要が供給を上回るディマンド・プル・インフレである。生産費用の低下による値下がりはインフレではない。"},{"t":"qa","s":"インフレーション","imp":1,"q":"短期間に物価が数十倍、数百倍以上に跳ね上がるような、極めて激しいインフレーションを何というか。","a":"ハイパーインフレーション","alt":["ハイパーインフレ","超インフレ"],"e":"第一次世界大戦後のドイツや、2000年代のジンバブエなどで起こった。戦争や財政破綻で政府が通貨を大量に発行したことなどが原因で、貨幣が信用を失い経済が混乱する。日本でも第二次世界大戦直後に激しいインフレが起こった。"},{"t":"mc","s":"インフレーション","imp":3,"q":"インフレーションが進んだときに、一般に最も不利になると考えられる人として最も適当なものを一つ選べ。","c":["一定額の年金や預金の利子で生活している人","住宅ローンを借りて、毎月一定額を返済している人","土地や貴金属などの実物資産を多く保有している人","銀行からお金を借りて事業を営んでいる企業"],"a":0,"e":"インフレで貨幣の価値が下がると、金額が一定の年金や預金は実質的に目減りするので、それで生活する人は不利になる。住宅ローンや借入金のある人・企業（債務者）は、返済額が一定のまま貨幣価値が下がるので実質的な負担が軽くなり有利である。土地や貴金属などの実物資産は物価とともに値上がりしやすいので、保有者は不利になりにくい。"},{"t":"ex","s":"インフレーション","imp":3,"q":"インフレーションが、お金を貸している人（債権者）と借りている人（債務者）にそれぞれどのような影響を与えるか説明せよ。","a":"インフレーションで物価が上がると貨幣の価値が下がる。借金の額は金額で決まっているので、債務者にとっては返済の実質的な負担が軽くなり有利になる。一方、債権者にとっては、返ってくるお金の実質的な価値が目減りするので不利になる。同様に、預金や一定額の年金で生活する人も不利になる。","e":"ポイント：①貨幣価値の下落 ②債務者は実質的な返済負担が軽くなり有利 ③債権者は実質的な価値が目減りして不利 ④預金者・年金生活者も不利"},{"t":"tf","s":"インフレーション","imp":2,"q":"インフレーションが進むと貨幣の価値が上がるので、預金を多く持っている人は有利になる。","a":false,"e":"誤り。正しくは、インフレーションが進むと物価の上昇によって貨幣の価値が下がるので、預金の実質的な価値は目減りし、預金者は不利になる。貨幣の価値が上がるのは、物価が下落するデフレーションのときである。"},{"t":"qa","s":"デフレーション","imp":2,"q":"物価が持続的に下落し、貨幣の価値が上がっていく現象を何というか。","a":"デフレーション","alt":["デフレ"],"e":"デフレでは借金の実質的な負担が重くなり、債務者が不利になる。物価が下がると企業の売上が減り、賃金や雇用にも悪影響が及ぶため、景気の悪化につながりやすい。"},{"t":"qa","s":"デフレーション","imp":3,"q":"物価の下落が企業の収益や賃金を減らし、それがさらに需要を減らして物価を下落させるという、物価下落と景気悪化の悪循環を何というか。","a":"デフレ・スパイラル","alt":["デフレスパイラル"],"e":"スパイラルは「らせん」の意味。いったん陥ると抜け出しにくい。日本は1990年代後半から長期のデフレに苦しみ、デフレ・スパイラルへの懸念が強まった。"},{"t":"ex","s":"デフレーション","imp":2,"q":"デフレ・スパイラルが起こるしくみを説明せよ。","a":"物価が下がると企業の売上や利益が減るため、企業は賃金の引き下げや人員の削減を行う。家計の所得が減ると消費が減って需要が縮小し、企業は売るためにさらに値下げを迫られ、物価はいっそう下落する。このように物価の下落と景気の悪化が互いを強め合いながら進んでいく。","e":"ポイント：①物価下落→企業の売上・利益の減少 ②賃金の引き下げ・雇用の削減 ③所得減→消費・需要の縮小 ④さらなる値下げと物価下落の悪循環"},{"t":"tf","s":"デフレーション","imp":2,"q":"日本では1990年代後半から2000年代にかけて、物価が継続的に下落するデフレーションが続いた。","a":true,"e":"正しい。バブル経済の崩壊後、需要の低迷などから物価の下落が続き、政府は2001年に日本経済が「緩やかなデフレ」にあると認めた。デフレからの脱却は、その後の経済政策の大きな課題となった。"},{"t":"qa","s":"景気指標","imp":2,"q":"内閣府が毎月作成する、景気に先行して動く指標・一致して動く指標・遅れて動く指標の3系列からなる、景気の動きをとらえるための指数を何というか。","a":"景気動向指数","e":"先行系列、一致系列、遅行系列からなる。現在は、景気の変化の大きさやテンポを示すCI（コンポジット・インデックス）が中心で、変化の方向を示すDI（ディフュージョン・インデックス）もあわせて公表される。"},{"t":"qa","s":"景気指標","imp":2,"q":"日本銀行が四半期ごとに全国の企業に景況感などをたずねて公表する調査を、通称で何というか。","a":"日銀短観","alt":["短観","全国企業短期経済観測調査"],"e":"正式名称は「全国企業短期経済観測調査」。業況が「良い」と答えた企業の割合から「悪い」と答えた企業の割合を差し引いた業況判断DIが、とくに注目される。"},{"t":"mc","s":"景気指標","imp":1,"q":"景気や物価に関する指標についての記述として最も適当なものを一つ選べ。","c":["日銀短観の業況判断DIは、業況が「良い」と答えた企業の割合から「悪い」と答えた企業の割合を差し引いて求める。","景気動向指数は、日本銀行が毎年1回だけ作成・公表している。","消費者物価指数は、企業どうしで取引される原材料の価格だけを対象としている。","完全失業率は、景気の動きに先行して動く先行指標として用いられている。"],"a":0,"e":"業況判断DIの求め方として正しい。景気動向指数は内閣府が毎月作成するので誤り。消費者物価指数は家計が購入する商品・サービスの価格を対象とするので誤り（企業間の取引価格は企業物価指数）。完全失業率は景気に遅れて動く遅行系列の指標として用いられているので誤り。"}]});</script>
<script>QDATA.push({"unit":"u17","questions":[{"t":"qa","s":"貨幣の機能","imp":3,"q":"商品の価値を「1個100円」のように、価格という共通のものさしで表す貨幣の機能を何というか。","a":"価値尺度","alt":["価値尺度機能","価値の尺度","価値尺度手段"],"e":"貨幣の機能は、価値尺度・交換手段（流通手段）・支払手段・価値貯蔵手段の四つである。価格で表すことで、種類の異なる商品の価値を簡単に比べられるようになる。"},{"t":"tf","s":"貨幣の機能","imp":1,"q":"物々交換では、互いに相手の持っている物を欲しがっている場合にしか交換が成り立たないが、貨幣が交換手段として使われることで、この不便が解消される。","a":true,"e":"正しい。物々交換には「欲望の二重の一致」が必要だが、誰もが受け取る貨幣を仲立ちにすれば、売ることと買うことを別々に行えるので取引が容易になる。これが交換手段（流通手段）としての機能である。"},{"t":"mc","s":"貨幣の機能","imp":2,"q":"次の事例のうち、貨幣の「支払手段」としての機能にあたるものとして最も適当なものを一つ選べ。","c":["先月に後払い（ツケ）で買った商品の代金を、今月になって現金で店に支払った。","店頭で、りんご1個150円、みかん1個50円と値札をつけて、商品の価値を比べられるようにした。","コンビニでおにぎりを買うとき、その場で現金を渡して商品を受け取った。","将来の進学費用に備えて、毎月のお小遣いの一部を貯金箱にためた。"],"a":0,"e":"支払手段とは、後払いの代金や税金・借金の返済など、すでに生じている債務を決済する機能である。値札で価値を比べるのは価値尺度、その場で商品と引きかえに渡すのは交換手段、貯金箱にためるのは価値貯蔵手段の例なので、いずれも誤り。"},{"t":"qa","s":"貨幣の機能","imp":2,"q":"貨幣を手元に置いておけば将来いつでも商品と交換できるように、富を蓄える手段となる貨幣の機能を何というか。","a":"価値貯蔵手段","alt":["価値貯蔵","価値保蔵手段","価値貯蔵機能","価値保存手段"],"e":"貨幣は腐ったりしないため、富を蓄えておくのに適している。ただし、インフレーションで物価が上がると貨幣の価値が下がるため、価値貯蔵手段としての機能は損なわれる。"},{"t":"qa","s":"通貨の種類","imp":3,"q":"普通預金や当座預金のように、振込や口座からの引落しによってそのまま支払いに使える預金を、通貨としてとらえたものを何というか。","a":"預金通貨","e":"通貨は、日本銀行券と硬貨からなる現金通貨と、預金通貨に分けられる。通貨量（M1）では、現金通貨よりも預金通貨のほうがはるかに多い。定期預金はすぐには支払いに使えないため、準通貨とよばれる。"},{"t":"qa","s":"通貨の種類","imp":3,"q":"個人・一般の企業・地方公共団体などが保有する通貨の総量で、金融部門から経済全体に供給されている通貨量を何というか。","a":"マネーストック","alt":["マネー・ストック"],"e":"金融機関や中央政府が保有する通貨は含まない。2008年まではマネーサプライとよばれていた。現金通貨と預金通貨の合計をM1、これに定期預金などの準通貨や譲渡性預金（CD）を加えたものをM3という。"},{"t":"qa","s":"通貨の種類","imp":2,"q":"日本銀行券の発行高、貨幣（硬貨）の流通高、日本銀行当座預金の残高を合計した、日本銀行が直接供給する通貨の量を何というか。","a":"マネタリーベース","alt":["マネタリー・ベース","ハイパワード・マネー","ベースマネー"],"e":"マネーストックが経済全体に出回る通貨量であるのに対し、マネタリーベースは日本銀行が供給する通貨量である。2013年からの量的・質的金融緩和では、日本銀行はこれを大幅に増やす政策をとった。"},{"t":"tf","s":"通貨の種類","imp":2,"q":"日本では、紙幣（日本銀行券）も硬貨も、ともに日本銀行が発行している。","a":false,"e":"誤り。正しくは、紙幣（日本銀行券）は日本銀行が発行し、硬貨（貨幣）は政府が発行する（製造は造幣局）。紙幣の印刷は国立印刷局が行っている。"},{"t":"mc","s":"通貨の種類","imp":1,"q":"マネーストック統計についての記述として最も適当なものを一つ選べ。","c":["M1は、現金通貨と預金通貨を合計したものである。","M1には、定期預金や譲渡性預金（CD）も含まれる。","銀行などの金融機関が保有している現金も、マネーストックに含まれる。","マネーストックとは、日本銀行が直接供給する通貨の量のことである。"],"a":0,"e":"M1は、現金通貨と預金通貨（普通預金・当座預金などの要求払い預金）の合計である。定期預金やCDはM1ではなくM3に含まれるので誤り。金融機関や中央政府が保有する通貨はマネーストックに含まれないので誤り。日本銀行が直接供給する通貨量はマネタリーベースなので誤り。"},{"t":"ex","s":"通貨の種類","imp":2,"q":"マネタリーベースとマネーストックの違いを説明せよ。","a":"マネタリーベースは日本銀行が直接供給する通貨の量で、日本銀行券の発行高、貨幣の流通高、日銀当座預金の合計である。マネーストックは個人や企業などが保有する現金通貨や預金などの合計で、経済全体に出回っている通貨の量を示す。銀行の貸出による信用創造を通じて、マネタリーベースの何倍ものマネーストックが生まれる。","e":"ポイント：①マネタリーベース＝日本銀行が供給する通貨（銀行券・貨幣・日銀当座預金） ②マネーストック＝企業・個人などが保有する通貨量（金融機関・中央政府の保有分は除く） ③両者は銀行の信用創造で結びついている。"},{"t":"qa","s":"金本位制と管理通貨","imp":3,"q":"中央銀行が保有する金の量にしばられずに、通貨の発行量を経済の状況に応じて政策的に調節する制度を何というか。","a":"管理通貨制度","alt":["管理通貨制"],"e":"紙幣は金と交換できない不換紙幣となる。1929年に始まった世界恐慌をきっかけに、1930年代に各国が金本位制を離れてこの制度に移行した。景気対策に柔軟に対応できるが、通貨を発行しすぎるとインフレーションを招くおそれがある。"},{"t":"tf","s":"金本位制と管理通貨","imp":3,"q":"金本位制のもとでは、中央銀行は保有する金の量と関係なく、景気の状況に応じて通貨の量を自由に増やすことができる。","a":false,"e":"誤り。正しくは、金本位制では紙幣を金と交換できるようにしておく必要があるため、通貨の発行量は中央銀行の保有する金の量に制約される。金の量にしばられずに通貨量を調節できるのは管理通貨制度である。"},{"t":"ex","s":"金本位制と管理通貨","imp":2,"q":"金本位制と管理通貨制度の違いを、通貨の発行量の決まり方に着目して説明せよ。","a":"金本位制では、紙幣は金との交換が保証された兌換紙幣であり、通貨の発行量は中央銀行が保有する金の量に制約される。管理通貨制度では、紙幣は金と交換できない不換紙幣であり、中央銀行が経済の状況に応じて通貨の量を調節する。管理通貨制度は景気対策に柔軟に対応できる反面、通貨を発行しすぎるとインフレーションを招きやすい。","e":"ポイント：①金本位制＝兌換紙幣・発行量は金の保有量に制約される ②管理通貨制度＝不換紙幣・発行量を政策的に調節する ③管理通貨制度の長所（柔軟な景気対策）と短所（インフレの危険）。"},{"t":"qa","s":"直接金融と間接金融","imp":3,"q":"企業が株式や社債を発行して、家計などの資金の出し手から直接資金を調達するしくみを何というか。","a":"直接金融","e":"証券会社が売買を仲介するが、企業が倒産して株式や社債の価値がなくなるなどのリスクは、資金を出した投資家が負う。銀行などを通す間接金融と対比して覚えよう。"},{"t":"qa","s":"直接金融と間接金融","imp":3,"q":"銀行などの金融機関が家計から預金として集めた資金を企業に貸し出すように、金融機関を仲立ちとして資金が融通されるしくみを何というか。","a":"間接金融","e":"貸出先が返済できなくなった場合の損失（貸し倒れ）は、預金者ではなく金融機関が負う。戦後の日本、とくに高度経済成長期は、企業が取引の中心となる銀行（メインバンク）から資金を借りる間接金融が中心だった。"},{"t":"mc","s":"直接金融と間接金融","imp":3,"q":"次の資金調達の事例のうち、直接金融にあたるものとして最も適当なものを一つ選べ。","c":["自動車メーカーが、新工場の建設資金を得るために社債を発行し、投資家に購入してもらった。","商店が、運転資金を得るために、取引のある地方銀行から融資を受けた。","家計が、住宅を購入するために、信用金庫で住宅ローンを組んだ。","企業が、過去の利益をためてきた内部留保を取り崩して、設備投資にあてた。"],"a":0,"e":"社債の発行は、企業が投資家から直接資金を集める直接金融である。地方銀行や信用金庫からの借入れは、金融機関が預金を貸し出す間接金融なので誤り。内部留保の活用は企業が自分の資金を使う自己金融（内部金融）であり、外部から資金を調達していないので誤り。"},{"t":"tf","s":"直接金融と間接金融","imp":2,"q":"日本の家計の金融資産は、アメリカと比べて現金・預金の割合が低く、株式や投資信託の割合が高い。","a":false,"e":"誤り。正しくは逆で、日本の家計の金融資産は約半分が現金・預金であり、アメリカ（現金・預金は約1割）に比べて株式や投資信託の割合が低い。政府は「貯蓄から投資へ」をかかげ、NISAの拡充などで家計の投資を促している。"},{"t":"ex","s":"直接金融と間接金融","imp":3,"q":"直接金融と間接金融の違いを、資金の流れと、貸し倒れなどのリスクを負う主体に着目して説明せよ。","a":"直接金融は、企業が株式や社債を発行し、資金の出し手である投資家から直接資金を調達するしくみで、企業の倒産などによる損失のリスクは投資家が負う。間接金融は、銀行などの金融機関が預金として集めた資金を企業に貸し出すしくみで、貸出先が返済できなくなるリスクは金融機関が負う。","e":"ポイント：①直接金融＝株式・社債を通じて資金の出し手から直接調達 ②間接金融＝金融機関が預金を集めて貸し出す ③リスクを負うのは、直接金融では投資家、間接金融では金融機関。"},{"t":"qa","s":"金融市場","imp":3,"q":"金融機関どうしが、翌日に返済するものを中心に、ごく短期間の資金を貸し借りする市場を何というか。","a":"コール市場","e":"取引期間1年未満の短期金融市場の代表である。ここで担保なしで資金を借りて翌日に返すときの金利（無担保コールレート翌日物）が、日本銀行の政策金利となっている。"},{"t":"mc","s":"金融市場","imp":1,"q":"次の金融市場のうち、長期金融市場（資本市場）に分類されるものとして最も適当なものを一つ選べ。","c":["株式市場","コール市場","手形市場","CD（譲渡性預金）市場"],"a":0,"e":"期間1年以上の資金を取引する長期金融市場は資本市場ともよばれ、株式市場と公社債市場からなる。コール市場と手形市場は金融機関どうしが取引するインターバンク市場、CD市場は一般の企業なども参加できるオープン市場で、いずれも期間1年未満の短期金融市場なので誤り。"},{"t":"qa","s":"金融機関","imp":3,"q":"銀行の三大業務を三つ答えよ。","a":"預金業務・貸出業務・為替業務","alt":["預金・貸出・為替","預金業務・貸付業務・為替業務","預金・貸付・為替","預金、貸出、為替","預金業務、貸出業務、為替業務"],"e":"為替業務とは、現金を直接運ばずに、口座振込や送金によって離れた場所との支払いを済ませる業務である。銀行は、預金で集めた資金を貸し出すことをくり返して信用創造を行う。"},{"t":"qa","s":"金融機関","imp":2,"q":"株式や債券の売買の仲介や、企業が新たに発行する株式・社債の引受けなどを行い、直接金融の担い手となる金融機関を何というか。","a":"証券会社","e":"証券会社は投資家と企業を仲介するが、預金を受け入れて貸し出すことはしない。預金を受け入れて貸出を行う銀行は、間接金融の担い手である。"},{"t":"mc","s":"金融機関","imp":1,"q":"金融機関についての記述として適当でないものを一つ選べ。","c":["日本銀行は、一般の企業や個人からも預金を受け入れ、住宅ローンなどの貸出を行っている。","生命保険会社や損害保険会社は、集めた保険料を株式や債券などで運用する機関投資家でもある。","信用金庫や信用組合は、地域の中小企業や個人を主な取引先とする協同組織の金融機関である。","消費者金融会社などのノンバンクは、預金を受け入れずに貸出を行っている。"],"a":0,"e":"日本銀行は一般の企業や個人とは取引をせず、金融機関や政府と取引する（銀行の銀行・政府の銀行）ので誤り。保険会社は、保険料を運用して保険金の支払いに備える機関投資家である。ノンバンクは預金業務を行わず、銀行からの借入れなどで調達した資金を貸し出している。"},{"t":"tf","s":"金利のはたらき","imp":3,"q":"金利が低下すると、企業は資金を借りやすくなって設備投資を増やしやすくなるため、景気を刺激する効果がある。","a":true,"e":"正しい。金利は資金の需要と供給で決まる「資金の価格」であり、金利が下がると借入れの負担が軽くなって、企業の設備投資や家計の住宅購入などが増えやすい。逆に金利が上がると、投資や消費が抑えられ、景気の過熱やインフレーションを抑える効果がある。"},{"t":"mc","s":"金利のはたらき","imp":2,"q":"金利の変化が経済に与える影響についての記述として最も適当なものを一つ選べ。","c":["金利が上昇すると、住宅ローンの返済負担が重くなるため、住宅の購入が抑えられやすい。","金利が上昇すると、預金の利息が減るため、家計は貯蓄よりも消費を増やしやすい。","金利が低下すると、企業が資金を借りる費用が増えるため、設備投資が減りやすい。","金利が低下すると、資金を借りるよりも預金するほうが有利になるため、景気は過熱しやすい。"],"a":0,"e":"金利の上昇は借入れの負担を重くし、住宅購入や設備投資を抑える。金利が上昇すれば預金の利息は増えるので、「預金の利息が減る」とする記述は誤り。金利が低下すれば借入れの費用は減るので、「借りる費用が増える」とする記述は誤り。金利の低下は預金を不利にし借入れを有利にするので、「預金するほうが有利になる」とする記述は誤り。"},{"t":"qa","s":"金利のはたらき","imp":1,"q":"名目金利から物価上昇率（予想される物価上昇率）を差し引いた、実質的な金利を何というか。","a":"実質金利","e":"たとえば名目金利が1%でも、物価が3%上昇するなら実質金利はマイナス2%となり、お金を借りる側に有利になる。逆にデフレーションのもとでは、名目金利がゼロでも実質金利は高くなり、投資が抑えられやすい。"},{"t":"ex","s":"金利のはたらき","imp":2,"q":"好況期に金利が上がりやすい理由を、資金の需要と供給の関係から説明せよ。","a":"好況期には、企業が生産を拡大するために設備投資を増やし、家計も消費を増やすため、資金を借りたいという需要が増える。資金の供給に比べて需要が多くなると、資金の価格である金利は上昇する。逆に不況期には資金の需要が減るため、金利は低下しやすい。","e":"ポイント：①好況期は設備投資や消費が増えて資金需要が増加する ②需要が供給を上回ると資金の価格である金利が上昇する ③不況期は逆に金利が低下しやすい。"}]});</script>
<script>QDATA.push({"unit":"u17","questions":[{"t":"qa","s":"信用創造","imp":3,"q":"銀行が預金の受け入れと貸出をくり返すことによって、最初に受け入れた預金の何倍もの預金をつくり出すしくみを何というか。","a":"信用創造","alt":["預金創造"],"e":"最初に受け入れた預金を本源的預金という。預金総額は「本源的預金÷支払準備率」で求められ、そこから本源的預金を差し引いた額が信用創造額（新たにつくり出された預金）である。"},{"t":"mc","s":"信用創造","imp":3,"q":"ある銀行が100万円の預金（本源的預金）を受け入れた。すべての銀行の支払準備率が10%で、貸し出された資金はすべていずれかの銀行に預金されるとき、信用創造によって新たにつくり出される預金額として正しいものを一つ選べ。","c":["900万円","1,000万円","90万円","1,100万円"],"a":0,"e":"預金総額は100万円÷0.1＝1,000万円であり、信用創造額はそこから本源的預金100万円を差し引いた900万円となる。1,000万円は本源的預金を含めた預金総額なので誤り。90万円は最初の銀行が貸し出す額にすぎないので誤り。"},{"t":"qa","s":"信用創造","imp":2,"q":"本源的預金が200万円、支払準備率が5%のとき、信用創造によって生まれる預金総額（本源的預金を含む）はいくらか。","a":"4,000万円","alt":["4000万円","4,000万","4000万"],"e":"預金総額＝本源的預金÷支払準備率＝200万円÷0.05＝4,000万円である。信用創造額（新たにつくり出された預金）は、そこから本源的預金を引いた3,800万円となる。"},{"t":"tf","s":"信用創造","imp":3,"q":"支払準備率が引き上げられると、銀行が貸出に回せる資金の割合が増えるため、信用創造によって生まれる預金総額は大きくなる。","a":false,"e":"誤り。正しくは、支払準備率が引き上げられると、準備として残す割合が増えて貸出に回せる割合が減るため、預金総額は小さくなる。たとえば本源的預金が100万円のとき、準備率10%なら預金総額は1,000万円、20%なら500万円である。"},{"t":"ex","s":"信用創造","imp":2,"q":"信用創造のしくみを、本源的預金と支払準備率という語を用いて説明せよ。","a":"銀行は受け入れた本源的預金のうち、支払準備率に応じた一定割合を準備として残し、残りを企業などに貸し出す。貸し出された資金は取引の支払いなどを経て再び銀行に預金され、その一部がさらに貸し出される。これがくり返されることで、預金総額は本源的預金の「1÷支払準備率」倍まで増える。","e":"ポイント：①準備を残して残りを貸し出す ②貸し出された資金が再び預金される連鎖 ③預金総額＝本源的預金÷支払準備率、信用創造額＝預金総額−本源的預金。"},{"t":"qa","s":"日本銀行の役割","imp":3,"q":"日本の中央銀行である日本銀行の三つの役割を答えよ。","a":"発券銀行・銀行の銀行・政府の銀行","alt":["発券銀行、銀行の銀行、政府の銀行","発券銀行・政府の銀行・銀行の銀行"],"e":"発券銀行は日本銀行券を独占的に発行すること、銀行の銀行は金融機関から預金を受け入れ資金を貸し出すこと、政府の銀行は国の預金（国庫金）の出し入れや国債に関する事務を行うことである。"},{"t":"qa","s":"日本銀行の役割","imp":3,"q":"日本銀行が、民間の金融機関から預金を受け入れたり、金融機関に資金を貸し出したりする役割を何というか。","a":"銀行の銀行","e":"金融機関が日本銀行に持つ口座の預金を日銀当座預金といい、金融機関どうしの決済や支払準備に使われる。日本銀行は一般の企業や個人とは取引しない。"},{"t":"qa","s":"日本銀行の役割","imp":2,"q":"金融機関が一時的に資金不足に陥り、金融システム全体が混乱するおそれがあるとき、中央銀行が必要な資金を供給して混乱を防ぐ役割を何というか。","a":"最後の貸し手","alt":["最後の貸手","レンダー・オブ・ラストリゾート"],"e":"日本銀行による特別な融資は日銀特融とよばれ、1990年代後半の金融危機の際などに実施された。一つの金融機関の破綻が他の金融機関に連鎖して、金融システム全体が機能しなくなることを防ぐのが目的である。"},{"t":"mc","s":"日本銀行の役割","imp":2,"q":"日本銀行の業務の事例として最も適当なものを一つ選べ。","c":["資金繰りが一時的に苦しくなった銀行に、日本銀行が資金を貸し出す。","住宅を購入しようとする個人に、日本銀行が住宅ローンを貸し出す。","財務大臣の命令にもとづいて、日本銀行が政策金利の水準を決める。","政府が新たに発行する国債を、日本銀行が政府から直接すべて引き受ける。"],"a":0,"e":"金融機関への貸出は「銀行の銀行」としての業務である。日本銀行は個人や一般企業とは取引しないので、住宅ローンの記述は誤り。政策金利は日本銀行の政策委員会が金融政策決定会合で決めるので、財務大臣の命令とする記述は誤り。国債の日本銀行引受けは財政法第5条で原則として禁止されているので、直接すべて引き受けるとする記述は誤り。"},{"t":"tf","s":"日本銀行の役割","imp":2,"q":"日本銀行は「政府の銀行」として、税金などの国の収入を受け入れ、公共事業費や年金などの支払いを行う国庫金の事務を担っている。","a":true,"e":"正しい。日本銀行は政府の預金を預かり、国庫金の出し入れや、国債の発行・利払い・償還に関する事務を行う。ただし、国債を政府から直接引き受けることは財政法第5条で原則として禁止されている。"},{"t":"qa","s":"日銀の目的と独立性","imp":3,"q":"日本銀行の独立性（自主性）を高めることなどを目的として全面的に改正され、1998年に施行された法律は何か。","a":"日本銀行法","alt":["改正日本銀行法","新日本銀行法","日銀法","新日銀法","改正日銀法"],"e":"改正前の日本銀行法（1942年制定）は、政府が日本銀行に業務を命令できるなど、政府の強い監督を認めていた。改正後は、金融政策の理念を「物価の安定を図ることを通じて国民経済の健全な発展に資すること」とし、日本銀行の自主性の尊重を明記した。"},{"t":"qa","s":"日銀の目的と独立性","imp":3,"q":"総裁、副総裁2名、審議委員6名の計9名で構成される、日本銀行の最高意思決定機関を何というか。","a":"政策委員会","alt":["日本銀行政策委員会"],"e":"金融政策は、政策委員会が開く金融政策決定会合（年8回）で多数決により決定される。委員は両議院の同意を得て内閣が任命し、任期は5年である。"},{"t":"tf","s":"日銀の目的と独立性","imp":1,"q":"金融政策決定会合には政府の代表が出席でき、意見を述べたり議決の延期を求めたりすることはできるが、議決に加わることはできない。","a":true,"e":"正しい。財務大臣と経済財政政策担当大臣（またはその指名する職員）は会合に出席して意見を述べ、議案を提出し、議決の延期を求めることができるが、議決権はもたない。日本銀行の独立性と政府との連携を両立させるしくみである。"},{"t":"mc","s":"日銀の目的と独立性","imp":2,"q":"日本銀行の目的や独立性についての記述として最も適当なものを一つ選べ。","c":["日本銀行法は、物価の安定を図ることを通じて国民経済の健全な発展に資することを、金融政策の理念としている。","日本銀行の総裁は、内閣総理大臣が国会の同意を得ずに単独で任命する。","改正日本銀行法により、日本銀行の金融政策は財務大臣の承認を得なければ実施できないことになった。","日本銀行の金融政策の目的は、円の為替相場を一定の水準に固定することであると法律で定められている。"],"a":0,"e":"日本銀行法は、物価の安定を通じて国民経済の健全な発展に資することを理念としている。総裁は両議院の同意を得て内閣が任命するので誤り。改正日本銀行法は日本銀行の自主性を尊重しており、財務大臣の承認は必要ないので誤り。為替相場を固定する目的は定められておらず、為替介入も財務大臣の権限で行われるので誤り。"},{"t":"ex","s":"日銀の目的と独立性","imp":2,"q":"中央銀行に政府からの独立性が求められる理由を説明せよ。","a":"政府は景気の拡大や選挙を意識して、通貨の供給を増やしたり金利を低く抑えたりする政策を求めがちである。中央銀行が政府の意向に従って通貨を出しすぎると、インフレーションを招き、通貨の価値が損なわれるおそれがある。そのため、物価の安定という長期的な目標を守れるよう、中央銀行が専門的な判断で独立して金融政策を行うことが求められる。","e":"ポイント：①政府は短期的な景気拡大を求めがち ②通貨の出しすぎ→インフレーション→通貨価値の低下 ③物価の安定のため中央銀行が独立して判断する（1998年施行の改正日本銀行法で自主性を尊重）。"},{"t":"qa","s":"日銀の目的と独立性","imp":3,"q":"2013年1月に政府と日本銀行が共同声明で定めた「物価安定の目標」は、消費者物価の前年比上昇率で何%か。","a":"2%","alt":["2パーセント","前年比2%","2％"],"e":"長く続いたデフレーションからの脱却をめざして定められ、同年4月に導入された量的・質的金融緩和は、この目標を2年程度で実現することをかかげた。物価の安定は、日本銀行の金融政策の目的の中心である。"},{"t":"qa","s":"公開市場操作","imp":3,"q":"日本銀行が金融機関との間で国債などを売買して、市場に出回る資金の量を調節し、金利を誘導する政策を何というか。","a":"公開市場操作","alt":["オペレーション","公開市場操作（オペレーション）","オープン・マーケット・オペレーション"],"e":"現在の金融政策の中心となる手段である。国債などを買い入れて資金を供給する買いオペ（資金供給オペレーション）と、国債などを売却して資金を吸収する売りオペ（資金吸収オペレーション）がある。"},{"t":"tf","s":"公開市場操作","imp":3,"q":"不況のとき、日本銀行は売りオペレーションを行って市場に資金を供給し、金利を引き下げようとする。","a":false,"e":"誤り。正しくは、不況のときは買いオペレーション（資金供給オペレーション）を行う。売りオペレーションは市場から資金を吸収して金利を上昇させる政策で、景気の過熱やインフレーションを抑えたいときに行う。"},{"t":"mc","s":"公開市場操作","imp":3,"q":"日本銀行が買いオペレーションを行ったときに起こると考えられる変化の流れとして最も適当なものを一つ選べ。","c":["金融機関の日銀当座預金が増える → 短期金利が低下する → 企業への貸出が増えやすくなる","金融機関の日銀当座預金が減る → 短期金利が上昇する → 企業への貸出が減りやすくなる","金融機関の日銀当座預金が増える → 短期金利が上昇する → 企業への貸出が減りやすくなる","金融機関の日銀当座預金が減る → 短期金利が低下する → 企業への貸出が増えやすくなる"],"a":0,"e":"買いオペでは、日本銀行が金融機関から国債などを買い、その代金を金融機関の日銀当座預金に払い込む。金融機関の手元の資金が豊富になるため、コール市場などの短期金利が低下し、貸出金利も下がって企業への貸出が増えやすくなる。日銀当座預金が減って金利が上昇するのは売りオペのときの流れであり、ほかの組合せは因果関係が成り立たないので誤り。"},{"t":"ex","s":"公開市場操作","imp":2,"q":"景気が過熱してインフレーションのおそれがあるとき、日本銀行が売りオペレーションを行うと、どのような流れで景気が抑えられるか説明せよ。","a":"日本銀行が保有する国債などを金融機関に売ると、金融機関は代金を支払うため日銀当座預金が減り、市場に出回る資金が少なくなる。その結果、短期金利が上昇し、金融機関の貸出金利も上がるので、企業の設備投資や家計の消費が抑えられる。こうして景気の過熱やインフレーションが抑えられる。","e":"ポイント：①売りオペ＝国債などを売却して資金を吸収する ②資金量の減少→短期金利の上昇→貸出金利の上昇 ③設備投資・消費の抑制→景気過熱・インフレーションの抑制。"},{"t":"qa","s":"公開市場操作","imp":3,"q":"現在、日本銀行の政策金利とされている、金融機関どうしが担保なしで資金を借りて翌日に返すときの金利を何というか。","a":"無担保コールレート翌日物","alt":["無担保コールレート（オーバーナイト物）","無担保コールレートオーバーナイト物","無担保コール翌日物","無担保コールレート"],"e":"日本銀行は公開市場操作によって、この金利を誘導目標の水準に近づける。かつては公定歩合が政策金利だったが、金利の自由化により、1990年代半ば以降はこの金利が政策金利の役割を担うようになった。"},{"t":"qa","s":"公定歩合と準備率","imp":2,"q":"日本銀行が金融機関に資金を貸し出すときの金利で、かつて金融政策の中心的な手段であった「公定歩合」は、2006年に何という名称に変更されたか。","a":"基準割引率および基準貸付利率","alt":["基準割引率及び基準貸付利率","基準割引率・基準貸付利率","基準貸付利率"],"e":"1994年に金利の自由化が完了すると、預金金利などが公定歩合と連動しなくなり、公定歩合は政策金利としての役割を失った。現在は、短期の市場金利が上昇しすぎないよう、その上限を画する役割をもっている。"},{"t":"qa","s":"公定歩合と準備率","imp":2,"q":"金融機関に対して、受け入れた預金の一定割合を日本銀行に預けることを義務づけ、その割合を上下させて市場の資金量を調節する政策を何というか。","a":"預金準備率操作","alt":["支払準備率操作","準備率操作","預金準備率政策"],"e":"準備率を引き上げると、金融機関が貸出に回せる資金が減るため金融引締めとなり、引き下げると金融緩和となる。ただし日本では1991年を最後に準備率は変更されておらず、現在は主要な政策手段ではない。"},{"t":"tf","s":"公定歩合と準備率","imp":2,"q":"現在の日本銀行は、公定歩合を政策金利として上下させることで、預金金利などの金利を直接動かしている。","a":false,"e":"誤り。正しくは、1994年に金利の自由化が完了すると、預金金利などは公定歩合と連動しなくなった。現在の政策金利は無担保コールレート翌日物であり、公定歩合は2006年に「基準割引率および基準貸付利率」へと名称が変更された。"},{"t":"ex","s":"公定歩合と準備率","imp":1,"q":"現在、公定歩合操作に代わって公開市場操作が金融政策の中心となっている理由を、金利の自由化と関連づけて説明せよ。","a":"かつては預金金利などが規制され、公定歩合と連動していたため、公定歩合を上下させることで金利全体を動かすことができた。しかし1994年に金利の自由化が完了すると、金利は市場で決まるようになり、公定歩合の変更が預金金利などに直接及ばなくなった。そのため日本銀行は、国債などの売買によって短期金融市場の金利を誘導する公開市場操作を中心とするようになった。","e":"ポイント：①規制金利の時代は公定歩合と預金金利などが連動していた ②1994年の金利自由化の完了で連動がなくなった ③公開市場操作で短期金利（無担保コールレート翌日物）を誘導する。"},{"t":"mc","s":"景気と金融政策","imp":3,"q":"景気の状況と日本銀行の金融政策の組合せとして最も適当なものを一つ選べ。","c":["景気が後退しているので、買いオペレーションを行って政策金利の低下を促す。","景気が後退しているので、預金準備率を引き上げて銀行の貸出を抑える。","景気が過熱しているので、政策金利を引き下げて資金を借りやすくする。","景気が過熱しているので、金融機関から国債を大量に買い入れて資金を供給する。"],"a":0,"e":"景気後退期には、買いオペで資金を供給して金利を下げる金融緩和を行う。預金準備率の引上げは金融引締めにあたるので、景気後退期の政策として誤り。景気過熱期には、政策金利の引上げや売りオペによる資金の吸収といった金融引締めを行うので、政策金利の引下げや国債の大量買入れとする記述は誤り。"},{"t":"qa","s":"景気と金融政策","imp":2,"q":"景気の過熱やインフレーションを抑えるために、中央銀行が政策金利を引き上げたり、市場から資金を吸収したりする政策を何というか。","a":"金融引締め","alt":["金融引締め政策","金融引き締め","金融引き締め政策","引締め政策"],"e":"これに対し、不況期に政策金利を引き下げたり資金を供給したりして景気を刺激する政策を金融緩和という。景気の局面と政策の向きを組み合わせて覚えよう。"},{"t":"qa","s":"非伝統的金融政策","imp":3,"q":"1999年に日本銀行が導入した、無担保コールレート翌日物をできるだけ低く、実質的に0%に誘導する政策を何というか。","a":"ゼロ金利政策","e":"景気の悪化とデフレーションへの対応として導入され、2000年に一度解除された。金利をそれ以上下げられなくなったため、2001年からは資金の量を目標とする量的緩和政策が行われた。"},{"t":"qa","s":"非伝統的金融政策","imp":3,"q":"2001年から2006年にかけて日本銀行が行った、金融調節の目標を金利から日銀当座預金の残高に変更し、大量の資金を供給した政策を何というか。","a":"量的緩和政策","alt":["量的緩和"],"e":"金利を下げる余地がなくなったなかで、金融機関に潤沢な資金を供給してデフレーションからの脱却をめざした。2006年に解除され、操作目標は再び無担保コールレート翌日物に戻された。"},{"t":"qa","s":"非伝統的金融政策","imp":3,"q":"2013年4月に日本銀行が導入した、マネタリーベースを2年で2倍にすることをかかげ、長期国債やETF（上場投資信託）などを大量に買い入れた金融緩和策を何というか。","a":"量的・質的金融緩和","alt":["量的質的金融緩和","異次元緩和","異次元の金融緩和","量的・質的緩和"],"e":"「量」はマネタリーベースを大幅に増やすこと、「質」は買い入れる資産を長期国債やETF・J-REITなど、よりリスクのある資産に広げたことを指す。2%の物価安定目標を2年程度で実現することをめざした。"},{"t":"qa","s":"非伝統的金融政策","imp":3,"q":"2016年に日本銀行が導入した、金融機関が日本銀行に預ける当座預金の一部にマイナス0.1%の金利を適用する政策を何というか。","a":"マイナス金利政策","alt":["マイナス金利","マイナス金利付き量的・質的金融緩和"],"e":"金融機関は日銀当座預金に資金をためておくと金利を支払うことになるため、企業への貸出や投資に資金を回すよう促された。一般の預金者の預金金利がマイナスになったわけではない。2024年3月に解除された。"},{"t":"qa","s":"非伝統的金融政策","imp":2,"q":"2016年9月に日本銀行が導入した、短期金利をマイナスに、長期金利（10年物国債の利回り）を0%程度に誘導する政策を何というか。","a":"イールドカーブ・コントロール","alt":["イールドカーブコントロール","長短金利操作","YCC","長短金利操作付き量的・質的金融緩和"],"e":"イールドカーブとは、期間の異なる金利を結んだ曲線（利回り曲線）のことで、短期金利だけでなく長期金利まで操作しようとした点が特徴である。2024年3月に、マイナス金利政策の解除とともに終了した。"},{"t":"mc","s":"非伝統的金融政策","imp":2,"q":"日本銀行の次の政策を、導入された時期の古い順に並べたとき、3番目にくるものとして正しいものを一つ選べ。","c":["量的・質的金融緩和","ゼロ金利政策","量的緩和政策","マイナス金利政策"],"a":0,"e":"ゼロ金利政策（1999年）→量的緩和政策（2001年）→量的・質的金融緩和（2013年）→マイナス金利政策（2016年）の順である。したがって3番目は量的・質的金融緩和である。"},{"t":"mc","s":"非伝統的金融政策","imp":1,"q":"日本銀行のマイナス金利政策のねらいとして最も適当なものを一つ選べ。","c":["金融機関が日銀当座預金に資金をためこまず、企業への貸出などに回すよう促すこと。","一般の預金者の預金金利をマイナスにして、家計の貯蓄を強制的に減らすこと。","円高を進めて輸入品の価格を下げ、物価を引き下げること。","政府が発行する国債の利払いを増やして、財政支出を拡大すること。"],"a":0,"e":"マイナス金利は金融機関が日本銀行に預ける当座預金の一部に適用されたもので、資金を貸出などに回させて景気を刺激し、物価を上げることをめざした。一般の預金金利がマイナスになったわけではないので、家計の貯蓄を減らすとする記述は誤り。デフレーションからの脱却が目的であり、物価を引き下げるとする記述は誤り。金利の低下は国債の利払いを減らす方向にはたらくので、利払いを増やすとする記述も誤り。"},{"t":"ex","s":"非伝統的金融政策","imp":2,"q":"政策金利がほぼ0%に達したあと、日本銀行が量的緩和政策などの非伝統的な金融政策を行うようになった理由を説明せよ。","a":"政策金利がほぼ0%まで下がると、それ以上金利を引き下げる余地がなくなり、金利の操作による従来の景気刺激策が使えなくなる。そこで日本銀行は、日銀当座預金やマネタリーベースなど資金の量を目標にして大量の資金を供給したり、長期国債などを買い入れて長期金利を引き下げたりすることで、景気を下支えし、デフレーションからの脱却を図った。","e":"ポイント：①金利がゼロ近くになり利下げの余地がない ②資金の量を目標とした大量供給（量的緩和政策・量的・質的金融緩和） ③長期金利の引下げやデフレ脱却をねらう。"},{"t":"tf","s":"非伝統的金融政策","imp":1,"q":"量的・質的金融緩和によってマネタリーベースが大幅に増えると、それに比例してマネーストックも同じ割合で大幅に増加した。","a":false,"e":"誤り。正しくは、マネタリーベースは大幅に増えたが、企業の資金需要が弱く銀行の貸出が大きく伸びなかったため、マネーストックの伸びは小さかった。供給された資金の多くは日銀当座預金に積み上がった。"},{"t":"mc","s":"非伝統的金融政策","imp":2,"q":"2024年3月に日本銀行が決定した金融政策の変更として適当でないものを一つ選べ。","c":["政策金利を一気に年2%程度まで引き上げた。","マイナス金利政策を解除した。","イールドカーブ・コントロールを終了した。","ETF（上場投資信託）などの新規の買入れを終了した。"],"a":0,"e":"2024年3月、日本銀行はマイナス金利政策の解除、イールドカーブ・コントロールの終了、ETFやJ-REITの新規買入れの終了を決め、約17年ぶりの利上げを行った。このとき政策金利（無担保コールレート翌日物）は0〜0.1%程度とされ、一気に2%まで引き上げたわけではないので、その記述は誤り。"},{"t":"tf","s":"非伝統的金融政策","imp":3,"q":"日本銀行は2024年3月にマイナス金利政策を解除したあと、2024年7月と2025年1月に、政策金利をさらに引き上げた。","a":true,"e":"正しい。2024年3月の解除で政策金利は0〜0.1%程度となり、7月に0.25%程度、2025年1月に0.5%程度へ引き上げられた。さらに2025年12月には0.75%程度とされ、長く続いた大規模な金融緩和からの転換が進んでいる。"}]});</script>
<script>QDATA.push({"unit":"u17","questions":[{"t":"qa","s":"自由化と金融行政","imp":3,"q":"第二次世界大戦後の日本で、大蔵省が金利や業務分野、店舗の設置などを規制し、経営体力の弱い金融機関も含めてすべての金融機関が存続できるように保護した行政のあり方を何というか。","a":"護送船団方式","alt":["護送船団行政"],"e":"船団の中で最も速度の遅い船に合わせて全体を守りながら進む様子にたとえた言葉である。金融機関の倒産は防がれたが、競争が制限されたため効率化や国際競争力の向上が遅れたと批判され、金融の自由化によって転換が進んだ。"},{"t":"tf","s":"自由化と金融行政","imp":2,"q":"日本の預金金利の自由化は、日本版金融ビッグバンが始まったあとの2000年代になって完了した。","a":false,"e":"誤り。正しくは、預金金利の自由化は1980年代から段階的に進められ、1994年に普通預金などの流動性預金の金利も自由化されて完了した。日本版金融ビッグバンが打ち出されたのは1996年である。"},{"t":"qa","s":"自由化と金融行政","imp":3,"q":"1996年に橋本内閣が打ち出した、「フリー・フェア・グローバル」を原則とする大規模な金融制度改革を何というか。","a":"日本版金融ビッグバン","alt":["金融ビッグバン","日本版ビッグバン","ビッグバン"],"e":"東京市場をニューヨークやロンドンと並ぶ国際金融市場にすることをめざした。外国為替業務の自由化、株式売買の手数料の自由化、金融持株会社の解禁、銀行・証券・保険の相互参入の促進などが進められた。名称は1986年のイギリスの証券制度改革（ビッグバン）にちなむ。"},{"t":"mc","s":"自由化と金融行政","imp":1,"q":"金融の自由化・国際化についての記述として適当でないものを一つ選べ。","c":["護送船団方式のもとでは、預金金利は市場で自由に決まり、金融機関どうしの競争が激しかった。","1998年に施行された改正外国為替及び外国貿易法（外為法）により、外国為替業務が原則として自由化された。","独占禁止法の改正による持株会社の解禁を受けて金融持株会社がつくられ、大手銀行の経営統合が進んだ。","銀行・証券・保険などの業務分野の垣根が低くなり、子会社などを通じて互いの分野に参入できるようになった。"],"a":0,"e":"護送船団方式のもとでは預金金利は規制されており、金融機関どうしの競争は制限されていたので誤り。1998年施行の改正外為法により、銀行以外の企業も外貨の両替などを行えるようになった。持株会社は1997年の独占禁止法改正で解禁され、金融持株会社のもとで三つのメガバンクグループが形成された。1993年施行の金融制度改革法以降、子会社による業務分野の相互参入が認められた。"},{"t":"qa","s":"自由化と金融行政","imp":2,"q":"大蔵省から金融機関の検査・監督の権限を切り離して設けられた金融監督庁などを前身とし、2000年に発足した、金融行政を担う国の行政機関を何というか。","a":"金融庁","e":"1998年に金融監督庁が発足し、2000年に金融制度の企画立案部門もあわせて金融庁となった。財政を担う大蔵省（2001年から財務省）と金融行政を切り離す「財政と金融の分離」の考え方による。現在は内閣府の外局である。"},{"t":"qa","s":"金融危機と不良債権","imp":3,"q":"借り手の経営悪化などにより、返済が滞ったり回収が困難になったりした金融機関の貸出債権を何というか。","a":"不良債権","e":"バブル崩壊後に大量の不良債権が発生し、その処理が長引いたことが、1990年代の「失われた10年」とよばれる長期不況の一因となった。2000年代前半には、政府が主要行に不良債権比率の引下げを求めるなど、処理が本格的に進められた。"},{"t":"tf","s":"金融危機と不良債権","imp":3,"q":"1997〜98年には、北海道拓殖銀行や山一證券が経営破綻し、日本長期信用銀行や日本債券信用銀行が一時国有化された。","a":true,"e":"正しい。1997年には都市銀行として初めて北海道拓殖銀行が破綻し、四大証券の一つだった山一證券が自主廃業した。1998年には長期信用銀行の日本長期信用銀行と日本債券信用銀行が一時国有化された。"},{"t":"qa","s":"金融危機と不良債権","imp":2,"q":"経営が悪化した銀行が、自己資本比率を維持するためなどの理由で、返済能力のある企業に対しても新たな貸出を控えることを何というか。","a":"貸し渋り","alt":["貸渋り"],"e":"すでに行っている貸出を期限前に強引に回収することは「貸しはがし」という。1990年代後半には、貸し渋りによって資金を調達できなくなった中小企業の倒産が増え、景気がさらに悪化した。"},{"t":"mc","s":"金融危機と不良債権","imp":2,"q":"バブル崩壊後の日本で不良債権が大量に発生した主な理由として最も適当なものを一つ選べ。","c":["地価や株価が大きく下落し、土地や株式を担保とした融資の回収が難しくなったから。","インフレーションが急速に進み、銀行が貸し出したお金の実質的な価値が大きく下がったから。","政府が公的資金を注入したことで、銀行の自己資本が過剰になったから。","預金保険制度によって、すべての貸出金の返済が国から保証されていたから。"],"a":0,"e":"バブル期には土地や株式を担保にした積極的な融資が行われたが、バブル崩壊で地価や株価が下落して担保の価値が下がり、融資の多くが回収困難になった。当時の日本はインフレーションではなく、物価が下落するデフレーションの傾向にあったので誤り。公的資金の注入は不良債権問題への対策であって原因ではないので誤り。預金保険制度は預金者を保護する制度であり、貸出金の返済を保証するものではないので誤り。"},{"t":"qa","s":"金融危機と不良債権","imp":2,"q":"金融機関の破綻を防ぎ金融システムを安定させるため、政府が税金などを財源とする資金で金融機関の株式を引き受けるなどして、その自己資本を増強することを何というか。","a":"公的資金の注入","alt":["公的資金注入","資本注入","公的資金による資本注入"],"e":"1998年と1999年に大手銀行などに注入され、2003年にはりそな銀行にも注入された。1996年には住宅金融専門会社（住専）の処理にも公的資金が使われた。税金を使うことへの批判もあり、経営責任の明確化や経営の健全化が求められた。"},{"t":"qa","s":"預金保険とペイオフ","imp":3,"q":"金融機関が破綻した場合、預金保険制度によって、預金者1人あたり1金融機関ごとに保護される預金の範囲を答えよ。","a":"元本1,000万円とその利息","alt":["元本1000万円とその利息","1,000万円とその利息","1000万円とその利息","元本1,000万円までとその利息","元本1000万円までとその利息"],"e":"これを超える部分は、破綻した金融機関の財産の状況に応じて支払われるため、一部が戻らない可能性がある。利息がつかず、いつでも引き出せ、決済に使える決済用預金は全額保護される。外貨預金や投資信託などは保護の対象外である。"},{"t":"qa","s":"預金保険とペイオフ","imp":3,"q":"金融機関が破綻したとき、預金保険機構が一定額（元本1,000万円とその利息）までを預金者に払い戻し、それを超える預金は全額保護しないしくみを何というか。","a":"ペイオフ","e":"1990年代の金融危機のなかで、預金を全額保護する特例措置がとられ、ペイオフは凍結された。その後、2002年に定期預金などについて、2005年に普通預金なども含めて解禁された。初めて実際に発動されたのは、2010年の日本振興銀行の破綻のときである。"},{"t":"tf","s":"預金保険とペイオフ","imp":1,"q":"ペイオフが全面解禁されたあとも、利息がつかず、いつでも引き出せ、決済に使える「決済用預金」は、金額にかかわらず全額が保護される。","a":true,"e":"正しい。企業の支払いなど決済の安定を守るため、決済用預金（無利息・要求払い・決済サービスを提供できる、の3条件を満たす預金）は全額保護されている。当座預金などがこれにあたる。"},{"t":"mc","s":"預金保険とペイオフ","imp":2,"q":"預金保険制度についての記述として最も適当なものを一つ選べ。","c":["ペイオフは2002年に定期預金などについて解禁され、2005年には普通預金なども含めて全面的に解禁された。","預金保険制度では、外貨預金や投資信託も元本1,000万円まで保護される。","預金保険制度では、預金者1人につき、すべての金融機関の預金を合算して元本1,000万円まで保護される。","日本では、ペイオフが実際に発動されたことは一度もない。"],"a":0,"e":"ペイオフは2002年と2005年の2段階で解禁された。外貨預金や投資信託は保護の対象外なので誤り。保護の上限は1金融機関ごとであり、複数の金融機関に預けていればそれぞれ元本1,000万円まで保護されるので、すべてを合算するとする記述は誤り。2010年の日本振興銀行の破綻で初めて発動されたので、一度もないとする記述は誤り。"},{"t":"ex","s":"預金保険とペイオフ","imp":1,"q":"ペイオフを解禁して預金を全額は保護しないことにしたのは、どのような効果をねらったものか、説明せよ。","a":"預金が全額保護されると、預金者は金融機関の経営状態を気にせずに預け先を選び、金融機関の側も経営が甘くなりやすい。ペイオフを解禁することで、預金者が自己責任で経営の健全な金融機関を選ぶようになり、金融機関も預金者の信頼を得るために経営の健全化に努めるようになることがねらいとされた。","e":"ポイント：①全額保護は預金者・金融機関の規律の緩み（モラルハザード）を生む ②預金者の自己責任による金融機関の選別 ③金融機関の経営健全化を促す。"},{"t":"qa","s":"BIS規制","imp":3,"q":"国際決済銀行（BIS）のバーゼル銀行監督委員会の合意にもとづき、国際業務を行う銀行に自己資本比率8%以上を保つことを求める規制を何というか。","a":"BIS規制","alt":["バーゼル規制","バーゼル合意","BIS基準"],"e":"1988年に合意された。自己資本比率は、自己資本を貸出などリスクのある資産の額で割って求め、高いほど損失に耐える力がある。その後、バーゼルⅡ・バーゼルⅢへと見直されて規制が強化された。国内業務のみを行う銀行には、日本独自の国内基準（4%以上）が適用される。"},{"t":"tf","s":"BIS規制","imp":2,"q":"BIS規制の自己資本比率を高めるために、1990年代後半の日本の銀行は企業への貸出を大幅に増やした。","a":false,"e":"誤り。正しくは、不良債権処理で自己資本が減った銀行は、比率の分母となる貸出などの資産を減らして自己資本比率を保とうとしたため、貸し渋りが広がった。"},{"t":"ex","s":"BIS規制","imp":2,"q":"1990年代後半に銀行の貸し渋りが起きた理由と、それが経済に与えた影響を、自己資本比率という語を用いて説明せよ。","a":"不良債権の処理で損失がふくらんだ銀行は自己資本が減少し、BIS規制などで求められる自己資本比率を保つことが難しくなった。そこで銀行は、比率の分母となる貸出を減らそうとして、新たな貸出を控えたり貸出を回収したりした。その結果、資金を借りられない中小企業などの倒産が増え、設備投資も落ち込んで景気がさらに悪化した。","e":"ポイント：①不良債権処理で自己資本が減少した ②自己資本比率を保つため分母の貸出を削減した ③中小企業の倒産や投資の低迷→景気の悪化。"},{"t":"qa","s":"金融商品とリスク","imp":3,"q":"金融商品を選ぶときの基準のうち、元本が保証されているかなどを「安全性」、必要なときにすぐ現金にかえられるかを「流動性」というとき、どれだけ利益が期待できるかを何というか。","a":"収益性","e":"安全性・流動性・収益性の三つをすべて同時に満たす金融商品はない。預金は安全性・流動性が高いが収益性は低く、株式は収益性が期待できるが安全性は低い。"},{"t":"qa","s":"金融商品とリスク","imp":2,"q":"国や企業が資金を借り入れるために発行し、満期になると額面の金額が返済され、それまでの間は利子が支払われる有価証券を何というか。","a":"債券","alt":["公社債"],"e":"国が発行するものを国債、企業が発行するものを社債という。満期まで保有すれば、発行体が破綻しない限り額面の金額が戻るが、満期前に売却する場合は市場金利の動きによって価格が変動する。"},{"t":"qa","s":"金融商品とリスク","imp":2,"q":"多くの投資家から集めた資金を、専門家が株式や債券などに分散して運用し、その成果を投資家に分配する金融商品を何というか。","a":"投資信託","alt":["投信"],"e":"少額から多くの銘柄に分散投資できるのが特徴だが、元本は保証されず、運用の結果によっては損失が出る。運用のための手数料（信託報酬など）がかかる。"},{"t":"tf","s":"金融商品とリスク","imp":3,"q":"金融商品の「リスク」とは損失が出る可能性だけを意味し、予想以上に大きな利益が出る可能性はリスクに含まれない。","a":false,"e":"誤り。正しくは、金融でいうリスクとは、収益（リターン）が予想からどれだけぶれるかという不確実性のことで、大きな利益が出る可能性も含む。一般に、高いリターンが期待できる商品ほどリスクも高い（ハイリスク・ハイリターン）。"},{"t":"qa","s":"金融商品とリスク","imp":2,"q":"値動きの異なる複数の資産や地域に資金を分けたり、購入する時期を分けたりして投資することで、全体のリスクを小さくしようとする方法を何というか。","a":"分散投資","e":"「卵を一つのかごに盛るな」という格言で表される。一つの資産の価格が下がっても、ほかの資産で損失を補える可能性がある。長期・積立・分散が資産形成の基本とされる。"},{"t":"mc","s":"金融商品とリスク","imp":3,"q":"100万円を年利10%で3年間運用するとき、1年ごとの複利で運用した場合の3年後の元利合計として正しいものを一つ選べ（税金や手数料は考えない）。","c":["133万1,000円","130万円","133万円","110万円"],"a":0,"e":"複利では、毎年の利息を元本に加えて次の年の利息を計算する。100万円×1.1×1.1×1.1＝133万1,000円となる。130万円は、元本にだけ利息がつく単利（100万円＋10万円×3年）の場合の金額なので誤り。運用期間が長いほど、複利と単利の差は大きくなる。"},{"t":"tf","s":"金融商品とリスク","imp":1,"q":"一般に、市場金利が上昇すると、すでに発行されている債券の価格は下落する。","a":true,"e":"正しい。市場金利が上がると、新しく発行される債券の利回りが高くなるため、利回りの低い既発の債券は買い手が減り、価格が下がる。このように、金利と債券価格は逆方向に動く。"},{"t":"ex","s":"金融商品とリスク","imp":2,"q":"金融商品の安全性・流動性・収益性の関係について、預金と株式を例に説明せよ。","a":"預金は元本が保証され、必要なときにすぐ引き出せるため、安全性と流動性は高いが、金利が低く収益性は低い。株式は値上がり益や配当によって高い収益が期待できるが、価格が下がって元本を割り込むおそれがあり、安全性は低い。このように三つの基準をすべて満たす金融商品はなく、高い収益を求めれば高いリスクを負うことになる。","e":"ポイント：①預金＝安全性・流動性が高く収益性は低い ②株式＝収益性は期待できるが安全性が低い ③三つを同時に満たす商品はない（ハイリスク・ハイリターン）。"},{"t":"qa","s":"NISAとiDeCo","imp":2,"q":"株式や投資信託などへの投資で得た配当や売却益が、一定の金額の範囲内で非課税になる、少額投資非課税制度の通称を何というか。","a":"NISA","alt":["ニーサ"],"e":"通常、投資で得た利益には約20%の税金がかかるが、NISA口座での投資の利益は非課税となる。2014年に始まり、2024年からは非課税で保有できる期間を無期限にするなど、制度が大幅に拡充された。"},{"t":"tf","s":"NISAとiDeCo","imp":1,"q":"2024年から始まった新しいNISAでは、非課税で保有できる期間が5年間に限定された。","a":false,"e":"誤り。正しくは、新しいNISAでは非課税保有期間が無期限となった。年間の投資枠はつみたて投資枠（120万円）と成長投資枠（240万円）を合わせて360万円、生涯の非課税保有限度額は1,800万円（うち成長投資枠は1,200万円）である。"},{"t":"qa","s":"NISAとiDeCo","imp":1,"q":"加入者が自分で掛金を出して運用する商品を選び、原則60歳以降に年金や一時金として受け取る私的年金で、掛金が所得控除の対象となる制度の通称は何か。","a":"iDeCo","alt":["イデコ","個人型確定拠出年金"],"e":"正式名称は個人型確定拠出年金である。運用の成果によって受取額が変わり、運用のリスクは加入者自身が負う。公的年金に上乗せする老後の資産形成の手段として、NISAとともに国が利用を促している。"},{"t":"mc","s":"キャッシュレスと新技術","imp":2,"q":"キャッシュレス決済についての記述として最も適当なものを一つ選べ。","c":["デビットカードで支払うと、原則として代金がその場で本人の銀行口座から引き落とされる。","クレジットカードは、事前に入金（チャージ）した金額の範囲内でしか買い物ができない前払い式の決済手段である。","交通系ICカードなどの電子マネーは、利用した代金を翌月以降にまとめて支払う後払い式の決済手段である。","キャッシュレス決済は現金を使わないので、使いすぎや不正利用の心配はない。"],"a":0,"e":"デビットカードは即時払いである。クレジットカードは後払い式なので誤り。交通系ICカードなどの電子マネーは事前にチャージする前払い式が中心なので誤り。キャッシュレス決済は支払いの実感が薄く使いすぎにつながりやすいうえ、カード情報の盗用などの不正利用にも注意が必要なので誤り。日本のキャッシュレス決済比率は2024年に4割を超えた。"},{"t":"qa","s":"キャッシュレスと新技術","imp":2,"q":"ビットコインのように、インターネット上で取引され、国家や中央銀行による価値の裏付けがない電子的な財産的価値を、日本の法律では何とよぶか。","a":"暗号資産","e":"2019年の資金決済法の改正（2020年施行）で、それまでの「仮想通貨」から名称が変更された。ブロックチェーンなどの技術で取引が記録される。法定通貨ではなく価格の変動が大きいため、投機の対象になりやすい。暗号資産の交換業者は金融庁への登録が必要である。"},{"t":"ex","s":"キャッシュレスと新技術","imp":1,"q":"暗号資産と、日本銀行券のような法定通貨との違いを説明せよ。","a":"法定通貨は、国が法律で支払いの手段として通用する力（強制通用力）を認め、中央銀行が発行量を管理する通貨であり、価値が比較的安定している。暗号資産は、インターネット上で取引される電子的な財産的価値で、国家や中央銀行による価値の裏付けがなく、需要と供給によって価格が大きく変動する。また、支払いに受け取ってもらえるとは限らない。","e":"ポイント：①法定通貨＝法律による強制通用力があり中央銀行が管理する ②暗号資産＝国家・中央銀行の裏付けがない ③価格変動が大きく、支払いに使える保証もない。"},{"t":"qa","s":"キャッシュレスと新技術","imp":2,"q":"金融（Finance）と技術（Technology）を組み合わせた造語で、スマートフォンによる決済やAIを使った資産運用など、情報技術を活用した新しい金融サービスを何というか。","a":"フィンテック","alt":["FinTech","Fintech","FINTECH"],"e":"銀行などの既存の金融機関だけでなく、IT企業なども参入している。送金や決済が便利になる一方、個人情報の保護やサイバー攻撃への対策などの課題もある。"},{"t":"qa","s":"キャッシュレスと新技術","imp":1,"q":"インターネットを通じて、事業やプロジェクトに賛同する不特定多数の人から、少額ずつ資金を集めるしくみを何というか。","a":"クラウドファンディング","e":"群衆（crowd）と資金調達（funding）を組み合わせた言葉である。お礼の品などを受け取る購入型、見返りのない寄付型、利益の分配を受ける投資型などがある。金融機関を通さずに資金を集められる新しい資金調達の方法である。"},{"t":"tf","s":"キャッシュレスと新技術","imp":1,"q":"中央銀行デジタル通貨（CBDC）とは、民間企業が発行する暗号資産のうち、中央銀行が価値を保証したもののことである。","a":false,"e":"誤り。正しくは、中央銀行デジタル通貨とは、円などの法定通貨建てで中央銀行自身が発行するデジタル形式の通貨である。中国はデジタル人民元の実証実験を進めており、日本銀行も実証実験を行っているが、発行するかどうかは決まっていない。"}]});</script>
<script>QDATA.push({"unit":"u18","questions":[{"t":"qa","s":"財政の三機能","imp":3,"q":"財政の三つの機能を答えよ。","a":"資源配分の調整・所得の再分配・経済の安定化","alt":["資源配分の調整、所得の再分配、経済の安定化","資源配分機能・所得再分配機能・経済安定化機能","資源の適正配分・所得の再分配・景気の安定化","資源配分の調整・所得の再分配・景気の安定化"],"e":"財政とは、国や地方公共団体が税などで収入を得て、公共サービスなどに支出する経済活動である。市場経済だけではうまくいかない部分を補うために、この三つの機能を果たす。"},{"t":"qa","s":"財政の三機能","imp":3,"q":"道路・公園・警察・消防のように、市場にまかせると十分に供給されないものを、政府が税を使って供給する財政の機能を何というか。","a":"資源配分の調整","alt":["資源配分機能","資源の適正配分","資源配分の調整機能","資源配分"],"e":"道路や警察などの公共財は、料金を払わない人を利用から排除しにくい（非排除性）、多くの人が同時に利用できる（非競合性）という性質をもつ。そのため民間企業は利益を上げにくく、市場では十分に供給されない。"},{"t":"qa","s":"財政の三機能","imp":3,"q":"累進課税制度や社会保障制度を通じて、所得の格差を縮小させる財政の機能を何というか。","a":"所得の再分配","alt":["所得再分配","所得の再分配機能","所得再分配機能"],"e":"高所得者から多くの税を集め、生活保護や年金などの社会保障給付として所得の少ない人に配分する。市場経済のもとで生じる所得の格差を是正するはたらきである。"},{"t":"mc","s":"財政の三機能","imp":2,"q":"次の政策のうち、財政の「所得の再分配」の機能に最もよくあてはまるものを一つ選べ。","c":["所得の多い人ほど高い税率を課す所得税の税収を、生活保護費の財源にあてる。","民間企業では供給されにくい一般道路や橋を、税金を使って整備する。","不況期に、政府が公共事業を増やして需要をつくり出す。","景気が過熱しているときに、政府が公共事業を減らす。"],"a":0,"e":"累進課税で集めた税を生活保護にあてるのは、所得の格差を縮める所得の再分配である。道路や橋の整備は公共財を供給する資源配分の調整なので誤り。不況期の公共事業の拡大や好況期の公共事業の削減は、景気を安定させる経済の安定化の機能なので誤り。"},{"t":"tf","s":"財政の三機能","imp":2,"q":"公共財は、料金を支払わない人を利用から排除することが難しいため、民間企業にまかせると十分に供給されない。","a":true,"e":"正しい。料金を払わずに利用する人（フリーライダー）が出るため、民間企業は費用を回収しにくい。そこで政府が税を財源として公共財を供給する。これが財政の資源配分の調整機能である。"},{"t":"ex","s":"財政の三機能","imp":1,"q":"財政の所得の再分配機能について、税と社会保障の両面から説明せよ。","a":"所得の再分配とは、市場経済のもとで生じる所得の格差を、財政を通じて縮小させるはたらきである。収入の面では、所得の多い人ほど高い税率を課す累進課税制度や相続税によって、高所得者から多くの税を集める。支出の面では、その財源を生活保護や年金・医療などの社会保障給付にあてて、所得の少ない人の生活を支える。","e":"ポイント：①市場で生じる所得格差の縮小 ②税の面＝累進課税・相続税で高所得者により多く負担させる ③支出の面＝社会保障給付で所得の少ない人を支える。"},{"t":"qa","s":"景気の安定化","imp":3,"q":"累進課税制度や雇用保険の失業給付などのように、財政のしくみ自体に組み込まれていて、景気の変動を自動的に小さくするはたらきを何というか。","a":"ビルト・イン・スタビライザー","alt":["ビルトイン・スタビライザー","ビルトインスタビライザー","自動安定化装置","財政の自動安定化装置","自動安定化機能"],"e":"政府が新たに政策を決めなくても自動的にはたらく点が特徴である。好況期には税収が増え失業給付が減って需要を抑え、不況期には税負担が軽くなり失業給付が増えて需要を支える。"},{"t":"qa","s":"景気の安定化","imp":3,"q":"政府が景気の状況に応じて、公共投資の増減や増税・減税を意図的に行い、景気を調整する財政政策を何というか。","a":"フィスカル・ポリシー","alt":["フィスカルポリシー","裁量的財政政策","補整的財政政策","伸縮的財政政策"],"e":"不況期には減税や公共投資の拡大で有効需要を増やし、好況期には増税や公共投資の削減で需要を抑える。ケインズの有効需要の理論にもとづく政策である。"},{"t":"tf","s":"景気の安定化","imp":2,"q":"好況期には、所得の増加にともなって累進課税制度により税収が自動的に増え、失業給付も減るため、総需要の拡大が抑えられる。","a":true,"e":"正しい。これがビルト・イン・スタビライザーのはたらきである。所得が増えると、より高い税率が適用される部分が増えるため、税収は所得の伸び以上に増えやすい。"},{"t":"mc","s":"景気の安定化","imp":3,"q":"不況期に政府がとるフィスカル・ポリシーとして最も適当なものを一つ選べ。","c":["減税を行い、公共投資を増やす。","増税を行い、公共投資を減らす。","日本銀行が政策金利を引き下げる。","財政収支を黒字にするため、歳出を大幅に削減する。"],"a":0,"e":"不況期には、減税で家計や企業の手元に残る所得を増やし、公共投資を増やして需要をつくり出す。増税と公共投資の削減は好況期の政策なので誤り。政策金利の引下げは日本銀行が行う金融政策であり、財政政策ではないので誤り。不況期に歳出を大幅に削減すると需要がさらに減って景気が悪化するので誤り。"},{"t":"ex","s":"景気の安定化","imp":2,"q":"ビルト・イン・スタビライザーが、不況期に景気の悪化をやわらげるしくみを説明せよ。","a":"不況期には所得が減るため、累進課税制度のもとでは適用される税率が下がり、税負担が所得の減少以上に軽くなって、家計の可処分所得の落ち込みが小さくなる。また、失業者が増えると雇用保険の失業給付などの社会保障給付が増える。これらが政府の新たな決定なしに自動的にはたらいて需要の減少をやわらげ、景気の悪化を緩和する。","e":"ポイント：①累進課税により税負担が自動的に軽くなる ②失業給付など社会保障給付が自動的に増える ③政府の裁量なしに需要の落ち込みを緩和する。"},{"t":"tf","s":"景気の安定化","imp":2,"q":"フィスカル・ポリシーとは、累進課税制度や失業給付のように、政府が何もしなくても景気の変動を自動的に小さくするしくみのことである。","a":false,"e":"誤り。正しくは、それはビルト・イン・スタビライザー（自動安定化装置）の説明である。フィスカル・ポリシーは、政府が公共投資の増減や減税・増税を意図的に行う裁量的な財政政策であり、補正予算の編成や税法の改正に国会の議決が必要なため、実施までに時間がかかることがある。"},{"t":"qa","s":"景気の安定化","imp":2,"q":"財政政策と金融政策など、複数の政策を組み合わせて実施し、景気の安定や経済成長などの目標を同時に達成しようとすることを何というか。","a":"ポリシー・ミックス","alt":["ポリシーミックス"],"e":"たとえば不況期に、政府が公共投資を増やすと同時に、日本銀行が金融緩和を行うことがあげられる。為替政策なども組み合わされる。"},{"t":"qa","s":"予算の種類","imp":2,"q":"国の基本的な活動にかかわる歳入・歳出を経理する、国の中心となる会計を何というか。","a":"一般会計","e":"国の予算には、一般会計のほかに、特定の事業や資金を区分して経理する特別会計と、日本政策金融公庫などの政府関係機関の予算があり、いずれも国会の議決が必要である。"},{"t":"qa","s":"予算の種類","imp":2,"q":"年金や国債の償還、外国為替資金など、特定の事業を行う場合や特定の資金を運用する場合に、一般会計と区別して設けられる会計を何というか。","a":"特別会計","e":"特別会計の歳出総額は、会計間の重複を除いても一般会計を上回る規模である。数が多く複雑で、無駄づかいの温床になっているとの批判から、統廃合が進められてきた。"},{"t":"qa","s":"予算の種類","imp":3,"q":"年度の途中で、災害や経済情勢の変化などにより、当初の予算の内容を変更する必要が生じたときに組まれる予算を何というか。","a":"補正予算","e":"年度当初に成立する予算を本予算（当初予算）という。補正予算も国会の議決が必要である。近年は、景気対策や災害対応のために大規模な補正予算が組まれることが多い。"},{"t":"qa","s":"予算の種類","imp":3,"q":"新しい会計年度が始まるまでに本予算が成立しない場合に、本予算が成立するまでの間の必要な経費をまかなうために組まれる予算を何というか。","a":"暫定予算","e":"本予算が成立すると、暫定予算は本予算に吸収される。年度の途中で本予算の内容を変更する補正予算とまちがえないようにしよう。"},{"t":"qa","s":"予算の種類","imp":1,"q":"日本の国の会計年度は、何月何日から翌年の何月何日までか。","a":"4月1日から翌年3月31日まで","alt":["4月1日から3月31日まで","4月1日から3月31日","4月1日～3月31日","4月1日〜3月31日","4月1日〜翌年3月31日","4月1日～翌年3月31日"],"e":"財政法で定められている。予算は会計年度ごとに作成され、各年度の支出はその年度の収入でまかなうことが原則とされる（会計年度独立の原則）。"},{"t":"mc","s":"予算の種類","imp":2,"q":"3月末になっても国会で翌年度の本予算が成立せず、4月からの公務員の給与の支払いなどに支障が出るおそれがある。このとき政府が編成する予算として最も適当なものを一つ選べ。","c":["暫定予算","補正予算","特別会計予算","政府関係機関予算"],"a":0,"e":"本予算の成立までのつなぎとして必要な経費を計上するのが暫定予算である。補正予算は成立した本予算の内容を年度の途中で変更する予算なので誤り。特別会計予算や政府関係機関予算は本予算を構成する予算の種類であり、本予算が成立しないことへの対応策ではないので誤り。"},{"t":"tf","s":"予算の種類","imp":1,"q":"日本政策金融公庫などの政府関係機関の予算は、国会の議決を必要としない。","a":false,"e":"誤り。正しくは、政府関係機関予算も、一般会計予算・特別会計予算とともに国会に提出され、議決を受けなければならない。"},{"t":"qa","s":"予算の成立と決算","imp":2,"q":"国の予算を作成して国会に提出する権限をもつのはどこか。","a":"内閣","e":"各省庁の概算要求をもとに財務省が査定して予算案をまとめ、内閣が閣議決定して国会に提出する。国会は予算を審議・議決するが、予算を作成・提出する権限はもたない。"},{"t":"tf","s":"予算の成立と決算","imp":3,"q":"予算は、衆議院と参議院のどちらに先に提出してもよい。","a":false,"e":"誤り。正しくは、予算は先に衆議院に提出しなければならない（衆議院の予算先議権、憲法第60条）。参議院が衆議院と異なる議決をして両院協議会でも意見が一致しないとき、または参議院が衆議院の可決した予算を受け取ってから30日以内に議決しないときは、衆議院の議決が国会の議決となる。"},{"t":"qa","s":"予算の成立と決算","imp":3,"q":"国の収入・支出の決算を毎年検査する、内閣から独立した地位をもつ機関を何というか。","a":"会計検査院","e":"憲法第90条にもとづき、内閣は会計検査院の検査報告とともに決算を国会に提出する。予算が適正に使われたかを事後に確認するしくみである。"},{"t":"mc","s":"予算の成立と決算","imp":1,"q":"国の予算の作成から決算までの流れについての記述として最も適当なものを一つ選べ。","c":["各省庁の概算要求をもとに財務省が査定して予算案をまとめ、内閣が閣議決定して国会に提出する。","予算案は国会議員が作成し、内閣の承認を得て成立する。","予算案は参議院で先に審議され、その後で衆議院で審議される。","決算は会計検査院が作成し、最高裁判所の承認を受けて確定する。"],"a":0,"e":"予算の作成・提出は内閣の権限であり、国会議員が作成するとする記述は誤り。予算は衆議院が先に審議するので誤り。決算は内閣が作成し、会計検査院の検査報告とともに国会に提出するので、最高裁判所の承認を受けるとする記述は誤り。"},{"t":"qa","s":"財政と憲法","imp":3,"q":"「国の財政を処理する権限は、国会の議決に基いて、これを行使しなければならない。」と定め、財政民主主義を示した日本国憲法の条文は第何条か。","a":"第83条","alt":["83条","憲法83条","憲法第83条","日本国憲法第83条","第八十三条"],"e":"国の財政は、国民の代表である国会の議決にもとづいて運営されなければならないという原則（財政国会中心主義）である。第84条の租税法律主義、第86条の予算の議決などがこれを具体化している。"},{"t":"qa","s":"財政と憲法","imp":3,"q":"「あらたに租税を課し、又は現行の租税を変更するには、法律又は法律の定める条件によることを必要とする。」という日本国憲法第84条に示された原則を何というか。","a":"租税法律主義","e":"税の種類や税率、納税義務者などは、国民の代表である国会が定める法律で決めなければならない。「代表なくして課税なし」という考え方にもとづく。"},{"t":"tf","s":"財政と憲法","imp":2,"q":"日本国憲法第89条は、公金を宗教上の組織・団体のために支出することや、公の支配に属しない慈善・教育・博愛の事業に支出することを禁止している。","a":true,"e":"正しい。宗教団体への公金支出の禁止は、政教分離を財政面から保障するものである。私立学校への助成については、法律による監督を受けているため公の支配に属しているとして、認められると解釈されている。"},{"t":"ex","s":"財政と憲法","imp":1,"q":"財政民主主義とは何か、日本国憲法の規定にふれて説明せよ。","a":"財政民主主義とは、国の財政は国民の代表である国会の議決にもとづいて運営されなければならないという原則である。日本国憲法は第83条でこれを定め、新たな課税には法律が必要とする租税法律主義（第84条）、予算は国会の審議と議決を経ること（第86条）、決算は会計検査院の検査を受けて国会に提出すること（第90条）などを規定している。","e":"ポイント：①国民の代表である国会の議決にもとづく財政運営 ②憲法第83条 ③租税法律主義（第84条）・予算の議決（第86条）・決算の国会提出（第90条）。"},{"t":"mc","s":"財政と憲法","imp":2,"q":"財政に関する日本国憲法の規定として適当でないものを一つ選べ。","c":["新たに租税を課すには、内閣が定める政令によらなければならない。","国費を支出し、または国が債務を負担するには、国会の議決にもとづくことが必要である。","予見しがたい予算の不足にあてるため、国会の議決にもとづいて予備費を設けることができる。","国の収入支出の決算は、すべて毎年会計検査院が検査する。"],"a":0,"e":"第84条の租税法律主義により、新たな課税には法律またはその定める条件が必要であり、政令によるとする記述は誤り。国費の支出や債務負担に国会の議決が必要なことは第85条、予備費は第87条、会計検査院による決算の検査は第90条に定められている。"}]});</script>
