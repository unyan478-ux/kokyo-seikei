領海に含まれ、沿岸国の主権がすべて及ぶ。"],"a":2,"e":"国家の領域は領土・領海・領空からなり、領海は基線から12海里までである。領空は領土と領海の上空だが、宇宙空間は含まれない（宇宙条約で領有が禁止されている）ので誤り。排他的経済水域では外国船舶の航行は自由なので、『許可がなければ航行できない』は誤り。接続水域は領海の外側にあり、通関・出入国管理などの規制ができるだけなので、『領海に含まれ、主権がすべて及ぶ』は誤り。"},{"t":"tf","s":"国家の領域","imp":2,"q":"排他的経済水域の上空は沿岸国の領空にあたるため、外国の航空機は沿岸国の許可なく飛行することができない。","a":false,"e":"誤り。正しくは、領空は領土と領海の上空に限られ、排他的経済水域の上空は領空ではない。排他的経済水域では、外国の船舶の航行や航空機の上空飛行は自由である。"},{"t":"qa","s":"国家の領域","imp":1,"q":"宇宙空間の探査・利用の自由を認める一方、月その他の天体を含む宇宙空間をいずれの国も領有できないと定め、1967年に発効した条約を何というか。","a":"宇宙条約","alt":["宇宙天体条約"],"e":"核兵器などの大量破壊兵器を地球を回る軌道に乗せることや、天体に軍事基地を設けることも禁止している。国家の領空は領土・領海の上空に限られ、宇宙空間には及ばない。"},{"t":"tf","s":"国家の領域","imp":1,"q":"南極条約は、南極地域に対する各国の領土権の主張を凍結し、南極の軍事利用を禁止して平和的利用に限っている。","a":true,"e":"正しい。南極条約は1959年に採択され、1961年に発効した。日本も原署名国である。科学的調査の自由と国際協力を定め、核爆発や放射性廃棄物の処分も禁止している。"},{"t":"qa","s":"国際司法機関","imp":3,"q":"国連の主要機関の一つで、オランダのハーグに置かれ、国家間の紛争を国際法にもとづいて裁判する機関を何というか。","a":"国際司法裁判所","alt":["ICJ"],"e":"国際司法裁判所（ICJ）は、総会と安全保障理事会が選ぶ15人の裁判官（任期9年）で構成される。裁判の当事者になれるのは国家だけで、個人や企業は訴えることができない。前身は国際連盟時代の常設国際司法裁判所である。"},{"t":"tf","s":"国際司法機関","imp":3,"q":"国際司法裁判所では、紛争当事国の一方が訴えれば、相手国が同意しなくても裁判が開始される。","a":false,"e":"誤り。正しくは、国際司法裁判所で裁判を行うには、原則として紛争当事国双方の同意が必要である（あらかじめ強制管轄権を受け入れる宣言をしている国どうしなどを除く）。日本は竹島問題を国際司法裁判所に付託することを提案してきたが、韓国が同意しないため裁判は開かれていない。"},{"t":"qa","s":"国際司法機関","imp":2,"q":"国際司法裁判所が、国連総会や安全保障理事会などの要請に応じて、法律問題について示す見解を何というか。","a":"勧告的意見","e":"判決と違って法的拘束力はないが、国際法の解釈として大きな権威をもつ。核兵器の威嚇・使用の合法性（1996年）や、イスラエルがパレスチナ占領地に建設した分離壁（2004年）について示された例がある。"},{"t":"qa","s":"国際司法機関","imp":3,"q":"集団殺害犯罪（ジェノサイド）や戦争犯罪など、国際社会全体にとって最も重大な犯罪を犯した個人を裁くため、2002年に設立条約（ローマ規程）が発効して設けられた常設の裁判所を何というか。","a":"国際刑事裁判所","alt":["ICC"],"e":"対象となる犯罪は、集団殺害犯罪・人道に対する犯罪・戦争犯罪・侵略犯罪の4つである。各国の国内裁判所が裁く意思や能力をもたない場合に補完的に裁く（補完性の原則）。本部はオランダのハーグにある。"},{"t":"ex","s":"国際司法機関","imp":3,"q":"国際司法裁判所と国際刑事裁判所の違いを、裁判の対象と設置の根拠に着目して説明せよ。","a":"国際司法裁判所は国連の主要機関で、国家間の紛争を裁判し、裁判には原則として紛争当事国双方の同意が必要である。これに対し国際刑事裁判所は、ローマ規程という条約にもとづいて国連とは別に設けられた常設の裁判所で、集団殺害や戦争犯罪などの重大な犯罪を犯した個人の刑事責任を裁く。","e":"ポイント：①国際司法裁判所は国家間の紛争、国際刑事裁判所は個人を裁く ②国際司法裁判所は国連の主要機関、国際刑事裁判所は条約にもとづく独立の機関 ③国際司法裁判所の裁判には当事国の同意が必要 ④どちらもハーグにある"},{"t":"mc","s":"国際司法機関","imp":2,"q":"国際刑事裁判所（ICC）についての記述として最も適当なものを一つ選べ。","c":["国連の主要機関の一つであり、国連加盟国はすべて自動的に締約国となる。","日本は2007年に加盟したが、アメリカ・中国・ロシアは加盟していない。","国家間の領土紛争を、紛争当事国の同意にもとづいて裁判する。","裁判の対象となる犯罪は、侵略犯罪に限られている。"],"a":1,"e":"日本は2007年にローマ規程に加入し、現在は最大の分担金拠出国となっている。アメリカ・中国・ロシアは加盟していない。ICCは条約にもとづく国連とは別の機関で、加盟は各国の判断によるので、『主要機関』『自動的に締約国』は誤り。国家間の紛争を当事国の同意にもとづいて裁くのは国際司法裁判所である。対象犯罪は集団殺害犯罪・人道に対する犯罪・戦争犯罪・侵略犯罪の4つなので、『侵略犯罪に限られている』は誤り。"},{"t":"tf","s":"国際司法機関","imp":1,"q":"国際刑事裁判所は独自の警察組織をもっているため、締約国の協力がなくても被疑者を逮捕して裁判にかけることができる。","a":false,"e":"誤り。正しくは、国際刑事裁判所は独自の警察力をもたず、被疑者の逮捕や引き渡しは締約国の協力に頼っている。2023年には、ウクライナの占領地から子どもをロシアに不法に移送した疑いでロシアのプーチン大統領に逮捕状を出したが、ロシアは非加盟であり、引き渡しには応じていない。"},{"t":"qa","s":"国際司法機関","imp":2,"q":"フィリピンが中国を相手に申し立てた南シナ海をめぐる仲裁裁判で、2016年に中国の主張する「九段線」内の歴史的権利には国際法上の根拠がないとする判断が示された。この仲裁裁判の手続を担った、オランダのハーグにある機関を何というか。","a":"常設仲裁裁判所","alt":["PCA"],"e":"常設仲裁裁判所は1899年の第1回ハーグ平和会議で設けられた。この仲裁裁判は国連海洋法条約にもとづくものだったが、中国は手続に参加せず、判断を「無効」として受け入れていない。国際裁判の判断を強制的に実現する手段が乏しいという、国際法の限界を示す例である。"},{"t":"tf","s":"国際司法機関","imp":1,"q":"日本は、南極海での調査捕鯨をめぐってオーストラリアから国際司法裁判所に訴えられ、2014年に日本の調査捕鯨は国際捕鯨取締条約に違反するとする判決が出された。","a":true,"e":"正しい。日本は国際司法裁判所の強制管轄権を受け入れる宣言（選択条項受諾宣言）をしていたため、オーストラリアの一方的な提訴で裁判が行われた。日本は判決に従い、当時の南極海での調査捕鯨を中止した。"},{"t":"qa","s":"勢力均衡と集団安全保障","imp":3,"q":"対立する国家や国家群が、同盟を結ぶなどして互いの軍事力のつり合いを保つことで戦争を防ごうとする考え方を何というか。","a":"勢力均衡","alt":["バランス・オブ・パワー","勢力均衡方式","勢力均衡政策"],"e":"17世紀以降のヨーロッパで主流となった考え方である。相手より優位に立とうとして軍備拡張競争を招きやすく、均衡が崩れると大戦争につながる。三国同盟と三国協商の対立が第一次世界大戦を招いたことがその例とされる。"},{"t":"qa","s":"勢力均衡と集団安全保障","imp":3,"q":"対立する国も含めて多くの国が一つの国際機構に加盟して互いに武力を行使しないことを約束し、約束を破った国に対しては加盟国全体で制裁を加えることで平和を守る仕組みを何というか。","a":"集団安全保障","alt":["集団安全保障体制","集団安全保障方式"],"e":"国際連盟で初めて採用され、国際連合に受け継がれた。同盟国が攻撃されたときに共同で反撃する集団的自衛権とは異なる考え方なので、混同しないこと。"},{"t":"ex","s":"勢力均衡と集団安全保障","imp":3,"q":"勢力均衡と集団安全保障の違いを説明せよ。","a":"勢力均衡は、対立する国家や同盟どうしが軍事力のつり合いを保つことで互いに攻撃を思いとどまらせる方式だが、軍拡競争を招き、均衡が崩れると戦争になりやすい。集団安全保障は、対立する国も含めて一つの国際機構に加盟し、武力行使を禁止したうえで、違反した国に加盟国全体で制裁を加える方式である。","e":"ポイント：①勢力均衡＝対立する同盟どうしの力のつり合い ②集団安全保障＝対立国も含む一つの機構による違反国への制裁 ③勢力均衡の欠点（軍拡競争、第一次世界大戦） ④集団安全保障は国際連盟で初めて採用され、国際連合が継承"},{"t":"mc","s":"勢力均衡と集団安全保障","imp":2,"q":"次の事例のうち、集団安全保障の考え方にもとづく行動として最も適当なものを一つ選べ。","c":["A国は、対立するB国に対抗するため、C国と軍事同盟を結んで軍備を増強した。","国際機構の加盟国が、他の加盟国を侵略したD国に対して、共同で経済制裁を加えた。","E国は、自国が攻撃された場合に備えて、国境沿いに軍隊を配備した。","F国は、同盟国G国が攻撃を受けたので、G国とともに攻撃国に反撃した。"],"a":1,"e":"集団安全保障は、国際機構の加盟国全体で、ルールを破った侵略国に制裁を加える仕組みであり、加盟国が共同で侵略国に経済制裁を加える例があてはまる。同盟を結んで対立国に対抗するのは勢力均衡の考え方である。自国への攻撃に備えて自国の軍隊を配備するのは、個別的自衛のための行動である。同盟国が攻撃されたときに共同で反撃するのは、集団的自衛権の行使にあたる。"},{"t":"qa","s":"勢力均衡と集団安全保障","imp":2,"q":"1795年に『永遠平和のために』を著し、常備軍の廃止や、自由な諸国家による連合（平和連合）を通じた永遠平和の実現を説いたドイツの哲学者は誰か。","a":"カント","alt":["イマヌエル・カント","I.カント"],"e":"各国の政治体制は共和制であるべきだとし、国家間の連合による平和の構想を示した。この考え方は、国際連盟や国際連合の思想的な源流とされる。"},{"t":"mc","s":"勢力均衡と集団安全保障","imp":2,"q":"1918年にアメリカのウィルソン大統領が発表した「14か条の平和原則」に含まれる内容として適当でないものを一つ選べ。","c":["秘密外交の廃止","軍備の縮小","民族自決","常任理事国による拒否権の確立"],"a":3,"e":"14か条には、秘密外交の廃止、海洋の自由、軍備縮小、民族自決、国際平和機構の設立などが含まれ、国際平和機構の提案が国際連盟の設立につながった。拒否権は、第二次世界大戦末期のヤルタ会談で合意された国際連合の安全保障理事会の仕組みであり、14か条とは関係がない。"},{"t":"mc","s":"勢力均衡と集団安全保障","imp":1,"q":"国際社会の平和や秩序について論じた人物と、その主張の組合せとして最も適当なものを一つ選べ。","c":["グロティウス－自然法の立場から、戦争においても守られるべき法があると説いた。","カント－14か条の平和原則で、国際平和機構の設立を提唱した。","ウィルソン－『永遠平和のために』で、常備軍の廃止を説いた。","ホッブズ－『海洋自由論』で、公海自由の原則の基礎を示した。"],"a":0,"e":"グロティウスは『戦争と平和の法』で、自然法にもとづき戦争にも守るべき法があると説いた。14か条の平和原則で国際平和機構の設立を提唱したのはウィルソン、『永遠平和のために』で常備軍の廃止を説いたのはカントであり、両者が入れ替わっている。『海洋自由論』を著したのはグロティウスであり、ホッブズは『リヴァイアサン』で社会契約説を説いた人物である。"}]});</script>
<script>QDATA.push({"unit":"u12","questions":[{"t":"qa","s":"国際連盟","imp":3,"q":"アメリカのウィルソン大統領の提唱をもとにヴェルサイユ条約によって設立が決まり、1920年に発足した、集団安全保障の考え方を初めて取り入れた国際機構を何というか。","a":"国際連盟","e":"本部はスイスのジュネーブに置かれた（国際連合の本部はニューヨーク）。総会・理事会・事務局を主要機関とし、常設国際司法裁判所や国際労働機関（ILO）も設けられた。日本はイギリス・フランス・イタリアとともに常任理事国となり、新渡戸稲造が事務次長を務めた。"},{"t":"mc","s":"国際連盟","imp":3,"q":"国際連盟の問題点についての記述として適当でないものを一つ選べ。","c":["総会や理事会の議決が原則として全会一致制であったため、迅速な意思決定が難しかった。","侵略国などに対する制裁は経済制裁が中心で、軍事的な制裁は事実上できなかった。","提唱国であるアメリカが、上院の反対によって加盟しなかった。","常任理事国に拒否権が認められていたため、大国が反対すると制裁を決定できなかった。"],"a":3,"e":"拒否権は国際連合の安全保障理事会の常任理事国に認められた制度で、国際連盟にはない（連盟は全会一致制なので、どの加盟国も反対すれば議決を阻止できた）。全会一致制、経済制裁が中心で軍事制裁がほとんどできなかったこと、アメリカの不参加は、いずれも国際連盟の弱点として正しい。"},{"t":"tf","s":"国際連盟","imp":2,"q":"国際連盟からは1930年代に日本・ドイツ・イタリアが相次いで脱退し、ソ連はフィンランドへの侵攻を理由に除名された。","a":true,"e":"正しい。日本は満州事変をめぐるリットン調査団の報告にもとづく勧告に反発して1933年に脱退を通告し、ドイツも同年に脱退を通告した。イタリアはエチオピア侵攻で経済制裁を受けた後の1937年に脱退した。1934年に加盟したソ連は1939年に除名された。"},{"t":"ex","s":"国際連盟","imp":2,"q":"国際連盟が第二次世界大戦を防ぐことができなかった理由を、制度上の問題点と大国の動向にふれて説明せよ。","a":"国際連盟は総会・理事会の議決を全会一致制としたため、実効性のある決定を迅速に行うことが難しかった。また、侵略国への制裁は経済制裁が中心で、軍事的な制裁の手段をもたなかった。さらに、アメリカが加盟せず、日本・ドイツ・イタリアの脱退やソ連の除名もあって、大国の協力が得られなかった。","e":"ポイント：①全会一致制 ②経済制裁が中心で軍事制裁ができない ③アメリカの不参加 ④日独伊の脱退・ソ連の除名"},{"t":"qa","s":"国際連盟","imp":2,"q":"1928年に締結され、国際紛争を解決するために戦争に訴えることを否認し、国家の政策の手段としての戦争を放棄することを定めた条約を何というか。","a":"不戦条約","alt":["パリ不戦条約","ケロッグ・ブリアン条約","ブリアン・ケロッグ条約","戦争放棄に関する条約"],"e":"アメリカのケロッグ国務長官とフランスのブリアン外相の提唱による。戦争の違法化を進めた点で画期的だったが、自衛のための戦争は禁止されないと解釈され、違反に対する制裁の規定もなかった。日本も締結し、その文言は日本国憲法第9条にも影響を与えたとされる。"},{"t":"qa","s":"国際連合の成立","imp":1,"q":"1941年にアメリカのフランクリン・ローズベルト大統領とイギリスのチャーチル首相が発表し、戦後の平和構想として国際連合の理念の出発点となった文書を何というか。","a":"大西洋憲章","e":"領土不拡大、民族自決、より広く恒久的な一般的安全保障制度の確立などをうたった。その後、1944年のダンバートン・オークス会議で国際連合憲章の原案がつくられた。"},{"t":"mc","s":"国際連合の成立","imp":2,"q":"国際連合の成立にかかわる次の出来事を古い順に並べたとき、3番目にくるものを一つ選べ。","c":["大西洋憲章の発表","ダンバートン・オークス会議での憲章原案の作成","ヤルタ会談での安全保障理事会の表決方式の合意","サンフランシスコ会議での国際連合憲章の採択"],"a":2,"e":"大西洋憲章（1941年8月）→ダンバートン・オークス会議（1944年8〜10月）→ヤルタ会談（1945年2月）→サンフランシスコ会議（1945年4〜6月）の順である。ダンバートン・オークス会議で米英ソ中が憲章の原案をつくり、そこで決まらなかった安全保障理事会の表決方式（拒否権）をヤルタ会談で米英ソが合意した。サンフランシスコ会議には50か国が参加し、国際連合憲章が採択・署名された。"},{"t":"qa","s":"国際連合の成立","imp":3,"q":"国際連合憲章が発効し、国際連合が正式に発足した年月日はいつか。","a":"1945年10月24日","alt":["1945.10.24","昭和20年10月24日"],"e":"この日は毎年「国連デー」とされている。原加盟国は51か国で、本部はアメリカのニューヨークに置かれた。"},{"t":"qa","s":"国際連合の成立","imp":3,"q":"日本が国際連合に加盟したのは何年か。","a":"1956年","alt":["昭和31年","1956"],"e":"1956年10月の日ソ共同宣言でソ連と国交を回復し、それまで安全保障理事会で日本の加盟に反対してきたソ連が賛成に回ったため、同年12月に80番目の加盟国となった。"},{"t":"tf","s":"国際連合の成立","imp":2,"q":"国際連合の加盟国数は、2011年の南スーダンの加盟によって200か国を超えた。","a":false,"e":"誤り。正しくは、南スーダンの加盟で193か国となり、現在もこの数である。原加盟国は51か国だったが、1960年前後のアフリカ諸国の独立や、1990年代の旧ソ連・旧ユーゴスラビア諸国の加盟で大きく増えた。バチカン（ローマ教皇庁）やパレスチナはオブザーバーであり、加盟国ではない。"},{"t":"qa","s":"国連の主要機関","imp":2,"q":"国際連合の主要機関は6つある。総会・安全保障理事会・経済社会理事会・国際司法裁判所・事務局と、もう一つは何か。","a":"信託統治理事会","e":"信託統治理事会は、独立していない信託統治地域の施政を監督する機関で、1994年に最後の信託統治地域パラオが独立したため、現在は活動を停止している。主要機関と、専門機関や補助機関とを区別して覚えること。"},{"t":"mc","s":"国連の主要機関","imp":2,"q":"国際連合の主要機関とその役割の組合せとして最も適当なものを一つ選べ。","c":["総会－国際の平和と安全の維持に主要な責任を負い、加盟国を拘束する決定を行う。","経済社会理事会－経済・社会・文化・保健・人権などの分野で、専門機関と連携して活動する。","事務局－国家間の紛争を、国際法にもとづいて裁判する。","国際司法裁判所－戦争犯罪などを犯した個人を裁く。"],"a":1,"e":"経済社会理事会は54か国で構成され、専門機関と連携協定を結んで活動を調整し、NGOに協議資格を与えて協力している。国際の平和と安全の維持に主要な責任を負い、加盟国を拘束する決定を行うのは安全保障理事会であり、総会の決議は勧告にとどまる。国家間の紛争を裁判するのは国際司法裁判所であって事務局ではない。個人の戦争犯罪などを裁くのは国際刑事裁判所である。"},{"t":"qa","s":"国連の主要機関","imp":2,"q":"国際連合の主要機関の一つで、総会で選ばれる54か国の理事国で構成され、経済・社会・文化・保健・人権などの問題を扱い、専門機関やNGOと連携する機関を何というか。","a":"経済社会理事会","alt":["経社理","ECOSOC"],"e":"理事国の任期は3年である。ILO・UNESCO・WHOなどの専門機関とは連携協定を結んで活動を調整し、NGOには協議資格を与えて意見を聞いている。"},{"t":"qa","s":"国連の主要機関","imp":1,"q":"国連事務局の長であり、安全保障理事会の勧告にもとづいて総会が任命する、国連の行政上の最高責任者を何というか。","a":"事務総長","alt":["国連事務総長","国際連合事務総長"],"e":"任期は5年で、再任できる。国際の平和と安全を脅かすと考える問題について、安全保障理事会の注意を促すことができる（憲章第99条）。事務総長や事務局職員は、特定の国の利益を代表しない国際公務員である。"},{"t":"ex","s":"国連総会","imp":3,"q":"国連総会と安全保障理事会の違いを、構成・表決の方法・決定の効力に着目して説明せよ。","a":"総会はすべての加盟国で構成され、一国一票制のもと、重要問題は出席し投票する国の3分の2以上、その他は過半数で議決するが、決議は原則として勧告にとどまる。安全保障理事会は常任理事国5か国と非常任理事国10か国で構成され、常任理事国には拒否権があり、その決定は加盟国を法的に拘束する。","e":"ポイント：①総会＝全加盟国・一国一票 ②総会の議決（重要問題は3分の2、その他は過半数）と決議の効力（勧告） ③安保理＝15か国（常任5・非常任10）と拒否権 ④安保理の決定は加盟国を拘束する（憲章第25条）"},{"t":"mc","s":"国連総会","imp":2,"q":"国連総会についての記述として最も適当なものを一つ選べ。","c":["総会の決議は、安全保障理事会の決定と同様に、すべての加盟国を法的に拘束する。","総会の表決では、常任理事国だけに拒否権が認められている。","重要問題の議決には、出席し投票する加盟国の3分の2以上の賛成が必要である。","総会は、安全保障理事会の勧告がなくても、単独で新加盟国の加盟を承認できる。"],"a":2,"e":"総会は一国一票制で、重要問題（平和と安全に関する勧告、理事国の選挙、新加盟国の承認、予算など）は出席し投票する国の3分の2以上、その他の問題は過半数で議決する（憲章第18条）。総会の決議は原則として勧告であり、法的拘束力はない。拒否権は安全保障理事会の常任理事国がもつもので、総会にはない。新加盟国の承認は、安全保障理事会の勧告にもとづいて総会が決定する。"},{"t":"qa","s":"国連総会","imp":1,"q":"国連総会において、国の大小や人口にかかわらず、すべての加盟国が平等に1票ずつの投票権をもつしくみを何というか。","a":"一国一票制","alt":["一国一票","一国一票の原則"],"e":"主権平等の原則にもとづく。1960年代以降はアジア・アフリカの新興独立国の加盟で途上国が多数を占めるようになり、総会では途上国の主張が反映されやすくなった。"},{"t":"qa","s":"安全保障理事会","imp":3,"q":"国連安全保障理事会の5つの常任理事国をすべて答えよ。","a":"アメリカ・イギリス・フランス・ロシア・中国","alt":["アメリカ・イギリス・フランス・中国・ロシア","米・英・仏・露・中","米英仏露中","アメリカ・ロシア・イギリス・フランス・中国","アメリカ、イギリス、フランス、ロシア、中国"],"e":"第二次世界大戦の主要な戦勝国である。ソ連の地位は1991年にロシアが引き継ぎ、中国の代表権は1971年に中華民国（台湾）から中華人民共和国に移った。"},{"t":"qa","s":"安全保障理事会","imp":2,"q":"国連安全保障理事会の非常任理事国の数と任期を答えよ。","a":"10か国・任期2年","alt":["10か国、2年","10か国・2年","10・2年","10か国で任期2年"],"e":"非常任理事国は総会で選ばれ、毎年半数が改選される（連続して再選されることはできない）。日本は加盟国の中で最も多い12回、非常任理事国を務めている（12回目は2023〜24年）。"},{"t":"qa","s":"安全保障理事会","imp":3,"q":"国連安全保障理事会で、実質事項の決定について常任理事国が1か国でも反対すれば否決されることになる、常任理事国の権限を何というか。","a":"拒否権","e":"大国一致の原則にもとづく。常任理事国の棄権や欠席は、拒否権の行使とはみなさない慣行がある。冷戦期には米ソが拒否権を多く行使し、安全保障理事会がしばしば機能しなくなった。"},{"t":"ex","s":"安全保障理事会","imp":3,"q":"国連安全保障理事会の表決方法を、手続事項と実質事項に分けて説明せよ。","a":"安全保障理事会は15か国で構成される。手続事項は15か国のうち9か国以上の賛成で決定され、拒否権は適用されない。それ以外の実質事項は、9か国以上の賛成に加えて常任理事国の同意が必要であり、常任理事国が1か国でも反対すると否決される（拒否権）。常任理事国の棄権は反対とはみなされない。","e":"ポイント：①15か国中9か国以上の賛成 ②実質事項は常任理事国の同意が必要（大国一致の原則） ③手続事項には拒否権がない ④棄権は拒否権の行使とみなされない慣行"},{"t":"mc","s":"安全保障理事会","imp":2,"q":"国連安全保障理事会で、ある実質事項の決議案について採決が行われた。次の結果のうち、決議案が採択されるものを一つ選べ。","c":["賛成14か国、反対1か国（反対したのは常任理事国）","賛成9か国、反対0か国、棄権6か国（棄権のうち2か国は常任理事国）","賛成8か国、反対0か国、棄権7か国","賛成12か国、反対3か国（反対のうち1か国は常任理事国）"],"a":1,"e":"実質事項の採択には9か国以上の賛成が必要で、しかも常任理事国が1か国も反対していないことが条件となる。常任理事国の棄権は拒否権の行使とはみなされないため、賛成9・棄権6の場合は採択される。常任理事国が1か国でも反対すれば、賛成が14や12でも否決となる。賛成8では9か国に届かないので否決となる。"},{"t":"tf","s":"安全保障理事会","imp":2,"q":"安全保障理事会の手続事項の決定にも、常任理事国の拒否権が適用される。","a":false,"e":"誤り。正しくは、手続事項は15か国中9か国以上の賛成で決定され、拒否権は適用されない。拒否権が使えるのは、手続事項以外の実質事項である。"},{"t":"qa","s":"安全保障理事会","imp":3,"q":"安全保障理事会が常任理事国の拒否権によって機能しない場合に、総会が緊急特別総会を開いて、平和と安全のための集団的措置を加盟国に勧告できるとした1950年の総会決議を何というか。","a":"平和のための結集決議","alt":["平和のための結集"],"e":"朝鮮戦争中、安保理に復帰したソ連が拒否権を行使したことを背景に採択された。安保理の9か国または加盟国の過半数の要請があれば、24時間以内に緊急特別総会を開ける。ただし総会の決議は勧告であり、法的拘束力はない。"},{"t":"mc","s":"安全保障理事会","imp":2,"q":"ある国が隣国に侵攻し、安全保障理事会でその国を非難する決議案が出されたが、常任理事国の1か国が反対して否決された。この後に国連がとりうる行動として最も適当なものを一つ選べ。","c":["平和のための結集決議にもとづいて緊急特別総会を開き、侵攻した国を非難し撤退を求める決議を採択する。","総会が3分の2以上の賛成で安全保障理事会の決定を覆し、加盟国を法的に拘束する制裁を決定する。","事務総長が拒否権の行使を無効と宣言し、決議案を成立させる。","国際司法裁判所が職権で拒否権の行使を取り消す判決を下す。"],"a":0,"e":"安保理が拒否権で機能しないときは、平和のための結集決議にもとづいて緊急特別総会を開き、集団的措置を勧告できる。2022年のロシアのウクライナ侵攻でも、この仕組みで開かれた緊急特別総会でロシアに撤退を求める決議が採択された。ただし総会の決議は勧告であり、加盟国を法的に拘束する制裁は決定できない。事務総長に拒否権を無効にする権限はなく、国際司法裁判所も当事国の同意なく職権で裁判を行うことはできない。"},{"t":"qa","s":"国連の集団安全保障","imp":2,"q":"国連憲章で、平和に対する脅威・平和の破壊・侵略行為に対して安全保障理事会がとる強制措置（非軍事的措置・軍事的措置）を定めているのは第何章か。","a":"第7章","alt":["7章","第七章"],"e":"第7章では、安保理がまず平和に対する脅威などの存在を認定し（第39条）、経済制裁などの非軍事的措置（第41条）や、それでは不十分な場合の軍事的措置（第42条）をとることができる。紛争の平和的解決は第6章に定められている。"},{"t":"mc","s":"国連の集団安全保障","imp":2,"q":"安全保障理事会がある国の侵略行為に対してとる措置のうち、国連憲章第41条の非軍事的措置にあたるものを一つ選べ。","c":["加盟国の空軍による侵略国の軍事施設への爆撃","侵略国との貿易や鉄道・航空などの交通の中断","加盟国の海軍による侵略国の港湾の封鎖","加盟国の部隊による侵略国への地上作戦"],"a":1,"e":"第41条の非軍事的措置には、経済関係の全部または一部の中断、鉄道・航海・航空・郵便・電信などの交通通信手段の中断、外交関係の断絶がある。爆撃・封鎖・地上作戦はいずれも兵力を用いる軍事的措置（第42条）であり、第42条には空軍・海軍・陸軍による示威や封鎖などの行動が明記されている。"},{"t":"ex","s":"国連の集団安全保障","imp":3,"q":"国連憲章に定められた集団安全保障の仕組みを、武力行使の禁止とその例外にふれて説明せよ。","a":"国連憲章は、加盟国に武力による威嚇や武力の行使を原則として禁止している。平和に対する脅威や侵略行為があった場合は、安全保障理事会がそれを認定し、経済制裁などの非軍事的措置や、兵力を用いた軍事的措置を決定する。武力行使が認められる例外は、この安保理の措置と、安保理が措置をとるまでの間の自衛権の行使に限られる。","e":"ポイント：①武力の威嚇・行使の原則禁止（第2条4項） ②安保理による脅威・侵略の認定 ③非軍事的措置（第41条）と軍事的措置（第42条） ④例外としての個別的・集団的自衛権（第51条）"},{"t":"tf","s":"国連の集団安全保障","imp":3,"q":"国連憲章が予定している正規の国連軍は、朝鮮戦争の際に初めて組織された。","a":false,"e":"誤り。正しくは、正規の国連軍は、兵力を提供するための加盟国と安保理との特別協定（第43条）が結ばれていないため、これまで一度も組織されたことがない。朝鮮戦争の「国連軍」は、安保理の決議にもとづいてアメリカ軍を中心に編成されたもので、憲章の予定する正規の国連軍ではない。"},{"t":"qa","s":"国連の集団安全保障","imp":3,"q":"国連憲章第51条は、加盟国に武力攻撃が発生した場合、安全保障理事会が必要な措置をとるまでの間、個別的または集団的な（　）の固有の権利を害するものではないと定めている。空欄に入る語は何か。","a":"自衛","alt":["自衛権"],"e":"自衛権を行使した国は、直ちに安全保障理事会に報告しなければならない。個別的自衛権は自国が攻撃されたときに反撃する権利、集団的自衛権は自国と密接な関係にある他国が攻撃されたときに共同で対処する権利である。"},{"t":"qa","s":"国連の集団安全保障","imp":1,"q":"安全保障理事会の決議で武力行使を認められた加盟国が、国連の指揮下ではなく自国の指揮のもとで編成した部隊で、1991年の湾岸戦争でイラクと戦ったものを何というか。","a":"多国籍軍","e":"イラクのクウェート侵攻に対し、安保理決議678が加盟国に「あらゆる必要な手段」をとることを認め、アメリカを中心とする多国籍軍がクウェートを解放した。国連の指揮下にある正規の国連軍とも、紛争当事者の同意のもとで活動するPKOとも異なる。"},{"t":"tf","s":"国連の集団安全保障","imp":1,"q":"国連憲章は、国際連盟規約や不戦条約が禁止の対象とした「戦争」だけでなく、武力による威嚇や武力の行使を広く原則として禁止している。","a":true,"e":"正しい。第2条4項で武力による威嚇・武力の行使を禁止しており、例外は自衛権の行使（第51条）と安全保障理事会の決定による軍事的措置（第42条）に限られる。宣戦布告のない事実上の武力紛争も禁止の対象となる。"},{"t":"qa","s":"平和維持活動（PKO）","imp":3,"q":"紛争の拡大の防止や停戦の監視などのため、紛争当事者の同意を得て国連が行う活動を何というか。","a":"平和維持活動","alt":["PKO","国連平和維持活動"],"e":"1948年にパレスチナに派遣された国連休戦監視機構が始まりとされる。日本は1992年に国際平和協力法（PKO協力法）を制定し、同年カンボジアに初めて自衛隊を派遣した。"},{"t":"tf","s":"平和維持活動（PKO）","imp":3,"q":"PKOは、国連憲章第7章に明文で定められた強制措置の一つとして行われている。","a":false,"e":"誤り。正しくは、PKOは国連憲章に明文の規定がなく、国連の実際の活動の中から慣行として生まれたものである。紛争の平和的解決を定めた第6章と強制措置を定めた第7章の中間に位置づけられることから、「6章半の活動」と呼ばれる。"},{"t":"ex","s":"平和維持活動（PKO）","imp":2,"q":"伝統的なPKOが守ってきた原則を挙げ、国連憲章第7章の軍事的措置との違いを説明せよ。","a":"伝統的なPKOは、紛争当事者の同意を得ること、特定の当事者に肩入れしない中立・公平の立場をとること、自衛以外に武力を行使しないことを原則とする。当事国の同意なしに侵略国などへ武力で制裁を加える第7章の軍事的措置とは異なり、停戦の監視や兵力の引き離しによって紛争の再発防止を助ける活動である。","e":"ポイント：①当事者の同意 ②中立・公平 ③自衛以外の武力不行使 ④強制措置ではなく、停戦監視などで平和の維持を助ける"},{"t":"mc","s":"平和維持活動（PKO）","imp":1,"q":"PKOの活動についての記述として最も適当なものを一つ選べ。","c":["停戦監視団は、原則として武器を持たない軍人が、停戦が守られているかを監視する。","平和維持軍（PKF）は、侵略国に対して軍事的な制裁を加えることを主な任務とする。","選挙監視団は、当事国の同意がなくても強制的に選挙を実施することができる。","PKOに参加する部隊は、国連憲章第43条の特別協定にもとづいて提供される。"],"a":0,"e":"停戦監視団は、原則として非武装の軍人（軍事監視要員）が停戦の監視にあたる。平和維持軍（PKF）は軽武装の部隊で、兵力の引き離しや緩衝地帯の監視などを行うが、侵略国に制裁を加えるものではない。PKOは当事者の同意が原則であり、選挙監視も当事国の要請・同意にもとづいて行われる。PKOの要員は各国の自発的な提供によるもので、第43条の特別協定は一度も結ばれていない。"},{"t":"tf","s":"平和維持活動（PKO）","imp":1,"q":"冷戦終結後のPKOは、停戦監視にとどまらず、選挙の監視、行政の支援、難民の帰還の支援、文民の保護など、活動内容が多様化した。","a":true,"e":"正しい。冷戦後は内戦や民族紛争が増え、PKOの数が急増するとともに、紛争後の国づくりを支える平和構築まで担う複合型（多機能型）のPKOが増えた。一方、ソマリアでは重武装で停戦を強制しようとした活動が失敗し、その後は伝統的な原則を基本としつつ、文民の保護などのために一定の武力行使を認める「強化された（ロバストな）PKO」も見られる。"},{"t":"qa","s":"平和維持活動（PKO）","imp":1,"q":"1992年に国連事務総長ブトロス・ガリが『平和への課題』で提唱し、ソマリアで試みられたが失敗に終わった、当事者の同意がなくても停戦を強制できる重武装の部隊を何というか。","a":"平和執行部隊","alt":["平和強制部隊"],"e":"伝統的なPKOの原則（同意・中立・自衛以外の武力不行使）を越えるものだったが、第2次国連ソマリア活動（1993〜95年）は現地の武装勢力との戦闘に巻き込まれて失敗し、撤退した。その後、国連は伝統的な原則を重視する方向に戻った。"}]});</script>
<script>QDATA.push({"unit":"u12","questions":[{"t":"qa","s":"専門機関・補助機関","imp":2,"q":"1919年に国際連盟とともに設立され、政府・使用者・労働者の三者の代表で構成されて、国際的な労働基準の設定などを通じて労働条件の改善をはかる国連の専門機関を何というか。","a":"国際労働機関","alt":["ILO"],"e":"本部はスイスのジュネーブで、1969年にノーベル平和賞を受賞した。専門機関はそれぞれ独自の設立条約をもつ国際機関で、経済社会理事会を通じて国際連合と連携している。"},{"t":"qa","s":"専門機関・補助機関","imp":2,"q":"教育・科学・文化を通じて国際平和に貢献することを目的とし、世界遺産の登録なども行う国連の専門機関を何というか。","a":"国連教育科学文化機関","alt":["UNESCO","ユネスコ","国際連合教育科学文化機関"],"e":"本部はパリにある。その憲章の前文には「戦争は人の心の中で生れるものであるから、人の心の中に平和のとりでを築かなければならない」という有名な一節がある。"},{"t":"mc","s":"専門機関・補助機関","imp":3,"q":"国連の機関とその活動の組合せとして最も適当なものを一つ選べ。","c":["WHO（世界保健機関）－感染症の対策など、世界の人々の健康の向上に取り組む。","FAO（国連食糧農業機関）－子どもの生存と発達を守るため、栄養改善や予防接種を支援する。","UNICEF（国連児童基金）－食料の生産・分配の改善や農村の発展に取り組む。","IAEA（国際原子力機関）－難民の保護と難民問題の解決に取り組む。"],"a":0,"e":"WHOは感染症対策などを行い、1980年には天然痘の根絶を宣言した。子どもの支援を行うのはUNICEF、食料・農業を担当するのはFAOであり、両者の説明が入れ替わっている。IAEAは原子力の平和利用の促進と軍事転用の防止（査察）を行う機関で、難民を保護するのはUNHCR（国連難民高等弁務官事務所）である。"},{"t":"qa","s":"専門機関・補助機関","imp":2,"q":"原子力の平和利用を促進するとともに、核物質が軍事目的に転用されないように査察（保障措置）を行う国際機関を何というか。","a":"国際原子力機関","alt":["IAEA"],"e":"1957年に設立され、本部はオーストリアのウィーンにある。核拡散防止条約（NPT）の非核兵器国はIAEAの査察を受け入れる義務を負う。厳密には専門機関ではなく、総会や安全保障理事会に報告を行う関連機関であり、2005年にノーベル平和賞を受賞した。"},{"t":"qa","s":"専門機関・補助機関","imp":2,"q":"発展途上国の要求を受けて1964年に設立され、南北問題の解決のために貿易や開発援助について話し合う国連総会の機関を何というか。","a":"国連貿易開発会議","alt":["UNCTAD","アンクタッド","国際連合貿易開発会議"],"e":"第1回会議で事務局長プレビッシュの報告が出され、一次産品の価格の安定や、途上国からの輸入品の関税を低くする特恵関税などが求められた。南北問題の詳しい内容は国際経済の単元で学ぶ。"},{"t":"mc","s":"専門機関・補助機関","imp":2,"q":"国連の補助機関（計画・基金など）とその活動の組合せとして最も適当なものを一つ選べ。","c":["UNDP（国連開発計画）－途上国の開発を支援し、『人間開発報告書』で人間開発指数を公表している。","UNEP（国連環境計画）－1992年の国連環境開発会議をきっかけに設立され、国際的な労働基準を定めている。","WFP（国連世界食糧計画）－国家間の貿易の自由化を進めるための交渉の場となっている。","UNHCR（国連難民高等弁務官事務所）－核兵器の廃絶をめざして、各国の核施設を査察している。"],"a":0,"e":"UNDPは途上国の開発支援の中心となる機関で、1994年の『人間開発報告書』で「人間の安全保障」を提唱した。UNEPは1972年の国連人間環境会議をきっかけに設立され、環境分野の国連の活動を調整する機関（本部はケニアのナイロビ）であり、国際的な労働基準を定めるのはILOである。WFPは飢餓に苦しむ人々への食料支援を行う機関で、貿易自由化の交渉の場はWTO（世界貿易機関）である。UNHCRは難民の保護と支援を行う機関で、核施設の査察を行うのはIAEAである。"},{"t":"tf","s":"専門機関・補助機関","imp":2,"q":"国際通貨基金（IMF）と国際復興開発銀行（IBRD）は、国際連合の主要機関である。","a":false,"e":"誤り。正しくは、IMFとIBRD（世界銀行）は国連の専門機関である。国連の主要機関は、総会・安全保障理事会・経済社会理事会・信託統治理事会・国際司法裁判所・事務局の6つである。IMFは国際収支が悪化した国への短期の融資、IBRDは途上国の開発のための長期の融資を行う。"},{"t":"qa","s":"専門機関・補助機関","imp":2,"q":"2006年に国連総会の下部機関として設置され、すべての国連加盟国の人権状況を定期的に審査している機関を何というか。","a":"国連人権理事会","alt":["人権理事会","国際連合人権理事会","UNHRC"],"e":"経済社会理事会の下にあった人権委員会を格上げして改組したもので、47か国の理事国で構成され、普遍的定期審査（UPR）で全加盟国の人権状況を審査する。重大な人権侵害を行った理事国は資格を停止されることがあり、2022年にはウクライナ侵攻をめぐってロシアの資格が停止された。"},{"t":"tf","s":"専門機関・補助機関","imp":1,"q":"WFP（国連世界食糧計画）は、紛争や災害で食料が不足する地域への食料支援などを行い、2020年にノーベル平和賞を受賞した。","a":true,"e":"正しい。WFPは飢餓の解消をめざす世界最大の人道支援機関であり、飢餓が紛争の武器として使われることを防ぐ努力などが評価された。食料・農業の生産性の向上などを担うFAO（国連食糧農業機関）と区別すること。"},{"t":"ex","s":"国連の課題","imp":3,"q":"安全保障理事会の改革が求められている理由を、常任理事国の構成と拒否権にふれて説明せよ。","a":"常任理事国は第二次世界大戦の戦勝国である5か国に固定されており、加盟国が大幅に増え、アジア・アフリカなどの比重が高まった現在の国際社会を十分に代表していないと批判されている。また、常任理事国の拒否権によって安全保障理事会が必要な決定をできない事態がくり返されているため、理事国の拡大や拒否権の見直しが議論されている。","e":"ポイント：①常任理事国は戦勝国5か国に固定 ②加盟国の増加と地域的な代表性の不足 ③拒否権による機能不全 ④憲章改正には常任理事国すべての批准が必要で、実現が難しい"},{"t":"qa","s":"国連の課題","imp":2,"q":"安全保障理事会の常任理事国入りをめざし、2005年に共同で理事国の拡大案を国連総会に提出した日本・ドイツ・インド・ブラジルの4か国を何と呼ぶか。","a":"G4","alt":["Ｇ４","G4諸国"],"e":"G4の案には、常任理事国入りを競う近隣国（イタリア・韓国・パキスタン・アルゼンチンなど）が「コンセンサス・グループ」として反対し、実現していない。国連憲章の改正には、総会の3分の2以上の賛成と、常任理事国すべてを含む加盟国の3分の2以上の批准が必要である（第108条）。"},{"t":"mc","s":"国連の課題","imp":2,"q":"国際連合の財政についての記述として最も適当なものを一つ選べ。","c":["国連の通常予算は、主に加盟国が支払能力に応じて負担する分担金によってまかなわれている。","分担金の比率はすべての加盟国で同じであり、国の大小にかかわらず均等に負担する。","日本の分担率は、現在もアメリカに次ぐ第2位である。","分担金を滞納した加盟国に対する不利益な扱いは、国連憲章に定められていない。"],"a":0,"e":"通常予算は、各国の国民総所得などをもとに3年ごとに総会で決める分担率にしたがって負担する分担金でまかなわれるので、『均等に負担』は誤り。アメリカの分担率は上限の22％である。日本はかつて長くアメリカに次ぐ第2位だったが、2019年以降は中国に抜かれ、現在は第3位（2025〜27年は約6.9％）である。滞納額が過去2年分の分担金の額以上になった加盟国は総会での投票権を失う（第19条）。大国の滞納は国連の財政難の一因となってきた。"},{"t":"tf","s":"国連の課題","imp":1,"q":"国連憲章には、第二次世界大戦で連合国の敵国であった日本やドイツなどを対象とする、いわゆる旧敵国条項が現在も残っている。","a":true,"e":"正しい。第53条・第107条などの旧敵国条項について、1995年の国連総会は「すでに死文化している」と認め、将来の憲章改正で削除する意思を示す決議を採択したが、憲章の改正は行われておらず、条文は残っている。国際連合（United Nations）はもともと第二次世界大戦の連合国を意味する言葉である。"},{"t":"qa","s":"人権の国際的保障","imp":3,"q":"1948年に国連総会で採択され、すべての人民とすべての国が達成すべき共通の基準として、基本的人権の内容を初めて国際的に宣言したものを何というか。","a":"世界人権宣言","e":"採択された12月10日は「人権デー」とされている。自由権だけでなく社会権も含むが、宣言なので法的拘束力はない。これを条約化して法的拘束力をもたせたのが、1966年に採択された国際人権規約である。"},{"t":"qa","s":"人権の国際的保障","imp":3,"q":"世界人権宣言の内容を条約化して締約国に法的義務を課すため、1966年に国連総会で採択された人権条約を何というか。","a":"国際人権規約","e":"社会権を中心とする「経済的、社会的及び文化的権利に関する国際規約（A規約・社会権規約）」と、自由権を中心とする「市民的及び政治的権利に関する国際規約（B規約・自由権規約）」などからなる。1976年に発効し、日本は1979年に批准した。"},{"t":"mc","s":"人権の国際的保障","imp":3,"q":"国際人権規約についての記述として最も適当なものを一つ選べ。","c":["A規約は自由権を、B規約は社会権を中心に定めている。","日本は、個人が規約違反を国連の委員会に直接訴えることができる個人通報制度を定めた選択議定書を批准している。","日本はA規約の批准の際、公務員のストライキ権などに関する規定について留保を付けた。","国際人権規約は、世界人権宣言と同様に法的拘束力をもたない。"],"a":2,"e":"日本はA規約のうち、公務員の争議権（ストライキ権）や祝祭日の給与の支払いなどの規定に留保を付けて批准した（中等・高等教育の無償化の規定への留保は2012年に撤回した）。A規約は社会権規約、B規約は自由権規約なので、「A規約は自由権を、B規約は社会権を」とする記述は逆である。日本は個人通報制度を定めた選択議定書を批准していない。国際人権規約は締約国を法的に拘束する条約である。"},{"t":"tf","s":"人権の国際的保障","imp":2,"q":"死刑の廃止を目的とする国際人権規約B規約の第2選択議定書（死刑廃止議定書）を、日本は批准していない。","a":true,"e":"正しい。第2選択議定書は1989年に採択されたが、日本は死刑制度を維持しているため批准していない。日本は、集団殺害（ジェノサイド）の防止と処罰を定めたジェノサイド条約（1948年採択）にも加入していない。"},{"t":"qa","s":"人権の国際的保障","imp":3,"q":"1979年に国連総会で採択され、日本が1985年に批准した、女性に対するあらゆる差別の撤廃を締約国に求める条約を何というか。","a":"女子差別撤廃条約","alt":["女性差別撤廃条約","女子に対するあらゆる形態の差別の撤廃に関する条約"],"e":"日本は批准に先立って国内法を整備し、1984年に国籍法を改正して子の国籍を父系血統主義から父母両系血統主義に改め、1985年に男女雇用機会均等法を制定した。また、高校の家庭科の男女共修も進められた。"},{"t":"qa","s":"人権の国際的保障","imp":2,"q":"1989年に国連総会で採択され、18歳未満のすべての人を権利の主体と位置づけ、意見を表明する権利などを保障した条約を何というか。","a":"子どもの権利条約","alt":["児童の権利に関する条約","児童の権利条約","子どもの権利に関する条約"],"e":"日本は1994年に批准した（政府訳の名称は「児童の権利に関する条約」）。生きる権利・育つ権利・守られる権利・参加する権利の4つが柱とされる。国内では、条約の精神にのっとり、2023年にこども基本法が施行された。"},{"t":"mc","s":"人権の国際的保障","imp":2,"q":"人権に関する条約と、日本がその条約の批准・加入に関連して行った国内法の整備との組合せとして最も適当なものを一つ選べ。","c":["障害者権利条約－障害者差別解消法の制定","子どもの権利条約－国籍法の父母両系血統主義への改正","難民条約－男女雇用機会均等法の制定","人種差別撤廃条約－出入国管理及び難民認定法の制定"],"a":0,"e":"日本は障害者権利条約（2006年採択）の批准に向けて2013年に障害者差別解消法を制定し、2014年に批准した。国籍法の改正（1984年）と男女雇用機会均等法の制定（1985年）は、女子差別撤廃条約の批准に関連するものである。出入国管理及び難民認定法は、難民条約への加入（1981年）にあわせて出入国管理令を改正したもので、このとき社会保障の国籍要件も撤廃された。"},{"t":"tf","s":"人権の国際的保障","imp":1,"q":"日本は人種差別撤廃条約に加入しているが、人種差別の扇動などを処罰するよう求める規定については、表現の自由との関係から留保を付けている。","a":true,"e":"正しい。人種差別撤廃条約は1965年に採択され、日本は1995年に加入した。国内では2016年に、特定の民族などに対する差別的言動の解消をめざすヘイトスピーチ解消法が制定された（罰則はない）。"},{"t":"tf","s":"人権の国際的保障","imp":2,"q":"日本は、ジェノサイド条約と拷問等禁止条約のいずれにも加入している。","a":false,"e":"誤り。正しくは、日本は拷問等禁止条約（1984年採択）には1999年に加入したが、ジェノサイド条約（1948年採択）には加入していない。日本が批准・加入していない主な人権条約には、ほかに国際人権規約の選択議定書（個人通報制度、死刑廃止）がある。"},{"t":"ex","s":"人権の国際的保障","imp":2,"q":"第二次世界大戦後に人権の国際的保障が進められるようになった背景と、その仕組みを説明せよ。","a":"ナチス・ドイツによるユダヤ人の大量虐殺など、第二次世界大戦中の重大な人権侵害への反省から、人権の保障は一国の国内問題にとどまらず、国際社会全体の関心事であり平和の基礎でもあると考えられるようになった。そこで国連は、世界人権宣言で共通の基準を示し、国際人権規約などの条約で締約国に法的義務を課して、その実施状況を国際的に監視している。","e":"ポイント：①ホロコーストなど第二次世界大戦中の人権侵害への反省 ②人権は国際社会の関心事であり平和の基礎 ③宣言（基準）から条約（法的義務）へ ④報告審査や個人通報などによる国際的な監視"},{"t":"mc","s":"難民問題","imp":3,"q":"難民条約上の難民にあたる人として最も適当なものを一つ選べ。","c":["政府を批判する政治活動をしたために投獄されるおそれがあり、隣国に逃れた人","より高い収入を得るため、母国を離れて先進国で働いている人","内戦の戦火を避けて、国境を越えずに自国内の別の地域に避難している人","干ばつで農業ができなくなり、国内の都市に移住した人"],"a":0,"e":"難民条約上の難民とは、人種・宗教・国籍・特定の社会集団の構成員であること・政治的意見を理由に迫害を受けるおそれがあるという十分に理由のある恐怖があるために、国籍国の外にいる人である。政治的意見を理由に迫害されるおそれがあり、国外に逃れた人はこれにあたる。経済的な理由による移民、国境を越えていない国内避難民、自然災害による避難民は、条約上の難民には含まれない。"},{"t":"qa","s":"難民問題","imp":3,"q":"難民を、生命や自由が脅かされるおそれのある国へ追放したり送還したりしてはならないという、難民条約に定められた原則を何というか。","a":"ノン・ルフールマン原則","alt":["ノンルフールマン原則","ノン・ルフールマンの原則","ノン・ルフルマン原則"],"e":"難民条約第33条に定められた、難民保護の最も基本的な原則である。日本の出入国管理及び難民認定法にも、難民を迫害のおそれのある国へ送還してはならないとする規定がある。"},{"t":"qa","s":"難民問題","imp":2,"q":"紛争や迫害から逃れたが、国境を越えずに自国内にとどまって避難生活を送っている人々を何というか。","a":"国内避難民","alt":["IDP"],"e":"難民条約上の難民は国籍国の外にいることが要件なので、国内避難民は条約の保護の対象外となる。その数は国境を越えた難民よりも多く、UNHCRは1990年代から国内避難民の支援にも取り組んでいる。"},{"t":"qa","s":"難民問題","imp":3,"q":"難民の国際的な保護と支援を任務として、1950年に国連総会によって設立された機関を何というか。","a":"国連難民高等弁務官事務所","alt":["UNHCR","国際連合難民高等弁務官事務所"],"e":"本部はジュネーブにあり、1954年と1981年にノーベル平和賞を受賞している。難民問題の恒久的な解決策として、本国への自主帰還、避難先の国での定住、第三国定住の3つを掲げている。"},{"t":"qa","s":"難民問題","imp":3,"q":"1991年から2000年まで国連難民高等弁務官を務め、湾岸戦争後のクルド人難民の保護などに取り組んだ日本人は誰か。","a":"緒方貞子","e":"湾岸戦争後、トルコが国境を閉ざしたためイラク国内にとどまったクルド人について、国境を越えていなくても保護すべきだと判断し、UNHCRの支援の対象を国内避難民にも広げた。のちに国際協力機構（JICA）の理事長を務め、人間の安全保障の考え方の普及にも尽力した。"},{"t":"qa","s":"難民問題","imp":1,"q":"難民キャンプなどで一時的な保護を受けている難民を、最初に避難した国とは別の国が受け入れて定住させることを何というか。","a":"第三国定住","e":"日本は2010年から、タイの難民キャンプにいるミャンマー難民を対象に第三国定住による受け入れを始め、その後対象を広げている。"},{"t":"tf","s":"難民問題","imp":2,"q":"日本は難民条約に加入していないため、難民を認定する制度をもっていない。","a":false,"e":"誤り。正しくは、日本は1970年代後半のインドシナ難民（ボートピープル）の受け入れをきっかけに1981年に難民条約に加入し、出入国管理令を出入国管理及び難民認定法に改めて難民認定制度を設けた。"},{"t":"ex","s":"難民問題","imp":1,"q":"日本の難民受け入れの特徴と課題を説明せよ。","a":"日本は1981年に難民条約に加入して難民認定制度を設けたが、認定の基準や手続が厳しく、欧米諸国と比べて難民として認定される人数や割合がきわめて少ないと批判されてきた。2010年から第三国定住による受け入れを始め、2023年の入管法改正では条約上の難民にあたらない紛争避難民などを保護する補完的保護の制度も設けられたが、受け入れの拡大が課題である。","e":"ポイント：①1981年に難民条約に加入 ②難民認定数・認定率がきわめて少ない ③第三国定住（2010年〜）や補完的保護（2023年改正）などの取り組み ④受け入れの拡大と申請者の人権への配慮が課題"},{"t":"qa","s":"人間の安全保障","imp":3,"q":"国家の安全だけでなく、貧困・飢餓・感染症・環境破壊・人権侵害・紛争などの脅威から、一人ひとりの人間の生命・生活・尊厳を守ることを重視する考え方を何というか。","a":"人間の安全保障","e":"1994年にUNDP（国連開発計画）の『人間開発報告書』で提唱された。「恐怖からの自由」と「欠乏からの自由」を柱とし、日本は外交の柱の一つとして推進して、国連に人間の安全保障基金を設けた。"},{"t":"ex","s":"人間の安全保障","imp":3,"q":"従来の「国家の安全保障」と「人間の安全保障」の違いを説明せよ。","a":"従来の国家の安全保障は、他国からの軍事的な攻撃から国家の領土や主権を守ることを中心とし、主に軍事力によって実現しようとするものだった。これに対し人間の安全保障は、守る対象を一人ひとりの人間に置き、紛争だけでなく貧困・飢餓・感染症・環境破壊などの多様な脅威から人々の生存・生活・尊厳を守ろうとするもので、開発援助や人々の能力の強化を重視する。","e":"ポイント：①守る対象（国家か、一人ひとりの人間か） ②脅威（軍事的な攻撃か、貧困・感染症などの多様な脅威か） ③手段（軍事力か、開発・保護・能力強化か） ④1994年のUNDP『人間開発報告書』で提唱"},{"t":"qa","s":"人間の安全保障","imp":2,"q":"国家は自国民を集団殺害・戦争犯罪・民族浄化・人道に対する犯罪から守る責任を負い、国家がその責任を果たせない場合には国際社会がその人々を守る責任を負うという考え方を何というか。","a":"保護する責任","alt":["R2P"],"e":"2005年の国連首脳会合（世界サミット）の成果文書で確認された。ルワンダの大虐殺などを国際社会が止められなかった反省から生まれたが、内政不干渉の原則との関係や、大国の軍事介入の口実に使われるおそれが議論されている。"},{"t":"tf","s":"人間の安全保障","imp":1,"q":"保護する責任の考え方によれば、国家が自国民を集団殺害などから守れない場合でも、国際社会はその国の内政に一切関与してはならない。","a":false,"e":"誤り。正しくは、保護する責任の考え方では、国家がその責任を果たせない場合には、国際社会が平和的な手段で、必要ならば安全保障理事会を通じた強制措置によって人々を保護する責任を負うとされる。主権を「国民を保護する責任」としてとらえ直した考え方である。2011年のリビアへの軍事介入では、安保理の決議がこの考え方を背景に武力行使を容認した。"},{"t":"qa","s":"国際NGO","imp":1,"q":"1961年にイギリスで設立され、思想や信条などを理由に投獄された「良心の囚人」の釈放や、死刑・拷問の廃止などを訴えている国際的な人権NGOを何というか。","a":"アムネスティ・インターナショナル","alt":["アムネスティ","アムネスティインターナショナル"],"e":"1977年にノーベル平和賞を受賞した。NGO（非政府組織）は、政府から独立して国境を越えて活動する民間の団体であり、経済社会理事会から協議資格を得て国連の会議に参加するものもある。"},{"t":"mc","s":"国際NGO","imp":3,"q":"NGOとその活動の組合せとして最も適当なものを一つ選べ。","c":["国境なき医師団－紛争地や被災地で、医療を中心とした人道援助を行っている。","地雷禁止国際キャンペーン（ICBL）－核兵器禁止条約の採択に貢献した。","核兵器廃絶国際キャンペーン（ICAN）－対人地雷全面禁止条約の採択に貢献した。","アムネスティ・インターナショナル－クラスター弾禁止条約の交渉を主導した政府間の国際機関である。"],"a":0,"e":"国境なき医師団は1971年にフランスで設立され、1999年にノーベル平和賞を受賞した。ICBLは対人地雷全面禁止条約（1997年）の成立に貢献して同年にノーベル平和賞を、ICANは核兵器禁止条約（2017年）の採択に貢献して同年にノーベル平和賞を受賞しており、両者の説明が入れ替わっている。アムネスティ・インターナショナルは人権問題に取り組むNGOであり、政府間の国際機関ではない。"},{"t":"qa","s":"国際NGO","imp":2,"q":"広島・長崎の被爆者の全国組織として1956年に結成され、核兵器の廃絶と被爆者援護を訴え続けて、2024年にノーベル平和賞を受賞した団体を何というか。","a":"日本被団協","alt":["日本原水爆被害者団体協議会","被団協"],"e":"被爆者が自らの体験を証言して核兵器の非人道性を世界に訴え、核兵器を二度と使ってはならないという「核のタブー」の確立に貢献したことが評価された。"},{"t":"tf","s":"国際NGO","imp":1,"q":"NGOは政府から独立した民間の団体であるため、国連の会議に参加したり、国際条約づくりに関与したりすることは一切認められていない。","a":false,"e":"誤り。正しくは、NGOは経済社会理事会から協議資格を認められて国連の会議に参加したり、対人地雷全面禁止条約や核兵器禁止条約のように国際条約の成立に大きな役割を果たしたりしている。「一切」のような言い過ぎの表現はひっかけに多い。"}]});</script>
<script>QDATA.push({"unit":"u13","questions":[{"t":"qa","s":"冷戦の始まり","imp":3,"q":"1946年、イギリスの前首相チャーチルがアメリカでの演説で、ソ連の勢力圏となった東ヨーロッパと西側との境界を何にたとえたか。","a":"鉄のカーテン","e":"「バルト海のシュテッティンからアドリア海のトリエステまで、大陸を横切って鉄のカーテンが降ろされた」と述べ、ソ連の勢力拡大を警告した（フルトン演説）。冷戦の始まりを象徴する演説であり、演説したのはアメリカのトルーマン大統領ではなくチャーチルである点に注意する。"},{"t":"tf","s":"冷戦の始まり","imp":2,"q":"ソ連と東ヨーロッパ諸国はマーシャル・プランの受け入れを拒否し、1947年には各国共産党の連絡・情報交換のための組織としてコミンフォルムを結成した。","a":true,"e":"正しい。コミンフォルム（共産党情報局）は、トルーマン・ドクトリンやマーシャル・プランに対抗して結成され、1956年に解散した。経済面では、1949年にコメコン（経済相互援助会議）が結成された。"},{"t":"qa","s":"冷戦の始まり","imp":3,"q":"1947年にアメリカ大統領が、ギリシャとトルコへの援助を表明し、共産主義勢力の拡大を阻止する方針を打ち出したものを何というか。","a":"トルーマン・ドクトリン","alt":["トルーマン＝ドクトリン","トルーマン宣言"],"e":"ソ連を中心とする共産主義の拡大を食い止める「封じ込め政策」の始まりとされ、冷戦の本格的な開始を告げた。同じ年には、ヨーロッパの経済復興を援助するマーシャル・プランも発表された。"},{"t":"qa","s":"冷戦の始まり","imp":3,"q":"1947年にアメリカの国務長官が発表した、ヨーロッパ諸国の経済復興を援助する計画を何というか。","a":"マーシャル・プラン","alt":["ヨーロッパ復興援助計画","欧州復興援助計画","欧州復興計画"],"e":"経済を立て直して西ヨーロッパの共産化を防ぐねらいがあり、ソ連と東ヨーロッパ諸国は受け入れを拒否した。援助の受け入れのためにつくられたOEEC（欧州経済協力機構）は、のちにOECD（経済協力開発機構）に改組された。"},{"t":"mc","s":"冷戦の始まり","imp":2,"q":"冷戦初期に西側陣営がとった政策・つくった組織と、それに対抗して東側陣営がつくった組織の組合せとして最も適当なものを一つ選べ。","c":["マーシャル・プラン－コメコン（経済相互援助会議）","北大西洋条約機構（NATO）－コミンフォルム（共産党情報局）","トルーマン・ドクトリン－ワルシャワ条約機構","マーシャル・プラン－ワルシャワ条約機構"],"a":0,"e":"経済面では、マーシャル・プランに対抗して1949年にコメコンがつくられた。政治面では、トルーマン・ドクトリンやマーシャル・プランに対抗して1947年にコミンフォルムがつくられた。軍事面では、1949年のNATOに対抗して、西ドイツのNATO加盟を機に1955年にワルシャワ条約機構が結成された。したがって、NATOに対応するのはワルシャワ条約機構であり、ほかの組合せは誤りである。"},{"t":"mc","s":"冷戦の始まり","imp":2,"q":"第二次世界大戦後のドイツの分断についての記述として最も適当なものを一つ選べ。","c":["西側占領地区での通貨改革にソ連が反発してベルリン封鎖を行い、その後の1949年にドイツは東西二つの国家に分かれた。","ベルリン封鎖に対して、アメリカなどは軍隊で封鎖を突破し、陸路で西ベルリンに物資を送った。","ベルリンの壁は、1949年に東西ドイツが成立すると同時に建設された。","西ドイツはワルシャワ条約機構に、東ドイツは北大西洋条約機構（NATO）に加盟した。"],"a":0,"e":"1948年、西側占領地区での通貨改革に反発したソ連が西ベルリンへの陸上の交通路を遮断した（ベルリン封鎖、1949年まで）。これを機に分断が決定的となり、1949年に西側にドイツ連邦共和国（西ドイツ）、東側にドイツ民主共和国（東ドイツ）が成立した。アメリカなどは軍事衝突を避けて空輸で物資を送り続けたので、『軍隊で封鎖を突破し、陸路で』は誤り。ベルリンの壁が建設されたのは1961年である。西ドイツはNATOに、東ドイツはワルシャワ条約機構に加盟したので、逆である。"},{"t":"qa","s":"冷戦の始まり","imp":3,"q":"1949年にアメリカ・カナダと西ヨーロッパ諸国が結成した、集団防衛のための軍事同盟を何というか。","a":"北大西洋条約機構","alt":["NATO","ナトー"],"e":"加盟国の一つへの武力攻撃を全加盟国への攻撃とみなして共同で対処する（北大西洋条約第5条）。東側はこれに対抗して、西ドイツのNATO加盟を機に1955年にワルシャワ条約機構を結成した。"},{"t":"tf","s":"冷戦の始まり","imp":2,"q":"ワルシャワ条約機構は、ソ連と東ヨーロッパ諸国が北大西洋条約機構（NATO）に対抗して1955年に結成した軍事同盟で、冷戦終結後の1991年に解体した。","a":true,"e":"正しい。西ドイツのNATO加盟（1955年）を直接のきっかけとして結成された。解体後、ポーランドやハンガリーなど旧加盟国の多くはNATOに加盟した。"},{"t":"qa","s":"冷戦の始まり","imp":3,"q":"1950年に北朝鮮が韓国に侵攻して始まり、アメリカ軍を中心とする「国連軍」と中国の人民義勇軍が参戦して、1953年に休戦協定が結ばれた戦争を何というか。","a":"朝鮮戦争","e":"休戦協定は板門店で結ばれたが平和条約は結ばれておらず、現在も法的には休戦状態が続いている。日本では特需景気が起こり、警察予備隊が創設された。"},{"t":"tf","s":"冷戦の始まり","imp":2,"q":"朝鮮戦争の際、安全保障理事会はソ連の拒否権によって何も決定できなかったため、アメリカ軍を中心とする「国連軍」は総会の決議だけにもとづいて派遣された。","a":false,"e":"誤り。正しくは、ソ連は中国の代表権問題に抗議して安全保障理事会を欠席していたため拒否権を行使できず、安保理の決議にもとづいて「国連軍」が編成された。その後ソ連が安保理に復帰して拒否権を使うようになったため、1950年に総会で平和のための結集決議が採択された。"},{"t":"ex","s":"冷戦の始まり","imp":3,"q":"冷戦とはどのような対立か。対立の構図と「冷たい戦争」と呼ばれる理由を説明せよ。","a":"冷戦とは、第二次世界大戦後、アメリカを中心とする資本主義（自由主義）陣営とソ連を中心とする社会主義陣営が、政治・経済・軍事・イデオロギーなどあらゆる面で対立した状態である。米ソは核兵器を背景ににらみ合ったが直接は戦火を交えなかったため「冷たい戦争」と呼ばれる。一方で、朝鮮戦争やベトナム戦争のような代理戦争は各地で起こった。","e":"ポイント：①米ソを中心とする東西両陣営の対立 ②資本主義と社会主義という体制・イデオロギーの対立 ③米ソは直接戦わなかった（冷たい戦争） ④代理戦争（朝鮮戦争・ベトナム戦争など）は起きた"},{"t":"qa","s":"雪解けと平和共存","imp":2,"q":"1953年のスターリンの死後、東西間の緊張がやわらいだ状況を何というか。","a":"雪解け","alt":["雪どけ","雪融け"],"e":"1955年にはジュネーブで米英仏ソの首脳会談（ジュネーブ四巨頭会談）が開かれた。翌1956年には、ソ連のフルシチョフ第一書記がスターリン批判を行い、資本主義諸国との平和共存路線を打ち出した。"},{"t":"tf","s":"雪解けと平和共存","imp":1,"q":"ソ連のフルシチョフは1956年にスターリン批判を行って資本主義陣営との平和共存を唱えたが、同年に起きたハンガリーの反ソ暴動には軍事介入して鎮圧した。","a":true,"e":"正しい。フルシチョフは1959年に訪米してアイゼンハワー大統領と会談するなど平和共存を進めたが、東ヨーロッパに対するソ連の支配はゆるめなかった。1962年のキューバ危機の際のソ連の指導者でもある。"},{"t":"qa","s":"雪解けと平和共存","imp":3,"q":"1961年に東ドイツが、東ベルリンから西ベルリンへの住民の流出を防ぐために建設したものは何か。","a":"ベルリンの壁","e":"冷戦による東西分断の象徴となった。1989年11月に東ドイツが国境を開放したことで壁は崩壊し、1990年のドイツ統一につながった。"},{"t":"qa","s":"雪解けと平和共存","imp":3,"q":"1962年、ソ連がキューバにミサイル基地を建設したことにアメリカが海上封鎖で対抗し、米ソの核戦争が起こる寸前まで緊張が高まった出来事を何というか。","a":"キューバ危機","e":"アメリカのケネディ大統領とソ連のフルシチョフ首相の交渉で、ソ連がミサイルを撤去することで回避された。この教訓から、翌1963年には米ソ首脳を結ぶ直通通信回線（ホットライン）が設けられた。"},{"t":"ex","s":"雪解けと平和共存","imp":2,"q":"キューバ危機は、その後の米ソ関係にどのような影響を与えたか。具体例をあげて説明せよ。","a":"キューバ危機で核戦争の瀬戸際に立った米ソは、核戦争の危険を強く認識し、対立を管理する必要を感じるようになった。そこで1963年に、偶発的な核戦争を防ぐため米ソ首脳を直接結ぶホットラインを設け、同じ年に米英ソが部分的核実験禁止条約（PTBT）を結んだ。こうした動きは、その後の緊張緩和（デタント）にもつながった。","e":"ポイント：①核戦争の危険の認識 ②ホットラインの設置（1963年） ③部分的核実験禁止条約（1963年） ④その後のデタントへ"},{"t":"qa","s":"雪解けと平和共存","imp":3,"q":"1965年にアメリカが北ベトナムへの爆撃（北爆）を開始して本格的に介入し、1973年の和平協定でアメリカ軍が撤退した後、1975年に北ベトナム側の勝利で終わった戦争を何というか。","a":"ベトナム戦争","e":"アメリカが南ベトナム政府を、ソ連・中国が北ベトナムを支援した代理戦争の性格をもち、1976年に南北が統一されてベトナム社会主義共和国となった。アメリカでは反戦運動が高まり、戦費の負担はドルの信用の低下にもつながった。"},{"t":"mc","s":"雪解けと平和共存","imp":1,"q":"1950年代後半から1960年代の出来事についての記述として最も適当なものを一つ選べ。","c":["キューバ危機の翌年、米英ソが部分的核実験禁止条約に調印した。","ベルリンの壁は、西ドイツが東ドイツからの難民の流入を防ぐために建設した。","中国とソ連は、1960年代を通じて社会主義陣営の結束を強め、共同で核開発を進めた。","ベトナム戦争では、ソ連が南ベトナム政府を、アメリカが北ベトナムを支援した。"],"a":0,"e":"キューバ危機（1962年）の翌年1963年に、米英ソが部分的核実験禁止条約（PTBT）に調印した。ベルリンの壁は、東ドイツが自国民の西側への流出を防ぐために建設したもので、主体が逆である。中国とソ連は1950年代後半から対立を深め、1969年には国境で武力衝突も起きた。ベトナム戦争ではアメリカが南ベトナム政府を、ソ連・中国が北ベトナムを支援したので、逆である。"},{"t":"qa","s":"多極化とデタント","imp":2,"q":"1950年代後半から社会主義の路線やスターリン批判への評価をめぐって深まり、1969年には国境での武力衝突にまで発展した社会主義国どうしの対立を何というか。","a":"中ソ対立","alt":["中ソ論争"],"e":"中国は1964年に核実験を行い、独自の核保有国となった。社会主義陣営の結束が崩れたことは冷戦の多極化の大きな要因となり、アメリカが中国に接近する背景にもなった。"},{"t":"tf","s":"多極化とデタント","imp":1,"q":"フランスはド・ゴール大統領のもとで独自外交を進め、1966年にNATOそのものから脱退して、その後一度も復帰していない。","a":false,"e":"誤り。正しくは、フランスが1966年に脱退したのはNATOの軍事機構（統合軍事機構）であり、NATOそのものからは脱退していない。また、2009年には軍事機構にも完全に復帰した。フランスは1960年に核実験を行い、独自の核戦力をもった。"},{"t":"qa","s":"多極化とデタント","imp":2,"q":"1972年にアメリカの大統領として初めて中華人民共和国を訪問し、米中関係の改善を進めた人物は誰か。","a":"ニクソン","alt":["リチャード・ニクソン"],"e":"ソ連と対立する中国に接近することで、ベトナム戦争の終結やソ連への対抗をはかった。前年の1971年には中華人民共和国が国連の代表権を獲得し、米中は1979年に国交を正常化した。訪中計画の発表は日本への事前の連絡なしに行われ、日本に大きな衝撃を与えた。"},{"t":"ex","s":"多極化とデタント","imp":1,"q":"冷戦の「多極化」とはどのような変化か。具体例をあげて説明せよ。","a":"1960年代以降、米ソ両大国がそれぞれの陣営を統制する二極構造がゆらぎ、陣営の内部から独自の動きが強まったことをいう。東側では中ソ対立が深まり、西側ではフランスがNATOの軍事機構から脱退して独自の核武装を進めた。また、西ヨーロッパや日本の経済的台頭や、どちらの陣営にも属さない第三世界の登場も多極化を進めた。","e":"ポイント：①米ソ二極構造のゆらぎ ②東側：中ソ対立 ③西側：フランスの独自外交、西欧・日本の経済成長 ④第三世界（非同盟諸国）の台頭"},{"t":"qa","s":"多極化とデタント","imp":3,"q":"1960年代末から1970年代にかけての、米ソを中心とする東西間の緊張緩和の動きを何というか。","a":"デタント","alt":["緊張緩和"],"e":"1972年の第1次戦略兵器制限条約（SALTⅠ）や、1975年の全欧安全保障協力会議（CSCE）でのヘルシンキ宣言などが代表例である。西ドイツのブラント首相による東側諸国との関係改善（東方外交）もデタントを進めた。"},{"t":"qa","s":"多極化とデタント","imp":2,"q":"1975年に開かれた全欧安全保障協力会議（CSCE）で、アメリカ・カナダを含む35か国が採択した、主権の尊重・国境の不可侵・人権の尊重などをうたった文書を何というか。","a":"ヘルシンキ宣言","alt":["ヘルシンキ最終議定書","ヘルシンキ最終文書","ヘルシンキ協定"],"e":"東西ヨーロッパの国々が第二次世界大戦後の国境を認め合い、デタントの象徴となった。人権尊重の規定は、東欧の民主化運動の支えにもなった。CSCEは冷戦後の1995年に常設の全欧安全保障協力機構（OSCE）に発展した。"},{"t":"mc","s":"多極化とデタント","imp":2,"q":"デタント（緊張緩和）の時期の出来事として最も適当なものを一つ選べ。","c":["米ソが第1次戦略兵器制限条約（SALTⅠ）に調印した。","ソ連がアフガニスタンに軍事侵攻した。","米ソが中距離核戦力（INF）全廃条約に調印した。","アメリカがトルーマン・ドクトリンを発表した。"],"a":0,"e":"SALTⅠは1972年に米ソが調印したもので、デタントを代表する出来事である。ソ連のアフガニスタン侵攻（1979年）は、デタントを終わらせて新冷戦を招いた出来事である。INF全廃条約（1987年）は、ゴルバチョフ政権のもとでの冷戦終結期の出来事である。トルーマン・ドクトリン（1947年）は、冷戦の始まりを告げた政策である。"},{"t":"qa","s":"新冷戦","imp":3,"q":"1979年にソ連が行い、デタントを終わらせて「新冷戦」と呼ばれる米ソ対立の再燃を招いた軍事行動は何か。","a":"アフガニスタン侵攻","alt":["ソ連のアフガニスタン侵攻","アフガニスタンへの軍事侵攻","アフガニスタンへの侵攻"],"e":"親ソ政権を支えるための軍事介入だった。アメリカなど西側諸国は1980年のモスクワ・オリンピックをボイコットし（日本も不参加）、アメリカのレーガン政権は軍備を大幅に増強した。ソ連軍は1989年に撤退を完了した。"},{"t":"tf","s":"新冷戦","imp":1,"q":"第2次戦略兵器制限条約（SALTⅡ）は、1979年に米ソが調印した後、両国が批准して発効し、核兵器の削減が実現した。","a":false,"e":"誤り。正しくは、SALTⅡは1979年に調印されたが、同年のソ連のアフガニスタン侵攻を受けてアメリカ上院の承認が得られず、発効しなかった。また、SALTは核兵器の数量の「制限」（上限の設定）であり、核兵器の「削減」を初めて実現したのは1987年のINF全廃条約である。"},{"t":"qa","s":"冷戦の終結","imp":3,"q":"1985年にソ連共産党の書記長に就任し、ペレストロイカ（改革）やグラスノスチ（情報公開）を進めた人物は誰か。","a":"ゴルバチョフ","alt":["ミハイル・ゴルバチョフ"],"e":"外交面では、対立よりも協調を重視する「新思考外交」を掲げて、アメリカとの軍縮やアフガニスタンからの撤退を進めた。1990年にソ連の初代大統領となり、同年にノーベル平和賞を受賞した。"},{"t":"tf","s":"冷戦の終結","imp":2,"q":"ゴルバチョフの新思考外交のもとで、ソ連は東欧諸国の民主化運動に軍事介入し、各国の共産党政権を守った。","a":false,"e":"誤り。正しくは、新思考外交のもとでソ連は東欧諸国への介入を控え、各国が自ら体制を選ぶことを容認した。そのため、1989年に東欧諸国で共産党政権が相次いで倒れた（東欧革命）。"},{"t":"qa","s":"冷戦の終結","imp":3,"q":"1987年に米ソが調印し、特定の種類の核兵器を初めて全廃することを定めた条約を何というか。","a":"INF全廃条約","alt":["中距離核戦力全廃条約","INF条約","中距離核戦力（INF）全廃条約"],"e":"アメリカのレーガン大統領とソ連のゴルバチョフ書記長が調印し、射程500〜5500kmの地上発射型ミサイルを全廃した。2019年にアメリカがロシアの違反を理由に破棄を通告し、失効した。"},{"t":"mc","s":"冷戦の終結","imp":2,"q":"1989年の東欧革命についての記述として最も適当なものを一つ選べ。","c":["ポーランドでは、自主管理労組「連帯」が選挙で勝利し、非共産党系の政権が誕生した。","ルーマニアでは、ソ連軍の介入によって共産党政権が維持された。","チェコスロバキアでは、長期の内戦の末に共産党政権が倒れた。","東ドイツでは、ベルリンの壁の崩壊後も共産党の一党支配が10年以上続いた。"],"a":0,"e":"ポーランドでは自主管理労組「連帯」が1989年の選挙で圧勝し、非共産党系の政権が誕生した。ルーマニアでは民衆の蜂起によって独裁者チャウシェスクが処刑され、共産党政権が倒れた。チェコスロバキアでは流血をともなわずに体制が転換した（ビロード革命）。東ドイツでは壁の崩壊後まもなく共産党の一党支配が終わり、1990年に西ドイツに編入される形でドイツ統一が実現した。"},{"t":"qa","s":"冷戦の終結","imp":3,"q":"1989年12月に地中海の島国で行われ、アメリカのブッシュ大統領とソ連のゴルバチョフ書記長が冷戦の終結を宣言した会談を何というか。","a":"マルタ会談","alt":["マルタ会議","マルタ首脳会談"],"e":"「ヤルタからマルタへ」という言葉は、第二次世界大戦末期のヤルタ会談に始まった戦後の冷戦体制が、マルタ会談で終わったことを表している。"},{"t":"tf","s":"冷戦の終結","imp":2,"q":"1990年のドイツ統一は、東ドイツと西ドイツが対等に合併して新しい国家をつくる形で行われ、統一ドイツはNATOから離脱した。","a":false,"e":"誤り。正しくは、ドイツ統一は東ドイツが西ドイツ（ドイツ連邦共和国）に編入される形で行われ、統一ドイツはNATOにとどまった。"},{"t":"qa","s":"冷戦の終結","imp":2,"q":"1991年12月にソ連が解体した際、ロシア・ウクライナ・ベラルーシなどの旧ソ連諸国によって結成されたゆるやかな国家連合を何というか。","a":"独立国家共同体","alt":["CIS"],"e":"同年8月の保守派によるクーデターが失敗した後、バルト三国の独立が認められ、12月にソ連は消滅した。ソ連がもっていた国連安全保障理事会の常任理事国の地位は、ロシアが引き継いだ。"},{"t":"mc","s":"冷戦の終結","imp":1,"q":"冷戦の終結にかかわる次の出来事のうち、最も遅く起こったものを一つ選べ。","c":["ベルリンの壁の崩壊","マルタ会談","ドイツの統一","ソ連の解体と独立国家共同体（CIS）の創設"],"a":3,"e":"ベルリンの壁の崩壊（1989年11月）→米ソ首脳が冷戦の終結を宣言したマルタ会談（1989年12月）→ドイツの統一（1990年10月）→ソ連の解体とCISの創設（1991年12月）の順である。ワルシャワ条約機構とコメコンも1991年に解体した。"},{"t":"ex","s":"冷戦の終結","imp":2,"q":"冷戦が終結した背景を、ソ連の変化を中心に説明せよ。","a":"ソ連は、軍拡競争やアフガニスタン侵攻の負担、計画経済の行き詰まりによって経済が停滞していた。1985年に就任したゴルバチョフはペレストロイカやグラスノスチによる改革と新思考外交を進め、アメリカとの軍縮に取り組み、東欧諸国への介入をやめた。その結果1989年に東欧革命が起こり、同年のマルタ会談で冷戦の終結が宣言された。","e":"ポイント：①ソ連経済の停滞（軍事費の負担・計画経済の行き詰まり） ②ゴルバチョフの改革（ペレストロイカ・グラスノスチ） ③新思考外交と米ソの軍縮（INF全廃条約） ④東欧革命とマルタ会談"}]});</script>
<script>QDATA.push({"unit":"u13","questions":[{"t":"ex","s":"冷戦後の地域紛争","imp":3,"q":"冷戦終結後に地域紛争や民族紛争が多発するようになった理由を説明せよ。","a":"冷戦期には、米ソ両陣営の対立の枠組みの中で、各地の民族・宗教などをめぐる対立が抑え込まれていた。冷戦が終わってその重しが外れると、旧ソ連や旧ユーゴスラビアなどの多民族国家の解体も重なり、民族・宗教・領土などをめぐる対立が表面化した。こうした内戦や民族紛争では一般市民が大量に犠牲となり、多くの難民が発生した。","e":"ポイント：①冷戦期は東西対立の枠組みで対立が抑え込まれていた ②冷戦終結で抑えが外れた ③多民族国家の解体（旧ソ連・旧ユーゴスラビア） ④国家間の戦争より内戦・民族紛争が中心に（市民の犠牲・難民の発生）"},{"t":"qa","s":"冷戦後の地域紛争","imp":3,"q":"1990年のイラクによるクウェート侵攻に対し、翌1991年に安全保障理事会の決議にもとづいて、アメリカを中心とする多国籍軍がイラクを攻撃した戦争を何というか。","a":"湾岸戦争","e":"冷戦が終わって米ソが協調できるようになり、安保理が武力行使を容認する決議を採択できた。日本は多額の資金を提供したが「人的貢献がない」と批判され、戦後に海上自衛隊の掃海艇をペルシャ湾に派遣し、1992年にはPKO協力法を制定した。"},{"t":"qa","s":"冷戦後の地域紛争","imp":2,"q":"旧ユーゴスラビアから独立したボスニア・ヘルツェゴビナで、1992年からセルビア人・クロアチア人・ムスリム（ボシュニャク人）の3勢力が争い、特定の民族を排除する「民族浄化」も行われた紛争を何というか。","a":"ボスニア・ヘルツェゴビナ紛争","alt":["ボスニア紛争","ボスニア内戦","ボスニア・ヘルツェゴビナ内戦"],"e":"NATOの空爆を経て、1995年のデイトン合意で和平が成立した。旧ユーゴスラビアでの重大な犯罪を裁くため、安全保障理事会は1993年に旧ユーゴスラビア国際刑事裁判所を設けた。"},{"t":"tf","s":"冷戦後の地域紛争","imp":3,"q":"1999年、NATOはコソボのアルバニア系住民への迫害を止めるため、安全保障理事会の武力行使容認決議を得たうえで、ユーゴスラビア（セルビア）を空爆した。","a":false,"e":"誤り。正しくは、NATOはロシアや中国の反対で安全保障理事会の決議が得られないまま、「人道的介入」を理由に空爆を行った。国連の承認のない武力行使として、国際法上の正当性が議論された。コソボは2008年に独立を宣言したが、セルビアやロシアは承認していない。"},{"t":"ex","s":"冷戦後の地域紛争","imp":2,"q":"「人道的介入」とは何か。1999年のNATOによるユーゴスラビア空爆を例に、その問題点を説明せよ。","a":"人道的介入とは、ある国で大量虐殺などの深刻な人権侵害が起きているときに、それを止めるために他国が当事国の同意なしに軍事介入することである。NATOのユーゴスラビア空爆は安全保障理事会の決議なしに行われたため、武力行使を原則として禁止する国連憲章との関係や、大国が自国の都合で介入を行うおそれが問題とされた。","e":"ポイント：①深刻な人権侵害を止めるための、当事国の同意のない軍事介入 ②安保理の決議がない武力行使の正当性 ③内政不干渉・武力不行使の原則との衝突 ④大国による恣意的な介入のおそれ（のちの「保護する責任」の議論へ）"},{"t":"qa","s":"冷戦後の地域紛争","imp":2,"q":"1994年、アフリカのある国で多数派フツ人の過激派が少数派ツチ人などを大量に殺害し、約100日間で数十万人以上が犠牲になった。この内戦が起きた国はどこか。","a":"ルワンダ","alt":["ルワンダ共和国"],"e":"国連のPKOは現地にいたが大量虐殺（ジェノサイド）を止められず、国際社会の対応の失敗は「保護する責任」の考え方が生まれるきっかけの一つとなった。安全保障理事会は1994年にルワンダ国際刑事裁判所を設けた。"},{"t":"qa","s":"冷戦後の地域紛争","imp":2,"q":"1975年にポルトガルが撤退した後インドネシアに併合され、1999年の住民投票で独立派が勝利し、国連の暫定統治を経て2002年に独立した国はどこか。","a":"東ティモール","alt":["東ティモール民主共和国"],"e":"住民投票後の混乱に対して多国籍軍が派遣され、その後は国連東ティモール暫定行政機構（UNTAET）が統治を担った。独立後の国連PKOには日本の自衛隊も参加した。"},{"t":"mc","s":"冷戦後の地域紛争","imp":2,"q":"冷戦後の紛争とその説明の組合せとして最も適当なものを一つ選べ。","c":["湾岸戦争－安全保障理事会の決議にもとづき、多国籍軍がイラク軍をクウェートから撤退させた。","コソボ紛争－安全保障理事会の決議により正規の国連軍が組織され、紛争を終結させた。","ルワンダ内戦－国連のPKOが介入して、大量虐殺を未然に防ぐことに成功した。","東ティモール問題－住民投票の結果、インドネシアへの残留が決まった。"],"a":0,"e":"湾岸戦争では、安保理決議678で武力行使を容認された多国籍軍が、イラク軍をクウェートから撤退させた。コソボ紛争では安保理の決議がないままNATOが空爆を行ったのであり、正規の国連軍が組織されたことは一度もない。ルワンダでは国連のPKOが大量虐殺を止められなかった。東ティモールでは1999年の住民投票で独立派が勝利し、2002年に独立した。"},{"t":"qa","s":"テロとの戦い","imp":3,"q":"2001年9月11日にアメリカで起きた同時多発テロの後、アメリカがテロを実行した組織をかくまっているとして攻撃し、当時の政権を崩壊させた国はどこか。","a":"アフガニスタン","e":"テロを実行したのはイスラーム過激派組織アル・カーイダで、アフガニスタンのタリバン政権がその指導者ビン・ラーディンをかくまっていた。アメリカは自衛権を根拠に攻撃し、NATOは集団防衛を定めた北大西洋条約第5条を初めて発動した。アメリカ軍は2021年に撤退し、タリバンが再び実権を握った。"},{"t":"ex","s":"テロとの戦い","imp":1,"q":"同時多発テロ以降、テロ組織のような国家ではない主体が安全保障上の大きな脅威となったことで、どのような問題が生じたか説明せよ。","a":"テロ組織は国家ではなく、守るべき領土や国民をもたないため、報復の脅しで攻撃を思いとどまらせる抑止や、国家を対象とする国連の集団安全保障といった従来の仕組みが働きにくい。また、アメリカは国家ではない組織に対しても自衛権を行使し、脅威を事前に取り除く先制攻撃の考え方も示したため、武力行使が認められる範囲が広がることが懸念された。","e":"ポイント：①非国家主体（テロ組織）の脅威 ②抑止や集団安全保障などの従来の仕組みが働きにくい ③自衛権の拡大解釈や先制攻撃論 ④武力行使の範囲が広がることへの懸念"},{"t":"mc","s":"テロとの戦い","imp":3,"q":"2003年のイラク戦争についての記述として最も適当なものを一つ選べ。","c":["アメリカ・イギリスなどが、イラクが大量破壊兵器を保有しているとして、安全保障理事会の明確な武力行使容認決議のないまま開戦した。","イラクのクウェート侵攻に対し、安全保障理事会の決議にもとづいて多国籍軍が派遣された。","戦後の調査で、イラクが大量の核兵器を保有していたことが確認された。","フランスとドイツはアメリカを全面的に支持し、多数の部隊を派遣した。"],"a":0,"e":"イラク戦争は、大量破壊兵器の保有疑惑などを理由に、アメリカ・イギリスなどの有志連合が安保理の明確な決議のないまま開戦したもので、フセイン政権は崩壊した。単独行動主義の典型とされる。クウェート侵攻に対する多国籍軍の派遣は、1991年の湾岸戦争の説明である。戦後、大量破壊兵器は発見されなかった。フランスとドイツは開戦に強く反対した。日本はイラク復興支援特別措置法にもとづき、自衛隊をイラク南部のサマーワに派遣した。"},{"t":"qa","s":"2010年代以降の紛争","imp":3,"q":"2010年末にチュニジアで始まり、エジプトやリビアなどアラブ諸国に広がった、長期独裁政権に対する民主化運動を何というか。","a":"アラブの春","e":"インターネットやSNSが人々の動員に大きな役割を果たした。チュニジア・エジプト・リビアで長期政権が倒れたが、その後も政治的な混乱が続いた国が多く、シリアでは政権と反体制派の内戦に発展した。"},{"t":"tf","s":"2010年代以降の紛争","imp":2,"q":"シリアでは、アラブの春の影響で2011年に反政府運動が起こり、アサド政権と反体制派などが争う内戦となって、多くの難民が国外に逃れた。","a":true,"e":"正しい。ロシアやイランが政権を、欧米やトルコなどが反体制派の一部を支援し、過激派組織ISも勢力を広げて事態は複雑化した。国外に逃れたシリア難民は数百万人にのぼり、ヨーロッパに難民が押し寄せる一因となった。アサド政権は2024年12月に崩壊した。"},{"t":"qa","s":"2010年代以降の紛争","imp":2,"q":"2014年にイラクとシリアにまたがる地域で一方的に「国家」の樹立を宣言し、残虐な行為で国際社会の脅威となったイスラーム過激派組織を何というか。","a":"IS","alt":["イスラーム国","イスラム国","ISIL","ISIS","IS（イスラーム国）"],"e":"インターネットを通じて世界各地から戦闘員を集め、各国でテロも起こした。アメリカ中心の有志連合の空爆やイラク軍などの攻撃によって、2017年に拠点のモスルやラッカを失い、支配地域のほとんどを失った。"},{"t":"qa","s":"2010年代以降の紛争","imp":3,"q":"2014年にロシアが、ウクライナの政変に乗じて住民投票を口実に一方的に併合した、黒海に面した半島はどこか。","a":"クリミア半島","alt":["クリミア"],"e":"国連総会は住民投票を無効とする決議を採択し、G8はロシアの参加を停止した（G7に戻った）。日本を含む西側諸国は経済制裁を科し、ウクライナ東部でも親ロシア派武装勢力との紛争が続いた。"},{"t":"tf","s":"2010年代以降の紛争","imp":3,"q":"2022年のロシアによるウクライナ侵攻に対し、安全保障理事会はロシアを非難し撤退を求める決議を採択した。","a":false,"e":"誤り。正しくは、常任理事国であるロシアが拒否権を行使したため、安全保障理事会は決議を採択できなかった。そこで平和のための結集決議にもとづく緊急特別総会が開かれ、ロシアに即時撤退を求める決議が141か国の賛成で採択されたが、総会の決議に法的拘束力はない。"},{"t":"mc","s":"2010年代以降の紛争","imp":2,"q":"冷戦後の北大西洋条約機構（NATO）についての記述として最も適当なものを一つ選べ。","c":["冷戦の終結にともない、ワルシャワ条約機構と同時に解体された。","ポーランドやバルト三国など、かつての東側陣営の国々が加盟した。","ロシアのウクライナ侵攻を受けて、スイスとオーストリアが新たに加盟した。","加盟国の領域外での軍事行動は、一度も行ったことがない。"],"a":1,"e":"NATOは冷戦後も存続し、1999年にポーランド・チェコ・ハンガリー、2004年にバルト三国などが加盟するなど東方に拡大した。ロシアのウクライナ侵攻後は、長く軍事的中立の立場をとってきたフィンランド（2023年）とスウェーデン（2024年）が加盟して32か国となったが、スイスとオーストリアは加盟していない。NATOはボスニアやコソボでの空爆、アフガニスタンでの活動など、域外での軍事行動も行っている。NATOの東方拡大はロシアの強い反発を招いた。"},{"t":"qa","s":"パレスチナ問題","imp":2,"q":"第一次世界大戦中の1915年、イギリスがオスマン帝国と戦うアラブ人に対し、戦後のアラブ人国家の独立を約束した取り決めを何というか。","a":"フサイン・マクマホン協定","alt":["フサイン＝マクマホン協定","フセイン・マクマホン協定","フサイン・マクマホン書簡","フサイン＝マクマホン書簡"],"e":"メッカの太守フサインとイギリスの高等弁務官マクマホンの間で交わされた書簡による約束である。一方でイギリスは、1917年のバルフォア宣言でユダヤ人の民族的郷土の建設も支持しており、矛盾する約束がパレスチナ問題の原因となった。"},{"t":"qa","s":"パレスチナ問題","imp":2,"q":"1917年にイギリスが、パレスチナにユダヤ人の「民族的郷土（ナショナル・ホーム）」を建設することを支持すると表明した宣言を何というか。","a":"バルフォア宣言","e":"イギリス外相バルフォアが、戦争へのユダヤ人の協力を得るために出した。背景には、ユダヤ人が祖先の地パレスチナに国家をつくろうとするシオニズム運動があった。"},{"t":"ex","s":"パレスチナ問題","imp":3,"q":"パレスチナ問題の起源となった、第一次世界大戦中のイギリスの外交を説明せよ。","a":"第一次世界大戦中、イギリスはオスマン帝国と戦うため、フサイン・マクマホン協定でアラブ人に独立を約束する一方、バルフォア宣言でユダヤ人がパレスチナに民族的郷土を建設することを支持した。さらに、サイクス・ピコ協定でフランスなどとオスマン帝国領の分割も取り決めていた。こうした矛盾した約束（三枚舌外交）が、アラブ人とユダヤ人の対立の原因となった。","e":"ポイント：①フサイン・マクマホン協定（1915年）でアラブ人の独立を約束 ②バルフォア宣言（1917年）でユダヤ人の民族的郷土の建設を支持 ③サイクス・ピコ協定（1916年）でオスマン帝国領の分割を密約 ④矛盾した約束（三枚舌外交）が対立の原因"},{"t":"qa","s":"パレスチナ問題","imp":3,"q":"1947年に国連総会が採択した、イギリスの委任統治領パレスチナをユダヤ人国家とアラブ人国家に分け、エルサレムを国際管理下に置くとした決議を何というか。","a":"パレスチナ分割決議","alt":["パレスチナ分割案","国連パレスチナ分割決議","パレスチナ分割決議案"],"e":"人口では少数だったユダヤ人に土地の半分以上を割り当てたため、アラブ側は強く反発した。翌1948年にイスラエルが建国を宣言すると、周辺のアラブ諸国との間で第1次中東戦争が起こり、多くのパレスチナ難民が生まれた。"},{"t":"mc","s":"パレスチナ問題","imp":3,"q":"中東戦争についての記述として最も適当なものを一つ選べ。","c":["第1次中東戦争は、エジプトのナセル大統領によるスエズ運河の国有化をきっかけに起こった。","第2次中東戦争の際には、緊急特別総会の決議によって、初めての本格的な平和維持軍である国連緊急軍が派遣された。","第3次中東戦争ではアラブ諸国が勝利し、イスラエルはヨルダン川西岸とガザ地区から撤退した。","第4次中東戦争はイスラエル建国の直後に起こり、多数のパレスチナ難民を生んだ。"],"a":1,"e":"第2次中東戦争（1956年、スエズ戦争）では、英仏の拒否権で安保理が動けなかったため、平和のための結集決議にもとづく緊急特別総会の決議で国連緊急軍（UNEF）が派遣された。スエズ運河の国有化がきっかけになったのは第2次中東戦争である。第3次中東戦争（1967年）ではイスラエルが圧勝し、ヨルダン川西岸・ガザ地区・ゴラン高原・シナイ半島などを占領した。イスラエル建国の直後に起こり多数のパレスチナ難民を生んだのは第1次中東戦争（1948年）であり、第4次中東戦争（1973年）は第1次石油危機の原因となった。"},{"t":"qa","s":"パレスチナ問題","imp":2,"q":"1964年に結成され、のちにアラファトが議長を務めて、パレスチナ人の民族自決とパレスチナ国家の樹立をめざして活動した組織を何というか。","a":"パレスチナ解放機構","alt":["PLO"],"e":"当初は武装闘争を中心としたが、のちにイスラエルとの共存を受け入れる方向に転じた。1974年には国連総会のオブザーバーの資格を得た。"},{"t":"mc","s":"パレスチナ問題","imp":2,"q":"パレスチナ問題の経緯についての記述として最も適当なものを一つ選べ。","c":["1987年、イスラエルの占領地でパレスチナ人による投石などの民衆蜂起（インティファーダ）が始まった。","バルフォア宣言で、イギリスはアラブ人にパレスチナでの独立国家の建設を約束した。","パレスチナ分割決議は、安全保障理事会で常任理事国の全会一致によって採択された。","第1次中東戦争の結果、ヨルダン川西岸とガザ地区にパレスチナ人の独立国家が建国された。"],"a":0,"e":"インティファーダはアラビア語で「一斉蜂起」などを意味し、1987年にガザ地区やヨルダン川西岸で始まった（2000年には第2次インティファーダが起きた）。バルフォア宣言はユダヤ人の民族的郷土の建設を支持したもので、アラブ人に独立を約束したのはフサイン・マクマホン協定である。パレスチナ分割決議は1947年に国連総会で採択された。第1次中東戦争の後もパレスチナ人の国家は建国されず、多くのパレスチナ難民が生まれ、ヨルダン川西岸はヨルダンが、ガザ地区はエジプトが支配した。"},{"t":"qa","s":"パレスチナ問題","imp":3,"q":"1993年にノルウェーの仲介でイスラエルとPLOが互いを承認し、パレスチナの暫定自治を始めることで合意した協定を何というか。","a":"オスロ合意","alt":["パレスチナ暫定自治協定","オスロ協定","パレスチナ暫定自治原則宣言"],"e":"アメリカのクリントン大統領の立会いのもと、イスラエルのラビン首相とPLOのアラファト議長が署名し、ガザ地区とヨルダン川西岸のエリコから自治が始まった。しかし、ラビン首相の暗殺（1995年）、ユダヤ人入植地の拡大、過激派のテロなどで和平は行き詰まった。"},{"t":"tf","s":"パレスチナ問題","imp":2,"q":"オスロ合意によってパレスチナ国家が正式に独立し、パレスチナは国連の加盟国となった。","a":false,"e":"誤り。正しくは、オスロ合意で決まったのはパレスチナの暫定自治であり、独立国家の樹立は最終的な地位交渉にゆだねられたまま実現していない。パレスチナは2012年に国連総会で「オブザーバー国家」の地位を認められたが、加盟国ではない。"},{"t":"tf","s":"パレスチナ問題","imp":2,"q":"2023年10月、ガザ地区を実効支配するイスラーム組織ハマスがイスラエルを攻撃し、これに対してイスラエルがガザ地区で大規模な軍事作戦を行い、多数の市民が犠牲となる深刻な人道危機が起きた。","a":true,"e":"正しい。ハマスは2007年からガザ地区を実効支配している。ガザ地区では食料や医薬品が極度に不足し、国連機関などが人道支援の拡大を訴えた。パレスチナ問題の解決策としては、イスラエルとパレスチナ国家の共存をめざす「二国家解決」が国際社会で広く支持されている。"},{"t":"qa","s":"民族問題と民族自決","imp":3,"q":"各民族が、他の国家や民族から干渉されずに、自らの政治的な地位や国家のあり方を自ら決定する権利を何というか。","a":"民族自決権","alt":["民族自決","人民の自決権","自決権"],"e":"ウィルソンの14か条で唱えられ、国連憲章や国際人権規約（A規約・B規約の共通第1条）にも定められている。第二次世界大戦後のアジア・アフリカ諸国の独立を支えたが、一つの国家の中の少数民族による分離独立の要求は、国家の領土の保全と対立することもある。"},{"t":"qa","s":"民族問題と民族自決","imp":2,"q":"イギリスへの残留を望むプロテスタント系住民とアイルランドへの帰属を望むカトリック系住民が対立し、テロや衝突が続いたが、1998年に和平合意が結ばれた地域はどこか。","a":"北アイルランド","e":"1998年のベルファスト合意（グッドフライデー合意）で、両派が参加する自治政府の設置などが決まり、長年の紛争がおさまった。"},{"t":"qa","s":"民族問題と民族自決","imp":1,"q":"トルコ・イラク・イラン・シリアなどにまたがって居住し、「国家をもたない最大の民族」と呼ばれる人々を何というか。","a":"クルド人","alt":["クルド民族","クルド族"],"e":"第一次世界大戦後に引かれた国境線によって居住地域が分断された。各国で少数民族として独立や自治を求める運動を続けており、湾岸戦争後にはイラク北部で多くのクルド人が難民となった。"},{"t":"mc","s":"民族問題と民族自決","imp":2,"q":"民族紛争・地域紛争とその説明の組合せとして最も適当なものを一つ選べ。","c":["カシミール紛争－インドとパキスタンが領有を争い、ヒンドゥー教徒とイスラーム教徒の対立もからんでいる。","チェチェン紛争－中国からの独立を求めるイスラーム系住民と中国政府が争った。","スリランカの内戦－多数派のタミル人と少数派のシンハラ人が争い、現在も続いている。","ロヒンギャ問題－イスラエル国内の少数民族が国籍を認められず、迫害されている。"],"a":0,"e":"カシミール紛争は、1947年のインドとパキスタンの分離独立以来続く領有権争いである。チェチェン紛争は、ロシア連邦内のチェチェン共和国の独立派とロシアとの紛争である。スリランカでは多数派で仏教徒のシンハラ人と少数派でヒンドゥー教徒のタミル人が争い、内戦は2009年に政府軍の勝利で終わった。ロヒンギャはミャンマーに住むイスラーム系の少数民族で、国籍を認められず、2017年の軍の掃討作戦で70万人以上が隣国バングラデシュに逃れた。"},{"t":"tf","s":"民族問題と民族自決","imp":1,"q":"ミャンマーのロヒンギャに対する迫害をめぐり、アフリカのガンビアがジェノサイド条約違反を理由に、ミャンマーを国際司法裁判所に提訴した。","a":true,"e":"正しい。2019年に提訴され、国際司法裁判所は2020年、ミャンマーにジェノサイドを防ぐための措置をとるよう命じた（暫定措置）。直接の被害国でなくても、条約上の義務を根拠に提訴できることを示した例である。"},{"t":"tf","s":"単独行動主義と多国間主義","imp":1,"q":"多くの国が国連などの場で協議し、共通のルールにもとづいて協調しながら問題の解決をはかろうとする外交姿勢を、単独行動主義（ユニラテラリズム）という。","a":false,"e":"誤り。正しくは、この姿勢は多国間主義（マルチラテラリズム）である。単独行動主義は、国際的な合意や国連の決定よりも自国の判断や利益を優先して単独で行動しようとする姿勢で、2000年代のアメリカのブッシュ（子）政権による京都議定書からの離脱やイラク戦争の開戦などが例とされる。"},{"t":"ex","s":"単独行動主義と多国間主義","imp":2,"q":"単独行動主義と多国間主義の違いを、具体例をあげて説明せよ。","a":"単独行動主義は、国際的な合意や国連の決定にしばられず、自国の判断と利益にもとづいて単独で行動する姿勢であり、アメリカが安保理の明確な容認決議なしにイラク戦争を始めた例や、2017年にトランプ政権がパリ協定からの離脱を表明した例がある。多国間主義は、多くの国が国連などの場で協議し、共通のルールにもとづいて協調して問題を解決しようとする姿勢である。","e":"ポイント：①単独行動主義（ユニラテラリズム）＝自国の判断・利益を優先 ②多国間主義（マルチラテラリズム）＝国際協調・共通ルール ③具体例（イラク戦争、京都議定書やパリ協定からの離脱など） ④単独行動主義は国際協調を損なうとの批判"}]});</script>
<script>QDATA.push({"unit":"u13","questions":[{"t":"qa","s":"反核運動と核抑止","imp":3,"q":"1954年、太平洋のビキニ環礁でのアメリカの水爆実験によって、日本のマグロ漁船の乗組員が被ばくした事件を何というか。","a":"第五福竜丸事件","alt":["第五福竜丸","ビキニ事件","第五福龍丸事件","ビキニ水爆実験被災事件"],"e":"無線長の久保山愛吉さんが半年後に亡くなった。広島・長崎に続く核兵器による日本人の被害として、国民に大きな衝撃を与えた。"},{"t":"tf","s":"反核運動と核抑止","imp":2,"q":"第五福竜丸事件をきっかけに原水爆禁止を求める署名運動が全国に広がり、翌1955年に広島で第1回原水爆禁止世界大会が開かれた。","a":true,"e":"正しい。東京都杉並区の主婦らが始めた署名運動は全国に広がり、多くの署名を集めた。こうした原水爆禁止運動は、核兵器の廃絶を訴える日本の平和運動の大きな流れとなった。"},{"t":"qa","s":"反核運動と核抑止","imp":2,"q":"1955年、イギリスの哲学者ラッセルと物理学者アインシュタインらが、核兵器の廃絶と戦争の廃止を訴えた宣言を何というか。","a":"ラッセル・アインシュタイン宣言","alt":["ラッセル＝アインシュタイン宣言"],"e":"日本の湯川秀樹を含む11人の科学者が署名した。この宣言を受けて、1957年にカナダで科学者による国際会議（パグウォッシュ会議）が開かれた。"},{"t":"qa","s":"反核運動と核抑止","imp":2,"q":"ラッセル・アインシュタイン宣言を受けて1957年に始まり、世界の科学者が核兵器の廃絶や科学者の社会的責任について話し合ってきた国際会議を何というか。","a":"パグウォッシュ会議","e":"第1回会議がカナダのパグウォッシュ村で開かれたことからこの名がある。日本からは湯川秀樹・朝永振一郎らが参加した。この会議は1995年にノーベル平和賞を受賞した。"},{"t":"tf","s":"反核運動と核抑止","imp":1,"q":"パグウォッシュ会議は、核兵器保有国の政府代表が集まり、核軍縮条約の締結を交渉する政府間会議である。","a":false,"e":"誤り。正しくは、パグウォッシュ会議は科学者が個人の立場で参加する国際会議であり、政府間の交渉の場ではない。核兵器の危険性を科学者の立場から訴え、各国の政策にも影響を与えてきた。"},{"t":"ex","s":"反核運動と核抑止","imp":3,"q":"核抑止論とはどのような考え方か。その問題点にもふれて説明せよ。","a":"核抑止論は、相手国に核兵器による耐えがたい報復を受けると思わせることで、相手に攻撃を思いとどまらせ、戦争を防ごうとする考え方である。しかし、相手を上回る核戦力を求めて核軍拡競争を招きやすく、誤算や事故によって核戦争が起こる危険がある。また、核兵器の保有を正当化し、核拡散を促すという批判もある。","e":"ポイント：①報復の脅威によって攻撃を思いとどまらせる ②恐怖の均衡（相互確証破壊） ③核軍拡競争を招く ④偶発的な核戦争や核拡散の危険"},{"t":"qa","s":"反核運動と核抑止","imp":2,"q":"同盟国の核兵器による報復力によって、自国への攻撃を抑止しようとする考え方（拡大抑止）を、比喩的に何というか。","a":"核の傘","e":"日本はアメリカの核の傘のもとにあり、核兵器を「持たず、作らず、持ち込ませず」という非核三原則を掲げる一方で、アメリカの核抑止力に依存している。このことは、日本が核兵器禁止条約に参加していない理由の一つとされている。"},{"t":"qa","s":"核軍縮条約","imp":3,"q":"1963年に米英ソが調印し、大気圏内・宇宙空間・水中での核実験を禁止したが、地下核実験は禁止しなかった条約を何というか。","a":"部分的核実験禁止条約","alt":["PTBT","部分的核実験停止条約"],"e":"キューバ危機の翌年に結ばれた。地下核実験は対象外だったため核開発は続けられ、核開発で米英ソを追う立場にあったフランスと中国は参加しなかった。"},{"t":"qa","s":"核軍縮条約","imp":3,"q":"1968年に調印、1970年に発効し、核兵器の保有をアメリカ・ソ連（ロシア）・イギリス・フランス・中国の5か国に限定して、それ以外の国が核兵器をもつことを禁止した条約を何というか。","a":"核拡散防止条約","alt":["NPT","核兵器不拡散条約","核不拡散条約","核兵器の不拡散に関する条約"],"e":"日本は1976年に批准した。当初は25年の期限つきだったが、1995年に無期限延長が決まった。5年ごとに再検討会議が開かれ、条約の運用状況が話し合われている。"},{"t":"mc","s":"核軍縮条約","imp":3,"q":"核拡散防止条約（NPT）についての記述として最も適当なものを一つ選べ。","c":["非核兵器国は、国際原子力機関（IAEA）による査察（保障措置）を受け入れる義務を負う。","核兵器国には、核軍縮のための交渉を行う義務は課されていない。","インドとパキスタンはNPTに加盟したうえで核実験を行った。","NPTで核兵器の保有を認められているのは、アメリカ・ロシア・イギリス・フランス・中国・インドの6か国である。"],"a":0,"e":"非核兵器国は原子力の利用を平和目的に限り、IAEAの保障措置（査察）を受け入れる。核兵器国にも誠実に核軍縮交渉を行う義務がある（第6条）。インド・パキスタン・イスラエルはNPTに加盟しておらず（南スーダンも未加盟）、北朝鮮は2003年に脱退を宣言して核実験を行った。NPTが核兵器国と認めるのは、1967年1月1日より前に核爆発を行ったアメリカ・ロシア・イギリス・フランス・中国の5か国だけである。"},{"t":"ex","s":"核軍縮条約","imp":2,"q":"核拡散防止条約（NPT）が「不平等」だと批判される理由を説明せよ。","a":"NPTは、1967年1月1日より前に核爆発を行ったアメリカ・ロシア・イギリス・フランス・中国の5か国だけに核兵器の保有を認め、それ以外の国には保有を禁止して国際原子力機関の査察を義務づけている。核兵器国には核軍縮交渉の義務があるが核軍縮は十分に進んでおらず、権利と義務が不平等だと批判されている。インドなどはこれを理由に加盟していない。","e":"ポイント：①5か国だけに核兵器の保有を認める ②非核兵器国には保有の禁止とIAEAの査察 ③核兵器国の核軍縮義務が十分に果たされていない ④インド・パキスタン・イスラエルの非加盟"},{"t":"mc","s":"核軍縮条約","imp":2,"q":"米ソ（米ロ）間で結ばれた核兵器に関する条約を、調印の古い順に並べたとき、3番目にくるものを一つ選べ。","c":["第1次戦略兵器制限条約（SALTⅠ）","中距離核戦力（INF）全廃条約","第1次戦略兵器削減条約（STARTⅠ）","新戦略兵器削減条約（新START）"],"a":2,"e":"SALTⅠ（1972年）→INF全廃条約（1987年）→STARTⅠ（1991年）→新START（2010年）の順である。SALTは核兵器の数に上限を設ける「制限」、INFは特定の種類の核兵器の「全廃」、STARTは戦略核兵器の「削減」である点も区別しておく。"},{"t":"qa","s":"核軍縮条約","imp":1,"q":"2010年に米ロが調印し、配備する戦略核弾頭をそれぞれ1550発以下に削減することを定めた条約を何というか。","a":"新戦略兵器削減条約","alt":["新START","新START条約"],"e":"2011年に発効し、2021年に5年間延長されたが、ロシアは2023年に条約の履行停止を表明した。延長の期限である2026年2月に失効し、米ロの核戦力を制限する条約はなくなった。"},{"t":"qa","s":"核軍縮条約","imp":3,"q":"1996年に国連総会で採択され、地下核実験を含むあらゆる核爆発実験を禁止したが、まだ発効していない条約を何というか。","a":"包括的核実験禁止条約","alt":["CTBT"],"e":"発効には、原子炉をもつなど条約に指定された44か国すべての批准が必要だが、アメリカ・中国などが批准せず、インド・パキスタン・北朝鮮は署名もしていないため発効していない。ロシアは2023年に批准を撤回した。"},{"t":"tf","s":"核軍縮条約","imp":2,"q":"包括的核実験禁止条約（CTBT）は、核爆発をともなわない未臨界実験も禁止しているため、アメリカやロシアは未臨界実験を行っていない。","a":false,"e":"誤り。正しくは、CTBTが禁止するのは核爆発をともなう実験であり、核爆発に至らない未臨界（臨界前）核実験は禁止の対象外とされる。アメリカやロシアは未臨界実験を行っており、核兵器の性能の維持につながると批判されている。"},{"t":"ex","s":"核軍縮条約","imp":2,"q":"部分的核実験禁止条約（PTBT）と包括的核実験禁止条約（CTBT）の違いを説明せよ。","a":"PTBTは1963年に米英ソが結んだ条約で、大気圏内・宇宙空間・水中での核実験を禁止したが、地下核実験は禁止しなかった。CTBTは1996年に国連総会で採択され、地下を含むあらゆる場所での核爆発実験を禁止したが、発効に必要な国々の批准がそろわず、まだ発効していない。","e":"ポイント：①PTBTは地下核実験が対象外 ②CTBTは地下を含むすべての核爆発実験を禁止 ③CTBTは未発効 ④未臨界実験はCTBTでも禁止されていない"},{"t":"qa","s":"核軍縮条約","imp":3,"q":"核兵器の開発・実験・製造・保有・使用・使用の威嚇などを全面的に禁止し、2017年に国連で採択されて2021年に発効した条約を何というか。","a":"核兵器禁止条約","alt":["TPNW","核兵器の禁止に関する条約"],"e":"前文で被爆者（ヒバクシャ）の受け入れがたい苦しみに言及している。NGOのICAN（核兵器廃絶国際キャンペーン）が採択に貢献した。核兵器国やNATO諸国、アメリカの核の傘のもとにある日本などは参加していない。"},{"t":"tf","s":"核軍縮条約","imp":3,"q":"唯一の戦争被爆国である日本は、核兵器禁止条約の採択に賛成し、2021年の発効と同時に締約国となった。","a":false,"e":"誤り。正しくは、日本は条約の交渉に参加せず、署名・批准もしていない。日本政府は、核兵器国が参加していないことや、アメリカの核抑止力に依存している安全保障環境などを理由に、核兵器国と非核兵器国の「橋渡し」をめざすとしている。締約国会議へのオブザーバー参加も見送ってきた。"},{"t":"tf","s":"核軍縮条約","imp":1,"q":"核兵器禁止条約は、条約に参加していない核兵器国に対しては法的な拘束力をもたない。","a":true,"e":"正しい。条約は原則として締約国だけを拘束するため、核兵器を保有する国がどこも参加していない現状では、核兵器を直接減らす効果は限られている。それでも、核兵器を違法とする国際的な規範をつくり、核兵器の非人道性を広く訴える意義があるとされる。"},{"t":"mc","s":"核軍縮条約","imp":2,"q":"核兵器禁止条約と核拡散防止条約（NPT）を比較した記述として最も適当なものを一つ選べ。","c":["NPTは5か国に核兵器の保有を認めているが、核兵器禁止条約はすべての締約国に核兵器の保有を禁止している。","核兵器禁止条約には、アメリカやロシアなどの核兵器国もすべて参加している。","NPTは核兵器の使用を全面的に禁止しているが、核兵器禁止条約は使用を禁止していない。","日本はNPTには加盟していないが、核兵器禁止条約には参加している。"],"a":0,"e":"NPTは5か国を核兵器国として保有を認めたうえで、核兵器の拡散を防ぐ条約である。これに対し核兵器禁止条約は、締約国に核兵器の開発・保有・使用などを全面的に禁止する。核兵器禁止条約には核兵器をもつ国はどこも参加していない。核兵器の使用を禁止しているのは核兵器禁止条約のほうであり、NPTは使用そのものを禁止する条約ではない。日本は1976年にNPTを批准したが、核兵器禁止条約には参加していない。"},{"t":"qa","s":"核軍縮条約","imp":2,"q":"ラテンアメリカのトラテロルコ条約のように、一定の地域で核兵器の製造・取得・配備などを禁止する条約によって設けられた地域を何というか。","a":"非核地帯","alt":["非核兵器地帯"],"e":"ほかに、南太平洋のラロトンガ条約、東南アジアのバンコク条約、アフリカのペリンダバ条約、中央アジアのセメイ条約がある。南極条約も南極の非軍事化を定めているが、北東アジアには非核地帯は設けられていない。"},{"t":"qa","s":"生物・化学兵器と通常兵器","imp":2,"q":"1993年に調印、1997年に発効し、化学兵器の開発・生産・保有・使用を禁止して、保有する化学兵器の廃棄を義務づけた条約を何というか。","a":"化学兵器禁止条約","alt":["CWC"],"e":"実施機関として化学兵器禁止機関（OPCW）がオランダのハーグに置かれ、2013年にノーベル平和賞を受賞した。日本は、旧日本軍が中国に遺棄した化学兵器の廃棄処理を進めている。生物兵器については、1972年に生物兵器禁止条約が調印されている（1975年発効）。"},{"t":"qa","s":"生物・化学兵器と通常兵器","imp":3,"q":"カナダ政府とNGOが連携して条約づくりを進め（オタワ・プロセス）、1997年に調印された、対人地雷の使用・生産・保有などを全面的に禁止する条約を何というか。","a":"対人地雷全面禁止条約","alt":["オタワ条約","対人地雷禁止条約"],"e":"NGOの地雷禁止国際キャンペーン（ICBL）が中心的な役割を果たし、同年にノーベル平和賞を受賞した。日本は1998年に批准した（条約は1999年発効）。アメリカ・ロシア・中国は参加していない。"},{"t":"tf","s":"生物・化学兵器と通常兵器","imp":2,"q":"クラスター弾禁止条約は、ノルウェーなどの国々とNGOが協力して進めた交渉（オスロ・プロセス）によって2008年に採択され、日本も締約国となっている。","a":true,"e":"正しい。クラスター弾は多数の子爆弾をばらまくため、不発弾が戦闘後も長く市民を傷つける。日本は2009年に批准した（条約は2010年発効）。アメリカ・ロシア・中国は参加していない。"},{"t":"qa","s":"生物・化学兵器と通常兵器","imp":1,"q":"2013年に国連総会で採択され、戦車・戦闘機・小型武器などの通常兵器の国際取引を規制して、紛争地やテロ組織への流出を防ぐことを目的とする条約を何というか。","a":"武器貿易条約","alt":["ATT"],"e":"2014年に発効し、日本も締約国である。核兵器などの大量破壊兵器ではなく、通常兵器の国際的な取引を規制する点に特徴がある。"},{"t":"mc","s":"生物・化学兵器と通常兵器","imp":2,"q":"軍縮に関する条約についての記述として最も適当なものを一つ選べ。","c":["対人地雷全面禁止条約は、NGOと有志国が協力して交渉を進め、成立した。","化学兵器禁止条約は、化学兵器の使用は禁止したが、保有は認めている。","生物兵器禁止条約は、冷戦終結後の2000年代になって初めて結ばれた。","武器貿易条約は、核兵器の国際取引を全面的に禁止した。"],"a":0,"e":"対人地雷全面禁止条約は、ICBLなどのNGOとカナダなどの有志国の協力（オタワ・プロセス）で成立した。化学兵器禁止条約は化学兵器の開発・生産・保有・使用を禁止し、廃棄を義務づけている。生物兵器禁止条約は冷戦期の1972年に調印された。武器貿易条約が規制するのは通常兵器の国際取引であり、核兵器を対象とするものではない。"},{"t":"ex","s":"生物・化学兵器と通常兵器","imp":1,"q":"対人地雷全面禁止条約やクラスター弾禁止条約が成立した過程には、従来の軍縮条約と比べてどのような特徴があるか説明せよ。","a":"従来の軍縮条約は、主に大国どうしの交渉や国連の軍縮会議で結ばれてきた。これに対し対人地雷全面禁止条約やクラスター弾禁止条約は、兵器の非人道性を訴えるNGOと、カナダやノルウェーなどの賛同する国々が連携して交渉を進め、短期間で成立させた。ただし、アメリカ・ロシア・中国などの軍事大国は参加しておらず、実効性に課題がある。","e":"ポイント：①NGOと有志国の連携 ②兵器の非人道性を重視 ③オタワ・プロセス／オスロ・プロセス ④軍事大国の不参加という課題"}]});</script>
<script>QDATA.push({"unit":"u13","questions":[{"t":"qa","s":"第三世界の台頭","imp":2,"q":"1954年に中国の周恩来首相とインドのネルー首相が会談して確認した、領土・主権の相互尊重、相互不可侵、内政不干渉、平等互恵、平和共存からなる原則を何というか。","a":"平和五原則","e":"翌1955年のアジア・アフリカ会議（バンドン会議）で採択された平和十原則に受け継がれた。東西どちらの陣営にも属さない第三世界の国々の外交の基本的な考え方となった。"},{"t":"qa","s":"第三世界の台頭","imp":3,"q":"1955年にインドネシアで開かれ、アジア・アフリカの29か国が参加して、反植民地主義や平和共存などをうたう平和十原則を採択した会議を何というか。","a":"アジア・アフリカ会議","alt":["バンドン会議","AA会議","第1回アジア・アフリカ会議"],"e":"インドネシアのバンドンで開かれたことからバンドン会議とも呼ばれる。東西どちらの陣営にも属さない第三世界の結束を示した会議であり、日本も参加した。"},{"t":"qa","s":"第三世界の台頭","imp":2,"q":"1961年にユーゴスラビアのベオグラードで第1回が開かれ、東西いずれの軍事同盟にも加わらない国々が、平和共存や反植民地主義を訴えた会議を何というか。","a":"非同盟諸国首脳会議","alt":["非同盟諸国会議","非同盟首脳会議","非同盟諸国首脳会談"],"e":"ユーゴスラビアのティトー、インドのネルー、エジプトのナセルらが中心となった。参加国は増え続け、冷戦期の国際政治における第三世界の発言力を高めた。"},{"t":"tf","s":"第三世界の台頭","imp":2,"q":"1960年はアフリカで17か国が独立したことから「アフリカの年」と呼ばれ、同年に国連総会は植民地独立付与宣言を採択した。","a":true,"e":"正しい。アジア・アフリカの新興独立国が次々に国連に加盟したことで、総会では発展途上国が多数を占めるようになった。こうした国々は、南北問題の解決などを国際社会に強く訴えるようになった。"},{"t":"mc","s":"第三世界の台頭","imp":1,"q":"第三世界（非同盟諸国）についての記述として最も適当なものを一つ選べ。","c":["平和十原則は、1954年の周恩来とネルーの会談で初めて発表された。","第1回非同盟諸国首脳会議は、インドネシアのバンドンで開かれた。","第三世界の国々は、東西いずれの陣営にも属さない立場から、平和共存や反植民地主義を訴えた。","「アフリカの年」と呼ばれる1960年には、アフリカのすべての植民地が独立を果たした。"],"a":2,"e":"第三世界の国々は、米ソどちらの陣営にも属さない非同盟の立場から、平和共存や反植民地主義を訴えた。1954年の周恩来・ネルー会談で発表されたのは平和五原則であり、平和十原則は1955年のアジア・アフリカ会議（バンドン会議）で採択された。第1回非同盟諸国首脳会議は1961年にユーゴスラビアのベオグラードで開かれた。1960年には17か国が独立したが、その後も独立は続いており、すべての植民地が独立したわけではない。"},{"t":"qa","s":"戦後日本の外交","imp":3,"q":"1951年に日本が48か国と調印し、翌1952年に発効して日本が独立を回復した条約を何というか。","a":"サンフランシスコ平和条約","alt":["対日平和条約","サンフランシスコ講和条約","日本国との平和条約"],"e":"同じ日に日米安全保障条約も調印された。ソ連などは会議に参加したが調印を拒否し、中華人民共和国と中華民国はいずれも会議に招かれなかった。沖縄・奄美・小笠原はアメリカの施政下に置かれた。"},{"t":"ex","s":"戦後日本の外交","imp":3,"q":"サンフランシスコ平和条約をめぐる「全面講和」と「片面講和（単独講和）」の対立について説明せよ。","a":"全面講和論は、ソ連や中国を含むすべての交戦国と講和を結ぶべきだとする主張で、冷戦の中で中立を保つことを重視した。これに対し吉田茂内閣は、ソ連などを除くアメリカなど西側諸国中心の片面講和（単独講和）を選び、同時に日米安全保障条約を結んで西側陣営の一員となった。その結果、ソ連や中国などとの国交回復は後の課題として残された。","e":"ポイント：①全面講和＝すべての交戦国との講和（中立の重視） ②片面講和（単独講和）＝西側諸国中心の講和 ③日米安保条約で西側陣営へ ④ソ連・中国などとの国交回復が課題に"},{"t":"mc","s":"戦後日本の外交","imp":2,"q":"1957年に岸信介内閣が初めての『外交青書』で示した日本外交の三原則に含まれないものを一つ選べ。","c":["国際連合中心主義","自由主義諸国との協調","アジアの一員としての立場の堅持","非武装中立の堅持"],"a":3,"e":"外交三原則は、国連中心主義、自由主義諸国との協調、アジアの一員としての立場の堅持の3つであり、国連加盟の翌年に示された。非武装中立は、政府ではなく野党の日本社会党などが主張した考え方であり、外交三原則には含まれない。実際の日本外交は、日米関係を基軸として展開されてきた。"},{"t":"qa","s":"戦後日本の外交","imp":3,"q":"1956年に鳩山一郎首相がモスクワで調印し、日本とソ連の国交を回復させた文書を何というか。","a":"日ソ共同宣言","e":"戦争状態の終了と国交の回復を定め、平和条約の締結後に歯舞群島と色丹島を日本に引き渡すことにソ連が同意した。ソ連が日本の国連加盟を支持したため、同年12月に日本は国連に加盟した。平和条約は現在も結ばれていない。"},{"t":"tf","s":"戦後日本の外交","imp":3,"q":"日ソ共同宣言で、ソ連は北方四島すべてを、平和条約の締結後に日本に引き渡すことに同意した。","a":false,"e":"誤り。正しくは、日ソ共同宣言で引き渡しが約束されたのは歯舞群島と色丹島の2つであり、国後島・択捉島については合意できなかった。しかも引き渡しは平和条約の締結後とされ、平和条約はいまだに結ばれていない。"},{"t":"qa","s":"戦後日本の外交","imp":3,"q":"1965年に佐藤栄作内閣が大韓民国と結び、両国の国交を正常化した条約を何というか。","a":"日韓基本条約","alt":["日本国と大韓民国との間の基本関係に関する条約"],"e":"韓国政府を「朝鮮にある唯一の合法的な政府」と確認し、韓国併合条約など戦前の条約は「もはや無効」とした。同時に結ばれた日韓請求権協定で日本が経済協力を行い、両国間の請求権の問題は「完全かつ最終的に解決された」とされた。北朝鮮とは現在も国交がない。"},{"t":"qa","s":"戦後日本の外交","imp":3,"q":"1972年に田中角栄首相が北京を訪れ、中華人民共和国との国交を正常化した文書を何というか。","a":"日中共同声明","e":"日本は中華人民共和国政府を中国の唯一の合法政府と認め、台湾の中華民国政府との外交関係は断絶した（民間の実務関係は維持）。中国は日本に対する戦争賠償の請求を放棄した。"},{"t":"mc","s":"戦後日本の外交","imp":2,"q":"戦後日本の外交についての記述として最も適当なものを一つ選べ。","c":["日中平和友好条約は、日中共同声明と同じ1972年に、田中角栄内閣のもとで締結された。","日韓基本条約によって、日本は北朝鮮とも国交を正常化した。","1978年に締結された日中平和友好条約には、いずれの国も覇権を求めないとする反覇権条項が盛り込まれた。","サンフランシスコ平和条約には、ソ連と中華人民共和国も調印した。"],"a":2,"e":"日中平和友好条約は1978年に福田赳夫内閣のもとで締結され、アジア・太平洋地域などで覇権を求めないとする反覇権条項が盛り込まれた。1972年に田中角栄内閣のもとで出されたのは日中共同声明である。日韓基本条約は韓国との条約であり、北朝鮮とは現在も国交がない。サンフランシスコ平和条約には、ソ連は調印を拒否し、中華人民共和国は会議に招かれなかった。"},{"t":"ex","s":"戦後日本の外交","imp":2,"q":"サンフランシスコ平和条約の後、日本がソ連・韓国・中国との国交をどのように正常化したか、それぞれの文書名にふれて説明せよ。","a":"サンフランシスコ平和条約にはソ連・中国などが加わらなかったため、日本はこれらの国と個別に国交を回復した。ソ連とは1956年の日ソ共同宣言で国交を回復し、国連加盟も実現した。韓国とは1965年の日韓基本条約で国交を正常化し、中華人民共和国とは1972年の日中共同声明で国交を正常化して、1978年に日中平和友好条約を結んだ。","e":"ポイント：①日ソ共同宣言（1956年）と国連加盟 ②日韓基本条約（1965年） ③日中共同声明（1972年）と日中平和友好条約（1978年） ④北朝鮮とは現在も国交がない"},{"t":"qa","s":"戦後日本の外交","imp":2,"q":"2002年に小泉純一郎首相が北朝鮮を訪問し、金正日国防委員長との間で国交正常化交渉の再開などを確認した文書を何というか。","a":"日朝平壌宣言","alt":["平壌宣言"],"e":"北朝鮮は日本人の拉致を初めて認めて謝罪し、同年に拉致被害者5人が帰国した。日本は植民地支配への反省とおわびを表明し、国交正常化後の経済協力を約束した。しかし、拉致問題や核・ミサイル開発の問題が解決しないため、国交正常化は実現していない。"},{"t":"tf","s":"戦後日本の外交","imp":2,"q":"日本と北朝鮮は、2002年の日朝平壌宣言によって国交を正常化した。","a":false,"e":"誤り。正しくは、日朝平壌宣言は国交正常化交渉の再開などを確認したものであり、拉致問題や核・ミサイル問題が解決しないため、日本と北朝鮮の間には現在も国交がない。日本政府は、すべての拉致被害者の一刻も早い帰国を求めている。"},{"t":"qa","s":"日本の領土問題","imp":3,"q":"日本政府が日本固有の領土であるとし、ロシアに不法に占拠されているとしている北方領土の4つの島（島群）をすべて答えよ。","a":"択捉島・国後島・色丹島・歯舞群島","alt":["択捉・国後・色丹・歯舞","歯舞群島・色丹島・国後島・択捉島","択捉島、国後島、色丹島、歯舞群島","歯舞・色丹・国後・択捉"],"e":"1855年の日露通好条約で択捉島とウルップ島の間に国境が定められて以来、一度も外国の領土になったことがないというのが日本政府の立場である。1945年にソ連が占領し、現在はロシアが支配している。"},{"t":"qa","s":"日本の領土問題","imp":2,"q":"島根県に属し、1905年に閣議決定によって島根県に編入されたが、1950年代から韓国が警備隊を常駐させて不法に占拠している島はどこか。","a":"竹島","e":"韓国は1952年に一方的に「李承晩ライン」を設定して竹島を取り込んだ。日本は1954年・1962年・2012年に国際司法裁判所への付託を提案したが、裁判には当事国双方の同意が必要であり、韓国が応じないため実現していない。"},{"t":"qa","s":"日本の領土問題","imp":2,"q":"沖縄県石垣市に属し、日本が有効に支配しているが、1970年代から中国と台湾が領有権を主張している諸島はどこか。","a":"尖閣諸島","e":"1895年に閣議決定で日本の領土に編入された。1968年に国連の機関が行った調査で周辺海域に石油資源が埋蔵されている可能性が指摘された後、中国と台湾が領有権を主張し始めた。2012年には日本政府が魚釣島など3つの島を購入して国有化した。"},{"t":"ex","s":"日本の領土問題","imp":3,"q":"北方領土・竹島・尖閣諸島について、それぞれの現状と日本政府の立場の違いを説明せよ。","a":"北方領土はロシアが、竹島は韓国が不法に占拠しているとして、日本政府はいずれも日本固有の領土として返還を求め、交渉や国際司法裁判所への付託の提案などを行っている。これに対し尖閣諸島は日本が有効に支配しており、日本政府は中国などの主張に対し、解決しなければならない領有権の問題はそもそも存在しないという立場をとっている。","e":"ポイント：①北方領土＝ロシアによる不法占拠 ②竹島＝韓国による不法占拠、国際司法裁判所への付託を提案 ③尖閣諸島＝日本が有効に支配、領有権の問題は存在しない ④いずれも日本固有の領土とする"},{"t":"mc","s":"日本の領土問題","imp":1,"q":"日本の領土をめぐる問題についての記述として最も適当なものを一つ選べ。","c":["尖閣諸島は、サンフランシスコ平和条約で沖縄とともにアメリカの施政下に置かれ、1972年の沖縄返還で日本に施政権が返還された。","竹島問題について、日本と韓国は合意のうえで国際司法裁判所に付託し、審理が続いている。","北方領土は、サンフランシスコ平和条約でソ連の領土となることが明記された。","日ソ共同宣言にもとづいて平和条約が結ばれ、歯舞群島と色丹島は日本に引き渡された。"],"a":0,"e":"尖閣諸島は南西諸島の一部としてアメリカの施政下に置かれ、1972年の沖縄返還で日本に施政権が戻った。竹島問題は、韓国が国際司法裁判所への付託に同意していないため、裁判は行われていない。サンフランシスコ平和条約で日本は千島列島などを放棄したが、その帰属先は定められておらず、ソ連は条約に調印していない。また日本政府は、北方四島は放棄した千島列島に含まれないとしている。日ソ間の平和条約は結ばれておらず、歯舞群島・色丹島も引き渡されていない。"},{"t":"tf","s":"日本の領土問題","imp":1,"q":"尖閣諸島について、日本政府は中国との間に解決すべき領有権の問題が存在することを認め、領有権をめぐる交渉を続けている。","a":false,"e":"誤り。正しくは、日本政府は、尖閣諸島は歴史的にも国際法上も日本固有の領土であり、現に有効に支配しているため、解決しなければならない領有権の問題はそもそも存在しないという立場をとっている。中国の公船による領海侵入などには抗議している。"},{"t":"tf","s":"日本の領土問題","imp":1,"q":"北方領土問題に関連して、ロシアは2020年の憲法改正で、領土の割譲を禁止する規定を設けた。","a":true,"e":"正しい。さらにロシアは、日本がウクライナ侵攻に対して制裁を科したことを理由に、2022年に平和条約交渉を中断すると表明した。日本政府は、北方四島の帰属の問題を解決して平和条約を締結するという基本方針を維持している。"}]});</script>
<script>QDATA.push({"unit":"u14","questions":[{"t":"qa","s":"希少性と選択","imp":3,"q":"人間の欲望は限りないのに対し、それを満たす資源や財・サービスの量には限りがあることを何というか。","a":"希少性","e":"希少性があるため、人は何かを選び何かをあきらめる「選択」を迫られる。限られた資源をどう配分するかを考えるのが経済学の出発点である。空気のように無限にあり代価なしで手に入る財は自由財とよばれ、希少性のある経済財と区別される。"},{"t":"qa","s":"希少性と選択","imp":3,"q":"何かを得るためには別の何かをあきらめなければならないという、両立できない関係を何というか。","a":"トレードオフ","e":"限られた時間を勉強に使えば遊ぶ時間が減り、限られた予算を防衛に回せば社会保障に使える額が減る。希少性があるからトレードオフが生じる。"},{"t":"qa","s":"希少性と選択","imp":3,"q":"ある選択をしたとき、選ばなかった選択肢のうちで最大の利益（得られたはずの価値）を何というか。","a":"機会費用","e":"実際に支払ったお金だけでなく「あきらめたものの価値」も費用と考えるのがポイント。選ばなかった選択肢が複数ある場合は、それらの合計ではなく最大のものが機会費用になる。"},{"t":"mc","s":"希少性と選択","imp":3,"q":"Aさんは日曜日の過ごし方として、アルバイトをする（8,000円の収入）、家の大掃除を手伝う（お小遣い3,000円）、友人と公園で遊ぶ（費用はかからない）の三つから一つを選べる。友人と遊ぶことを選んだ場合の機会費用として最も適当なものを一つ選べ。","c":["0円","3,000円","8,000円","11,000円"],"a":2,"e":"機会費用は、選ばなかった選択肢のうち最大の利益なので、アルバイトの8,000円が正解。『0円』は実際の支出だけを見た誤り。『3,000円』は最大でない方の選択肢の利益である。『11,000円』は選ばなかった選択肢を合計した誤りで、アルバイトと手伝いは同時にはできないので合計しない。"},{"t":"ex","s":"希少性と選択","imp":2,"q":"高校卒業後に大学へ進学することの費用を、機会費用の考え方を用いて説明せよ。","a":"大学進学の費用には、授業料や教科書代などの実際の支出だけでなく、進学せずに就職していれば得られたはずの賃金も含まれる。この、進学を選んだことであきらめた所得が機会費用であり、選択の本当の費用は、選ばなかった選択肢のうち最大の価値で測られる。","e":"ポイント：①授業料などの実際の支出 ②就職していれば得られた賃金（あきらめた所得）③選ばなかった選択肢の最大の価値が機会費用"},{"t":"qa","s":"希少性と選択","imp":2,"q":"報酬や罰、価格の変化など、人々の行動を変化させる動機づけを何というか。","a":"インセンティブ","alt":["誘因"],"e":"人はインセンティブに反応して行動を変える。ある商品に課税して値上がりすれば購入が減り、補助金を出せば利用が増える。政策を考えるときは、それが人々にどのようなインセンティブを与えるかが重要になる。"},{"t":"tf","s":"希少性と選択","imp":1,"q":"レジ袋の有料化は、消費者にマイバッグを持ち歩くインセンティブを与え、行動を変えることをねらった政策の例といえる。","a":true,"e":"正しい。わずかな料金でも、レジ袋を受け取ることに費用が生じるため、マイバッグを持参しようという動機づけ（インセンティブ）がはたらく。日本では2020年7月からプラスチック製レジ袋の有料化が義務づけられた。"},{"t":"qa","s":"経済主体と経済循環","imp":2,"q":"経済活動を営む三つの経済主体を答えよ。","a":"家計・企業・政府","alt":["家計・政府・企業","企業・家計・政府","企業・政府・家計","政府・家計・企業","政府・企業・家計"],"e":"家計は消費の主体、企業は生産の主体、政府は租税を集めて公共サービスを提供する財政の主体である。三者の間を財・サービスと貨幣がめぐることを経済循環という。"},{"t":"mc","s":"経済主体と経済循環","imp":2,"q":"経済循環についての記述として最も適当なものを一つ選べ。","c":["家計は企業に労働力を提供し、その対価として賃金を受け取る。","企業は消費の主体であり、家計は生産の主体である。","政府は家計や企業から租税を徴収するが、公共サービスの提供は行わない。","家計は企業に租税を納め、企業はその代わりに道路や学校などの公共財を提供する。"],"a":0,"e":"家計は労働力などを企業に提供して賃金などを受け取り、それで企業から財・サービスを買う。『企業は消費の主体』は家計と企業が逆である。政府は租税を徴収し、道路・学校・警察などの公共サービスを提供するので『公共サービスの提供は行わない』は誤り。租税を受け取り公共財を提供するのは政府であって企業ではない。"},{"t":"qa","s":"経済主体と経済循環","imp":2,"q":"財・サービスの生産に必要な、土地（自然）・労働・資本の三つを合わせて何というか。","a":"生産の三要素","alt":["生産要素","生産の3要素"],"e":"ここでいう資本とは、工場・機械などの生産設備やそれを手に入れるための資金を指す。家計はこれらを企業に提供し、賃金・地代・利子や配当などの所得を得る。"},{"t":"qa","s":"資本主義経済の特徴","imp":3,"q":"資本主義経済の基本となる、工場・機械・土地などの生産手段を個人や企業が所有することを認める制度を何というか。","a":"私有財産制","alt":["私有財産制度","生産手段の私有"],"e":"資本主義経済は、生産手段の私有（私有財産制）、利潤追求を目的とする自由な生産活動、市場での取引による需給の調整（市場経済）を特徴とする。社会主義経済では生産手段は社会的に所有される。"},{"t":"ex","s":"資本主義経済の特徴","imp":3,"q":"資本主義経済の特徴を説明せよ。","a":"生産手段が私有され、企業は利潤の獲得を目的として自由に生産活動を行う。何をどれだけ生産しいくらで売るかは、市場での自由な取引をつうじて価格の動きによって調整される。また、労働者は自らの労働力を商品として企業に売り、賃金を得て生活する。","e":"ポイント：①生産手段の私有（私有財産制）②利潤追求のための自由な経済活動 ③市場経済（価格による調整）④労働力の商品化"},{"t":"qa","s":"資本主義経済の特徴","imp":2,"q":"18世紀後半にイギリスで始まった、機械の発明や蒸気機関の利用によって生産のしくみと社会が大きく変化したことを何というか。","a":"産業革命","e":"産業革命によって工場で機械を使って大量に生産する工場制機械工業が広がり、工場を経営する産業資本家と、労働力を売って賃金を得る労働者が生まれて、資本主義経済が確立した（産業資本主義）。"},{"t":"tf","s":"資本主義経済の特徴","imp":1,"q":"19世紀後半になると、重化学工業の発展とともに企業の集中・合併が進み、少数の大企業が市場を支配する独占資本主義の段階に入った。","a":true,"e":"正しい。自由競争を基本とする産業資本主義の段階から、巨大企業や銀行資本が市場を支配する独占資本主義の段階へと移った。独占資本主義の国々は市場や原料を求めて植民地獲得に乗り出し、帝国主義の時代となった。"},{"t":"qa","s":"アダム・スミス","imp":3,"q":"1776年に『国富論』（『諸国民の富』）を著し、古典派経済学の創始者とされるイギリスの経済学者は誰か。","a":"アダム・スミス","alt":["スミス","アダム=スミス"],"e":"スミスは、富の源泉は労働であり、分業によって労働生産性が高まると説いた。自由な競争にまかせれば社会全体が豊かになるとして、自由放任（レッセ・フェール）を主張した。"},{"t":"qa","s":"アダム・スミス","imp":3,"q":"アダム・スミスが、各人が自分の利益を追求しても、市場の価格のはたらきによって社会全体の利益が実現されることをたとえた言葉は何か。","a":"見えざる手","alt":["神の見えざる手","（神の）見えざる手"],"e":"『国富論』の中の表現で、「神の見えざる手」ともいわれる。現代でいう価格の自動調節機能（市場メカニズム）にあたる。"},{"t":"ex","s":"アダム・スミス","imp":3,"q":"アダム・スミスが、経済活動を国家が規制せず自由競争にまかせるべきだと考えた理由を説明せよ。","a":"人々が自分の利益を追求して自由に競争すれば、市場の価格のはたらき（見えざる手）によって需要と供給が調整され、意図しなくても社会全体の富が増大すると考えたからである。そのため国家の役割は、国防・司法・一部の公共事業などに限るべきだとした。","e":"ポイント：①利己心にもとづく自由な競争 ②見えざる手（価格による調整）③社会全体の富の増大 ④国家の役割を限定（自由放任・小さな政府）"},{"t":"qa","s":"アダム・スミス","imp":2,"q":"国家の役割を国防や治安維持などの最小限にとどめる国家を、ドイツのラッサールが批判的によんだ言葉は何か。","a":"夜警国家","e":"自由放任主義にもとづく「小さな政府」の国家観である。これに対し、20世紀に社会保障や景気対策に積極的に取り組むようになった国家を福祉国家（積極国家）といい、「大きな政府」とよぶ。"},{"t":"tf","s":"アダム・スミス","imp":3,"q":"アダム・スミスは、不況を克服するために政府が公共事業を行い、有効需要をつくり出すべきだと主張した。","a":false,"e":"誤り。正しくは、スミスは政府の介入を最小限にとどめる自由放任を主張した。不況時に政府が公共事業などで有効需要をつくり出すべきだと主張したのは、20世紀のケインズである。"},{"t":"mc","s":"アダム・スミス","imp":2,"q":"アダム・スミスの主張として最も適当なものを一つ選べ。","c":["一人で全工程を行うより作業を分担するほうが、労働の生産性が高まり国の富が増える。","各国は比較優位をもつ財の生産に特化し、互いに貿易を行うべきである。","経済発展の遅れた国は、幼稚産業を守るために保護貿易を行うべきである。","人口は等比級数的に増えるが、食料は等差級数的にしか増えないため貧困が生じる。"],"a":0,"e":"スミスは『国富論』で、ピン製造の例をあげて分業による生産性の向上を説いた。比較優位にもとづく自由貿易はリカード、幼稚産業を守るための保護貿易はリスト、人口と食料の増え方の違いによる貧困はマルサスの主張である。"},{"t":"qa","s":"リカード・リスト・マルサス","imp":3,"q":"比較生産費説を唱え、各国が得意な財の生産に特化して貿易を行えば双方が利益を得られるとして自由貿易を主張したイギリスの経済学者は誰か。","a":"リカード","alt":["デヴィッド・リカード","デビッド・リカード"],"e":"主著は『経済学および課税の原理』（1817年）。スミスとならぶ古典派経済学の代表者である。比較生産費説の具体的なしくみは国際経済の単元で学ぶ。"},{"t":"tf","s":"リカード・リスト・マルサス","imp":2,"q":"ドイツのリストは、各国が比較優位をもつ財の生産に特化する自由貿易を主張し、保護貿易を批判した。","a":false,"e":"誤り。正しくは、リストは、工業化の遅れたドイツがイギリスとの競争に負けないよう、国内の幼稚産業を守る保護貿易が必要だと主張した。自由貿易を主張したのはリカードである。リストは経済の発展段階を重視する歴史学派の先駆者とされる。"},{"t":"qa","s":"リカード・リスト・マルサス","imp":1,"q":"『人口論』を著し、人口の増加に食料の増加が追いつかないため貧困や飢餓が避けられないと説いたイギリスの経済学者は誰か。","a":"マルサス","e":"マルサスは、人口は等比級数的（1,2,4,8…）に増えるが、食料は等差級数的（1,2,3,4…）にしか増えないと考えた。穀物の輸入制限（穀物法）をめぐってリカードと論争したことでも知られる。"},{"t":"qa","s":"世界恐慌とニューディール","imp":2,"q":"1929年10月、ニューヨークのウォール街での株価の大暴落をきっかけに始まり、世界中に広がった深刻な不況を何というか。","a":"世界恐慌","alt":["大恐慌","世界大恐慌"],"e":"アメリカでは失業率が約25％に達し、企業や銀行の倒産が相次いだ。市場にまかせておけば自然に回復するという自由放任の考え方では対応できず、政府が経済に介入する政策が求められた。"},{"t":"qa","s":"世界恐慌とニューディール","imp":3,"q":"世界恐慌に対処するため、アメリカのフランクリン・ローズヴェルト大統領が1933年から実施した一連の経済政策を何というか。","a":"ニューディール政策","alt":["ニューディール","新規まき直し"],"e":"「ニューディール」は「新規まき直し」という意味。政府が積極的に経済に介入して公共事業で雇用をつくり、労働者の権利保障や社会保障制度を整えた。のちのケインズの理論を先取りした政策といわれる。"},{"t":"mc","s":"世界恐慌とニューディール","imp":2,"q":"ニューディール政策の内容として適当でないものを一つ選べ。","c":["テネシー川流域開発公社（TVA）を設立し、ダム建設などの公共事業によって雇用を生み出した。","ワグナー法を制定し、労働者の団結権や団体交渉権を保障した。","社会保障法を制定し、失業保険や老齢年金の制度を設けた。","政府支出を大幅に削減して財政の均衡を最優先し、経済への介入を控えた。"],"a":3,"e":"ニューディール政策は、自由放任をあらため政府が積極的に経済に介入した政策であり、支出を削って介入を控えたのではないので、これが適当でない。TVA（1933年）は公共事業による雇用創出、ワグナー法（1935年、全国労働関係法）は労働者の権利保障、社会保障法（1935年）は社会保障制度の整備で、いずれもニューディールの内容である。"},{"t":"tf","s":"世界恐慌とニューディール","imp":1,"q":"ニューディール政策は、ローズヴェルト大統領がケインズの『雇用・利子および貨幣の一般理論』を読み、その理論を実行に移したものである。","a":false,"e":"誤り。正しくは、ニューディール政策は1933年に始まり、ケインズの『一般理論』の出版（1936年）より前である。ニューディールは理論に先立って実施された政策で、のちにケインズの理論によって裏付けられたと評価されている。"}]});</script>
<script>QDATA.push({"unit":"u14","questions":[{"t":"qa","s":"ケインズ","imp":3,"q":"1936年に『雇用・利子および貨幣の一般理論』を著し、不況期には政府が積極的に経済に介入すべきだと説いたイギリスの経済学者は誰か。","a":"ケインズ","alt":["ジョン・メイナード・ケインズ"],"e":"ケインズは、市場にまかせておけば完全雇用が実現するという古典派の考え方を批判し、世界恐慌のような大量失業は有効需要の不足から生じると説いた。その理論は第二次世界大戦後の先進国の経済政策の柱となった。"},{"t":"qa","s":"ケインズ","imp":3,"q":"ケインズの理論で、単なる欲求ではなく、実際の貨幣の支出をともなう需要（購買力の裏付けのある需要）を何というか。","a":"有効需要","e":"一国の生産量や雇用量は有効需要の大きさで決まるという考え方を有効需要の原理という。有効需要は主に消費と投資から成り、さらに政府支出や輸出も加わる。"},{"t":"tf","s":"ケインズ","imp":2,"q":"ケインズは、不況期の失業は労働者が今の賃金では働きたくないと自ら選んだものであり、市場にまかせておけば自然に解消すると考えた。","a":false,"e":"誤り。正しくは、ケインズは、働く意思と能力があるのに有効需要が不足しているために雇用されない非自発的失業が生じると考え、政府が有効需要をつくり出して解消すべきだとした。市場にまかせれば完全雇用が実現するというのは、ケインズが批判した古典派の考え方である。"},{"t":"ex","s":"ケインズ","imp":3,"q":"ケインズの有効需要の原理と、それにもとづく不況対策を説明せよ。","a":"一国の生産量や雇用量は、貨幣の支出をともなう有効需要の大きさによって決まる。不況期には有効需要が不足して非自発的失業が生じるので、政府が公共投資の拡大や減税などによって有効需要をつくり出し、景気を回復させて完全雇用をめざすべきだとした。","e":"ポイント：①生産量・雇用量は有効需要で決まる ②有効需要の不足が非自発的失業を生む ③公共投資や減税で政府が有効需要を創出 ④完全雇用の実現"},{"t":"mc","s":"ケインズ","imp":2,"q":"乗数効果について考える。人々が増えた所得のうち8割を消費に回す（限界消費性向が0.8）経済で、政府が公共投資を10兆円増やしたとき、最終的に国民所得は理論上いくら増加するか。最も適当なものを一つ選べ。","c":["8兆円","12兆5,000億円","18兆円","50兆円"],"a":3,"e":"乗数は1÷（1－限界消費性向）＝1÷0.2＝5なので、10兆円×5＝50兆円となる。10兆円の投資が誰かの所得となり、その8割の8兆円が消費されて別の人の所得となり、さらに6.4兆円…と波及していく。『8兆円』は最初の消費の増加分だけ、『18兆円』は二段階目までの合計、『12兆5,000億円』は10兆円を0.8で割った誤りである。需要の増加がその何倍もの所得の増加を生むこの効果を乗数効果という。"},{"t":"qa","s":"ケインズ","imp":3,"q":"資本主義の枠組みを維持しながら、政府が経済に積極的に介入して景気の安定や完全雇用、所得の再分配をはかる経済のあり方を何というか。","a":"修正資本主義","alt":["混合経済"],"e":"民間部門と公共部門が併存する経済という意味で混合経済ともいう。ケインズの理論を背景に第二次世界大戦後の先進国で広く採用され、福祉国家（大きな政府）が築かれた。"},{"t":"tf","s":"ケインズ","imp":3,"q":"ケインズの考え方にもとづいて政府の役割を拡大し、社会保障や公共事業に積極的に取り組む政府を「小さな政府」という。","a":false,"e":"誤り。正しくは「大きな政府」という。「小さな政府」は、政府の役割を国防や治安維持などに限り、市場の自由な競争を重視する政府であり、アダム・スミスの自由放任や1980年代以降の新自由主義がめざしたものである。"},{"t":"qa","s":"スタグフレーション","imp":3,"q":"景気の停滞（不況）と物価の上昇（インフレーション）が同時に進む現象を何というか。","a":"スタグフレーション","e":"スタグネーション（停滞）とインフレーションを合わせた造語。1970年代の石油危機の際に先進国で発生し、ケインズ政策への信頼がゆらぐきっかけとなった。"},{"t":"ex","s":"スタグフレーション","imp":2,"q":"1970年代にケインズ的な経済政策が行き詰まったとされる理由を説明せよ。","a":"石油危機をきっかけに、不況とインフレが同時に進むスタグフレーションが起こった。不況対策として財政支出を増やせば物価上昇がさらに強まり、インフレを抑えようとすれば不況が深まるため、有効需要を管理する政策では対応が難しかった。また、財政赤字の拡大や政府部門の非効率も批判された。","e":"ポイント：①石油危機とスタグフレーション ②景気対策とインフレ対策が両立しない ③財政赤字の拡大 ④大きな政府への批判（新自由主義の台頭へ）"},{"t":"qa","s":"新自由主義","imp":2,"q":"物価の安定には通貨供給量を経済成長に合わせて一定の率で増やすことが重要だとし、政府による裁量的な景気対策を批判した考え方を何というか。","a":"マネタリズム","e":"アメリカのフリードマンらが唱えた。景気対策として財政支出を増やしても長期的にはインフレを招くだけだと主張し、ケインズ政策を批判した。1970〜80年代に影響力を強めた。"},{"t":"qa","s":"新自由主義","imp":3,"q":"マネタリズムを唱え、市場の自由な競争を重視して政府の介入を最小限にすべきだと主張した、新自由主義を代表するアメリカの経済学者は誰か。","a":"フリードマン","alt":["ミルトン・フリードマン"],"e":"主著に『資本主義と自由』『選択の自由』がある。1976年にノーベル経済学賞を受賞した。ケインズの「大きな政府」に対して「小さな政府」を主張した点をおさえる。"},{"t":"tf","s":"新自由主義","imp":1,"q":"ハイエクは『隷属への道』を著し、計画経済や政府による経済への過度な介入は個人の自由を損なうと批判した。","a":true,"e":"正しい。オーストリア出身のハイエクは、政府が経済を計画・統制しようとすれば個人の自由が失われると警告し、市場の自由な秩序を重視した。フリードマンとともに新自由主義の思想的な支柱となった。"},{"t":"ex","s":"新自由主義","imp":3,"q":"新自由主義とはどのような考え方か。主な政策とあわせて説明せよ。","a":"政府の市場への介入が経済の効率や活力を損なうとして、市場の自由な競争を重視し、小さな政府をめざす考え方である。規制緩和、国営企業の民営化、減税、社会保障支出の抑制などが行われ、1980年代のイギリスのサッチャー政権、アメリカのレーガン政権、日本の中曽根内閣で採用された。","e":"ポイント：①市場の自由競争を重視し小さな政府をめざす ②規制緩和・民営化・減税・福祉支出の抑制 ③サッチャー・レーガン・中曽根 ④ケインズ的な大きな政府への批判"},{"t":"mc","s":"新自由主義","imp":3,"q":"1980年代に各国で行われた経済政策についての記述として最も適当なものを一つ選べ。","c":["イギリスのサッチャー政権は、国営企業の民営化や労働組合の規制を進めた。","アメリカのレーガン政権は、大幅な増税と軍事費の削減によって財政赤字を解消した。","日本の中曽根内閣は、郵政事業を民営化して日本郵政グループを発足させた。","イギリスのサッチャー政権は、ケインズ政策を強化し、主要産業の国有化を進めた。"],"a":0,"e":"サッチャー政権の新自由主義的政策はサッチャリズムとよばれる。レーガン政権は減税と軍事費の拡大を行い、財政赤字と貿易赤字の『双子の赤字』を抱えたので誤り。郵政民営化は2000年代の小泉内閣の政策（2007年に日本郵政グループ発足）であり、中曽根内閣が民営化したのは国鉄・電電公社・専売公社なので誤り。サッチャー政権は国有化ではなく民営化を進めたので、「ケインズ政策を強化し、主要産業の国有化を進めた」も誤り。"},{"t":"qa","s":"新自由主義","imp":2,"q":"1980年代のアメリカで、レーガン政権の減税と軍事費の拡大などによって生じた、財政赤字と貿易（経常収支）赤字が並存した状態を何というか。","a":"双子の赤字","e":"レーガン政権の経済政策をレーガノミクスという。減税・規制緩和で経済を活性化しようとしたが財政赤字が拡大し、高金利によるドル高で輸入が増えて貿易赤字も拡大した。これは日米貿易摩擦やプラザ合意（1985年）の背景となった。"},{"t":"tf","s":"新自由主義","imp":2,"q":"1980年代の中曽根内閣のもとで、日本電信電話公社・日本専売公社・日本国有鉄道の三公社が民営化された。","a":true,"e":"正しい。1985年に電電公社がNTT、専売公社がJT（日本たばこ産業）となり、1987年に国鉄が分割・民営化されてJRグループとなった。新自由主義的な行政改革の一環である。"},{"t":"tf","s":"新自由主義","imp":2,"q":"レーガノミクスとよばれるアメリカの経済政策は、所得税の大幅な増税と規制の強化によって経済の活性化をはかった。","a":false,"e":"誤り。正しくは、レーガノミクスは大幅な減税と規制緩和によって企業や個人の経済活動を活発にしようとした。一方で軍事費を拡大したため財政赤字が膨らみ、貿易赤字とあわせた「双子の赤字」をもたらした。"},{"t":"qa","s":"シュンペーターほか","imp":3,"q":"企業家による新しい技術・製品・生産方法などの導入（イノベーション）こそが経済発展の原動力であると説いた経済学者は誰か。","a":"シュンペーター","alt":["ヨーゼフ・シュンペーター"],"e":"主著は『経済発展の理論』。イノベーションは「新結合」ともよばれ、新製品の開発だけでなく、新しい生産方法・販路・原料の供給源・組織の実現も含む。景気循環の長い波（コンドラチェフの波）の原因を技術革新に求めたことでも知られる。"},{"t":"ex","s":"シュンペーターほか","imp":2,"q":"シュンペーターのいう創造的破壊とは何か、説明せよ。","a":"企業家がイノベーション（新しい技術や製品、生産方法などの導入）を行うと、古い技術や製品、企業が市場から退出させられ、新しいものに置き換えられていく。この、古いものを壊しながら新しいものを生み出す過程を創造的破壊といい、シュンペーターはこれが資本主義の経済発展の原動力だと考えた。","e":"ポイント：①イノベーション（新結合）②古い技術・企業が淘汰される ③新しいものへの置き換え ④経済発展の原動力"},{"t":"mc","s":"シュンペーターほか","imp":1,"q":"経済学者とその主張の組み合わせとして最も適当なものを一つ選べ。","c":["ガルブレイス：消費者の欲望は、企業の広告や宣伝によってつくり出されている（依存効果）。","ヴェブレン：企業家のイノベーションによる創造的破壊が、経済発展をもたらす。","シュンペーター：富裕層は、富や地位を見せびらかすために消費を行う（顕示的消費）。","ハイエク：有効需要の不足が非自発的失業を生むので、政府が需要をつくり出すべきである。"],"a":0,"e":"ガルブレイスは『ゆたかな社会』で依存効果を指摘した。創造的破壊はシュンペーター、顕示的消費は『有閑階級の理論』を著したヴェブレン、有効需要の原理はケインズの主張である。ハイエクは逆に政府の介入を批判した。"},{"t":"qa","s":"社会主義経済","imp":3,"q":"『資本論』を著し、資本主義社会では資本家が労働者の生み出した剰余価値を搾取していると批判して、社会主義の理論を体系化した人物は誰か。","a":"マルクス","alt":["カール・マルクス"],"e":"マルクスは、資本主義は恐慌や失業、貧富の差を生み出し、やがて社会主義へと移行すると考えた。エンゲルスとともに『共産党宣言』（1848年）も著した。"},{"t":"ex","s":"社会主義経済","imp":2,"q":"社会主義経済の特徴を、資本主義経済と比べて説明せよ。","a":"資本主義経済が生産手段の私有と市場での自由な取引を基本とするのに対し、社会主義経済では、生産手段を国有化・集団化して社会的に所有し、何をどれだけ生産するかを国家の計画によって決める計画経済を行う。利潤追求や市場での競争を否定し、平等な分配をめざした。","e":"ポイント：①生産手段の社会的所有（国有化・集団化）②計画経済 ③利潤追求・市場競争の否定 ④平等な分配をめざす"},{"t":"mc","s":"社会主義経済","imp":2,"q":"ソ連の社会主義経済についての記述として最も適当なものを一つ選べ。","c":["労働意欲の低下や技術革新の遅れなどから経済が停滞し、1991年にソ連は解体した。","計画経済のもとで、財の価格は市場の需要と供給によって自由に決まった。","ソ連の解体後、ロシアや東欧諸国は計画経済をいっそう強化した。","ロシア革命は第二次世界大戦の終結後に起こり、世界初の社会主義国家が誕生した。"],"a":0,"e":"計画経済では努力が報われにくく労働意欲が低下し、技術革新も遅れて経済が停滞した。1980年代後半のゴルバチョフによる改革（ペレストロイカ）も実を結ばず、1991年にソ連は解体した。計画経済では価格も国家が決めるので『市場の需要と供給によって自由に決まった』は誤り。解体後のロシアや東欧諸国は市場経済へ移行したので『計画経済をいっそう強化』も誤り。ロシア革命は第一次世界大戦中の1917年である。"},{"t":"qa","s":"中国・ベトナム","imp":3,"q":"1978年以降、鄧小平の指導のもとで中国が進めた、市場経済のしくみの導入と外国資本の受け入れを柱とする政策を何というか。","a":"改革・開放政策","alt":["改革開放政策","改革・開放","改革開放"],"e":"人民公社の解体と農業の生産責任制、企業の自主権拡大などの「改革」と、外国の資本・技術を受け入れる「開放」を進めた。これにより中国は高い経済成長を続け、2010年には名目GDPで日本を抜いて世界第2位となった。"},{"t":"mc","s":"中国・ベトナム","imp":2,"q":"中国の経済についての記述として最も適当なものを一つ選べ。","c":["改革・開放政策のもとで、深圳などに外国企業を税制面などで優遇する経済特区が設けられた。","1993年の憲法改正で計画経済の堅持が明記され、市場経済の導入は否定された。","中国は改革・開放政策の開始と同じ1978年に、WTO（世界貿易機関）に加盟した。","アジアインフラ投資銀行（AIIB）は、日本とアメリカが主導して設立した国際金融機関である。"],"a":0,"e":"経済特区は1980年に深圳・珠海・汕頭・厦門に設けられた（のちに海南島も）。1993年の憲法改正で明記されたのは社会主義市場経済なので誤り。中国のWTO加盟は2001年であり、そもそもWTOの発足は1995年なので誤り。AIIBは中国が主導して2015年に設立した国際金融機関で、日本とアメリカは参加していないので誤り。"},{"t":"qa","s":"中国・ベトナム","imp":2,"q":"共産党の指導のもとで市場経済のしくみを取り入れるという、1993年に中国の憲法に明記された経済体制を何というか。","a":"社会主義市場経済","e":"1992年の中国共産党大会で目標とされ、翌1993年に憲法に書き込まれた。政治面では共産党の一党支配を維持しつつ、経済面では市場経済を進める点が特徴である。"},{"t":"tf","s":"中国・ベトナム","imp":1,"q":"中国の社会主義市場経済は、共産党の一党支配をやめて複数政党制を導入したうえで、市場経済を取り入れた体制である。","a":false,"e":"誤り。正しくは、中国は共産党による一党支配を維持したまま、経済面で市場経済のしくみを導入した。政治体制は変えずに経済体制を転換した点が、社会主義市場経済の特徴である。"},{"t":"qa","s":"中国・ベトナム","imp":1,"q":"2013年に中国が提唱した、中国からアジア・ヨーロッパ・アフリカにいたる陸と海の経済圏構想を何というか。","a":"一帯一路","alt":["一帯一路構想"],"e":"陸路の「シルクロード経済ベルト（一帯）」と海路の「21世紀海上シルクロード（一路）」からなる。沿線国のインフラ整備の資金を供給する役割も期待して、中国が主導してアジアインフラ投資銀行（AIIB）が設立された。"},{"t":"qa","s":"中国・ベトナム","imp":2,"q":"ベトナムが1986年から進めている、市場経済の導入と対外開放を柱とする刷新政策を何というか。","a":"ドイモイ","alt":["ドイモイ政策","ドイ・モイ"],"e":"ドイモイはベトナム語で「刷新」の意味。中国の改革・開放政策と同じく、共産党の一党支配を維持したまま市場経済を導入した。"},{"t":"qa","s":"現代の資本主義と格差","imp":1,"q":"『21世紀の資本』で、資本収益率（r）が経済成長率（g）を上回る傾向があるため資産をもつ者に富が集中し、格差が拡大すると指摘したフランスの経済学者は誰か。","a":"ピケティ","alt":["トマ・ピケティ"],"e":"ピケティは長期の税務データなどを分析して「r＞g」の関係を示し、格差を是正するために富裕層への累進課税の強化や、資本（資産）への国際的な課税を提案した。新自由主義のもとでの格差拡大を考える際によく取り上げられる。"}]});</script>
<script>QDATA.push({"unit":"u15","questions":[{"t":"qa","s":"市場と価格","imp":3,"q":"縦軸に価格、横軸に数量をとったグラフで、価格が高いほど買いたい量が少なくなることを表す右下がりの曲線を何というか。","a":"需要曲線","e":"需要曲線は、それぞれの価格で消費者が買いたいと思う量（需要量）を表す。価格が高いと需要量が減り、安いと増えるので右下がりになる。右上がりの供給曲線とセットでおさえる。"},{"t":"qa","s":"市場と価格","imp":3,"q":"縦軸に価格、横軸に数量をとったグラフで、価格が高いほど売りたい量が多くなることを表す右上がりの曲線を何というか。","a":"供給曲線","e":"供給曲線は、それぞれの価格で生産者が売りたいと思う量（供給量）を表す。価格が高いほど利益が見込めるので供給量が増え、右上がりになる。"},{"t":"qa","s":"市場と価格","imp":3,"q":"需要曲線と供給曲線の交点で決まる、需要量と供給量が一致するときの価格を何というか。","a":"均衡価格","e":"均衡価格のもとでは売れ残りも品不足も生じない。このときの取引量を均衡取引量という。市場で実際に成立する価格（市場価格）は、需給の変化に応じて均衡価格に向かって動く。"},{"t":"ex","s":"市場と価格","imp":2,"q":"需要曲線が右下がり、供給曲線が右上がりになる理由をそれぞれ説明せよ。","a":"価格が上がると、消費者は購入を控えたり他の安い財に切りかえたりするので需要量は減り、価格が下がると需要量は増える。そのため需要曲線は右下がりになる。一方、生産者は価格が高いほど多く売れば利益が増えるので供給量を増やし、価格が低いと供給量を減らす。そのため供給曲線は右上がりになる。","e":"ポイント：①価格上昇で購入を控える・代わりの財に切りかえる ②需要曲線は右下がり ③価格が高いほど利益が増えるので供給量が増える ④供給曲線は右上がり"},{"t":"qa","s":"市場と価格","imp":3,"q":"ある価格のもとで需要量が供給量を上回り、品不足が生じている状態を何というか。","a":"超過需要","alt":["需要超過"],"e":"超過需要があると、買いたい人どうしの競争で価格が上昇する。価格が上がると需要量が減り供給量が増えるので、品不足は解消に向かう。反対に、供給量が需要量を上回る状態を超過供給という。"},{"t":"qa","s":"市場と価格","imp":2,"q":"ある価格のもとで供給量が需要量を上回り、売れ残りが生じている状態を何というか。","a":"超過供給","alt":["供給超過"],"e":"超過供給があると、売り手は売れ残りを減らそうと価格を引き下げる。価格が下がると需要量が増え供給量が減るので、売れ残りは解消に向かう。"},{"t":"mc","s":"市場と価格","imp":3,"q":"ある商品の市場価格が均衡価格よりも高い水準にあるとき、その後に起こると考えられることとして最も適当なものを一つ選べ。","c":["超過供給が生じて売れ残りが出るため、価格は下落していく。","超過需要が生じて品不足になるため、価格は上昇していく。","超過供給が生じて売れ残りが出るため、価格は上昇していく。","超過需要が生じて品不足になるため、価格は下落していく。"],"a":0,"e":"均衡価格より高い価格では、需要量は少なく供給量は多いので超過供給（売れ残り）が生じ、価格は均衡価格に向けて下落する。均衡価格より低い価格であれば超過需要（品不足）となり、価格は上昇する。状況と価格の動きの組み合わせを取り違えないこと。"},{"t":"qa","s":"市場と価格","imp":3,"q":"市場において、価格が上下することで需要量と供給量が一致する方向に自動的に調整されるはたらきを何というか。","a":"価格の自動調節機能","alt":["価格メカニズム","市場メカニズム","価格の自動調整機能"],"e":"アダム・スミスが「見えざる手」とよんだものにあたる。このはたらきによって、人々が求める財の生産に資源が配分され、資源の最適配分（効率的な配分）が実現するとされる。"},{"t":"ex","s":"市場と価格","imp":3,"q":"価格の自動調節機能によって需要と供給が一致するしくみを説明せよ。","a":"品不足（超過需要）のときは価格が上がり、需要量が減って供給量が増える。売れ残り（超過供給）のときは価格が下がり、需要量が増えて供
