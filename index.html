の派遣が認められていた。","2004年から製造業務への派遣が禁止され、現在も認められていない。","2012年の改正で、日雇い派遣が原則として自由化された。"],"a":0,"e":"1985年の制定当初は、通訳など専門的な知識を必要とする業務に限って派遣を認めていたが、1999年に原則自由化され、2004年からは製造業務への派遣も解禁された。2008年のリーマン・ショック後に「派遣切り」が社会問題となり、2012年の改正で日雇い派遣（30日以内の派遣）は原則禁止された。2015年の改正では、同じ職場で同じ派遣労働者を受け入れられる期間が原則3年とされた。"},{"t":"qa","s":"労働契約法","imp":3,"q":"労働契約法第16条が定める、客観的に合理的な理由を欠き、社会通念上相当であると認められない解雇は、権利を濫用したものとして無効とするルールを何というか。","a":"解雇権濫用法理","alt":["解雇権濫用の法理","解雇権濫用法理（解雇権濫用の法理）"],"e":"もともとは裁判所の判例の積み重ねによって確立したルールで、2003年に労働基準法に明記され、2007年に制定された労働契約法に移された。解雇予告の手続きをとっても、合理的な理由がなければ解雇は無効になる。"},{"t":"qa","s":"労働契約法","imp":3,"q":"同じ使用者との間で有期労働契約が更新されて通算5年を超えた場合に、労働者が申し込めば期間の定めのない労働契約に転換されるという、労働契約法上のルールを何というか。","a":"無期転換ルール","alt":["無期転換","無期労働契約への転換","無期転換制度"],"e":"2012年の労働契約法改正で導入され、2013年4月以降に結ばれた有期契約から期間が通算される。賃金などの労働条件は、別に定めがない限り転換前と同じでよく、無期契約への転換は正社員になることと同じではない。"},{"t":"mc","s":"労働契約法","imp":2,"q":"Aさんは、同じ会社と1年契約の有期労働契約を毎年更新して働き、通算で5年を超えた。労働契約法の無期転換ルールに照らして、最も適当なものを一つ選べ。","c":["Aさんが無期労働契約への転換を申し込めば、会社は承諾したものとみなされ、拒否することはできない。","Aさんが何も申し込まなくても、5年を超えた時点で自動的に無期労働契約に転換される。","Aさんが申し込んでも、会社が同意しなければ無期労働契約には転換されない。","Aさんが無期労働契約に転換されると、必ず正社員と同じ賃金に引き上げられる。"],"a":0,"e":"無期転換ルールでは、労働者の申込みがあれば使用者は承諾したものとみなされるため、会社は拒否できない。ただし転換には労働者の申込みが必要で、自動的に転換されるわけではない。また、転換後の賃金などの労働条件は、別に定めがない限り転換前と同じでよい。"},{"t":"qa","s":"労働契約法","imp":2,"q":"有期労働契約の期間が満了したときに、使用者が契約を更新せず、労働者との雇用関係を終了させることを何というか。","a":"雇止め","alt":["雇い止め","やといどめ"],"e":"契約が何度も更新されて実質的に無期契約と変わらない場合や、労働者が契約の更新を期待することに合理的な理由がある場合には、客観的に合理的な理由がなく社会通念上相当でない雇止めは認められない（労働契約法第19条、雇止め法理）。"},{"t":"qa","s":"働き方改革","imp":3,"q":"正社員と非正規雇用労働者との間で、基本給や賞与、手当などについて不合理な待遇差を設けることを禁止し、雇用形態にかかわらない公正な待遇の確保を目指す考え方を何というか。","a":"同一労働同一賃金","e":"2018年に成立した働き方改革関連法により、パートタイム・有期雇用労働法と労働者派遣法に定められ、2020年4月から施行された（中小企業のパートタイム・有期雇用労働者については2021年4月から）。事業主は、労働者から求められれば正社員との待遇差の内容や理由を説明しなければならない。"},{"t":"qa","s":"働き方改革","imp":1,"q":"短時間労働者と有期雇用労働者について、正社員との不合理な待遇差の禁止や待遇についての説明義務などを定めた法律を何というか。","a":"パートタイム・有期雇用労働法","alt":["パートタイム有期雇用労働法","パート有期法","短時間労働者及び有期雇用労働者の雇用管理の改善等に関する法律"],"e":"1993年に制定されたパートタイム労働法が、働き方改革関連法によって有期雇用労働者も対象に加えて改正・改称されたものである。もとは労働契約法に置かれていた、有期契約労働者の不合理な労働条件を禁止する規定も、この法律に統合された。"},{"t":"tf","s":"働き方改革","imp":2,"q":"働き方改革関連法により、時間外労働の上限は原則として月45時間・年360時間とされ、臨時的な特別の事情がある場合でも年720時間以内などに制限された。","a":true,"e":"正しい。それまでは36協定に特別条項を設ければ事実上上限なく時間外労働をさせることができたが、罰則付きの上限が法律に定められた。特別な事情がある場合も、休日労働を含めて1か月100時間未満、2〜6か月の平均で80時間以内とされる。適用が猶予されていた建設業・自動車運転の業務・医師なども、2024年4月から上限規制の対象となった（一部は特例の上限）。"},{"t":"qa","s":"働き方改革","imp":3,"q":"高度な専門知識をもち一定以上の年収がある労働者を対象に、本人の同意などを条件として、労働時間・休憩・休日・深夜の割増賃金に関する規定を適用しない制度を何というか。","a":"高度プロフェッショナル制度","alt":["高プロ","高度プロフェッショナル","高度プロフェッショナル制"],"e":"働き方改革関連法により2019年に導入された。対象は金融商品の開発やアナリスト、研究開発などの業務で、年収1075万円以上の労働者に限られる。時間ではなく成果で評価される働き方を可能にする一方、長時間労働を助長するおそれがあるとの批判もあり、年104日以上の休日の確保などが義務づけられている。"},{"t":"ex","s":"働き方改革","imp":2,"q":"2018年に働き方改革関連法が制定された背景を説明せよ。","a":"日本では正社員の長時間労働が続き、過労死や過労自殺が社会問題となっていた。また非正規雇用が増え、正社員との待遇の格差が大きかった。さらに少子高齢化で労働力人口が減るなか、女性や高齢者など多様な人が働きやすい環境をつくり、労働生産性を高める必要があった。","e":"ポイント：①長時間労働と過労死・過労自殺 ②正規雇用と非正規雇用の待遇格差 ③労働力人口の減少と多様な働き方・生産性の向上"},{"t":"mc","s":"働き方改革","imp":2,"q":"働き方改革関連法の内容として適当でないものを一つ選べ。","c":["時間外労働について、違反した場合には罰則が科される上限規制を設けた。","年10日以上の年次有給休暇が与えられる労働者に、年5日を確実に取得させることを使用者に義務づけた。","前日の終業から翌日の始業までに一定の休息時間を確保する勤務間インターバル制度の導入を、事業主の努力義務とした。","すべての企業に、全労働者を対象として、実際の労働時間にかかわらず一定時間働いたとみなす裁量労働制の導入を義務づけた。"],"a":3,"e":"裁量労働制は、研究開発など一定の業務に限って労使の協定や決議によって導入できる制度であり、すべての企業や労働者に義務づけられたものではない。時間外労働の罰則付き上限規制、年5日の年休取得義務、勤務間インターバル制度の努力義務は、いずれも働き方改革関連法に含まれる。"}]});</script>
<script>QDATA.push({"unit":"u21","questions":[{"t":"qa","s":"多様な労働時間制度","imp":3,"q":"一定の期間（清算期間）の総労働時間をあらかじめ定めたうえで、労働者が日々の始業・終業の時刻を自分で決めることができる制度を何というか。","a":"フレックスタイム制","alt":["フレックスタイム制度","フレックスタイム"],"e":"必ず勤務しなければならない時間帯（コアタイム）を設けることもできる。2019年の法改正で、清算期間の上限が1か月から3か月に延ばされた。育児や通学などと仕事の両立に役立つ。"},{"t":"mc","s":"多様な労働時間制度","imp":2,"q":"ある企業の研究開発部門で働くBさんは、仕事の進め方や時間配分を自分の判断で決めており、実際に働いた時間にかかわらず、労使であらかじめ定めた時間を働いたものとみなされている。この制度として最も適当なものを一つ選べ。","c":["裁量労働制","変形労働時間制","フレックスタイム制","ワークシェアリング"],"a":0,"e":"裁量労働制は、研究開発など仕事の進め方を労働者の裁量に大きく委ねる必要がある業務について、実際の労働時間ではなく労使で定めた時間を働いたものとみなす制度（みなし労働時間制）である。変形労働時間制は一定期間を平均して法定労働時間におさめる制度、フレックスタイム制は始業・終業の時刻を労働者が決める制度で、いずれも実際の労働時間で管理される。ワークシェアリングは労働時間を短縮して仕事を分け合うことである。"},{"t":"qa","s":"多様な労働時間制度","imp":1,"q":"1か月や1年など一定の期間を平均して1週間の労働時間が40時間以内であれば、特定の日や週に法定労働時間を超えて労働させることができる制度を何というか。","a":"変形労働時間制","alt":["変形労働時間制度"],"e":"季節や月によって業務の繁閑の差が大きい職場で使われる。あらかじめ定めた範囲内であれば、特定の日に8時間を超えて働かせても時間外労働とはならない。"},{"t":"tf","s":"多様な労働時間制度","imp":1,"q":"情報通信技術を活用して、自宅やサテライトオフィスなど職場以外の場所で働くテレワークは、新型コロナウイルス感染症の拡大をきっかけに大きく広まった。","a":true,"e":"正しい。通勤時間の削減や、育児・介護と仕事の両立に役立つ一方で、労働時間の管理が難しく、仕事と私生活の境目があいまいになりやすいといった課題もある。テレワークで働く人にも労働基準法などの労働法は適用される。"},{"t":"qa","s":"過労死と生活の調和","imp":2,"q":"2014年に制定され、過労死等の防止のための対策を推進するため、国に過労死等の調査研究や、毎年の報告書（白書）の国会への提出などを義務づけた法律を何というか。","a":"過労死等防止対策推進法","alt":["過労死防止法","過労死等防止法","過労死防止対策推進法"],"e":"過労死で家族を失った遺族らの運動を受けて、議員立法で成立した。業務による過重な負荷による脳・心臓疾患を原因とする死亡や、業務による強い心理的負荷による精神障害を原因とする自殺による死亡などを「過労死等」と定めている。毎年11月は過労死等防止啓発月間とされている。"},{"t":"tf","s":"過労死と生活の調和","imp":1,"q":"長時間労働などによる強い心理的負荷から精神障害を発症し、自殺に至った過労自殺は、過労死等防止対策推進法の「過労死等」には含まれない。","a":false,"e":"誤り。正しくは、業務における強い心理的負荷による精神障害を原因とする自殺による死亡も「過労死等」に含まれる。過労死や過労自殺は、業務が原因と認められれば労災保険の給付の対象となる。"},{"t":"qa","s":"過労死と生活の調和","imp":3,"q":"仕事と、家庭生活や地域活動、自己啓発などの生活とを両立させ、その両方を充実させる「仕事と生活の調和」を何というか。カタカナで答えよ。","a":"ワーク・ライフ・バランス","alt":["ワークライフバランス","ワーク・ライフバランス"],"e":"2007年に政府と労使の代表が「仕事と生活の調和（ワーク・ライフ・バランス）憲章」を策定した。長時間労働の是正や育児・介護休業の取得促進、柔軟な働き方の普及などが、その実現の手段となる。"},{"t":"ex","s":"過労死と生活の調和","imp":2,"q":"ワークシェアリングとは何か、その利点と課題を含めて説明せよ。","a":"ワークシェアリングとは、労働者1人あたりの労働時間を短縮して仕事を多くの人で分かち合い、雇用の維持や創出を図ることである。失業を減らすとともに、長時間労働を是正して仕事と生活の調和を図れる利点がある。一方で、労働時間の短縮に応じて賃金が減ることへの合意が必要であり、短時間で働く人の待遇を確保することも課題となる。","e":"ポイント：①労働時間の短縮による仕事の分かち合い ②雇用の維持・創出と長時間労働の是正 ③賃金の減少への合意や短時間労働者の待遇確保が課題（1982年のワッセナー合意を機に進めたオランダの例が有名）"},{"t":"qa","s":"男女雇用機会均等法","imp":3,"q":"女子差別撤廃条約の批准に向けて1985年に制定され、募集・採用や配置・昇進などで性別による差別をなくすことを目指す法律を何というか。","a":"男女雇用機会均等法","alt":["雇用機会均等法","均等法","雇用の分野における男女の均等な機会及び待遇の確保等に関する法律"],"e":"1972年制定の勤労婦人福祉法を改正する形で成立し、1986年に施行された。日本は1985年に女子差別撤廃条約を批准した。"},{"t":"mc","s":"男女雇用機会均等法","imp":3,"q":"男女雇用機会均等法の歩みについての記述として最も適当なものを一つ選べ。","c":["1985年の制定当初、募集・採用や配置・昇進で女性を男性と均等に取り扱うことは、事業主の努力義務にとどまっていた。","1997年の改正で、女性だけでなく男性に対する性別を理由とする差別も禁止された。","2006年の改正で、セクシュアル・ハラスメントへの配慮が初めて事業主に求められるようになった。","制定当初から、違反した事業主に懲役刑を科す規定が設けられていた。"],"a":0,"e":"制定当初は募集・採用や配置・昇進の均等な取扱いが努力義務にとどまっていたが、1997年の改正（1999年施行）で禁止規定に改められ、セクハラ防止の配慮義務や違反企業名の公表制度も設けられた。2006年の改正（2007年施行）では、男女双方に対する差別の禁止、間接差別の禁止、セクハラ防止の措置義務化、妊娠・出産等を理由とする不利益取扱いの禁止などが定められた。均等法に懲役刑の規定はない。"},{"t":"ex","s":"男女雇用機会均等法","imp":2,"q":"男女雇用機会均等法が禁止する間接差別とは何か、例をあげて説明せよ。","a":"間接差別とは、性別以外の事由を要件としているため表面上は男女に中立的に見えるが、実際には一方の性の人に相当程度の不利益を与えるもので、合理的な理由がないものをいう。たとえば、業務上の必要がないのに、募集・採用の条件として一定以上の身長・体重・体力を求めることや、転居を伴う転勤に応じることを求めることがこれにあたる。","e":"ポイント：①表面上は性別に中立的な基準 ②実際には一方の性に相当程度の不利益を与える ③合理的な理由がない（例：身長・体重・体力の要件、転居を伴う転勤の要件）。2006年の改正で禁止された"},{"t":"tf","s":"男女雇用機会均等法","imp":2,"q":"1997年の労働基準法改正で、女性の時間外・休日労働の制限や深夜業の禁止などの女子保護規定が撤廃され、あわせて産前産後休業の制度も廃止された。","a":false,"e":"誤り。正しくは、撤廃されたのは時間外・休日労働の制限や深夜業の禁止などの一般的な女子保護規定であり、産前産後休業などの母性保護の規定は維持されている。女子保護規定は女性の職域を狭める面もあったため、男女雇用機会均等法の強化とあわせて撤廃された（1999年施行）。"},{"t":"qa","s":"男女雇用機会均等法","imp":2,"q":"男女間に事実上生じている格差を解消するため、女性の採用や管理職への登用などを積極的に進める特別な措置を何というか。","a":"ポジティブ・アクション","alt":["ポジティブアクション","積極的改善措置","アファーマティブ・アクション","アファーマティブアクション","積極的差別是正措置"],"e":"男女雇用機会均等法は、こうした措置を違法な差別にはあたらないものとして認め、国が事業主の取組を援助するとしている。2015年制定の女性活躍推進法は、一定規模以上の企業に、女性の活躍に関する行動計画の策定と公表などを義務づけている。"},{"t":"mc","s":"ハラスメントの防止","imp":2,"q":"職場のハラスメント防止に関する法制度についての記述として最も適当なものを一つ選べ。","c":["パワー・ハラスメントについては、労働施策総合推進法の改正により、事業主に相談体制の整備などの防止措置が義務づけられた。","セクシュアル・ハラスメントの防止は、事業主ではなく、被害を受けた労働者自身の責任とされている。","男女雇用機会均等法のセクシュアル・ハラスメント防止の規定は、女性が被害を受けた場合だけを対象としている。","妊娠や出産を理由とする解雇は、就業規則に定めがあれば認められる。"],"a":0,"e":"パワハラは2019年の労働施策総合推進法の改正（いわゆるパワハラ防止法）で、事業主に防止措置が義務づけられた（大企業は2020年、中小企業は2022年から）。セクハラ防止の措置義務は男女雇用機会均等法に定められ、2006年の改正以降は男性が被害を受けた場合も対象となる。妊娠・出産などを理由とする解雇などの不利益取扱いは、就業規則の定めにかかわらず禁止されている。"},{"t":"qa","s":"ハラスメントの防止","imp":1,"q":"職場で、妊娠・出産したことや、産前産後休業・育児休業などを利用したことに関して、上司や同僚が就業環境を害する嫌がらせなどをすることを何というか。","a":"マタニティ・ハラスメント","alt":["マタハラ","マタニティハラスメント","妊娠・出産等に関するハラスメント"],"e":"略してマタハラという。2017年から、事業主に上司や同僚によるマタハラの防止措置が義務づけられた（男女雇用機会均等法・育児・介護休業法）。男性の育児休業の取得などを妨げる嫌がらせは、パタニティ・ハラスメント（パタハラ）と呼ばれる。"},{"t":"qa","s":"育児・介護休業","imp":3,"q":"労働者が、原則として子が1歳になるまでの育児休業や、要介護状態にある家族を介護するための介護休業を取得できることを定めた法律を何というか。","a":"育児・介護休業法","alt":["育児介護休業法","育児休業、介護休業等育児又は家族介護を行う労働者の福祉に関する法律"],"e":"1991年に育児休業法として制定され、1995年に介護休業の制度を加えて現在の名称となった。保育所に入れないなどの場合は、育児休業を最長で子が2歳になるまで延長できる。介護休業は対象家族1人につき通算93日まで取得でき、休業中は雇用保険から育児休業給付・介護休業給付が支給される。"},{"t":"tf","s":"育児・介護休業","imp":3,"q":"育児休業は、子を出産した女性労働者だけが取得できる制度である。","a":false,"e":"誤り。正しくは、育児休業は男女どちらの労働者も取得できる。父母がともに取得する場合は、子が1歳2か月になるまでの間に取得できる（パパ・ママ育休プラス）。ただし男性の取得率は女性に比べて大幅に低く、取得の促進が課題となっている。"},{"t":"qa","s":"育児・介護休業","imp":2,"q":"2022年10月に始まった、主に父親が、子の出生後8週間以内に最大4週間まで、2回に分けて取得することもできる休業制度を何というか。通称で答えよ。","a":"産後パパ育休","alt":["出生時育児休業","産後パパ育休（出生時育児休業）"],"e":"正式には出生時育児休業といい、通常の育児休業とは別に取得できる。同じ時期に、育児休業も2回まで分割して取得できるようになった。また従業員1000人を超える企業には、2023年から男性の育児休業取得率の公表が義務づけられた（2025年からは300人を超える企業に拡大）。"},{"t":"qa","s":"女性の労働と格差","imp":3,"q":"日本の女性の年齢階級別労働力率をグラフにすると、結婚・出産・子育ての時期にあたる30歳代で落ち込み、その後再び上昇する形になる。この形を何というか。","a":"M字カーブ","alt":["M字型カーブ","M字型","M字曲線"],"e":"出産や育児を機に仕事を辞め、子育てが一段落してから再び働く女性が多いことを示している。近年は晩婚化や両立支援の進展によって落ち込みが浅くなり、台形に近づいている。ただし再就職の多くは非正規雇用であり、女性の正規雇用率が20歳代後半をピークに低下していくL字カーブが新たな課題とされている。"},{"t":"ex","s":"女性の労働と格差","imp":2,"q":"日本で男女間の賃金格差が生じている主な理由を説明せよ。","a":"女性は出産・育児を機に退職したり、非正規雇用で働いたりする割合が高く、勤続年数が短くなりやすい。また管理職に占める女性の割合が低く、年功的な賃金制度のもとで昇進や昇給で不利になりやすい。さらに家事・育児の負担が女性にかたよる性別役割分担の意識や慣行も背景にある。","e":"ポイント：①出産・育児による離職と非正規雇用の多さ ②女性管理職の少なさと勤続年数の短さ ③性別役割分担意識による家事・育児負担のかたより"},{"t":"tf","s":"女性の労働と格差","imp":2,"q":"世界経済フォーラムが公表するジェンダー・ギャップ指数で、日本は政治・経済分野での男女格差が小さく、先進国の中でも上位に位置している。","a":false,"e":"誤り。正しくは、日本の順位は100位台と、主要7か国（G7）の中で最下位である。教育や健康の分野では男女差が小さいが、国会議員や閣僚、企業の管理職に占める女性の割合が低く、政治・経済分野の格差が大きい。"},{"t":"mc","s":"最低賃金制度","imp":2,"q":"日本の最低賃金制度についての記述として最も適当なものを一つ選べ。","c":["最低賃金は、パートタイム労働者やアルバイト、外国人労働者を含め、原則としてすべての労働者に適用される。","最低賃金は全国一律の金額が法律で定められており、どの都道府県でも同じ額が適用される。","労働者が同意すれば、最低賃金を下回る賃金で働く契約も有効となる。","最低賃金は労働組合と使用者の団体交渉によって決められ、労働組合のない企業には適用されない。"],"a":0,"e":"最低賃金法に基づき、都道府県ごとに地域別最低賃金が定められる。中央最低賃金審議会が引上げの目安を示し、地方最低賃金審議会の審議を経て都道府県労働局長が決定するため、都市部と地方で差がある。最低賃金を下回る賃金の定めは無効となり、最低賃金と同額の定めをしたものとみなされる。全国加重平均額は2023年度に初めて時給1000円を超えた。"},{"t":"tf","s":"高齢者・障害者の雇用","imp":2,"q":"高年齢者雇用安定法により、事業主は希望するすべての労働者を70歳まで雇用することが義務づけられている。","a":false,"e":"誤り。正しくは、義務づけられているのは65歳までの雇用確保措置（定年の引上げ、継続雇用制度の導入、定年の廃止のいずれか）であり、70歳までの就業機会の確保は2021年4月からの努力義務である。70歳までの措置には、業務委託契約や社会貢献事業への従事など、雇用以外の方法も認められている。なお定年を定める場合は60歳以上としなければならない。"},{"t":"qa","s":"高齢者・障害者の雇用","imp":2,"q":"障害者雇用促進法に基づき、事業主に対して、雇用する労働者のうち一定の割合以上の障害者を雇用することが義務づけられている。この割合を何というか。","a":"法定雇用率","alt":["障害者雇用率","障害者法定雇用率"],"e":"民間企業の法定雇用率は段階的に引き上げられ、2024年4月から2.5%、2026年7月から2.7%となった。達成できない一定規模以上の企業からは障害者雇用納付金が徴収され、多くの障害者を雇用する企業への調整金などにあてられる。2018年からは精神障害者も雇用義務の対象となった。"},{"t":"mc","s":"外国人労働者","imp":2,"q":"日本の外国人労働者の受け入れについての記述として最も適当なものを一つ選べ。","c":["2019年に、人手不足が深刻な分野で一定の専門性・技能をもつ外国人を受け入れる在留資格「特定技能」が設けられた。","技能実習制度は、国内の人手不足を補うことを本来の目的として、1950年代に創設された。","1990年の出入国管理及び難民認定法の改正で、日系人の就労は全面的に禁止された。","外国人労働者には、日本の労働基準法や最低賃金法は適用されない。"],"a":0,"e":"特定技能は、介護・建設・農業・外食などの分野で即戦力となる外国人を受け入れる在留資格である。技能実習制度は1993年に創設され、本来の目的は途上国への技能移転による国際貢献だった。1990年の入管法改正では日系3世までに就労に制限のない在留資格が認められ、日系ブラジル人などが増えた。日本で働く外国人にも、国籍を問わず労働基準法や最低賃金法が適用される。"},{"t":"ex","s":"外国人労働者","imp":2,"q":"技能実習制度の問題点と、それに代わって導入される育成就労制度のねらいを説明せよ。","a":"技能実習制度は、途上国への技能移転による国際貢献を目的としながら、実際には人手不足を補う労働力として利用され、原則として職場を変えられないため、低賃金や長時間労働、人権侵害、実習生の失踪などが問題となった。そこで2024年の法改正で廃止が決まり、2027年4月から、人材の育成と確保を目的とし、一定の条件で本人の意向による転籍も認める育成就労制度が始まる。","e":"ポイント：①目的（国際貢献）と実態（労働力の確保）のずれ ②転籍の制限による低賃金・人権侵害・失踪 ③育成就労制度は人材育成・確保が目的で、転籍を一定程度認め、特定技能へつなげる"},{"t":"qa","s":"失業と雇用対策","imp":3,"q":"労働力人口に占める完全失業者の割合を何というか。","a":"完全失業率","e":"労働力人口は、15歳以上人口のうち就業者と完全失業者を合わせたものである。完全失業者とは、仕事がなく、仕事があればすぐ就くことができ、仕事を探す活動をしていた人をいう。仕事を探していない人は非労働力人口に含まれ、失業者には数えられない。"},{"t":"mc","s":"失業と雇用対策","imp":2,"q":"ある国の15歳以上人口が1億1,000万人、就業者が6,825万人、完全失業者が175万人であるとき、この国の労働力人口と完全失業率の組合せとして最も適当なものを一つ選べ（完全失業率は小数第2位を四捨五入）。","c":["労働力人口7,000万人、完全失業率2.5%","労働力人口1億1,000万人、完全失業率1.6%","労働力人口6,825万人、完全失業率2.6%","労働力人口4,000万人、完全失業率4.4%"],"a":0,"e":"労働力人口は就業者と完全失業者の合計なので、6,825万人＋175万人＝7,000万人となり、完全失業率は175万人÷7,000万人×100＝2.5%である。15歳以上人口（1億1,000万人）には、仕事を探していない学生や高齢者などの非労働力人口（1億1,000万人−7,000万人＝4,000万人）が含まれるので、そのまま労働力人口とするのは誤りである。就業者だけを労働力人口としたり、非労働力人口と取り違えたりしないよう注意する。"},{"t":"qa","s":"失業と雇用対策","imp":3,"q":"公共職業安定所（ハローワーク）に登録された有効求人数を、有効求職者数で割った値を何というか。","a":"有効求人倍率","e":"1を上回れば求職者1人に対して1件を超える求人があることを示し、人手不足の状態といえる。景気がよいときに上昇し、悪いときに低下する。地域や職種による差が大きく、介護や建設などの職種では高く、一般事務などでは低い。"},{"t":"mc","s":"失業と雇用対策","imp":2,"q":"次の事例のうち、構造的失業にあたるものとして最も適当なものを一つ選べ。","c":["産業構造が変化し、求人の多い介護やIT分野で必要とされる技能をもたないため、製造業を離職した人が再就職できずにいる。","よりよい条件の仕事を探すために自ら退職し、次の就職先が決まるまでの間、一時的に失業している。","不況で社会全体の需要が落ち込み、企業が生産を減らしたため、多くの人が職を失った。","冬の間は積雪のため工事ができず、毎年その期間だけ建設の仕事がなくなる。"],"a":0,"e":"構造的失業は、求人と求職の間で職種・技能・年齢・地域などが合わないこと（雇用のミスマッチ）によって生じる失業で、求人があっても解消しにくく、職業訓練などが対策となる。転職などに伴う一時的な失業は摩擦的失業、不況による失業は需要不足失業（循環的失業）、季節による失業は季節的失業である。ケインズは、需要不足による非自発的失業は、政府が有効需要を増やすことで解消できると主張した。"},{"t":"tf","s":"失業と雇用対策","imp":1,"q":"雇用保険の基本手当（いわゆる失業手当）は、会社の倒産や解雇によって離職した人だけに支給され、自己都合で退職した人には一切支給されない。","a":false,"e":"誤り。正しくは、自己都合で退職した人にも基本手当は支給されるが、会社都合の離職に比べて給付が始まるまでに制限期間があるなど、扱いが異なる。雇用保険はこのほか、育児休業給付や職業訓練などの事業も行っている。求職の申込みや給付の手続き、職業紹介はハローワーク（公共職業安定所）が行う。"},{"t":"qa","s":"労働紛争の解決","imp":2,"q":"解雇や賃金の不払いなど、個々の労働者と事業主との間の紛争（個別労働紛争）について、地方裁判所で裁判官と労使の専門家が原則3回以内の期日で審理し、迅速な解決を図る制度を何というか。","a":"労働審判制度","alt":["労働審判"],"e":"2006年に始まった。裁判官（労働審判官）1人と労働審判員2人で構成する労働審判委員会が、まず調停による解決を試み、まとまらなければ労働審判を下す。当事者が2週間以内に異議を申し立てると審判は効力を失い、通常の訴訟に移行する。集団的な労使紛争を主に扱う労働委員会とは異なり、個別の紛争を対象とする。"},{"t":"tf","s":"フリーランスの保護","imp":1,"q":"企業から仕事を請け負って個人で働くフリーランスは、原則として労働基準法上の労働者にあたらないため、労働時間や最低賃金に関する規制は適用されない。","a":true,"e":"正しい。フリーランスは企業と雇用契約ではなく業務委託などの契約を結ぶ事業者として扱われるため、労働法による保護を受けにくい。ただし契約の名前が業務委託でも、実際には指揮命令を受けて働いているなど、働き方の実態が労働者と同じであれば労働者として保護される。"},{"t":"qa","s":"フリーランスの保護","imp":2,"q":"2024年11月に施行され、フリーランスに業務を委託する事業者に、取引条件の明示や報酬の支払期日の設定、ハラスメント対策などを義務づけた法律を何というか。","a":"フリーランス・事業者間取引適正化等法","alt":["フリーランス保護法","フリーランス新法","フリーランス法","フリーランス・事業者間取引適正化法","特定受託事業者に係る取引の適正化等に関する法律"],"e":"正式名称は特定受託事業者に係る取引の適正化等に関する法律で、2023年に成立した。報酬は原則として成果物などを受け取った日から60日以内に支払わなければならず、不当な報酬の減額なども禁止される。インターネットを通じて単発の仕事を請け負うギグワーカーの増加も背景にある。"}]});</script>
<script>QDATA.push({"unit":"u22","questions":[{"t":"qa","s":"社会保障の歴史","imp":2,"q":"1601年にイギリスで制定され、教区ごとに税を集めて貧民を救済した、公的扶助の始まりとされる法律を何というか。","a":"エリザベス救貧法","alt":["救貧法","エリザベス救貧法（救貧法）"],"e":"働く能力のない貧民を救済する一方、働ける貧民には労働を強制するなど、治安維持の性格が強かった。救済は恩恵として与えられるもので、権利とは考えられていなかった。"},{"t":"qa","s":"社会保障の歴史","imp":3,"q":"1880年代のドイツで、疾病保険・災害保険・老齢・廃疾保険からなる世界初の社会保険制度をつくった宰相は誰か。","a":"ビスマルク","alt":["オットー・フォン・ビスマルク"],"e":"1883年の疾病保険法に始まる。その一方で社会主義者鎮圧法（1878年）によって社会主義運動や労働運動を弾圧したため、社会保険と合わせて「アメとムチ」の政策と呼ばれる。"},{"t":"tf","s":"社会保障の歴史","imp":3,"q":"ビスマルクの「アメとムチ」の政策では、「アメ」にあたるのが社会主義者鎮圧法であり、「ムチ」にあたるのが社会保険制度である。","a":false,"e":"誤り。正しくは、「アメ」が労働者の生活を保障する社会保険制度、「ムチ」が社会主義運動を弾圧する社会主義者鎮圧法である。社会保険には、労働者を国家に結びつけて社会主義運動から引き離すねらいがあった。"},{"t":"qa","s":"社会保障の歴史","imp":1,"q":"1911年にイギリスで制定され、健康保険と世界初の失業保険を設けた法律を何というか。","a":"国民保険法","alt":["国民保険法（1911年）"],"e":"自由党政権のもとで、蔵相ロイド・ジョージが中心となって制定した。ドイツの社会保険にならったもので、イギリスの社会保険制度の出発点となった。"},{"t":"qa","s":"社会保障の歴史","imp":3,"q":"世界恐慌後のアメリカで、ニューディール政策の一環として1935年に制定され、「社会保障」という言葉を初めて法律の名称に用いた法律を何というか。","a":"社会保障法","alt":["連邦社会保障法"],"e":"フランクリン・ローズベルト大統領のもとで制定され、老齢年金や失業保険、公的扶助などを定めた。ただしアメリカでは国民全体を対象とする公的医療保険は設けられず、現在も民間の医療保険が中心である。"},{"t":"qa","s":"社会保障の歴史","imp":3,"q":"第二次世界大戦中の1942年にイギリスで発表され、全国民に最低限度の生活を保障する社会保障制度の構想を示して、戦後の福祉国家の基礎となった報告書を何というか。","a":"ベバリッジ報告","alt":["ベバリッジ報告書","ベヴァリッジ報告","ベヴァリッジ報告書"],"e":"経済学者ベバリッジを委員長とする委員会がまとめた。窮乏・疾病・無知・不潔・怠惰の「五つの巨悪」の克服を掲げ、均一の保険料で均一の給付を行う社会保険を中心に、国民扶助で補う体系を示した。"},{"t":"qa","s":"社会保障の歴史","imp":2,"q":"国が全国民に対して保障すべき最低限度の生活水準を何というか。ベバリッジ報告の基本理念となった。","a":"ナショナル・ミニマム","alt":["ナショナルミニマム","国民的最低限"],"e":"もともとは19世紀末にイギリスのウェッブ夫妻が提唱した考え方である。日本国憲法第25条の「健康で文化的な最低限度の生活」の保障も、同じ考え方に立っている。"},{"t":"tf","s":"社会保障の歴史","imp":2,"q":"「ゆりかごから墓場まで」は、世界恐慌後のアメリカがニューディール政策の中で掲げたスローガンである。","a":false,"e":"誤り。正しくは、ベバリッジ報告に基づいて社会保障制度を整えた第二次世界大戦後のイギリスが掲げたスローガンである。生まれてから死ぬまで生涯にわたって国が生活を保障することを表し、税を財源とする国民保健サービス（NHS）などが整備された。"},{"t":"tf","s":"社会保障の歴史","imp":1,"q":"1944年に国際労働機関（ILO）が採択したフィラデルフィア宣言は、「労働は商品ではない」ことを確認するとともに、社会保障の拡充をILOの目的の一つとした。","a":true,"e":"正しい。所得保障や医療の提供を必要とするすべての人への社会保障の拡大を掲げ、戦後の社会保障の国際的な発展に影響を与えた。1948年の世界人権宣言も、すべての人が社会保障を受ける権利をもつことを定めている。"},{"t":"mc","s":"社会保障の歴史","imp":2,"q":"社会保障の歴史に関する次の出来事を古い順に並べたとき、3番目にあたるものを一つ選べ。","c":["ドイツで、ビスマルクのもとで疾病保険法が制定された。","イギリスで、エリザベス救貧法が制定された。","アメリカで、ニューディール政策の一環として社会保障法が制定された。","イギリスで、ベバリッジ報告が発表された。"],"a":2,"e":"エリザベス救貧法（1601年）→ドイツの疾病保険法（1883年）→アメリカの社会保障法（1935年）→ベバリッジ報告（1942年）の順である。公的扶助（救貧）から社会保険へ、さらに全国民を対象とする総合的な社会保障へと発展してきた流れをおさえておく。"},{"t":"mc","s":"社会保障の類型","imp":2,"q":"社会保障制度の類型についての記述として最も適当なものを一つ選べ。","c":["北欧型は、主に租税を財源として全国民を対象に均一の給付を行う、高福祉高負担の制度である。","ヨーロッパ大陸型は、主に租税を財源として、所得にかかわらず全員に同額の給付を行う制度である。","アメリカ型は、国民全体を対象とする公的医療保険を中心に、手厚い給付を行う制度である。","日本の社会保障制度は、社会保険ではなく、租税を財源とする公的扶助を中心として運営されている。"],"a":0,"e":"北欧型（イギリス・北欧型）は税を主な財源に全国民へ均一の給付を行う。ヨーロッパ大陸型（ドイツ・フランスなど）は職業ごとの社会保険を中心に保険料を主な財源とし、所得に比例した給付を行う。アメリカ型は公的制度を高齢者や低所得者向けなどに限り、民間保険と自助努力を重視する。日本は社会保険を中心としながら多額の公費も投入しており、両者の中間的な制度といえる。"},{"t":"ex","s":"社会保障の類型","imp":2,"q":"社会保障の財源を租税中心とする方式と、社会保険料中心とする方式の特徴の違いを説明せよ。","a":"租税中心の方式は、保険料を払えない人も含めて全国民を対象にしやすく、所得の再分配の効果も大きいが、給付を増やすには増税が必要で、負担と給付の対応が見えにくい。社会保険料中心の方式は、保険料を払った人が給付を受ける権利をもつため負担と給付の対応が明確だが、保険料を払えない人が制度から漏れやすく、給付も所得や加入期間に応じたものになりやすい。","e":"ポイント：①租税中心は全国民を対象にしやすく再分配効果が大きいが、増税が必要 ②保険料中心は負担と給付の対応が明確で権利性が強い ③保険料中心では未納・未加入による無保険・無年金の問題が生じやすい"},{"t":"qa","s":"社会保障の類型","imp":1,"q":"国民所得に占める、租税負担と社会保障負担（社会保険料）の合計の割合を何というか。","a":"国民負担率","e":"給付と負担の水準を国際比較する際の指標となる。これに財政赤字を加えたものを潜在的国民負担率という。高福祉高負担の国では高く、低福祉低負担の国では低い。"},{"t":"tf","s":"社会保障の類型","imp":2,"q":"日本の国民負担率は、スウェーデンやフランスよりも高く、アメリカよりも低い。","a":false,"e":"誤り。正しくは、日本の国民負担率（近年は5割近く）は、スウェーデンやフランスなどのヨーロッパ諸国より低く、アメリカより高い。高福祉高負担のヨーロッパ諸国と、低福祉低負担のアメリカの中間に位置する。"},{"t":"qa","s":"日本の社会保障の歩み","imp":1,"q":"1874年に明治政府が定めた救貧制度で、家族や近隣の助け合いを前提とし、頼る者のない極貧の人などに限って米代を支給したものを何というか。","a":"恤救規則","alt":["じゅっきゅうきそく"],"e":"救済は国の恩恵とされ、対象もきわめて限られていた。1929年に救護法が制定されたが、これも権利としての保障ではなかった。権利としての公的扶助は、戦後の日本国憲法第25条と生活保護法によって確立した。"},{"t":"mc","s":"日本の社会保障の歩み","imp":2,"q":"日本の社会保障の歩みについての記述として最も適当なものを一つ選べ。","c":["1922年に健康保険法が制定されたが、当初の対象は工場や鉱山で働く労働者などに限られていた。","明治政府の恤救規則は、生活に困窮した人が国に保護を求める権利を初めて認めた。","国民皆保険・皆年金は、日本国憲法が施行された1947年に実現した。","老人医療費の無料化は、1980年代後半のバブル経済の時期に初めて実施された。"],"a":0,"e":"健康保険法は日本最初の社会保険の法律で、1927年に全面施行された。恤救規則による救済は国の恩恵であり、権利としての保障ではなかった。国民皆保険・皆年金の実現は1961年、老人医療費の無料化は「福祉元年」と呼ばれた1973年である。"},{"t":"qa","s":"日本の社会保障の歩み","imp":3,"q":"1961年に実現した、すべての国民が何らかの公的医療保険と公的年金に加入する体制を何というか。","a":"国民皆保険・皆年金","alt":["国民皆保険・国民皆年金","皆保険・皆年金","国民皆保険皆年金","国民皆保険・皆年金体制"],"e":"1958年の国民健康保険法の全面改正で市町村に国民健康保険の実施が義務づけられ、1959年には国民年金法が制定された。これにより、それまで公的な保険の対象外だった自営業者や農業者なども加入するようになった。"},{"t":"qa","s":"日本の社会保障の歩み","imp":2,"q":"生活保護法、児童福祉法、身体障害者福祉法、知的障害者福祉法、老人福祉法、母子及び父子並びに寡婦福祉法をまとめて何というか。","a":"福祉六法","e":"戦後間もなく制定された生活保護法・児童福祉法・身体障害者福祉法は福祉三法と呼ばれる。1960年代に、知的障害者福祉法（制定時は精神薄弱者福祉法）・老人福祉法・母子福祉法（現在の母子及び父子並びに寡婦福祉法）が加わって福祉六法となった。"},{"t":"tf","s":"日本の社会保障の歩み","imp":2,"q":"1973年は「福祉元年」と呼ばれ、70歳以上の老人医療費の無料化や年金給付の大幅な引上げが行われたが、同じ年の石油危機を機に経済が低成長に移ると、社会保障の見直しが進められた。","a":true,"e":"正しい。田中角栄内閣のもとで、老人医療費の無料化や、物価の変動に合わせて年金額を改定する物価スライド制の導入などが行われた。しかし第1次石油危機後の財政悪化により、1982年制定の老人保健法で老人医療費に一部自己負担が導入された。"},{"t":"qa","s":"日本の社会保障の歩み","imp":1,"q":"1982年に制定され、それまで無料だった老人医療費に一部自己負担を導入した法律を何というか。","a":"老人保健法","e":"1983年に施行された。高齢化で増え続ける老人医療費を、国民が公平に負担する仕組みを目指した。2008年には高齢者の医療の確保に関する法律に改められ、後期高齢者医療制度が始まった。"},{"t":"qa","s":"社会保障の4つの柱","imp":3,"q":"日本の社会保障制度を構成する4つの柱をすべて答えよ。","a":"社会保険・公的扶助・社会福祉・公衆衛生","alt":["社会保険、公的扶助、社会福祉、公衆衛生","社会保険・公的扶助・社会福祉・保健医療・公衆衛生"],"e":"日本国憲法第25条2項は「国は、すべての生活部面について、社会福祉、社会保障及び公衆衛生の向上及び増進に努めなければならない」と定めており、これを具体化したものである。このうち社会保険が中心で、給付費の大部分を占める。"},{"t":"mc","s":"社会保障の4つの柱","imp":3,"q":"次の制度・施策と、それが属する日本の社会保障制度の柱の組合せとして最も適当なものを一つ選べ。","c":["感染症の予防接種や上下水道の整備：公衆衛生","生活に困窮する人への生活保護の支給：社会福祉","40歳以上の人が加入する介護保険：公的扶助","児童養護施設や障害者福祉サービスの提供：社会保険"],"a":0,"e":"公衆衛生は、感染症の予防や生活環境の整備などによって国民の健康を守るもので、保健所などが担い、主に公費でまかなわれる。生活保護は公的扶助、介護保険は社会保険、児童養護施設や障害者福祉サービスは社会福祉にあたる。"},{"t":"ex","s":"社会保障の4つの柱","imp":3,"q":"社会保険と公的扶助の違いを、財源と給付を受ける条件に着目して説明せよ。","a":"社会保険は、加入者があらかじめ保険料を出し合い、病気・老齢・失業などが生じたときに給付を受ける仕組みで、財源は保険料を中心に公費も加えられる。公的扶助は、生活に困窮した人に対し、資力調査を行ったうえで最低限度の生活を保障するもので、財源は全額公費（税）であり、保険料の拠出は条件とされない。","e":"ポイント：①社会保険は保険料の拠出が前提（事前の備え） ②公的扶助は全額公費で、拠出を条件としない ③公的扶助は資力調査を行い、困窮した人を事後的に救済する"},{"t":"tf","s":"社会保障の4つの柱","imp":2,"q":"日本の社会保険は、加入者が納める保険料だけを財源として運営されており、国や地方公共団体の税金は使われていない。","a":false,"e":"誤り。正しくは、社会保険の財源には保険料のほかに、国や地方の公費（税金）も多く投入されている。たとえば基礎年金の給付費の2分の1は国庫負担であり、介護保険の給付費の半分も公費でまかなわれている。"},{"t":"mc","s":"医療保険","imp":3,"q":"日本の公的医療保険の制度と、その主な加入者の組合せとして最も適当なものを一つ選べ。","c":["国民健康保険：自営業者や農業者、退職して無職となった人など","健康保険：国家公務員や地方公務員","共済組合：民間企業で働く会社員","後期高齢者医療制度：65歳以上の人全員"],"a":0,"e":"民間企業の会社員とその家族は健康保険（中小企業は全国健康保険協会、大企業は健康保険組合が運営するものが多い）、公務員や私立学校の教職員は共済組合、それ以外の自営業者や無職の人などは国民健康保険に加入する。75歳以上の人は後期高齢者医療制度に加入する。"},{"t":"qa","s":"医療保険","imp":3,"q":"2008年に始まった、75歳以上の人が加入する独立した公的医療保険制度を何というか。","a":"後期高齢者医療制度","alt":["長寿医療制度"],"e":"都道府県ごとに、すべての市町村が加入する後期高齢者医療広域連合が運営する。財源は、公費が約5割、現役世代が加入する医療保険からの支援金が約4割、高齢者自身の保険料が約1割である。"},{"t":"tf","s":"医療保険","imp":3,"q":"公的医療保険で医療機関の窓口で支払う自己負担の割合は、年齢や所得にかかわらず一律3割である。","a":false,"e":"誤り。正しくは、原則3割だが、小学校入学前の子どもは2割、70〜74歳は原則2割、75歳以上は原則1割である。ただし高齢者でも、一定以上の所得がある人は2割、現役並みの所得がある人は3割を負担する（75歳以上の2割負担は2022年10月から）。"},{"t":"qa","s":"医療保険","imp":1,"q":"医療機関や薬局の窓口で支払った1か月の自己負担額が一定の上限額を超えた場合に、その超えた分が支給される医療保険の制度を何というか。","a":"高額療養費制度","alt":["高額療養費"],"e":"上限額は年齢や所得に応じて決められている。重い病気やけがで医療費が高額になっても、家計の負担が重くなりすぎないようにするための仕組みである。"},{"t":"ex","s":"医療保険","imp":2,"q":"国民皆保険の意義と、日本の医療保険制度が直面している課題を説明せよ。","a":"国民皆保険により、誰もがいずれかの公的医療保険に加入し、全国の医療機関を選んで受診でき、一定の自己負担で必要な医療を受けられるようになり、国民の健康と長寿を支えてきた。一方で、高齢化や医療技術の高度化で医療費が増え続け、現役世代の保険料負担が重くなっている。また高齢者や低所得者が多く加入する国民健康保険は財政基盤が弱く、公費の投入に頼っている。","e":"ポイント：①誰もが一定の負担で医療を受けられる（医療機関を自由に選べるフリーアクセス） ②高齢化・医療の高度化による医療費の増大と現役世代の負担増 ③高齢者や低所得者が多い国民健康保険の財政難"}]});</script>
<script>QDATA.push({"unit":"u22","questions":[{"t":"qa","s":"公的年金","imp":3,"q":"日本に住む20歳以上60歳未満のすべての人が加入し、老後に全国民共通の基礎年金を受け取る公的年金制度を何というか。","a":"国民年金","alt":["国民年金（基礎年金）","基礎年金"],"e":"1985年の改正（1986年施行）で、国民年金が全国民共通の基礎年金（1階部分）となり、会社員や公務員はその上乗せとして厚生年金（2階部分）を受け取る、2階建ての仕組みが整えられた。日本に住む外国人も加入の対象である。"},{"t":"qa","s":"公的年金","imp":3,"q":"会社員や公務員が加入し、基礎年金に上乗せして、在職中の報酬（給与）に比例した額の年金を受け取る、公的年金の2階部分を何というか。","a":"厚生年金","alt":["厚生年金保険"],"e":"保険料は給与や賞与に一定の率（18.3%）をかけた額で、事業主と労働者が半分ずつ負担する。パートなどの短時間労働者にも、一定の要件を満たせば加入の対象が広げられてきた。"},{"t":"mc","s":"公的年金","imp":3,"q":"国民年金の被保険者の区分についての記述として最も適当なものを一つ選べ。","c":["会社員や公務員に扶養されている配偶者で、年収が一定額未満の人は第3号被保険者となり、自ら保険料を納める必要はない。","自営業者や農業者、学生は第2号被保険者となり、保険料は勤務先と半分ずつ負担する。","会社員や公務員は第1号被保険者となり、定額の国民年金保険料を自分で納める。","第3号被保険者になれるのは女性に限られ、男性は対象とならない。"],"a":0,"e":"第1号被保険者は自営業者・農業者・学生・無職の人などで、定額の保険料を自分で納める（学生は申請により納付を猶予される学生納付特例制度がある）。第2号被保険者は会社員や公務員などの厚生年金の加入者で、保険料は給与から天引きされ労使で折半する。第3号被保険者は第2号被保険者に扶養される配偶者で、保険料は配偶者が加入する厚生年金の制度全体で負担するため本人の負担はない。性別は問わない。"},{"t":"tf","s":"公的年金","imp":1,"q":"2015年に、公務員などが加入していた共済年金が厚生年金に統合され、会社員と公務員の年金制度が一元化された。","a":true,"e":"正しい。これを被用者年金の一元化という。公務員や私立学校の教職員も厚生年金に加入することになり、保険料率や給付の仕組みが会社員とそろえられた。"},{"t":"ex","s":"公的年金","imp":3,"q":"年金の財政方式である積立方式と賦課方式の違いを、それぞれの長所と短所にふれて説明せよ。","a":"積立方式は、自分が現役時代に納めた保険料を積み立て、その運用益とあわせて老後に受け取る方式で、人口構成の変化の影響を受けにくいが、インフレで積立金の価値が目減りしやすい。賦課方式は、その年の年金給付をその時の現役世代の保険料でまかなう方式で、インフレに対応しやすいが、少子高齢化が進むと現役世代の負担が重くなる。","e":"ポイント：①積立方式は自分の保険料を積み立てる（少子高齢化に強いがインフレに弱い） ②賦課方式は現役世代が高齢世代を支える世代間扶養（インフレに強いが少子高齢化に弱い） ③日本の公的年金は賦課方式を基本としている"},{"t":"mc","s":"公的年金","imp":3,"q":"日本の公的年金の財政方式についての記述として最も適当なものを一つ選べ。","c":["現役世代が納める保険料をその時の高齢者の年金給付にあてる賦課方式を基本とし、積立金も活用している。","各人が納めた保険料をすべて個人ごとに積み立てて運用する、完全な積立方式で運営されている。","保険料は徴収せず、年金給付の全額を租税でまかなう方式で運営されている。","賦課方式は人口構成の影響を受けないため、少子高齢化が進んでも現役世代の保険料負担は増えない。"],"a":0,"e":"日本の公的年金は当初は積立方式で始まったが、給付の引上げなどにより賦課方式の性格が強まり、現在は賦課方式を基本に、積立金とその運用収入も活用して給付にあてている。積立金は年金積立金管理運用独立行政法人（GPIF）が運用している。賦課方式は少子高齢化の影響を強く受けるため、現役世代の負担が重くなることが課題である。"},{"t":"qa","s":"公的年金","imp":3,"q":"基礎年金の給付費のうち、国庫（税金）によってまかなわれている割合はどれだけか。","a":"2分の1","alt":["2分の1（半分）","半分","50%","1/2","二分の一"],"e":"2004年の年金制度改正で、それまでの3分の1から2分の1に引き上げることが決まり、2009年度から実施された。2014年度からは、消費税率の引上げによる財源で恒久化された。"},{"t":"qa","s":"公的年金","imp":3,"q":"2004年の年金制度改正で導入された、現役世代の人数の減少や平均余命の伸びに応じて、年金の給付水準の伸びを賃金や物価の伸びよりも低く抑える仕組みを何というか。","a":"マクロ経済スライド","e":"保険料の水準に上限を設けて固定する（厚生年金の保険料率は18.3%）一方、給付の側を自動的に調整して、長期的に年金財政のバランスをとるための仕組みである。初めて発動されたのは2015年度である。"},{"t":"tf","s":"公的年金","imp":2,"q":"公的年金の受給開始年齢は原則65歳だが、本人の希望により60歳から75歳までの間で選ぶことができ、受給開始を遅らせるほど1か月あたりの年金額は増える。","a":true,"e":"正しい。65歳より早く受け取る繰上げ受給では年金額が減り、遅く受け取る繰下げ受給では増える。2022年4月から、繰下げの上限が70歳から75歳に引き上げられた。"},{"t":"tf","s":"公的年金","imp":2,"q":"国民年金の保険料を納めていない期間があっても、将来受け取る老齢基礎年金の額は減らない。","a":false,"e":"誤り。正しくは、保険料の未納期間があると、その分だけ老齢基礎年金の額が減る。また保険料を納めた期間などが10年（受給資格期間、2017年に25年から短縮）に満たないと、老齢基礎年金を受け取れない。障害年金なども受けられなくなるおそれがあるため、収入の少ない学生は学生納付特例制度を利用するとよい。"},{"t":"qa","s":"公的年金","imp":1,"q":"加入者が自ら掛金を拠出して運用商品を選び、その運用成果によって将来の受取額が変わる、任意加入の個人型確定拠出年金の愛称は何か。","a":"iDeCo","alt":["イデコ","個人型確定拠出年金"],"e":"公的年金に上乗せする私的年金の一つで、掛金が所得控除の対象になるなど税制上の優遇がある。企業が実施する企業年金（確定給付企業年金や企業型確定拠出年金）とともに、年金のいわゆる3階部分にあたる。"},{"t":"ex","s":"公的年金","imp":2,"q":"少子高齢化が賦課方式の公的年金に与える影響と、それに対応して行われてきた制度改革を説明せよ。","a":"賦課方式では現役世代の保険料で高齢者の年金をまかなうため、少子高齢化で支え手が減り受け手が増えると、現役世代の負担が重くなるか、給付を抑えざるをえなくなる。そこで2004年の改正で保険料の上限を固定し、マクロ経済スライドで給付の伸びを抑える仕組みが導入された。また基礎年金の国庫負担の2分の1への引上げや、短時間労働者への厚生年金の適用拡大なども進められている。","e":"ポイント：①支え手の減少と受け手の増加で現役世代の負担が増す ②保険料水準の固定とマクロ経済スライドによる給付の抑制 ③国庫負担の引上げや厚生年金の適用拡大による支え手の拡大"},{"t":"qa","s":"雇用保険と労災保険","imp":2,"q":"業務上の事由や通勤によって労働者がけがをしたり、病気になったり、死亡したりした場合に、本人や遺族に必要な給付を行う社会保険を何というか。","a":"労働者災害補償保険","alt":["労災保険","労働者災害補償保険（労災保険）"],"e":"1947年に制定された労働者災害補償保険法に基づく。労働者を1人でも雇う事業所は原則として加入しなければならず、パートやアルバイトを含むすべての労働者が対象となる。雇用保険とあわせて労働保険と呼ばれる。"},{"t":"mc","s":"雇用保険と労災保険","imp":2,"q":"雇用保険と労災保険の保険料の負担についての記述として最も適当なものを一つ選べ。","c":["労災保険の保険料は全額を事業主が負担し、雇用保険の保険料は事業主と労働者の双方が負担する。","労災保険の保険料は全額を労働者が負担し、雇用保険の保険料は全額を事業主が負担する。","労災保険と雇用保険の保険料は、いずれも全額を国が負担する。","労災保険と雇用保険の保険料は、いずれも事業主と労働者が半分ずつ負担する。"],"a":0,"e":"労災保険は、使用者が負う労働災害の補償責任を保険で担うものなので、保険料は全額を事業主が負担する。雇用保険の保険料は労使で負担するが、職業訓練などを行う雇用保険二事業の分は事業主だけが負担するため、事業主の負担の方が大きい。"},{"t":"mc","s":"雇用保険と労災保険","imp":1,"q":"次の事例のうち、労災保険の給付の対象となるものとして最も適当なものを一つ選べ。","c":["飲食店でアルバイトをしている大学生が、勤務中に調理場でやけどを負った。","会社員が休日に、趣味のサッカーの試合で足を骨折した。","会社員が仕事を終えて帰宅した後、自宅の階段で転んでけがをした。","会社員が、仕事とは関係のない持病の治療のために通院した。"],"a":0,"e":"労災保険は、雇用形態にかかわらず、業務上の事由によるけがや病気（業務災害）と、通勤途中の事故によるけが（通勤災害）を対象とする。アルバイトの勤務中のやけどは業務災害にあたる。休日の趣味やすでに帰宅した後の自宅での事故、仕事と関係のない持病は対象外で、通常は医療保険で治療を受けることになる。"},{"t":"qa","s":"介護保険","imp":3,"q":"1997年に法律が制定され、2000年に始まった、介護が必要な高齢者などに介護サービスを提供する社会保険を何というか。","a":"介護保険","alt":["介護保険制度"],"e":"家族だけに介護を任せず、社会全体で支える「介護の社会化」を目指して導入された。それまでの、行政が利用するサービスを決める措置制度から、利用者が事業者を選んで契約する方式へと変わった。"},{"t":"mc","s":"介護保険","imp":3,"q":"日本の介護保険制度についての記述として最も適当なものを一つ選べ。","c":["保険者は市町村（東京23区を含む）であり、40歳以上の人が被保険者として保険料を納める。","保険者は国であり、20歳以上の人全員が被保険者として保険料を納める。","介護サービスを利用する際の自己負担はなく、費用はすべて保険料でまかなわれる。","介護サービスは、要介護認定を受けなくても、本人の希望だけで自由に利用できる。"],"a":0,"e":"被保険者は、65歳以上の第1号被保険者と、40〜64歳の医療保険加入者である第2号被保険者に分かれる。サービスを利用するには市町村の要介護認定を受ける必要があり、利用者は費用の原則1割（所得に応じて2割または3割）を負担する。財源は利用者負担を除いて保険料と公費が半分ずつである。"},{"t":"qa","s":"介護保険","imp":2,"q":"介護保険のサービスを利用するために、市町村が介護の必要の程度を判定し、要支援1・2や要介護1〜5に区分することを何というか。","a":"要介護認定","alt":["要介護・要支援認定","要介護認定（要支援認定）"],"e":"認定の区分に応じて、利用できるサービスの量（支給限度額）が決まる。ケアマネジャー（介護支援専門員）が、本人の状態や希望に合わせてサービスの計画（ケアプラン）を作成する。"},{"t":"tf","s":"介護保険","imp":2,"q":"介護保険の給付費（利用者負担を除く）は、その半分を40歳以上の人が納める保険料で、残りの半分を国・都道府県・市町村の公費でまかなっている。","a":true,"e":"正しい。公費のうち国が25%（施設等の給付は20%）、都道府県と市町村がそれぞれ12.5%（施設等の給付は都道府県が17.5%）を負担する。高齢化で給付費が増え続け、65歳以上の人の保険料も上昇している。"},{"t":"tf","s":"介護保険","imp":1,"q":"介護保険の第2号被保険者（40〜64歳）は、どのような原因で介護が必要になった場合でも、介護サービスを利用することができる。","a":false,"e":"誤り。正しくは、第2号被保険者が介護サービスを利用できるのは、末期がんや初老期の認知症など、加齢にともなって生じる特定の病気（特定疾病）が原因で介護が必要になった場合に限られる。65歳以上の第1号被保険者は、原因を問わず要介護認定を受ければ利用できる。"},{"t":"qa","s":"公的扶助（生活保護）","imp":3,"q":"日本国憲法第25条の理念に基づき、生活に困窮するすべての国民に、困窮の程度に応じて必要な保護を行い、最低限度の生活を保障するとともに自立を助長することを目的とする法律を何というか。","a":"生活保護法","e":"公的扶助の中心となる法律である。1950年に全面改正された現行法は、保護を受けることを国民の権利として認め、不服申立ての制度も設けた。生活保護の基準が憲法第25条に反するかが争われた朝日訴訟は、生存権の性格をめぐる重要な裁判となった。"},{"t":"mc","s":"公的扶助（生活保護）","imp":2,"q":"生活保護法に定められた扶助の種類として適当でないものを一つ選べ。","c":["教育扶助","住宅扶助","医療扶助","年金扶助"],"a":3,"e":"生活保護の扶助は、生活扶助・教育扶助・住宅扶助・医療扶助・介護扶助・出産扶助・生業扶助・葬祭扶助の8種類で、年金扶助というものはない。医療扶助と介護扶助は原則として現物給付、その他は原則として金銭給付である。保護費の約半分を医療扶助が占めている。"},{"t":"qa","s":"公的扶助（生活保護）","imp":3,"q":"生活保護は、資産や働く能力、他の法律による給付などをすべて活用しても、なお最低限度の生活を維持できない場合に初めて行われる。この原理を何というか。","a":"補足性の原理","alt":["保護の補足性","補足性"],"e":"このため保護の開始にあたっては、預貯金や資産、収入、親族による扶養の可能性などを調べる資力調査（ミーンズテスト）が行われる。生活保護法はこのほか、国家責任の原理・無差別平等の原理・最低生活保障の原理を基本原理としている。"},{"t":"mc","s":"公的扶助（生活保護）","imp":2,"q":"次の記述のうち、生活保護法の補足性の原理の考え方を示すものとして最も適当なものを一つ選べ。","c":["生活保護を申請したCさんは、まず手持ちの預貯金や、受け取ることのできる年金などを生活費にあてるよう求められた。","生活保護は、生活に困窮するに至った理由を問わず、要件を満たせば誰でも受けることができる。","生活保護で保障される生活は、健康で文化的な生活水準を維持できるものでなければならない。","国は、生活に困窮するすべての国民に対し、その最低限度の生活を自らの責任で保障する。"],"a":0,"e":"補足性の原理は、自分の資産や能力、他の制度による給付などを活用することを保護の前提とする考え方である。困窮の理由を問わないのは無差別平等の原理、健康で文化的な生活水準の維持は最低生活保障の原理、国の責任による保障は国家責任の原理にあたる。"},{"t":"tf","s":"公的扶助（生活保護）","imp":3,"q":"生活保護の費用は、国民が納める保険料と国の税金によってまかなわれており、保険料を納めていない人は生活保護を受けることができない。","a":false,"e":"誤り。正しくは、生活保護の費用は全額が公費（国が4分の3、地方が4分の1）でまかなわれ、保険料の拠出は必要ない。生活に困窮していれば、困窮の原因を問わず保護を受けることができる（無差別平等の原理）。"},{"t":"tf","s":"公的扶助（生活保護）","imp":1,"q":"生活保護を受けている世帯の類型をみると、最も多いのは母子世帯であり、高齢者世帯は1割に満たない。","a":false,"e":"誤り。正しくは、最も多いのは高齢者世帯で、生活保護を受けている世帯の半数以上を占め、その多くは単身である。年金がない、あるいは少ない高齢者の増加が背景にある。生活保護を受けている人は約200万人にのぼる。"},{"t":"qa","s":"社会福祉の理念","imp":3,"q":"障害のある人や高齢者を隔離して保護するのではなく、ともに地域社会で普通に暮らせる社会こそが当然（ノーマル）であるという考え方を何というか。","a":"ノーマライゼーション","alt":["ノーマリゼーション"],"e":"1950年代にデンマークのバンク＝ミケルセンが、知的障害者が大規模な施設に隔離されている状況を批判して提唱した。日本の障害者福祉や高齢者福祉の基本理念にもなっている。"},{"t":"qa","s":"社会福祉の理念","imp":2,"q":"障害のある人や高齢者などが社会生活を送るうえで妨げとなる、段差などの物理的な障壁や、制度・情報・意識の上での障壁を取り除くことを何というか。","a":"バリアフリー","e":"2006年に高齢者、障害者等の移動等の円滑化の促進に関する法律（バリアフリー法）が制定され、駅や建物、公共交通機関などのバリアフリー化が進められている。"},{"t":"mc","s":"社会福祉の理念","imp":3,"q":"次の事例のうち、ユニバーサルデザインの考え方にもっともよくあてはまるものを一つ選べ。","c":["年齢や障害の有無、使う言語にかかわらず誰にでもわかるように、最初から絵記号（ピクトグラム）を使って設計された駅の案内表示。","すでにある駅の階段の横に、車いすの利用者のための昇降機を後から取り付けること。","障害のある人を専用の施設に集め、地域の人々とは別の場所で生活させること。","一人暮らしの高齢者の家を、ホームヘルパーが定期的に訪問して家事を手伝うこと。"],"a":0,"e":"ユニバーサルデザインは、アメリカのロナルド・メイスが提唱した考え方で、特定の人のために障壁を後から取り除くのではなく、はじめからすべての人が使いやすいように製品や環境を設計するものである。既存の階段に昇降機を付けるのはバリアフリーの例である。障害のある人を施設に隔離することはノーマライゼーションの考え方に反する。ホームヘルパーの訪問は在宅福祉サービスである。"},{"t":"ex","s":"社会福祉の理念","imp":2,"q":"バリアフリーとユニバーサルデザインの違いを説明せよ。","a":"バリアフリーは、障害のある人や高齢者などにとって生活の妨げとなっている段差などの障壁を、後から取り除くという考え方である。これに対してユニバーサルデザインは、年齢や障害の有無、国籍などにかかわらず、はじめからすべての人が使いやすいように製品や施設、環境を設計するという考え方である。","e":"ポイント：①バリアフリーはすでにある障壁を取り除く（主に障害者や高齢者が対象） ②ユニバーサルデザインははじめからすべての人を想定して設計する ③どちらもノーマライゼーションの実現につながる"},{"t":"qa","s":"社会福祉の理念","imp":2,"q":"障害の有無などにかかわらず、すべての人を孤立や排除から守り、社会の一員として包み込み支え合うという考え方を何というか。","a":"インクルージョン","alt":["ソーシャル・インクルージョン","ソーシャルインクルージョン","社会的包摂"],"e":"社会的包摂ともいい、その反対の状態を社会的排除（ソーシャル・エクスクルージョン）という。教育の分野では、障害のある子どもとない子どもがともに学ぶインクルーシブ教育が進められている。"},{"t":"tf","s":"社会福祉の理念","imp":2,"q":"障害者総合支援法は、2012年に障害者自立支援法を改正・改称したもので、難病の患者も支援の対象に加えた。","a":true,"e":"正しい。2013年に施行され、障害のある人が地域で自立した生活を送るための福祉サービスなどを定めている。また障害者差別解消法（2013年制定）は障害を理由とする差別を禁止し、2024年4月からは民間事業者にも、障害のある人から求めがあった場合の合理的配慮の提供が義務づけられた。日本は2014年に障害者権利条約を批准した。"}]});</script>
<script>QDATA.push({"unit":"u22","questions":[{"t":"qa","s":"少子化の現状","imp":3,"q":"15〜49歳の女性の年齢別出生率を合計したもので、1人の女性が一生の間に産む子どもの数の平均にあたる数値を何というか。","a":"合計特殊出生率","e":"日本の合計特殊出生率は、第1次ベビーブームの1947年には4.5を超えていたが、1970年代半ばから人口を維持するのに必要な水準（約2.07）を下回り続けている。2005年に1.26まで低下し、いったん回復したものの、2024年には1.15、2025年には1.14と過去最低を更新した（2025年の値は2026年6月公表）。"},{"t":"qa","s":"少子化の現状","imp":3,"q":"1989年の合計特殊出生率が、丙午（ひのえうま）の年で出生が極端に少なかった1966年の1.58をも下回ったことが翌年に判明し、社会に衝撃を与えた出来事を何というか。","a":"1.57ショック","alt":["1．57ショック","一・五七ショック"],"e":"これをきっかけに、政府は少子化を社会問題として認識し、本格的な対策に乗り出した。1994年には最初の総合的な少子化対策としてエンゼルプランが策定された。"},{"t":"qa","s":"少子化の現状","imp":2,"q":"人口が増加も減少もしない均衡した状態となる合計特殊出生率の水準を何というか。","a":"人口置換水準","e":"日本では約2.07である。生まれた子どもの一部が親の世代の年齢になる前に亡くなることなどから、2よりやや高くなる。合計特殊出生率がこの水準を下回る状態が続くと、長期的に人口は減少する。日本の総人口は2008年ごろをピークに減少に転じた。"},{"t":"tf","s":"少子化の現状","imp":2,"q":"日本の年間の出生数は、2010年代後半に初めて100万人を下回ったが、その後は回復に転じ、2020年代には再び100万人を上回っている。","a":false,"e":"誤り。正しくは、出生数は2016年に初めて100万人を下回った後も減少を続け、2024年に約69万人と初めて70万人を下回り、2025年は約67万人で過去最少となった。1970年代前半の第2次ベビーブームのころには年間200万人を超えていた。"},{"t":"ex","s":"少子化の現状","imp":3,"q":"日本で少子化が進んだ主な原因を説明せよ。","a":"結婚する年齢が上がる晩婚化や、結婚しない人が増える未婚化が進み、出産する年齢も上がった（晩産化）。その背景には、若い世代の雇用や収入の不安定さ、子育てや教育にかかる費用の負担の重さ、長時間労働などによる仕事と子育ての両立の難しさ、保育サービスの不足などがある。","e":"ポイント：①未婚化・晩婚化・晩産化 ②若い世代の経済的な不安定さと、子育て・教育費の負担 ③仕事と子育ての両立の難しさ（長時間労働・保育サービスの不足）"},{"t":"mc","s":"高齢化の現状","imp":3,"q":"総人口に占める65歳以上人口の割合（高齢化率）による社会の呼び方と、日本がその基準を超えた年の組合せとして最も適当なものを一つ選べ。","c":["高齢化率が14%を超える高齢社会：1994年","高齢化率が7%を超える高齢化社会：1985年","高齢化率が21%を超える超高齢社会：1995年","高齢化率が14%を超える高齢社会：2007年"],"a":0,"e":"日本は1970年に高齢化率が7%を超えて高齢化社会に、1994年に14%を超えて高齢社会に、2007年に21%を超えて超高齢社会になった。高齢化率が7%から14%になるまでの期間はわずか24年で、欧米諸国に比べて非常に速かった。"},{"t":"tf","s":"高齢化の現状","imp":3,"q":"日本の高齢化率（総人口に占める65歳以上人口の割合）は、2020年代にはおよそ3割に達しており、世界でも最も高い水準にある。","a":true,"e":"正しい。2024年10月時点で29.3%である。将来推計では、2070年には約4割（38.7%）に達すると見込まれている。高齢者1人を支える現役世代（15〜64歳）の人数は、1960年代には約10人だったが、近年は約2人にまで減っている。"},{"t":"qa","s":"高齢化の現状","imp":3,"q":"1947〜49年生まれの「団塊の世代」がすべて75歳以上の後期高齢者となり、医療や介護の需要が急増して、社会保障の費用や担い手の不足が深刻になると懸念された問題を何というか。","a":"2025年問題","alt":["2025年"],"e":"さらに、団塊ジュニア世代（1971〜74年生まれ）が65歳以上となり、高齢者人口がピークに近づく一方で現役世代が急減する2040年ごろの問題（2040年問題）も指摘されている。"},{"t":"qa","s":"高齢化の現状","imp":2,"q":"15〜64歳の、生産活動の中心となる年齢層の人口を何というか。","a":"生産年齢人口","e":"日本の生産年齢人口は1990年代半ばをピークに減少が続いている。社会保障を支える現役世代や労働力が減るため、女性や高齢者、外国人の就労の促進や、生産性の向上が課題となっている。"},{"t":"mc","s":"少子化対策","imp":2,"q":"日本の少子化対策の歩みについての記述として最も適当なものを一つ選べ。","c":["いわゆる1.57ショックを受けて、1994年に子育て支援の基本的方向を示すエンゼルプランが策定された。","少子化社会対策基本法は、1960年代の高度経済成長期に制定された。","2019年に、0〜5歳のすべての子どもの保育所や幼稚園などの利用料が、世帯の所得にかかわらず無償化された。","こども家庭庁は、2023年に厚生労働省の内部部局として設置された。"],"a":0,"e":"エンゼルプランの後、1999年に新エンゼルプランが策定され、2003年には少子化社会対策基本法が制定された。2019年10月からの幼児教育・保育の無償化は、3〜5歳児は原則として全員、0〜2歳児は住民税非課税世帯が対象である。こども家庭庁は2023年4月、内閣府の外局として発足した。"},{"t":"qa","s":"少子化対策","imp":2,"q":"2022年に制定されて2023年4月に施行され、子どもの権利条約の精神にのっとって、すべての子どもが将来にわたって幸福な生活を送ることができる社会の実現を目指し、子ども施策の基本理念を定めた法律を何というか。","a":"こども基本法","alt":["子ども基本法"],"e":"子どもの意見の尊重や最善の利益の優先などを基本理念とする。同じ2023年4月には、子ども政策の司令塔としてこども家庭庁が発足した。"},{"t":"tf","s":"少子化対策","imp":2,"q":"2024年10月から児童手当が拡充され、所得制限が撤廃されるとともに、支給対象が中学生までから大学生の年代までに延長された。","a":false,"e":"誤り。正しくは、支給対象は高校生の年代（18歳になった後の最初の3月31日まで）までに延長された。あわせて所得制限が撤廃され、第3子以降の支給額は月3万円に増額された。2024年の法改正では、こうした子育て支援の財源の一部として、2026年度から医療保険料とあわせて子ども・子育て支援金を集めることも定められた。"},{"t":"qa","s":"少子化対策","imp":2,"q":"保育所などへの入所を申し込んでいるにもかかわらず、定員の不足などのために入所できずに待っている子どもを何というか。","a":"待機児童","e":"都市部を中心に深刻化し、2017年には約2.6万人に達したが、保育所の整備などにより近年は大きく減少した。一方で、保育士の不足や、小学生が放課後に過ごす放課後児童クラブ（学童保育）に入れない問題なども課題となっている。"},{"t":"qa","s":"高齢者福祉","imp":1,"q":"1989年に策定された高齢者保健福祉推進十か年戦略の通称で、ホームヘルパーや特別養護老人ホームなどの整備目標を定めたものを何というか。","a":"ゴールドプラン","alt":["高齢者保健福祉推進十か年戦略"],"e":"1994年には目標を引き上げた新ゴールドプラン、1999年にはゴールドプラン21が策定され、2000年に始まった介護保険制度の基盤づくりとなった。"},{"t":"qa","s":"高齢者福祉","imp":2,"q":"高齢者が介護が必要な状態になっても、住み慣れた地域で自分らしい暮らしを続けられるよう、住まい・医療・介護・予防・生活支援を一体的に提供する体制を何というか。","a":"地域包括ケアシステム","alt":["地域包括ケア"],"e":"団塊の世代が75歳以上となる2025年をめどに構築が進められてきた。市町村に置かれる地域包括支援センターが、高齢者の総合相談や介護予防の拠点となっている。"},{"t":"tf","s":"高齢者福祉","imp":1,"q":"高齢の配偶者や親を高齢の家族が介護する「老老介護」が増えており、また家族の介護のために仕事を辞める「介護離職」も年間約10万人にのぼっている。","a":true,"e":"正しい。介護離職を防ぐため、介護休業（対象家族1人につき通算93日まで、3回まで分割可）や介護休暇などの制度が設けられている。また、18歳未満の子どもが家族の介護や世話を日常的に担うヤングケアラーも問題となっている。"},{"t":"mc","s":"社会保障の費用と負担","imp":3,"q":"日本の社会保障給付費についての記述として最も適当なものを一つ選べ。","c":["部門別にみると年金が最も多く、次いで医療が多い。","部門別にみると医療が最も多く、年金は最も少ない。","総額は2000年代以降減少を続けており、2020年代には50兆円を下回っている。","すべて国の一般会計の歳出によってまかなわれており、社会保険料は財源に含まれない。"],"a":0,"e":"社会保障給付費は高齢化とともに増え続け、2020年代には年間130兆円を超えている。部門別では年金が約4割、医療が3割台、介護や子育て支援などの福祉その他が2割台を占める。財源は社会保険料が最も多く、残りの多くを国や地方の公費が占める。なお国の一般会計予算に占める社会保障関係費は約3分の1で、歳出の中で最大の項目である。"},{"t":"ex","s":"社会保障の費用と負担","imp":3,"q":"社会保障と税の一体改革とは何か、説明せよ。","a":"社会保障の充実・安定化と、そのための安定した財源の確保、財政の健全化を同時に目指す改革である。2012年に関連法が成立し、消費税率を2014年に8%、2019年に10%へと段階的に引き上げ、その増収分を年金・医療・介護・子育て支援の社会保障4経費にあてることとされた。","e":"ポイント：①社会保障の充実・安定化と財政健全化の同時達成 ②消費税率の段階的な引上げ（5%→8%→10%） ③増収分を社会保障4経費（年金・医療・介護・子育て支援）にあてる"},{"t":"ex","s":"社会保障の費用と負担","imp":2,"q":"社会保障における「高福祉高負担」と「低福祉低負担」の考え方の違いを、代表的な国をあげて説明せよ。","a":"高福祉高負担は、税や社会保険料の負担は重いが、医療・教育・介護などの公的サービスや所得保障が手厚いという考え方で、スウェーデンなどの北欧諸国が代表例である。低福祉低負担は、負担を軽くする代わりに公的な給付を限定し、民間保険や自助努力を重視する考え方で、アメリカが代表例である。日本はその中間に位置するが、給付に見合う負担を確保できず、不足分を国債に頼っている。","e":"ポイント：①高福祉高負担は北欧型（重い負担で手厚い給付） ②低福祉低負担はアメリカ型（自助・民間保険の重視） ③日本は中間的で、給付と負担の差を国債で補っている（財政赤字）"},{"t":"ex","s":"社会保障の費用と負担","imp":2,"q":"社会保障における世代間格差とは何か、公的年金を例に説明せよ。","a":"世代間格差とは、生まれた世代によって、生涯に負担する保険料や税と、受け取る給付との関係に差が生じることである。賦課方式を基本とする公的年金では、少子高齢化で支え手の現役世代が減り受け手の高齢者が増えるため、若い世代ほど負担に比べて受け取る給付が少なくなりやすい。このため、高齢者にも負担能力に応じた負担を求めるなど、世代間の公平を図ることが課題となっている。","e":"ポイント：①世代によって負担と給付の関係が異なる ②賦課方式と少子高齢化により若い世代ほど不利になりやすい ③能力に応じた負担など世代間の公平の確保が課題"},{"t":"ex","s":"社会保障の費用と負担","imp":1,"q":"近年進められている全世代型社会保障とはどのような考え方か、説明せよ。","a":"給付は高齢者中心、負担は現役世代中心となっていた社会保障を見直し、子育て世代や現役世代を含むすべての世代を支える制度にするとともに、年齢ではなく負担能力に応じて、すべての世代が公平に支え合う仕組みを目指す考え方である。子育て支援の拡充や、一定以上の所得がある75歳以上の人の医療費の窓口負担の2割への引上げなどが進められている。","e":"ポイント：①高齢者中心の給付と現役世代中心の負担の見直し ②すべての世代を支え、すべての世代で支える ③年齢ではなく負担能力に応じた負担（例：75歳以上の一定所得者の2割負担、子育て支援の拡充）"},{"t":"qa","s":"貧困と格差","imp":3,"q":"世帯の可処分所得を世帯人数で調整した値（等価可処分所得）を低い順に並べたとき、その中央値の半分（貧困線）に満たない人の割合を何というか。","a":"相対的貧困率","e":"その社会の標準的な生活水準と比べた貧困を示す指標である。日本の相対的貧困率は2021年に15.4%で、先進国の中では高い水準にある。所得が貧困線を下回ると、必要な教育や社会参加の機会を十分に得られないおそれがある。"},{"t":"tf","s":"貧困と格差","imp":2,"q":"日本では、ひとり親世帯など大人が1人の子育て世帯の相対的貧困率が4割を超えており、子どもの貧困が問題となっている。","a":true,"e":"正しい。2021年の子どもの貧困率は11.5%で、大人が1人の世帯（多くは母子世帯）の貧困率は44.5%にのぼる。2013年に子どもの貧困対策推進法が制定され、教育や生活の支援などが進められている。"},{"t":"tf","s":"貧困と格差","imp":2,"q":"相対的貧困とは、食料や住まいなど生きるために最低限必要なものさえ手に入らない状態のことをいい、日本のような先進国にはほとんど存在しない。","a":false,"e":"誤り。正しくは、生きるために最低限必要なものさえ得られない状態は絶対的貧困である。相対的貧困は、その社会の標準的な生活水準と比べて著しく低い所得で暮らす状態をいい、日本でも人口の約15%が相対的貧困の状態にある（2021年）。"},{"t":"qa","s":"貧困と格差","imp":3,"q":"所得の不平等の度合いを0から1までの数値で表し、0に近いほど平等で、1に近いほど不平等であることを示す指標を何というか。","a":"ジニ係数","e":"ローレンツ曲線と、完全に平等な状態を示す均等分布線（45度線）とで囲まれた部分の面積を2倍した値にあたる。日本の当初所得のジニ係数は0.5を超えるが、税や社会保障による所得の再分配の後は0.3台まで低下する。"},{"t":"mc","s":"貧困と格差","imp":2,"q":"ローレンツ曲線についての記述として最も適当なものを一つ選べ。","c":["世帯を所得の低い順に並べ、横軸に世帯数の累積比率、縦軸に所得の累積比率をとって描いた曲線で、均等分布線から離れるほど所得の分配は不平等である。","ローレンツ曲線が均等分布線（45度線）に近づくほど、ジニ係数は1に近づく。","すべての世帯の所得が等しい場合、ローレンツ曲線は横軸と重なる。","所得の再分配政策が強化されると、ローレンツ曲線は均等分布線から遠ざかる。"],"a":0,"e":"すべての世帯の所得が等しければ、ローレンツ曲線は均等分布線（45度線）と一致し、ジニ係数は0となる。不平等が大きいほど曲線は均等分布線から遠ざかって下にふくらみ、ジニ係数は1に近づく。累進課税や社会保障による所得の再分配が強まれば、曲線は均等分布線に近づく。"},{"t":"qa","s":"貧困と格差","imp":2,"q":"病気や失業などで生活が苦しくなったときに、人々が最低限度の生活を下回らないように支える、社会の安全網を何というか。","a":"セーフティネット","alt":["セーフティーネット","セーフティ・ネット"],"e":"サーカスの綱渡りの下に張る網にたとえた言葉である。雇用保険などの社会保険を第1、求職者支援制度や生活困窮者自立支援制度を第2、生活保護を第3のセーフティネットとする考え方があり、生活保護は「最後のセーフティネット」と呼ばれる。"},{"t":"qa","s":"貧困と格差","imp":2,"q":"2013年に制定され、生活保護に至る前の段階で、生活に困窮している人に自立のための相談支援や住居確保給付金の支給などを行うことを定めた法律を何というか。","a":"生活困窮者自立支援法","e":"2015年4月に施行された。福祉事務所を設置する自治体が、自立相談支援や住居確保給付金の支給のほか、就労準備支援、家計改善支援、子どもの学習・生活支援などを行う。いわゆる第2のセーフティネットの一つである。"},{"t":"ex","s":"貧困と格差","imp":2,"q":"ベーシック・インカムとはどのような構想か、その利点と課題を含めて説明せよ。","a":"ベーシック・インカムは、政府が所得や資産、就労の有無にかかわらず、すべての個人に生活に必要な最低限の現金を定期的に給付する構想である。資力調査が不要になって制度が簡素になり、受給をためらう心理的な抵抗や、支援が必要な人の取りこぼしを減らせる利点がある。一方で、巨額の財源が必要になることや、働く意欲を弱めるおそれがあることが課題とされる。","e":"ポイント：①全員に無条件で一定額を定期的に給付する ②制度の簡素化、資力調査が不要、受給への抵抗感や取りこぼしの解消 ③巨額の財源と労働意欲への影響が課題"}]});</script>
<script>QDATA.push({"unit":"u23","questions":[{"t":"qa","s":"国際分業","imp":3,"q":"先進国と発展途上国の間で、工業製品と原材料・農産物などの一次産品を交換する国際分業を何というか。","a":"垂直的分業","alt":["垂直分業"],"e":"対になるのは水平的分業である。植民地時代の宗主国と植民地の関係に由来し、途上国が一次産品の輸出に依存するモノカルチャー経済や南北問題の背景となった。"},{"t":"qa","s":"国際分業","imp":3,"q":"先進国どうしが、自動車や電気機械などの工業製品を互いに輸出入し合う国際分業を何というか。","a":"水平的分業","alt":["水平分業"],"e":"工業製品どうしの交換が水平的分業、工業製品と一次産品の交換が垂直的分業である。近年は同じ産業の中で部品や工程ごとに国を分けて生産する工程間分業（産業内分業）も広がっている。"},{"t":"tf","s":"国際分業","imp":2,"q":"日本が中東の産油国から原油を輸入し、自動車を輸出する関係は、水平的分業の典型例である。","a":false,"e":"誤り。工業製品（自動車）と一次産品（原油）の交換なので、正しくは垂直的分業の典型例である。水平的分業は、日本とドイツが自動車を互いに輸出し合うような工業製品どうしの交換をいう。"},{"t":"qa","s":"比較生産費説","imp":3,"q":"各国が自国内で相対的に有利に生産できる財の生産に特化し、貿易で交換すれば両国とも利益を得られるとする比較生産費説を唱えた、19世紀イギリスの経済学者は誰か。","a":"リカード","alt":["デヴィッド・リカード","デビッド・リカード","D.リカード"],"e":"イギリスの毛織物（ラシャ）とポルトガルのぶどう酒の例で説明した。自由貿易の理論的根拠となり、保護貿易を説いたドイツのリストと対比される。"},{"t":"qa","s":"比較生産費説","imp":1,"q":"リカードが比較生産費説を展開した、1817年刊行の主著は何か。","a":"経済学および課税の原理","alt":["『経済学および課税の原理』","経済学及び課税の原理"],"e":"リカードはこの著書で比較生産費説のほか、差額地代論なども論じた。アダム・スミスの『国富論（諸国民の富）』、リストの『政治経済学の国民的体系』と区別すること。"},{"t":"qa","s":"比較生産費説","imp":1,"q":"重商主義を批判して自由な経済活動を説き、各国が他国より少ない費用で生産できる財を生産して交換する分業の利益（絶対優位にもとづく分業）を示した、『国富論（諸国民の富）』の著者は誰か。","a":"アダム・スミス","alt":["スミス","A.スミス"],"e":"スミスの議論は、各国が他国より絶対的に安く作れる財（絶対優位のある財）を前提にしていた。リカードはこれを発展させ、絶対優位がなくても比較優位にもとづいて分業すれば利益が生まれることを示した。"},{"t":"qa","s":"比較生産費説","imp":2,"q":"ある財の生産費が、自国内の他の財の生産費との比率でみて、他国よりも相対的に低いことを何というか。","a":"比較優位","e":"他国より少ない労働で生産できることは絶対優位という。比較優位はどの国にも必ず何かの財についてあるので、すべての国が特化と貿易の利益を得られる、というのが比較生産費説の考え方である。"},{"t":"ex","s":"比較生産費説","imp":3,"q":"比較生産費説の考え方を説明せよ。","a":"各国が、他国と比べて相対的に生産費が低い財、つまり比較優位をもつ財の生産に特化し、互いに貿易で交換すれば、限られた労働で世界全体の生産量が増え、両国とも利益を得られるという考え方である。両方の財で生産性が劣る国にも比較優位のある財はあるため、自由貿易を支持する根拠とされた。","e":"ポイント：①リカードが唱えた ②比較優位をもつ財に特化する ③貿易で交換すれば全体の生産量が増え双方が利益を得る ④絶対優位がなくても分業の利益がある（自由貿易の根拠）"},{"t":"mc","s":"比較生産費説","imp":3,"q":"A国では工業製品1単位の生産に2人、農産物1単位の生産に4人の労働が必要で、B国では工業製品1単位に6人、農産物1単位に5人が必要である。労働者は両財の生産の間を自由に移動できるとする。比較生産費説にもとづく記述として最も適当なものを一つ選べ。","c":["A国は工業製品に、B国は農産物に特化して貿易すれば、両国全体の生産量が増える","A国は農産物に、B国は工業製品に特化して貿易すれば、両国全体の生産量が増える","A国はどちらの財も少ない労働で生産できるので、B国と貿易をしても利益はない","B国はどちらの財の生産にも多くの労働が必要なので、両方の財を自国で生産し続けるべきである"],"a":0,"e":"工業製品1単位を作るのにあきらめる農産物は、A国では2÷4＝0.5単位分、B国では6÷5＝1.2単位分なので、A国が工業製品に比較優位をもつ。農産物1単位ではA国が工業製品2単位分、B国が5÷6≒0.83単位分なので、B国が農産物に比較優位をもつ。A国は両財で絶対優位をもつが、それでも比較優位のある財に特化すれば利益が生じるので「貿易をしても利益はない」「両方を自国で生産し続けるべき」は誤り。特化の組み合わせを逆にすると全体の生産量はかえって減る。"},{"t":"mc","s":"比較生産費説","imp":3,"q":"毛織物1単位の生産にイギリスでは100人、ポルトガルでは90人、ぶどう酒1単位の生産にイギリスでは120人、ポルトガルでは80人の労働が必要である。両国はもともと各財を1単位ずつ生産していた。両国が比較優位をもつ財の生産に全労働者を投入して特化したとき、両国全体の生産量の変化として正しいものを一つ選べ。","c":["毛織物が0.2単位、ぶどう酒が0.125単位増える","毛織物が0.125単位、ぶどう酒が0.2単位増える","毛織物が2.2単位、ぶどう酒が2.125単位増える","毛織物もぶどう酒も生産量は変わらない"],"a":0,"e":"労働者数はイギリスが100＋120＝220人、ポルトガルが90＋80＝170人。毛織物1単位のためにあきらめるぶどう酒は、イギリスが100÷120≒0.83単位、ポルトガルが90÷80≒1.13単位なので、イギリスは毛織物、ポルトガルはぶどう酒に比較優位をもつ。特化後はイギリスが220÷100＝2.2単位の毛織物、ポルトガルが170÷80＝2.125単位のぶどう酒を生産する。特化前は両財とも2単位だったので、増加分は毛織物0.2単位、ぶどう酒0.125単位。「2.2単位、2.125単位増える」は特化後の生産量そのものを増加分と取り違えている。"},{"t":"mc","s":"比較生産費説","imp":3,"q":"A国では自動車1単位の生産に10人、小麦1単位の生産に20人が必要で、B国では自動車1単位に30人、小麦1単位に20人が必要である。両国はもともと各財を1単位ずつ生産していた。比較生産費説にもとづいて両国が特化したときの記述として最も適当なものを一つ選べ。","c":["A国が自動車に、B国が小麦に特化し、両国全体で自動車は1単位、小麦は0.5単位増える","A国が小麦に、B国が自動車に特化し、両国全体で自動車は1単位、小麦は0.5単位増える","A国が自動車に、B国が小麦に特化するが、両国全体では小麦だけが増え、自動車の量は変わらない","B国は両財とも多くの労働を必要とするので、A国が両財を生産し、B国は生産をやめたほうが両国全体の生産量は増える"],"a":0,"e":"自動車1単位のためにあきらめる小麦は、A国が10÷20＝0.5単位、B国が30÷20＝1.5単位なので、A国が自動車に比較優位をもち、B国は小麦に比較優位をもつ。労働者はA国30人、B国50人なので、特化後はA国が自動車30÷10＝3単位、B国が小麦50÷20＝2.5単位を生産し、特化前（各2単位）より自動車1単位、小麦0.5単位増える。組み合わせを逆にすると両財とも減る。B国が生産をやめればB国の労働が使われず、全体の生産量は増えない。"},{"t":"mc","s":"比較生産費説","imp":2,"q":"労働者1人が1日に生産できる量は、C国では小麦8トンまたは自動車4台、D国では小麦4トンまたは自動車1台である。比較生産費説にもとづく特化の組み合わせとして最も適当なものを一つ選べ。","c":["C国が自動車に、D国が小麦に特化する","C国が小麦に、D国が自動車に特化する","C国はどちらの財でも生産性が高いので、特化しても貿易の利益は生じない","D国は自動車より小麦を多く生産できるので、両国とも小麦に特化する"],"a":0,"e":"この問題は「1単位に必要な人数」ではなく「1人が作れる量」で示されている点に注意する。自動車1台のためにあきらめる小麦は、C国が8÷4＝2トン、D国が4÷1＝4トンなので、C国が自動車に比較優位をもつ。小麦1トンのためにあきらめる自動車はC国0.5台、D国0.25台なので、D国が小麦に比較優位をもつ。C国は両財で絶対優位をもつが、それでも特化による利益は生じる。両国が同じ財に特化すれば、もう一方の財が生産されなくなる。"},{"t":"tf","s":"比較生産費説","imp":3,"q":"比較生産費説によれば、両方の財の生産で他国より生産性が劣っている国は、貿易によって利益を得ることはできない。","a":false,"e":"誤り。両方の財で絶対劣位にある国でも、劣り方が相対的に小さい財（比較優位のある財）に特化すれば、貿易を通じて利益を得られる。正しくは「両財で劣っていても、比較優位のある財に特化すれば利益を得られる」。これが比較生産費説の核心である。"},{"t":"tf","s":"比較生産費説","imp":2,"q":"比較生産費説は、各国が比較優位をもつ財の生産に特化して自由に貿易を行うことで利益が生じると説くので、自由貿易を支持する理論的根拠とされる。","a":true,"e":"正しい。ただしこの理論は、労働者が産業の間を自由に移動できることなどを前提にしている。現実には、特化によって縮小する産業で失業が生じるなどの調整の問題がある。"},{"t":"qa","s":"保護貿易論","imp":3,"q":"19世紀前半のドイツで、工業化の遅れた国が自国の産業を育てるには保護関税による保護貿易が必要だと主張した経済学者は誰か。","a":"リスト","alt":["フリードリッヒ・リスト","フリードリヒ・リスト","F.リスト"],"e":"主著『政治経済学の国民的体系』（1841年）。経済発展段階説にもとづき、先進工業国イギリスに対抗するため、ドイツの幼稚産業を一時的に保護すべきだと説いた。自由貿易を説いたリカードと対比して覚える。"},{"t":"qa","s":"保護貿易論","imp":3,"q":"現在は国際競争力が弱いが、保護・育成すれば将来は成長が見込まれる産業を何というか。","a":"幼稚産業","e":"リストは、幼稚産業が国際競争力をつけるまでの間、保護関税で一時的に守るべきだと主張した。保護はあくまで一時的なものという点が重要である。"},{"t":"ex","s":"保護貿易論","imp":2,"q":"リストが保護貿易を主張した理由を、当時のイギリスとドイツの状況にふれて説明せよ。","a":"産業革命をいち早く達成したイギリスと、工業化が遅れていたドイツとが自由貿易を行えば、ドイツの未熟な工業はイギリス製品との競争に敗れて成長できない。そこでリストは、経済の発展段階に応じて、幼稚産業が国際競争力をつけるまでの間は保護関税で一時的に保護すべきだと主張した。","e":"ポイント：①先進国イギリスと後発国ドイツの発展段階の違い ②自由貿易のもとでは幼稚産業が育たない ③保護関税による一時的な保護 ④経済発展段階説"},{"t":"tf","s":"保護貿易論","imp":2,"q":"リストは、保護貿易は国内産業を守るための恒久的な政策であり、産業が十分に成長した後も続けるべきだと主張した。","a":false,"e":"誤り。リストが主張したのは、幼稚産業が国際競争力をつけるまでの一時的な保護である。正しくは「産業が成長するまでの一時的な保護」であり、発展した後は自由貿易に移るべきだと考えた。"},{"t":"qa","s":"関税と非関税障壁","imp":1,"q":"輸入品に課される関税のうち、国内産業を外国製品との競争から守ることを主な目的とするものを何というか。","a":"保護関税","e":"関税には、国の収入を得ることを目的とする財政関税と、国内産業の保護を目的とする保護関税がある。関税で輸入品の国内価格が上がれば国内産業は守られるが、消費者は高い価格を負担することになる。"},{"t":"qa","s":"関税と非関税障壁","imp":3,"q":"輸入数量制限（輸入割当）や、輸入品に対する複雑な検査・認証の手続きなど、関税以外の方法で輸入を妨げるものを何というか。","a":"非関税障壁","e":"GATT・WTOは、関税の引き下げとともに非関税障壁の撤廃をめざしてきた。GATTの東京ラウンドでは非関税障壁の軽減が主要なテーマとなった。"},{"t":"mc","s":"関税と非関税障壁","imp":2,"q":"次の措置のうち、非関税障壁にあたるものとして最も適当なものを一つ選べ。","c":["輸入品にだけ特別に厳しい安全検査を課し、通関に長い時間がかかるようにする","輸入品の価格に一定の割合をかけた額の税を、税関で徴収する","国内の生産者と外国の生産者に、同じ基準の品質表示を義務づける","輸入品に対して、国内品と同じ税率の消費税を課す"],"a":0,"e":"輸入品にだけ厳しい検査を課して輸入を難しくするのは、関税以外の方法による輸入制限であり非関税障壁にあたる。輸入品の価格の一定割合を徴収するのは関税そのもの。国内品と輸入品に同じ基準の表示や同じ税率の消費税を求めることは、輸入品を国内品と同等に扱う内国民待遇にかなう措置で、輸入を差別的に妨げるものではない。"},{"t":"tf","s":"関税と非関税障壁","imp":1,"q":"1980年代の日米貿易摩擦の中で日本は自動車の対米輸出自主規制を行ったが、このような輸出自主規制は、関税によらない貿易制限の一種である。","a":true,"e":"正しい。輸出自主規制は、輸入国の圧力を受けて輸出国が自ら輸出量を抑える措置で、関税によらない貿易制限（灰色措置）として問題視された。ウルグアイ・ラウンドの結果成立したWTOのセーフガード協定で原則として禁止された。"}]});</script>
<script>QDATA.push({"unit":"u23","questions":[{"t":"qa","s":"国際収支の構成","imp":2,"q":"一国が一定期間に外国との間で行った財・サービス・所得・資産などの取引による受け取りと支払いを、体系的に記録したものを何というか。","a":"国際収支","alt":["国際収支表","国際収支統計"],"e":"日本では財務省と日本銀行が作成する。2014年からIMFの新しい基準にもとづく形式となり、経常収支・資本移転等収支・金融収支・誤差脱漏で構成される。"},{"t":"qa","s":"国際収支の構成","imp":3,"q":"国際収支のうち、貿易・サービス収支、第一次所得収支、第二次所得収支の合計を何というか。","a":"経常収支","e":"経常収支は、モノ・サービスの取引と所得のやりとりをまとめた、国際収支の中心となる項目である。日本は長く経常黒字を続けている。"},{"t":"qa","s":"国際収支の構成","imp":3,"q":"経常収支のうち、海外への投資から得られる利子や配当金、雇用者報酬などの受け取りと支払いを示す項目を何というか。","a":"第一次所得収支","e":"2014年より前は「所得収支」と呼ばれていた。日本は巨額の対外資産をもつため第一次所得収支が大幅な黒字で、経常黒字の中心となっている。"},{"t":"qa","s":"国際収支の構成","imp":3,"q":"経常収支のうち、食料・医薬品などの無償援助や国際機関への拠出金、外国人労働者の本国への送金など、対価を伴わない資産の提供を示す項目を何というか。","a":"第二次所得収支","e":"2014年より前は「経常移転収支」と呼ばれていた。日本は援助や拠出金、送金などの支払いが受け取りを上回るため、赤字が続いている。"},{"t":"qa","s":"国際収支の構成","imp":3,"q":"国際収支のうち、対価を伴わない固定資産の提供（道路・橋などの社会資本を整備するための無償資金援助など）や債務免除などを示す項目を何というか。","a":"資本移転等収支","e":"同じ無償援助でも、食料・医薬品など消費されるものは第二次所得収支、社会資本の整備にあてられるものは資本移転等収支に入る点がひっかけになる。商標権などの売買（非生産・非金融資産の取得処分）もここに計上される。"},{"t":"qa","s":"国際収支の構成","imp":3,"q":"国際収支のうち、直接投資・証券投資・金融派生商品・その他投資・外貨準備からなり、対外金融資産・負債の増減を示す項目を何というか。","a":"金融収支","e":"2014年からの形式では、対外資産が増えるとプラス、対外負債が増えるとマイナスで表す。日本企業の海外工場の建設や日本の投資家による外国株式の購入はプラス要因になる。"},{"t":"qa","s":"国際収支の構成","imp":2,"q":"政府・中央銀行（通貨当局）が保有し、為替介入などに使われる外貨建ての対外資産を何というか。","a":"外貨準備","e":"金融収支の項目の一つである。円高を抑える円売り・ドル買い介入をすると外貨準備は増え、円安を抑える円買い・ドル売り介入では外貨準備を取り崩す。日本の外貨準備は中国に次ぐ世界有数の規模である。"},{"t":"qa","s":"国際収支の構成","imp":2,"q":"2014年からの国際収支統計で成り立つ関係を示す次の式の（　）に入る語を答えよ。経常収支＋資本移転等収支－（　）＋誤差脱漏＝0","a":"金融収支","e":"経常黒字の国は、その分だけ対外資産を積み増す（金融収支がプラスになる）関係にある。経常収支や資本移転等収支はプラスで、金融収支だけマイナスで式に入る点を確認しておく。"},{"t":"qa","s":"国際収支の構成","imp":1,"q":"国際収支統計で、統計上の誤差や計上漏れによって生じる不一致を調整するための項目を何というか。","a":"誤差脱漏","e":"国際収支は多くの統計を組み合わせて作るため、恒等式がぴったり成り立つように誤差脱漏で調整する。"},{"t":"ex","s":"国際収支の構成","imp":2,"q":"直接投資と証券投資の違いを説明せよ。","a":"直接投資は、海外での工場建設や外国企業の買収など、経営に参加し支配することを目的とした投資である。これに対し証券投資は、経営への参加を目的とせず、利子・配当や値上がり益を得るために外国の株式や債券を購入する投資である。どちらも国際収支では金融収支に計上される。","e":"ポイント：①直接投資は経営参加・支配が目的（工場建設・企業買収） ②証券投資は利子・配当・売却益が目的 ③どちらも金融収支に計上 ④投資から得た利子・配当は第一次所得収支に計上"},{"t":"tf","s":"国際収支の構成","imp":3,"q":"2014年から用いられている国際収支の形式では、日本企業が海外に工場を建設するなどして対外資産が増えると、金融収支はマイナスとして計上される。","a":false,"e":"誤り。正しくは「プラス」として計上される。現在の形式では対外資産の増加をプラスで表す。2014年より前の形式（投資収支）では資本の流出をマイナスで表していたため、符号の考え方が逆になった点に注意する。"},{"t":"tf","s":"国際収支の構成","imp":1,"q":"経常収支が大幅な黒字の国では、国際収支の恒等式から、金融収支もおおむね同じ程度のプラス（対外資産の増加）になる。","a":true,"e":"正しい。経常収支＋資本移転等収支－金融収支＋誤差脱漏＝0 なので、資本移転等収支と誤差脱漏が小さければ、経常黒字とほぼ同じ額だけ対外資産が増える。日本は経常黒字を続けた結果、巨額の対外純資産をもつようになった。"},{"t":"mc","s":"国際収支の判別","imp":3,"q":"次の取引のうち、日本の第一次所得収支の受け取りとして計上されるものとして最も適当なものを一つ選べ。","c":["日本の生命保険会社が、保有するアメリカ国債の利子を受け取った","外国人旅行者が、日本のホテルに宿泊費を支払った","日本で働く外国人労働者が、本国の家族に送金した","日本の企業が、外国の企業に特許の使用料を支払った"],"a":0,"e":"外国の国債の利子は、対外金融資産から生じる収益なので第一次所得収支の受け取りである。外国人旅行者の宿泊費はサービス収支（旅行）の受け取り、外国人労働者の本国への送金は対価を伴わない移転なので第二次所得収支の支払い、特許の使用料はサービス収支（知的財産権等使用料）の支払いである。"},{"t":"mc","s":"国際収支の判別","imp":3,"q":"次の取引のうち、日本の第二次所得収支に計上されるものとして最も適当なものを一つ選べ。","c":["日本政府が、国連の機関に拠出金を支払った","日本の企業が、ベトナムに現地法人を設立して工場を建てた","日本政府が、途上国に対する貸付金の返済を免除した","日本の企業が、外国の船会社に貨物の輸送料を支払った"],"a":0,"e":"国際機関への拠出金は対価を伴わない資金の提供なので第二次所得収支（支払い）に計上される。現地法人の設立・工場建設は直接投資で金融収支、債務免除は資本移転等収支、貨物の輸送料はサービス収支（輸送）である。"},{"t":"mc","s":"国際収支の判別","imp":3,"q":"次の取引のうち、日本の金融収支に計上されるものとして最も適当なものを一つ選べ。","c":["日本の個人投資家が、アメリカの企業の株式を購入した","日本の企業が、海外子会社から配当金を受け取った","日本の自動車メーカーが、自動車をアメリカに輸出した","日本の映画会社が、海外での上映権の使用料を受け取った"],"a":0,"e":"外国企業の株式の購入は対外金融資産の取得なので金融収支（証券投資）に計上される。配当金の受け取りは投資から生じた収益なので第一次所得収支、自動車の輸出は貿易収支、上映権の使用料はサービス収支（知的財産権等使用料）である。投資そのものは金融収支、投資の収益は第一次所得収支と区別する。"},{"t":"mc","s":"国際収支の判別","imp":2,"q":"次の取引のうち、日本の資本移転等収支に計上されるものとして最も適当なものを一つ選べ。","c":["日本政府が、途上国の道路や橋の建設のために無償で資金を供与した","日本政府が、地震の被災国に食料や医薬品を無償で送った","日本の銀行が、途上国の政府に資金を貸し付けた","日本の企業が、外国の通信会社にデータ通信の料金を支払った"],"a":0,"e":"道路や橋などの社会資本の建設にあてる無償資金援助は、固定資産の形成にかかわる資本移転なので資本移転等収支に計上される。食料・医薬品の無償援助は第二次所得収支、資金の貸し付けは返済を伴う取引なので金融収支（その他投資）、データ通信の料金はサービス収支である。同じ無償援助でも使い道で項目が変わる点がひっかけになる。"},{"t":"mc","s":"国際収支の判別","imp":2,"q":"次の取引のうち、日本のサービス収支の受け取り（黒字要因）となるものとして最も適当なものを一つ選べ。","c":["外国人観光客が、日本の旅館に宿泊して料金を支払った","日本人旅行者が、ハワイのホテルに宿泊して料金を支払った","日本の企業が、中国の工場で生産した部品を日本に輸入した","日本人が、保有する外国企業の株式から配当金を受け取った"],"a":0,"e":"外国人観光客が日本で支払う宿泊料は、日本が外国人にサービスを提供した対価なので、サービス収支（旅行）の受け取りとなる。日本人の海外での宿泊料はサービス収支の支払い、部品の輸入は貿易収支の支払い、配当金の受け取りは第一次所得収支である。"},{"t":"mc","s":"国際収支の判別","imp":2,"q":"次の取引のうち、日本の貿易収支に計上されるものとして最も適当なものを一つ選べ。","c":["日本の電力会社が、オーストラリアから液化天然ガス（LNG）を輸入した","日本の利用者が、外国企業の動画配信サービスの利用料を支払った","日本の航空会社が、外国人の旅客から航空運賃を受け取った","日本の商社が、外国の鉱山会社の株式の過半数を取得した"],"a":0,"e":"LNGというモノの輸入なので貿易収支（支払い）に計上される。動画配信サービスの利用料や航空運賃はサービス収支、外国企業の株式の過半数の取得は経営支配を目的とする直接投資なので金融収支である。"},{"t":"tf","s":"国際収支の判別","imp":2,"q":"日本人が海外旅行先で支払ったホテル代や食事代は、国際収支では貿易収支の支払いとして計上される。","a":false,"e":"誤り。正しくは「サービス収支（旅行）の支払い」として計上される。貿易収支はモノの輸出入だけを計上する。"},{"t":"tf","s":"国際収支の判別","imp":2,"q":"日本企業が海外の子会社から受け取った配当金は、子会社を設立するための投資と同じく、金融収支に計上される。","a":false,"e":"誤り。正しくは「第一次所得収支」に計上される。子会社の設立や株式の取得という投資そのものは金融収支だが、投資から生まれた配当や利子は第一次所得収支である。"},{"t":"mc","s":"日本の国際収支","imp":3,"q":"近年の日本の国際収支の特徴に関する記述として最も適当なものを一つ選べ。","c":["第一次所得収支の大幅な黒字が、経常収支の黒字を支えている","貿易収支の大幅な黒字が、経常収支の黒字の大部分を占めている","第二次所得収支は、海外からの送金の受け取りが多く、大幅な黒字である","旅行収支は、日本人の海外旅行が多いため、毎年大幅な赤字が続いている"],"a":0,"e":"2000年代半ば以降、第一次所得収支（当時は所得収支）の黒字が貿易収支の黒字を上回るようになり、現在は第一次所得収支が経常黒字の中心である。貿易収支は2011年以降、赤字の年が多い。第二次所得収支は援助や拠出金などの支払いが多く赤字である。旅行収支は訪日外国人旅行者の増加で2015年に年間黒字に転じ、その後黒字が拡大している。"},{"t":"tf","s":"日本の国際収支","imp":3,"q":"2011年に日本の貿易収支が赤字になった主な要因の一つは、東日本大震災後の原子力発電所の停止にともなう、火力発電用の燃料輸入の増加である。","a":true,"e":"正しい。原発停止で液化天然ガスなどの燃料輸入が急増し、2011年に貿易収支は赤字に転じた。その後も資源価格や為替相場の影響を受け、2022年には資源価格の高騰と円安により過去最大規模の貿易赤字となった。"},{"t":"qa","s":"日本の国際収支","imp":2,"q":"訪日外国人旅行者（インバウンド）の増加により、2015年に年間で黒字に転じた、サービス収支の中の項目は何か。","a":"旅行収支","alt":["旅行"],"e":"外国人旅行者が日本で使うお金は旅行収支の受け取り、日本人が海外で使うお金は支払いになる。円安や査証（ビザ）発給要件の緩和などで訪日客が増え、旅行収支の黒字は拡大している。"},{"t":"tf","s":"日本の国際収支","imp":2,"q":"近年の日本のサービス収支では、クラウドサービスやインターネット広告、ソフトウェアの使用料など、デジタル関連の取引で大幅な赤字が生じている。","a":true,"e":"正しい。海外の巨大IT企業（プラットフォーム企業）への支払いが増えており、「デジタル赤字」と呼ばれる。旅行収支の黒字が拡大しても、デジタル関連などの赤字が大きく、サービス収支全体は赤字基調である。"},{"t":"qa","s":"日本の国際収支","imp":2,"q":"ある国が保有する対外資産から対外負債を差し引いた額を何というか。日本は1991年以降、長くこの額が世界最大の国であった。","a":"対外純資産","e":"長年の経常黒字の積み重ねにより、日本は巨額の対外純資産をもち、そこから得る利子・配当が第一次所得収支の黒字につながっている。2024年末にはドイツが日本を上回った。"},{"t":"ex","s":"日本の国際収支","imp":3,"q":"日本の経常収支の構造が、2000年代以降どのように変化したかを説明せよ。","a":"かつての日本は、工業製品の輸出による大幅な貿易黒字が経常黒字の中心だった。しかし企業の海外生産の拡大や資源輸入の増加で貿易黒字は縮小し、2011年以降は貿易赤字の年も多くなった。一方で対外資産から得る利子・配当が増え、第一次所得収支の大幅な黒字が経常黒字を支える構造に変わった。","e":"ポイント：①かつては貿易黒字が経常黒字の中心 ②海外生産の拡大や資源輸入の増加で貿易黒字が縮小し、2011年以降は赤字の年も多い ③第一次所得収支の黒字が経常黒字の中心に ④「貿易で稼ぐ国」から「投資で稼ぐ国」へ"},{"t":"tf","s":"日本の国際収支","imp":1,"q":"日本の第二次所得収支は、海外で働く日本人からの送金の受け取りが多いため、黒字が続いている。","a":false,"e":"誤り。正しくは「赤字が続いている」。日本は政府の無償援助や国際機関への拠出金、在日外国人の本国への送金などの支払いが受け取りを上回る。出稼ぎ労働者の多い国では、本国への送金の受け取りで第二次所得収支が黒字になることがある。"}]});</script>
<script>QDATA.push({"unit":"u23","questions":[{"t":"qa","s":"外国為替と為替相場","imp":3,"q":"「1ドル＝150円」のように表される、異なる通貨どうしの交換比率を何というか。","a":"為替相場","alt":["為替レート","外国為替相場"],"e":"通貨を交換する場を外国為替市場という。変動相場制のもとでは、為替相場は外国為替市場における通貨の需要と供給によって決まり、ある通貨を欲しい人が増えれば（需要が増えれば）その通貨の価値は上がる。"},{"t":"qa","s":"円高・円安","imp":3,"q":"為替相場が1ドル＝150円から1ドル＝120円に変化したように、外国通貨に対して円の価値が上がることを何というか。","a":"円高","alt":["円高ドル安","円高・ドル安"],"e":"数字が小さくなるのに円の価値は上がる点がひっかけ。1ドルを手に入れるのに必要な円が150円から120円に減った、つまり円の価値が上がったと考える。1ドル＝150円から180円になるのは円安である。"},{"t":"mc","s":"円高・円安","imp":3,"q":"為替相場が1ドル＝100円から1ドル＝125円に変化した。このときの記述として最も適当なものを一つ選べ。","c":["アメリカから1万ドルの商品を輸入すると、円での支払額は100万円から125万円に増える","円高が進んだので、アメリカから1万ドルの商品を輸入するときの円での支払額は100万円から80万円に減る","円安が進んだので、日本で250万円の自動車のアメリカでのドル建て価格は2万5千ドルから3万ドルに上がる","円の価値が上がったので、日本人がアメリカ旅行で使うドルを手に入れるのに必要な円は少なくてすむ"],"a":0,"e":"1ドルを得るのに必要な円が100円から125円に増えたので、円安・ドル高である。1万ドルの輸入品は100万円から125万円に値上がりする。円安になると日本製品のドル建て価格は下がり（250万円÷100円＝2万5千ドルから250万円÷125円＝2万ドルへ）、輸出に有利になる。円の価値は下がったので、海外旅行の費用は円でみて割高になる。"},{"t":"mc","s":"円高・円安","imp":3,"q":"日本の自動車メーカーが、アメリカで1台3万ドルの自動車を販売している。為替相場が1ドル＝150円から1ドル＝120円に変化し、ドル建ての販売価格は変えなかったとき、1台あたりの円での売上額の変化として正しいものを一つ選べ。","c":["450万円から360万円に減る","360万円から450万円に増える","450万円から540万円に増える","450万円のまま変わらない"],"a":0,"e":"3万ドル×150円＝450万円、3万ドル×120円＝360万円である。円高のときにドル建て価格を据え置くと円での受け取りが減り、円での受け取りを保とうとするとドル建て価格を上げなければならず売れにくくなる。いずれにしても円高は輸出企業に不利である。"},{"t":"mc","s":"円高・円安","imp":2,"q":"1ドル＝100円のときに100万円をドルに替え、アメリカで年利5％の預金に1年間預けた。1年後に1ドル＝90円になっていたとき、元利合計を円に替えた額として正しいものを一つ選べ。ただし手数料や税は考えないものとする。","c":["94万5千円","105万円","115万5千円","100万円"],"a":0,"e":"100万円÷100円＝1万ドル。1年後の元利合計は1万ドル×1.05＝1万500ドルで、これを1ドル＝90円で円に替えると94万5千円になる。利子がついても、円高による為替差損で元本を下回ってしまう。「105万円」は為替相場が変わらなかった場合、「115万5千円」は1ドル＝110円の円安になった場合の額である。"},{"t":"ex","s":"円高・円安","imp":3,"q":"円高が日本の輸出企業と輸入企業に与える影響を、それぞれ説明せよ。","a":"円高になると、日本製品の外貨建て価格が上がって海外で売れにくくなるか、外貨建て価格を据え置けば円での受取額が減るため、輸出企業には不利になる。一方、輸入企業は同じ外貨建て価格の商品を少ない円で買えるため、仕入れの費用が下がり有利になる。","e":"ポイント：①輸出品の外貨建て価格の上昇（または円での受取額の減少） ②輸出企業に不利 ③輸入品の円建て価格の下落 ④輸入企業に有利"},{"t":"mc","s":"円高・円安","imp":3,"q":"円安が進んだときに日本で起こりやすいこととして最も適当なものを一つ選べ。","c":["輸入される原材料や食料の円建て価格が上がり、国内の物価が上がりやすくなる","日本人の海外旅行の費用が円でみて安くなり、海外旅行者が増える","日本からの輸出品の外貨建て価格が上がり、輸出が減少する","外国人にとって日本での旅行が割高になり、訪日外国人旅行者が減る"],"a":0,"e":"円安では輸入品の円建て価格が上がるため、エネルギーや食料の多くを輸入に頼る日本では物価上昇の要因となる。2022年以降の物価上昇の一因でもある。円安のときは日本人の海外旅行は割高になり、輸出品の外貨建て価格は下がって輸出に有利になり、外国人にとって日本旅行は割安になる。"},{"t":"tf","s":"円高・円安","imp":2,"q":"円高が進むと、日本企業は海外の工場用地や企業を少ない円で取得できるようになるため、生産拠点の海外移転が進みやすい。","a":true,"e":"正しい。1985年のプラザ合意後の急激な円高では、多くの企業が海外に生産拠点を移し、国内の製造業が衰える産業の空洞化が問題となった。"},{"t":"tf","s":"円高・円安","imp":2,"q":"為替相場が1ドル＝80円から1ドル＝100円に変化することを円高という。","a":false,"e":"誤り。正しくは円安である。1ドルを得るのに80円ですんだものが100円必要になったので、円の価値は下がっている。「1ドル＝〇円」の数字が大きくなると円安、小さくなると円高である。"},{"t":"tf","s":"円高・円安","imp":2,"q":"円高になると、輸入品の円建て価格が上がるため、国内の物価は上昇しやすくなる。","a":false,"e":"誤り。正しくは、円高になると輸入品の円建て価格が下がるため、国内の物価には下落の圧力がかかる。物価上昇の要因になりやすいのは円安である。"},{"t":"mc","s":"為替の変動要因","imp":3,"q":"他の条件が変わらないとき、円高・ドル安の要因となるものとして最も適当なものを一つ選べ。","c":["日本の輸出が増加し、輸出企業が受け取ったドルを円に替える動きが強まる","アメリカの金利が上昇し、日米の金利差が拡大する","日本の物価上昇率がアメリカの物価上昇率を大きく上回る","日本の投資家が、アメリカの株式や債券の購入を増やす"],"a":0,"e":"輸出企業がドルを売って円を買えば円の需要が増え、円高になる。アメリカの金利が上昇して金利差が広がると、ドルで運用しようとする円売り・ドル買いが強まり円安になる。日本の物価上昇率が高いと円の購買力が下がり円安要因になる。日本の投資家がアメリカの証券を買うには円を売ってドルを買う必要があるので、これも円安要因である。"},{"t":"qa","s":"為替の変動要因","imp":1,"q":"将来の価格変動を予想し、その差額で利益を得る目的で通貨や商品を売買することを何というか。","a":"投機","alt":["投機的取引"],"e":"ヘッジファンドなどの大量の投機的資金は、為替相場を短期間に大きく変動させる要因となる。1997年のアジア通貨危機でも投機的な資金の動きが危機を深刻にした。"},{"t":"ex","s":"為替の変動要因","imp":2,"q":"アメリカの金利が上昇して日本との金利差が広がると、円安・ドル高になりやすい理由を説明せよ。","a":"金利差が広がると、投資家はより高い利子を得られるドルで資産を運用しようとする。そのため外国為替市場で円を売ってドルを買う動きが強まり、ドルの需要が増え円の需要が減るので、円安・ドル高になる。2022年以降の急速な円安には、日米の金利差の拡大が大きく影響した。","e":"ポイント：①投資家は金利の高い通貨で運用しようとする ②円売り・ドル買いが増える ③ドルの需要増・円の需要減で円安・ドル高 ④2022年以降の円安の背景"},{"t":"tf","s":"為替の変動要因","imp":2,"q":"日本の貿易黒字が拡大すると、輸出で得た外貨を円に替える動きが強まるため、一般に円安の要因となる。","a":false,"e":"誤り。正しくは「円高の要因となる」。外貨を売って円を買う取引が増えると円の需要が高まり、円の価値が上がる。1980年代に日本の貿易黒字が拡大した時期には、円高圧力が強まった。"},{"t":"qa","s":"購買力平価","imp":2,"q":"同じ商品はどこでも同じ価格になるはずだという考え（一物一価）にもとづき、2国間の物価水準の比率で為替相場が決まるとする説を何というか。","a":"購買力平価説","alt":["購買力平価"],"e":"同じハンバーガーがアメリカで5ドル、日本で500円なら、購買力平価は1ドル＝100円となる。長期的な為替相場の動きを説明する考え方で、短期的には金利差や投機などにより実際の相場は購買力平価から大きく離れることがある。"},{"t":"mc","s":"購買力平価","imp":2,"q":"同じ品質の商品が、アメリカでは4ドル、日本では480円で売られている。購買力平価説にもとづく記述として最も適当なものを一つ選べ。","c":["購買力平価は1ドル＝120円で、実際の為替相場が1ドル＝150円なら、円は購買力平価より安く評価されている","購買力平価は1ドル＝120円で、実際の為替相場が1ドル＝150円なら、円は購買力平価より高く評価されている","購買力平価は1ドル＝150円で、実際の為替相場が1ドル＝120円なら、円は購買力平価より安く評価されている","購買力平価は1ドル＝120円で、その後日本の物価だけが2倍になれば、購買力平価は1ドル＝60円になる"],"a":0,"e":"480円÷4ドル＝120円なので購買力平価は1ドル＝120円である。実際の相場が1ドル＝150円なら、1ドルを得るのに購買力平価より多くの円が必要なので、円は購買力平価より安く（円安に）評価されている。日本の物価だけが2倍になると商品は960円となり、購買力平価は960÷4＝240円と円安方向に動く。"},{"t":"tf","s":"購買力平価","imp":2,"q":"購買力平価説によれば、日本の物価上昇率がアメリカより高い状態が続くと、長期的には円安・ドル高が進む。","a":true,"e":"正しい。日本の物価が相対的に上がると、同じ金額の円で買える商品が減り、円の購買力（価値）が下がるため、為替相場も円安方向に動くと考える。「物価上昇率が高い国の通貨は安くなる」と覚えるとよい。"},{"t":"ex","s":"為替制度と介入","imp":3,"q":"固定相場制と変動相場制の違いを説明せよ。","a":"固定相場制は、政府や中央銀行が自国通貨と外国通貨の交換比率を一定の水準に定め、その維持のために市場に介入する制度である。変動相場制は、為替相場を外国為替市場における通貨の需要と供給によって決める制度である。主要国は1973年に変動相場制へ移行した。","e":"ポイント：①固定相場制は交換比率を一定に維持（例：1ドル＝360円） ②維持のため通貨当局が市場に介入 ③変動相場制は市場の需給で決まる ④主要国は1973年に移行し、1976年のキングストン合意で正式に承認"},{"t":"qa","s":"為替制度と介入","imp":3,"q":"為替相場の急激な変動を抑えるため、政府・中央銀行が外国為替市場で通貨を売買することを何というか。","a":"為替介入","alt":["外国為替平衡操作","市場介入"],"e":"正式には外国為替平衡操作という。日本では財務大臣の判断にもとづき、日本銀行が財務大臣の代理人として実際の売買を行う。"},{"t":"mc","s":"為替制度と介入","imp":2,"q":"急激な円安を抑えるために日本の通貨当局が行う為替介入として最も適当なものを一つ選べ。","c":["外貨準備のドルを売って円を買う","円を売ってドルを買い、外貨準備を増やす","日本銀行が政策金利を引き下げ、市場に円を供給する","政府が国債を発行し、公共事業を拡大する"],"a":0,"e":"円安を抑えるには円の需要を増やせばよいので、外貨準備のドルを売って円を買う（円買い・ドル売り介入）。2022年には1998年以来24年ぶりの円買い介入が行われた。円売り・ドル買いは円高を抑えるための介入である。金利の引き下げはかえって円安を進める方向に働き、国債発行による公共事業は為替介入ではなく財政政策である。"},{"t":"tf","s":"為替制度と介入","imp":1,"q":"日本で為替介入を行うかどうかは日本銀行の政策委員会が決定し、財務省はその指示を受けて実際の売買を行う。","a":false,"e":"誤り。正しくは、為替介入は財務大臣の権限で決定され、日本銀行が財務大臣の代理人として実際の売買を行う。日本銀行の政策委員会が決定するのは金融政策であり、混同しないこと。"}]});</script>
<script>QDATA.push({"unit":"u23","questions":[{"t":"qa","s":"金本位制とブロック経済","imp":2,"q":"通貨の価値を金と結びつけ、中央銀行が発行する銀行券と金との交換（兌換）を保証する制度を何というか。","a":"金本位制","alt":["金本位制度"],"e":"19世紀にイギリスを中心に広まった。通貨の量が金の保有量に縛られるため、世界恐慌後に各国が離脱し、政府・中央銀行が通貨量を調節する管理通貨制度に移行した。"},{"t":"qa","s":"金本位制とブロック経済","imp":3,"q":"1930年代に、イギリスやフランスなどが本国と植民地などで排他的な経済圏をつくり、域外からの輸入に高い関税をかけた経済体制を何というか。","a":"ブロック経済","e":"世界恐慌後、各国は自国の利益を優先して保護貿易や通貨の切り下げ競争に走った。その結果、世界貿易は縮小し、経済圏をもたない国との対立が深まって第二次世界大戦の一因となった。この反省から戦後のIMF・GATT体制がつくられた。"},{"t":"ex","s":"金本位制とブロック経済","imp":3,"q":"第二次世界大戦後にIMFとGATTが設けられた背景を、1930年代の国際経済の状況にふれて説明せよ。","a":"1929年の世界恐慌後、各国は金本位制を離脱して為替の切り下げ競争を行い、ブロック経済による保護貿易で自国の市場を囲い込んだ。その結果、世界貿易が縮小して国家間の対立が深まり、第二次世界大戦の一因となった。この反省から、為替相場の安定を図るIMFと、自由貿易を進めるGATTが設けられた。","e":"ポイント：①世界恐慌後の為替切り下げ競争 ②ブロック経済による保護貿易 ③世界貿易の縮小が対立と戦争の一因に ④反省からIMF（為替の安定）とGATT（自由貿易の推進）"},{"t":"qa","s":"ブレトン・ウッズ体制","imp":3,"q":"1944年にアメリカで結ばれ、IMFとIBRDの設立を決めた協定を何というか。","a":"ブレトン・ウッズ協定","alt":["ブレトンウッズ協定"],"e":"アメリカのブレトン・ウッズに連合国44か国が集まった会議で結ばれた。この協定にもとづく戦後の国際通貨体制をブレトン・ウッズ体制（IMF体制）という。"},{"t":"qa","s":"ブレトン・ウッズ体制","imp":3,"q":"為替相場の安定を図り、国際収支が赤字になった加盟国に短期の資金を融資する国際機関を何というか。","a":"国際通貨基金","alt":["IMF"],"e":"1945年に設立された。現在は通貨危機に陥った国への融資なども行う。長期の開発資金を融資するIBRD（世界銀行）と区別すること。"},{"t":"qa","s":"ブレトン・ウッズ体制","imp":2,"q":"当初は戦災国の復興のため、その後は発展途上国の開発のために長期の資金を融資する国際機関で、世界銀行とも呼ばれるものは何か。","a":"国際復興開発銀行","alt":["IBRD"],"e":"日本も1950〜60年代に、東海道新幹線や名神高速道路、黒部川第四発電所などの建設資金を世界銀行から借り入れた。短期融資のIMFと区別する。"},{"t":"qa","s":"ブレトン・ウッズ体制","imp":3,"q":"ブレトン・ウッズ体制で、金1オンス＝35ドルとしてアメリカがドルと金の交換を保証し、各国通貨とドルの交換比率を固定した仕組みを何というか。","a":"金・ドル本位制","alt":["金ドル本位制","金為替本位制"],"e":"ドルは金と交換できる唯一の通貨として基軸通貨となった。各国通貨はドルとの交換比率を固定され、変動幅は上下1％以内に抑えられた（固定相場制）。"},{"t":"qa","s":"ブレトン・ウッズ体制","imp":3,"q":"ブレトン・ウッズ体制のもとで1949年に設定された、円とドルの交換比率を答えよ。","a":"1ドル＝360円","alt":["1ドル=360円","360円"],"e":"ドッジ・ラインの一環として設定された単一為替レートで、1971年まで維持された。1971年のスミソニアン協定で1ドル＝308円に改められた。"},{"t":"tf","s":"ブレトン・ウッズ体制","imp":2,"q":"ブレトン・ウッズ体制では、各国の通貨がそれぞれ自国の保有する金と直接交換でき、アメリカのドルは特別な役割をもたなかった。","a":false,"e":"誤り。正しくは、金と交換できることが保証されたのはドルだけであり、各国通貨はドルとの交換比率を固定することで間接的に金と結びつけられた（金・ドル本位制）。ドルは基軸通貨として特別な役割を担った。"},{"t":"qa","s":"変動相場制への移行","imp":2,"q":"1960年代、アメリカの国際収支の赤字が続いてドルが海外に流出し、金準備が減少したことで、ドルの信用が低下した事態を何というか。","a":"ドル危機","e":"背景には、ベトナム戦争の軍事支出、対外援助、アメリカ企業の海外投資の増加などがあった。ドルが金と交換できるという信頼が揺らぎ、各国がドルを金に交換する動きが強まった。"},{"t":"qa","s":"変動相場制への移行","imp":3,"q":"1971年8月、アメリカのニクソン大統領が金とドルの交換停止を発表し、ブレトン・ウッズ体制を事実上崩壊させた出来事を何というか。","a":"ニクソン・ショック","alt":["ニクソンショック","ドル・ショック","ドルショック"],"e":"新経済政策の一部として発表され、輸入課徴金も導入された。これにより金・ドル本位制は崩れ、同年12月のスミソニアン協定で固定相場制の再建が図られた。"},{"t":"qa","s":"変動相場制への移行","imp":3,"q":"1971年12月、ドルを切り下げて固定相場制を再建するために結ばれ、円とドルの交換比率を1ドル＝308円と定めた合意を何というか。","a":"スミソニアン協定","alt":["スミソニアン合意"],"e":"ワシントンのスミソニアン博物館で開かれた先進10か国の会議で合意された。金1オンス＝38ドルにドルを切り下げ、変動幅を上下2.25％に広げたが、ドル不安は収まらず、1973年に主要国は変動相場制に移行した。"},{"t":"qa","s":"変動相場制への移行","imp":3,"q":"1976年、ジャマイカで開かれたIMFの会議で、変動相場制を正式に承認し、金の公定価格を廃止した合意を何というか。","a":"キングストン合意","alt":["キングストン協定"],"e":"IMF暫定委員会での合意で、各国が為替制度を選べるようになり、通貨制度における金の役割は大きく低下した。主要国は1973年からすでに変動相場制に移行していたので、それを追認する性格をもつ。"},{"t":"qa","s":"変動相場制への移行","imp":1,"q":"1969年にIMFが創設した、加盟国が出資額に応じて配分を受け、外貨が不足したときに他国の通貨と交換できる国際的な準備資産を何というか。","a":"SDR","alt":["特別引出権"],"e":"金やドルを補う準備資産として設けられた。現在、その価値はドル・ユーロ・人民元・円・ポンドの5通貨を組み合わせて決められている。"},{"t":"mc","s":"変動相場制への移行","imp":2,"q":"次の国際通貨体制にかかわる出来事を古い順に並べたとき、3番目にくるものとして正しいものを一つ選べ。","c":["スミソニアン協定","ブレトン・ウッズ協定","ニクソン・ショック","キングストン合意"],"a":0,"e":"ブレトン・ウッズ協定（1944年）→ニクソン・ショック（1971年8月）→スミソニアン協定（1971年12月）→主要国の変動相場制への移行（1973年）→キングストン合意（1976年）の順である。金とドルの交換停止の後、いったん固定相場制の再建が図られたという流れを押さえる。"},{"t":"ex","s":"変動相場制への移行","imp":2,"q":"ブレトン・ウッズ体制が崩壊した理由を説明せよ。","a":"ブレトン・ウッズ体制は、アメリカが金とドルの交換を保証することで成り立っていた。しかし1960年代にベトナム戦争の戦費や対外援助などでアメリカの国際収支の赤字が続き、ドルが海外に流出して金準備が減ったため、ドルの信用が低下した。そのため1971年にニクソン大統領が金とドルの交換を停止し、体制は崩壊した。","e":"ポイント：①金とドルの交換保証が体制の柱 ②アメリカの国際収支の赤字とドルの流出 ③金準備の減少によるドルの信用低下（ドル危機） ④1971年のニクソン・ショック"},{"t":"tf","s":"変動相場制への移行","imp":2,"q":"スミソニアン協定によって変動相場制への移行が正式に承認され、為替相場は市場の需給で決まるようになった。","a":false,"e":"誤り。スミソニアン協定（1971年）は、ドルを切り下げて1ドル＝308円とするなど固定相場制の再建を図ったものである。正しくは、変動相場制を正式に承認したのは1976年のキングストン合意である。"},{"t":"qa","s":"プラザ合意と政策協調","imp":3,"q":"1985年、ドル高を是正するため、先進5か国（G5）の財務相・中央銀行総裁がニューヨークで合意し、為替市場への協調介入を行うこととしたものを何というか。","a":"プラザ合意","e":"合意後、急速な円高・ドル安が進み（1ドル＝240円前後から1年ほどで150円台へ）、日本は輸出産業が打撃を受ける円高不況に陥った。その対策としての金融緩和がバブル経済の一因となった。"},{"t":"qa","s":"プラザ合意と政策協調","imp":1,"q":"1987年、プラザ合意後のドル安の行き過ぎを止め、為替相場を当時の水準で安定させることを主要先進国がパリで合意したものを何というか。","a":"ルーブル合意","e":"パリのルーブル宮殿で開かれた会議で合意された。プラザ合意（ドル高の是正）とルーブル合意（ドル安の歯止め）は目的が逆なので、取り違えに注意する。"},{"t":"qa","s":"プラザ合意と政策協調","imp":2,"q":"石油危機後の世界経済の問題を話し合うため1975年にフランスで初めて開かれ、現在は日本・アメリカ・イギリス・フランス・ドイツ・イタリア・カナダの首脳とEUの代表が参加する会議を何というか。","a":"サミット","alt":["主要国首脳会議","先進国首脳会議","G7サミット"],"e":"第1回はランブイエで6か国により開かれ、翌年からカナダが加わった。1990年代後半からロシアが加わってG8となったが、2014年のクリミア併合を受けてロシアの参加は停止された。"},{"t":"qa","s":"プラザ合意と政策協調","imp":2,"q":"2008年の世界金融危機をきっかけに首脳会合が開かれるようになった、先進国に中国・インド・ブラジルなどの新興国を加えた枠組みを何というか。","a":"G20","alt":["20か国・地域","G20サミット"],"e":"財務相・中央銀行総裁会議は1999年から開かれていたが、リーマン・ショック後に新興国を含めて世界経済を話し合う必要が高まり、2008年に首脳会合が始まった。2019年には大阪で開かれた。"},{"t":"mc","s":"プラザ合意と政策協調","imp":3,"q":"国際通貨体制に関する記述として最も適当なものを一つ選べ。","c":["プラザ合意の後、急速な円高が進み、日本では輸出産業が打撃を受けて円高不況となった","ニクソン・ショックによって、金1オンス＝35ドルでの金とドルの交換が始まった","キングストン合意によって、1ドル＝308円の固定相場が定められた","ルーブル合意によって、ドル高を是正するための協調介入が初めて合意された"],"a":0,"e":"プラザ合意後の急激な円高で日本は円高不況に陥った。ニクソン・ショックは金とドルの交換を「停止」したもの。1ドル＝308円を定めたのはスミソニアン協定であり、キングストン合意は変動相場制の承認である。ドル高是正の協調介入を決めたのはプラザ合意で、ルーブル合意はドル安の行き過ぎを止めるためのものである。"},{"t":"tf","s":"プラザ合意と政策協調","imp":2,"q":"プラザ合意は、行き過ぎたドル安を食い止めるため、各国が協調してドルを買い支えることを決めたものである。","a":false,"e":"誤り。正しくは、プラザ合意はドル高を是正するために各国が協調してドル売りの介入を行うことを決めたものである。行き過ぎたドル安を止めようとしたのは1987年のルーブル合意である。"}]});</script>
<script>QDATA.push({"unit":"u23","questions":[{"t":"qa","s":"GATTの原則","imp":3,"q":"1947年に調印され、関税の引き下げや輸入制限の撤廃によって自由貿易を推進することをめざした国際協定を何というか。","a":"関税及び貿易に関する一般協定","alt":["GATT","ガット","関税と貿易に関する一般協定"],"e":"1948年に発効し、日本は1955年に加入した。IMFとともに戦後の自由貿易体制（IMF・GATT体制）を支えた。正式な国際機関ではなく協定であり、1995年にWTOへ引き継がれた。"},{"t":"qa","s":"GATTの原則","imp":3,"q":"GATTの三原則を答えよ。","a":"自由・無差別・多角","alt":["自由、無差別、多角","自由・無差別・多角主義"],"e":"「自由」は関税の引き下げと輸入数量制限の撤廃、「無差別」は最恵国待遇と内国民待遇、「多角」は多国間の交渉（ラウンド）で貿易のルールを決めることをさす。"},{"t":"ex","s":"GATTの原則","imp":3,"q":"GATT・WTOの最恵国待遇と内国民待遇の違いを説明せよ。","a":"最恵国待遇は、ある加盟国に与えた最も有利な貿易条件（低い関税率など）を、他のすべての加盟国にも同じように与えることで、輸入相手国の間で差別をしない原則である。内国民待遇は、輸入品に対して、国内の税や規制の面で国内品と同等の待遇を与えることで、輸入品と国内品の間で差別をしない原則である。","e":"ポイント：①どちらもGATT・WTOの「無差別」の原則 ②最恵国待遇は外国どうしの間で差別しない ③内国民待遇は輸入品と国内品の間で差別しない ④一般特恵関税や地域経済統合（FTAなど）は最恵国待遇の例外"},{"t":"mc","s":"GATTの原則","imp":3,"q":"GATT・WTOの最恵国待遇の原則にもとづく対応として最も適当なものを一つ選べ。","c":["A国からの輸入品の関税を引き下げた国が、他のすべての加盟国からの同じ品目の関税も同じ税率に引き下げる","輸入した酒類に対して、国内産の同種の酒類と同じ税率の酒税を課す","輸入の急増で国内産業に重大な損害が生じたため、一時的に輸入を制限する","発展途上国からの輸入品に限って、先進国からの輸入品より低い関税率を適用する"],"a":0,"e":"特定の国に与えた有利な関税率を他のすべての加盟国にも与えるのが最恵国待遇である。輸入品と国内品に同じ税率を課すのは内国民待遇にもとづく対応。輸入急増に対する一時的な制限はセーフガード。途上国に低い関税率を適用する一般特恵関税は、最恵国待遇の例外として認められている措置である。"},{"t":"tf","s":"GATTの原則","imp":2,"q":"先進国が発展途上国からの輸入品に一般より低い関税率を適用する一般特恵関税は、最恵国待遇の原則に反するため、GATT・WTOでは一切認められていない。","a":false,"e":"誤り。正しくは、一般特恵関税は途上国の経済発展を支援するために最恵国待遇の例外として認められている。UNCTADでの途上国の要求を受けて1970年代から先進国が実施しており、日本は1971年に導入した。"},{"t":"qa","s":"ラウンド交渉","imp":1,"q":"1964年から67年に行われ、工業製品の関税を一括して大幅に引き下げることで合意したGATTの多国間交渉を何というか。","a":"ケネディ・ラウンド","alt":["ケネディラウンド"],"e":"アメリカのケネディ大統領の提唱で始まり、工業製品の関税を平均で約35％引き下げた。品目ごとに交渉するのではなく、一括して引き下げる方式がとられた。"},{"t":"qa","s":"ラウンド交渉","imp":1,"q":"1973年から79年に行われ、関税の引き下げに加えて、非関税障壁の軽減についてのルールも定められたGATTの多国間交渉を何というか。","a":"東京ラウンド","alt":["東京ラウンド交渉"],"e":"交渉の開始が東京で宣言されたことからこの名がある。工業製品の関税を約3分の1引き下げたほか、補助金や政府調達など非関税障壁に関する取り決めがつくられた。"},{"t":"qa","s":"ラウンド交渉","imp":3,"q":"1986年から94年に行われ、サービス貿易や知的財産権のルールづくり、農産物の例外なき関税化、WTOの設立などで合意したGATTの多国間交渉を何というか。","a":"ウルグアイ・ラウンド","alt":["ウルグアイラウンド"],"e":"日本はコメの関税化について特例措置を受け、その代わりに最低限の輸入量（ミニマム・アクセス）を受け入れた。その後、1999年からはコメも関税化した。"},{"t":"mc","s":"ラウンド交渉","imp":2,"q":"GATTのラウンド交渉に関する記述として最も適当なものを一つ選べ。","c":["ウルグアイ・ラウンドでは、モノの貿易だけでなく、サービス貿易や知的財産権についてもルールがつくられた","ケネディ・ラウンドでは、農産物の例外なき関税化が合意された","東京ラウンドで、GATTを発展させた国際機関としてWTOの設立が決まった","ウルグアイ・ラウンドは、先進国と途上国の対立から合意に至らないまま打ち切られた"],"a":0,"e":"ウルグアイ・ラウンドではサービス貿易や知的財産権の協定がつくられ、農産物の例外なき関税化やWTOの設立も合意された。ケネディ・ラウンドの成果は工業製品の関税の一括引き下げである。WTOの設立を決めたのは東京ラウンドではなくウルグアイ・ラウンド。合意に至らず停滞しているのはWTOのドーハ・ラウンドである。"},{"t":"qa","s":"WTO","imp":3,"q":"ウルグアイ・ラウンドの合意にもとづいて1995年に発足し、GATTを引き継いで貿易のルールづくりや貿易紛争の処理を行う国際機関を何というか。","a":"世界貿易機関","alt":["WTO"],"e":"本部はスイスのジュネーブ。GATTが協定だったのに対し、WTOは正式な国際機関である。中国は2001年、ロシアは2012年に加盟した。"},{"t":"qa","s":"WTO","imp":3,"q":"WTOの紛争処理の手続きで採用されている、全加盟国が反対しない限り、パネル（小委員会）の設置や報告の採択が決まる方式を何というか。","a":"ネガティブ・コンセンサス方式","alt":["ネガティブ・コンセンサス","ネガティブコンセンサス方式"],"e":"GATT時代は全会一致（コンセンサス）で決める方式だったため、訴えられた国が反対すると手続きが進まなかった。逆に「全員が反対しない限り採択」としたことで、紛争処理の実効性が高まった。"},{"t":"ex","s":"WTO","imp":2,"q":"WTOがGATTと比べて強化された点を説明せよ。","a":"GATTは国際協定で、対象は主にモノの貿易であり、紛争処理は全会一致の方式のため、訴えられた国の反対で手続きが止まることがあった。これに対しWTOは正式な国際機関で、サービス貿易や知的財産権も対象とし、ネガティブ・コンセンサス方式の導入で紛争処理の機能が強化された。","e":"ポイント：①GATTは協定、WTOは正式な国際機関 ②対象がモノからサービス・知的財産権へ拡大 ③紛争処理にネガティブ・コンセンサス方式を導入 ④紛争処理の実効性が高まった"},{"t":"qa","s":"WTO","imp":3,"q":"特定の品目の輸入が急増し、国内産業に重大な損害を与えるおそれがある場合に、一時的に認められる関税の引き上げや輸入数量制限を何というか。","a":"セーフガード","alt":["緊急輸入制限"],"e":"日本は2001年に、中国などからの輸入が急増したねぎ・生しいたけ・畳表について、暫定的なセーフガードを発動した。公正な貿易であっても、輸入急増による損害を理由に発動できる点が特徴である。"},{"t":"qa","s":"WTO","imp":2,"q":"外国企業が自国内の価格より不当に安い価格で輸出（ダンピング）し、輸入国の産業に損害を与えている場合に、輸入国が課すことのできる追加の関税を何というか。","a":"アンチ・ダンピング関税","alt":["アンチダンピング関税","反ダンピング関税","不当廉売関税"],"e":"正常な価格との差額の範囲で課すことができる。セーフガードが公正な貿易による輸入急増にも発動できるのに対し、アンチ・ダンピングは不当廉売という不公正な貿易への対抗措置である。"},{"t":"tf","s":"WTO","imp":2,"q":"WTOのもとで2001年に始まった多国間交渉のドーハ・ラウンドは、先進国と途上国の対立などにより難航し、全体としての合意には至っていない。","a":true,"e":"正しい。農業補助金や鉱工業品の関税などをめぐって先進国と途上国が対立し、交渉は停滞した。そのため各国は、二国間や地域で結ぶFTA・EPAに力を入れるようになった。"},{"t":"qa","s":"地域経済統合の形態","imp":3,"q":"特定の国や地域の間で、関税や輸入数量制限などの貿易の障壁を撤廃・削減する協定を何というか。","a":"自由貿易協定","alt":["FTA"],"e":"域内の実質上すべての貿易について関税を撤廃するなどの条件を満たせば、最恵国待遇の例外としてWTOでも認められる。ドーハ・ラウンドの停滞を背景に、世界中で締結が増えた。"},{"t":"ex","s":"地域経済統合の形態","imp":3,"q":"FTAとEPAの違いを説明せよ。","a":"FTA（自由貿易協定）は、特定の国や地域の間で関税などの貿易障壁を撤廃・削減し、貿易を自由化する協定である。EPA（経済連携協定）は、FTAの内容に加えて、投資のルール、人の移動、知的財産権の保護、競争政策などを含み、より幅広い経済関係の強化をめざす協定である。","e":"ポイント：①FTAは関税などの貿易障壁の撤廃・削減 ②EPAはFTAに投資・人の移動・知的財産権などを加えた幅広い協定 ③日本が結んでいるのは主にEPA ④例：EPAにもとづきインドネシア・フィリピン・ベトナムから看護師・介護福祉士の候補者を受け入れている"},{"t":"tf","s":"地域経済統合の形態","imp":2,"q":"関税同盟は、加盟国間の関税を撤廃するとともに域外からの輸入に共通の関税を設けるものであり、域外に対する関税を各国が独自に決める自由貿易協定とは異なる。","a":true,"e":"正しい。関税同盟は域内関税の撤廃と共通域外関税の設定がセットである。EUの前身のECは1968年に関税同盟を完成させた。南米のMERCOSURも関税同盟をめざしている。"}]});</script>
<script>QDATA.push({"unit":"u23","questions":[{"t":"qa","s":"EUの歩み","imp":1,"q":"1952年にフランス・西ドイツ・イタリア・ベネルクス3国の6か国で発足し、EUの出発点となった組織を何というか。","a":"欧州石炭鉄鋼共同体","alt":["ECSC"],"e":"戦争に欠かせない石炭と鉄鋼を共同で管理し、独仏の対立を防ぐねらいがあった。1958年にEEC（欧州経済共同体）とEURATOM（欧州原子力共同体）が発足し、1967年に3つの共同体が統合されてEC（欧州共同体）となった。"},{"t":"qa","s":"EUの歩み","imp":3,"q":"1992年に調印されて翌年発効し、ECを発展させてEU（欧州連合）を発足させた条約を何というか。","a":"マーストリヒト条約","alt":["欧州連合条約"],"e":"単一通貨の導入、共通の外交・安全保障政策、司法・内務協力などを定めた。単一通貨ユーロは1999年に導入され、紙幣・硬貨の流通は2002年に始まった。"},{"t":"qa","s":"EUの歩み","imp":3,"q":"ユーロを導入した国々の金融政策を一元的に行う、1998年に設立された中央銀行を何というか。","a":"欧州中央銀行","alt":["ECB"],"e":"本部はドイツのフランクフルト。ユーロ導入国は自国独自の金融政策を行えなくなる一方、財政政策は各国がそれぞれ行うため、この不一致がユーロ危機の背景となった。"},{"t":"qa","s":"EUの歩み","imp":1,"q":"2009年に発効し、EUに常任の欧州理事会議長（EU大統領）や外務・安全保障政策上級代表を置くとともに、加盟国が脱退する手続きも定めた条約を何というか。","a":"リスボン条約","e":"欧州議会の権限も強化された。イギリスは、この条約で定められた脱退の規定にもとづいてEUを離脱した。"},{"t":"tf","s":"EUの歩み","imp":3,"q":"EUのすべての加盟国は、共通通貨ユーロを導入している。","a":false,"e":"誤り。スウェーデンやデンマーク、ポーランドなど、ユーロを導入していない加盟国もある。正しくは「ユーロを導入していない加盟国もある」。EUを離脱したイギリスも、加盟していた間ユーロを導入せずポンドを使い続けた。"},{"t":"qa","s":"EUの歩み","imp":3,"q":"2016年の国民投票で離脱派が勝利し、2020年1月にEUを離脱した国はどこか。","a":"イギリス","alt":["英国","連合王国"],"e":"EU離脱はブレグジットと呼ばれる。EUからの移民の増加や、EUの規制・拠出金への不満が背景にあった。離脱後、イギリスは日本と経済連携協定を結び、2024年にはCPTPPに加入した。"},{"t":"ex","s":"EUの歩み","imp":2,"q":"2009年以降のユーロ危機（欧州債務危機）が深刻化した背景を、共通通貨ユーロの仕組みにふれて説明せよ。","a":"2009年、ギリシャで財政赤字が過少に報告されていたことが発覚し、国債の信用が急落した。ユーロ圏では金融政策をECBが一元的に行うため、各国は独自に金利を下げたり自国通貨を切り下げたりして景気を支えることができない。一方で財政政策は各国に任されており、財政状況の違いが放置されていたため、危機は財政の弱い他の国々にも広がった。","e":"ポイント：①ギリシャの財政赤字の過少報告の発覚（2009年） ②金融政策はECBが一元的に担い、各国は金利や為替で調整できない ③財政政策は各国ばらばら ④スペイン・イタリアなどに波及し、EU・IMFが支援と引き換えに緊縮財政を求めた"},{"t":"mc","s":"EUの歩み","imp":2,"q":"EUの歩みに関する記述として最も適当なものを一つ選べ。","c":["1993年に市場統合が実現し、域内でヒト・モノ・カネ・サービスの移動が原則として自由になった","1952年に発足したECSCが、1967年にそのままEUへと改称された","マーストリヒト条約の発効と同時に、ユーロの紙幣・硬貨の流通が始まった","2004年以降の拡大で、ロシアやトルコも加盟国となった"],"a":0,"e":"単一欧州議定書にもとづき、1993年1月に市場統合（単一市場）が実現した。1967年に成立したのはEC（欧州共同体）で、EUの発足は1993年である。ユーロの紙幣・硬貨の流通開始は2002年。2004年以降は中・東欧諸国などが加盟したが、ロシアは加盟しておらず、トルコは加盟候補国にとどまっている。"},{"t":"qa","s":"世界の地域経済統合","imp":1,"q":"1994年発効のNAFTA（北米自由貿易協定）に代わって2020年に発効した、アメリカ・メキシコ・カナダの3か国の協定を何というか。","a":"米国・メキシコ・カナダ協定","alt":["USMCA"],"e":"アメリカのトランプ政権が再交渉を求めて成立した。自動車の関税をゼロにする条件として、域内で生産する部品の割合（原産地規則）を引き上げるなど、保護主義的な性格を強めた。"},{"t":"qa","s":"世界の地域経済統合","imp":1,"q":"1995年に発足した、ブラジル・アルゼンチン・ウルグアイ・パラグアイなどによる南米の関税同盟を何というか。","a":"南米南部共同市場","alt":["MERCOSUR","メルコスール"],"e":"域内関税の撤廃と共通域外関税の設定をめざす関税同盟である。域外の関税を各国が独自に決めるFTAとの違いに注意する。"},{"t":"qa","s":"世界の地域経済統合","imp":3,"q":"1967年に結成された東南アジア諸国の地域協力機構を何というか。","a":"東南アジア諸国連合","alt":["ASEAN","アセアン"],"e":"1993年からAFTA（ASEAN自由貿易地域）で域内の関税引き下げを進め、2015年末にはAEC（ASEAN経済共同体）を発足させた。日本・中国・韓国との協力の枠組み（ASEAN＋3）もある。"},{"t":"qa","s":"世界の地域経済統合","imp":2,"q":"1989年にオーストラリアの提唱で発足し、日本・アメリカ・中国などアジア太平洋地域の21の国・地域が「開かれた地域主義」を掲げて経済協力を話し合う枠組みを何というか。","a":"アジア太平洋経済協力","alt":["APEC","エイペック","アジア太平洋経済協力会議"],"e":"加盟国を法的に拘束する協定ではなく、ゆるやかな協議の場である。中国・台湾・香港がともに参加しているのが特徴である。"},{"t":"qa","s":"日本のEPAとTPP","imp":2,"q":"2002年に発効した、日本が最初に結んだEPA（経済連携協定）の相手国はどこか。","a":"シンガポール","e":"その後、メキシコ、マレーシア、タイ、インドネシア、フィリピンなどとEPAを結んだ。2019年には日本とEUの間で日EU・EPAが発効し、世界最大級の自由貿易圏が生まれた。"},{"t":"qa","s":"日本のEPAとTPP","imp":3,"q":"アメリカが2017年に離脱した後、残る11か国で2018年に発効させた、環太平洋地域の経済連携協定を何というか。","a":"CPTPP","alt":["TPP11","TPP11協定","環太平洋パートナーシップに関する包括的及び先進的な協定"],"e":"もとのTPP（環太平洋パートナーシップ協定）は12か国で2016年に署名されたが、トランプ政権のアメリカが離脱した。2024年にはEUを離脱したイギリスが加入し、初めての新規加盟国となった。"},{"t":"qa","s":"日本のEPAとTPP","imp":3,"q":"ASEAN諸国10か国と日本・中国・韓国・オーストラリア・ニュージーランドの15か国が参加し、2022年に発効した経済連携協定を何というか。","a":"地域的な包括的経済連携協定","alt":["RCEP","アールセップ","RCEP協定"],"e":"日本にとって、中国・韓国と結んだ初めての経済連携協定である。交渉に参加していたインドは途中で離脱した。参加国で世界の人口とGDPの約3割を占める。"},{"t":"tf","s":"日本のEPAとTPP","imp":2,"q":"RCEP（地域的な包括的経済連携協定）は、日本・アメリカ・中国を含むアジア太平洋の国々が参加する経済連携協定である。","a":false,"e":"誤り。アメリカはRCEPに参加していない。正しくは、ASEAN諸国と日本・中国・韓国・オーストラリア・ニュージーランドが参加している。アメリカは2017年にTPPからも離脱しており、どちらの協定にも加わっていない。"},{"t":"qa","s":"経済のグローバル化","imp":3,"q":"複数の国に子会社や生産拠点をもち、世界的な規模で生産や販売を行う企業を何というか。","a":"多国籍企業","alt":["グローバル企業"],"e":"巨大な多国籍企業の売上高は、小さな国のGDPを上回ることもある。企業内で国境を越えた分業（工程間分業）を行い、世界の貿易の大きな部分を担っている。"},{"t":"qa","s":"経済のグローバル化","imp":3,"q":"海外での工場の建設や外国企業の買収など、経営への参加や支配を目的とする海外への投資を何というか。","a":"直接投資","alt":["対外直接投資","海外直接投資"],"e":"国際収支では金融収支に計上される。円高が進んだ1980年代後半以降、日本企業の海外直接投資が急増し、国内の製造業が衰える産業の空洞化が問題となった。"},{"t":"ex","s":"経済のグローバル化","imp":2,"q":"サプライチェーン（供給網）とは何かを説明し、近年その見直しが進んでいる理由を述べよ。","a":"サプライチェーンとは、原材料や部品の調達から生産、物流、販売までの一連の流れのことである。グローバル化で国境を越えて広がったが、新型コロナウイルス感染症の流行やロシアのウクライナ侵攻などで部品や資源の供給が滞る事態が起きた。そのため、調達先の多様化や生産の国内回帰、信頼できる国との連携などの見直しが進んでいる。","e":"ポイント：①調達から生産・物流・販売までの一連の流れ ②グローバル化で国境を越えて拡大 ③感染症の流行や紛争で寸断が発生 ④調達先の多様化・国内回帰などの見直し（経済安全保障の観点）"},{"t":"qa","s":"経済のグローバル化","imp":2,"q":"半導体などの重要物資の安定供給や、電気・通信などの基幹インフラの安全確保を、国家の安全保障の観点から図る考え方を何というか。日本では2022年にこれを推進する法律が制定された。","a":"経済安全保障","e":"2022年の経済安全保障推進法は、重要物資のサプライチェーンの強化、基幹インフラの安全確保、先端的な重要技術の開発支援、特許出願の非公開の4つを柱とする。"},{"t":"qa","s":"経済のグローバル化","imp":2,"q":"法人税などの税率が極端に低いか、まったく課税しない国・地域で、多国籍企業や富裕層の課税逃れに利用されるものを何というか。","a":"タックス・ヘイブン","alt":["タックスヘイブン","租税回避地"],"e":"本来課税されるべき国の税収が失われ、課税の不公平を生む。対策として、OECDとG20が主導し、2021年に約140の国・地域が法人税の国際的な最低税率を15％とすることで合意した。"},{"t":"ex","s":"国際金融危機","imp":2,"q":"1997年のアジア通貨危機が起きた仕組みを説明せよ。","a":"タイなどのアジア諸国は、自国通貨をドルに連動させる制度のもとで、海外から短期の資金を大量に受け入れていた。しかしヘッジファンドなどによる通貨の売り浴びせをきっかけに資金が一気に流出し、タイの通貨バーツが暴落して、インドネシアや韓国などにも危機が広がった。IMFは緊急融資の条件として、緊縮財政や金融機関の整理などを求めた。","e":"ポイント：①ドルに連動させた為替制度と短期資金の大量流入 ②投機的な売りをきっかけとする資金の急激な流出 ③バーツの暴落からインドネシア・韓国などへ波及 ④IMFの融資と、条件としての緊縮財政など"},{"t":"qa","s":"国際金融危機","imp":2,"q":"アメリカで信用力の低い個人向けに貸し出された住宅ローンで、2007年ごろから返済の焦げ付きが急増し、世界的な金融危機の発端となったものを何というか。","a":"サブプライムローン","alt":["サブプライム・ローン"],"e":"このローンは他の債権と組み合わされた証券化商品として世界中の金融機関に販売されていたため、住宅価格が下落して返済が滞ると、損失が世界に広がった。"},{"t":"qa","s":"国際金融危機","imp":3,"q":"2008年9月にアメリカの大手投資銀行が経営破綻し、世界的な金融危機と世界同時不況の引き金となった出来事を何というか。","a":"リーマン・ショック","alt":["リーマンショック"],"e":"サブプライムローン問題で金融不安が広がる中、大手投資銀行リーマン・ブラザーズが破綻した。危機に対処するため、新興国を含むG20首脳会合が始まった。"},{"t":"mc","s":"国際金融危機","imp":2,"q":"国際的な金融危機に関する記述として最も適当なものを一つ選べ。","c":["2009年にギリシャの財政赤字の過少報告が発覚したことをきっかけに、ユーロ圏の国々の国債に対する信用不安が広がった","アジア通貨危機は、アメリカの住宅バブルの崩壊によってアジアの金融機関の損失が拡大して起こった","リーマン・ショックは、タイの通貨バーツの暴落をきっかけに起こり、アジア各国に広がった","ギリシャは財政危機を受けてユーロ圏から離脱し、自国通貨を復活させた"],"a":0,"e":"ギリシャ危機はスペインやイタリアなどにも広がり、ユーロ危機となった。アメリカの住宅バブル崩壊が発端となったのはサブプライムローン問題とリーマン・ショックであり、タイのバーツの暴落から始まったのが1997年のアジア通貨危機である。ギリシャはEU・IMFの支援と引き換えに厳しい緊縮財政を受け入れ、ユーロ圏にとどまった。"},{"t":"tf","s":"米中貿易摩擦","imp":2,"q":"2018年以降、アメリカは巨額の対中貿易赤字や知的財産権の侵害などを理由に中国からの輸入品に追加関税を課し、中国も報復関税で対抗した。","a":true,"e":"正しい。関税の応酬は米中貿易摩擦（米中貿易戦争）と呼ばれる。ハイテク分野の覇権争いや安全保障上の対立とも結びついており、WTOを中心とする自由貿易の体制を揺るがし、世界のサプライチェーンにも影響を与えている。"}]});</script>
<script>QDATA.push({"unit":"u24","questions":[{"t":"qa","s":"南北問題","imp":3,"q":"先進国の多くが北半球に、発展途上国の多くがその南側に位置することから名づけられた、先進国と発展途上国の間の経済格差とそれをめぐる問題を何というか。","a":"南北問題","e":"1950年代末にイギリスの銀行家フランクスが用いたのが始まりとされ、東西冷戦（東西問題）と対比した呼び名である。途上国どうしの格差は南南問題という。"},{"t":"qa","s":"南北問題","imp":3,"q":"特定の一次産品（農産物や鉱産物）の生産と輸出に依存している経済構造を何というか。","a":"モノカルチャー経済","alt":["モノカルチャー"],"e":"植民地時代に、宗主国の必要に応じてコーヒー・カカオ・綿花などの単一作物の栽培や鉱物資源の採掘を押しつけられたことが起源である。一次産品は天候や景気で価格が大きく変動するため、経済が不安定になりやすい。"},{"t":"mc","s":"南北問題","imp":1,"q":"ある途上国の輸出物価指数が100から80に下がり、輸入物価指数が100から125に上がった。交易条件指数（輸出物価指数÷輸入物価指数×100）の変化とその意味として最も適当なものを一つ選べ。","c":["100から64に悪化し、同じ量を輸出しても以前より少ない量しか輸入できなくなった","100から64に改善し、同じ量を輸出して以前より多くの量を輸入できるようになった","100から156に改善し、同じ量を輸出して以前より多くの量を輸入できるようになった","100から45に悪化し、同じ量を輸出しても以前より少ない量しか輸入できなくなった"],"a":0,"e":"80÷125×100＝64なので、交易条件指数は100から64に下がった（悪化した）。交易条件は輸出品1単位でどれだけの輸入品を買えるかを示し、数値が下がると同じ量を輸出しても買える輸入品が減る。156は分母と分子を逆にした値、45は125から80を引いた値で、計算方法の誤りである。一次産品の価格が工業製品より相対的に下がると、途上国の交易条件はこのように悪化する。"},{"t":"ex","s":"南北問題","imp":3,"q":"南北問題が生じた原因を、植民地支配とモノカルチャー経済にふれて説明せよ。","a":"多くの途上国は、かつて先進国の植民地として、宗主国の必要に応じた特定の一次産品を生産させられた。独立後もこのモノカルチャー経済が残り、一次産品の輸出に依存している。一次産品は価格が不安定で、工業製品に比べて値下がりしやすく交易条件が悪化するため、工業化に必要な資金を蓄えられず、先進国との格差が広がった。","e":"ポイント：①植民地支配の歴史 ②モノカルチャー経済と一次産品への依存 ③一次産品の価格の不安定さと交易条件の悪化 ④工業化の資金が不足し格差が拡大"},{"t":"tf","s":"南北問題","imp":2,"q":"一次産品は工業製品と比べて天候や景気の影響を受けにくく価格が安定しているため、一次産品の輸出に依存する途上国の経済は安定しやすい。","a":false,"e":"誤り。一次産品は天候や景気、投機的な取引の影響を受けて価格が大きく変動しやすい。正しくは「価格が不安定なため、一次産品に依存する途上国の経済は不安定になりやすい」。"},{"t":"qa","s":"UNCTAD","imp":3,"q":"南北問題を話し合うため、1964年に国連総会の機関として設けられた会議を何というか。","a":"国連貿易開発会議","alt":["UNCTAD","アンクタッド"],"e":"第1回会議はジュネーブで開かれた。途上国はこの会議の際に77か国グループ（G77）を結成し、先進国に貿易条件の改善を求めた。"},{"t":"qa","s":"UNCTAD","imp":1,"q":"UNCTADの初代事務局長として、途上国の経済発展のための貿易政策を提言する報告を第1回会議に提出した、アルゼンチン出身の経済学者は誰か。","a":"プレビッシュ","alt":["ラウル・プレビッシュ","R.プレビッシュ"],"e":"この報告はプレビッシュ報告と呼ばれ、一次産品の価格の安定、途上国の製品に対する特恵関税、先進国による援助の拡大などを求めた。"},{"t":"qa","s":"UNCTAD","imp":3,"q":"プレビッシュ報告に示された、途上国の立場を表すスローガン「（　）より貿易を」の（　）に入る語を答えよ。","a":"援助","e":"一時的な援助に頼るより、貿易条件を改善して途上国が自ら輸出で稼げるようにすることが重要だという考え方である。「貿易より援助を」と逆にするひっかけに注意する。"},{"t":"mc","s":"UNCTAD","imp":2,"q":"UNCTADの第1回会議で、途上国の立場から求められた内容として適当でないものを一つ選べ。","c":["途上国が先進国からの工業製品の輸入に課している関税を撤廃すること","一次産品の価格を安定させるための国際的な商品協定を結ぶこと","途上国からの輸入品に対して、先進国が一般より低い関税率を適用すること","先進国が国民所得の1％を途上国への援助にあてる目標を掲げること"],"a":0,"e":"途上国が求めたのは、一次産品の価格の安定（国際商品協定）、途上国の製品に対する特恵関税、先進国の援助目標（国民所得の1％）などである。途上国は自国の産業を育てる立場にあり、先進国からの工業製品に対する自国の関税の撤廃は求めていない。特恵関税は1970年代に一般特恵関税として実現した。"},{"t":"tf","s":"UNCTAD","imp":2,"q":"プレビッシュ報告は、途上国の経済発展には貿易条件の改善よりも先進国からの援助の拡大が重要であるとして、「貿易より援助を」と訴えた。","a":false,"e":"誤り。正しくは「援助より貿易を」と訴えた。途上国が輸出によって自立的に発展できるよう、一次産品の価格の安定や特恵関税などの貿易条件の改善を重視した。"},{"t":"qa","s":"資源ナショナリズム","imp":3,"q":"発展途上国が、自国の天然資源の開発や管理の主権を主張し、先進国の企業による支配から取り戻そうとする動きを何というか。","a":"資源ナショナリズム","e":"1960年代から高まり、産油国による石油産業の国有化やOPECによる原油価格の引き上げはその代表例である。"},{"t":"qa","s":"資源ナショナリズム","imp":2,"q":"1962年の国連総会で決議された、各国が自国の天然資源を自由に開発・処分できる権利を何というか。","a":"天然資源に対する恒久主権","alt":["天然資源の恒久主権","恒久主権"],"e":"資源ナショナリズムの国際的な根拠となり、1974年の新国際経済秩序（NIEO）樹立宣言にも盛り込まれた。"},{"t":"qa","s":"資源ナショナリズム","imp":3,"q":"1960年に、イラン・イラク・クウェート・サウジアラビア・ベネズエラの5か国が、国際石油資本（メジャー）に対抗して結成した組織を何というか。","a":"石油輸出国機構","alt":["OPEC","オペック"],"e":"当時は欧米の国際石油資本が原油の生産と価格を支配していた。OPECは1970年代に原油価格の決定権を握った。1968年にはアラブの産油国によるOAPEC（アラブ石油輸出国機構）も結成された。"},{"t":"qa","s":"資源ナショナリズム","imp":2,"q":"1973年の第4次中東戦争をきっかけに、アラブ産油国の石油戦略で原油価格が大幅に引き上げられ、世界経済が混乱したことを何というか。","a":"第1次石油危機","alt":["第一次石油危機","石油危機","第1次オイル・ショック","オイル・ショック","オイルショック"],"e":"原油価格は約4倍に上昇し、日本では「狂乱物価」と呼ばれる激しいインフレが起き、1974年には戦後初のマイナス成長となった。1979年にはイラン革命をきっかけに第2次石油危機が起きた。"},{"t":"qa","s":"資源ナショナリズム","imp":3,"q":"1974年の国連資源特別総会で採択された、天然資源に対する恒久主権、一次産品の価格の安定、多国籍企業の規制などを求めた宣言を何というか。","a":"新国際経済秩序樹立宣言","alt":["NIEO樹立宣言","新国際経済秩序（NIEO）樹立宣言","NIEO","新国際経済秩序"],"e":"石油危機で発言力を強めた途上国が、数の力を背景に国連総会で採択させた。先進国に有利な従来の国際経済秩序を、途上国にとって公正なものへ改めることをめざした。"},{"t":"tf","s":"資源ナショナリズム","imp":2,"q":"新国際経済秩序（NIEO）樹立宣言は、石油危機で打撃を受けた先進国が主導し、資源の安定的な供給を確保するために採択したものである。","a":false,"e":"誤り。正しくは、途上国が主導して採択させたものである。天然資源に対する恒久主権や一次産品の価格の安
