<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style>
<title>公共・政経 一問一答</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPMincho:wght@400;700&display=swap">
<style>
/* Layout: one 760px column of white answer sheets on a cool desk. The phone is the main device: the day's work sits at the top, and the quiz keeps its answer buttons in a dock at the bottom of the screen. */
:root {
  --desk: #EDF0F5;
  --paper: #FFFFFF;
  --paper-2: #F5F7FB;
  --rule: #D5DEEA;
  --ink: #1E2329;
  --ink-2: #4F5866;
  --ink-3: #6E7887;
  --red: #C8203A;          /* 赤ペン: grading marks, mark-sheet print */
  --red-soft: #FCEBEE;
  --on-red: #FFFFFF;
  --ans: #B03A08;          /* 暗記ペン orange: answers in reading mode */
  --marker: #FFF0A0;       /* 蛍光ペン: the correct choice */
  --ok: #157556;
  --ng: #C8203A;
  --new: #D5DEEA;
  --lv1: #C8203A;          /* 要復習 */
  --lv2: #D1860B;          /* うろ覚え */
  --lv3: #6DB58A;          /* 覚えた */
  --lv4: #157556;          /* 定着 */
  --heat1: #D3EADD; --heat2: #98CDAE; --heat3: #4FA57A; --heat4: #157556;
  --sheet: rgba(212, 28, 50, 0.88); /* 赤シート */
  --focus: #2B5CB8;
  --shadow: 0 1px 2px rgba(23, 35, 60, .06), 0 6px 20px rgba(23, 35, 60, .05);
  --f-ui: "BIZ UDPGothic", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
  --f-q: "BIZ UDPMincho", "Hiragino Mincho ProN", "Yu Mincho", "YuMincho", "Noto Serif JP", serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --desk: #121519; --paper: #1B1F25; --paper-2: #232830; --rule: #353D49; --ink: #E8EBF0; --ink-2: #B3BBC7; --ink-3: #8F98A6;
    --red: #FF6B7F; --red-soft: #3B1F26; --on-red: #1B1F25; --ans: #FFA46B; --marker: #514914; --ok: #4CC79A; --ng: #FF6B7F;
    --new: #353D49; --lv1: #FF6B7F; --lv2: #F2B455; --lv3: #2F7D58; --lv4: #4CC79A;
    --heat1: #1E3A2D; --heat2: #2A5E45; --heat3: #3B8B63; --heat4: #4CC79A;
    --sheet: rgba(196, 34, 56, 0.92); --focus: #8DB2FF; --shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 6px 20px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --desk: #121519; --paper: #1B1F25; --paper-2: #232830; --rule: #353D49; --ink: #E8EBF0; --ink-2: #B3BBC7; --ink-3: #8F98A6;
  --red: #FF6B7F; --red-soft: #3B1F26; --on-red: #1B1F25; --ans: #FFA46B; --marker: #514914; --ok: #4CC79A; --ng: #FF6B7F;
  --new: #353D49; --lv1: #FF6B7F; --lv2: #F2B455; --lv3: #2F7D58; --lv4: #4CC79A;
  --heat1: #1E3A2D; --heat2: #2A5E45; --heat3: #3B8B63; --heat4: #4CC79A;
  --sheet: rgba(196, 34, 56, 0.92); --focus: #8DB2FF; --shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 6px 20px rgba(0, 0, 0, .25);
  color-scheme: dark;
}
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--desk); color: var(--ink); font-family: var(--f-ui); font-size: 15px; line-height: 1.7; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
* { box-sizing: border-box; }
h1, h2, h3, p { margin: 0; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

.wrap { max-width: 760px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.view { padding-bottom: 40px; min-height: 100%; }
#v-quiz { padding-bottom: 0; }

/* bands */
.masthead { background: var(--paper); border-bottom: 1px solid var(--rule); }
.masthead .wrap { padding-block: 18px 14px; display: grid; gap: 4px; }
.eyebrow { font-size: 12px; letter-spacing: .08em; color: var(--ink-3); }
.title { font-family: var(--f-q); font-weight: 700; font-size: clamp(23px, 6vw, 32px); line-height: 1.3; text-wrap: balance; }
.stamp { display: inline-block; vertical-align: .25em; margin-left: .45em; font-family: var(--f-ui); font-size: 13px; letter-spacing: .12em; color: var(--red); border: 2px solid var(--red); border-radius: 6px; padding: 1px 6px 1px 8px; transform: rotate(-5deg); }
.countdown { font-size: 13.5px; color: var(--ink-2); }
.countdown b { color: var(--red); font-size: 17px; font-variant-numeric: tabular-nums; margin-left: 2px; }

.sheet { background: var(--paper); border: 1px solid var(--rule); border-radius: 10px; box-shadow: var(--shadow); padding: 18px; margin-top: 14px; }
.sheet h2 { font-size: 15px; font-weight: 700; }
.sec-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.sec-tools { display: flex; gap: 4px; }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 9px 14px; border-radius: 8px; border: 1.5px solid var(--rule); background: var(--paper); color: var(--ink); font-weight: 700; font-size: 14.5px; line-height: 1.3; cursor: pointer; text-align: center; }
.btn:hover:not(:disabled) { border-color: var(--ink-3); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.btn.primary:hover:not(:disabled) { border-color: var(--ink); opacity: .92; }
.btn.red { background: var(--red); border-color: var(--red); color: var(--on-red); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--ink-2); }
.btn.ghost:hover:not(:disabled) { border-color: var(--rule); }
.btn.small { min-height: 34px; padding: 5px 10px; font-size: 13px; }
.btn.big { min-height: 58px; font-size: 16.5px; }
.btn.wide { width: 100%; }
.pill { display: inline-block; min-width: 1.6em; padding: 0 6px; border-radius: 999px; background: var(--paper-2); color: var(--ink); font-size: 12px; font-variant-numeric: tabular-nums; border: 1px solid var(--rule); }
.btn.primary .pill { background: transparent; color: inherit; border-color: currentColor; }
.linkbtn { background: none; border: 0; padding: 4px 0; color: var(--ink-3); text-decoration: underline; cursor: pointer; font-size: 13px; }
.hint { margin-top: 10px; font-size: 12.5px; color: var(--ink-3); line-height: 1.6; }

/* sync */
.sync { font-size: 12px; color: var(--ink-3); display: inline-flex; align-items: center; gap: 6px; }
.sync::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--new); }
.sync.synced::before { background: var(--ok); }
.sync.error::before, .sync.waiting::before { background: var(--red); }

/* today */
.t-main { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 16px; align-items: center; }
.ring { width: 96px; height: 96px; position: relative; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); display: block; }
.ring circle { fill: none; stroke-width: 9; }
.ring .bg { stroke: var(--new); }
.ring .fg { stroke: var(--red); stroke-linecap: round; transition: stroke-dashoffset .4s; }
.ring .lab { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; line-height: 1.15; }
.ring .lab b { font-size: 24px; font-variant-numeric: tabular-nums; }
.ring .lab small { display: block; font-size: 11px; color: var(--ink-3); }
.t-nums { display: grid; gap: 2px; min-width: 0; }
.t-row { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 14px; font-size: 13.5px; color: var(--ink-2); }
.t-row b { font-size: 23px; color: var(--ink); font-variant-numeric: tabular-nums; margin: 0 2px; }
.t-est { font-size: 13px; color: var(--ink-3); }
.t-streak { font-size: 13px; color: var(--ink-2); }
.t-streak b { color: var(--red); font-variant-numeric: tabular-nums; }
.t-actions { display: grid; gap: 8px; margin-top: 14px; }
.t-sub { display: flex; flex-wrap: wrap; gap: 8px; }
.t-sub .btn { flex: 1 1 150px; }
.note { margin-top: 12px; font-size: 13px; color: var(--ink-2); background: var(--paper-2); border: 1px solid var(--rule); border-radius: 8px; padding: 9px 12px; line-height: 1.65; }
.note b { color: var(--ink); }
.note.warn { border-color: var(--lv2); }
.note.done { border-color: var(--ok); }

/* progress */
.big2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
.big2 > div { display: grid; }
.big2 .k { font-size: 12px; color: var(--ink-3); }
.big2 b { font-family: var(--f-q); font-size: 34px; line-height: 1.15; font-variant-numeric: tabular-nums; }
.big2 b small { font-family: var(--f-ui); font-size: 15px; margin-left: 1px; }
.big2 .sub { font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.stack5 { display: flex; height: 12px; border-radius: 99px; overflow: hidden; background: var(--new); }
.stack5 i { display: block; height: 100%; }
.stack5 .l1 { background: var(--lv1); } .stack5 .l2 { background: var(--lv2); } .stack5 .l3 { background: var(--lv3); } .stack5 .l4 { background: var(--lv4); }
.legend5 { list-style: none; padding: 0; margin: 8px 0 0; display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--ink-2); }
.legend5 li { display: inline-flex; align-items: center; gap: 5px; font-variant-numeric: tabular-nums; }
.legend5 i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; background: var(--new); }
.legend5 .l1 { background: var(--lv1); } .legend5 .l2 { background: var(--lv2); } .legend5 .l3 { background: var(--lv3); } .legend5 .l4 { background: var(--lv4); }
.tiers { margin-top: 14px; display: grid; }
.tier-row { display: grid; grid-template-columns: 3.6em minmax(0, 1fr); gap: 10px; align-items: start; padding: 10px 0; border-top: 1px dashed var(--rule); }
.tier-stars { color: var(--red); font-size: 13px; letter-spacing: 1px; padding-top: 1px; white-space: nowrap; }
.tier-body { display: grid; gap: 5px; min-width: 0; }
.tier-line { display: flex; justify-content: space-between; align-items: baseline; gap: 4px 10px; flex-wrap: wrap; font-size: 13px; color: var(--ink-2); }
.tier-line b { color: var(--ink); font-variant-numeric: tabular-nums; }
.tier-body .stack5 { height: 8px; }
.fc { font-size: 12.5px; color: var(--ink-3); }
.fc-ok { color: var(--ok); font-weight: 700; }
.fc-late { color: var(--lv2); font-weight: 700; }

/* units */
.urow { display: grid; grid-template-columns: 1.8em minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--rule); }
.urow:last-child { border-bottom: 0; }
.u-no { font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.u-mid { display: grid; gap: 4px; min-width: 0; }
.u-title { font-weight: 700; font-size: 14.5px; line-height: 1.4; }
.u-line { display: flex; align-items: center; gap: 8px; min-width: 0; }
.u-line .stack5 { flex: 1; height: 7px; min-width: 40px; }
.u-num { font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; white-space: nowrap; }
.u-due { color: var(--lv1); font-weight: 700; }
.u-btns { display: flex; gap: 4px; }
.part-name { font-family: var(--f-q); font-weight: 700; font-size: 16px; border-bottom: 2px solid var(--ink); padding-bottom: 3px; margin-top: 14px; }
.part-name:first-child { margin-top: 0; }

/* heat */
.heat { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; max-width: 340px; }
.heat .dow { font-size: 10.5px; color: var(--ink-3); text-align: center; }
.heat i { display: block; aspect-ratio: 1; max-width: 100%; border-radius: 4px; background: var(--new); }
.heat i.h1 { background: var(--heat1); } .heat i.h2 { background: var(--heat2); } .heat i.h3 { background: var(--heat3); } .heat i.h4 { background: var(--heat4); }
.heat i.fut { background: transparent; border: 1px dashed var(--rule); }
.heat i.now { outline: 2px solid var(--ink); outline-offset: -2px; }
.heat-stats { display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: 13px; color: var(--ink-2); margin-top: 12px; }
.heat-stats b { font-size: 19px; color: var(--ink); font-variant-numeric: tabular-nums; margin-right: 2px; }
.heat-key { display: flex; align-items: center; gap: 4px; font-size: 11px; color: var(--ink-3); margin-top: 8px; }
.heat-key i { width: 11px; height: 11px; border-radius: 3px; display: inline-block; background: var(--new); }
.heat-key .h1 { background: var(--heat1); } .heat-key .h2 { background: var(--heat2); } .heat-key .h3 { background: var(--heat3); } .heat-key .h4 { background: var(--heat4); }

/* options */
.opt { display: grid; grid-template-columns: 6.5em minmax(0, 1fr); gap: 10px; align-items: start; padding: 8px 0; }
.opt + .opt { border-top: 1px dashed var(--rule); }
.opt-label { font-size: 13px; color: var(--ink-2); padding-top: 8px; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { min-height: 36px; padding: 6px 12px; border-radius: 999px; border: 1.5px solid var(--rule); background: var(--paper); color: var(--ink-2); font-size: 13.5px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--paper); font-weight: 700; }
details.sheet > summary { cursor: pointer; font-weight: 700; font-size: 15px; list-style: none; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
details.sheet > summary::-webkit-details-marker { display: none; }
details.sheet > summary::after { content: "＋"; color: var(--ink-3); font-weight: 400; }
details.sheet[open] > summary::after { content: "－"; }
details.sheet[open] > summary { margin-bottom: 12px; }
.pick-part { margin-top: 10px; }
.pick-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; border-bottom: 2px solid var(--ink); padding-bottom: 3px; }
.pick-head h3 { font-family: var(--f-q); font-size: 15px; }
.pick { display: grid; grid-template-columns: auto auto minmax(0, 1fr); gap: 8px; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--rule); cursor: pointer; font-size: 14px; }
.pick input { width: 20px; height: 20px; margin: 0; accent-color: var(--red); }
.custom-start { display: flex; align-items: center; gap: 12px; margin-top: 14px; flex-wrap: wrap; }
.custom-start .info { flex: 1 1 200px; font-size: 13px; color: var(--ink-2); }
.custom-start .info b { color: var(--ink); font-variant-numeric: tabular-nums; }

/* search, lists */
.inp { width: 100%; font: inherit; font-size: 16px; padding: 11px 12px; border: 1.5px solid var(--rule); border-radius: 8px; background: var(--paper-2); color: var(--ink); }
.inp::placeholder { color: var(--ink-3); }
textarea.inp { min-height: 104px; resize: vertical; line-height: 1.65; }
.results:not(:empty) { margin-top: 8px; }
.res-note { font-size: 12.5px; color: var(--ink-3); margin-top: 8px; }
.ritem { padding: 14px 0; border-bottom: 1px solid var(--rule); display: grid; gap: 8px; }
.ritem:last-child { border-bottom: 0; }
.r-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-3); }
.r-q { font-family: var(--f-q); font-size: 16px; line-height: 1.85; }
.r-choices { margin: 0; padding-left: 0; list-style: none; display: grid; gap: 2px; font-size: 13.5px; color: var(--ink-2); }
.r-choices li { display: grid; grid-template-columns: 1.6em minmax(0, 1fr); }
.r-a { position: relative; border-radius: 6px; padding: 8px 12px; background: var(--paper-2); border: 1px solid var(--rule); cursor: pointer; }
.r-ans { color: var(--ans); font-weight: 700; }
.r-ans.long { font-weight: 400; display: block; line-height: 1.8; }
.r-alt { font-size: 12.5px; color: var(--ink-3); margin-left: 4px; }
.r-e { margin-top: 6px; font-size: 13.5px; color: var(--ink-2); line-height: 1.8; }
.sheet-on .r-a:not(.peek) { background: var(--sheet); border-color: transparent; min-height: 44px; }
.sheet-on .r-a:not(.peek) * { color: transparent !important; }
.sheet-on .r-a:not(.peek)::after { content: "タップでめくる"; position: absolute; right: 10px; top: 10px; font-size: 11px; color: rgba(255, 255, 255, .9); letter-spacing: .05em; }

.chip { display: inline-block; border: 1px solid var(--rule); border-radius: 999px; padding: 1px 8px; background: var(--paper-2); color: var(--ink-2); font-size: 12px; line-height: 1.6; }
.chip.type { border-color: var(--ink-3); color: var(--ink); font-weight: 700; }
.stars { color: var(--red); letter-spacing: 1px; font-size: 12px; }
.stars .dim { color: var(--rule); }
.lv { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: var(--ink-3); }
.lv::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--new); }
.lv[data-l="1"] { color: var(--lv1); } .lv[data-l="1"]::before { background: var(--lv1); }
.lv[data-l="2"] { color: var(--lv2); } .lv[data-l="2"]::before { background: var(--lv2); }
.lv[data-l="3"]::before { background: var(--lv3); }
.lv[data-l="4"] { color: var(--ok); } .lv[data-l="4"]::before { background: var(--lv4); }

.howto ol { margin: 10px 0 0; padding-left: 1.4em; display: grid; gap: 8px; font-size: 14px; color: var(--ink-2); }
.howto b { color: var(--ink); }
.foot { margin-top: 18px; font-size: 12.5px; color: var(--ink-3); display: grid; gap: 6px; }
.reset-confirm { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.backup { border-top: 1px solid var(--rule); padding-top: 10px; margin-top: 4px; display: grid; gap: 6px; }
.backup b { color: var(--ink-2); }
.bk-btns { display: flex; flex-wrap: wrap; gap: 8px; }
.bk-msg { color: var(--ok); font-weight: 700; }
.bk-msg:empty { display: none; }
.bk-msg.bad { color: var(--ng); }
.loading { padding: 40px 0; color: var(--ink-2); display: grid; gap: 12px; justify-items: start; }

/* quiz */
.qbar, .readbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--paper); border-bottom: 1px solid var(--rule); }
.qbar .wrap, .readbar .wrap { display: flex; align-items: center; gap: 12px; padding-block: 8px; }
.qprog { flex: 1; min-width: 0; display: grid; gap: 4px; }
.qprog .count { font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.track { height: 6px; background: var(--new); border-radius: 99px; overflow: hidden; }
.track i { display: block; height: 100%; background: var(--ink); transition: width .25s; }
.qscore { display: flex; gap: 10px; font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.qscore .ok { color: var(--ok); } .qscore .ng { color: var(--ng); }
.qcard { padding: 20px 18px 22px; }
.qmeta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.qno { font-family: var(--f-q); font-size: 15px; font-weight: 700; color: var(--ink-2); margin-top: 14px; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.qno .again { font-family: var(--f-ui); font-size: 12px; font-weight: 700; color: var(--red); border: 1px solid currentColor; border-radius: 4px; padding: 0 5px; }
.qtext { font-family: var(--f-q); font-size: 18px; line-height: 1.9; margin-top: 4px; }
.ask { margin-top: 16px; display: grid; gap: 10px; }
.lbl { font-size: 13px; color: var(--ink-2); }
.think { margin-top: 16px; font-size: 13px; color: var(--ink-3); }

.choices { margin-top: 18px; display: grid; gap: 10px; }
.choice { display: grid; grid-template-columns: 42px minmax(0, 1fr); gap: 12px; align-items: start; width: 100%; padding: 12px 14px; border: 1.5px solid var(--rule); border-radius: 8px; background: var(--paper); color: var(--ink); text-align: left; font-size: 15.5px; line-height: 1.7; cursor: pointer; }
.choice:hover:not(:disabled) { border-color: var(--ink-3); background: var(--paper-2); }
.choice:disabled { cursor: default; }
.oval { width: 42px; height: 22px; margin-top: 2px; border: 1.5px solid var(--red); border-radius: 50%; display: grid; place-items: center; color: var(--red); font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; }

<script>QDATA.push({"unit":"u01","questions":[{"t":"qa","s":"青年期の位置づけ","imp":3,"q":"ルソーが『エミール』の中で「わたしたちは、いわば二回この世に生まれる。一回目は存在するために、二回目は生きるために」と述べたことから、青年期は何と呼ばれるか。","a":"第二の誕生","e":"ルソーは18世紀のフランスで活躍した思想家で、『エミール』は子どもの教育を論じた教育論である。「はじめは人間として、つぎには男性または女性として生まれる」とも述べ、青年期を自我がめざめ、精神的に生まれ変わる時期ととらえた。"},{"t":"qa","s":"青年期の位置づけ","imp":3,"q":"青年期に、親の保護や監督から精神的に離れて自立しようとすることを、アメリカの心理学者ホリングワースは何と呼んだか。","a":"心理的離乳","e":"乳児が乳離れ（離乳）するように、青年は親から精神的に離れていくという意味である。親への反発（第二反抗期）として現れることも多い。"},{"t":"qa","s":"青年期の位置づけ","imp":3,"q":"子どもの集団にも大人の集団にも完全には属さず、両者の間で不安定な位置にある青年を、レヴィンは何と呼んだか。","a":"マージナル・マン","alt":["マージナルマン","境界人","周辺人"],"e":"境界人・周辺人とも訳される。レヴィンはドイツ出身でアメリカで活躍した心理学者で、葛藤（コンフリクト）の3類型でも知られる。人名と用語の組み合わせ（心理的離乳＝ホリングワース、第二の誕生＝ルソー）は共テで入れ替えのひっかけになりやすい。"},{"t":"tf","s":"青年期の位置づけ","imp":2,"q":"第二次性徴とは、生まれたときから見られる男女の生殖器の違いのことである。","a":false,"e":"誤り。生まれたときからの生殖器の違いは第一次性徴である。第二次性徴は、思春期に性ホルモンの働きで現れる身体の変化（声変わり、体毛、乳房の発達など）であり、この変化をきっかけに自分の身体や性への意識が高まり、心理的な動揺も生じやすい。"},{"t":"mc","s":"青年期の位置づけ","imp":2,"q":"反抗期についての記述として最も適当なものを一つ選べ。","c":["第一反抗期は3歳前後に見られ、自我が芽生えた幼児が親の指示に「いや」と言って自己主張することが典型である。","第一反抗期は小学校高学年に見られ、親や教師の権威そのものを論理的に批判することが特徴である。","第二反抗期は成人後に見られ、職場の上司や社会制度への反発として現れることが特徴である。","第二反抗期は、青年が親から精神的に自立していく過程とは無関係な一時的な現象である。"],"a":0,"e":"第一反抗期は3歳前後（2〜4歳ごろ）の幼児期に見られる、自我の芽生えによる自己主張である。「小学校高学年」「成人後」は時期が誤り。第二反抗期は思春期（中学生のころ）に見られ、親や大人の権威への反発として現れるもので、心理的離乳＝親からの精神的自立の過程の一部であるから「無関係」も誤り。"},{"t":"ex","s":"青年期の位置づけ","imp":2,"q":"「青年期の延長」とは何か。それが生じた理由とあわせて説明せよ。","a":"青年期の始まりが早まる一方で終わりが遅くなり、青年期が長くなる傾向のことである。栄養状態の改善などで身体的な成熟が早まる一方、産業化や社会の高度化によって高学歴化が進み、職業的・経済的に自立するまでに必要な期間が長くなったため、大人になる時期が遅れている。","e":"ポイント：①始まりの早期化（身体的成熟の早まり）②終わりの遅延（自立の遅れ）③高学歴化・社会の複雑化が背景にあること。"},{"t":"qa","s":"青年期の位置づけ","imp":2,"q":"伝統的な社会で、子どもが大人の仲間入りをするときなどに行われた、人生の節目の儀礼を何というか。","a":"通過儀礼","alt":["イニシエーション"],"e":"イニシエーションともいう。日本の武家や貴族の元服・裳着がその例で、現代の成人式にもその名残がある。通過儀礼を経ると子どもは一気に大人とみなされたため、伝統的な社会には長い青年期はほとんどなかった。"},{"t":"tf","s":"青年期の位置づけ","imp":1,"q":"近代以前の伝統的な社会では、子どもは通過儀礼を経て大人の仲間入りをしたため、子どもと大人の間の長い青年期は、近代以降に社会の変化とともに広がったと考えられている。","a":true,"e":"正しい。伝統的な社会では、一定の年齢で成人儀礼を経ると一人前とされた。産業化によって職業に必要な知識・技能が高度になり、学校教育の期間が長くなった近代以降に、青年期が独立した時期として広がった。"},{"t":"qa","s":"青年期の位置づけ","imp":1,"q":"青年期を、激しい感情の起伏や動揺に満ちた「疾風怒濤の時代」と表現したアメリカの心理学者は誰か。","a":"ホール","alt":["スタンレー・ホール","スタンリー・ホール","G.S.ホール"],"e":"疾風怒濤はドイツの文学運動（シュトゥルム・ウント・ドラング）の名にちなむ表現である。青年期は自我のめざめとともに、不安・劣等感・孤独感などが強まりやすい時期とされる。"},{"t":"qa","s":"エリクソン","imp":3,"q":"人間の一生を8つの段階に分け、各段階に固有の発達課題と危機があるとするライフサイクル論を唱えた精神分析学者は誰か。","a":"エリクソン","alt":["E.H.エリクソン","エリク・エリクソン"],"e":"ドイツ生まれでアメリカで活躍した。青年期の課題を「アイデンティティ（自我同一性）の確立」とし、青年期を「心理・社会的モラトリアム」の時期とした。発達課題という語ではハヴィガーストとも混同しやすい。"},{"t":"qa","s":"エリクソン","imp":3,"q":"エリクソンが青年期の発達課題とした、「自分は自分である」という一貫した感覚をもち、社会の中での自分の役割や位置を確信できるようになることを何というか。","a":"アイデンティティの確立","alt":["アイデンティティ","自我同一性の確立","自我同一性","アイデンティティ（自我同一性）の確立"],"e":"過去・現在・未来を通じて自分が同じ自分であるという感覚（連続性・斉一性）と、それが他者や社会から認められているという感覚からなる。確立できず自分を見失った状態をアイデンティティの拡散という。"},{"t":"qa","s":"エリクソン","imp":3,"q":"エリクソンが、青年期を、大人としての社会的な責任や義務の遂行が猶予され、試行錯誤が許される期間であるとして名づけたものは何か。","a":"心理・社会的モラトリアム","alt":["モラトリアム","心理社会的モラトリアム"],"e":"モラトリアムはもともと「支払い猶予」を意味する経済用語である。青年はこの猶予期間に、さまざまな役割を試しながら（役割実験）アイデンティティを確立していく。"},{"t":"mc","s":"エリクソン","imp":3,"q":"エリクソンのライフサイクル論における発達段階とその課題の組み合わせとして最も適当なものを一つ選べ。","c":["乳児期 ― 基本的信頼","学童期 ― 親密性","青年期 ― 勤勉性","老年期 ― 生殖性（世代性）"],"a":0,"e":"乳児期は、養育者との関わりを通じて世界や他者への基本的信頼を獲得することが課題である。親密性は成人期初期（前成人期）、勤勉性は学童期、生殖性（世代性：次の世代を育てること）は成人期の課題なので、他は誤り。なお青年期の課題はアイデンティティ、老年期の課題は統合である。"},{"t":"tf","s":"エリクソン","imp":2,"q":"エリクソンによれば、青年期にアイデンティティを確立すると、その後の人生でアイデンティティが揺らいだり問い直されたりすることは一切ない。","a":false,"e":"誤り。エリクソンは、アイデンティティの形成は青年期で始まるのでも終わるのでもなく、生涯にわたって続くものと考えた。成人後も、転職・子育て・退職などの節目でアイデンティティが問い直され、再構成されることがある。青年期はその確立が中心的な課題となる時期である。"},{"t":"ex","s":"エリクソン","imp":3,"q":"エリクソンのいう「アイデンティティの拡散」とはどのような状態か、説明せよ。","a":"自分が何者で、何をしたいのか、社会の中でどう生きていくのかがわからなくなり、自己の一貫性や連続性の感覚を失った状態である。将来の進路などの選択を決められなくなったり、無気力になったり、他者と親密な関係を結べなくなったりする。","e":"ポイント：①自分が何者かわからない（一貫性・連続性の喪失）②将来の選択・決断ができない ③無気力や対人関係の困難として現れる。"},{"t":"qa","s":"エリクソン","imp":2,"q":"エリクソンの発達段階で成人期（壮年期）の課題とされる、子どもや後輩など次の世代を育て、世話をすることへの関心を何というか。","a":"生殖性","alt":["世代性","ジェネラティビティ","生殖性（世代性）"],"e":"これに失敗すると停滞に陥るとされる。なお、成人期初期（前成人期）の課題は親密性（対 孤立）、学童期の課題は勤勉性（対 劣等感）である。"},{"t":"qa","s":"エリクソン","imp":1,"q":"エリクソンの発達段階で老年期の課題とされる、自分の人生を振り返り、それをかけがえのないものとして受け入れることを何というか。","a":"統合","alt":["自我の統合","自我統合","インテグリティ"],"e":"対になる危機は絶望である。人生をやり直せないことへの後悔にとらわれると絶望に陥るとされる。"},{"t":"tf","s":"エリクソン","imp":2,"q":"エリクソンの発達段階論では、各段階に「基本的信頼 対 不信」のように、獲得すべき課題と、それに失敗したときの危機とが対になって示されている。","a":true,"e":"正しい。例えば学童期は「勤勉性 対 劣等感」、青年期は「アイデンティティ（同一性） 対 アイデンティティの拡散（同一性拡散）」である。ここでの危機とは、乗り越えるべき心理的な分かれ目を意味する。"},{"t":"qa","s":"モラトリアム人間","imp":3,"q":"本来は一時的な猶予期間であるはずのモラトリアムにとどまり続け、社会的な責任を負う大人になることを先延ばしにする現代人を「モラトリアム人間」と呼んだ日本の精神分析学者は誰か。","a":"小此木啓吾","e":"1970年代末に『モラトリアム人間の時代』を著した。エリクソンのモラトリアムが「アイデンティティを確立するための積極的な猶予期間」であるのに対し、モラトリアム人間はそこから抜け出そうとしない状態を指す。"},{"t":"mc","s":"モラトリアム人間","imp":2,"q":"モラトリアムについての記述として適当でないものを一つ選べ。","c":["エリクソンは、青年期を社会的な責任や義務の遂行が猶予される期間ととらえた。","モラトリアムという語は、もともと経済用語で支払い猶予を意味する。","小此木啓吾は、猶予の状態にとどまり続ける現代人をモラトリアム人間と呼んだ。","エリクソンは、モラトリアムを大人になることを拒む病的な状態とみなし、否定的にのみとらえた。"],"a":3,"e":"エリクソンはモラトリアムを、青年が社会的な役割を試しながらアイデンティティを確立するための、積極的な意味をもつ猶予期間とした。「否定的にのみとらえた」は誤りである。他の3つは正しい記述である。"},{"t":"qa","s":"ハヴィガースト","imp":2,"q":"人生の各段階で達成すべき課題を「発達課題」として示し、青年期の課題として「両親や他の大人からの情緒的独立」「職業の選択と準備」などをあげたアメリカの教育学者は誰か。","a":"ハヴィガースト","e":"青年期の発達課題には他に「同年代の男女との成熟した関係を結ぶ」「自分の身体を受け入れる」「結婚と家庭生活の準備」「社会的に責任ある行動をとる」「行動の指針となる価値観や倫理体系を身につける」などがある。ライフサイクル論のエリクソンと混同しないこと。"},{"t":"tf","s":"ハヴィガースト","imp":1,"q":"ハヴィガーストのいう発達課題は青年期にのみ設定されたもので、乳幼児期や老年期には発達課題はないとされる。","a":false,"e":"誤り。ハヴィガーストは、乳幼児期から老年期までの各段階に、それぞれ達成すべき発達課題があるとした。ある段階の課題を達成すると幸福になり後の課題も達成しやすくなるが、失敗すると社会から認められず、後の課題の達成も難しくなるとした。"}]});</script>
<script>QDATA.push({"unit":"u01","questions":[{"t":"qa","s":"欲求の階層","imp":3,"q":"人間の欲求は階層をなしており、低次の欲求がある程度満たされると、より高次の欲求が現れるとする欲求階層説を唱えたアメリカの心理学者は誰か。","a":"マズロー","e":"マズローは、最上位の自己実現の欲求を人間らしい成長を求める欲求として重視した。人間の可能性や主体性に注目する人間性心理学の代表的人物である。"},{"t":"qa","s":"欲求の階層","imp":3,"q":"マズローの欲求階層説の5段階を、低次のものから順に答えよ。","a":"生理的欲求・安全の欲求・所属と愛情の欲求・承認の欲求・自己実現の欲求","alt":["生理的欲求・安全の欲求・所属と愛の欲求・承認の欲求・自己実現の欲求","生理的欲求・安全の欲求・所属と愛情の欲求・自尊の欲求・自己実現の欲求","生理的欲求・安全の欲求・社会的欲求・承認の欲求・自己実現の欲求"],"e":"承認の欲求は自尊の欲求、所属と愛情の欲求は社会的欲求とも表記される。下位の4つは欠乏欲求、最上位の自己実現の欲求は成長欲求とよばれる。順番の入れ替え（承認と所属など）は定番のひっかけである。"},{"t":"mc","s":"欲求の階層","imp":2,"q":"次の事例のうち、マズローの欲求階層説における「所属と愛情の欲求」にあたるものとして最も適当なものを一つ選べ。","c":["部活動の仲間に受け入れられ、その一員でありたいと願う。","空腹を満たすために、すぐに食事をとりたいと思う。","大会で好成績をあげ、周囲から認められ尊敬されたいと思う。","災害や犯罪の心配がない、安心して暮らせる家に住みたいと思う。"],"a":0,"e":"集団に受け入れられ、愛情で結ばれたいという欲求が所属と愛情の欲求である。空腹を満たしたいのは生理的欲求、認められ尊敬されたいのは承認（自尊）の欲求、安心して暮らせる家を求めるのは安全の欲求にあたる。"},{"t":"tf","s":"欲求の階層","imp":2,"q":"マズローによれば、生理的欲求や安全の欲求などの低次の欲求がある程度満たされることで、より高次の欲求が強く現れてくる。","a":true,"e":"正しい。例えば飢えに苦しんでいる人にとっては、まず食べることが最優先となり、承認や自己実現の欲求は強く意識されにくい。低次の欲求が満たされるにつれて、より高次の欲求が行動の動機となっていく。"},{"t":"ex","s":"欲求の階層","imp":2,"q":"マズローのいう欠乏欲求と成長欲求の違いを説明せよ。","a":"欠乏欲求は、生理的欲求・安全の欲求・所属と愛情の欲求・承認の欲求のように、不足すると不満や緊張が生じ、満たされればおさまる欲求である。成長欲求は自己実現の欲求のことで、満たされてもおさまることがなく、さらに自分の可能性を伸ばそうとする欲求である。","e":"ポイント：①欠乏欲求＝下位の4つの欲求 ②不足が満たされると解消する ③成長欲求＝自己実現の欲求で、満たされてもさらに高まり続ける。"},{"t":"tf","s":"欲求の階層","imp":1,"q":"食欲や睡眠欲のように生命を維持するための生まれつきの欲求を二次的欲求、愛情や承認を求める欲求のように社会生活の中で形成される欲求を一次的欲求という。","a":false,"e":"誤り。説明が逆である。正しくは、生命維持のための生理的な欲求が一次的欲求（生理的欲求）、社会生活の中で形成される愛情・承認・達成などの欲求が二次的欲求（社会的欲求）である。"},{"t":"qa","s":"葛藤（コンフリクト）","imp":2,"q":"同時に満たすことのできない二つ以上の欲求が存在し、どれを選ぶか決められずに迷う心理状態を何というか。","a":"葛藤","alt":["コンフリクト"],"e":"コンフリクトともいう。レヴィンは葛藤を「接近－接近」「回避－回避」「接近－回避」の3つの型に分類した。"},{"t":"mc","s":"葛藤（コンフリクト）","imp":3,"q":"次の事例のうち、レヴィンのいう「回避－回避」型の葛藤にあたるものとして最も適当なものを一つ選べ。","c":["試験勉強はしたくないが、赤点をとって補習を受けるのも嫌で、どうするか迷っている。","遊園地にも映画にも行きたいが、日曜日はどちらか一方しか行けず、迷っている。","ケーキを食べたいが、太るのは嫌なので、食べるかどうか迷っている。","部活動のレギュラーになれなかったので、別の部に移ることを決めた。"],"a":0,"e":"避けたいもの二つ（勉強と補習）のどちらかを選ばなければならないのが回避－回避型である。遊園地と映画で迷うのは望ましいもの二つの間で迷う接近－接近型、ケーキは一つの対象に魅力と不安が同居する接近－回避型である。別の部に移ると決めた事例は、すでに選択しており葛藤の型の例ではない。"},{"t":"mc","s":"葛藤（コンフリクト）","imp":2,"q":"「海外に留学して語学力を伸ばしたいが、家族と離れて暮らすことや費用がかかることが不安で、決められずにいる」という状態の説明として最も適当なものを一つ選べ。","c":["一つの対象が望ましい面と望ましくない面をあわせもつために生じる、接近－回避型の葛藤である。","望ましい二つの対象のうち一方しか選べないために生じる、接近－接近型の葛藤である。","望ましくない二つの対象のうち、どちらかを選ばざるをえない回避－回避型の葛藤である。","欲求がまったく満たされないことで生じる欲求不満であり、葛藤にはあたらない。"],"a":0,"e":"留学という一つの対象に、語学力が伸びるという魅力と、家族と離れる・費用がかかるという不安が同居しているので接近－回避型である。選択肢が二つの望ましいもの・二つの望ましくないものではないので、接近－接近型・回避－回避型は誤り。迷っている状態なので葛藤にあたる。"},{"t":"ex","s":"葛藤（コンフリクト）","imp":3,"q":"レヴィンによる葛藤の3つの型を、それぞれ説明せよ。","a":"接近－接近型は、望ましいものが二つあり、一方しか選べない場合の葛藤である。回避－回避型は、避けたいものが二つあり、どちらかを選ばなければならない場合の葛藤である。接近－回避型は、一つの対象が望ましい面と望ましくない面をあわせもっている場合の葛藤である。","e":"ポイント：①接近－接近＝望ましいもの二つ ②回避－回避＝避けたいもの二つ ③接近－回避＝一つの対象に魅力と不快が同居。具体例を自分で作れるようにしておくとよい。"},{"t":"tf","s":"葛藤（コンフリクト）","imp":1,"q":"接近－接近型の葛藤は、どちらを選んでも望ましい結果が得られるにもかかわらず、3つの型の中で最も解決しにくく、長く続くとされる。","a":false,"e":"誤り。接近－接近型は、どちらを選んでも満足が得られるため、比較的解決しやすいとされる。回避－回避型や接近－回避型のほうが決断しにくく、その場から逃げ出したり、迷いが長引いたりしやすい。"},{"t":"qa","s":"欲求不満と適応","imp":2,"q":"欲求が何らかの障害によって満たされず、緊張や不安、いらだちが高まった状態を何というか。","a":"欲求不満","alt":["フラストレーション"],"e":"フラストレーションともいう。人は欲求不満を解消しようとして、合理的解決・近道反応・防衛機制などのさまざまな行動をとる（適応行動）。"},{"t":"qa","s":"欲求不満と適応","imp":2,"q":"欲求不満の状態に耐え、それにうまく対処することのできる力を何というか。","a":"欲求不満耐性","alt":["フラストレーション・トレランス","フラストレーション耐性"],"e":"フラストレーション・トレランスともいう。適度な欲求不満を経験し、それを乗り越えることを繰り返す中で高められるとされる。何でもすぐに満たされる環境では育ちにくい。"},{"t":"mc","s":"欲求不満と適応","imp":3,"q":"次の事例のうち、欲求不満に対する「近道反応」にあたるものとして最も適当なものを一つ選べ。","c":["試合に負けた腹いせに、更衣室のロッカーを蹴って壊した。","試合に負けた原因を分析し、苦手なプレーの練習に重点的に取り組んだ。","試合に負けたが、「今日は審判が悪かったから仕方ない」と自分に言い聞かせた。","試合に負けた悔しさを、作曲に打ち込むことで作品として表現した。"],"a":0,"e":"近道反応は、攻撃や八つ当たりなど衝動的・短絡的に欲求不満を解消しようとする行動で、失敗反応ともいう。原因を分析して練習するのは合理的解決、もっともらしい理由で自分を納得させるのは合理化（防衛機制）、悔しさを作品に表現するのは昇華（防衛機制）にあたる。"},{"t":"ex","s":"欲求不満と適応","imp":3,"q":"欲求不満に対する適応のしかたとして、合理的解決・近道反応・防衛機制の違いを説明せよ。","a":"合理的解決は、欲求不満の原因を見きわめ、努力や計画によって筋道を立てて欲求を満たそうとする方法である。近道反応は、攻撃や八つ当たりなど衝動的・短絡的な行動で欲求不満を解消しようとするもので、失敗反応ともいう。防衛機制は、無意識のうちに自我を守り、不安や緊張をやわらげようとする心の働きである。","e":"ポイント：①合理的解決＝理性的・現実的な解決 ②近道反応＝衝動的・短絡的（失敗反応）③防衛機制＝無意識に働く自我の防衛。"},{"t":"qa","s":"防衛機制","imp":3,"q":"欲求不満や葛藤による不安から自我を守るために、無意識のうちに働く心の仕組みを何というか。","a":"防衛機制","e":"フロイトが考え、その娘アンナ・フロイトが整理・体系化した。抑圧・合理化・同一視・投射・反動形成・逃避・退行・置き換え（代償）・昇華などがある。一時的に心を安定させるが、頼りすぎると現実の問題の解決が遅れることもある。"},{"t":"qa","s":"防衛機制","imp":3,"q":"受け入れがたい欲求や不快な記憶を、無意識の中に押しこめて意識にのぼらないようにする防衛機制を何というか。","a":"抑圧","e":"最も基本的な防衛機制とされる。例えば、つらい体験を思い出せなくなる場合である。意識的に我慢する「抑制」とは違い、本人は押しこめたことに気づいていない。"},{"t":"qa","s":"防衛機制","imp":3,"q":"イソップ寓話で、高い所のぶどうに手が届かなかったキツネが「あのぶどうはすっぱいに違いない」と言ったように、もっともらしい理由をつけて自分の失敗や欲求不満を正当化する防衛機制を何というか。","a":"合理化","e":"「すっぱいぶどう」の論理とよばれる。逆に、手に入ったものを実際以上によいものだと思い込む「甘いレモン」の論理も合理化の例である。理屈で自分を納得させる点がポイントである。"},{"t":"qa","s":"防衛機制","imp":3,"q":"好きな相手にわざと冷たくするなど、抑圧した欲求とは正反対の態度や行動をとる防衛機制を何というか。","a":"反動形成","e":"嫌いな上司に必要以上にていねいにふるまうのも反動形成の例である。本心と逆の行動が、不自然なほど強く現れるのが特徴である。"},{"t":"qa","s":"防衛機制","imp":3,"q":"満たされない性的欲求や攻撃的な衝動を、芸術・学問・スポーツなど社会的に価値の高い活動に向けかえる防衛機制を何というか。","a":"昇華","e":"失恋の苦しみを詩や小説に表現する、攻撃的な衝動をボクシングなどのスポーツで発散する、といった例がある。代償（置き換え）のうち、社会的に高く評価される形で欲求を満たすものが昇華である。"}]});</script>
<script>QDATA.push({"unit":"u01","questions":[{"t":"qa","s":"防衛機制","imp":3,"q":"自分の中にある認めたくない感情や欲求を、他人がもっているものとみなす防衛機制を何というか。例えば、自分が相手を嫌っているのに「あの人が私を嫌っている」と思い込むことである。","a":"投射","alt":["投影"],"e":"投影ともいう。自分の欠点を他人の中に見つけて強く非難するのも投射の例である。他者の特性を自分に取り込む同一視とは、向きが逆である点に注意。"},{"t":"qa","s":"防衛機制","imp":3,"q":"あこがれのスポーツ選手と同じ髪型や服装をして、自分もその選手のように優れているかのように感じて満足するなど、他者の優れた特性を自分のものとみなす防衛機制を何というか。","a":"同一視","alt":["同一化"],"e":"同一化ともいう。母校の野球部の活躍を自分の手柄のように誇るのも同一視の例である。幼児が親のふるまいをまねて親の価値観を取り入れることも同一視とよばれ、パーソナリティの形成にも関わる。"},{"t":"mc","s":"防衛機制","imp":3,"q":"「テストの前日なのに勉強に手がつかず、急に部屋の掃除やゲームに没頭してしまった」という行動は、どの防衛機制にあたるか。最も適当なものを一つ選べ。","c":["逃避","退行","反動形成","投射"],"a":0,"e":"困難な状況や不安から目をそらし、別の行動や空想、病気などに逃げこむのが逃避である。退行は以前の発達段階に戻ること、反動形成は本心と反対の態度をとること、投射は自分の感情を他人のものとみなすことなので、いずれもあたらない。"},{"t":"mc","s":"防衛機制","imp":3,"q":"次の事例と防衛機制の組み合わせとして最も適当なものを一つ選べ。","c":["弟が生まれてから、小学生の兄が急に赤ちゃん言葉を使って親に甘えるようになった ― 退行","好きな人に素直になれず、その人に意地悪ばかりしてしまう ― 昇華","自分がずるをしたいと思っているのに、周りの人がずるをしようとしていると疑う ― 同一視","志望校に不合格だったが、あの学校は自分には合わなかったはずだと考えた ― 抑圧"],"a":0,"e":"以前の発達段階に戻って甘えるのは退行である。好きな人に意地悪をするのは本心と逆の行動をとる反動形成、自分のずるい気持ちを他人のものとみなすのは投射、もっともらしい理由で不合格を正当化するのは合理化なので、他の組み合わせは誤り。"},{"t":"qa","s":"防衛機制","imp":3,"q":"子どもを持てない人がペットをわが子のようにかわいがるように、本来の欲求の対象が得られないとき、代わりの対象に欲求を向けて満たそうとする防衛機制を何というか。","a":"置き換え（代償）","alt":["置き換え","代償","代償（置き換え）"],"e":"代償ともいう。欲求や感情を、本来の対象から別の対象に向けかえる働きである。代わりの対象が芸術やスポーツなど社会的に価値の高い活動である場合は、特に昇華とよばれる。"},{"t":"tf","s":"防衛機制","imp":2,"q":"防衛機制とは、本人が自分の不安をはっきり自覚したうえで、意識的に選んで用いる問題解決の方法である。","a":false,"e":"誤り。防衛機制は無意識のうちに働く心の仕組みであり、本人はそれが働いていることに気づかないことが多い。原因を意識的に分析し、努力や計画によって問題を解決しようとするのは合理的解決である。"},{"t":"ex","s":"防衛機制","imp":2,"q":"防衛機制の「同一視」と「投射」の違いを、例をあげて説明せよ。","a":"同一視は、他者の優れた特性を自分のものとみなして満足することで、あこがれの選手と同じ服装をする例がある。投射は、自分の中の認めたくない感情や欲求を他者のものとみなすことで、自分が相手を嫌っているのに相手が自分を嫌っていると思い込む例がある。同一視は他者を自分に取り込み、投射は自分を他者に押しつける点で向きが逆である。","e":"ポイント：①同一視＝他者の特性を自分のものとみなす ②投射＝自分の感情を他者のものとみなす ③両者は向きが逆。具体例を示せるとよい。"},{"t":"qa","s":"フロイトとユング","imp":3,"q":"人間の心には本人が意識していない無意識の領域があり、それが行動に大きな影響を与えると考えて、精神分析を創始したオーストリアの精神科医は誰か。","a":"フロイト","alt":["ジークムント・フロイト"],"e":"夢や言い間違いなどの分析を通じて無意識を探ろうとした（『夢判断』）。心の構造をエス（イド）・自我・超自我の3つでとらえ、防衛機制の考えも示した。"},{"t":"mc","s":"フロイトとユング","imp":2,"q":"フロイトが考えた心の構造についての記述として最も適当なものを一つ選べ。","c":["エス（イド）は、快楽を求める本能的な衝動の源であり、無意識の領域にある。","超自我は、現実の状況を判断し、エスの衝動と外界の要求との調整を行う。","自我は、親のしつけなどが内面化された良心として、エスの衝動を禁止する。","エスは、社会の道徳や規範を取り入れたもので、快楽の追求を抑えようとする。"],"a":0,"e":"エスは快楽を求める本能的衝動（性的エネルギーであるリビドーなど）の源である。現実を判断してエスと超自我、外界の間を調整するのは自我であり、親のしつけなどが内面化されて良心として働くのは超自我である。よって他の3つは役割を取り違えている。"},{"t":"qa","s":"フロイトとユング","imp":2,"q":"スイスの精神科医ユングが、個人の経験を超えて人類に共通して受け継がれているとした、無意識の深い層を何というか。","a":"集合的無意識","alt":["普遍的無意識"],"e":"普遍的無意識ともいう。そこには元型（グレートマザー、老賢人、影など）があり、世界各地の神話や夢に共通するイメージとして現れるとした。フロイトが重視した個人的な無意識との違いがポイントである。"},{"t":"tf","s":"フロイトとユング","imp":1,"q":"ユングは、心のエネルギーや関心が自分の内面に向かいやすい人を外向型、外界の人や物事に向かいやすい人を内向型とよんだ。","a":false,"e":"誤り。説明が逆である。正しくは、関心が自分の内面に向かいやすい人が内向型、外界に向かいやすい人が外向型である。ユングはこれに思考・感情・感覚・直観の4つの心の機能を組み合わせて性格をとらえた。"},{"t":"ex","s":"パーソナリティ","imp":2,"q":"パーソナリティを構成する能力・気質・性格について、それぞれ説明せよ。","a":"パーソナリティ（人格・個性）は能力・気質・性格からなる。能力は知能や技能など物事を成し遂げる力である。気質は生まれつきの感情面の傾向で、遺伝の影響が強い。性格は気質をもとに、環境や経験の中で形づくられる行動や意志の傾向である。","e":"ポイント：①能力＝知能・技能など ②気質＝生まれつきの感情面の傾向（遺伝の影響大）③性格＝気質を基礎に環境・経験で形成される。"},{"t":"mc","s":"パーソナリティ","imp":1,"q":"ドイツの精神医学者クレッチマーが示した、体型と気質の組み合わせとして最も適当なものを一つ選べ。","c":["細長型（やせ型） ― 分裂気質（内気で敏感、非社交的）","肥満型 ― 粘着気質（几帳面で頑固、粘り強い）","闘士型（筋骨型） ― 躁うつ気質（社交的で気分が変わりやすい）","細長型（やせ型） ― 躁うつ気質（社交的で気分が変わりやすい）"],"a":0,"e":"クレッチマーは、細長型＝分裂気質、肥満型＝躁うつ気質（循環気質）、闘士型＝粘着気質と対応させた。肥満型と粘着気質、闘士型と躁うつ気質、細長型と躁うつ気質の組み合わせは誤り。人をいくつかの型に分けてとらえる類型論の代表例である。"},{"t":"qa","s":"パーソナリティ","imp":1,"q":"人のパーソナリティを、外向性・協調性・誠実性・神経症傾向・開放性の5つの特性の組み合わせでとらえる考え方を何というか。","a":"ビッグファイブ","alt":["ビッグ・ファイブ","特性5因子論","5因子モデル","ビッグファイブ理論"],"e":"特性5因子論ともいい、それぞれの特性を「どの程度もっているか」の量で表す特性論の代表である。人を型に分ける類型論（クレッチマーなど）と区別すること。"},{"t":"ex","s":"パーソナリティ","imp":1,"q":"パーソナリティのとらえ方における類型論と特性論の違いを説明せよ。","a":"類型論は、人をいくつかの典型的なタイプ（類型）に分けてパーソナリティをとらえる考え方で、クレッチマーの体型による分類やユングの内向型・外向型がその例である。特性論は、外向性や協調性などの特性をどの程度もっているかの組み合わせでパーソナリティをとらえる考え方で、オールポートが先駆けとなり、ビッグファイブはその代表である。","e":"ポイント：①類型論＝タイプに分ける（クレッチマー・ユング）②特性論＝特性の程度の組み合わせ（オールポート・ビッグファイブ）③類型論はわかりやすいが中間的な人をとらえにくい。"},{"t":"qa","s":"パーソナリティ","imp":1,"q":"パーソナリティを「個人の内部にあって、その人に特徴的な行動や思考を決定する、心身の力動的な体制」と定義し、成熟したパーソナリティの条件を示したアメリカの心理学者は誰か。","a":"オールポート","e":"成熟したパーソナリティの条件として、自己意識の拡大、他者との温かい関係、情緒の安定、現実を正しく認識すること、ユーモアをもって自己を客観視できること、人生を統一する人生哲学をもつこと、などをあげた。"},{"t":"tf","s":"パーソナリティ","imp":2,"q":"パーソナリティは遺伝によってすべて決まっており、育った環境や本人の経験によって変化することはない。","a":false,"e":"誤り。パーソナリティは、遺伝的な素質と、家庭・学校・社会などの環境や経験との相互作用の中で形成される。特に性格は、生まれつきの気質をもとに環境の中で形づくられ、変化していくものである。"},{"t":"qa","s":"認知的不協和","imp":2,"q":"「たばこは体に悪い」と知りながら吸い続ける人が「吸わないとストレスがたまって、かえって体に悪い」と考えるように、互いに矛盾する認知を抱えたときの不快な状態を、考え方や行動を変えて解消しようとするという認知的不協和の理論を唱えたアメリカの社会心理学者は誰か。","a":"フェスティンガー","e":"矛盾する認知がもたらす不快な緊張を認知的不協和という。人は禁煙する（行動を変える）か、害を軽く考える（認知を変える）などして不協和を減らそうとする。「すっぱいぶどう」の合理化も、不協和を減らす働きとして説明できる。"},{"t":"qa","s":"生きがい","imp":2,"q":"ハンセン病療養所で患者と向き合った経験をもとに『生きがいについて』を著し、人間にとっての生きがいの意味を考察した精神科医は誰か。","a":"神谷美恵子","e":"岡山県の国立療養所長島愛生園で精神科医として働いた。生きがいを求める心として、生存充実感への欲求、変化と成長への欲求、未来性への欲求、自由への欲求、意味と価値への欲求などをあげた。"},{"t":"tf","s":"生きがい","imp":1,"q":"神谷美恵子は、生きがいとは社会的な地位や財産を得て初めて感じられるものであり、重い病や困難を抱えた人は生きがいをもつことができないと考えた。","a":false,"e":"誤り。神谷美恵子は、ハンセン病療養所で、厳しい状況にあっても生きがいを見いだして生きる人々に出会い、生きがいは地位や財産ではなく、生きていることの意味や充実感の中にあると考えた。生きがいを失った人がそれを取り戻す道も探った。"},{"t":"ex","s":"キャリア形成","imp":2,"q":"職業のもつ意義を三つの側面から説明せよ。","a":"職業には、収入を得て自分や家族の生活を支えるという経済的な意義がある。また、社会の中で役割を分担し、他の人々の役に立つという社会的な意義がある。さらに、仕事を通じて自分の能力や個性を発揮し、成長していくという自己実現の意義がある。","e":"ポイント：①生計の維持（経済的意義）②社会的役割の分担・社会への貢献 ③自己実現（能力・個性の発揮）。職業選択では、収入だけでなく三つの側面を考えることが大切である。"},{"t":"qa","s":"キャリア形成","imp":2,"q":"学生が在学中に、自分の専攻や将来のキャリアに関連した就業体験を企業などで行うことを何というか。","a":"インターンシップ","e":"実際の職場を体験することで、職業観を育て、仕事の内容や自分の適性を確かめる機会となる。職業だけでなく、家庭や地域での役割も含めて生涯にわたる生き方を設計することをキャリア形成（キャリアデザイン）という。"},{"t":"mc","s":"キャリア形成","imp":2,"q":"日本の統計で「若年無業者」（いわゆるニート）にあたる人の説明として最も適当なものを一つ選べ。","c":["15〜34歳で、仕事に就いておらず、家事も通学もしていない人","15〜34歳で、パートやアルバイトとして働いている人","65歳以上で、仕事を引退して年金を受け取っている人","仕事を探しているのに仕事に就けない、すべての年齢の失業者"],"a":0,"e":"若年無業者は、15〜34歳の非労働力人口のうち家事も通学もしていない人である。ニート（NEET）はイギリスで生まれた語である。15〜34歳でパート・アルバイトとして働く人（またはそれを希望する人）はフリーターとよばれる。65歳以上の引退者や、仕事を探している失業者は若年無業者にあたらない。"},{"t":"tf","s":"キャリア形成","imp":1,"q":"ボランティア活動は、自発的な意思にもとづき、報酬を主な目的とせずに社会や他者のために行う活動であり、参加する人自身の成長や生きがいにつながることもある。","a":true,"e":"正しい。ボランティアの特徴として、自発性、無償性（非営利性）、社会性（公益性）があげられる。活動を通じて他者や社会とつながり、自分の役割を見いだすことは、アイデンティティの確立やキャリア形成にも役立つ。"},{"t":"tf","s":"若者の意識","imp":2,"q":"内閣府が日本を含む7か国の13〜29歳を対象に行った意識調査（2013年度・2018年度）では、「自分自身に満足している」と答えた日本の若者の割合は半数に満たず、調査対象国の中で最も低かった。","a":true,"e":"正しい。日本はいずれの調査でも約45％で、欧米諸国や韓国の多くが7〜8割程度だったのと比べて低い。日本の若者は、自己肯定感や「自分の参加で社会を変えられる」という意識が、諸外国に比べて低い傾向にあると指摘されている。"}]});</script>
<script>QDATA.push({"unit":"u02","questions":[{"t":"qa","s":"帰結主義と義務論","imp":3,"q":"行為の善悪を、その行為がもたらす結果（帰結）のよしあしによって判断する倫理学の立場を何というか。","a":"帰結主義","e":"代表は功利主義（ベンサム・J.S.ミル）である。これに対し、結果ではなく行為そのものが義務にかなうかどうかで判断する立場を義務論といい、カントが代表である。"},{"t":"qa","s":"帰結主義と義務論","imp":3,"q":"行為の善悪を、結果によってではなく、その行為が守るべき義務や道徳法則にかなっているかどうかによって判断する倫理学の立場を何というか。","a":"義務論","e":"カントが代表である。「たとえよい結果をもたらすとしても、嘘をつくことは許されない」と考える。行為の動機を重視するため、動機説ともよばれる。"},{"t":"mc","s":"帰結主義と義務論","imp":3,"q":"市が限られた予算で、利用者の多い駅前の公園と、利用者は少ないが老朽化した山間部の公園のどちらを改修するかを検討している。帰結主義の立場からの意見として最も適当なものを一つ選べ。","c":["改修によって得られる住民全体の満足の合計が、より大きくなるほうを選ぶべきだ。","結果がどうであれ、行政には守るべき義務があるので、その義務に従って判断すべきだ。","改修を決める担当者が誠実な動機をもっているかどうかで、判断の正しさが決まる。","どちらを選ぶかよりも、決定する人が思慮や勇気といった徳を備えていることが大切だ。"],"a":0,"e":"結果として生じる満足（幸福）の大きさで判断するのが帰結主義（功利主義）である。結果にかかわらず義務に従うべきだとするのは義務論、動機の誠実さで正しさが決まるとするのは義務論（動機説）の考え方、行為者の徳を重視するのは徳倫理の考え方である。"},{"t":"mc","s":"帰結主義と義務論","imp":3,"q":"友人から重い病気について尋ねられたが、本当のことを伝えると友人がひどく落ち込むと予想される。この場面で、義務論の立場からの判断として最も適当なものを一つ選べ。","c":["嘘をつくことは、それがどれほどよい結果をもたらすとしても、道徳的に許されない。","本当のことを言うと友人がひどく悲しむので、嘘をついて苦痛を減らすほうが正しい。","嘘をつくかどうかは、関係者全体の幸福がどれだけ増えるかを計算して決めるべきだ。","嘘をついても誰にも知られず、関係者全員が満足するならば、嘘は正しい行為となる。"],"a":0,"e":"義務論では、嘘をつかないことは結果にかかわらず守るべき義務である。カントは、人助けのためであっても嘘をつくことは許されないとした。苦痛を減らすため、幸福の総量を計算して、関係者全員が満足するなら、という判断は、いずれも結果を基準とする帰結主義（功利主義）の考え方である。"},{"t":"tf","s":"帰結主義と義務論","imp":2,"q":"帰結主義では、行為者の動機が善いものであれば、その行為が結果として多くの人に損害を与えたとしても、その行為は正しいと判断される。","a":false,"e":"誤り。動機の善さで行為を評価するのは義務論（動機説）の考え方である。帰結主義では行為の正しさを結果で判断するので、結果として多くの人に損害を与えた行為は、動機が善くても正しいとはいえない。"},{"t":"ex","s":"帰結主義と義務論","imp":3,"q":"帰結主義と義務論の違いを、具体例をあげて説明せよ。","a":"帰結主義は、行為の善悪をその結果のよしあしで判断する立場で、功利主義が代表である。義務論は、結果にかかわらず行為が義務や道徳法則にかなっているかで判断する立場で、カントが代表である。例えば嘘をつけば人を助けられる場面で、帰結主義は嘘を認めうるが、義務論は嘘をつくこと自体を許さない。","e":"ポイント：①帰結主義＝結果で判断（功利主義）②義務論＝義務・動機で判断（カント）③嘘などの具体例で対比できること。"},{"t":"mc","s":"帰結主義と義務論","imp":3,"q":"友人の引っ越しを手伝う約束をしていた人の発言のうち、帰結主義ではなく義務論の考え方にもとづくものとして最も適当なものを一つ選べ。","c":["約束は守るべきものだから、守ることで自分が損をするとしても、約束どおり手伝いに行く。","約束を破ると友人との関係が悪くなり、結局は自分が損をするので、約束どおり手伝いに行く。","手伝いに行けば友人も自分も楽しく過ごせて、全体の満足が大きくなるので手伝いに行く。","手伝うよりアルバイトに行くほうが多くの人の役に立つので、約束を破ってアルバイトに行く。"],"a":0,"e":"損得や結果にかかわらず、約束を守ること自体を義務として行うのが義務論の考え方である。関係が悪くなって損をするから、全体の満足が大きくなるから、多くの人の役に立つから、という理由は、いずれも行為の結果で判断する帰結主義の考え方である。同じ「手伝いに行く」という行為でも、理由（動機）によって立場が分かれる点に注意。"},{"t":"tf","s":"帰結主義と義務論","imp":2,"q":"感染症対策として、社会全体の感染者数を最も減らせるという理由で外出制限を行うべきだと主張するのは、義務論の考え方である。","a":false,"e":"誤り。社会全体の感染者数を減らせるという結果を根拠にしているので、帰結主義（功利主義）の考え方である。義務論の立場からは、例えば「結果にかかわらず、個人の自由を不当に制限してはならない」といった、守るべき義務や権利を根拠とした議論がなされる。"},{"t":"qa","s":"ベンサム","imp":3,"q":"「最大多数の最大幸福」を道徳と立法の原理とし、功利主義を体系化したイギリスの思想家は誰か。","a":"ベンサム","e":"主著は『道徳および立法の諸原理序説』（1789年）。幸福を快楽、不幸を苦痛ととらえ、社会全体の快楽の総量を最大にする行為や法律を正しいとした。"},{"t":"qa","s":"ベンサム","imp":2,"q":"ベンサムが唱えた、ある行為が関係者の幸福を増やすか減らすかによって、その行為の善悪を判断するという原理を何というか。","a":"功利性の原理","alt":["功利の原理","効用の原理"],"e":"功利の原理・効用の原理とも訳される。個人の行為だけでなく、政府の政策や法律の善し悪しを判断する基準でもあるとされた。"},{"t":"qa","s":"ベンサム","imp":1,"q":"ベンサムは『道徳および立法の諸原理序説』の冒頭で「自然は人類を（　）と（　）という二人の主権者の支配のもとにおいてきた」と述べた。空欄に入る語を順に答えよ。","a":"苦痛・快楽","alt":["苦痛と快楽","快楽・苦痛","快楽と苦痛"],"e":"人間は快楽を求め、苦痛を避ける存在であるという人間観が、功利主義の出発点である。ここから、快楽を増やし苦痛を減らす行為が善いとされる。"},{"t":"qa","s":"ベンサム","imp":2,"q":"ベンサムが、快楽の大きさは強さ・持続性・確実性・遠近性・多産性・純粋性・範囲の7つの基準によって数量的に計算できるとしたことを何というか。","a":"快楽計算","e":"快楽を量で測り比べられるとする考え方であり、量的功利主義の特徴である。範囲とは、その快楽が及ぶ人数のことである。"},{"t":"qa","s":"ベンサム","imp":2,"q":"快楽には質的な違いはなく、量によって比較・計算できるとするベンサムの功利主義の立場を何というか。","a":"量的功利主義","e":"ベンサムは、偏見を除けば子どもの遊びも詩も、同じ量の快楽を与えるなら同じ価値があるという趣旨を述べた。快楽に質の差を認めたJ.S.ミルの質的功利主義との対比が頻出である。"},{"t":"mc","s":"ベンサム","imp":1,"q":"ベンサムが、個人が快楽を追求する行為を社会全体の幸福と一致させるために、人の行為を外から規制するものとしてあげた四つの制裁（サンクション）の組み合わせとして最も適当なものを一つ選べ。","c":["自然的（物理的）制裁・法律的（政治的）制裁・道徳的（社会的）制裁・宗教的制裁","自然的制裁・法律的制裁・経済的制裁・良心による内的制裁","法律的制裁・経済的制裁・国際的制裁・宗教的制裁","良心による内的制裁・道徳的制裁・宗教的制裁・自然的制裁"],"a":0,"e":"ベンサムの四つの制裁は自然的・法律的（政治的）・道徳的（社会的）・宗教的制裁で、いずれも外部から加えられる外的制裁である。中でも法律的制裁を重視し、法律の改革によって個人の利益と社会全体の幸福を一致させようとした。良心による内的制裁を重視したのはJ.S.ミルであり、経済的制裁・国際的制裁はベンサムの分類にない。"},{"t":"tf","s":"ベンサム","imp":1,"q":"ベンサムは、幸福を計算する際には「各人を一人として数え、誰も一人以上には数えない」として、身分や地位にかかわらず各人の幸福を平等に扱うべきだと考えた。","a":true,"e":"正しい。貴族の快楽も庶民の快楽も同じ一人分として数えるこの考え方は、身分による特権を批判し、民主的な社会改革を主張する根拠にもなった。"},{"t":"tf","s":"ベンサム","imp":2,"q":"ベンサムは、快楽の量ではなく質を重視し、精神的な快楽は肉体的な快楽よりも本質的にすぐれていると考えた。","a":false,"e":"誤り。これはJ.S.ミルの質的功利主義の考え方である。ベンサムは快楽の質の違いを認めず、快楽は量によって計算できるとした（量的功利主義）。"},{"t":"qa","s":"J.S.ミル","imp":3,"q":"ベンサムの功利主義を受け継ぎつつ、快楽には質の違いがあるとして質的功利主義を唱えたイギリスの思想家は誰か。","a":"J.S.ミル","alt":["ミル","ジョン・スチュアート・ミル","J・S・ミル"],"e":"主著は『功利主義』『自由論』。父ジェームズ・ミルはベンサムの協力者で、J.S.ミルは幼いころから功利主義の教育を受けた。"},{"t":"qa","s":"J.S.ミル","imp":3,"q":"J.S.ミルが『功利主義』で述べた次の言葉の空欄に入る語を答えよ。「満足した（　）であるより、不満足な人間であるほうがよい。満足した愚か者であるより、不満足なソクラテスであるほうがよい。」","a":"豚","e":"精神的な快楽は、肉体的・感覚的な快楽よりも質が高いという質的功利主義を表す言葉である。両方の快楽を知る人は、質の高い快楽をはっきりと選ぶとミルは考えた。"},{"t":"qa","s":"J.S.ミル","imp":2,"q":"J.S.ミルが、功利主義の道徳を守らせるものとして重視した、義務に反したときに自分の内面で感じる良心の痛みのことを何というか。","a":"内的制裁","alt":["内的サンクション"],"e":"ベンサムが重視した外的制裁（特に法律的制裁）との対比が頻出である。ミルはまた、イエスの黄金律「おのれの欲するところを人にほどこし、おのれのごとく隣人を愛せ」に功利主義道徳の理想を見いだした。"},{"t":"qa","s":"J.S.ミル","imp":3,"q":"J.S.ミルが『自由論』で示した、個人の行為に社会や国家が干渉してよいのは、他者への危害を防止する場合に限られるとする原則を何というか。","a":"他者危害原則","alt":["危害原理","他者危害原理","危害原則"],"e":"本人のためになるという理由だけでは干渉は正当化されないとした。ここから、他者に危害を加えない限り、本人にとって愚かに見える選択も認められるべきだという「愚行権」の考え方が導かれる。"},{"t":"tf","s":"J.S.ミル","imp":2,"q":"J.S.ミルは『自由論』で、社会全体の幸福を高めるためには、多数派の意見に合わせて個人の生き方や意見を画一化することが望ましいと主張した。","a":false,"e":"誤り。ミルは、個性の自由な発展こそが個人と社会の幸福の重要な要素であるとし、言論の自由や個性の尊重を説いた。また、多数派の意見が少数派を抑圧する「多数者の専制」を警戒した。"},{"t":"mc","s":"J.S.ミル","imp":2,"q":"J.S.ミルについての記述として適当でないものを一つ選べ。","c":["快楽には質の違いがあり、精神的な快楽は感覚的な快楽よりも質が高いと考えた。","義務に反したときに感じる良心の痛みを内的制裁とよび、重視した。","女性参政権を主張するなど、女性の地位の向上を訴えた。","快楽の大きさは強さや持続性などの基準によって数量的に計算できるとして、快楽計算を考案した。"],"a":3,"e":"快楽計算を考案したのはベンサムなので、これが適当でない。ミルは質的功利主義を唱え、良心による内的制裁を重視した。また『女性の隷従』を著し、下院議員として女性参政権を提案するなど、女性の地位向上を訴えた。"},{"t":"ex","s":"J.S.ミル","imp":2,"q":"ベンサムとJ.S.ミルの功利主義の違いを説明せよ。","a":"ベンサムは、快楽には質の違いがなく量によって計算できるとする量的功利主義を唱え、法律的制裁などの外的制裁を重視した。J.S.ミルは、快楽には質の違いがあり精神的な快楽がすぐれているとする質的功利主義を唱え、良心による内的制裁を重視した。","e":"ポイント：①ベンサム＝量的功利主義・快楽計算 ②ミル＝質的功利主義 ③外的制裁（ベンサム）と内的制裁（ミル）の対比。"}]});</script>
<script>QDATA.push({"unit":"u02","questions":[{"t":"ex","s":"功利主義への批判","imp":3,"q":"功利主義に対してどのような批判があるか、説明せよ。","a":"功利主義は社会全体の幸福の総量を最大にすることをめざすため、多数者の幸福のために少数者の権利や利益を犠牲にすることを正当化してしまうおそれがある。また、幸福の総量だけを問題にし、それが人々の間でどう分配されるかという公正の問題を十分に考慮しないという批判もある。","e":"ポイント：①少数者の犠牲を正当化しうる ②個人の権利の軽視 ③分配の公正を考慮しない。ロールズはこの点から功利主義を批判し、公正としての正義を唱えた。"},{"t":"tf","s":"功利主義への批判","imp":2,"q":"功利主義に対しては、社会全体の幸福の総量が増えさえすれば、その幸福が一部の人々に偏って分配されていても問題にしないという批判がある。","a":true,"e":"正しい。功利主義は幸福の総和を重視するため、格差や不公平な分配を見過ごしやすい。ロールズは、功利主義は一人ひとりの個人の違いを真剣に受け止めていないと批判した。"},{"t":"qa","s":"カント","imp":3,"q":"『純粋理性批判』『実践理性批判』『判断力批判』を著し、道徳の根拠を人間の理性に求めたドイツの哲学者は誰か。","a":"カント","e":"18世紀のドイツ（プロイセン）の哲学者で、義務論の代表である。行為の道徳的価値は結果ではなく動機にあるとした（動機説）。道徳について論じた主著は『実践理性批判』である。"},{"t":"qa","s":"カント","imp":3,"q":"カントは「この世界において、無制限に善いとみなされうるものは（　）のほかには考えられない」と述べた。空欄に入る語は何か。","a":"善意志","e":"才能や富、幸福などは、悪い意志と結びつけば悪にもなりうる。それに対し善意志は、それ自体として無条件に善いとされる。善意志とは、義務を義務として行おうとする意志のことである。"},{"t":"qa","s":"カント","imp":3,"q":"「もし〜ならば、〜せよ」のように条件つきで行為を命じる命令を仮言命法というのに対し、「〜せよ」と無条件に行為を命じる命令を何というか。","a":"定言命法","e":"カントは、道徳法則は無条件に従うべき定言命法の形をとるとした。「合格したければ勉強せよ」は仮言命法であり、目的を望まない人には当てはまらないため、道徳法則にはなりえない。"},{"t":"qa","s":"カント","imp":2,"q":"カントの道徳法則の定式「あなたの意志の（　）が、つねに同時に普遍的立法の原理として妥当しうるように行為せよ」の空欄に入る語は何か。","a":"格率","alt":["格律","マキシム"],"e":"格率とは、各人が自分で立てる主観的な行為の方針のことである。自分の行為の方針が、すべての人が従ってもよい普遍的な法則となりうるかを考えて行為せよ、という意味である。"},{"t":"qa","s":"カント","imp":3,"q":"カントが、自らの理性によって立てた道徳法則に自ら従うことを何とよび、これこそが真の自由であるとしたか。","a":"自律","alt":["意志の自律"],"e":"欲望や他人の命令など、理性以外のものに従って行為することは他律とよばれる。欲望のままに行動することは自由ではなく、自律こそが自由であるとした点がカントの特徴である。"},{"t":"qa","s":"カント","imp":2,"q":"カントが、道徳法則に従って自律的に行為する主体であり、尊厳をもち、決して単なる手段として扱われてはならない存在としたものを何というか。","a":"人格","e":"物は値段のつく価格をもち、他のものと交換できるが、人格は何ものとも交換できない尊厳をもつとした。この考えは、現代の人権思想や個人の尊重の基礎となっている。"},{"t":"qa","s":"カント","imp":2,"q":"カントが理想とした、すべての人が互いの人格を目的として尊重し合う共同体を何というか。","a":"目的の王国","alt":["目的の国"],"e":"目的の国とも訳される。カントはこの理想を国家間の関係にも広げ、『永遠平和のために』で恒久平和の構想を示した。"},{"t":"tf","s":"カント","imp":3,"q":"カントは「人格を決して手段として扱ってはならない」と述べ、他人に何かを手伝ってもらうなど、他人を手段として用いること自体を道徳的に許されないとした。","a":false,"e":"誤り。正しくは「人格をつねに同時に目的として扱い、決して単に手段としてのみ扱わないように行為せよ」である。店員に商品を売ってもらうなど、他人を手段として用いること自体は禁じられていない。禁じられているのは、相手の人格を無視して物のように利用することである。"},{"t":"mc","s":"カント","imp":3,"q":"カントの考え方として最も適当なものを一つ選べ。","c":["商人が客をだまさないのが、評判を落とすと損をするという理由からであれば、その行為に道徳的な価値はない。","行為の道徳的な価値は、その行為がどれだけ多くの人を幸福にしたかという結果によって決まる。","道徳法則は、それに従えば自分が幸福になれるという条件のもとでのみ従うべき命令である。","人間は欲望のままに行動するときに最も自由であり、理性による規制は自由を妨げる。"],"a":0,"e":"カントによれば、損得を動機とする行為は、外見上は義務にかなっていても道徳的価値をもたない。結果で価値が決まるとするのは功利主義、条件つきの命令は仮言命法で道徳法則ではない。また、カントは欲望に従うことを他律とし、理性が立てた法則に従う自律こそ自由だとした。"},{"t":"ex","s":"カント","imp":3,"q":"カントの動機説について、「義務にかなった行為」と「義務にもとづく行為」の違いにふれて説明せよ。","a":"カントは、行為の道徳的価値は結果ではなく動機にあるとした。外から見て義務にかなっていても、損得や欲望を動機とする行為（義務にかなった行為）には道徳的価値はない。義務だからという理由で、道徳法則への尊敬から行われる行為（義務にもとづく行為）だけが道徳的価値をもつ。","e":"ポイント：①行為の価値は動機で決まる（動機説）②義務にかなうだけの行為は適法性にとどまる ③義務にもとづく行為だけが道徳性をもつ。"},{"t":"tf","s":"カント","imp":2,"q":"カントによれば、「医者になりたいなら勉強せよ」という命令は、その目的を望む人にだけ当てはまる仮言命法であり、道徳法則にはなりえない。","a":true,"e":"正しい。仮言命法は「もし〜ならば」という条件つきの命令で、目的を望まない人には当てはまらない。道徳法則は、誰にでも無条件に当てはまる定言命法でなければならない。"},{"t":"qa","s":"カント","imp":1,"q":"カントが『実践理性批判』の結びで、考えれば考えるほど新たな感嘆と畏敬の念で心を満たすものとして、「わが上なる星の輝く空」とともにあげたものは何か。","a":"わが内なる道徳法則","alt":["道徳法則","内なる道徳法則","わが内なる道徳律"],"e":"自然界の法則と並んで、人間の内にある道徳法則の崇高さをたたえた言葉である。道徳法則は外から与えられるものではなく、自らの理性の内にあるとされる。"},{"t":"mc","s":"カント","imp":1,"q":"カントが『永遠平和のために』で主張した内容として最も適当なものを一つ選べ。","c":["常備軍は、時とともに全廃されるべきである。","国家間の争いは、最も強い国が他国を支配することで解決されるべきである。","平和は、各国が自由に軍備を拡張し、勢力の均衡を保つことによってのみ実現する。","国家は、他国の体制や統治に積極的に干渉して、自国の体制を広めるべきである。"],"a":0,"e":"カントは、常備軍の全廃、他国の体制や統治への暴力的な干渉の禁止、自由な諸国家による連合などを説き、のちの国際連盟の思想的な源流となった。強国による支配、軍備拡張による勢力均衡、内政干渉は、いずれもカントの主張と逆である。"},{"t":"qa","s":"思考実験","imp":2,"q":"「暴走する路面電車の先に5人の作業員がいて、進路を切り替えれば5人は助かるが、切り替えた先にいる1人が死ぬ。進路を切り替えるべきか」という思考実験を一般に何というか。","a":"トロッコ問題","alt":["トロリー問題","トロッコ・ジレンマ"],"e":"イギリスの哲学者フットが提起し、アメリカのトムソンらが発展させた。結果を重視する功利主義と、行為そのものの正しさを重視する義務論の違いを考える題材としてよく用いられる。"},{"t":"mc","s":"思考実験","imp":3,"q":"暴走する路面電車の先に5人がいる。線路の上の歩道橋にいるあなたが、隣にいる大柄な人を突き落とせば電車が止まり5人が助かるが、突き落とされた人は死ぬ。カントの義務論にもとづく判断として最も適当なものを一つ選べ。","c":["隣の人を、5人を救うための単なる手段として扱うことになるので、突き落とすべきではない。","死ぬのが1人で済み、救われる人数のほうが多いので、突き落とすべきである。","突き落とすかどうかは、関係者全員の快楽と苦痛を計算した結果によって決めるべきである。","5人と1人のそれぞれが社会にとってどれだけ役に立つ人物かを比べて判断すべきである。"],"a":0,"e":"カントは、人格を単に手段としてのみ扱うことを禁じたので、結果がよくても人を突き落とすことは許されない。救われる人数の多さや快楽と苦痛の計算で判断するのは功利主義、社会への有用性で比べるのも結果を基準とする考え方であり、義務論とはいえない。"},{"t":"tf","s":"思考実験","imp":2,"q":"功利主義の立場では、トロッコ問題で進路を切り替えて1人を犠牲にし、5人を救うことは、失われる命が少なくなるので正当化されると考えられる。","a":true,"e":"正しい。功利主義は結果としての幸福の総量（ここでは救われる命の数）を重視する。ただしこの考え方を推し進めると、5人の患者を救うために健康な1人を犠牲にして臓器を移植することまで認めかねないという批判がある。"},{"t":"ex","s":"思考実験","imp":2,"q":"思考実験とは何か。トロッコ問題を例に、倫理学で思考実験が用いられる理由を説明せよ。","a":"思考実験とは、現実には試すことが難しい状況を頭の中で想定し、その状況での判断を考えることで、理論や直観を検討する方法である。トロッコ問題では、5人を救うために1人を犠牲にしてよいかを考えることで、結果を重視する功利主義と、人を手段として扱うことを禁じる義務論の違いや、それぞれの問題点が明らかになる。","e":"ポイント：①現実には試せない状況を頭の中で想定する ②功利主義と義務論の判断の違いが浮かび上がる ③理論と直観のずれを検討できる。ロールズの無知のヴェールも思考実験の一つである。"},{"t":"tf","s":"思考実験","imp":1,"q":"思考実験とは、実際に人々を危険な状況に置いてその行動を観察する実験のことであり、倫理学ではほとんど用いられない。","a":false,"e":"誤り。思考実験は、実際には行わずに頭の中で状況を想定して考える方法である。倫理学では、トロッコ問題やロールズの無知のヴェールなど、さまざまな思考実験が用いられている。"}]});</script>
<script>QDATA.push({"unit":"u02","questions":[{"t":"qa","s":"ソクラテスとプラトン","imp":3,"q":"自分が無知であることを自覚することこそが、真の知を求める出発点であるとした、古代ギリシアの哲学者ソクラテスの立場を何というか。","a":"無知の知","alt":["不知の自覚","無知の自覚"],"e":"「ソクラテスより知恵のある者はいない」というデルフォイの神託の意味を確かめるため、知者とされる人々と対話し、自分は無知を自覚している点で彼らより知恵があると考えた。ソクラテス自身は著作を残さず、思想は弟子プラトンの対話篇を通じて伝えられた。"},{"t":"qa","s":"ソクラテスとプラトン","imp":2,"q":"ソクラテスが、相手との対話を通じて相手に無知を自覚させ、ともに真理を探究していった方法を何というか。","a":"問答法","alt":["助産術","産婆術"],"e":"相手が自ら真理を生み出す手助けをするという意味で、助産術（産婆術）ともよばれる。知識を一方的に教えるのではなく、対話によって共に考える点が特徴である。"},{"t":"qa","s":"ソクラテスとプラトン","imp":2,"q":"ソクラテスが説いた、徳（アレテー）とは善や正についての知であるという考えを何というか。","a":"知徳合一","e":"ソクラテスはさらに、善を真に知る者は必ず善を行う（知行合一）、徳のある人は幸福である（福徳一致）とも考えた。三つの語の区別に注意する。"},{"t":"mc","s":"ソクラテスとプラトン","imp":2,"q":"ソクラテスの思想として最も適当なものを一つ選べ。","c":["大切なのはただ生きることではなく、よく生きることであるとし、魂ができるだけすぐれたものになるよう配慮することを説いた。","真の実在は感覚でとらえられる個々の事物であり、理性でとらえられる永遠不変のものは存在しないと考えた。","徳は善についての知とは無関係であり、生まれつきの性格によって決まると考えた。","人間は万物の尺度であるとして、真理は人それぞれによって異なると説いた。"],"a":0,"e":"ソクラテスは「よく生きる」ことを求め、魂への配慮を説いた。死刑判決を受けても、国の法に従って逃亡を拒んだとされる。徳を知と無関係とする説明は知徳合一に反する。「人間は万物の尺度」はソフィストのプロタゴラスの言葉であり、相対主義の立場である。"},{"t":"qa","s":"ソクラテスとプラトン","imp":2,"q":"プラトンが、感覚でとらえられる事物の背後にあり、理性によってのみとらえられる永遠不変の真の実在としたものを何というか。","a":"イデア","e":"イデアの中で最高のものは善のイデアである。プラトンは『国家』で、善のイデアを認識した哲学者が統治者となるべきだとする哲人政治を説いた。"},{"t":"tf","s":"ソクラテスとプラトン","imp":1,"q":"プラトンは、理想の国家では、善のイデアを知る哲学者が統治者となるか、統治者が哲学を学ぶべきだとする哲人政治を説いた。","a":true,"e":"正しい。プラトンは、魂の理性・気概・欲望がそれぞれの徳（知恵・勇気・節制）をもって調和するとき正義が実現するとし、国家も同様に、知恵をもつ哲学者が統治することで正義が実現すると考えた。"},{"t":"qa","s":"アリストテレス","imp":3,"q":"アリストテレスが『ニコマコス倫理学』で、それ自体のために求められ、他の何かのための手段とはならない究極の目的、すなわち最高善としたものは何か。","a":"幸福","alt":["エウダイモニア","幸福（エウダイモニア）"],"e":"ギリシア語でエウダイモニアという。単なる快楽ではなく、人間に固有の能力である理性を、徳（アレテー）に従ってよく発揮して生きることが幸福であるとした。アリストテレスはプラトンの弟子で、徳倫理の源流とされる。"},{"t":"qa","s":"アリストテレス","imp":3,"q":"アリストテレスが、勇気は無謀と臆病の、気前のよさは浪費とけちの間にあるとしたように、過度と不足という両極端を避けて、適切な中間を選ぶことを何というか。","a":"中庸","alt":["メソテース"],"e":"ギリシア語でメソテースという。単なる真ん中や妥協ではなく、その状況に応じた適切なあり方を選ぶことであり、それを見きわめるのが知性的徳の一つである思慮（フロネシス）である。"},{"t":"mc","s":"アリストテレス","imp":3,"q":"アリストテレスの徳についての説明として最も適当なものを一つ選べ。","c":["勇気や節制などの倫理的徳（習性的徳）は、よい行為を繰り返す習慣づけによって身につく。","知恵や思慮などの知性的徳は生まれつき備わっており、教育や学習によって変わることはない。","倫理的徳は、書物を読んで道徳の知識を学ぶことによってのみ身につく。","中庸とは、どのような場合にも両極端のちょうど真ん中の量を機械的に選ぶことである。"],"a":0,"e":"アリストテレスは「人は正しい行為をすることによって正しい人になり、節制ある行為をすることによって節制ある人になる」として、倫理的徳は習慣づけで身につくとした。知性的徳は教育や学習によって育つものであり、倫理的徳は知識を学ぶだけでは身につかない。中庸は状況に応じた適切さであり、機械的な真ん中ではない。"},{"t":"ex","s":"アリストテレス","imp":2,"q":"アリストテレスのいう知性的徳と倫理的徳の違いを説明せよ。","a":"知性的徳は、知恵や思慮など理性そのものの働きにかかわる徳であり、主に教育や学習によって育つ。倫理的徳（習性的徳）は、勇気・節制など感情や欲望を適切に方向づける性格の徳であり、よい行為を繰り返す習慣づけによって身につき、中庸を選ぶことを特徴とする。","e":"ポイント：①知性的徳＝知恵・思慮、教育・学習で育つ ②倫理的徳＝勇気・節制など、習慣づけで身につく ③倫理的徳は中庸を本質とし、その判断に思慮が働く。"},{"t":"ex","s":"アリストテレス","imp":3,"q":"アリストテレスが部分的正義として示した、配分的正義と調整的正義の違いを説明せよ。","a":"配分的正義は、名誉や財貨などを各人の能力や功績に応じて比例的に配分する正義である。調整的正義は、取引や犯罪などで生じた損得を、当事者の身分や能力に関係なく等しくなるように調整する正義であり、裁判による損害賠償や刑罰がその例である。","e":"ポイント：①配分的正義＝能力・功績に応じた比例的な配分 ②調整的正義＝損得を当事者の価値に関係なく等しく調整 ③どちらも部分的正義であり、ポリスの法を守る全体的正義と区別される。"},{"t":"mc","s":"アリストテレス","imp":3,"q":"次の事例のうち、アリストテレスのいう調整的正義の考え方にあたるものとして最も適当なものを一つ選べ。","c":["交通事故で相手に損害を与えた人が、その損害額に見合った賠償金を支払う。","会社が、業績に大きく貢献した社員ほど多くのボーナスを支給する。","スポーツ大会で、すぐれた成績をあげた選手に大きな名誉を与える。","国の法律を守り、共同体の一員としての務めを果たす。"],"a":0,"e":"生じた損害を、当事者が誰であるかに関係なく等しく埋め合わせるのが調整的正義である。貢献に応じたボーナスや成績に応じた名誉は、能力や功績に比例して分け与える配分的正義にあたる。法律を守り共同体の務めを果たすことは全体的正義にあたる。"},{"t":"tf","s":"アリストテレス","imp":2,"q":"アリストテレスのいう全体的正義とは、取引で生じた損得を当事者の間で等しくすることであり、配分的正義と調整的正義に分けられる。","a":false,"e":"誤り。全体的正義（広い意味の正義）は、ポリスの法を守ることである。配分的正義と調整的正義に分けられるのは部分的正義（狭い意味の正義）であり、取引で生じた損得を等しくするのはそのうちの調整的正義である。"},{"t":"qa","s":"アリストテレス","imp":2,"q":"アリストテレスが、ポリス（共同体）を結びつけるものとして正義とともに重視し、「正しい人々の間にもなお必要である」とした、互いに相手の善を願う人と人との結びつきを何というか。","a":"友愛","alt":["フィリア"],"e":"ギリシア語でフィリアという。友愛には相手の人柄（善）のゆえ、快楽のゆえ、有用性のゆえの3種類があり、相手の人柄を愛する友愛が最もすぐれ、長続きするとした。"},{"t":"qa","s":"アリストテレス","imp":3,"q":"アリストテレスは『政治学』で「人間は（　）動物である」と述べた。空欄に入る語を答えよ。","a":"ポリス的","alt":["社会的","政治的","ポリス的（社会的）"],"e":"人間は、ポリス（都市国家）という共同体の中で他者とともに生きることで、はじめて人間らしいよい生き方を実現できると考えた。社会的動物と訳されることもある。"},{"t":"tf","s":"アリストテレス","imp":1,"q":"アリストテレスは、真理をそれ自体のために眺め知る観想（テオーリア）的生活を、最も幸福な生活であると考えた。","a":true,"e":"正しい。理性は人間に固有の最もすぐれた能力であり、それを純粋に働かせる観想的生活が最高の幸福であるとした。一方で、人間はポリスの中で倫理的徳を発揮して生きる存在でもあるとした。"},{"t":"ex","s":"アリストテレス","imp":2,"q":"徳倫理とはどのような考え方か。功利主義や義務論と比べて説明せよ。","a":"徳倫理は、行為の結果を重視する功利主義や、行為が義務や規則にかなうかを重視する義務論とは異なり、行為する人がどのような人柄（徳）を備えているかを重視する立場である。アリストテレスが源流であり、よい行為の習慣づけによって勇気や節制などの徳を身につけ、よく生きることをめざす。","e":"ポイント：①行為者の人柄（徳）を重視する ②功利主義＝結果、義務論＝義務・規則との違い ③アリストテレスが源流で、習慣づけによる徳の形成を重んじる。現代ではマッキンタイアらが徳倫理を復興させた。"},{"t":"qa","s":"ヘーゲル","imp":2,"q":"ヘーゲルが、客観的・外面的な法と、主観的・内面的な道徳とを統合し、自由が具体的に実現された共同体のあり方としたものは何か。","a":"人倫","e":"ヘーゲルは、カントの道徳は個人の内面にとどまる主観的なものだと批判し、自由は家族・市民社会・国家という共同体の中で具体的に実現されるとした。"},{"t":"mc","s":"ヘーゲル","imp":2,"q":"ヘーゲルが示した人倫の三段階についての説明として最も適当なものを一つ選べ。","c":["市民社会は、独立した個人が自分の欲求を満たすために結びつく「欲望の体系」であり、人倫の喪失態とされる。","家族は、独立した個人どうしが利害にもとづいて契約で結びつく関係であり、人倫の完成態とされる。","国家は、家族の愛による結びつきだけを受け継いだもので、個人の独立性は否定される。","人倫は、国家から市民社会を経て家族へと発展し、家族において完成する。"],"a":0,"e":"市民社会では個人が独立する一方、利己的な欲求の追求によって人々の結びつきが失われるため、人倫の喪失態とされる。家族は愛による自然な結びつきであり、利害による契約関係ではない。国家は、家族の共同性と市民社会の個人の独立性をともに生かして統一した人倫の完成態である。発展の順序は家族→市民社会→国家である。"},{"t":"tf","s":"ヘーゲル","imp":1,"q":"ヘーゲルは、人倫は家族において完成するとし、国家を個人の独立性を失わせる人倫の喪失態であるとした。","a":false,"e":"誤り。ヘーゲルは、人倫は家族→市民社会→国家と発展し、国家において完成すると考えた（人倫の完成態）。人倫の喪失態とされたのは市民社会である。"}]});</script>
<script>QDATA.push({"unit":"u02","questions":[{"t":"qa","s":"ロールズ","imp":3,"q":"『正義論』を著し、「公正としての正義」を唱えたアメリカの政治哲学者は誰か。","a":"ロールズ","alt":["ジョン・ロールズ"],"e":"1971年に『正義論』を発表した。功利主義を批判し、社会契約説を現代的に組み立て直して、自由で平等な人々が合意できる正義の原理を導こうとした。福祉国家を支える平等主義的なリベラリズムの代表である。"},{"t":"qa","s":"ロールズ","imp":3,"q":"ロールズが、正義の原理を選ぶ人々は自分の能力・社会的地位・財産・性別などを知らない状態に置かれると想定したとき、それらの情報を覆い隠すものを何とよんだか。","a":"無知のヴェール","alt":["無知のベール"],"e":"自分がどのような立場になるかわからないため、人々は特定の立場に有利な原理ではなく、最も恵まれない立場になっても受け入れられる公正な原理を選ぶと考えた。"},{"t":"qa","s":"ロールズ","imp":2,"q":"ロールズが、社会契約説の自然状態に代わるものとして想定した、人々が無知のヴェールのもとで正義の原理を選ぶ仮想的な状況を何というか。","a":"原初状態","e":"現実の歴史上の状況ではなく、公正な原理を導くために考え出された思考実験である。原初状態で全員が合意する原理こそ公正だとする点から、公正としての正義とよばれる。"},{"t":"ex","s":"ロールズ","imp":2,"q":"ロールズが、正義の原理を選ぶ人々に「無知のヴェール」をかけるという想定を用いたのはなぜか、説明せよ。","a":"人々が自分の能力や地位、財産、性別などを知っていると、自分に有利な原理を選ぼうとしてしまう。無知のヴェールによって自分の立場がわからない状態にすれば、誰もが自分が最も恵まれない立場になる可能性を考えるため、特定の人にかたよらない公正な原理に合意できると考えたからである。","e":"ポイント：①立場を知っていると自分に有利な原理を選んでしまう ②立場がわからなければ最も不遇な立場を考慮する ③公正な合意を導くための仮想的な装置である。"},{"t":"qa","s":"ロールズ","imp":3,"q":"ロールズの正義の第二原理のうち、社会的・経済的な不平等は、最も恵まれない人々の便益を最大にする場合にのみ許されるとする原理を何というか。","a":"格差原理","alt":["格差原則"],"e":"不平等を一切認めないのではなく、恵まれない人々の状況を改善する限りで不平等を認める点が重要である。第二原理のもう一つは公正な機会均等の原理である。"},{"t":"mc","s":"ロールズ","imp":3,"q":"ロールズの正義の二原理についての説明として最も適当なものを一つ選べ。","c":["第一原理は、すべての人が基本的な自由を平等にもつべきだとする平等な自由の原理である。","第二原理は、社会全体の幸福の総量が最大になるように財を配分すべきだとする原理である。","格差原理は第一原理に優先し、経済的な格差を縮めるためであれば言論の自由を制限してもよいとされる。","公正な機会均等の原理とは、競争の結果として得られた所得をすべての人に等しく分配することである。"],"a":0,"e":"第一原理は、言論・良心・身体などの基本的自由を各人に平等に保障する原理である。幸福の総量の最大化は功利主義の考え方なので第二原理の説明として誤り。第一原理は第二原理に優先するので、格差是正のために基本的自由を制限することは認められない。公正な機会均等の原理は、地位や職務に就く機会を実質的に平等にすることであり、結果の所得を等しくすることではない。"},{"t":"ex","s":"ロールズ","imp":3,"q":"ロールズの正義の二原理を説明せよ。","a":"第一原理は、各人が言論や良心の自由などの基本的自由を平等にもつという平等な自由の原理である。第二原理は、社会的・経済的不平等が許されるのは、公正な機会均等のもとで全員に開かれた地位や職務に伴うものであり、かつ最も恵まれない人々の便益を最大にする場合に限られるとする原理である。第一原理は第二原理に優先する。","e":"ポイント：①第一原理＝平等な自由の原理 ②第二原理＝公正な機会均等の原理と格差原理 ③第一原理が第二原理に優先する。"},{"t":"tf","s":"ロールズ","imp":2,"q":"ロールズは、無知のヴェールのもとでは、人々は社会全体の幸福の総量を最大にする功利主義の原理を選ぶと考えた。","a":false,"e":"誤り。ロールズは、自分が最も恵まれない立場になる可能性を考えると、人々は功利主義ではなく、平等な自由の原理と格差原理などからなる正義の二原理を選ぶと考えた。功利主義は、全体の幸福のために少数者の犠牲を正当化しうるとして批判した。"},{"t":"mc","s":"ロールズ","imp":2,"q":"次の政策のうち、ロールズの格差原理の考え方に最も合致するものを一つ選べ。","c":["高所得者に累進的に課税し、その税収で最も恵まれない人々の生活や教育を支援する。","所得の格差は一切認めず、能力や努力にかかわらず全員の所得を完全に等しくする。","平均所得が上がるのであれば、貧困層の生活が悪化しても経済成長を最優先する。","個人が自由な取引で得た財産は本人のものなので、再分配のための課税は行わない。"],"a":0,"e":"格差原理は、最も恵まれない人々の便益を最大にする限りで不平等を認めるので、恵まれない人々を支援するための再分配はこれに合致する。格差を一切認めないことは格差原理の考え方ではない。平均の上昇を優先して貧困層を犠牲にするのは功利主義に近く、再分配のための課税を否定するのはノージックのリバタリアニズムの考え方である。"},{"t":"qa","s":"セン","imp":3,"q":"インド出身の経済学者センが重視した、人が「健康である」「教育を受ける」「社会生活に参加する」などの機能を実際に選んで達成できる自由の幅を何というか。","a":"潜在能力","alt":["ケイパビリティ","潜在能力（ケイパビリティ）"],"e":"ケイパビリティともいう。センは1998年にノーベル経済学賞を受賞した。所得や財の量ではなく、それを使って何ができるか、どのような生き方を選べるかに注目すべきだとした。国連開発計画（UNDP）の人間開発指数の考え方にも影響を与えた。"},{"t":"tf","s":"セン","imp":2,"q":"センは、人々の暮らしのよさを比較するには、各人が受け取る所得や財の量を比べれば十分であると考えた。","a":false,"e":"誤り。センは、同じ所得や財をもっていても、障がいや病気、住んでいる環境などによって、それを使って実現できることは人によって異なると指摘した。そのため、財の量ではなく潜在能力（ケイパビリティ）を基準にすべきだとし、財の分配に注目するロールズの考え方も批判的に発展させた。"},{"t":"mc","s":"セン","imp":1,"q":"次の政策のうち、センの潜在能力の考え方に最も近いものを一つ選べ。","c":["車いすを使う人も移動できるよう、駅にエレベーターを設置し、通学や通勤をしやすくする。","すべての人に同じ金額の給付金を配れば、人々の暮らしのよさは等しくなったとみなす。","国内総生産（GDP）の成長率だけを、国民の豊かさを示す指標として用いる。","市場での自由な取引の結果として生じた格差は、すべて本人の責任であるとして放置する。"],"a":0,"e":"エレベーターの設置は、移動・通学・通勤といった機能を実際に達成できる自由（潜在能力）を広げる政策である。同額の給付で暮らしのよさが等しくなるとみなすのは、人による違いを無視する点でセンの考えと異なる。GDPだけで豊かさを測ることや、格差を放置することも、人々の選択の自由の幅に注目するセンの考え方とは合わない。"},{"t":"qa","s":"ノージック","imp":3,"q":"個人の自由、特に私的所有権を最大限に尊重し、国家による所得の再分配に反対する立場を何というか。","a":"リバタリアニズム","alt":["自由至上主義","自由尊重主義"],"e":"自由至上主義ともいう。ノージックが代表であり、福祉国家を支持するロールズのリベラリズムと対立する。"},{"t":"qa","s":"ノージック","imp":2,"q":"『アナーキー・国家・ユートピア』を著し、国家の役割を暴力・盗み・詐欺からの保護や契約の履行の強制などに限定する最小国家を正当だとしたアメリカの哲学者は誰か。","a":"ノージック","e":"それ以上の役割を担う国家（再分配を行う福祉国家など）は個人の権利を侵害するとし、労働で得た所得への課税は強制労働と同じだと批判した。"},{"t":"tf","s":"ノージック","imp":1,"q":"ノージックは、正当な手続きで取得・移転された財産は本人のものであり、国家がそれを再分配のために強制的に徴収することは個人の権利の侵害であると考えた。","a":true,"e":"正しい。ノージックは、財産が正当な取得と移転によって得られたかどうかを重視し、結果としての分配の形（平等かどうか）を基準とする考え方を退けた。"},{"t":"qa","s":"コミュニタリアニズム","imp":3,"q":"個人は家族や地域、国家などの共同体の中で形成された存在であるとして、共同体の共通善や伝統、美徳を重視する立場を何というか。","a":"コミュニタリアニズム","alt":["共同体主義"],"e":"共同体主義ともいう。サンデル、マッキンタイア、テイラーらが代表である。ロールズのリベラリズムが前提とする個人像を批判し、正義は共通善と切り離して考えることはできないとした。"},{"t":"qa","s":"コミュニタリアニズム","imp":2,"q":"サンデルが、ロールズのリベラリズムが想定する、共同体の歴史や伝統、他者とのつながりから切り離された自己を批判して何とよんだか。","a":"負荷なき自己","alt":["負荷なき自我","負荷のない自己"],"e":"サンデルは、人は家族・地域・国などの共同体の中で、その歴史や伝統を背負って生きる「位置づけられた自己」であると主張した。主著は『リベラリズムと正義の限界』である。"},{"t":"mc","s":"コミュニタリアニズム","imp":1,"q":"マッキンタイアについての説明として最も適当なものを一つ選べ。","c":["『美徳なき時代』で、人間は自らの人生を共同体の歴史や伝統という物語の中に位置づけて理解する存在であるとし、徳倫理の復興を説いた。","『正義論』で、無知のヴェールのもとで選ばれる正義の二原理を示した。","『アナーキー・国家・ユートピア』で、国家の役割を最小限に限定する最小国家を正当化した。","『自由論』で、他者に危害を加えない限り個人の自由は尊重されるべきだとした。"],"a":0,"e":"マッキンタイアは、アリストテレス以来の徳倫理を現代に復興させたコミュニタリアンである。『正義論』はロールズ、『アナーキー・国家・ユートピア』はノージック、『自由論』はJ.S.ミルの著作である。"},{"t":"ex","s":"三つの立場の比較","imp":3,"q":"リベラリズム・リバタリアニズム・コミュニタリアニズムの違いを説明せよ。","a":"リベラリズムは、ロールズのように個人の自由を尊重しつつ、公正の観点から再分配による格差の是正を認める立場である。リバタリアニズムは、ノージックのように個人の自由と所有権を最優先し、再分配に反対して最小国家を主張する。コミュニタリアニズムは、サンデルらのように、個人は共同体の中で形成されるとして共通善や美徳を重視する。","e":"ポイント：①リベラリズム＝自由と公正な再分配（ロールズ）②リバタリアニズム＝自由・所有権の最優先、最小国家（ノージック）③コミュニタリアニズム＝共同体の共通善（サンデル・マッキンタイア）。"},{"t":"mc","s":"三つの立場の比較","imp":2,"q":"「高所得者への課税を強化し、その税収で子どもの貧困対策を行う」という政策について、リバタリアニズムの立場からの意見として最も適当なものを一つ選べ。","c":["各人が正当に得た所得を、本人の同意なく国家が取り上げて他人に配ることは、個人の権利の侵害である。","最も恵まれない人々の便益を最大にする政策であれば、格差を是正するための課税は正当化される。","地域の子どもたちを共同体全体で育てることは私たちの共通善であり、それを支える負担は当然である。","この政策によって社会全体の幸福の総量が増えるならば、課税は正当化される。"],"a":0,"e":"個人の所有権を最優先し、再分配のための強制的な課税に反対するのがリバタリアニズムである。恵まれない人々の便益の最大化を根拠とするのはロールズのリベラリズム（格差原理）、共同体の共通善を根拠とするのはコミュニタリアニズム、幸福の総量を根拠とするのは功利主義の意見である。"}]});</script>
<script>QDATA.push({"unit":"u02","questions":[{"t":"qa","s":"ハーバーマス","imp":3,"q":"ドイツの哲学者ハーバーマスが、目的を達成する手段を効率的に計算する道具的理性に対して、対等な立場での自由な対話を通じて合意を形成していく理性として重視したものを何というか。","a":"対話的理性","alt":["コミュニケーション的理性","コミュニケーション的合理性"],"e":"コミュニケーション的合理性ともいう。強制や権力によらず、互いに理由を示し合う討議によって、誰もが納得できる合意をめざす。主著は『コミュニケーション的行為の理論』である。"},{"t":"qa","s":"ハーバーマス","imp":2,"q":"18世紀ヨーロッパのコーヒーハウスやサロンのように、市民が身分にとらわれず自由に議論を交わし、世論を形成した空間を、ハーバーマスは何とよんだか。","a":"公共圏","alt":["市民的公共圏","市民的公共性"],"e":"著書『公共性の構造転換』で論じた。ハーバーマスは、のちにマスメディアの発達などで公共圏が衰えたと考え、市民の自由な討議の場を再生することを重視した。"},{"t":"tf","s":"ハーバーマス","imp":1,"q":"ハーバーマスは、貨幣や権力による支配が、人々の日常的なコミュニケーションの領域である生活世界にまで広がることを「生活世界の植民地化」とよび、社会の進歩として肯定した。","a":false,"e":"誤り。ハーバーマスは、経済のシステム（貨幣）や行政のシステム（権力）が生活世界を支配するようになることを生活世界の植民地化とよんで批判し、対話による合意形成の回復を求めた。"},{"t":"mc","s":"ハーバーマス","imp":2,"q":"地域の再開発計画を決める方法として、ハーバーマスの考え方に最も合致するものを一つ選べ。","c":["住民・事業者・行政が対等な立場で理由を示し合いながら議論し、皆が納得できる合意をめざす。","専門家が最も効率的な計画を決め、住民にはその結果だけを伝える。","議論には時間がかかるので、最も多くの資金を出す事業者の意向に従って決める。","行政が権限にもとづいて計画を決定し、反対意見は聞かずに実行する。"],"a":0,"e":"ハーバーマスは、対等な参加者が理由を示し合う討議によって合意を形成することを重視した。専門家による効率性だけの決定は道具的理性にもとづくものであり、資金（貨幣）や権限（権力）で一方的に決めることは、生活世界の植民地化にあたるとして批判される。"},{"t":"qa","s":"アーレント","imp":3,"q":"アーレントが『人間の条件』で人間の営みを三つに分けたうち、物を介さずに人と人とが言葉と行為によって直接関わり合う営みで、公共的な政治の本質をなすとしたものは何か。","a":"活動","e":"他の二つは、生命を維持するための営みである労働と、道具や建物など長く残る人工物をつくる仕事である。アーレントは、近代社会では労働が優位となり、活動の場である公共的な領域が衰退したと批判した。"},{"t":"mc","s":"アーレント","imp":1,"q":"アーレントが人間の営みを労働・仕事・活動に分けたうち、「仕事」の例として最も適当なものを一つ選べ。","c":["職人が、何十年も使われる木の机をつくる。","生活費を得るために働き、そのお金で毎日の食料を買って食べる。","市民が集会で意見を述べ合い、町の将来について議論する。","選挙の演説会で、候補者が自分の政策を語り、聴衆と討論する。"],"a":0,"e":"仕事は、机や建物など、使われ続けて長く残る人工物をつくり出す営みである。生命を維持するために消費をくり返す営みは労働、人々が言葉を交わし合い、公共の事柄に関わる集会での議論や演説会での討論は活動にあたる。"},{"t":"tf","s":"アーレント","imp":1,"q":"アーレントは『全体主義の起源』で、ナチズムやスターリニズムのような全体主義は、互いのつながりを失って孤立した大衆を基盤として成立したと分析した。","a":true,"e":"正しい。全体主義はイデオロギーとテロル（恐怖）によって人々を支配し、人々が自由に語り合う公共的な空間を破壊したとした。また『エルサレムのアイヒマン』では、自ら考えることをやめた平凡な人間が巨大な悪を担いうること（悪の凡庸さ）を指摘した。"},{"t":"qa","s":"ケアの倫理","imp":3,"q":"普遍的な原則や公平を重んじる「正義の倫理」に対して、他者への共感や思いやり、具体的な人間関係の中での責任を重視する倫理を何というか。","a":"ケアの倫理","e":"アメリカの心理学者ギリガンが『もうひとつの声』で示した考え方である。子育てや介護、医療など、弱い立場の他者を支える場面の倫理として注目されている。"},{"t":"ex","s":"ケアの倫理","imp":2,"q":"ギリガンがコールバーグの道徳性発達理論を批判した理由を、ケアの倫理にふれて説明せよ。","a":"コールバーグは、道徳性の発達を、普遍的な正義の原則にもとづいて判断できるようになる過程としてとらえた。ギリガンは、この理論が公平や権利を重視する正義の倫理だけを基準にしているため、具体的な人間関係の中で他者への配慮や責任を重視する考え方（ケアの倫理）が低く評価されてしまうと批判した。","e":"ポイント：①コールバーグ＝正義の倫理を基準とした発達段階 ②ギリガンの批判＝ケアの視点、特に女性に多く見られた声が低く評価される ③ケアの倫理＝関係性・共感・責任の重視。"},{"t":"ex","s":"自由の概念","imp":2,"q":"バーリンが区別した消極的自由と積極的自由の違いを説明せよ。","a":"消極的自由は、他者や国家から干渉や強制を受けないという「〜からの自由」である。積極的自由は、自分が自分自身の主人となり、自らの意志で生き方を決めて実現するという「〜への自由」である。バーリンは、積極的自由が「真の自己」の名のもとに人々への強制を正当化する危険があるとして、消極的自由を重視した。","e":"ポイント：①消極的自由＝〜からの自由（干渉の不在）②積極的自由＝〜への自由（自己支配・自己実現）③積極的自由が強制や全体主義に転化する危険。イギリスの思想家バーリンの「二つの自由概念」による区別である。"},{"t":"mc","s":"自由の概念","imp":1,"q":"バーリンの区別に照らして、積極的自由の考え方に最も近いものを一つ選べ。","c":["自分の生き方を自分で決め、自らの意志で自分を律して、なりたい自分を実現する自由","国家に検閲されることなく、自分の意見を発表できる自由","他人から干渉されることなく、休日を好きなように過ごせる自由","正当な理由なく警察に逮捕・拘束されない自由"],"a":0,"e":"自らが自分の主人となって生き方を決め、実現していくのが積極的自由である。検閲されない自由、干渉されずに過ごす自由、不当に拘束されない自由は、いずれも国家や他者からの干渉がないことを意味する消極的自由にあたる。"},{"t":"ex","s":"自由の概念","imp":1,"q":"フロムが『自由からの逃走』で、近代人は自由から逃走したと述べたのはなぜか、説明せよ。","a":"近代人は、中世の共同体や身分などの伝統的な束縛から解放されて「〜からの自由」を得たが、その結果、孤独や無力感、不安にさらされることになった。その重荷に耐えられない人々は、自由を捨てて強い権威に服従することで安心を得ようとし、これがナチズムを支持する心理的な基盤となった。","e":"ポイント：①伝統的な束縛からの解放（〜からの自由）②孤独・無力感・不安 ③権威への服従とナチズムの支持。フロムはドイツ出身の社会心理学者で、愛と生産的な仕事によって自己を実現する「〜への自由」を説いた。"},{"t":"tf","s":"自由の概念","imp":1,"q":"フロムは、近代人は伝統的な束縛から解放されたことで孤独や不安から解き放たれ、その結果、ナチズムのような権威主義は人々の支持を失ったと分析した。","a":false,"e":"誤り。フロムは、伝統的な束縛から解放された近代人は、かえって孤独や不安にさらされ、それに耐えられずに権威に服従しようとしたと分析した。この心理が、ナチズムが大衆の支持を集めた背景にあるとした。"},{"t":"qa","s":"サルトル","imp":2,"q":"「実存は本質に先立つ」と述べ、人間はあらかじめ定められた本質をもたず、自らの選択によって自分をつくっていく存在であるとしたフランスの哲学者は誰か。","a":"サルトル","e":"ペーパーナイフは用途（本質）が先に決まってからつくられるが、人間はまず存在し、その後の生き方によって自分が何者であるかを決めていく。「人間は自由の刑に処せられている」とも述べ、自由には責任が伴うことを強調した。"},{"t":"qa","s":"サルトル","imp":1,"q":"サルトルが重視した、自らの選択によって社会や状況に積極的に関わり、自分を拘束していくことを何というか。","a":"アンガージュマン","alt":["社会参加","自己拘束"],"e":"社会参加・自己拘束と訳される。サルトルは、自分の選択は自分だけでなく人間全体のあり方を選ぶことでもあり、人は全人類に対して責任を負うと考えた。"},{"t":"ex","s":"効率と公正","imp":3,"q":"「効率」と「公正」の考え方を、具体例をあげて説明せよ。","a":"効率とは、限られた資源や時間を無駄なく使い、より大きな成果を得ようとする考え方である。公正とは、決め方や機会、結果が一部の人にかたよらず、関係者が納得できるものかを問う考え方である。例えば体育館の使用割り当てで、利用希望の多い部に多く割り当てるのは効率の観点、全部の意見を聞き、少人数の部にも練習の機会を確保するのは公正の観点である。","e":"ポイント：①効率＝無駄なく大きな成果 ②公正＝手続き・機会・結果のかたよりのなさ、納得 ③両者が対立しうることを具体例で示す。"},{"t":"mc","s":"効率と公正","imp":3,"q":"公正には「手続きの公正」「機会の公正」「結果の公正」などの観点がある。次のうち「手続きの公正」にあたるものとして最も適当なものを一つ選べ。","c":["文化祭の出し物を決める際に、全員が意見を述べる機会をもち、事前に決めたルールに従って決定する。","入学試験で、性別や出身地にかかわらず、誰でも同じ条件で受験できるようにする。","所得の格差が大きくなりすぎないよう、税や社会保障によって所得を再分配する。","限られた予算を、最も大きな効果が期待できる事業に集中して配分する。"],"a":0,"e":"手続きの公正は、決定に至る過程（決め方）が公正であるかを問う観点である。誰でも同じ条件で挑戦できるようにするのは機会の公正、再分配で格差を小さくするのは結果の公正、効果の大きい事業への集中は効率の観点にあたる。"},{"t":"tf","s":"効率と公正","imp":2,"q":"公共的な問題を考える際、効率と公正は常に両立するので、どちらか一方の観点から判断すれば十分である。","a":false,"e":"誤り。効率を追求すると一部の人が不利益を被ることがあり、公正を重視すると時間や費用がかかることがあるなど、両者はしばしば対立する。両方の観点から検討し、関係者が納得できる解決策を探ることが大切である。"},{"t":"qa","s":"合意形成","imp":3,"q":"多数決で物事を決める際に、多数派の意見が少数派の権利や自由を不当に抑圧してしまう危険を何というか。トクヴィルやJ.S.ミルが警告した。","a":"多数者の専制","alt":["多数派の専制","多数の専制"],"e":"トクヴィルは『アメリカのデモクラシー』で、J.S.ミルは『自由論』でこの危険を論じた。民主主義では、多数決で決める前に十分に話し合い、少数意見を尊重することが求められる。"},{"t":"tf","s":"合意形成","imp":2,"q":"多数決は、全員の合意が得られないときに集団の意思を決める有効な方法であるが、決定の前に十分な話し合いを行い、少数意見も尊重することが求められる。","a":true,"e":"正しい。多数決は効率よく決定できる一方、少数派の意見が切り捨てられるおそれがある。話し合いの中で少数意見を取り入れて案を修正したり、決定後も少数派の権利を守ったりすることで、決定の正当性と納得が高まる。"},{"t":"qa","s":"合意形成","imp":1,"q":"選挙で投票するだけでなく、市民が互いに理由を示し合いながら話し合い、意見を変えることも含めて合意をめざす過程を重視する民主主義の考え方を何というか。","a":"熟議民主主義","alt":["討議民主主義","熟議デモクラシー"],"e":"討議民主主義ともいう。ハーバーマスの討議の考え方などが理論的な背景となっている。無作為に選ばれた市民が政策を話し合う市民討議会などが、その実践の例である。"}]});</script>
<script>QDATA.push({"unit":"u03","questions":[{"t":"qa","s":"ユダヤ教","imp":3,"q":"古代イスラエル人（ヘブライ人）の民族宗教で、唯一神ヤハウェを信仰し、神が与えた律法を守ることを重んじる宗教は何か。","a":"ユダヤ教","e":"イスラエルの民は神に選ばれた民であるとする選民思想をもち、救世主（メシア）の到来を待ち望む。キリスト教とイスラームは、ユダヤ教の唯一神信仰を受け継いで成立した。聖典はヘブライ語の聖書で、キリスト教ではこれを『旧約聖書』とよぶ。"},{"t":"qa","s":"ユダヤ教","imp":3,"q":"預言者モーセがシナイ山で神から授かったとされる、ユダヤ教の律法の中心となる10の戒めを何というか。","a":"十戒","alt":["モーセの十戒"],"e":"「わたしのほかに神があってはならない」「偶像を造ってはならない」「殺してはならない」「盗んではならない」などからなる。神とイスラエルの民との契約のしるしとされ、律法の中心に位置づけられる。"},{"t":"tf","s":"ユダヤ教","imp":2,"q":"ユダヤ教の選民思想とは、神は民族の区別なく、すべての人間を等しく救うという考え方である。","a":false,"e":"正しくは、イスラエルの民が神に選ばれ、神と契約を結んだ特別な民であるとする考え方である。民族の区別を超えた救いを説いて世界宗教となったのは、ユダヤ教から生まれたキリスト教である。"},{"t":"qa","s":"キリスト教","imp":3,"q":"イエスが説いた、罪人を含むすべての人間に分けへだてなく注がれる、神の無差別・無償の愛を何というか。","a":"アガペー","alt":["神の愛"],"e":"アガペーは、相手の価値や見返りを問わずに与えられる愛である。イエスは、この神の愛を受けた人間には、神を愛すること（神への愛）と、隣人を自分のように愛すること（隣人愛）が求められると説いた。"},{"t":"ex","s":"キリスト教","imp":1,"q":"キリスト教のアガペーとはどのような愛か、古代ギリシアのプラトンが説いたエロースと比較して説明せよ。","a":"アガペーは、神が人間に対して、その価値や功績にかかわりなく無差別・無償で注ぐ愛であり、罪人にも向けられる。これに対しエロースは、自分に欠けている価値あるもの（真・善・美）を求めて高まろうとする愛である。アガペーは与える愛、エロースは求める愛として対比される。","e":"ポイント：①アガペーは神からの無差別・無償の愛 ②エロースは価値あるものを求める愛（プラトン） ③与える愛と求める愛の対比"},{"t":"qa","s":"キリスト教","imp":2,"q":"「何事でも人々からしてほしいと望むことは、人々にもそのとおりにせよ」というイエスの言葉は、キリスト教道徳の根本を示すものとして何とよばれるか。","a":"黄金律","alt":["ゴールデン・ルール"],"e":"『新約聖書』の「マタイによる福音書」にある山上の説教の一節で、隣人愛を具体的に示した教えである。孔子の「己の欲せざる所は人に施すこと勿かれ」と比べられることも多い。"},{"t":"tf","s":"キリスト教","imp":2,"q":"イエスは、律法を形式的に守ることを重視するパリサイ派の律法主義を批判し、律法の精神は神への愛と隣人愛にあると説いた。","a":true,"e":"イエスはユダヤ教の律法そのものを否定したのではない。形だけ律法を守って他人を裁く律法主義を批判し、律法の根本は「心をつくして神を愛すること」と「隣人を自分のように愛すること」にあると説いた。"},{"t":"qa","s":"キリスト教","imp":2,"q":"イエスの死後、ユダヤ人以外の人々（異邦人）への伝道に努め、人が救われるのは律法を守る行いではなく、イエス・キリストへの信仰によると説いた使徒は誰か。","a":"パウロ","e":"この考えを信仰義認説という。パウロは、人間はアダム以来の原罪を負っているが、イエスの十字架の死によってあがなわれたと説き、キリスト教が民族を超えた世界宗教として広がる基礎を築いた。信仰・希望・愛をキリスト教の三元徳としたことでも知られる。"},{"t":"mc","s":"キリスト教","imp":3,"q":"キリスト教についての記述として最も適当なものを一つ選べ。","c":["イエスは、神の愛は罪人を含むすべての人に注がれると説き、敵をも愛する隣人愛を実践するよう求めた。","イエスは、神に選ばれた民族だけが救われると説き、律法を一字一句厳格に守ることを最も重視した。","パウロは、人は律法を守る行いによってのみ救われると説き、異邦人への伝道に反対した。","キリスト教の聖典は、神の啓示をムハンマドが受けてアラビア語で記録した『クルアーン』である。"],"a":0,"e":"イエスは「敵を愛し、迫害する者のために祈れ」と説き、分けへだてのない隣人愛を求めた。「選ばれた民族だけが救われる」はユダヤ教の選民思想、律法の厳格な遵守は律法主義であり、イエスが批判したものなので誤り。パウロは信仰によって救われると説いて異邦人に伝道したので誤り。『クルアーン』はイスラームの聖典であり、キリスト教の聖典は『新約聖書』と『旧約聖書』なので誤り。"},{"t":"qa","s":"イスラーム","imp":3,"q":"唯一神アッラーが預言者ムハンマドに下した啓示をまとめた、アラビア語で書かれたイスラームの聖典は何か。","a":"クルアーン","alt":["コーラン","『クルアーン』"],"e":"7世紀前半、アラビア半島のメッカの商人ムハンマドが神の啓示を受け、イスラーム（「神への絶対的な服従・帰依」の意味）を開いた。ムハンマドは神ではなく、神の言葉を預かった人間であり、「最後で最大の預言者」とされる。"},{"t":"qa","s":"イスラーム","imp":3,"q":"イスラームの信者（ムスリム）が信じるべき6つの事柄と、実践すべき5つの宗教的義務をあわせて何というか。","a":"六信五行","e":"六信は、神（アッラー）・天使・啓典・預言者・来世・天命（定命）を信じること。五行は、信仰告白・礼拝・喜捨・断食・巡礼である。礼拝は1日5回メッカの方向に向かって行い、断食はラマダーン月に日の出から日没まで飲食を断つ。"},{"t":"mc","s":"イスラーム","imp":2,"q":"イスラームの五行についての記述として適当でないものを一つ選べ。","c":["1日5回、聖地メッカの方向に向かって礼拝する。","ラマダーン月には、日の出から日没まで飲食を断つ。","貧しい人々を助けるため、財産の一部を喜捨として差し出す。","すべての信者が例外なく、生涯に一度は聖地エルサレムへ巡礼しなければならない。"],"a":3,"e":"五行の巡礼は、聖地メッカ（カーバ神殿）へ、経済的・身体的に可能な者が生涯に一度行うものである。巡礼先をエルサレムとし、「例外なく」としている点が誤り。他の3つは礼拝・断食・喜捨の正しい説明である。五行にはこのほか、「アッラーのほかに神はなく、ムハンマドは神の使徒である」と唱える信仰告白がある。"},{"t":"qa","s":"イスラーム","imp":2,"q":"『クルアーン』やムハンマドの言行（スンナ）をもとに、礼拝などの宗教儀礼から結婚・相続・商取引・刑罰まで、信者の生活全般を規律する法を何というか。","a":"シャリーア","alt":["イスラーム法"],"e":"イスラームでは宗教と生活・政治が一体のものとされ、シャリーアが生活の隅々まで規律する。豚肉を食べないことや飲酒の禁止もその例であり、教えにかなった許された食品はハラールとよばれる。"},{"t":"tf","s":"イスラーム","imp":3,"q":"イスラームでは、ムハンマドを神の子として崇拝し、その姿を描いた像を礼拝の対象としている。","a":false,"e":"正しくは、ムハンマドは神ではなく、神の言葉を預かった人間（最後の預言者）である。イスラームは偶像崇拝を厳しく禁じており、モスクにも神やムハンマドの像は置かれない。なお、イエスも神の子ではなく預言者の一人とされる。"},{"t":"mc","s":"イスラーム","imp":2,"q":"イスラームについての記述として最も適当なものを一つ選べ。","c":["民族や国家の違いを超えた信者の共同体をウンマといい、神の前ではすべての信者が平等であるとされる。","シャリーアは礼拝や断食などの宗教儀礼だけを定めたもので、結婚や商取引などの日常生活は対象としていない。","『クルアーン』は各国語に翻訳されたものも、アラビア語の原典とまったく同じ聖典として扱われる。","六信には来世が含まれず、現世での行いの善悪は死後の運命に影響しないとされる。"],"a":0,"e":"ウンマは信者の共同体で、ムハンマドがメディナで築いた共同体に始まる。シャリーアは日常生活全般を規律する法なので誤り。『クルアーン』は神がアラビア語で下した言葉とされ、翻訳は原典と同じ聖典とはみなされないので誤り。六信には来世が含まれ、最後の審判で現世の行いが裁かれるとされるので誤り。"},{"t":"qa","s":"仏教","imp":2,"q":"紀元前5世紀ごろのインドでシャカ族の王子として生まれ、出家と修行の末に悟りを開き、「目覚めた人」を意味するブッダとよばれた仏教の開祖は誰か。","a":"ゴータマ・シッダッタ","alt":["ガウタマ・シッダールタ","ゴータマ・ブッダ","釈迦","シャカ","釈尊"],"e":"生・老・病・死の苦しみ（四苦）からの解放を求めて出家し、苦行を経たのち瞑想によって悟りを開いた。尊敬をこめて釈迦（釈迦牟尼）、釈尊ともよばれる。"},{"t":"qa","s":"仏教","imp":3,"q":"すべての事物は、さまざまな原因や条件が相互に依存し合うことで成り立っており、それ自体で独立して存在するものは何もないという、ブッダが悟った真理を何というか。","a":"縁起","alt":["縁起の法"],"e":"「これあるとき、かれあり。これ生ずるとき、かれ生ず」と表現される。縁起を理解すれば、すべては移り変わり（諸行無常）、不変の実体としての自我もない（諸法無我）とわかり、それに執着することから苦しみが生まれると気づくことができる。"},{"t":"mc","s":"仏教","imp":1,"q":"仏教の教えの特徴を示す四法印の内容として適当でないものを一つ選べ。","c":["諸行無常：あらゆるものは絶えず変化し、永遠不変のものは何もない。","諸法無我：あらゆるものには、永遠不変の実体としての自我（我）はない。","涅槃寂静：煩悩の炎が消えた悟りの境地は、静かな安らぎに満ちている。","霊魂不滅：人間の霊魂は永遠に変わらず、死後も同じ自我として存在し続ける。"],"a":3,"e":"四法印は、一切皆苦・諸行無常・諸法無我・涅槃寂静の4つである（一切皆苦を除いて三法印ともいう）。「霊魂不滅」は四法印に含まれず、不変の自我を認める点で諸法無我の考え方と矛盾するので誤り。"},{"t":"ex","s":"仏教","imp":3,"q":"ブッダが説いた四諦（四つの真理）とは何か、説明せよ。","a":"四諦とは、苦諦・集諦・滅諦・道諦の4つの真理である。人生は思いどおりにならない苦しみである（苦諦）、苦しみの原因は欲望への執着である煩悩にある（集諦）、煩悩を滅すれば苦しみのない悟りの境地（涅槃）に至る（滅諦）、そのための正しい修行の道が八正道である（道諦）。","e":"ポイント：①人生は苦である ②苦の原因は煩悩（執着） ③煩悩を滅した涅槃 ④そこに至る方法が八正道（正見・正思・正語・正業・正命・正精進・正念・正定）"},{"t":"qa","s":"仏教","imp":3,"q":"ブッダが、快楽におぼれる生活と、身体を痛めつける苦行の両極端を避けることを説いた立場を何というか。","a":"中道","e":"ブッダは王子として快楽の生活を送り、出家後は厳しい苦行を行ったが、どちらでも悟りは得られなかった。そこで両極端を離れて瞑想し、悟りを開いた。中道を具体的に実践する方法が八正道である。"},{"t":"tf","s":"仏教","imp":2,"q":"仏教の慈悲とは、生きとし生けるものすべてに対して、楽を与え（慈）、苦しみを取り除こう（悲）とする心である。","a":true,"e":"慈は「いつくしみ」で他者に楽を与えること（与楽）、悲は「あわれみ」で他者の苦しみを取り除くこと（抜苦）である。親しい人だけに向ける愛ではなく、人間以外も含むすべての生命に向けられる点が特徴である。"},{"t":"qa","s":"儒教","imp":3,"q":"古代中国の孔子が最も重要な徳とした、肉親への自然な親愛の情を基礎として他者に広げていく、人を思いやり愛する心を何というか。","a":"仁","e":"仁が言葉や行いとして外に表れたものが礼（社会の規範）であり、孔子は「己に克ちて礼に復るを仁と為す」（克己復礼）と述べた。仁の具体的な内容には、自分を偽らない忠と、他人を思いやる恕（「己の欲せざる所は人に施すこと勿かれ」）がある。孔子の言行は弟子たちによって『論語』にまとめられた。"},{"t":"tf","s":"儒教","imp":2,"q":"孔子は、法律と刑罰によって民を厳しく統制することが、社会の秩序を保つ最もよい方法であると説いた。","a":false,"e":"正しくは、孔子は為政者自身が仁や礼などの徳を身につけ、その徳によって民を感化して治める徳治主義を理想とした。法律と刑罰による統治（法治主義）を説いたのは、韓非子などの法家である。"}]});</script>
<script>QDATA.push({"unit":"u03","questions":[{"t":"qa","s":"日本の神と信仰","imp":3,"q":"古代の日本人が、山・川・岩・樹木や雷・風などの自然物や自然現象に宿ると考えた、数多くの神々を総称して何というか。","a":"八百万の神","alt":["八百万神","やおよろずの神"],"e":"唯一絶対の神とは異なり、日本の神々は自然のあらゆるところに宿ると考えられた。神は恵みをもたらすだけでなく、祟りをもたらす恐ろしい存在でもあり、人々は祭りによって神をしずめ、恵みを祈った。"},{"t":"tf","s":"日本の神と信仰","imp":2,"q":"自然界のあらゆる事物に霊魂や精霊が宿るとする信仰をアニミズムといい、山や岩、巨木などを神としてまつる日本古来の信仰にもこうした性格がみられる。","a":true,"e":"アニミズムは、イギリスの人類学者タイラーが用いた言葉で、ラテン語の「アニマ（霊魂）」に由来する。八百万の神への信仰は、アニミズム的な性格をもつ多神教的な信仰である。"},{"t":"qa","s":"日本の神と信仰","imp":3,"q":"古代の日本人が重んじた、神に対して偽りや隠しごとのない、清らかで明るい心を何というか。","a":"清き明き心","alt":["清明心","清き明き心（清明心）"],"e":"清明心ともいう。反対に、偽りや私利私欲をもつ心は「きたなき心」「黒き心」として嫌われた。この心情は、のちに中世の「正直」、近世の「誠」へと受け継がれ、日本人の倫理観の基礎となった。"},{"t":"qa","s":"ハレとケ","imp":3,"q":"民俗学者の柳田国男が、祭礼や年中行事などの特別な非日常を「ハレ」とよんだのに対し、ふだんの日常生活を何とよんだか。","a":"ケ","alt":["褻"],"e":"ハレの日には晴れ着を着てごちそうを食べるなど、日常（ケ）とは異なるふるまいをした。柳田国男は『遠野物語』などで知られ、文字に残らない庶民（常民）の生活や信仰を研究して日本の民俗学を確立した。"},{"t":"ex","s":"ハレとケ","imp":2,"q":"日本の伝統的な生活における、ハレ・ケ・ケガレの関係を説明せよ。","a":"ケは労働などを営む日常の生活、ハレは祭りや年中行事などの特別な非日常である。ケガレは、死や病などの不幸や、日常の活力が衰えた状態をさす（「ケが枯れる」ことと解する説もある）。人々はハレの行事によってケガレをはらい、日常の活力を回復させてきたと説明される。","e":"ポイント：①ケ＝日常、ハレ＝非日常（祭り・年中行事） ②ケガレ＝死・病などの不幸や日常の活力が衰えた状態 ③ハレの行事でケガレをはらい日常を回復する"},{"t":"mc","s":"年中行事と通過儀礼","imp":2,"q":"人生の節目ごとに行われ、人が新しい段階に移ることを示す儀礼を通過儀礼という。通過儀礼にあたるものとして最も適当なものを一つ選べ。","c":["子どもが3歳・5歳・7歳の年に神社に参拝し、成長を祝う。","毎年2月の節分に、豆をまいて邪気を追い払う。","毎年夏のお盆に、祖先の霊を迎えて供養する。","毎年正月に門松を立てて、年神を迎える。"],"a":0,"e":"七五三は、子どもの成長の節目を祝う通過儀礼である。節分・お盆・正月は、毎年決まった時期にくり返し行われる年中行事なので誤り。通過儀礼にはほかに、お宮参り・成人式・結婚式・葬式などがある。年中行事には、季節の移り変わりや農耕のリズムと結びついたものが多い。"},{"t":"qa","s":"和の精神","imp":2,"q":"聖徳太子（厩戸王）が604年に定めたとされ、「和を以て貴しと為し」という言葉で始まる、役人の心構えを示した規範は何か。","a":"十七条憲法","alt":["憲法十七条","十七条の憲法"],"e":"集団の中で対立を避け、調和を重んじる「和」の精神を示したもので、「篤く三宝を敬え（三宝とは仏・法・僧なり）」と仏教の尊重も説いた。現代の憲法のような国家の基本法ではなく、役人に向けた道徳的な訓戒である。"},{"t":"qa","s":"日本文化論","imp":3,"q":"『風土』や『倫理学』を著し、人間を孤立した個人ではなく、人と人との関係の中で生きる「間柄的存在」としてとらえた哲学者は誰か。","a":"和辻哲郎","alt":["和辻"],"e":"和辻哲郎は、「人間」という言葉は「人の間」を意味すると考え、人間は個人であると同時に社会的な存在であるとした。西洋近代の個人主義的な人間観を批判し、倫理学を「人間の学」としてとらえ直した。"},{"t":"mc","s":"日本文化論","imp":3,"q":"和辻哲郎が『風土』で示した風土の類型と、そこに暮らす人々の性格の組合せとして最も適当なものを一つ選べ。","c":["モンスーン型：自然は恵みと暴威の両方をもたらすため、人間は受容的・忍従的になる。","砂漠型：自然は穏やかで規則的なため、人間は合理的・自発的になる。","牧場型：自然は厳しく死の脅威に満ちているため、人間は対抗的・戦闘的になる。","モンスーン型：自然は従順で予測しやすいため、人間は自然を支配する計画的な性格になる。"],"a":0,"e":"モンスーン型（東アジア・南アジアなど）は暑熱と湿潤が恵みと災害をもたらすため受容的・忍従的、砂漠型（西アジア・北アフリカなど）は自然が厳しいため対抗的・戦闘的、牧場型（ヨーロッパ）は自然が穏やかで規則的なため合理的・自発的になるとされた。砂漠型と牧場型の説明を入れ替えた選択肢と、モンスーン型を牧場型のように説明した選択肢は誤り。"},{"t":"tf","s":"日本文化論","imp":2,"q":"和辻哲郎は、人間を他者との関係から切り離された独立した個人としてとらえ、西洋近代の個人主義を日本人が見習うべき人間観として高く評価した。","a":false,"e":"正しくは、和辻哲郎は人間を人と人との関係の中で生きる「間柄的存在」としてとらえ、他者から切り離された個人を出発点とする西洋近代の個人主義的な人間観を批判した。"},{"t":"tf","s":"日本文化論","imp":3,"q":"ベネディクトは『菊と刀』で、日本文化を内面の良心に基づいて行動を律する「罪の文化」、欧米の文化を他人の目を意識して行動を律する「恥の文化」と特徴づけた。","a":false,"e":"正しくは逆で、日本文化を世間の目や他者からの評価を意識して行動を律する「恥の文化」、欧米の文化を神の前での内面的な罪の自覚によって行動を律する「罪の文化」と特徴づけた。日本と欧米の入れ替えは典型的なひっかけである。"},{"t":"ex","s":"日本文化論","imp":2,"q":"アメリカの文化人類学者ベネディクトが『菊と刀』で示した「恥の文化」と「罪の文化」の違いを説明せよ。","a":"「罪の文化」は欧米に典型的な文化で、人々は神の前で自らの良心に照らして罪を自覚することにより、内面から行動を律する。これに対し日本に典型的な「恥の文化」では、人々は世間の目や他人からの評価を意識し、恥をかかないようにすることで、外面から行動を律するとされた。","e":"ポイント：①罪の文化＝欧米、内面の良心（神の前での罪の意識）による規律 ②恥の文化＝日本、世間の目・他者の評価による規律 ③内面的な規律と外面的な規律の対比"},{"t":"qa","s":"日本文化論","imp":1,"q":"精神科医の土居健郎が日本人の人間関係の特徴として示した、周囲の人の好意をあてにして、それに依存しようとする心理を何というか。","a":"甘え","alt":["「甘え」"],"e":"土居健郎は『「甘え」の構造』（1971年）で、親子関係をモデルとする「甘え」の心理が、日本人の人間関係や社会のあり方を理解するかぎになると論じた。"},{"t":"qa","s":"日本文化論","imp":1,"q":"社会人類学者の中根千枝が、日本社会では個人の資格よりも所属する場（集団）が重視され、集団内の上下の序列が重んじられると指摘して用いた言葉は何か。","a":"タテ社会","alt":["縦社会","タテ社会の人間関係"],"e":"『タテ社会の人間関係』（1967年）で示された。日本人は「何の仕事をしているか（資格）」よりも「どの会社や組織に属しているか（場）」を重視し、先輩・後輩のような上下関係が強いとされる。"},{"t":"mc","s":"日本文化論","imp":1,"q":"日本文化や日本人のあり方を論じた人物と、その人物が用いた言葉の組合せとして最も適当なものを一つ選べ。","c":["本居宣長：もののあはれ","土居健郎：タテ社会","中根千枝：甘え","和辻哲郎：恥の文化"],"a":0,"e":"江戸時代の国学者本居宣長は、物事にふれて自然にわき起こるしみじみとした感情を「もののあはれ」とよび、それを知ることが『源氏物語』の本質であるとした。また、仏教や儒教の影響を受けた理屈っぽい心（漢意）を排し、生まれつきの素直な心（真心）を重んじた。「タテ社会」は中根千枝、「甘え」は土居健郎、「恥の文化」はベネディクトの言葉なので誤り。"},{"t":"qa","s":"異文化理解","imp":3,"q":"自分が属する民族や社会の文化を最も優れたものとみなし、それを基準にして他の文化を劣ったものとして評価する態度を何というか。","a":"エスノセントリズム","alt":["自民族中心主義","自文化中心主義"],"e":"自民族中心主義ともいう。異文化への偏見や差別、植民地支配の正当化などにつながってきた。これを反省し、それぞれの文化に固有の価値を認める文化相対主義が唱えられた。"},{"t":"ex","s":"異文化理解","imp":3,"q":"文化相対主義とは何か、エスノセントリズムと対比して説明せよ。","a":"文化相対主義とは、それぞれの文化はその社会の環境や歴史の中で形成された固有の価値をもち、文化の間に優劣はないとして、他の文化をその文化の文脈に即して理解しようとする考え方である。自文化を基準に他の文化を劣ったものとみなすエスノセントリズムを批判する立場である。","e":"ポイント：①文化には固有の価値があり優劣はない ②他の文化をその文脈に即して理解する ③自文化を基準とするエスノセントリズムへの批判（ただし、人権侵害にあたる慣習まで容認すべきかという課題もある）"},{"t":"ex","s":"異文化理解","imp":2,"q":"多文化主義（マルチカルチュラリズム）とは何か、同化主義と対比して説明せよ。","a":"多文化主義とは、一つの国家や社会の中に共存する異なる民族や文化の独自性を尊重し、それぞれの文化を維持しながら対等に共生することをめざす考え方や政策である。少数派の人々に多数派の言語や文化への同化を求める同化主義とは対照的である。カナダやオーストラリアが政策として採用したことで知られる。","e":"ポイント：①異なる文化の独自性を尊重して共生する ②少数派に多数派文化への同化を求める同化主義と対比 ③カナダ・オーストラリアなどの政策"},{"t":"qa","s":"異文化理解","imp":1,"q":"パレスチナ出身の批評家サイードが、西洋が東洋を「後進的で神秘的な他者」として一方的に描き出し、支配を正当化してきた思考様式を批判して著した書物は何か。","a":"『オリエンタリズム』","alt":["オリエンタリズム"],"e":"1978年刊。サイードは、西洋が自らを理性的・先進的とし、東洋（オリエント）をその反対のものとして固定的に描いてきたことを批判した。異文化を一面的なイメージでとらえるステレオタイプへの批判にもつながる。"},{"t":"tf","s":"異文化理解","imp":2,"q":"特定の国や民族の人々について「〇〇人はみな〜だ」のように単純化・固定化されたイメージをステレオタイプといい、偏見や差別を生む原因となりうる。","a":true,"e":"ステレオタイプは、マスメディアや周囲の人の言動などを通じて無意識のうちに形成されやすい。異文化理解には、一人ひとりを固定的なイメージで判断せず、直接の対話を通じて理解しようとする姿勢が大切である。"},{"t":"mc","s":"異文化理解","imp":2,"q":"次の事例のうち、エスノセントリズムにあたるものとして最も適当なものを一つ選べ。","c":["ある生徒が、留学生の母国の食習慣を「遅れていて野蛮だ」と決めつけ、自国の食べ方に合わせるよう求めた。","ある自治体が、外国出身の住民も地域の祭りに参加しやすいよう、多言語の案内を作成した。","ある学校が、宗教上の理由で食べられない食材がある生徒のために、給食の献立表に原材料を表示した。","ある学生が、自国と異なる結婚の習慣について、その社会の歴史や環境の中で生まれた意味を調べて理解しようとした。"],"a":0,"e":"自国の食習慣を基準に他国の習慣を劣ったものと決めつける態度は、エスノセントリズムの典型である。多言語の案内の作成や、宗教上の食の制約への配慮は、多文化共生のための取り組みである。異なる習慣をその社会の文脈で理解しようとするのは、文化相対主義の態度である。"}]});</script>
<script>QDATA.push({"unit":"u03","questions":[{"t":"qa","s":"生命倫理の基本","imp":3,"q":"生命科学や医療技術の急速な発達にともなって生じる、生と死にかかわる倫理的な問題を考える学問を何というか。","a":"バイオエシックス","alt":["生命倫理","生命倫理学"],"e":"日本語では生命倫理（学）という。臓器移植、終末期医療、生殖補助医療、遺伝子技術などをめぐり、医療の進歩と人間の尊厳や患者の自己決定権との関係が問われている。"},{"t":"qa","s":"生命倫理の基本","imp":3,"q":"医師が患者に病状や治療の方法、その効果や危険性などを十分に説明し、患者がそれを理解・納得したうえで治療方針に同意することを何というか。","a":"インフォームド・コンセント","alt":["インフォームドコンセント","説明と同意"],"e":"「説明と同意」と訳される。患者が自分の生命や身体のあり方を自分で決める自己決定権を尊重する考え方に基づく。医師が一方的に治療方針を決めるパターナリズムへの反省から重視されるようになった。"},{"t":"ex","s":"生命倫理の基本","imp":3,"q":"医療におけるパターナリズムとは何か、患者の自己決定権との関係にふれて説明せよ。","a":"パターナリズム（父権主義）とは、強い立場にある者が、弱い立場の者の利益になるとして、本人の意思にかかわりなく干渉や決定をすることである。医療では、専門知識をもつ医師が患者の治療方針を一方的に決める態度をさす。現在は患者の自己決定権を尊重し、十分な説明と同意に基づく医療（インフォームド・コンセント）が重視されている。","e":"ポイント：①本人の利益のためとして、本人の意思にかかわりなく干渉・決定する ②医師が治療方針を一方的に決める態度 ③自己決定権の尊重とインフォームド・コンセントへの転換"},{"t":"mc","s":"生命倫理の基本","imp":3,"q":"次の事例のうち、インフォームド・コンセントの考え方に沿った対応として最も適当なものを一つ選べ。","c":["医師が、患者を不安にさせないよう病名を本人には伏せ、家族とだけ相談して手術を決めた。","医師が、専門家として最善と判断した治療法を、患者への説明を省いてすぐに実施した。","医師が、複数の治療法の効果や副作用を患者にわかりやすく説明し、患者が納得したうえで治療法を選んだ。","患者が検査の内容について説明を求めたが、医師は「すべて任せてください」と答えて説明しなかった。"],"a":2,"e":"十分な説明を受けた患者が、理解・納得したうえで自ら治療法を選ぶのがインフォームド・コンセントである。本人に病名を伏せて家族と決める対応、説明を省いて実施する対応、説明を求められても応じない対応は、いずれも医師が一方的に決めるパターナリズム的な対応であり、患者の自己決定権を尊重していない。"},{"t":"qa","s":"生命倫理の基本","imp":2,"q":"患者が人間らしく、自分らしい生活を送れているかという「生命（生活）の質」を重視する考え方を、英語の頭文字をとって何というか。","a":"QOL","alt":["クオリティ・オブ・ライフ","クオリティオブライフ","Quality of Life"],"e":"QOLはクオリティ・オブ・ライフの略である。これに対し、生命そのものに絶対的な価値があるとする考え方をSOL（生命の尊厳、サンクティティ・オブ・ライフ）という。終末期医療では、延命治療をどこまで行うかをめぐって両者が対立することがある。"},{"t":"ex","s":"生命倫理の基本","imp":2,"q":"SOL（生命の尊厳）とQOL（生命の質）の考え方の違いを、終末期医療を例に説明せよ。","a":"SOLは、生命はそれ自体が神聖でかけがえのない価値をもつとする考え方で、できる限り生命を維持する延命治療を重視する方向につながる。QOLは、本人が人間らしく、自分らしく生きられるかという生命や生活の質を重視する考え方で、延命よりも苦痛の緩和や本人の意思に沿った生き方を優先する判断につながる。","e":"ポイント：①SOL＝生命そのものの絶対的な価値、延命を重視 ②QOL＝生命・生活の質、本人らしい生き方を重視 ③終末期医療の延命治療をめぐって対立しうる"},{"t":"tf","s":"脳死と臓器移植","imp":2,"q":"脳死とは、脳幹を含む脳全体の機能が不可逆的に停止した状態をいい、脳幹の機能が残っていて自発呼吸ができることも多い植物状態
