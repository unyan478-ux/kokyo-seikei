<script>QDATA.push({"unit":"u08","questions":[{"t":"qa","s":"三審制と再審","imp":3,"q":"一つの事件について、原則として3回まで裁判を受けることができる制度を何というか。","a":"三審制","e":"第一審の判決に不服なときは控訴、第二審の判決に不服なときは上告をして、上級の裁判所に審理を求めることができる。慎重な裁判によって誤判を防ぎ、人権を守るための制度である。"},{"t":"qa","s":"三審制と再審","imp":3,"q":"第一審の判決に不服がある当事者が、上級の裁判所に審理を求めることを何というか。","a":"控訴","e":"第二審（控訴審）の判決に不服がある場合に、さらに上級の裁判所に審理を求めることを上告という。判決ではなく、決定や命令に対する不服申立ては抗告という。"},{"t":"mc","s":"三審制と再審","imp":2,"q":"簡易裁判所が第一審となった民事裁判で、その判決に不服な当事者が控訴する先の裁判所として最も適当なものを一つ選べ。","c":["地方裁判所","高等裁判所","家庭裁判所","最高裁判所"],"a":0,"e":"民事裁判では、簡易裁判所の判決への控訴は地方裁判所が扱い、その判決への上告は高等裁判所が扱う。一方、刑事裁判では、簡易裁判所の判決への控訴は高等裁判所が扱い、上告は最高裁判所が扱う。民事と刑事で控訴先が違う点がひっかけになりやすい。"},{"t":"qa","s":"三審制と再審","imp":3,"q":"判決が確定した後に、無罪を言い渡すべき明らかな新しい証拠が見つかった場合などに、裁判をやり直す制度を何というか。","a":"再審","e":"無実の人が有罪とされる冤罪を救済するための制度である。1975年の最高裁判所の白鳥決定で、再審を開始するかどうかの判断にも「疑わしきは被告人の利益に」の原則が適用されるとされた。"},{"t":"tf","s":"三審制と再審","imp":2,"q":"死刑判決が確定した事件で、再審によって無罪となった例はこれまでにない。","a":false,"e":"誤り。正しくは、1980年代に免田事件・財田川事件・松山事件・島田事件の4件で死刑が確定した人が再審で無罪となり、2024年には袴田事件でも再審無罪の判決が確定した。冤罪の防止と死刑制度のあり方を考える重要な事例である。"},{"t":"ex","s":"三審制と再審","imp":2,"q":"三審制がとられている理由を説明せよ。","a":"裁判官も人間である以上、判断を誤るおそれがある。そこで、判決に不服がある当事者が上級の裁判所で改めて審理を受けられるようにし、慎重な審理によって誤った裁判を防いで、国民の権利を確実に守るためである。","e":"ポイント：①誤判の防止 ②上級の裁判所による審理（控訴・上告） ③慎重で公正な裁判による人権保障"},{"t":"ex","s":"裁判の種類","imp":3,"q":"民事裁判・刑事裁判・行政裁判の違いを説明せよ。","a":"民事裁判は、貸したお金の返済や損害賠償など私人の間の争いを解決する裁判で、訴えた側を原告、訴えられた側を被告という。刑事裁判は、検察官が犯罪の疑いのある人（被告人）を起訴し、有罪か無罪か、有罪ならどのような刑罰を科すかを決める裁判である。行政裁判は、国や地方公共団体の処分の取消しなど、行政に関する争いを扱う裁判である。","e":"ポイント：①民事＝私人間の争い、原告と被告 ②刑事＝検察官が起訴、被告人、刑罰 ③行政＝行政処分などをめぐる争い ④日本では行政裁判も通常の裁判所が扱う"},{"t":"qa","s":"裁判の種類","imp":1,"q":"国や地方公共団体の行政処分の取消しなどを求めて裁判所に起こす訴訟を何というか。","a":"行政訴訟","alt":["行政裁判","行政事件訴訟"],"e":"手続は行政事件訴訟法に定められている。明治憲法下では特別裁判所である行政裁判所が扱ったが、現在は通常の裁判所が扱う。"},{"t":"qa","s":"司法制度改革","imp":2,"q":"司法制度改革の一環として、裁判官・検察官・弁護士（法曹）を養成するため2004年に開校した専門職大学院を何というか。","a":"法科大学院","alt":["ロースクール"],"e":"法曹の数を増やし、国民が法的なサービスを受けやすくすることが改革のねらいであった。司法試験の受験資格は、主に法科大学院の修了か予備試験の合格によって得られる。"},{"t":"qa","s":"司法制度改革","imp":2,"q":"法的トラブルの相談窓口の案内や、経済的に余裕のない人への弁護士費用の立替えなどを行う、日本司法支援センターの通称を何というか。","a":"法テラス","e":"総合法律支援法に基づいて設立され、2006年に業務を開始した。国選弁護人の確保や、弁護士の少ない地域での法律サービスの提供も行っている。"},{"t":"mc","s":"司法制度改革","imp":2,"q":"2000年代以降の日本の司法制度改革の内容として適当でないものを一つ選べ。","c":["法曹を養成するため、法科大学院を設置した。","国民が法的サービスを受けやすくするため、日本司法支援センター（法テラス）を設置した。","国民が刑事裁判に参加する裁判員制度を導入した。","民事裁判に陪審制を導入し、陪審員が損害賠償額を決めるようにした。"],"a":3,"e":"日本で導入されたのは、刑事裁判の第一審に国民が参加する裁判員制度であり、民事裁判に陪審制は導入されていない。法科大学院（2004年）、法テラス（2006年）、裁判員制度（2009年）は、いずれも司法制度改革の柱である。"},{"t":"qa","s":"司法制度改革","imp":1,"q":"特許権などの知的財産に関する事件を専門的に扱うため、2005年に東京高等裁判所の特別の支部として設置された裁判所を何というか。","a":"知的財産高等裁判所","alt":["知財高裁"],"e":"技術の高度化とともに増える知的財産をめぐる争いを、専門的かつ迅速に解決するために設けられた。東京高等裁判所の支部なので、憲法が禁止する特別裁判所にはあたらない。"},{"t":"qa","s":"裁判員制度","imp":3,"q":"くじで選ばれた国民が裁判官とともに刑事裁判の審理に参加し、有罪か無罪か、有罪の場合はどのような刑にするかを決める、2009年に始まった制度を何というか。","a":"裁判員制度","e":"対象は、殺人や強盗致死傷などの重大な刑事事件の第一審で、地方裁判所で行われる。裁判員は事件ごとに選ばれ、判決の宣告で任務を終える。"},{"t":"qa","s":"裁判員制度","imp":3,"q":"裁判員裁判は、原則として裁判官何人と裁判員何人で行われるか。","a":"裁判官3人・裁判員6人","alt":["裁判官3人と裁判員6人","3人・6人","裁判官3名・裁判員6名","3人と6人"],"e":"裁判官と裁判員は一緒に評議し、評決を行う。法律の解釈や訴訟手続に関する判断は、裁判官だけで行う。"},{"t":"tf","s":"裁判員制度","imp":3,"q":"裁判員制度は、重大な刑事事件だけでなく、民事裁判の第一審でも行われている。","a":false,"e":"誤り。正しくは、裁判員制度の対象は地方裁判所で行われる重大な刑事事件の第一審だけであり、民事裁判や行政裁判、控訴審は対象外である。"},{"t":"tf","s":"裁判員制度","imp":3,"q":"裁判員は、被告人が有罪か無罪かの判断だけでなく、有罪の場合にどのような刑を科すか（量刑）の判断にも加わる。","a":true,"e":"正しい。裁判員は、事実の認定、法令の適用、刑の量定に裁判官とともに関わる。量刑まで判断する点は、陪審制とは異なり参審制に近い。"},{"t":"tf","s":"裁判員制度","imp":2,"q":"裁判員の守秘義務は裁判が終われば解除されるので、任務を終えた後は、評議の経過や各裁判員の意見を自由に話してよい。","a":false,"e":"誤り。正しくは、評議の秘密や職務上知った秘密を守る義務は裁判員の任務が終わった後も続き、違反には罰則がある。ただし、公開の法廷で見聞きしたことや、裁判員を務めた感想を話すことは許される。"},{"t":"qa","s":"裁判員制度","imp":2,"q":"裁判員は、衆議院議員の選挙権をもつ人のうち、何歳以上の人の中からくじで選ばれるか。","a":"18歳以上","alt":["18歳","満18歳以上","満18歳"],"e":"以前は20歳以上だったが、成年年齢や選挙権年齢の引下げに合わせた法改正により、2022年4月から18歳以上が対象となった。70歳以上の人や学生などは、辞退を申し出ることができる。"},{"t":"tf","s":"裁判員制度","imp":1,"q":"裁判員裁判の評決は、裁判員6人だけの多数決で行われ、裁判官は評決に加わらない。","a":false,"e":"誤り。正しくは、裁判官と裁判員が一緒に評議し、合わせて9人の過半数で評決する。ただし被告人を有罪とするには、その過半数の中に裁判官と裁判員のそれぞれ1人以上が含まれていなければならない。"},{"t":"mc","s":"裁判員制度","imp":3,"q":"アメリカなどで採用されている陪審制の説明として最も適当なものを一つ選べ。","c":["任期制で選ばれた市民が、裁判官とともに合議体をつくり、有罪か無罪かと刑の重さを判断する。","事件ごとにくじで選ばれた市民が、裁判官とともに有罪か無罪かと刑の重さを判断する。","市民から選ばれた陪審員が、裁判官から独立して有罪か無罪かを判断し、刑の重さは原則として裁判官が決める。","市民は裁判に参加せず、職業裁判官だけで有罪か無罪かと刑の重さを判断する。"],"a":2,"e":"陪審制では、陪審員だけで有罪か無罪か（事実認定）を判断し、量刑は裁判官が担う。任期制の市民が裁判官と合議するのはドイツなどの参審制、事件ごとに選ばれた市民が裁判官と合議して量刑まで判断するのは日本の裁判員制度である。"},{"t":"ex","s":"裁判員制度","imp":2,"q":"日本の裁判員制度を、陪審制・参審制と比較して説明せよ。","a":"陪審制は、市民から選ばれた陪審員が裁判官から独立して有罪か無罪かを判断し、量刑は裁判官が決める制度である。参審制は、任期制で選ばれた市民が裁判官とともに有罪か無罪かと量刑を判断する制度である。日本の裁判員制度は、事件ごとにくじで選ばれる点では陪審制に、裁判官と合議して量刑まで判断する点では参審制に近い。","e":"ポイント：①陪審制＝陪審員が独立して事実認定、量刑は裁判官（アメリカなど） ②参審制＝任期制の参審員が裁判官と合議（ドイツなど） ③裁判員は事件ごとに選ばれる ④裁判官と合議し量刑も判断する"},{"t":"ex","s":"裁判員制度","imp":2,"q":"裁判員制度が導入された目的を説明せよ。","a":"国民が刑事裁判に参加することで、裁判の内容に国民の健全な社会常識を反映させ、裁判の進め方や判決を国民にとってわかりやすいものにすることがねらいである。それによって、司法に対する国民の理解と信頼を深めることが目的とされている。","e":"ポイント：①国民の社会常識の反映 ②わかりやすい裁判（争点の整理と迅速化） ③司法に対する国民の理解と信頼の向上"},{"t":"qa","s":"検察審査会","imp":2,"q":"検察官が事件を起訴しなかった処分（不起訴処分）が適切かどうかを、くじで選ばれた国民11人が審査する機関を何というか。","a":"検察審査会","e":"審査員は、衆議院議員の選挙権をもつ人の中からくじで選ばれる。審査の結果、「起訴相当」「不起訴不当」「不起訴相当」のいずれかを議決する。"},{"t":"tf","s":"検察審査会","imp":2,"q":"検察審査会が2度にわたって起訴すべきだと議決した場合には、裁判所が指定した弁護士が検察官に代わって起訴する。","a":true,"e":"正しい。2009年から導入された強制起訴の制度で、起訴すべきとする議決には11人中8人以上の賛成が必要である。起訴の権限を原則として検察官が独占していることに対し、国民の感覚による抑制を加える意味がある。"},{"t":"qa","s":"犯罪被害者と司法","imp":2,"q":"一定の重大事件の被害者や遺族が刑事裁判に参加し、公判に出席して被告人に質問したり意見を述べたりできる、2008年に導入された制度を何というか。","a":"被害者参加制度","alt":["被害者参加","被害者参加人制度"],"e":"犯罪被害者等基本法（2004年）の制定を受けて導入された。被害者が刑事手続の中で置き去りにされてきたという反省から、被害者の立場を重視する改革が進められた。"},{"t":"tf","s":"犯罪被害者と司法","imp":2,"q":"2010年の法改正により、殺人罪や強盗殺人罪など、人を死亡させた罪のうち法定刑の上限が死刑であるものについては、公訴時効が廃止された。","a":true,"e":"正しい。公訴時効とは、犯罪から一定の期間が過ぎると起訴できなくなる制度である。改正は、その時点で時効が完成していなかった事件にも適用され、ほかの人を死亡させた罪も時効期間が延長された。"},{"t":"mc","s":"犯罪被害者と司法","imp":1,"q":"近年の刑事司法の改革に関する記述として最も適当なものを一つ選べ。","c":["被害者参加制度により、被害者や遺族は検察官に代わって被告人を起訴できるようになった。","公訴時効の廃止は、法改正の時点ですでに時効が完成していた事件にもさかのぼって適用された。","被害者参加制度により、一定の重大事件の被害者や遺族は、刑事裁判で被告人に質問できるようになった。","検察審査会が起訴すべきだと議決しても、検察官が同意しなければ起訴されない。"],"a":2,"e":"被害者参加制度（2008年）により、被害者や遺族は公判に出席し、被告人への質問や意見の陳述ができるようになったが、起訴するのは検察官である。公訴時効の廃止は時効が完成していない事件に限って適用され、検察審査会が2度起訴すべきと議決すれば、指定弁護士が起訴する。"}]});</script>
<script>QDATA.push({"unit":"u09","questions":[{"t":"ex","s":"法と社会規範","imp":3,"q":"法と道徳の違いを説明せよ。","a":"法は、国家によって定められ、主に人の外面的な行為を規律する規範で、違反すると刑罰や損害賠償などの国家権力による強制が加えられる。道徳は、主に人の内面の良心にはたらきかける規範で、違反しても国家による強制はなく、良心の呵責や周囲からの非難を受けるにとどまる。","e":"ポイント：①法は外面、道徳は内面を規律する ②法は国家権力による強制（制裁）をともなう ③道徳の制裁は良心の呵責や社会的な非難 ④法・道徳・慣習・宗教などをまとめて社会規範という"},{"t":"qa","s":"法と社会規範","imp":1,"q":"「法は倫理の最小限である」と述べ、法と道徳の関係を示したドイツの法学者は誰か。","a":"イェリネック","alt":["G.イェリネック","ゲオルク・イェリネック"],"e":"道徳のすべてを法で強制するのではなく、殺人や盗みの禁止のように社会生活に欠かせない最低限の部分だけが法として強制される、という考え方を表している。"},{"t":"qa","s":"法の分類","imp":2,"q":"人間の本性や理性に基づき、時代や場所をこえて普遍的に通用すると考えられる法を何というか。","a":"自然法","e":"これに対し、人間がつくった法や社会の中で形成された法（制定法・慣習法・判例法など）を実定法という。自然法の思想は、社会契約説や基本的人権の考え方の土台となった。"},{"t":"qa","s":"法の分類","imp":1,"q":"慣習法や判例法のように、文章の形で制定されていない法を何というか。","a":"不文法","e":"憲法・法律・命令・条例・条約のように文章の形で定められた法は成文法という。日本は成文法が中心の大陸法系に属し、イギリスなどの英米法系では判例法が重要な役割を果たす。"},{"t":"qa","s":"法の分類","imp":3,"q":"労働基準法や生活保護法のように、私人間の関係に国家が介入して、社会的・経済的な弱者を保護する法を何というか。","a":"社会法","e":"国家と個人の関係などを定める公法と、私人どうしの関係を定める私法の中間に位置づけられる。資本主義の発展にともなう貧困や労働問題に対応するため、20世紀に発達した。"},{"t":"mc","s":"法の分類","imp":2,"q":"法の分類とその例の組合せとして最も適当なものを一つ選べ。","c":["公法 ― 民法","私法 ― 刑法","社会法 ― 労働組合法","手続法 ― 商法"],"a":2,"e":"労働組合法は労働者を保護するための社会法である。民法と商法は私人間の関係を定める私法で、権利・義務の内容を定める実体法でもある。刑法は国家が刑罰を科す関係を定める公法であり、手続法の例は民事訴訟法や刑事訴訟法である。"},{"t":"qa","s":"法の分類","imp":1,"q":"同じ事柄について一般法と特別法の定めが異なる場合、どちらが優先して適用されるか。","a":"特別法","alt":["特別法が優先する","特別法が優先"],"e":"「特別法は一般法に優先する」という原則である。たとえば契約一般については民法が一般法だが、消費者と事業者の契約には特別法である消費者契約法が優先して適用される。"},{"t":"tf","s":"法の分類","imp":1,"q":"民事訴訟法や刑事訴訟法は、権利や義務、犯罪と刑罰の内容そのものを定めた実体法である。","a":false,"e":"誤り。正しくは、民事訴訟法や刑事訴訟法は、裁判の進め方など、権利を実現したり刑罰を科したりする手続を定めた手続法である。権利・義務や犯罪・刑罰の内容を定める民法や刑法が実体法である。"},{"t":"qa","s":"私法の基本原則","imp":3,"q":"近代私法の原則のうち、個人は自分の意思で自由に契約を結ぶことができ、国家はこれに干渉すべきでないとする原則を何というか。","a":"契約自由の原則","alt":["私的自治の原則","契約自由","私的自治"],"e":"私的自治の原則の中心となる考え方で、誰と、どのような内容・方式で契約するかを当事者が自由に決められる。ただし、力の差がある当事者の間では、労働法や消費者契約法などによって修正されている。"},{"t":"mc","s":"私法の基本原則","imp":2,"q":"近代私法の基本原則とその内容の組合せとして適当でないものを一つ選べ。","c":["権利能力平等の原則 ― すべての個人は、身分や性別などに関係なく、等しく権利・義務の主体となることができる。","所有権絶対の原則 ― 所有者は、自分の物を自由に使用・収益・処分することができる。","過失責任の原則 ― 故意や過失がなくても、他人に損害を与えれば必ず賠償責任を負う。","私的自治の原則 ― 個人の私法上の関係は、本人の自由な意思に基づいて形成される。"],"a":2,"e":"過失責任の原則は、故意や過失がなければ損害賠償の責任を負わないとする原則なので、この組合せが誤り。故意・過失がなくても責任を負うとするのは、過失責任の原則を修正した無過失責任の考え方である。ほかの三つは、いずれも近代私法の基本原則の正しい説明である。"},{"t":"tf","s":"私法の基本原則","imp":1,"q":"所有権絶対の原則があるため、現在の日本でも、個人の所有権が公共の福祉を理由に制限されることはない。","a":false,"e":"誤り。正しくは、日本国憲法29条2項は財産権の内容を公共の福祉に適合するように法律で定めるとし、民法1条1項も「私権は、公共の福祉に適合しなければならない」と定めている。土地の収用や建築の規制など、所有権は公共の福祉によって制限される。"},{"t":"qa","s":"私法の基本原則","imp":2,"q":"公害や欠陥製品による被害などについて、加害者に故意や過失がなくても損害賠償の責任を負わせる考え方を何というか。","a":"無過失責任","alt":["無過失責任主義","無過失責任の原則"],"e":"被害者が加害者の過失を証明するのは難しいため、過失責任の原則を修正したものである。1972年の大気汚染防止法・水質汚濁防止法の改正で公害の無過失責任が定められ、製造物責任法も製造業者の無過失責任を定めている。"},{"t":"ex","s":"私法の基本原則","imp":3,"q":"契約自由の原則が修正されるようになった理由を、具体的な法律の例を挙げて説明せよ。","a":"契約自由の原則のもとでは、企業と労働者、事業者と消費者、貸主と借主のように経済力や情報量に大きな差がある当事者の間で、強い立場の側に一方的に有利な契約が結ばれやすい。そこで、労働基準法による最低労働条件の設定、借地借家法による借主の保護、消費者契約法による不当な契約の取消しなどによって、契約の自由が修正されている。","e":"ポイント：①当事者の間の経済力や情報の格差 ②形式的な自由が実質的な不平等を生む ③労働基準法・借地借家法・消費者契約法などによる修正 ④社会的・経済的な弱者の保護"},{"t":"qa","s":"契約の成立","imp":3,"q":"契約は、一方の当事者の「申込み」に対して、相手方が何をしたときに成立するか。","a":"承諾","e":"民法522条の規定で、申込みと承諾の意思表示が合致すれば、原則として契約書がなくても契約は成立する。契約が成立すると、当事者は互いに権利（債権）と義務（債務）を負う。"},{"t":"tf","s":"契約の成立","imp":3,"q":"契約は、契約書を作成して署名・押印しなければ成立しないので、口約束だけでは契約は成立しない。","a":false,"e":"誤り。正しくは、契約は申込みと承諾の意思表示が合致すれば成立し、口約束でも契約は成立する。ただし保証契約のように、法律で書面が必要とされている契約もある。契約書は、後で争いになったときの証拠として重要である。"},{"t":"mc","s":"契約の成立","imp":2,"q":"契約に関する記述として最も適当なものを一つ選べ。","c":["店で商品を指して「これをください」と言い、店員が「かしこまりました」と答えた時点で、売買契約が成立する。","電車やバスに乗ることは、運賃を支払っているだけなので、契約にはあたらない。","口約束で成立した契約は、当事者の一方がいつでも自由に取り消すことができる。","契約が成立しても、相手方が代金を支払わない場合に、裁判所に訴えて支払いを求めることはできない。"],"a":0,"e":"申込み（これをください）と承諾（かしこまりました）が合致した時点で売買契約が成立する。電車やバスに乗るのも運送契約である。成立した契約は一方的に取り消すことができず、相手方が約束した義務を果たさない場合（債務不履行）には、裁判所に訴えて履行を求めたり、損害賠償を請求したり、契約を解除したりできる。"},{"t":"qa","s":"契約の取消しと無効","imp":3,"q":"未成年者が親などの法定代理人の同意を得ずに結んだ契約を、後から取り消すことができる権利を何というか。","a":"未成年者取消権","alt":["未成年者の取消権","取消権"],"e":"民法5条に基づく。ただし、小遣いなど処分を許された財産の範囲内の契約や、成年であると偽るなどの詐術を用いて結んだ契約は取り消せない。18歳で成年になると、この権利は使えなくなる。"},{"t":"tf","s":"契約の取消しと無効","imp":2,"q":"未成年者が親の同意なしに結んだ契約でも、親から自由に使ってよいと渡された小遣いの範囲内の買い物であれば、原則として取り消すことはできない。","a":true,"e":"正しい。法定代理人が処分を許した財産（小遣いなど）の範囲内の行為は、未成年者が単独で有効に行うことができる。親の同意のない高額な契約などは取り消すことができる。"},{"t":"mc","s":"契約の取消しと無効","imp":3,"q":"契約の取消しや無効に関する記述として最も適当なものを一つ選べ。","c":["おどされて（強迫によって）結んだ契約は、取り消すことができず、常に有効である。","だまされて（詐欺によって）結んだ契約は、取り消すことができる。","公の秩序や善良の風俗に反する契約は、取り消されるまでは有効である。","重要な点について勘違い（錯誤）をして結んだ契約は、どのような場合でも取り消すことができない。"],"a":1,"e":"詐欺や強迫による契約は取り消すことができる（民法96条）。公序良俗に反する契約は初めから無効である（民法90条）。重要な点についての錯誤による契約も、一定の要件を満たせば取り消すことができる（民法95条）。"},{"t":"qa","s":"契約の取消しと無効","imp":2,"q":"犯罪を依頼する契約のように、公の秩序または善良の風俗に反する契約は、法律上どのように扱われるか。","a":"無効","alt":["無効になる","無効である"],"e":"民法90条の規定で、無効な契約は初めから効力がなく、当事者は契約の内容を実行する義務を負わない。いったん有効に成立した契約を後から効力のないものにする「取消し」とは異なる。"},{"t":"ex","s":"契約の取消しと無効","imp":2,"q":"契約の「無効」と「取消し」の違いを、例を挙げて説明せよ。","a":"無効とは、契約が初めから法律上の効力をもたないことで、公序良俗に反する契約などがあたる。取消しとは、いったん有効に成立した契約を、取消権をもつ人の意思表示によって初めにさかのぼって無効にすることで、未成年者が親の同意なく結んだ契約や、詐欺・強迫による契約などがあたる。取り消さない限り、契約は有効なままである。","e":"ポイント：①無効＝初めから効力がない（公序良俗違反など） ②取消し＝取り消すまでは有効で、取り消すと初めにさかのぼって無効になる ③取消しの例＝未成年者の契約、詐欺・強迫、錯誤"},{"t":"qa","s":"成年年齢の引下げ","imp":3,"q":"2018年の民法改正（2022年4月施行）によって、成年年齢は何歳に引き下げられたか。","a":"18歳","alt":["満18歳","18"],"e":"それまでは20歳であった。選挙権年齢（2016年から18歳）や、憲法改正の国民投票の投票権年齢とそろえるねらいもあった。"},{"t":"mc","s":"成年年齢の引下げ","imp":3,"q":"2022年4月以降、18歳になればできるようになったこととして適当でないものを一つ選べ。","c":["親の同意を得ずにクレジットカードをつくる。","親の同意を得ずにアパートの賃貸借契約を結ぶ。","有効期間10年のパスポートを取得する。","飲酒や喫煙をする。"],"a":3,"e":"飲酒・喫煙は、健康への影響などから引き続き20歳にならないと認められない。競馬・競輪などの公営競技の投票券の購入や、養子を迎えること（養親になること）も20歳のままである。クレジットカードの作成や賃貸借契約、10年用のパスポートの取得は、18歳からできるようになった。"},{"t":"tf","s":"成年年齢の引下げ","imp":3,"q":"成年年齢の引下げにともない、女性が結婚できる年齢は16歳から18歳に引き上げられ、結婚できる年齢は男女とも18歳となった。","a":true,"e":"正しい。改正前は男性18歳・女性16歳で、未成年者が結婚するには父母の同意が必要だった。改正により、男女とも18歳以上でなければ結婚できなくなった。"},{"t":"ex","s":"成年年齢の引下げ","imp":2,"q":"成年年齢の引下げによって、18歳・19歳の人が契約の場面で注意すべき点を説明せよ。","a":"18歳で成年になると、親の同意がなくても一人で契約を結べるようになる一方、未成年者取消権を使えなくなる。そのため、悪質商法などで不利な契約を結んでも、未成年であることを理由に取り消すことはできず、原則として自分で責任を負うことになる。契約の内容や支払い条件をよく確認し、困ったときは消費生活センターなどに相談することが大切である。","e":"ポイント：①親の同意なく契約できる ②未成年者取消権がなくなる ③悪質商法の標的になりやすい ④契約内容の確認と消費生活センターなどへの相談"},{"t":"qa","s":"不法行為","imp":3,"q":"民法709条「（　）又は過失によって他人の権利又は法律上保護される利益を侵害した者は、これによって生じた損害を賠償する責任を負う。」の空欄に入る語を答えよ。","a":"故意","e":"不法行為の一般原則を定めた条文で、過失責任の原則の表れである。故意とはわざと行うこと、過失とは注意すれば防げたのに不注意で行うことをいう。"},{"t":"qa","s":"不法行為","imp":2,"q":"交通事故で他人にけがをさせた場合のように、契約関係がなくても、故意や過失によって他人の権利を侵害し損害を与える行為を、民法上何というか。","a":"不法行為","e":"不法行為をした者は損害賠償の責任を負う。損害には治療費などの財産的な損害だけでなく精神的な苦痛も含まれ、その賠償金を慰謝料という（民法710条）。"},{"t":"qa","s":"家族と法","imp":2,"q":"成年に達しない子を監護・教育し、その財産を管理する父母の権利と義務を何というか。","a":"親権","e":"親権は子の利益のために行使しなければならない。2022年の民法改正で親の懲戒権の規定が削除され、体罰など子の心身の健全な発達に有害な影響を及ぼす言動が禁止された。"},{"t":"tf","s":"家族と法","imp":3,"q":"2024年の民法改正により、父母が離婚した後も、父母の双方が親権をもつ共同親権を選ぶことができるようになった。","a":true,"e":"正しい。改正民法は2026年4月に施行された。それまでは、離婚後は父母のどちらか一方だけが親権をもつ単独親権に限られていた。"},{"t":"mc","s":"家族と法","imp":2,"q":"2024年の民法改正による離婚後の親権の制度に関する記述として最も適当なものを一つ選べ。","c":["離婚後は必ず共同親権となり、単独親権を選ぶことはできなくなった。","離婚する父母の協議で共同親権か単独親権かを定め、協議が調わないときは家庭裁判所が定める。","配偶者への暴力や子への虐待のおそれがある場合でも、家庭裁判所は共同親権としなければならない。","共同親権が認められたのは婚姻中の父母だけで、離婚後は従来どおり単独親権に限られる。"],"a":1,"e":"改正後は、協議離婚の場合は父母の協議で共同親権か単独親権かを選び、協議が調わない場合などは家庭裁判所が子の利益を考えて定める。暴力や虐待のおそれがあるなど、共同親権が子の利益を害する場合には、裁判所は単独親権と定めなければならない。"},{"t":"mc","s":"家族と法","imp":1,"q":"父が6000万円の遺産を残して亡くなった。相続人は母（父の配偶者）と子2人で、遺言はない。法定相続分どおりに分ける場合、子1人が相続する額として最も適当なものを一つ選べ。","c":["1000万円","1500万円","2000万円","3000万円"],"a":1,"e":"配偶者と子が相続人の場合、法定相続分は配偶者が2分の1、子が全体で2分の1である。母は3000万円、子2人は残りの3000万円を均等に分けて1人1500万円となる。2000万円は3人で均等に分けた誤り、3000万円は配偶者の取り分である。配偶者は常に相続人となり、子がいなければ父母など、それもいなければ兄弟姉妹が配偶者とともに相続人となる。"}]});</script>
<script>QDATA.push({"unit":"u09","questions":[{"t":"qa","s":"消費者問題と消費者主権","imp":2,"q":"商品やサービスについて、売り手（企業）は詳しい情報をもつが買い手（消費者）は十分な情報をもたないというように、取引の当事者の間で情報量に差があることを何というか。","a":"情報の非対称性","e":"消費者が企業に比べて不利な立場に置かれる原因の一つで、市場の失敗の例でもある。そのため、表示の義務づけや消費者を保護する法律が必要になる。"},{"t":"qa","s":"消費者問題と消費者主権","imp":3,"q":"何をどれだけ生産するかは、最終的には消費者の選択（購買行動）によって決まるべきだという考え方を何というか。","a":"消費者主権","e":"市場経済の理想とされる考え方である。しかし実際には、情報の非対称性や企業の広告・宣伝の影響によって、消費者の主権は損なわれがちである。"},{"t":"qa","s":"消費者の権利と行政","imp":3,"q":"1962年に「安全を求める権利」「知らされる権利」「選ぶ権利」「意見を聞いてもらう権利」という消費者の4つの権利を示したアメリカ大統領は誰か。","a":"ケネディ","alt":["J.F.ケネディ","ジョン・F・ケネディ","ケネディ大統領"],"e":"議会への特別教書で示されたもので、各国の消費者行政に大きな影響を与えた。日本の消費者基本法にも、消費者の権利が取り入れられている。"},{"t":"mc","s":"消費者の権利と行政","imp":1,"q":"1962年にケネディ大統領が示した消費者の4つの権利に含まれないものを一つ選べ。","c":["安全を求める権利","知らされる権利","意見を聞いてもらう権利","消費者教育を受ける権利"],"a":3,"e":"消費者教育を受ける権利は、のちにフォード大統領が付け加えたものである。ケネディの4つの権利は、安全を求める権利・知らされる権利・選ぶ権利・意見を聞いてもらう権利である。"},{"t":"qa","s":"消費者の権利と行政","imp":3,"q":"1968年に制定された消費者保護基本法を2004年に改正し、名称も改めた法律を何というか。","a":"消費者基本法","e":"安全の確保や必要な情報の提供、被害の救済など、消費者の権利を明記した。消費者を、行政に保護される存在から自立した主体へと位置づけなおした。"},{"t":"ex","s":"消費者の権利と行政","imp":2,"q":"消費者保護基本法が消費者基本法に改正されたことで、消費者の位置づけはどのように変わったか説明せよ。","a":"消費者保護基本法では、消費者は行政によって保護される受け身の存在とされていた。2004年の消費者基本法では、消費者の権利の尊重と自立の支援が基本理念とされ、消費者は自ら必要な知識や情報を得て、自主的かつ合理的に行動する自立した主体として位置づけられた。","e":"ポイント：①保護の対象から自立した主体へ ②消費者の権利の尊重を明記 ③消費者の自立の支援 ④消費者にも自ら学び行動する役割が求められる"},{"t":"qa","s":"消費者の権利と行政","imp":2,"q":"各省庁に分かれていた消費者行政をまとめて担うため、2009年に内閣府の外局として設置された行政機関を何というか。","a":"消費者庁","e":"食品表示や悪質商法への対応など、消費者に関わる行政の司令塔の役割を担う。同時に、消費者行政を監視する消費者委員会も設置された。"},{"t":"tf","s":"消費者の権利と行政","imp":2,"q":"消費生活センターは国が設置する機関であり、都道府県や市町村には消費者の相談窓口は置かれていない。","a":false,"e":"誤り。正しくは、消費生活センターは都道府県や市町村などの地方公共団体が設置し、消費者からの苦情や相談に応じている。国レベルでは、独立行政法人の国民生活センター（1970年設立）が、情報の収集・提供や商品テストなどを行っている。"},{"t":"qa","s":"製造物責任法","imp":3,"q":"製品の欠陥によって生命・身体・財産に被害を受けた場合、製造業者などに過失がなくても損害賠償の責任を負わせる法律を何というか。","a":"製造物責任法","alt":["PL法"],"e":"1994年に制定され、1995年に施行された。被害者は製造業者の過失ではなく製品の欠陥を証明すればよい（無過失責任）ので、救済を受けやすくなった。"},{"t":"tf","s":"製造物責任法","imp":3,"q":"製造物責任法のもとでは、被害者は製造業者に過失があったことを証明しなければ損害賠償を受けることができない。","a":false,"e":"誤り。正しくは、被害者は製品に欠陥があったことと、それによって損害が生じたことを証明すればよく、製造業者の過失を証明する必要はない。これが無過失責任であり、過失責任の原則を修正したものである。"},{"t":"mc","s":"製造物責任法","imp":2,"q":"製造物責任法に基づいて損害賠償を請求できる事例として最も適当なものを一つ選べ。","c":["美容院でのカットの仕上がりが、注文したイメージと違っていた。","購入した中古住宅の壁に、入居後にひび割れが見つかった。","購入した電気ストーブの設計上の欠陥が原因で火災が起き、部屋の家具が焼けた。","買ったばかりのテレビが故障して映らなくなったが、ほかに被害は生じなかった。"],"a":2,"e":"製造物責任法の対象は、製造または加工された動産の欠陥によって、生命・身体やその製品以外の財産に被害が生じた場合である。美容院のようなサービスや住宅などの不動産は対象外である。損害が製品そのものの故障だけにとどまる場合も対象外で、売買契約に基づいて修理や交換を求めることになる。"},{"t":"ex","s":"製造物責任法","imp":2,"q":"製造物責任法が、製造業者に無過失責任を負わせている理由を説明せよ。","a":"製品の設計や製造の過程は消費者にはわからないため、過失責任の原則のままでは、被害者が製造業者の過失を証明することは非常に難しく、救済を受けられないことが多かった。そこで、製品の欠陥を証明すれば過失の有無にかかわらず賠償を受けられるようにして、被害者の救済を図っている。","e":"ポイント：①製造過程の情報は製造業者の側にある（情報の非対称性） ②過失の証明は被害者にとって困難 ③欠陥を証明すれば足りる ④被害者の救済"},{"t":"qa","s":"消費者契約法","imp":3,"q":"事業者の不適切な勧誘によって結んだ契約を消費者が取り消すことや、消費者に一方的に不利な契約条項を無効とすることを定め、2001年に施行された法律を何というか。","a":"消費者契約法","e":"事業者と消費者の間の契約すべてに適用される。うそを告げる（不実告知）、確実にもうかると断言する（断定的判断の提供）、帰ってほしいと言っても帰らない（不退去）などの勧誘による契約は、取り消すことができる。"},{"t":"mc","s":"消費者契約法","imp":3,"q":"消費者契約法に基づいて契約を取り消すことができる事例として最も適当なものを一つ選べ。","c":["インターネットで自分で調べて商品を注文したが、届いた後に気が変わった。","「この投資用マンションは将来必ず値上がりします」と断定的に説明され、それを信じて契約した。","店頭で商品を十分に確認して購入したが、友人に似合わないと言われた。","契約書をよく読まずに署名したが、契約の内容は事前の説明どおりだった。"],"a":1,"e":"将来の価格など不確実なことについて確実であるかのように告げる「断定的判断の提供」による契約は、消費者契約法で取り消すことができる。自分の判断で結んだ契約は、気が変わった、人に何か言われたといった理由では取り消せない。"},{"t":"tf","s":"消費者契約法","imp":1,"q":"消費者契約法では、「事業者はいかなる理由があっても損害賠償の責任を一切負わない」といった、事業者の損害賠償責任を全部免除する契約条項は無効とされる。","a":true,"e":"正しい。このほか、契約を解除したときに事業者に生じる平均的な損害額をこえる高額なキャンセル料を定める条項や、消費者の利益を一方的に害する条項も無効とされる。"},{"t":"qa","s":"消費者契約法","imp":1,"q":"内閣総理大臣が認定した消費者団体が、被害を受けた個々の消費者に代わって、事業者の不当な勧誘や契約条項の差止めを求めて訴えることができる制度を何というか。","a":"消費者団体訴訟制度","alt":["消費者団体訴訟","団体訴訟制度"],"e":"2007年に導入され、認定を受けた団体を適格消費者団体という。2016年からは、一定の団体が消費者に代わって被害の回復（返金など）を求める訴訟も起こせるようになった。"},{"t":"qa","s":"クーリング・オフ","imp":3,"q":"訪問販売などで契約した後、一定の期間内であれば、理由を問わず無条件で契約を解除できる制度を何というか。","a":"クーリング・オフ","alt":["クーリングオフ","クーリング・オフ制度"],"e":"特定商取引法などに定められている。「頭を冷やして考え直す」という意味で、不意打ち的な勧誘から消費者を守るための制度である。"},{"t":"qa","s":"クーリング・オフ","imp":3,"q":"訪問販売や電話勧誘販売のクーリング・オフ期間は、法律で定められた書面を受け取った日から何日以内か。","a":"8日","alt":["8日以内","8日間","八日"],"e":"書面を受け取った日を1日目として数える。エステや語学教室などの特定継続的役務提供も8日、マルチ商法（連鎖販売取引）や内職・モニター商法（業務提供誘引販売取引）は20日である。"},{"t":"tf","s":"クーリング・オフ","imp":3,"q":"インターネット通販で購入した商品は、特定商取引法のクーリング・オフ制度により、届いてから8日以内であれば無条件で契約を解除できる。","a":false,"e":"誤り。正しくは、通信販売にはクーリング・オフ制度がない。返品できるかどうかは事業者が定める返品特約により、特約の表示がなければ、商品を受け取ってから8日以内なら送料を自己負担して返品できる。"},{"t":"mc","s":"クーリング・オフ","imp":3,"q":"クーリング・オフによって契約を解除できる事例として最も適当なものを一つ選べ。","c":["自分から店に出向き、店内で洋服を購入した翌日である。","テレビショッピングで健康食品を注文し、商品が届いてから3日目である。","路上で呼び止められて営業所に連れて行かれ、化粧品の契約をして、契約書面を受け取ってから15日目である。","自宅を訪ねてきた販売員に勧められて浄水器を購入し、契約書面を受け取ってから5日目である。"],"a":3,"e":"訪問販売は、契約書面を受け取ってから8日以内ならクーリング・オフできる。店舗での購入や、テレビショッピングなどの通信販売は対象外である。路上で呼び止めて営業所で契約させるキャッチセールスも訪問販売として扱われるが、期間は8日以内なので15日目ではできない。"},{"t":"tf","s":"クーリング・オフ","imp":2,"q":"クーリング・オフの通知は、はがきなどの書面のほか、電子メールなどの電磁的記録で行うこともできる。","a":true,"e":"正しい。2022年6月から、書面に加えて電子メールなどの電磁的記録による通知も認められた。期間内に通知を発信すれば効力が生じるので、はがきのコピーや送信の記録を保存しておくとよい。"},{"t":"ex","s":"クーリング・オフ","imp":3,"q":"クーリング・オフ制度が設けられている理由と、通信販売が対象外とされている理由を説明せよ。","a":"訪問販売や電話勧誘販売などでは、消費者は予期しないときに突然勧誘を受け、十分に考える余裕のないまま契約してしまいやすい。そこで、契約後も一定期間は冷静に考え直し、無条件で解除できるようにしている。通信販売は、消費者が自ら広告を見て申し込むので不意打ちの性格がなく、対象外とされている。","e":"ポイント：①不意打ち的な勧誘 ②冷静に考え直す期間を保障 ③理由を問わず無条件で解除できる ④通信販売は自ら申し込むので対象外"},{"t":"qa","s":"悪質商法","imp":2,"q":"注文していない商品を一方的に送りつけ、受け取った人に代金を請求する悪質商法を何というか。","a":"送り付け商法","alt":["ネガティブ・オプション","送りつけ商法","ネガティブオプション"],"e":"受け取った人に代金を支払う義務はない。2021年の特定商取引法の改正により、送りつけられた商品は直ちに処分できるようになった（以前は一定期間保管する必要があった）。"},{"t":"mc","s":"悪質商法","imp":2,"q":"悪質商法の名称と手口の組合せとして最も適当なものを一つ選べ。","c":["マルチ商法 ― 「無料で点検します」と言って家を訪れ、不安をあおって不要な工事の契約を結ばせる。","デート商法 ― 「抽選に当たった」と電話で呼び出し、高額な商品を売りつける。","キャッチセールス ― 路上で「アンケートに答えて」などと呼び止め、営業所などに連れて行って高額な契約を結ばせる。","アポイントメントセールス ― 商品を買って会員になり、新しい会員を勧誘すれば利益が得られると誘って契約させる。"],"a":2,"e":"キャッチセールスの説明が正しい。「無料で点検」と訪問するのは点検商法、「当選した」などと電話で呼び出すのはアポイントメントセールス、会員を勧誘すれば利益が得られると誘うのはマルチ商法（連鎖販売取引）である。デート商法は、恋愛感情を利用して高額な商品を契約させる手口である。"},{"t":"qa","s":"多重債務とクレジット","imp":2,"q":"複数の貸金業者などから借金を重ね、返済が困難になった状態を何というか。","a":"多重債務","alt":["多重債務問題"],"e":"借金の返済のために別の業者から新たに借りることを繰り返すと、利息がふくらんで返済できなくなりやすい。返済できなくなった場合の解決手段として、任意整理や自己破産などの債務整理がある。"},{"t":"tf","s":"多重債務とクレジット","imp":2,"q":"借金を返済できなくなった人が裁判所に申し立てて自己破産をすると、選挙権を失い、戸籍や住民票にも破産したことが記載される。","a":false,"e":"誤り。正しくは、自己破産をしても選挙権は失われず、戸籍や住民票にも記載されない。自己破産は、裁判所から免責の許可を受けて借金の返済義務を免れる手続で、一定期間ローンやクレジットカードが利用しにくくなるなどの不利益はある。"},{"t":"qa","s":"多重債務とクレジット","imp":2,"q":"多重債務問題に対応した2006年の貸金業法改正で導入された、借り手の年収の3分の1をこえる貸付けを原則として禁止する規制を何というか。","a":"総量規制","e":"2010年に完全施行された。たとえば年収300万円の人は、貸金業者から合計100万円をこえて借りることが原則としてできない。"},{"t":"tf","s":"多重債務とクレジット","imp":1,"q":"2006年の貸金業法改正などにより、出資法の上限金利が年20％に引き下げられ、利息制限法の上限金利との間のいわゆるグレーゾーン金利が撤廃された。","a":true,"e":"正しい。それまでは、利息制限法の上限（年15〜20％）をこえても出資法の上限（年29.2％）以下なら刑罰の対象とならず、高い金利が多重債務の原因となっていた。改正後は、利息制限法の上限をこえる貸付けは行政処分の対象となり、年20％をこえると刑罰の対象となる。"},{"t":"ex","s":"多重債務とクレジット","imp":2,"q":"クレジットカードで買い物をするときの三者間契約の仕組みと、利用上の注意点を説明せよ。","a":"クレジットカードで買い物をすると、消費者は販売店と売買契約を結び、カード会社が代金を販売店に立て替えて支払い、消費者は後日カード会社に代金を支払う。手元に現金がなくても買い物ができるが、実質的には借金と同じなので、支払い能力をこえて使いすぎないよう注意が必要である。","e":"ポイント：①消費者・販売店・カード会社の三者の契約 ②カード会社による立替払い ③後払い＝借金と同じ ④使いすぎによる多重債務の危険"},{"t":"mc","s":"多重債務とクレジット","imp":2,"q":"クレジットカードのリボルビング払い（リボ払い）の説明として最も適当なものを一つ選べ。","c":["利用した代金を翌月に一括して支払う方式で、通常は手数料がかからない。","利用金額や件数にかかわらず毎月ほぼ一定の額を支払う方式で、支払いが長期化して手数料（利息）がかさみやすい。","買い物の代金が、支払いの時点で銀行口座から即時に引き落とされる方式である。","あらかじめ入金（チャージ）した金額の範囲内でのみ利用できる方式である。"],"a":1,"e":"リボ払いは毎月の支払額が一定で負担が軽く見えるが、残高が減りにくく、手数料の負担が大きくなりやすい。翌月一括払いはクレジットカードの一括払い、即時の引き落としはデビットカード、事前の入金はプリペイド式の電子マネーなどの仕組みである。"}]});</script>
<script>QDATA.push({"unit":"u09","questions":[{"t":"qa","s":"罪刑法定主義","imp":3,"q":"どのような行為が犯罪となり、どのような刑罰が科されるかを、あらかじめ法律で定めておかなければならないとする原則を何というか。","a":"罪刑法定主義","e":"「法律なければ犯罪なく、法律なければ刑罰なし」と表現される。日本国憲法31条（法定手続の保障）や39条（遡及処罰の禁止）にも、この考え方が表れている。"},{"t":"tf","s":"罪刑法定主義","imp":2,"q":"行為をした時点では犯罪とされていなかった行為を、後からつくった法律によってさかのぼって処罰することはできない。","a":true,"e":"正しい。遡及処罰の禁止（事後法の禁止）といい、罪刑法定主義から導かれる原則で、憲法39条にも定められている。法律の規定を似た行為に広げて当てはめる類推解釈も禁止される。"},{"t":"qa","s":"刑事手続","imp":3,"q":"犯罪の疑いをかけられて捜査の対象となっているが、まだ起訴されていない人を何というか。","a":"被疑者","e":"報道では「容疑者」とよばれることが多い。検察官に起訴されると「被告人」とよばれるようになる。"},{"t":"qa","s":"刑事手続","imp":2,"q":"刑事事件で、検察官によって起訴された人を何というか。","a":"被告人","e":"刑事裁判では、検察官と被告人・弁護人が向き合って主張や立証を行う。民事裁判で訴えられた側を指す「被告」とは異なる用語である。"},{"t":"mc","s":"刑事手続","imp":3,"q":"日本の刑事手続に関する記述として最も適当なものを一つ選べ。","c":["警察官は、現行犯の場合でも、裁判官の令状がなければ逮捕できない。","被疑者は、起訴される前に、裁判所で有罪か無罪かの審理を受ける。","事件を起訴するかどうかを決めるのは、原則として検察官である。","被告人は、有罪判決が確定する前から、犯罪者として扱われる。"],"a":2,"e":"起訴の権限は原則として検察官がもつ（起訴独占主義）。逮捕には原則として裁判官の令状が必要だが、現行犯は例外である（憲法33条）。有罪か無罪かの審理は起訴された後の公判で行われ、被告人は有罪判決が確定するまで無罪と推定される。"},{"t":"qa","s":"刑事手続","imp":2,"q":"犯罪の疑いが十分にあっても、犯人の性格・年齢・境遇や犯罪の軽重・情状などを考慮して、検察官が起訴しないことができるとする原則を何というか。","a":"起訴便宜主義","e":"刑事訴訟法248条の規定で、このような不起訴を起訴猶予という。証拠がそろえば必ず起訴しなければならないとする考え方は、起訴法定主義という。"},{"t":"tf","s":"刑事手続","imp":2,"q":"日本では、犯罪の証拠が十分にそろった場合、検察官は必ず被疑者を起訴しなければならない。","a":false,"e":"誤り。正しくは、日本は起訴便宜主義をとっており、証拠がそろっていても、情状などを考慮して起訴しないこと（起訴猶予）ができる。検察官の不起訴処分が適切かどうかは、国民から選ばれた検察審査会が審査する。"},{"t":"ex","s":"刑事手続","imp":2,"q":"犯罪の発生から判決までの刑事手続の流れを説明せよ。","a":"犯罪が発生すると警察などが捜査を行い、必要があれば裁判官の発する令状に基づいて被疑者を逮捕する。事件は検察官に送られ、検察官は証拠や情状を考えて起訴するかどうかを決める。起訴されると被疑者は被告人となり、公開の法廷で検察官と被告人・弁護人が主張と立証を行い、裁判所が判決で有罪か無罪か、有罪の場合は刑の重さを言い渡す。","e":"ポイント：①警察などによる捜査と逮捕（現行犯を除き裁判官の令状が必要） ②検察官への送致と、起訴・不起訴の判断（起訴便宜主義） ③起訴後は被告人として公開の法廷で審理 ④判決で有罪・無罪と量刑を決める"},{"t":"qa","s":"推定無罪","imp":3,"q":"被疑者や被告人は、有罪の判決が確定するまでは無罪と推定されるという原則を何というか。","a":"推定無罪の原則","alt":["推定無罪","無罪の推定","無罪推定の原則"],"e":"この原則から、有罪であることを証明する責任は検察官にあるとされる。逮捕されたというだけで犯人と決めつけるような報道や扱いは、この原則に反する。"},{"t":"tf","s":"推定無罪","imp":3,"q":"刑事裁判では、被告人が自分の無実を証明できなければ有罪とされる。","a":false,"e":"誤り。正しくは、犯罪を証明する責任は検察官にあり、検察官が合理的な疑いを差しはさむ余地のない程度に証明できなければ、被告人は無罪となる。被告人には黙秘権もあり、自分に不利益な供述を強要されない（憲法38条）。"},{"t":"ex","s":"推定無罪","imp":3,"q":"推定無罪の原則と「疑わしきは被告人の利益に」の原則が、刑事裁判でどのような意味をもつか説明せよ。","a":"被疑者・被告人は、有罪判決が確定するまで無罪と推定される。そのため、犯罪を証明する責任は国家の側の検察官にあり、検察官が合理的な疑いを残さない程度に証明できなければ、裁判所は「疑わしきは被告人の利益に」の原則に従って無罪を言い渡さなければならない。無実の人が処罰される冤罪を防ぐための原則である。","e":"ポイント：①有罪が確定するまでは無罪と推定 ②立証責任は検察官にある ③合理的な疑いが残れば無罪 ④冤罪の防止"},{"t":"qa","s":"刑罰と拘禁刑","imp":3,"q":"2022年の刑法改正により、懲役と禁錮を一本化して2025年6月から導入された刑罰を何というか。","a":"拘禁刑","e":"それまでの懲役は刑務作業が義務で、禁錮は義務ではなかった。拘禁刑では、受刑者の特性に応じて作業と指導を柔軟に組み合わせ、改善更生と再犯防止を図ることがめざされている。"},{"t":"mc","s":"刑罰と拘禁刑","imp":2,"q":"2026年時点の日本の刑罰に関する記述として最も適当なものを一つ選べ。","c":["懲役と禁錮は、現在も別々の刑罰として定められている。","罰金は、警察が独自の判断で科すことのできる行政上の処分である。","刑法には、仮釈放が一切認められない終身刑が定められている。","主刑として、死刑・拘禁刑・罰金・拘留・科料が定められている。"],"a":3,"e":"現在の主刑は死刑・拘禁刑・罰金・拘留・科料で、付加刑として没収がある。懲役と禁錮は2025年6月に拘禁刑に一本化された。罰金は裁判で科される刑罰であり、交通違反の反則金のような行政上の制裁とは異なる。日本には仮釈放のない終身刑はなく、無期拘禁刑でも仮釈放の可能性がある。"},{"t":"tf","s":"死刑制度","imp":1,"q":"日本は、国連で採択された死刑廃止条約（市民的及び政治的権利に関する国際規約の第2選択議定書）を批准していない。","a":true,"e":"正しい。死刑廃止条約は1989年に国連総会で採択されたが、死刑制度を存置している日本は批准していない。世界では、法律上または事実上死刑を廃止している国が多数派である。"},{"t":"ex","s":"死刑制度","imp":2,"q":"死刑制度の存廃をめぐる主な議論を、存置論と廃止論に分けて説明せよ。","a":"存置論は、凶悪な犯罪には死刑で応じるべきだという応報の考え方や、死刑には犯罪を抑止する効果があること、被害者や遺族の感情などを根拠とする。廃止論は、誤判（冤罪）で執行されれば取り返しがつかないこと、生命は最も尊重されるべきこと、犯罪を抑止する効果がはっきりしないこと、国際的に廃止の流れがあることなどを根拠とする。","e":"ポイント：①存置論＝応報・犯罪の抑止・被害者や遺族の感情 ②廃止論＝誤判の回復が不可能・生命の尊重 ③抑止効果への疑問 ④国際的な廃止の流れ（日本は死刑存置国）"},{"t":"qa","s":"少年法","imp":3,"q":"少年法で「少年」とされるのは何歳未満の者か。","a":"20歳未満","alt":["20歳","満20歳未満"],"e":"成年年齢は18歳に引き下げられたが、少年法の適用年齢は20歳未満のまま維持された。少年の事件はすべて家庭裁判所に送られ、立ち直りを重視した保護処分（保護観察や少年院送致など）が中心となる。"},{"t":"qa","s":"少年法","imp":3,"q":"2022年4月に施行された改正少年法で、18歳・19歳の少年は何と位置づけられたか。","a":"特定少年","e":"特定少年も引き続き少年法の対象だが、家庭裁判所から検察官に送られて（逆送）成人と同じ刑事裁判を受ける事件の範囲が広げられた。また、起訴された場合には実名などの報道が禁止されなくなった。"},{"t":"tf","s":"少年法","imp":3,"q":"成年年齢の引下げにともない、2022年4月から18歳・19歳は少年法の適用対象から外れ、成人と同じ扱いとなった。","a":false,"e":"誤り。正しくは、18歳・19歳は「特定少年」として引き続き少年法の適用対象となっている。ただし、原則として逆送される事件の範囲が広がるなど、17歳以下の少年とは異なる扱いを受ける。"},{"t":"mc","s":"少年法","imp":2,"q":"改正少年法における特定少年に関する記述として最も適当なものを一つ選べ。","c":["特定少年の事件は、家庭裁判所を経ずに、すべて最初から刑事裁判で裁かれる。","特定少年が起訴された場合、氏名や顔写真など本人と推知できる報道が禁止されなくなる。","特定少年には、少年院送致などの保護処分は一切行われない。","特定少年とは、14歳以上18歳未満の少年をいう。"],"a":1,"e":"特定少年（18・19歳）が起訴された場合は、本人と推知できる報道（実名報道など）の禁止が解除される。特定少年の事件も全件が家庭裁判所に送られ、保護処分が行われることもある。なお刑法は14歳未満の者の行為を罰しないとしており、14歳は刑事責任を問われる年齢の下限である。"},{"t":"ex","s":"少年法","imp":2,"q":"少年の事件が、成人の事件と異なる手続で扱われる理由を説明せよ。","a":"少年は心身ともに発達の途中にあり、環境の影響を受けやすい一方で、教育や支援によって立ち直る可能性（可塑性）が大きいと考えられる。そこで少年法は少年の健全な育成を目的とし、刑罰を科すことよりも、家庭裁判所の審判を通じて保護処分などにより立ち直りを図ることを重視している。","e":"ポイント：①少年は発達の途中で可塑性が大きい ②少年法の目的は少年の健全な育成 ③刑罰より保護・教育を重視（保護処分） ④すべての事件を家庭裁判所に送る"},{"t":"qa","s":"犯罪被害者","imp":1,"q":"犯罪の被害者やその家族の権利と利益の保護を図るため、2004年に制定された法律を何というか。","a":"犯罪被害者等基本法","e":"被害者が刑事手続の中で十分に配慮されてこなかったという反省から制定された。この法律に基づき、被害者や遺族が刑事裁判に参加できる被害者参加制度（2008年）などが整えられた。"},{"t":"tf","s":"民事裁判と刑事裁判","imp":3,"q":"民事裁判で訴えられた「被告」は、刑事裁判の「被告人」と同じく、犯罪を犯した疑いをかけられている人である。","a":false,"e":"誤り。正しくは、民事裁判の被告は、お金の支払いなどを求めて訴えられた当事者にすぎず、犯罪とは関係がない。民事裁判で訴えを起こした側は原告といい、刑事裁判で検察官に起訴された人が被告人である。"},{"t":"mc","s":"民事裁判と刑事裁判","imp":3,"q":"自動車を運転中に不注意で歩行者にけがをさせた運転者が負う責任のうち、民事上の責任にあたるものとして最も適当なものを一つ選べ。","c":["裁判で拘禁刑や罰金を科される。","運転免許の停止や取消しの処分を受ける。","被害者に治療費や慰謝料などの損害賠償を支払う。","検察官によって起訴される。"],"a":2,"e":"損害賠償は、被害者と加害者という私人の間の責任で、民事裁判や示談で解決される。拘禁刑や罰金は刑事上の責任で、検察官の起訴により刑事裁判で決まる。免許の停止・取消しは公安委員会による行政上の処分である。一つの事故で、三つの責任が別々に問われることがある。"},{"t":"tf","s":"民事裁判と刑事裁判","imp":1,"q":"民事裁判は、判決によらず、当事者どうしが互いに譲り合う和解によって終わることも多い。","a":true,"e":"正しい。民事裁判は私人間の争いなので、当事者の合意によって解決することができる。一方、刑事裁判は国家が刑罰を科すかどうかを決めるものなので、当事者の和解で裁判を終わらせることはできない。"},{"t":"qa","s":"ADRと少額訴訟","imp":3,"q":"裁判によらずに、調停・仲裁・あっせんなど中立的な第三者の関与によって紛争を解決する手続を何というか。","a":"裁判外紛争解決手続","alt":["ADR","裁判外紛争解決"],"e":"裁判所で行われる民事調停や家事調停のほか、国民生活センターや弁護士会、業界団体などの民間機関も行っている。2004年には、民間のADRの利用を促進するADR法が制定された。"},{"t":"mc","s":"ADRと少額訴訟","imp":1,"q":"ADR（裁判外紛争解決手続）のうち、仲裁の説明として最も適当なものを一つ選べ。","c":["当事者が第三者（仲裁人）の判断に従うことにあらかじめ合意し、示された判断に拘束される。","第三者が当事者の話し合いを仲介するが、当事者が合意しなければ解決しない。","裁判官が公開の法廷で審理し、判決によって解決する。","当事者どうしが第三者を交えずに直接話し合って解決する。"],"a":0,"e":"仲裁では、仲裁人の判断（仲裁判断）が確定判決と同じ効力をもち、当事者はそれに従わなければならない。第三者が仲介しても当事者の合意がなければ成立しないのは調停やあっせんである。公開の法廷での判決は訴訟、当事者だけでの話し合いは交渉（示談）である。"},{"t":"ex","s":"ADRと少額訴訟","imp":2,"q":"ADR（裁判外紛争解決手続）を利用する利点を、裁判と比較して説明せよ。","a":"ADRは裁判に比べて手続が簡単で、費用や時間を抑えることができる。また非公開で行われるためプライバシーや企業の秘密が守られやすく、専門的な知識をもつ第三者が関わって、当事者の事情に応じた柔軟な解決を図ることができる。","e":"ポイント：①手続が簡単 ②費用と時間を抑えられる ③非公開でプライバシーを保護できる ④専門家の関与と柔軟な解決"},{"t":"qa","s":"ADRと少額訴訟","imp":2,"q":"60万円以下の金銭の支払いを求める場合に、簡易裁判所で原則として1回の審理で判決を言い渡す訴訟手続を何というか。","a":"少額訴訟","alt":["少額訴訟制度"],"e":"手続が簡単で、弁護士に頼まずに本人が行うことも多い。同じ簡易裁判所で利用できるのは、1年に10回までである。"},{"t":"tf","s":"ADRと少額訴訟","imp":1,"q":"少額訴訟の判決に不服がある場合は、地方裁判所に控訴することができる。","a":false,"e":"誤り。正しくは、少額訴訟の判決に対して控訴することはできず、判決をした簡易裁判所に異議を申し立てることができるだけである。異議が出されると、同じ簡易裁判所で通常の手続により審理される。"}]});</script>
<script>QDATA.push({"unit":"u10","questions":[{"t":"qa","s":"地方自治の本旨","imp":3,"q":"「地方自治は民主主義の学校である」と述べたイギリスの政治学者は誰か。","a":"ブライス","alt":["ジェームズ・ブライス","J.ブライス"],"e":"著書『近代民主政治』で述べた。住民が身近な地域の政治に参加することで、民主政治に必要な能力や態度が養われるという意味である。フランスのトクヴィルも同じ趣旨を述べた。"},{"t":"qa","s":"地方自治の本旨","imp":2,"q":"『アメリカのデモクラシー』で、地方自治の制度と自由との関係を小学校と学問との関係にたとえて、地方自治の重要性を説いたフランスの思想家は誰か。","a":"トクヴィル","e":"アメリカの町（タウン）の住民自治を観察し、住民が自ら地域を治める経験が自由を支えると論じた。ブライスの「地方自治は民主主義の学校」とセットで覚える。"},{"t":"qa","s":"地方自治の本旨","imp":3,"q":"「地方自治の本旨」のうち、地域の政治をその地域の住民の意思に基づいて行うという民主主義的な要素を何というか。","a":"住民自治","e":"首長・議員の直接選挙（憲法93条）、直接請求権、住民投票などが住民自治を具体化した制度である。もう一つの要素は団体自治。"},{"t":"qa","s":"地方自治の本旨","imp":3,"q":"「地方自治の本旨」のうち、地方公共団体が国から独立した団体として、自らの意思と責任で地域の政治を行うという自由主義的な要素を何というか。","a":"団体自治","e":"条例制定権や、財産を管理し行政を執行する権能（憲法94条）が団体自治を具体化したものである。国の関与を減らす地方分権は団体自治の強化にあたる。"},{"t":"ex","s":"地方自治の本旨","imp":3,"q":"団体自治と住民自治の違いを、それぞれを具体化した制度の例を挙げて説明せよ。","a":"団体自治とは、地方公共団体が国から独立して、自らの権限と責任で地域の政治を行うことであり、条例制定権がその例である。住民自治とは、地域の政治がその地域の住民の意思に基づいて行われることであり、首長・議員の直接選挙や直接請求権、住民投票がその例である。","e":"ポイント：①団体自治＝国からの独立（自由主義的要素） ②住民自治＝住民の参加（民主主義的要素） ③例は条例制定権／直接選挙・直接請求・住民投票"},{"t":"tf","s":"地方自治の本旨","imp":2,"q":"大日本帝国憲法にも地方自治に関する規定があり、府県知事は住民の直接選挙で選ばれていた。","a":false,"e":"誤り。正しくは、大日本帝国憲法には地方自治の規定がなく、府県知事は国が任命する官選知事だった。日本国憲法で第8章「地方自治」が設けられ、知事も住民の直接選挙で選ばれるようになった。"},{"t":"qa","s":"憲法と地方自治","imp":3,"q":"憲法92条「地方公共団体の組織及び運営に関する事項は、（　）に基いて、法律でこれを定める。」の空欄に入る語句は何か。","a":"地方自治の本旨","e":"地方自治の本旨は団体自治と住民自治の2つからなると解されている。この条文を受けて地方自治法が制定され、日本国憲法と同じ1947年5月3日に施行された。"},{"t":"qa","s":"憲法と地方自治","imp":2,"q":"地方公共団体の長や議会の議員を住民が直接選挙することを定めた日本国憲法の条文は第何条か。","a":"第93条","alt":["93条","第九十三条"],"e":"93条1項は議事機関として議会を置くこと、2項は長・議員などを住民が直接選挙することを定める。国会が首相を指名する国の議院内閣制とは異なる。"},{"t":"mc","s":"憲法と地方自治","imp":2,"q":"日本国憲法の地方自治に関する規定の内容として適当でないものを一つ選べ。","c":["地方公共団体は、法律の範囲内で条例を制定することができる。","地方公共団体の長は、その地方公共団体の議会が議員の中から指名する。","一の地方公共団体のみに適用される特別法は、その住民の投票で過半数の同意を得なければ、国会は制定できない。","地方公共団体には、法律の定めるところにより、議事機関として議会を設置する。"],"a":1,"e":"首長は議会の指名ではなく、住民が直接選挙する（93条2項）ので「議会が議員の中から指名する」は誤り。国会が首相を指名する議院内閣制と混同させるひっかけである。条例制定（94条）、地方特別法の住民投票（95条）、議会の設置（93条1項）はいずれも憲法の規定どおりである。"},{"t":"qa","s":"地方公共団体の種類","imp":2,"q":"東京都の23区のように、市に準じる扱いを受け、区長と区議会議員が住民の直接選挙で選ばれる特別地方公共団体を何というか。","a":"特別区","e":"都道府県と市町村は普通地方公共団体、特別区や一部事務組合・広域連合などは特別地方公共団体に分類される。区長の公選制はいったん廃止されたが、1974年の地方自治法改正で復活した。"},{"t":"qa","s":"地方公共団体の種類","imp":2,"q":"人口50万人以上の市のうち政令で指定され、都道府県の事務の一部を担い、市の内部に行政区を設けることができる市を何というか。","a":"政令指定都市","alt":["指定都市"],"e":"横浜市・大阪市・名古屋市などが該当する。人口20万人以上の市が指定を受け、一定の事務を都道府県から移される中核市と区別する。"},{"t":"tf","s":"地方公共団体の種類","imp":1,"q":"政令指定都市の区の区長は市長が任命する市の職員であり、東京23区の区長のように住民の直接選挙で選ばれるわけではない。","a":true,"e":"正しい。政令指定都市の区（行政区）は市の内部組織にすぎず、法人格をもたない。これに対し東京23区などの特別区は独立した地方公共団体であり、区長も区議会議員も公選される。"},{"t":"qa","s":"首長と議会","imp":3,"q":"地方公共団体で、首長と議会の議員をそれぞれ住民が直接選挙するしくみを何というか。","a":"二元代表制","e":"首長が議会から独立している点は大統領制に近いが、議会の不信任決議と首長の解散権のように議院内閣制的なしくみも取り入れている。首長・議員の任期はいずれも4年。"},{"t":"mc","s":"首長と議会","imp":3,"q":"地方公共団体の首長と議員の被選挙権の年齢を述べた文として最も適当なものを一つ選べ。","c":["都道府県知事は満30歳以上、市町村長と地方議会議員は満25歳以上である。","都道府県知事・市町村長・地方議会議員はいずれも満25歳以上である。","都道府県知事は満35歳以上、市町村長は満30歳以上、地方議会議員は満25歳以上である。","都道府県知事は満30歳以上、市町村長と地方議会議員は満18歳以上である。"],"a":0,"e":"知事だけが満30歳以上（参議院議員と同じ）で、市町村長と地方議会議員は満25歳以上（衆議院議員と同じ）である。「いずれも25歳以上」は知事を見落とした誤り、「35歳・30歳」は年齢を引き上げた誤り、「18歳以上」は選挙権の年齢と取り違えた誤りである。"},{"t":"tf","s":"首長と議会","imp":2,"q":"都道府県知事に立候補するには、その都道府県に引き続き3か月以上住所を有していなければならない。","a":false,"e":"誤り。正しくは、知事や市町村長の被選挙権には住所の要件がなく、他の地域に住む人も立候補できる。住所の要件があるのは地方議会議員で、その地方公共団体の選挙権（引き続き3か月以上の住所が必要）をもつことが条件となる。"},{"t":"qa","s":"首長と議会","imp":3,"q":"地方議会が首長の不信任を議決するには、議員数の3分の2以上が出席し、その何分の何以上の同意が必要か。","a":"4分の3","alt":["4分の3以上","3/4"],"e":"可決されると、首長は通知を受けた日から10日以内に議会を解散しなければ失職する。解散後に初めて招集された議会で再び不信任が議決されると（3分の2以上出席・過半数の同意）、首長は失職する。"},{"t":"ex","s":"首長と議会","imp":3,"q":"二元代表制のもとで、首長と議会が互いに抑制し合うしくみを具体的な制度を挙げて説明せよ。","a":"議会は首長の不信任を議決でき、首長はこれに対抗して議会を解散できる。また、首長は議会の議決に異議があるとき再議に付すことができ、条例や予算の再議では出席議員の3分の2以上の同意がなければ同じ議決は確定しない。どちらも住民に直接選ばれた代表として互いを抑制する。","e":"ポイント：①議会の不信任決議と首長の解散 ②首長の再議（拒否権）と3分の2以上の再可決 ③首長・議員とも住民の直接選挙で選ばれる"},{"t":"qa","s":"首長と議会","imp":2,"q":"首長が議会の議決に異議があるとき、理由を示して議会にもう一度審議・議決させることを何というか。","a":"再議","alt":["拒否権","再議権"],"e":"首長の拒否権ともいう。条例の制定・改廃や予算に関する議決を再議に付した場合、出席議員の3分の2以上が同じ議決をすればその議決は確定する。"},{"t":"tf","s":"首長と議会","imp":2,"q":"首長が条例の議決を再議に付した場合、議会が出席議員の過半数で再び同じ議決をすれば、その議決は確定する。","a":false,"e":"誤り。正しくは、条例の制定・改廃や予算に関する再議では、出席議員の3分の2以上の同意が必要である。首長の拒否権に重みをもたせるため、通常の議決（過半数）より厳しい条件になっている。"},{"t":"qa","s":"首長と議会","imp":2,"q":"議会が成立しないときや、議会を招集する時間的余裕がないときなどに、議会が議決すべき事項を首長が代わりに処理することを何というか。","a":"専決処分","e":"首長は次の議会に報告して承認を求めなければならない。乱用は議会の権限を奪うため、2012年の地方自治法改正で副知事・副市町村長の選任を対象外とするなどの見直しが行われた。"},{"t":"mc","s":"首長と議会","imp":2,"q":"ある市の議会が市長の不信任を議決した。その後の手続についての記述として最も適当なものを一つ選べ。","c":["市長は、不信任の通知を受けた日から10日以内に議会を解散しなければ、その職を失う。","市長は、不信任の当否を住民投票にかけ、過半数の支持を得れば職にとどまることができる。","市長が議会を解散した場合、解散後の議会で再び不信任が議決されても市長は失職しない。","この不信任の議決は、出席議員の過半数の同意があれば成立する。"],"a":0,"e":"10日以内に解散しなければ失職するという記述が正しい。不信任の当否を住民投票にかける制度はない（住民投票が行われるのは、住民の直接請求による議会の解散や首長の解職の場合）。解散後に初めて招集された議会で再び不信任が議決されると市長は失職する。最初の不信任議決には議員数の3分の2以上の出席とその4分の3以上の同意が必要である。"},{"t":"qa","s":"首長と議会","imp":1,"q":"地方議会が、地方公共団体の事務に関する調査のために関係者の出頭・証言や記録の提出を求めることができる権限は、地方自治法の条文番号から一般に何と呼ばれるか。","a":"百条調査権","alt":["100条調査権","百条委員会"],"e":"正当な理由なく出頭や証言を拒んだり、うその証言をした者には罰則がある。国会の国政調査権（憲法62条）の地方版といえる。"}]});</script>
<script>QDATA.push({"unit":"u10","questions":[{"t":"qa","s":"条例","imp":3,"q":"地方公共団体が、法律の範囲内で、議会の議決によって制定する法を何というか。","a":"条例","e":"憲法94条が根拠である。首長が定める「規則」と区別する。条例には罰則を設けることもできる。"},{"t":"qa","s":"条例","imp":1,"q":"地方自治法は、条例に違反した者に科すことのできる拘禁刑の上限を何年以下と定めているか。","a":"2年","alt":["2年以下"],"e":"地方自治法14条により、条例には2年以下の拘禁刑、100万円以下の罰金などの刑罰や、5万円以下の過料を定めることができる。拘禁刑は2025年6月から懲役・禁錮に代わった刑罰である。"},{"t":"tf","s":"条例","imp":2,"q":"条例は国会が制定する法律ではないので、条例に違反した者に刑罰を科す規定を設けることはできない。","a":false,"e":"誤り。正しくは、地方自治法に基づき、条例には拘禁刑や罰金などの罰則を設けることができる。条例は住民の代表である議会が制定するので、法律で罪と刑を定めるという罪刑法定主義（憲法31条）にも反しないと考えられている。"},{"t":"qa","s":"条例","imp":1,"q":"公害規制などで、国の法律が定める基準よりも厳しい基準を定める条例を何というか。","a":"上乗せ条例","e":"国の法律が規制していない項目や対象まで規制を広げる条例は「横出し条例」という。地域の実情に合わせた独自の規制の例である。"},{"t":"mc","s":"条例","imp":2,"q":"条例についての記述として最も適当なものを一つ選べ。","c":["条例は法律の範囲内で制定でき、法律に違反する条例は効力をもたない。","条例は、首長が議会の議決を経ずに制定する。","条例を制定するには、事前に所管の大臣の許可を得なければならない。","条例の効力は、その地方公共団体の区域を越えて全国に及ぶ。"],"a":0,"e":"憲法94条は「法律の範囲内で」条例を制定できると定めている。条例は議会の議決で制定し、首長が単独で定めるのは規則なので「首長が議会の議決を経ずに」は誤り。条例の制定に大臣の許可は不要なので「大臣の許可」も誤り（団体自治）。条例の効力は原則としてその地方公共団体の区域内に限られるので「全国に及ぶ」も誤りである。"},{"t":"qa","s":"直接請求権","imp":3,"q":"地方自治法が住民に認めている、一定数の署名を集めて条例の制定や首長の解職などを求める権利を何というか。","a":"直接請求権","alt":["直接請求"],"e":"住民自治を具体化した制度である。条例の制定・改廃、事務の監査、議会の解散、首長・議員の解職、副知事などの主要公務員の解職の請求がある。"},{"t":"qa","s":"直接請求権","imp":3,"q":"条例の制定・改廃を直接請求するのに必要な署名数は、有権者の何分の1以上か。","a":"50分の1","alt":["50分の1以上","1/50"],"e":"請求先は首長で、首長は20日以内に議会にかけ、結果を公表する。署名が集まっても条例が必ず成立するわけではなく、最終的には議会が議決する。この請求はイニシアティブ（住民発案）ともいう。"},{"t":"qa","s":"直接請求権","imp":3,"q":"議会の解散や首長・議員の解職を直接請求するのに、原則として必要な署名数は有権者の何分の1以上か。","a":"3分の1","alt":["3分の1以上","1/3"],"e":"地位を奪う重大な請求なので、条例の制定・改廃や事務の監査（50分の1以上）より要件が厳しい。有権者が40万人を超える部分については必要数が緩和されている。"},{"t":"qa","s":"直接請求権","imp":2,"q":"首長や議員の解職を住民が請求することを、カタカナで何というか。","a":"リコール","e":"請求先は選挙管理委員会で、住民投票で過半数の同意があれば失職する。議会の解散請求も同じ流れである。条例の制定・改廃の請求はイニシアティブ、住民投票はレファレンダムという。"},{"t":"qa","s":"直接請求権","imp":2,"q":"直接請求のうち、事務の監査請求はどの機関に対して行うか。","a":"監査委員","e":"有権者の50分の1以上の署名で請求でき、監査委員は監査の結果を公表し、議会や首長などに報告する。1人でもできる住民監査請求（財務会計上の行為が対象）と区別する。"},{"t":"qa","s":"直接請求権","imp":2,"q":"副知事や副市町村長などの主要公務員の解職の直接請求は、誰に対して行うか。","a":"首長","alt":["長","地方公共団体の長","知事・市町村長"],"e":"原則として有権者の3分の1以上の署名が必要で、首長はこれを議会にかける。議員の3分の2以上が出席し、その4分の3以上が同意すれば失職する。住民投票で決めるリコールとの違いに注意。"},{"t":"ex","s":"直接請求権","imp":3,"q":"直接請求のうち、議会の解散請求と主要公務員の解職請求について、必要署名数・請求先・その後の手続を比べて説明せよ。","a":"どちらも原則として有権者の3分の1以上の署名が必要である。議会の解散請求は選挙管理委員会に行い、住民投票で過半数の同意があれば議会は解散する。主要公務員の解職請求は首長に行い、議会で議員の3分の2以上が出席し、その4分の3以上が同意すれば失職する。","e":"ポイント：①署名数はともに原則3分の1以上 ②解散請求は選挙管理委員会へ→住民投票で過半数の同意 ③主要公務員の解職は首長へ→議会で3分の2以上出席・4分の3以上の同意"},{"t":"mc","s":"直接請求権","imp":3,"q":"直接請求の種類と請求先の組合せとして正しいものを一つ選べ。","c":["条例の制定・改廃の請求 ― 首長","事務の監査請求 ― 選挙管理委員会","議会の解散請求 ― 議会の議長","首長の解職請求 ― 監査委員"],"a":0,"e":"条例の制定・改廃は首長に請求するので正しい。事務の監査は監査委員に請求するので「選挙管理委員会」は誤り。議会の解散と首長の解職は、住民投票を行う選挙管理委員会に請求するので「議会の議長」「監査委員」は誤りである。"},{"t":"mc","s":"直接請求権","imp":3,"q":"有権者数が12万人の市で、住民が直接請求のための署名を集めた。次のうち、必要な署名数に達していないものを一つ選べ（有権者数による必要数の緩和は考えない）。","c":["条例の制定を求めて、2500人の署名を集めた。","事務の監査を求めて、3000人の署名を集めた。","市長の解職を求めて、3万5000人の署名を集めた。","議会の解散を求めて、4万1000人の署名を集めた。"],"a":2,"e":"有権者12万人の50分の1は2400人、3分の1は4万人である。条例の制定（2500人）と事務の監査（3000人）は50分の1以上、議会の解散（4万1000人）は3分の1以上なので要件を満たす。市長の解職は4万人以上必要なので、3万5000人では足りない。"},{"t":"tf","s":"直接請求権","imp":1,"q":"地方税の賦課徴収に関する条例も、住民の直接請求によって制定・改廃を求めることができる。","a":false,"e":"誤り。正しくは、地方税の賦課徴収や、分担金・使用料・手数料の徴収に関する条例は、条例の制定・改廃の直接請求の対象から除かれている。"},{"t":"tf","s":"直接請求権","imp":3,"q":"首長の解職を求める直接請求に必要な数の署名が集まると、その時点で首長は失職する。","a":false,"e":"誤り。正しくは、請求を受けた選挙管理委員会が住民投票を行い、過半数の同意があった場合に首長は失職する。署名はあくまで住民投票を行うための条件である。"},{"t":"tf","s":"直接請求権","imp":2,"q":"事務の監査請求に必要な署名数は、条例の制定・改廃の請求と同じく有権者の50分の1以上である。","a":true,"e":"正しい。条例の制定・改廃と事務の監査は50分の1以上、議会の解散、首長・議員の解職、主要公務員の解職は原則3分の1以上と、2つのグループに分けて覚える。"},{"t":"tf","s":"直接請求権","imp":1,"q":"直接請求の署名は、その地方公共団体に住所をもつ人であれば、外国人も含めて誰でも行うことができる。","a":false,"e":"誤り。正しくは、直接請求ができるのは、その地方公共団体の議員・首長の選挙権をもつ者（18歳以上の日本国民で、引き続き3か月以上住所を有する者）に限られる。これに対し住民監査請求は、外国人や法人を含め、住民であれば1人でもできる。"}]});</script>
<script>QDATA.push({"unit":"u10","questions":[{"t":"qa","s":"住民投票","imp":3,"q":"一の地方公共団体のみに適用される特別法（地方特別法）は、その住民の投票で過半数の同意を得なければ国会が制定できないと定めた日本国憲法の条文は第何条か。","a":"第95条","alt":["95条","第九十五条"],"e":"国会単独立法の原則（41条）の例外である。1949年の広島平和記念都市建設法などの例があるが、1950年代前半を最後に行われていない。"},{"t":"mc","s":"住民投票","imp":3,"q":"次の住民投票のうち、結果に法的拘束力があるものとして最も適当なものを一つ選べ。","c":["地方特別法の制定について、憲法95条に基づいて行われる住民投票","原子力発電所の建設の是非を問うため、条例に基づいて行われる住民投票","米軍基地建設のための埋め立ての賛否を問うため、条例に基づいて行われる住民投票","産業廃棄物処理施設の建設の是非を問うため、条例に基づいて行われる住民投票"],"a":0,"e":"憲法95条の住民投票は、過半数の同意がなければ国会はその法律を制定できないので法的拘束力がある。条例に基づく住民投票は、新潟県巻町（原発）、2019年の沖縄県（辺野古の埋め立て）、岐阜県御嵩町（産業廃棄物処理施設）などの例があるが、結果に法的拘束力はなく、首長や議会は結果を尊重するにとどまる。"},{"t":"qa","s":"住民投票","imp":2,"q":"1996年に、原子力発電所の建設の是非をめぐって、全国で初めて条例に基づく住民投票が行われた自治体はどこか。","a":"新潟県巻町","alt":["巻町"],"e":"結果は建設反対が多数となり、その後、建設計画は撤回された。巻町はのちに新潟市に合併した。"},{"t":"tf","s":"住民投票","imp":1,"q":"1996年に沖縄県で行われた県民投票は、日米地位協定の見直しと米軍基地の整理・縮小への賛否を問うもので、都道府県単位で初めての住民投票だった。","a":true,"e":"正しい。賛成が約9割を占めた。条例に基づく住民投票なので法的拘束力はないが、基地問題についての県民の意思を国内外に示した。"},{"t":"mc","s":"住民投票","imp":1,"q":"条例に基づいて行われた住民投票の実施自治体と争点の組合せとして適当でないものを一つ選べ。","c":["新潟県巻町 ― 原子力発電所の建設","岐阜県御嵩町 ― 産業廃棄物処理施設の建設","沖縄県（2019年） ― 辺野古の米軍基地建設のための埋め立て","徳島市 ― 原子力発電所の再稼働"],"a":3,"e":"徳島市の住民投票（2000年）は、吉野川の可動堰の建設の是非を問うものだったので誤り。他の3つは正しい組合せで、いずれも反対が多数となったが、条例に基づく住民投票の結果に法的拘束力はない。"},{"t":"tf","s":"住民投票","imp":2,"q":"2019年に沖縄県で行われた、辺野古の米軍基地建設のための埋め立てへの賛否を問う県民投票では、反対が多数を占めたため、国は法律上、埋め立てを中止しなければならなくなった。","a":false,"e":"誤り。正しくは、反対が7割を超えたが、条例に基づく住民投票には法的拘束力がないため、国は埋め立て工事を続けた。"},{"t":"qa","s":"住民投票","imp":2,"q":"2015年と2020年に大阪市で、市を廃止して特別区を設置することの賛否を問う住民投票が行われた。この構想を一般に何というか。","a":"大阪都構想","alt":["都構想"],"e":"大都市地域特別区設置法に基づく住民投票で、賛成が多ければ特別区が設置されるという法的拘束力のあるものだったが、2回とも僅差で反対が多数となり否決された。"},{"t":"ex","s":"住民投票","imp":3,"q":"憲法95条に基づく住民投票と、条例に基づく住民投票の違いを、結果の効力に注目して説明せよ。","a":"憲法95条の住民投票は、一の地方公共団体のみに適用される特別法について行われ、過半数の同意がなければ国会はその法律を制定できないので、法的拘束力がある。一方、条例に基づく住民投票は、原発や基地など地域の重要問題について住民の意思を問うものだが、法的拘束力はなく、首長や議会は結果を尊重するにとどまる。","e":"ポイント：①95条＝地方特別法、過半数の同意が制定の条件（法的拘束力あり） ②条例に基づく住民投票＝法的拘束力なし ③例は巻町・沖縄県・御嵩町・徳島市など"},{"t":"qa","s":"住民監査請求","imp":2,"q":"住民が1人でも、首長や職員による違法・不当な公金の支出などについて、監査委員に監査と必要な措置を求めることができる制度を何というか。","a":"住民監査請求","e":"監査の結果に不服があれば、違法な支出の差し止めや損害の回復を求めて裁判所に住民訴訟を起こせる（先に住民監査請求を行う必要がある）。政教分離が争われた愛媛玉串料訴訟も住民訴訟である。"},{"t":"mc","s":"住民監査請求","imp":2,"q":"住民監査請求と、直接請求の一つである事務の監査請求の違いについての記述として最も適当なものを一つ選べ。","c":["住民監査請求には有権者の3分の1以上の署名が必要だが、事務の監査請求は住民1人でもできる。","住民監査請求は選挙管理委員会に、事務の監査請求は首長に対して行う。","住民監査請求は住民1人でもできるが、事務の監査請求には有権者の50分の1以上の署名が必要である。","住民監査請求の結果に不服があっても、裁判所に訴えることはできない。"],"a":2,"e":"住民監査請求は財務会計上の行為を対象に1人でもでき、事務の監査請求は事務全般を対象に有権者の50分の1以上の署名が必要である。「3分の1以上の署名」は署名の要件を逆にしたうえ数字も誤り。どちらも請求先は監査委員なので「選挙管理委員会・首長」も誤り。住民監査請求の後には住民訴訟を起こせるので「裁判所に訴えることはできない」も誤りである。"},{"t":"qa","s":"地方財政","imp":3,"q":"地方公共団体間の財政力の格差を是正するため、国税の一定割合を国が地方公共団体に配分する、使い道が指定されない資金を何というか。","a":"地方交付税","alt":["地方交付税交付金"],"e":"所得税・法人税・酒税・消費税の一定割合などを財源とし、使途が自由な一般財源である。財政力の豊かな東京都には交付されていない（不交付団体）。"},{"t":"qa","s":"地方財政","imp":3,"q":"義務教育や公共事業などの特定の事業のために、国が使い道を指定して地方公共団体に交付する資金を何というか。","a":"国庫支出金","e":"補助金・負担金などからなり、使途が限定された特定財源である。国の基準や手続に縛られるため、地方の自主性を損なうと批判されてきた。"},{"t":"ex","s":"地方財政","imp":3,"q":"地方交付税と国庫支出金の違いを、目的と使い道の自由度に注目して説明せよ。","a":"地方交付税は、地方公共団体間の財政力の格差を是正するために国税の一定割合を配分するもので、使い道が限定されない一般財源である。国庫支出金は、国が特定の事業のために使い道を指定して交付する補助金などで、特定財源である。どちらも国に頼る依存財源である。","e":"ポイント：①地方交付税＝財政格差の是正・一般財源（使途自由） ②国庫支出金＝使途指定の特定財源 ③ともに依存財源"},{"t":"qa","s":"地方財政","imp":2,"q":"地方税などの自主財源が歳入の3割程度にすぎず、国に財源を大きく依存していた日本の地方自治の状態を皮肉った言葉は何か。","a":"三割自治","alt":["3割自治"],"e":"地方税のような自主財源に対し、地方交付税・国庫支出金・地方債などを依存財源という。地方税収の割合は実際には3〜4割程度で、財源の確保が地方分権の課題とされてきた。"},{"t":"mc","s":"地方財政","imp":3,"q":"地方公共団体の財源の分類として最も適当なものを一つ選べ。","c":["国庫支出金は自主財源であり、一般財源である。","地方債は自主財源であり、特定財源である。","地方交付税は依存財源であり、一般財源である。","地方税は依存財源であり、特定財源である。"],"a":2,"e":"地方交付税は国から配分されるので依存財源、使途が自由なので一般財源である。国庫支出金は依存財源で特定財源、地方債（地方公共団体の借金）は依存財源で特定財源、地方税は自主財源で一般財源なので、他の3つは誤りである。"},{"t":"tf","s":"地方財政","imp":2,"q":"北海道夕張市は2006年に財政破綻を表明し、のちに地方財政健全化法に基づく財政再生団体となった。","a":true,"e":"正しい。2007年制定の地方財政健全化法は、財政指標が悪化した地方公共団体を早期健全化団体や財政再生団体とし、国の関与のもとで再建させるしくみである。夕張市は炭鉱閉山後の観光開発などで巨額の負債を抱え、住民サービスの縮小や負担増を伴う再建を進めてきた。"}]});</script>
<script>QDATA.push({"unit":"u10","questions":[{"t":"qa","s":"地方分権改革","imp":3,"q":"1999年に制定され（2000年施行）、機関委任事務の廃止や国地方係争処理委員会の設置などを定めた法律を何というか。","a":"地方分権一括法","e":"1995年の地方分権推進法に基づく改革の中心で、多数の法律をまとめて改正したので「一括法」という。国と地方の関係を「上下・主従」から「対等・協力」に改めることをめざした。"},{"t":"ex","s":"地方分権改革","imp":3,"q":"機関委任事務とは何か。また、それが廃止された後、地方公共団体の事務がどのように再編されたかを説明せよ。","a":"機関委任事務とは、国の事務を知事や市町村長などに委任して処理させるしくみで、首長は国の下部機関として扱われ、議会の関与も制限されていた。地方分権一括法によって廃止され、地方公共団体の事務は、自らの判断で行う自治事務と、本来国が果たすべき事務を法律に基づいて処理する法定受託事務に再編された。","e":"ポイント：①機関委任事務＝国の事務を首長に委任し、首長は国の下部機関 ②地方分権一括法（1999年制定、2000年施行）で廃止 ③自治事務と法定受託事務に再編"},{"t":"mc","s":"地方分権改革","imp":3,"q":"地方公共団体の事務のうち、法定受託事務にあたるものとして最も適当なものを一つ選べ。","c":["都市計画の決定","国政選挙の事務","飲食店営業の許可","介護保険に関する事務"],"a":1,"e":"国政選挙の事務は、本来国が果たすべき役割に関わる事務を法律で地方公共団体に任せた法定受託事務である。旅券（パスポート）の交付、戸籍事務、生活保護の決定・実施なども法定受託事務である。都市計画の決定、飲食店営業の許可、介護保険に関する事務は、地方公共団体が自らの判断で行う自治事務である。"},{"t":"qa","s":"地方分権改革","imp":2,"q":"国の関与（是正の要求など）に不服がある地方公共団体が審査を申し出ることができる、総務省に置かれた第三者機関を何というか。","a":"国地方係争処理委員会","e":"地方分権一括法で設けられた。審査の結果に不服があれば、地方公共団体は高等裁判所に訴えることができる。ふるさと納税の対象から外された大阪府泉佐野市の申し出について、総務大臣に再検討を勧告した例がある。"},{"t":"ex","s":"地方分権改革","imp":2,"q":"三位一体の改革の内容と、その結果生じた問題を説明せよ。","a":"三位一体の改革は、小泉内閣が2000年代半ばに進めた改革で、国庫補助負担金の削減、地方交付税の見直し、国から地方への税源移譲の3つを一体で行った。約3兆円の税源移譲が実現したが、補助金と地方交付税の削減額がそれを上回ったため、財政力の弱い地方公共団体ほど財政が苦しくなった。","e":"ポイント：①国庫補助負担金の削減 ②地方交付税の見直し ③税源移譲（約3兆円） ④削減額が移譲額を上回り、地方財政が苦しくなった"},{"t":"tf","s":"地方分権改革","imp":2,"q":"1999年から2010年ごろにかけて進められた平成の大合併により、市町村の数は約3200から約1700に減少した。","a":true,"e":"正しい。合併特例債などの財政上の優遇措置で合併が促された。行政の効率化が進んだ一方、合併で周辺部となった地域の衰退や、住民の声が行政に届きにくくなるなどの課題も指摘されている。"},{"t":"mc","s":"地方分権改革","imp":1,"q":"地域を限って規制を緩和する制度についての記述として最も適当なものを一つ選べ。","c":["構造改革特区は、地域の規制を国の基準より厳しくするために設けられた制度である。","国家戦略特区は、地方公共団体が独自に条例で指定し、国の関与なしに規制を撤廃できる制度である。","国家戦略特区は、2000年の地方分権一括法の施行と同時に創設された。","構造改革特区は、地方公共団体などの提案をもとに特定の地域に限って規制の特例を認める制度で、2002年に創設された。"],"a":3,"e":"構造改革特区は小泉内閣のもとで2002年に制度化され、どぶろく特区などの例がある。国家戦略特区は2013年に第2次安倍内閣のもとで創設され、国が主導して大胆な規制改革を行う制度なので、「国の関与なしに」「2000年」は誤り。特区は規制の緩和を目的とするので「厳しくする」も誤りである。"},{"t":"qa","s":"地方分権改革","imp":2,"q":"自分が選んだ地方公共団体に寄付をすると、寄付額のうち2000円を超える部分が一定の上限まで所得税・住民税から控除される、2008年に始まった制度を何というか。","a":"ふるさと納税","e":"返礼品競争が過熱したため、2019年から返礼品は寄付額の3割以下の地場産品とするなどのルールが設けられた。都市部の自治体では住民税収が流出するという問題もある。"},{"t":"tf","s":"地方分権改革","imp":1,"q":"道州制とは、現在の都道府県を廃止・統合して、より広域の道や州を設け、国の権限や財源も大幅に移そうとする構想である。","a":true,"e":"正しい。地方制度調査会の答申（2006年）などで検討されてきたが、2026年時点で導入されていない。都道府県と市町村の二層制を見直す構想として覚えておく。"},{"t":"ex","s":"地方分権改革","imp":1,"q":"地方創生が進められている背景と、その目的を説明せよ。","a":"日本では人口減少と少子高齢化が進み、とくに地方では若い世代が東京圏などへ流出して過疎化が深刻になっている。そこで2014年にまち・ひと・しごと創生法が制定され、地方での雇用の創出や移住の促進などによって、東京一極集中を是正し、地方の人口減少に歯止めをかけることがめざされている。","e":"ポイント：①人口減少・少子高齢化と東京一極集中 ②まち・ひと・しごと創生法（2014年） ③地方での雇用創出・移住促進で人口減少に歯止め"},{"t":"ex","s":"地方自治の課題","imp":1,"q":"限界集落とは何か。過疎との関係にふれて説明せよ。","a":"限界集落とは、65歳以上の高齢者が住民の半数以上を占め、冠婚葬祭などの共同生活の維持が難しくなった集落をいう。若い世代が都市へ流出して人口が著しく減少する過疎が進んだ地域で増えており、医療・交通・買い物などの生活基盤の維持が課題となっている。","e":"ポイント：①65歳以上が半数以上 ②共同生活の維持が困難 ③過疎（人口の著しい減少）の進行が背景 ④生活基盤の維持が課題"},{"t":"qa","s":"地方自治の課題","imp":2,"q":"行政に対する住民の苦情を受けて中立的な立場から調査し、改善を勧告する制度で、1990年に川崎市が全国で初めて条例で導入したものを何というか。","a":"オンブズマン制度","alt":["オンブズマン","オンブズパーソン","オンブズパーソン制度","市民オンブズマン"],"e":"19世紀初めのスウェーデンで生まれた行政監視の制度で、「行政監察官」とも訳される。国レベルでは日本に導入されていない。民間の市民団体が情報公開制度を使って行政を監視する活動もある。"},{"t":"qa","s":"地方自治の課題","imp":2,"q":"1982年に山形県金山町が全国で初めて制定した、住民が行政の保有する文書の公開を求めることができるようにした条例を何というか。","a":"情報公開条例","alt":["公文書公開条例"],"e":"地方公共団体の取り組みが国より先行し、国の情報公開法は1999年に制定された（2001年施行）。住民が行政を監視し、住民自治を実質的なものにする手段となる。"}]});</script>
<script>QDATA.push({"unit":"u11","questions":[{"t":"qa","s":"選挙の原則","imp":3,"q":"選挙の原則のうち、財産や納税額、性別などによって選挙権を制限しないという原則を何というか。","a":"普通選挙","e":"反対は制限選挙である。憲法15条3項は「成年者による普通選挙」を保障している。他の原則は平等選挙・秘密選挙・直接選挙。"},{"t":"mc","s":"選挙の原則","imp":3,"q":"選挙の原則とその説明の組合せとして最も適当なものを一つ選べ。","c":["平等選挙 ― 一人一票とし、一票の価値もできるだけ等しくする","秘密選挙 ― 候補者の氏名や経歴を秘密にしたまま投票させる","直接選挙 ― 有権者が選んだ選挙人が代表者を選ぶ","普通選挙 ― 一定額以上の税を納めた者だけに選挙権を与える"],"a":0,"e":"平等選挙の説明として正しい。秘密選挙は誰に投票したかを秘密にすることであり、候補者の情報を伏せることではない。有権者が選んだ選挙人が代表者を選ぶのは間接選挙（アメリカ大統領選挙など）で、直接選挙の反対である。納税額で選挙権を制限するのは制限選挙で、普通選挙の反対である。"},{"t":"qa","s":"選挙の原則","imp":2,"q":"憲法15条4項「すべて選挙における（　）は、これを侵してはならない。」の空欄に入る語句は何か。","a":"投票の秘密","e":"秘密選挙の原則を定めた条文で、続けて「選挙人は、その選択に関し公的にも私的にも責任を問はれない」と定める。"},{"t":"tf","s":"選挙の原則","imp":2,"q":"日本で女性に初めて選挙権が認められたのは、1925年の普通選挙法の制定によってである。","a":false,"e":"誤り。正しくは、1925年の普通選挙法は満25歳以上の男子に選挙権を認めたもので、女性の選挙権は1945年の選挙法改正（満20歳以上の男女）で初めて認められた。2015年の公職選挙法改正で選挙権年齢は満18歳以上に引き下げられた。"},{"t":"tf","s":"選挙の原則","imp":1,"q":"日本では投票を棄権しても罰則はないが、オーストラリアのように投票を法律で義務づけ、棄権者に罰金を科す国もある。","a":true,"e":"正しい。投票するかしないかを有権者の自由に任せることを自由選挙の原則ということもある。投票を義務づける義務投票制の国では投票率が高い。"},{"t":"qa","s":"選挙区制","imp":3,"q":"1つの選挙区から1人の代表を選ぶ選挙区制を何というか。","a":"小選挙区制","e":"大政党に有利で二大政党制になりやすく、政局が安定しやすい。反面、死票が多く、少数意見が議席に反映されにくい。"},{"t":"qa","s":"選挙区制","imp":3,"q":"選挙で落選した候補者に投じられ、議席に結びつかなかった票を何というか。","a":"死票","e":"小選挙区制では最多得票の1人しか当選しないため死票が多くなる。大選挙区制や比例代表制では死票が少ない。"},{"t":"qa","s":"選挙区制","imp":2,"q":"1つの選挙区から2人以上の代表を選ぶ選挙区制を何というか。","a":"大選挙区制","e":"死票が少なく少数政党も議席を得やすいが、小党分立になりやすく、同じ政党の候補者どうしが争うこともある。かつて衆議院で採用された定数3〜5人程度の中選挙区制も、大選挙区制の一種である。"},{"t":"qa","s":"選挙区制","imp":3,"q":"各政党の得票数に比例して議席を配分する選挙制度を何というか。","a":"比例代表制","e":"民意を議席に正確に反映し死票が少ないが、小党分立になって連立政権が生まれやすく、政局が不安定になりやすい。"},{"t":"ex","s":"選挙区制","imp":3,"q":"小選挙区制の長所と短所を説明せよ。","a":"長所は、大政党に有利なため二大政党制になりやすく、政局が安定することや、選挙区が狭いので候補者と有権者の結びつきが強く、選挙費用も少なくてすむことである。短所は、死票が多く少数意見が議席に反映されにくいことや、得票率と議席率の差が大きくなりやすいことである。","e":"ポイント：①二大政党制・政局の安定 ②候補者と有権者の結びつき、選挙費用が少ない ③死票が多く少数政党に不利 ④得票率と議席率のずれ"},{"t":"ex","s":"選挙区制","imp":2,"q":"比例代表制の長所と短所を、小選挙区制と比較して説明せよ。","a":"比例代表制は得票数に応じて議席を配分するので、小選挙区制より死票が少なく、少数政党も議席を得やすいため、民意を正確に議席に反映できる。一方、小党分立になりやすく、単独で過半数を得る政党が生まれにくいため連立政権となって、政局が不安定になりやすい。","e":"ポイント：①死票が少なく民意を正確に反映 ②少数政党も議席を得やすい ③小党分立・連立政権で政局が不安定 ④小選挙区制はその逆の性格をもつ"},{"t":"qa","s":"選挙区制","imp":2,"q":"比例代表制で、各政党の得票数を1、2、3…の整数で順に割り、その商の大きい順に議席を配分する方式を何というか。","a":"ドント式","alt":["ドント方式"],"e":"2026年時点で、日本の衆議院・参議院の比例代表選挙で用いられている。小さな政党より大きな政党にやや有利な配分になるとされる。"},{"t":"mc","s":"選挙区制","imp":3,"q":"定数5の比例代表選挙で、A党が12000票、B党が7500票、C党が5000票を得た。ドント式で議席を配分したときの各党の議席数として正しいものを一つ選べ。","c":["A党3議席、B党1議席、C党1議席","A党2議席、B党2議席、C党1議席","A党3議席、B党2議席、C党0議席","A党2議席、B党1議席、C党2議席"],"a":0,"e":"各党の得票を1、2、3で割ると、A党は12000・6000・4000、B党は7500・3750、C党は5000・2500となる。大きい順に12000（A）、7500（B）、6000（A）、5000（C）、4000（A）の5つが当選するので、A党3、B党1、C党1である。得票率約49％のA党が議席の60％を得ており、ドント式が大政党にやや有利なことがわかる。他の3つは、商の大小を比べ誤ったものである。"},{"t":"qa","s":"選挙区制","imp":2,"q":"定数6の比例代表選挙で、A党が10000票、B党が7000票、C党が4500票、D党が2000票を得た。ドント式で配分すると、A党は何議席を得るか。","a":"3議席","alt":["3"],"e":"得票を1、2、3…で割った商の大きい順に、10000（A）、7000（B）、5000（A）、4500（C）、3500（B）、3333（A）の6つが当選する。よってA党3、B党2、C党1、D党0議席となる。"},{"t":"mc","s":"選挙区制","imp":3,"q":"ある国の議会選挙は小選挙区制で、3つの選挙区の結果は次のとおりだった（単位は千票、各区の当選者は1人）。第1区：A党48、B党32、C党20。第2区：A党44、B党40、C党16。第3区：A党12、B党61、C党27。この結果について述べた文として最も適当なものを一つ選べ。","c":["得票総数が最も多いB党は、獲得議席数ではA党より少ない。","死票の合計は、総投票数の半分を超えている。","C党は議席を得られなかったが、得票総数ではA党を上回っている。","3つの区を合わせて定数3の比例代表制（ドント式）で配分すると、A党が2議席を得る。"],"a":0,"e":"得票総数はA党104、B党133、C党63で、議席はA党2、B党1、C党0なので、最多得票のB党がA党より議席が少ない。死票は第1区52、第2区56、第3区39の計147で、総投票数300の半分に届かない。C党の63はA党の104より少ない。ドント式では商の大きい順に133（B）、104（A）、66.5（B）となり、B党2・A党1となる。小選挙区制では得票と議席がずれやすいことを示す例である。"},{"t":"tf","s":"選挙区制","imp":2,"q":"大選挙区制や比例代表制は、小選挙区制に比べて死票が多くなりやすい。","a":false,"e":"誤り。正しくは、死票が多くなりやすいのは小選挙区制である。大選挙区制は1つの選挙区から複数が当選し、比例代表制は得票に比例して議席が配分されるので、死票は少なくなる。"},{"t":"qa","s":"選挙区制","imp":1,"q":"特定の政党や候補者に有利になるように、選挙区の区割りを恣意的に行うことを何というか。","a":"ゲリマンダー","alt":["ゲリマンダリング"],"e":"19世紀初めにアメリカのマサチューセッツ州知事ゲリーが、自党に有利な不自然な形の選挙区をつくったことに由来する。小選挙区制で起こりやすい問題とされる。"},{"t":"tf","s":"選挙区制","imp":1,"q":"小選挙区制は二大政党制を、比例代表制は多党制を生みやすいという経験則は、フランスの政治学者デュヴェルジェによって示された。","a":true,"e":"正しい。デュヴェルジェの法則とよばれる。ただし必ずそうなるわけではなく、地域政党が強い国などの例外もある。"}]});</script>
<script>QDATA.push({"unit":"u11","questions":[{"t":"qa","s":"衆議院の選挙制度","imp":3,"q":"1994年の公職選挙法改正で導入され、1996年の総選挙から実施されている衆議院の選挙制度を何というか。","a":"小選挙区比例代表並立制","e":"小選挙区と比例代表に別々に投票し、それぞれで当選者を決める。それまでの中選挙区制は、同じ政党の候補者どうしが争うため派閥政治や金のかかる選挙の原因とされ、政治改革の一環として改められた。"},{"t":"qa","s":"衆議院の選挙制度","imp":3,"q":"2026年時点で定数465の衆議院議員のうち、小選挙区から選ばれる議員は何人か。","a":"289人","alt":["289"],"e":"残りの176人は比例代表で選ばれる。2026年秋には、比例代表の定数削減をめぐる議論が国会で進んでいる。"},{"t":"qa","s":"衆議院の選挙制度","imp":2,"q":"衆議院の比例代表選挙は、全国をいくつのブロックに分けて行われているか（2026年時点）。","a":"11","alt":["11ブロック","11個"],"e":"比例代表の定数176を11のブロックに配分し、政党名で投票する拘束名簿式で行う。参議院の比例代表は全国を1つの単位とする。"},{"t":"qa","s":"衆議院の選挙制度","imp":3,"q":"衆議院の比例代表選挙のように、政党があらかじめ当選順位を決めた候補者名簿を提出し、有権者が政党名で投票する方式を何というか。","a":"拘束名簿式","alt":["拘束名簿式比例代表制"],"e":"名簿の順位に従って当選者が決まる。参議院の比例代表は、候補者名でも投票でき、その得票の多い順に当選が決まる非拘束名簿式である。"},{"t":"qa","s":"衆議院の選挙制度","imp":2,"q":"衆議院の比例代表名簿で同じ順位に並んだ重複立候補者の当選順を決めるために用いる、小選挙区での自分の得票数をその選挙区の当選者の得票数で割った割合を何というか。","a":"惜敗率","e":"惜敗率が高い（当選者に迫った）候補者から順に当選する。ただし小選挙区で有効投票総数の10分の1未満しか得票できなかった候補者は、比例代表で当選できない。"},{"t":"ex","s":"衆議院の選挙制度","imp":1,"q":"衆議院の小選挙区比例代表並立制で、重複立候補した候補者が比例代表で当選する（復活当選する）しくみを説明せよ。","a":"政党は小選挙区の候補者を比例代表の名簿にも載せることができ、複数の候補者を同じ順位に並べることもできる。小選挙区で落選した候補者でも、名簿の順位に従って比例代表で当選することがあり、同じ順位の候補者の間では、小選挙区での惜敗率が高い順に当選する。","e":"ポイント：①重複立候補と名簿への同順位での登載 ②小選挙区で落選しても比例代表で当選しうる ③同順位では惜敗率の高い順 ④有効投票の10分の1未満の得票では復活できない"},{"t":"tf","s":"衆議院の選挙制度","imp":3,"q":"衆議院の比例代表選挙では、有権者は政党名と候補者名のどちらを書いて投票してもよい。","a":false,"e":"誤り。正しくは、衆議院の比例代表は拘束名簿式なので、有権者は政党名を書いて投票する。政党名・候補者名のどちらでも投票できるのは、非拘束名簿式の参議院の比例代表である。"},{"t":"qa","s":"参議院の選挙制度","imp":3,"q":"参議院の比例代表選挙で2001年から採用されている、有権者が政党名か候補者名で投票し、各政党内では候補者名の得票の多い順に当選者を決める方式を何というか。","a":"非拘束名簿式","alt":["非拘束名簿式比例代表制"],"e":"政党名と候補者名の得票の合計を各政党の得票としてドント式で議席を配分し、党内では個人の得票順に当選が決まる。"},{"t":"qa","s":"参議院の選挙制度","imp":2,"q":"2019年の参議院選挙から導入された、政党が比例代表名簿の中で、個人の得票に関係なく優先的に当選させる候補者を指定できるしくみを何というか。","a":"特定枠","e":"非拘束名簿式の中に拘束名簿式を一部取り入れたものである。合区で選挙区から立候補できなくなった県の候補者を救済するねらいがあると指摘された。"},{"t":"qa","s":"参議院の選挙制度","imp":2,"q":"参議院の選挙区選挙で、一票の格差を是正するため、人口の少ない隣り合う県を1つの選挙区にまとめることを何というか。","a":"合区","e":"2016年の選挙から導入され、「鳥取県と島根県」「徳島県と高知県」がそれぞれ1つの選挙区になった。それ以外の選挙区は都道府県単位である。"},{"t":"qa","s":"参議院の選挙制度","imp":2,"q":"2026年時点の参議院議員の定数は何人か。","a":"248人","alt":["248"],"e":"選挙区148人、比例代表100人で、任期は6年、3年ごとに半数の124人が改選される。参議院に解散はない。"},{"t":"mc","s":"参議院の選挙制度","imp":3,"q":"衆議院と参議院の選挙制度を比較した記述として最も適当なものを一つ選べ。","c":["衆議院の比例代表は全国1区で、参議院の比例代表は11のブロックに分かれている。","衆議院では小選挙区と比例代表の重複立候補ができるが、参議院では選挙区と比例代表の重複立候補はできない。","衆議院の比例代表は非拘束名簿式で、参議院の比例代表は拘束名簿式である。","衆議院議員の被選挙権は満30歳以上、参議院議員の被選挙権は満25歳以上である。"],"a":1,"e":"重複立候補ができるのは衆議院だけなので正しい。比例代表は衆議院が11ブロック、参議院が全国1区なので、ブロックの記述は逆である。名簿の方式も衆議院が拘束名簿式、参議院が非拘束名簿式なので逆。被選挙権は衆議院が満25歳以上、参議院が満30歳以上なのでこれも逆である。"},{"t":"tf","s":"参議院の選挙制度","imp":1,"q":"参議院の比例代表選挙では、各政党の得票数は、政党名で投じられた票と、その党の候補者名で投じられた票の合計となる。","a":true,"e":"正しい。この合計をもとにドント式で各党の議席数を決め、党内では候補者名の得票の多い順に当選者が決まる（特定枠の候補者がいればその人が優先される）。"},{"t":"qa","s":"一票の格差","imp":3,"q":"選挙区によって議員1人あたりの有権者数が異なるため、一票の価値に差が生じる問題を何というか。","a":"一票の格差","alt":["議員定数の不均衡","定数不均衡","一票の価値の格差"],"e":"法の下の平等（憲法14条）に反するとして、選挙のたびに訴訟が起こされてきた。最高裁は衆議院選挙について2度の違憲判決を出している。"},{"t":"qa","s":"一票の格差","imp":3,"q":"違法であっても、取り消すと公益に著しい障害が生じる場合に、違法を宣言するにとどめて請求を退ける判決を何というか。","a":"事情判決","e":"最高裁は1976年と1985年に衆議院の定数配分を違憲と判断したが、選挙を無効にすると混乱が大きいとして、事情判決の考え方により選挙そのものは有効とした。"},{"t":"tf","s":"一票の格差","imp":3,"q":"最高裁判所は、一票の格差を理由に衆議院の定数配分を違憲と判断し、その選挙を無効とした。","a":false,"e":"誤り。正しくは、最高裁は1976年と1985年に衆議院の定数配分を違憲と判断したが、事情判決の考え方により選挙を無効とはしなかった。一票の格差を理由に選挙が無効とされたことはない。"},{"t":"tf","s":"一票の格差","imp":2,"q":"一票の格差をめぐって、最高裁判所は参議院選挙について違憲状態と判断したことはあるが、違憲判決を出したことはない。","a":true,"e":"正しい。違憲状態とは、格差が憲法の求める平等に反する状態にあるが、是正に必要な合理的期間を過ぎていないので違憲とまではいえないという判断である。2026年11月にも2025年の参議院選挙（最大格差約3.1倍）を違憲状態と判断した。衆議院については違憲判決が2度ある。"},{"t":"ex","s":"一票の格差","imp":3,"q":"一票の格差をめぐる最高裁判所の「違憲判決」と「違憲状態」の判断の違いを説明せよ。","a":"違憲判決は、投票価値の格差が憲法の平等の要求に反し、しかも是正のための合理的期間内に是正されなかったとして、定数配分を違憲とするものである。違憲状態は、格差が平等の要求に反する状態にあるものの、合理的期間内に是正されなかったとまではいえないとして、違憲の宣言を避けるものである。どちらでも選挙は無効とされていない。","e":"ポイント：①格差が平等の要求に反する状態か ②是正のための合理的期間を過ぎたか ③違憲判決でも事情判決の考え方で選挙は有効"},{"t":"qa","s":"一票の格差","imp":2,"q":"各都道府県の人口を一定の数で割り、商の小数点以下を切り上げた数をその都道府県の定数とする議席配分方式で、衆議院の小選挙区の配分に導入されたものを何というか。","a":"アダムズ方式","e":"人口比をより正確に反映するため2016年の法改正で導入が決まり、2022年の区割り改定（いわゆる10増10減）で初めて適用された。それまでの、まず各都道府県に1議席ずつ配分する一人別枠方式は、最高裁に格差の原因と指摘され廃止された。"},{"t":"mc","s":"一票の格差","imp":2,"q":"選挙区Xは有権者60万人で定数2人、選挙区Yは有権者12万人で定数1人である。この2つの選挙区の一票の格差についての記述として最も適当なものを一つ選べ。","c":["格差は5倍で、選挙区Yの有権者の一票はXの有権者の一票の5倍の重みをもつ。","格差は2.5倍で、選挙区Xの有権者の一票はYの有権者の一票の2.5倍の重みをもつ。","格差は5倍で、選挙区Xの有権者の一票はYの有権者の一票の5倍の重みをもつ。","格差は2.5倍で、選挙区Yの有権者の一票はXの有権者の一票の2.5倍の重みをもつ。"],"a":3,"e":"議員1人あたりの有権者数は、Xが60万÷2＝30万人、Yが12万人なので、格差は30万÷12万＝2.5倍である。議員1人あたりの有権者が少ないYの方が一票の重みが大きい。有権者数をそのまま比べて5倍とするのは定数の違いを無視した誤りであり、Xの一票の方が重いとするのは関係を逆にした誤りである。"}]});</script>
<script>QDATA.push({"unit":"u11","questions":[{"t":"qa","s":"公職選挙法","imp":3,"q":"選挙権年齢を満20歳以上から満18歳以上に引き下げる公職選挙法の改正が行われたのは何年か。","a":"2015年","alt":["2015"],"e":"翌2016年の参議院選挙から18歳以上の投票が始まった。民法の成年年齢が18歳になったのは2022年4月で、選挙権年齢の引き下げの方が先だった。"},{"t":"mc","s":"公職選挙法","imp":3,"q":"被選挙権の年齢の組合せとして正しいものを一つ選べ。","c":["衆議院議員：満25歳以上、参議院議員：満30歳以上、都道府県知事：満30歳以上","衆議院議員：満30歳以上、参議院議員：満25歳以上、都道府県知事：満30歳以上","衆議院議員：満25歳以上、参議院議員：満30歳以上、都道府県知事：満25歳以上","衆議院議員：満18歳以上、参議院議員：満25歳以上、都道府県知事：満30歳以上"],"a":0,"e":"衆議院議員・市町村長・地方議会議員は満25歳以上、参議院議員・都道府県知事は満30歳以上である。参議院議員と知事を逆にしたもの、知事を25歳としたものは誤り。選挙権は満18歳以上に引き下げられたが、被選挙権の年齢は変わっていないので「満18歳以上」も誤りである。"},{"t":"qa","s":"公職選挙法","imp":3,"q":"公職選挙法で禁止されている、選挙運動のために有権者の家を一軒ずつ訪ねて投票を依頼する行為を何というか。","a":"戸別訪問","e":"買収などの不正の温床になるなどの理由で禁止されており、最高裁はこの禁止を合憲としている。欧米では一般的な選挙運動として認められている国が多い。"},{"t":"qa","s":"公職選挙法","imp":3,"q":"候補者の秘書や親族、選挙運動の総括主宰者などが買収などの選挙違反で刑に処せられた場合に、候補者本人の当選を無効とする制度を何というか。","a":"連座制","e":"1994年の公職選挙法改正で、組織的選挙運動管理者なども対象に加えて強化された（拡大連座制）。当選無効に加え、同じ選挙区から5年間立候補できなくなる。"},{"t":"tf","s":"公職選挙法","imp":3,"q":"2013年の公職選挙法改正でインターネットを利用した選挙運動が解禁され、一般の有権者も電子メールで特定の候補者への投票を呼びかけられるようになった。","a":false,"e":"誤り。正しくは、ウェブサイトやSNSを使った選挙運動は一般の有権者にも認められたが、電子メールによる選挙運動は候補者と政党などに限られ、一般の有権者には認められていない。"},{"t":"qa","s":"公職選挙法","imp":2,"q":"投票日に仕事や旅行などの予定がある有権者が、公示日・告示日の翌日から投票日の前日までの間に、選挙人名簿に登録されている市区町村で投票できる制度を何というか。","a":"期日前投票","alt":["期日前投票制度"],"e":"2003年に導入され、投票の利便性を高めた。投票率向上のため、投票時間の延長（原則午後8時まで）や、駅や商業施設への期日前投票所の設置なども行われている。"},{"t":"qa","s":"公職選挙法","imp":2,"q":"外国に住む日本人が国政選挙で投票できる制度を何というか。","a":"在外投票","alt":["在外選挙","在外投票制度","在外選挙制度"],"e":"当初は比例代表選挙に限られていたが、2005年に最高裁が選挙区選挙で投票できないのは違憲と判断し、その後選挙区選挙でも投票できるようになった。"},{"t":"mc","s":"公職選挙法","imp":2,"q":"選挙期間中の次の行為のうち、2026年時点の公職選挙法で認められているものとして最も適当なものを一つ選べ。","c":["満17歳の高校生が、SNSで友人に特定の候補者への投票を呼びかける。","満18歳の高校生の有権者が、SNSで特定の候補者への投票を呼びかける。","有権者が、特定の候補者への投票を頼むため、近所の家を一軒ずつ訪問する。","一般の有権者が、知人に特定の候補者への投票を呼びかける電子メールを送る。"],"a":1,"e":"満18歳以上の有権者は、SNSなどウェブサイトを使った選挙運動ができる。満18歳未満の者は選挙運動そのものが禁止されているので満17歳の例は誤り。戸別訪問は禁止されている。一般の有権者による電子メールでの選挙運動も認められていない。"},{"t":"ex","s":"公職選挙法","imp":2,"q":"インターネット選挙運動の解禁の内容と、電子メールの利用が制限されている理由を説明せよ。","a":"2013年の公職選挙法改正で、ウェブサイトやSNSを使った選挙運動が候補者や政党だけでなく一般の有権者にも認められた。一方、電子メールによる選挙運動は候補者と政党などに限られている。電子メールは外から見えにくく、なりすましや誹謗中傷などに悪用されるおそれがあるためである。","e":"ポイント：①2013年の公職選挙法改正 ②ウェブサイト・SNSは一般の有権者も可 ③電子メールは候補者・政党などに限定 ④なりすまし・誹謗中傷のおそれ"},{"t":"tf","s":"公職選挙法","imp":1,"q":"選挙運動ができるのは立候補の届出をしてから投票日の前日までであり、それより前に行う事前運動は禁止されている。","a":true,"e":"正しい。選挙運動の期間は、衆議院議員選挙では12日間、参議院議員選挙では17日間である。投票日当日も選挙運動はできない。"},{"t":"qa","s":"投票率と政治参加","imp":2,"q":"特定の支持政党をもたない有権者の層を何というか。","a":"無党派層","alt":["支持政党なし層"],"e":"1990年代以降に増加し、その投票行動が選挙結果を大きく左右するようになった。選挙ごとに争点や候補者を見て投票先を決める人も多い。"},{"t":"tf","s":"投票率と政治参加","imp":2,"q":"無党派層とは、政治に関心がなく選挙で投票しない有権者のことをいう。","a":false,"e":"誤り。正しくは、無党派層は特定の支持政党をもたない有権者のことであり、政治に関心をもち、選挙ごとに投票先を選ぶ人も多く含まれる。"},{"t":"tf","s":"投票率と政治参加","imp":2,"q":"近年の国政選挙では、20歳代の投票率が60歳代の投票率を上回っている。","a":false,"e":"誤り。正しくは、20歳代の投票率は30％台程度と年代別で最も低い水準にあり、6〜7割程度の60歳代を大きく下回っている。"},{"t":"ex","s":"投票率と政治参加","imp":2,"q":"若い世代の投票率が低いことが、政治にどのような影響を与えると考えられるか説明せよ。","a":"投票率の高い高齢者の意見が政治に反映されやすくなり、年金や医療など高齢者に関わる政策が重視される一方、教育や子育て支援など若い世代に関わる政策が後回しにされるおそれがある。このような状況はシルバー民主主義とよばれ、若者の政治参加を促す主権者教育の重要性が指摘されている。","e":"ポイント：①高齢者の意見が反映されやすい ②若い世代向けの政策が後回しになるおそれ ③シルバー民主主義 ④主権者教育と若者の政治参加"},{"t":"mc","s":"投票率と政治参加","imp":1,"q":"日本で投票率を上げるために行われてきた制度や取り組みとして適当でないものを一つ選べ。","c":["投票日前でも投票できる期日前投票制度の導入","駅や商業施設など、有権者の身近な場所への期日前投票所の設置","投票所を閉じる時刻を原則午後8時まで延長すること","投票を棄権した有権者に罰金を科すこと"],"a":3,"e":"日本では投票は権利であって義務ではなく、棄権に罰金を科す制度はない（オーストラリアなどには義務投票制がある）。期日前投票制度（2003年）、駅や商業施設への期日前投票所の設置、投票時間の延長（1998年から原則午後8時まで）は、実際に行われてきた取り組みである。"}]});</script>
<script>QDATA.push({"unit":"u11","questions":[{"t":"qa","s":"政党","imp":3,"q":"「政党とは、ある特定の原理に基づき、一致協力して国民的利益を増進させるために結合した人々の集団である」と定義したイギリスの政治家は誰か。","a":"バーク","alt":["エドマンド・バーク","E.バーク"],"e":"18世紀の政治家で、保守主義の父ともよばれる。政党を私的な利益を求める徒党ではなく、国民全体の利益をめざす集団と位置づけた。"},{"t":"ex","s":"政党","imp":3,"q":"政党が議会制民主主義の中で果たしている機能を説明せよ。","a":"政党は、国民のさまざまな意見や利益を集約して政策にまとめ、選挙で政策や候補者を示して国民が選択できるようにする。選挙に勝った政党は与党として政権を担い政策を実現し、政権に参加しない野党は政府を監視・批判して対案を示す。また、政治家を育成し、国民の政治意識を高める役割ももつ。","e":"ポイント：①国民の意見・利益の集約と政策化 ②選挙で選択肢を示す ③与党は政権を担当、野党は政府を監視・批判 ④政治家の育成と国民の政治的教育"},{"t":"qa","s":"政党","imp":2,"q":"制限選挙の時代に、財産と教養をもつ地域の有力者を中心に結成された政党を何というか。","a":"名望家政党","e":"19世紀のイギリスなどでみられた。普通選挙が広まると、多数の大衆を党員として組織し、綱領や党の規律をもつ大衆政党（組織政党）が中心になった。"},{"t":"tf","s":"政党","imp":2,"q":"名望家政党とは、普通選挙の普及にともなって、多数の大衆を党員として組織し、綱領や党の規律をもつようになった政党である。","a":false,"e":"誤り。正しくは、それは大衆政党（組織政党）の説明である。名望家政党は、制限選挙の時代に財産と教養をもつ有力者を中心に結成された政党である。"},{"t":"qa","s":"政党","imp":2,"q":"政権を担当している政党を与党というのに対し、政権に参加していない政党を何というか。","a":"野党","e":"野党は政府の政策を監視・批判し、対案を示す。イギリスの野党第一党は、政権交代に備えて「影の内閣（シャドー・キャビネット）」を組織する。"},{"t":"mc","s":"政党","imp":3,"q":"政党制についての記述として最も適当なものを一つ選べ。","c":["多党制は少数意見が反映されにくいが、単独政権となるため政局が安定しやすい。","一党制は、複数の政党が政権を争う中で一つの政党が長く政権を担う体制であり、アメリカがその例である。","二大政党制は、政権交代が起こりやすく、有権者にとって争点が明確になりやすい。","二大政党制の代表例はフランスとイタリアであり、多党制の代表例はイギリスとアメリカである。"],"a":2,"e":"二大政党制は政権交代が起こりやすく争点が明確になりやすい（反面、多様な意見は反映されにくい）。多党制は多様な意見を反映しやすいが、連立政権になりやすく政局が不安定になりがちなので、1つ目は性格を逆にした誤り。一党制は旧ソ連や中国のように特定の政党だけが政権を独占する体制で、アメリカは二大政党制である。二大政党制の例はイギリス（保守党・労働党）とアメリカ（共和党・民主党）なので、最後の記述も逆である。"},{"t":"qa","s":"政党","imp":2,"q":"議会で単独で過半数をとる政党がないときなどに、複数の政党が協力して組織する政権を何というか。","a":"連立政権","alt":["連立内閣"],"e":"多党制の国で生まれやすい。日本では1993年の細川内閣以降、連立政権の時期が多くなった。"},{"t":"tf","s":"政党","imp":1,"q":"特定の階級や地域に限らず、幅広い層から支持を集めようとする政党は、包括政党（キャッチ・オール・パーティー）とよばれる。","a":true,"e":"正しい。第二次世界大戦後の先進国で、イデオロギーの対立が弱まるなかで増えた。日本の自民党も包括政党の性格をもつとされる。"},{"t":"qa","s":"日本の政党政治","imp":3,"q":"1955年に成立した、自由民主党が政権を担い、日本社会党が野党第一党として対抗した政治体制を何というか。","a":"55年体制","alt":["五五年体制","1955年体制"],"e":"1955年に、左右に分裂していた社会党が再統一し、これに対抗して自由党と日本民主党が合同（保守合同）して自民党が結成された。社会党の議席は自民党のおよそ半分で、「1と2分の1政党制」ともよばれた。"},{"t":"tf","s":"日本の政党政治","imp":2,"q":"55年体制のもとでは、自由民主党と日本社会党が交互に政権を担当する二大政党制が続いた。","a":false,"e":"誤り。正しくは、55年体制のもとでは1993年まで自民党が一貫して政権を担い（一党優位）、社会党は野党第一党にとどまった。政権交代のある二大政党制ではなかった。"},{"t":"qa","s":"日本の政党政治","imp":3,"q":"1993年に非自民の8党派による連立内閣が成立し、55年体制が崩壊した。このときの首相は誰か。","a":"細川護熙","alt":["細川"],"e":"宮沢内閣の不信任決議の可決と解散・総選挙で自民党が過半数を割り、日本新党の細川を首相とする連立内閣が成立した。1994年には小選挙区比例代表並立制などを定めた政治改革関連法を成立させた。"},{"t":"qa","s":"日本の政党政治","imp":2,"q":"1994年に成立した、自由民主党・日本社会党・新党さきがけの3党による連立内閣で首相となった社会党の委員長は誰か。","a":"村山富市","alt":["村山"],"e":"長く対立してきた自民党と社会党が連立を組んだ（自社さ連立）。社会党の首相は1947年の片山哲以来で、村山首相は自衛隊を合憲とし、日米安全保障条約の堅持を表明した。"},{"t":"mc","s":"日本の政党政治","imp":3,"q":"次のア〜ウの出来事を古いものから順に並べたものとして正しいものを一つ選べ。ア：民主党を中心とする連立政権が成立した。イ：自由民主党・日本社会党・新党さきがけの連立政権が成立した。ウ：自由党と日本民主党が合同して自由民主党が結成された。","c":["ウ→イ→ア","ウ→ア→イ","イ→ウ→ア","ア→イ→ウ"],"a":0,"e":"ウは1955年（保守合同、55年体制の成立）、イは1994年（村山内閣）、アは2009年（鳩山内閣）なので、ウ→イ→アとなる。"},{"t":"qa","s":"日本の政党政治","imp":1,"q":"2009年の総選挙で民主党が圧勝して成立した、民主党を中心とする連立内閣の首相は誰か。","a":"鳩山由紀夫","alt":["鳩山"],"e":"選挙による本格的な政権交代とされる。しかし民主党政権は3年あまりで終わり、2012年の総選挙で自民党が政権に復帰した。"},{"t":"tf","s":"日本の政党政治","imp":2,"q":"2012年の総選挙で自由民主党が政権に復帰し、公明党との連立による第2次安倍晋三内閣が成立した。","a":true,"e":"正しい。2009年に政権を失った自民党は、3年あまりで政権に復帰した。第2次安倍内閣はその後、長期政権となった。"},{"t":"ex","s":"日本の政党政治","imp":2,"q":"55年体制とはどのような政治体制で、どのようにして崩壊したかを説明せよ。","a":"55年体制は、1955年の社会党の再統一と保守合同による自民党の結成で生まれ、自民党が一貫して政権を担い、社会党が野党第一党として対抗した体制である。リクルート事件などの汚職をきっかけに政治改革を求める声が高まり、1993年の総選挙で自民党が過半数を割って細川連立内閣が成立したことで崩壊した。","e":"ポイント：①1955年の社会党統一と保守合同 ②自民党の長期政権と野党第一党の社会党 ③汚職事件と政治改革の要求 ④1993年の細川連立内閣の成立で崩壊"}]});</script>
<script>QDATA.push({"unit":"u11","questions":[{"t":"qa","s":"政治資金","imp":3,"q":"政治団体の収支の報告・公開や、政治献金の制限などを定めた法律を何というか。","a":"政治資金規正法","e":"1948年に制定された。1994年の改正で企業・団体献金の受け手が制限され、政治家個人の資金管理団体への企業・団体献金は2000年から禁止された（政党や政党支部への献金は認められている）。2024年には、派閥の政治資金パーティーをめぐる不記載問題を受けて、パーティー券購入者の公開基準の引き下げなどの改正が行われた。"},{"t":"tf","s":"政治資金","imp":3,"q":"政治資金規正法により、企業や労働組合などの団体が政党に献金することは全面的に禁止されている。","a":false,"e":"誤り。正しくは、禁止されているのは政治家個人（資金管理団体）への企業・団体献金であり、政党や政党支部、政治資金団体への企業・団体献金は認められている。企業・団体献金を全面的に禁止すべきかどうかは、現在も議論が続いている。"},{"t":"qa","s":"政治資金","imp":3,"q":"1994年に制定された、国が政党に政党交付金を交付することを定めた法律を何というか。","a":"政党助成法","e":"企業・団体献金への依存を減らし、政治腐敗を防ぐことがねらいである。交付金の総額は、国民1人あたり250円を基準に算定される。"},{"t":"mc","s":"政治資金","imp":1,"q":"政党助成法に基づいて政党交付金を受け取ることができる政党の要件として最も適当なものを一つ選べ。","c":["所属する国会議員が10人以上いる政党に限られる。","国会議員の数にかかわらず、届け出たすべての政治団体が受け取れる。","直近の衆議院議員総選挙で、比例代表の議席を得た政党に限られる。","所属する国会議員が5人以上いるか、国会議員が1人以上いて直近の国政選挙の全国の得票率が2％以上の政党である。"],"a":3,"e":"政党助成法は、国会議員5人以上、または国会議員1人以上で国政選挙の得票率2％以上という要件を定めている。「10人以上」は人数の誤り、「すべての政治団体」は要件がないとする誤り、「比例代表の議席」は要件をすり替えた誤りである。なお、要件を満たしても日本共産党は制度に反対して受け取っていない。"},{"t":"qa","s":"政治資金","imp":2,"q":"1976年に発覚し、田中角栄元首相が逮捕された、航空機の売り込みをめぐる汚職事件を何というか。","a":"ロッキード事件","e":"アメリカの航空機メーカーから多額の資金が渡った事件で、金権政治への批判が高まった。その後もリクルート事件（1988年）や東京佐川急便事件（1992年）などが続き、1990年代の政治改革につながった。"},{"t":"qa","s":"政治資金","imp":1,"q":"1988年に発覚し、未公開株が政治家や官僚などに広く譲渡されていたことが問題となり、竹下内閣の退陣につながった事件を何というか。","a":"リクルート事件","e":"政治とカネの問題への不信が高まり、政治改革の機運が強まった。これが1994年の政治改革関連法（小選挙区比例代表並立制の導入、政党助成法の制定など）につながった。"},{"t":"ex","s":"政治資金","imp":2,"q":"政党助成制度が導入された目的と、その問題点として指摘されていることを説明せよ。","a":"政党助成制度は、政治活動に必要な費用を税金から政党に交付することで、企業・団体献金への依存を減らし、汚職などの政治腐敗を防ぐことを目的に導入された。一方、国民が支持しない政党にも税金が使われることや、交付金を受けながら企業・団体献金も続いていることが問題点として指摘されている。","e":"ポイント：①政党助成法（1994年）、国民1人あたり250円が基準 ②企業・団体献金への依存を減らし政治腐敗を防ぐ ③支持しない政党にも税金が使われる ④企業・団体献金も続いている"},{"t":"qa","s":"圧力団体","imp":3,"q":"自らの特定の利益を実現するため、政府や議会、政党などに働きかける集団で、政権の獲得をめざさない点で政党と異なるものを何というか。","a":"圧力団体","alt":["利益集団","利益団体"],"e":"日本経済団体連合会（経団連）などの経営者団体、日本労働組合総連合会（連合）などの労働団体、農業協同組合（JA）、日本医師会などがその例である。"},{"t":"qa","s":"圧力団体","imp":2,"q":"圧力団体などの依頼を受けて、議員や官僚に働きかけることを職業とする人を何というか。","a":"ロビイスト","e":"アメリカで活動がさかんで、透明性を確保するため登録や活動報告が義務づけられている。議会のロビー（控室）で議員に働きかけたことが名前の由来とされる。"},{"t":"qa","s":"圧力団体","imp":2,"q":"特定の政策分野に精通し、関係する省庁や業界団体と結びついて、その分野の政策決定に強い影響力をもつ国会議員を何というか。","a":"族議員","e":"農林族・建設族・郵政族などとよばれた。政治家・官僚・業界（財界）が互いの利益のために結びつく「政・官・財の癒着（鉄のトライアングル）」の一角を担い、汚職の温床になると批判されてきた。"},{"t":"mc","s":"圧力団体","imp":2,"q":"圧力団体についての記述として適当でないものを一つ選べ。","c":["圧力団体は、議会だけでは代表されにくい国民のさまざまな利益を政治に伝える役割をもつ。","圧力団体は、自ら候補者を立てて選挙に勝ち、政権を獲得して政策を実行することを主な目的とする。","圧力団体の活動が強まると、組織力や資金力のある集団の利益が優先されるおそれがある。","日本では、経営者団体や労働団体、農業団体、医師の団体などが圧力団体として活動してきた。"],"a":1,"e":"政権の獲得をめざすのは政党であり、圧力団体は政権獲得をめざさず、政府や政党に働きかけて自らの利益を実現しようとする点で異なる。圧力団体には多様な利益を政治に伝え議会政治を補う面がある一方、特定の利益が優先され、政・官・財の癒着を生むなどの問題もある。"}]});</script>
<script>QDATA.push({"unit":"u11","questions":[{"t":"qa","s":"世論とマスメディア","imp":3,"q":"新聞・テレビなどのマスメディアは、世論の形成に大きな影響力をもつことから、立法・行政・司法に次ぐ何とよばれるか。","a":"第四の権力","e":"権力を監視する役割が期待される一方、報道が偏ったり権力側に利用されたりすると、世論操作につながるおそれがある。"},{"t":"qa","s":"世論とマスメディア","imp":2,"q":"選挙の前に報道される情勢予測などが、有権者の投票行動に影響を与えることを何というか。","a":"アナウンスメント効果","e":"優勢と報じられた候補者に票が集まるバンドワゴン効果と、劣勢と報じられた候補者に同情票が集まるアンダードッグ効果がある。"},{"t":"qa","s":"世論とマスメディア","imp":3,"q":"メディアが伝える情報をうのみにせず、主体的・批判的に読み解き、活用する能力を何というか。","a":"メディア・リテラシー","alt":["メディアリテラシー"],"e":"SNSの普及で誰もが情報を発信できるようになり、偽情報（フェイクニュース）を見抜き、情報の真偽や発信元を確かめる力が一層重要になっている。"},{"t":"mc","s":"世論とマスメディア","imp":1,"q":"選挙前に「A候補が大きくリード」と報道された結果、勝ち馬に乗ろうとしてA候補に投票する人が増えた。この現象を説明する語として最も適当なものを一つ選べ。","c":["アンダードッグ効果","エコーチェンバー","バンドワゴン効果","フィルターバブル"],"a":2,"e":"優勢と報じられた側に票が集まるのはバンドワゴン効果で、アナウンスメント効果の一つである。アンダードッグ効果は劣勢と報じられた側に同情票が集まること。エコーチェンバーはSNSなどで似た意見ばかりに囲まれて考えが強まり極端になること、フィルターバブルはアルゴリズムによって自分の好みに合う情報ばかりが表示され、異なる情報から隔てられることである。"},{"t":"ex","s":"世論とマスメディア","imp":2,"q":"SNSの普及が世論の形成に与える影響を、良い面と問題点の両面から説明せよ。","a":"SNSの普及で、誰もが自分の意見を発信し多くの人と共有できるようになり、市民の政治参加や社会運動の広がりを後押ししている。一方、偽情報が急速に拡散したり、自分と似た意見ばかりに触れて考えが極端になるエコーチェンバーやフィルターバブルが生じたりして、世論の分断を招くおそれもある。","e":"ポイント：①誰もが発信でき、政治参加を促す ②偽情報（フェイクニュース）の拡散 ③エコーチェンバー・フィルターバブルによる分断 ④メディア・リテラシーの必要性"},{"t":"tf","s":"世論とマスメディア","imp":2,"q":"世論操作とは、世論調査によって国民の意見を正確に把握し、政策に反映させることをいう。","a":false,"e":"誤り。正しくは、世論操作とは、権力者などがマスメディアなどを利用して情報を選別・誘導し、世論を自分たちに都合のよい方向に導くことをいう。民主政治をゆがめるおそれがある。"},{"t":"qa","s":"政治的無関心","imp":2,"q":"『孤独な群衆』で、政治的無関心を伝統型無関心と現代型無関心に分けたアメリカの社会学者は誰か。","a":"リースマン","alt":["D.リースマン","デイヴィッド・リースマン"],"e":"伝統型無関心は、政治は身分の高い人が行うものと考えて関心をもたない前近代的な無関心である。現代型無関心は、政治の知識や情報はあるのに、無力感や不信感から政治への関心を失うものである。"},{"t":"mc","s":"政治的無関心","imp":3,"q":"リースマンのいう現代型無関心の例として最も適当なものを一つ選べ。","c":["政治は身分の高い人々が行うものだと考え、政治について知ろうとしない。","政治についての情報は十分にもっているが、自分が投票しても何も変わらないと感じて選挙に行かない。","特定の政党を強く支持し、選挙のたびに積極的に投票している。","政治に強い関心をもち、選挙では各党の公約を比較して投票先を決めている。"],"a":1,"e":"現代型無関心は、政治の知識や情報はあるのに、無力感や不信感から政治に関わらない態度である。「身分の高い人々が行うもの」と考えるのは伝統型無関心である。残りの2つは政治に関心をもち参加している例なので、無関心にあたらない。"},{"t":"qa","s":"市民活動","imp":3,"q":"1995年の阪神・淡路大震災でのボランティア活動の広がりをきっかけに、1998年に制定された、市民活動団体が法人格を得やすくした法律を何というか。","a":"特定非営利活動促進法","alt":["NPO法"],"e":"NPO法ともいう。NPO（非営利組織）は利益の分配を目的とせず、社会的な課題に取り組む団体である。寄付をした人が税制上の優遇を受けられる認定NPO法人の制度もある。"},{"t":"tf","s":"市民活動","imp":1,"q":"NGO（非政府組織）は政府から独立して国境を越えて活動する民間団体で、地雷禁止国際キャンペーンのように国際的な条約づくりに影響を与えた例もある。","a":true,"e":"正しい。地雷禁止国際キャンペーン（ICBL）は対人地雷禁止条約の成立（1997年）に貢献し、ノーベル平和賞を受賞した。核兵器廃絶国際キャンペーン（ICAN）も核兵器禁止条約の成立に貢献した。"},{"t":"ex","s":"市民活動","imp":1,"q":"NPOとNGOの違いと共通点を説明せよ。","a":"NPOは利益の分配を目的としない民間の非営利組織で、とくに国内の福祉やまちづくりなどで活動する団体をさすことが多い。NGOは政府から独立した民間の非政府組織で、とくに国際協力や人権・環境などの分野で国境を越えて活動する団体をさすことが多い。どちらも市民の立場から公共的な課題に取り組む点で共通する。","e":"ポイント：①NPO＝非営利（利益を分配しない） ②NGO＝非政府（政府から独立） ③国内中心か国際中心かという使い分け ④市民が公共的な課題に取り組む点が共通"}]});</script>
<script>QDATA.push({"unit":"u11","questions":[{"t":"qa","s":"行政国家と官僚制","imp":3,"q":"20世紀に福祉国家化にともなって行政の役割が拡大し、行政権が立法権や司法権に対して優位に立つようになった国家を何というか。","a":"行政国家","e":"国家の役割を治安維持や国防などに限定した19世紀の夜警国家（立法国家）と対比される。行政の専門化・肥大化が進み、議会による統制が難しくなった。"},{"t":"qa","s":"行政国家と官僚制","imp":3,"q":"法律では大枠だけを定め、具体的な内容を政令や省令など行政機関の命令に任せることを何というか。","a":"委任立法","e":"行政の専門化にともない増加した。国会が「唯一の立法機関」（憲法41条）としての役割を十分に果たせなくなり、行政の裁量が拡大するという問題がある。"},{"t":"qa","s":"行政国家と官僚制","imp":2,"q":"規則による支配、権限の明確な分担、上下の階層構造、文書による事務処理などを特徴とする官僚制を、合理的な組織形態として分析したドイツの社会学者は誰か。","a":"ウェーバー","alt":["マックス・ウェーバー","M.ウェーバー","ヴェーバー","マックス・ヴェーバー"],"e":"官僚制は大規模な組織を効率よく運営するしくみだが、行き過ぎると形式主義・前例主義・セクショナリズム（縄張り主義）・秘密主義などの弊害（官僚主義）を生む。"},{"t":"ex","s":"行政国家と官僚制","imp":2,"q":"官僚制の弊害として指摘される「官僚主義」の具体的な内容を説明せよ。","a":"官僚制は規則や前例に従って効率よく事務を処理するしくみだが、行き過ぎると、規則や手続を守ること自体が目的となる形式主義、前例のないことを避ける前例主義、自分の部署の権限や利益を優先するセクショナリズム（縄張り主義）、情報を外部に出さない秘密主義などの弊害を生む。","e":"ポイント：①形式主義・前例主義 ②セクショナリズム（縄張り主義） ③秘密主義・事なかれ主義 ④規則の順守が目的化する"},{"t":"qa","s":"行政国家と官僚制","imp":3,"q":"退職した高級官僚が、在職中に所管していた業界の企業や関係団体に再就職することを俗に何というか。","a":"天下り","e":"官庁と業界の癒着や、補助金・許認可をめぐる不正の原因になると批判されてきた。2007年の国家公務員法改正で、各府省が退職者の再就職をあっせんすることが禁止された。"},{"t":"mc","s":"行政国家と官僚制","imp":3,"q":"行政指導についての記述として最も適当なものを一つ選べ。","c":["行政指導は法律に基づく命令であり、従わない企業には刑罰が科される。","行政指導は国会の議決を経て行われるため、その内容は必ず官報で公示される。","行政指導は法的な強制力をもたず、相手方の任意の協力によって実現されるもので、従わないことを理由とする不利益な取扱いは禁じられている。","行政指導は行政手続法の対象外であり、口頭で行われた場合に書面の交付を求めることはできない。"],"a":2,"e":"行政指導は、行政機関が法的強制力のない助言・勧告・指導によって企業などに一定の行為を求めるものである。不透明になりやすいため、行政手続法は、相手方の任意の協力によってのみ実現されることや、従わないことを理由とした不利益な取扱いの禁止を定めた。強制力や刑罰はなく、国会の議決も不要である。行政手続法の対象であり、口頭で行われた場合も相手方は書面の交付を求めることができる。"},{"t":"tf","s":"行政国家と官僚制","imp":1,"q":"行政機関は、許認可権や補助金の交付を通じて企業などの経済活動に大きな影響を与えており、これが官庁と業界の癒着の一因とされてきた。","a":true,"e":"正しい。許認可とは、企業の事業などを行政機関が許可・認可することである。行政の関与を減らす規制緩和が、行政改革の課題とされてきた。"},{"t":"qa","s":"行政改革","imp":1,"q":"1981年に発足し、「増税なき財政再建」を掲げて行政改革の方針を答申した審議会を何というか。","a":"第二次臨時行政調査会","alt":["第二臨調","第2次臨時行政調査会"],"e":"会長は経団連の元会長の土光敏夫。その答申を受けて、中曽根内閣のもとで三公社（電電公社・専売公社・国鉄）の民営化が行われた。"},{"t":"mc","s":"行政改革","imp":2,"q":"1980年代の三公社の民営化について述べた文として最も適当なものを一つ選べ。","c":["小泉内閣のもとで、日本電信電話公社・日本専売公社・日本国有鉄道が一括して民営化された。","中曽根内閣のもとで、日本電信電話公社がNTTに、日本専売公社がJTに、日本国有鉄道がJRに民営化された。","三公社の民営化は、2001年の中央省庁再編と同時に行われた。","日本国有鉄道は、民営化後も国が全額出資する1つの法人として全国の鉄道を運営している。"],"a":1,"e":"三公社の民営化は第二次臨時行政調査会の答申を受けて中曽根内閣が進め、1985年に電電公社と専売公社、1987年に国鉄が民営化された。小泉内閣が進めたのは郵政民営化であり、時期も2001年の中央省庁再編とは異なる。国鉄は分割民営化され、JR東日本・JR西日本など複数の会社になった。"},{"t":"tf","s":"行政改革","imp":2,"q":"小泉内閣は、郵政民営化法案が参議院で否決されると衆議院を解散し、総選挙で圧勝した後に法案を成立させた。","a":true,"e":"正しい。2005年のいわゆる郵政解散である。郵政民営化により、2007年に郵便・郵便貯金・簡易保険の事業は日本郵政グループの民間会社に引き継がれた。"},{"t":"mc","s":"行政改革","imp":3,"q":"2001年の中央省庁再編についての記述として最も適当なものを一つ選べ。","c":["1府12省庁が1府22省庁に再編され、行政の専門分化が進められた。","中央省庁再編と同時に、防衛庁が防衛省に移行し、消費者庁が新設された。","1府22省庁が1府12省庁に再編され、内閣機能を強化するため内閣府が設置された。","中央省庁再編により、各省の大臣は国会議員以外から選ばなければならなくなった。"],"a":2,"e":"2001年の再編で1府22省庁が1府12省庁となり、内閣府の設置や副大臣・大臣政務官の導入で内閣機能の強化と政治主導がはかられた。数を逆にした記述は誤り。防衛省への移行は2007年、消費者庁の設置は2009年である。国務大臣は過半数が国会議員でなければならず（憲法68条）、国会議員以外から選ぶ義務もない。"},{"t":"ex","s":"行政改革","imp":1,"q":"独立行政法人とはどのような組織で、何を目的として導入されたかを説明せよ。","a":"独立行政法人は、国が直接行う必要はないが民間に任せると実施されないおそれのある事業を、国から独立した法人に担わせるしくみで、2001年から導入された。国立美術館や造幣局などがその例である。行政のスリム化と、法人に運営の裁量を与えることによる効率的なサービスの提供を目的とする。","e":"ポイント：①国が直接行う必要はないが民間では実施されないおそれのある事業 ②国から独立した法人に担わせる ③2001年から導入（例：国立美術館・造幣局） ④行政のスリム化と効率化"},{"t":"qa","s":"行政改革","imp":3,"q":"行政機関の保有する文書の開示を請求する権利を定め、1999年に制定（2001年施行）された法律を何というか。","a":"情報公開法","alt":["行政機関情報公開法","行政機関の保有する情報の公開に関する法律"],"e":"開示請求は外国人も含めて誰でもできる。目的として政府の説明責任（アカウンタビリティ）は明記されたが、「知る権利」は明記されなかった。"},{"t":"tf","s":"行政改革","imp":3,"q":"情報公開法には、国民の「知る権利」を保障することが目的として明記されている。","a":false,"e":"誤り。正しくは、情報公開法は国民主権の理念にのっとり、政府の説明責任（アカウンタビリティ）を全うすることを目的としているが、「知る権利」という言葉は明記されていない。"}]});</script>
<script>QDATA.push({"unit":"u11","questions":[{"t":"qa","s":"行政改革","imp":2,"q":"行政機関が政令や省令などを定める際に、事前に案を公表して広く国民から意見を募る手続を何というか。","a":"パブリックコメント","alt":["意見公募手続","パブリックコメント制度"],"e":"2005年の行政手続法改正で「意見公募手続」として法制化された。行政手続法は1993年に制定され、許認可や行政指導の手続を明確にして、行政運営の公正さと透明性を高めることを目的とする。"},{"t":"mc","s":"行政改革","imp":1,"q":"次の事例のうち、パブリックコメント（意見公募手続）にあたるものとして最も適当なものを一つ選べ。","c":["ある市の住民が、有権者の50分の1以上の署名を集めて条例の制定を請求した。","ある省が新しい省令の案をウェブサイトで公表し、一定期間、広く国民から意見を募集した。","ある県の住民が、知事による公金の支出について監査委員に監査を請求した。","新聞社が内閣の支持率について世論調査を行い、その結果を報道した。"],"a":1,"e":"パブリックコメントは、行政機関が命令などの案を公表して国民の意見を募る手続で、行政手続法に定められている。条例の制定請求は地方自治法の直接請求、監査委員への請求は住民監査請求、新聞社の世論調査は報道機関の活動であり、いずれもパブリックコメントではない。"},{"t":"mc","s":"行政改革","imp":1,"q":"行政の透明化や公務員の規律に関する法律・機関の説明として適当でないものを一つ選べ。","c":["行政手続法は、許認可や行政指導の手続を明確にし、行政運営の公正さと透明性を高めるための法律である。","国家公務員倫理法は、大蔵省の接待汚職事件などをきっかけに制定され、利害関係者からの接待や贈与を規制している。","内閣人事局は、国家公務員の給与の改定について国会と内閣に勧告する独立の行政委員会である。","公益通報者保護法は、企業などの法令違反を内部告発した労働者を、解雇などの不利益な取扱いから保護する法律である。"],"a":2,"e":"国家公務員の給与について国会と内閣に勧告するのは人事院（人事院勧告）である。内閣人事局は2014年に内閣官房に設置され、各府省の幹部職員の人事を一元的に管理する機関である。国家公務員倫理法（1999年制定）、公益通報者保護法（2004年制定）、行政手続法の説明は正しい。"},{"t":"ex","s":"行政改革","imp":1,"q":"2014年に内閣人事局が設置されたことの意義と、指摘されている問題点を説明せよ。","a":"内閣人事局は内閣官房に置かれ、各府省の幹部職員の人事を首相や官房長官のもとで一元的に管理する。これにより、省益にとらわれた縦割り行政を改め、政治主導で政策を進めやすくなった。一方、人事権を握る首相官邸の意向を官僚が過度にくみ取る「忖度」が生じ、行政の中立性がゆがめられるおそれが指摘されている。","e":"ポイント：①内閣官房に設置、幹部職員の人事を一元管理 ②縦割り行政の是正・政治主導 ③官僚の忖度、行政の中立性への懸念"},{"t":"tf","s":"行政改革","imp":1,"q":"日本では国の制度として、国会が任命するオンブズマン（行政監察官）が置かれ、国民からの苦情を受けて各省庁を調査している。","a":false,"e":"誤り。正しくは、国レベルのオンブズマン制度は日本では導入されていない。地方では1990年の川崎市をはじめ、条例でオンブズマン制度を設けている地方公共団体がある。国では総務省の行政相談などが苦情処理の役割を担っている。"},{"t":"qa","s":"行政委員会","imp":3,"q":"政治的な中立性や専門性が求められる分野で、一般の行政機関から独立して職権を行使する合議制の機関を何というか。","a":"行政委員会","e":"第二次世界大戦後、アメリカの独立規制委員会にならって導入された。国では公正取引委員会・国家公安委員会・中央労働委員会など、地方では教育委員会・選挙管理委員会などがある。"},{"t":"ex","s":"行政委員会","imp":2,"q":"行政委員会が一般の行政機関から独立して設けられている理由と、その機能を説明せよ。","a":"行政委員会は、警察・労働争議・独占禁止などのように政治的な中立性や高度な専門性が求められる分野で、内閣や首長の指揮命令から独立して公正に職権を行うために設けられている。法律に基づいて規則を定める準立法的機能や、争いについて裁決・審判などを行う準司法的機能をもつ。","e":"ポイント：①政治的中立性・専門性が必要な分野 ②内閣・首長から独立した合議制の機関 ③準立法的機能（規則の制定） ④準司法的機能（裁決・審判）"},{"t":"mc","s":"行政委員会","imp":3,"q":"次の事例のうち、行政委員会の準司法的機能の例として最も適当なものを一つ選べ。","c":["内閣が閣議決定によって、来年度の予算案を国会に提出した。","国会が委員会での審議を経て、新しい法律を制定した。","裁判所が刑事事件の被告人に有罪の判決を言い渡した。","労働組合に加入したことを理由に解雇された労働者の申し立てを受け、労働委員会が審査して救済命令を出した。"],"a":3,"e":"労働委員会が不当労働行為について審査し救済命令を出すのは、行政機関が裁判に似た手続で争いを裁く準司法的機能の例である。予算案の提出は内閣の権限、法律の制定は国会の立法権、有罪判決は裁判所の司法権の行使であり、行政委員会の機能ではない。"},{"t":"mc","s":"行政委員会","imp":3,"q":"国の行政委員会とその役割の組合せとして適当でないものを一つ選べ。","c":["公正取引委員会 ― 独占禁止法の運用","中央労働委員会 ― 労働争議の調整や不当労働行為の救済","国家公安委員会 ― 警察庁の管理","原子力規制委員会 ― 原子力発電の推進と原子力産業の育成"],"a":3,"e":"原子力規制委員会は、原子力発電所の安全規制を担う機関であり、推進や育成を担うのではない。他の3つは正しい組合せである。公正取引委員会は独占禁止法を運用し、中央労働委員会は労働争議の調整（あっせん・調停・仲裁）や不当労働行為の救済を行い、国家公安委員会は警察庁を管理する。"},{"t":"qa","s":"行政委員会","imp":1,"q":"2011年の福島第一原子力発電所の事故を受けて、2012年に環境省の外局として設置された行政委員会を何というか。","a":"原子力規制委員会","e":"原子力の推進を担う経済産業省から規制部門を切り離し、独立性の高い機関に原子力の規制を一元化した。原子力発電所が新規制基準に適合しているかの審査などを行う。"},{"t":"qa","s":"新しい行政組織","imp":2,"q":"2021年に発足した、国や地方の行政のデジタル化を進める司令塔となる官庁を何というか。","a":"デジタル庁","e":"内閣に直接置かれ、首相がその長を務める。マイナンバー制度の推進なども担当する。"},{"t":"mc","s":"新しい行政組織","imp":2,"q":"新しい行政組織とその設置年・目的の組合せとして最も適当なものを一つ選べ。","c":["こども家庭庁 ― 2001年 ― 中央省庁再編の際に少子化対策を担うため設置","消費者庁 ― 2009年 ― 各省庁に分かれていた消費者行政を一元化するため設置","復興庁 ― 1995年 ― 阪神・淡路大震災からの復興を担うため設置","デジタル庁 ― 2012年 ― 東日本大震災の被災地のデジタル化を進めるため設置"],"a":1,"e":"消費者庁は2009年に内閣府の外局として設置された。こども家庭庁は2023年に内閣府の外局として発足し、こども政策の司令塔を担う。復興庁は東日本大震災からの復興のため2012年に設置された。デジタル庁は2021年に発足した行政のデジタル化の司令塔である。"},{"t":"ex","s":"新しい行政組織","imp":1,"q":"こども家庭庁が設置された背景とねらいを説明せよ。","a":"少子化の進行や児童虐待、子どもの貧困などの課題に対し、内閣府や厚生労働省などに分かれていた子どもに関する政策の縦割りを解消するため、2023年にこども家庭庁が内閣府の外局として発足した。同年施行のこども基本法とともに、子どもの権利を守り、子どもの視点に立った政策を一元的に進めることがねらいである。","e":"ポイント：①少子化・児童虐待・子どもの貧困などの課題 ②縦割り行政の解消 ③2023年発足、内閣府の外局 ④こども基本法とともに子ども中心の政策を推進"}]});</script>
<script>QDATA.push({"unit":"u12","questions":[{"t":"qa","s":"主権国家体制","imp":3,"q":"三十年戦争を終結させ、ヨーロッパで主権国家どうしが対等に並び立つ国際社会（主権国家体制）が成立するきっかけとなった1648年の講和条約を何というか。","a":"ウェストファリア条約","alt":["ウエストファリア条約","ヴェストファーレン条約","ウェストファリア講和条約"],"e":"神聖ローマ帝国内の諸領邦にほぼ完全な主権が認められ、皇帝や教皇のような上位の権威に従わない主権国家を単位とする国際秩序（ウェストファリア体制）が生まれた。多くの国が参加した近代最初の国際会議とされる。"},{"t":"ex","s":"主権国家体制","imp":2,"q":"主権国家体制とはどのような国際社会のあり方か。主権平等の原則と内政不干渉の原則にふれて説明せよ。","a":"主権国家体制とは、領域・国民・主権をもつ国家が国際社会の基本的な単位となり、互いに対等な立場で並び立つ体制である。国の大小にかかわらず各国は平等な主権をもち（主権平等の原則）、他国の国内問題に干渉してはならない（内政不干渉の原則）。国家の上に立つ世界政府は存在しない。","e":"ポイント：①ウェストファリア条約（1648年）以降に成立 ②国家の三要素（領域・国民・主権） ③主権平等の原則と内政不干渉の原則 ④国家の上位に立つ統一的な権力（世界政府）がない"},{"t":"tf","s":"主権国家体制","imp":2,"q":"主権国家体制のもとでは、各国の上に立って法を強制する世界政府が存在し、国家間の紛争は最終的にその裁判によって解決される。","a":false,"e":"誤り。正しくは、主権国家の上に立つ世界政府は存在しない。そのため国際社会には国内のような統一的な立法・行政・司法の機関がなく、紛争の解決は当事国どうしの合意や国際機構の働きに頼らざるをえない。"},{"t":"qa","s":"国際法","imp":3,"q":"三十年戦争の惨禍を背景に『戦争と平和の法』を著し、国家間にも守るべき法があると説いて「国際法の父」と呼ばれるオランダの法学者は誰か。","a":"グロティウス","alt":["グロチウス","フーゴー・グロティウス","グローティウス"],"e":"1625年に『戦争と平和の法』を著し、自然法の立場から戦争の開始や戦争中の行為にもルールがあると説いた（「自然法の父」とも呼ばれる）。『海洋自由論』で公海自由の原則の基礎を示したことも押さえておく。"},{"t":"qa","s":"国際法","imp":3,"q":"国家間で同じ行為がくり返され、それが法として守るべきものだと広く認められるようになって成立した、文書になっていない国際法を何というか。","a":"国際慣習法","alt":["慣習国際法"],"e":"国際法は、文書による合意である条約（成文国際法）と、文書になっていない国際慣習法（不文国際法）に大別される。国際慣習法は原則としてすべての国家を拘束し、公海自由の原則や内政不干渉の原則がその例である。外交官の特権のように、後に条約として成文化されたものもある。"},{"t":"mc","s":"国際法","imp":2,"q":"国際法についての記述として最も適当なものを一つ選べ。","c":["国際慣習法は文書化されていないため、国家を法的に拘束する力をもたない。","条約は、それに参加していない国も含め、すべての国家を法的に拘束する。","公海自由の原則は、国家間の慣行を通じて国際慣習法として確立した。","国際慣習法が条約として成文化されることはない。"],"a":2,"e":"公海自由の原則は、グロティウスの主張などを背景に国家間の慣行として確立した国際慣習法であり、のちに公海条約や国連海洋法条約で成文化された。国際慣習法は不文法だが国家を拘束するので、『拘束する力をもたない』は誤り。条約が拘束するのは締約国だけなので、『すべての国家』は誤り。外交官の特権が1961年の外交関係に関するウィーン条約で成文化されたように、国際慣習法が条約になる例は多いので、『成文化されることはない』も誤り。"},{"t":"ex","s":"国際法","imp":3,"q":"国際法には国内法と比べてどのような限界があるか。説明せよ。","a":"国際社会には、国内の議会・政府・裁判所にあたる統一的な立法・行政・司法の機関がない。そのため、法をつくるのも守らせるのも主権国家どうしの合意に頼ることになり、違反した国を強制的に従わせる手段が弱い。国際裁判も、原則として紛争当事国の同意がなければ開くことができない。","e":"ポイント：①統一的な立法機関がない ②違反を取り締まる強制的な執行機関が弱い ③国際裁判には当事国の同意が必要 ④最終的には国家間の合意に依存する"},{"t":"tf","s":"国際法","imp":1,"q":"国際法は、平時の国家関係を定める平時国際法と、戦争の開始や戦争中のルールを定める戦時国際法に分類されることがある。","a":true,"e":"正しい。戦時国際法には、捕虜・傷病兵・文民の保護などを定めたジュネーブ条約（1949年）などがある。今日では、武力紛争の際に人道を守るためのルールを国際人道法とも呼ぶ。"},{"t":"qa","s":"国家の領域","imp":3,"q":"国連海洋法条約で定められた領海の幅は、基線（海岸の低潮線など）から何海里までか。","a":"12海里","alt":["12","十二海里","１２海里"],"e":"1海里は1852mである。領海には沿岸国の主権が及ぶが、外国の船舶も沿岸国の平和・秩序・安全を害さない限り通航できる（無害通航権）。領土・領海・領空をあわせて国家の領域という。"},{"t":"qa","s":"国家の領域","imp":3,"q":"沿岸国が、漁業資源や海底の鉱物資源などの探査・開発について主権的権利をもつ、基線から200海里までの水域（領海を除く）を何というか。","a":"排他的経済水域","alt":["EEZ","経済水域"],"e":"排他的経済水域（EEZ）では、資源についての権利は沿岸国がもつが、他国の船舶の航行や航空機の上空飛行は自由である。日本は多くの離島をもつため、領海と排他的経済水域をあわせた面積は国土面積の10倍以上になる。"},{"t":"qa","s":"国家の領域","imp":2,"q":"海底の地形が陸地から自然に延びている部分で、原則として基線から200海里まで（地形の条件によってはそれ以上）沿岸国が海底資源を開発する権利をもつ区域を何というか。","a":"大陸棚","e":"大陸棚では、沿岸国が海底とその下の石油・天然ガスなどの天然資源を探査・開発する権利をもつ。地形の条件を満たせば、国連の大陸棚限界委員会の審査を経て200海里を超えて延長できる。"},{"t":"qa","s":"国家の領域","imp":2,"q":"どの国の領海や排他的経済水域にも属さない海洋は、いずれの国も領有できず、すべての国が自由に航行や漁業などに利用できるという原則を何というか。","a":"公海自由の原則","alt":["公海の自由","公海自由"],"e":"グロティウスが『海洋自由論』で唱えた考え方が国際慣習法として確立し、国連海洋法条約にも定められた。公海上の船舶は、その船の旗国（船籍のある国）の管轄に服する。"},{"t":"qa","s":"国家の領域","imp":2,"q":"領海・排他的経済水域・大陸棚など海洋に関するルールを包括的に定め、1982年に採択されて1994年に発効した条約を何というか。","a":"国連海洋法条約","alt":["海洋法に関する国際連合条約","国際連合海洋法条約","海洋法条約"],"e":"「海の憲法」とも呼ばれ、日本は1996年に批准した（アメリカは批准していない）。紛争解決のための機関として、ドイツのハンブルクに国際海洋法裁判所が設けられている。"},{"t":"ex","s":"国家の領域","imp":2,"q":"領海・接続水域・排他的経済水域の違いを、範囲と沿岸国の権利に着目して説明せよ。","a":"領海は基線から12海里までの海域で、沿岸国の主権が及ぶ。接続水域は領海の外側で基線から24海里までの海域で、沿岸国は通関・出入国管理・衛生などに関する規制ができる。排他的経済水域は領海の外側で基線から200海里までの海域で、沿岸国は水産資源や鉱物資源の探査・開発の権利をもつが、他国の船舶の航行や上空飛行は自由である。","e":"ポイント：①領海＝12海里・主権が及ぶ ②接続水域＝24海里・通関や出入国管理などの規制 ③排他的経済水域＝200海里・資源についての主権的権利 ④いずれも基線から測り、接続水域と排他的経済水域は領海ではない"},{"t":"mc","s":"国家の領域","imp":3,"q":"国家の領域についての記述として最も適当なものを一つ選べ。","c":["領空は領土と領海の上空であり、宇宙空間もそれに含まれる。","排他的経済水域では、沿岸国の許可がなければ外国の船舶は航行することができない。","領海は基線から12海里までの海域であり、沿岸国の主権が及ぶ。","接続水域は
