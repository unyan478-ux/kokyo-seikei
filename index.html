<script>QDATA.push({"unit":"u07","questions":[{"t":"qa","s":"人権の性質","imp":3,"q":"人間が生まれながらにして当然にもつ権利であり、人種・性別・身分などに関係なくすべての人に保障され、国家権力によっても侵されないとされる権利を総称して何というか。","a":"基本的人権","alt":["人権"],"e":"日本国憲法は基本的人権の固有性・不可侵性・普遍性を前提としている。明治憲法の「臣民ノ権利」が天皇から恩恵として与えられ、法律の範囲内でしか認められなかったことと対比して覚えよう。"},{"t":"qa","s":"人権の性質","imp":3,"q":"次の日本国憲法第11条の（　）に入る語を答えよ。「国民は、すべての基本的人権の享有を妨げられない。この憲法が国民に保障する基本的人権は、侵すことのできない（　）の権利として、現在及び将来の国民に与へられる。」","a":"永久","e":"11条は基本的人権の不可侵性と永久性を宣言している。「侵すことのできない永久の権利」という表現は、第10章「最高法規」の97条にも出てくる。"},{"t":"qa","s":"人権の性質","imp":2,"q":"次の日本国憲法第97条の（　）に入る語を答えよ。「この憲法が日本国民に保障する基本的人権は、人類の多年にわたる（　）の努力の成果であつて、これらの権利は、過去幾多の試錬に堪へ、現在及び将来の国民に対し、侵すことのできない永久の権利として信託されたものである。」","a":"自由獲得","e":"97条は、人権が欧米の市民革命などを通じて人類が勝ち取ってきた成果であることを示す。「信託されたもの」という表現もセットで覚えよう。"},{"t":"qa","s":"人権の性質","imp":2,"q":"次の日本国憲法第12条の（　）に入る語を答えよ。「この憲法が国民に保障する自由及び権利は、国民の（　）によつて、これを保持しなければならない。又、国民は、これを濫用してはならないのであつて、常に公共の福祉のためにこれを利用する責任を負ふ。」","a":"不断の努力","e":"人権は憲法に書かれているだけでは守られず、国民が絶えず努力して守り続ける必要があるという趣旨である。12条は権利の濫用の禁止と「公共の福祉」にも触れている。"},{"t":"ex","s":"人権の性質","imp":3,"q":"基本的人権の固有性・不可侵性・普遍性とは、それぞれどのような性質か、説明せよ。","a":"固有性とは、人権が国家や君主から与えられたものではなく、人間であることにより当然にもつ権利であるという性質である。不可侵性とは、人権が公権力によって原則として侵されないという性質である。普遍性とは、人種・性別・身分などに関係なく、すべての人が等しく享有するという性質である。","e":"ポイント：①固有性＝人間であるだけで当然にもつ（恩恵として与えられたものではない） ②不可侵性＝国家権力によっても侵されない ③普遍性＝人種・性別・身分などを問わずすべての人に保障される。"},{"t":"tf","s":"人権の性質","imp":2,"q":"明治憲法（大日本帝国憲法）においても、国民の権利は人間が生まれながらにもつ権利とされ、法律によっても制限できないものとして保障されていた。","a":false,"e":"正しくは、明治憲法の権利は天皇が恩恵として与えた「臣民ノ権利」であり、その多くは「法律ノ範囲内ニ於テ」認められるにすぎなかった（法律の留保）。そのため治安維持法などの法律によって大きく制限された。"},{"t":"ex","s":"人権の性質","imp":2,"q":"自由権・社会権・参政権の違いを、国家との関係に着目して説明せよ。","a":"自由権は、国家権力の介入を排除して個人の自由を守る権利で、「国家からの自由」と呼ばれる。社会権は、人間らしい生活の保障を国家に積極的に求める権利で、「国家による自由」と呼ばれる20世紀的権利である。参政権は、国民が政治に参加する権利で、「国家への自由」と呼ばれる。","e":"ポイント：①自由権＝国家からの自由（18〜19世紀的権利） ②社会権＝国家による自由（20世紀的権利、1919年のワイマール憲法が初めて本格的に規定） ③参政権＝国家への自由。"},{"t":"tf","s":"人権の性質","imp":1,"q":"基本的人権を「侵すことのできない永久の権利として信託されたもの」と定める日本国憲法97条は、第3章「国民の権利及び義務」ではなく、第10章「最高法規」に置かれている。","a":true,"e":"正しい。97条は最高法規の章の冒頭にあり、憲法が最高法規とされる実質的な理由（人権を保障する法であること）を示すとされる。続く98条は憲法に反する法律などの無効、99条は公務員などの憲法尊重擁護義務を定める。"},{"t":"qa","s":"個人の尊重と幸福追求権","imp":3,"q":"次の日本国憲法第13条の（　）に入る語を答えよ。「すべて国民は、（　）として尊重される。生命、自由及び幸福追求に対する国民の権利については、公共の福祉に反しない限り、立法その他の国政の上で、最大の尊重を必要とする。」","a":"個人","e":"13条前段の「個人の尊重（個人の尊厳）」は、一人ひとりをかけがえのない存在として扱うという考え方で、日本国憲法の人権保障全体の根本にある。"},{"t":"qa","s":"個人の尊重と幸福追求権","imp":3,"q":"日本国憲法第13条後段が定める「生命、自由及び幸福追求に対する国民の権利」を略して何というか。","a":"幸福追求権","e":"幸福追求権は、憲法に個別の規定がない権利を包括的に保障する根拠とされ、プライバシーの権利・自己決定権・環境権などの「新しい人権」の主な根拠となっている。"},{"t":"tf","s":"個人の尊重と幸福追求権","imp":2,"q":"プライバシーの権利や自己決定権などの新しい人権は、日本国憲法に明文の規定はないが、主に13条の幸福追求権を根拠として主張されている。","a":true,"e":"正しい。社会の変化にともなって主張されるようになった新しい人権は、主に13条の幸福追求権を根拠とする。なお、環境権は13条と25条（生存権）、知る権利は21条（表現の自由）も根拠とされる。"},{"t":"mc","s":"個人の尊重と幸福追求権","imp":2,"q":"日本国憲法第13条の内容として最も適当なものを一つ選べ。","c":["すべて国民は個人として尊重され、生命・自由・幸福追求に対する権利は、公共の福祉に反しない限り、国政の上で最大の尊重を必要とする。","すべて国民は法の下に平等であって、人種・信条・性別・社会的身分・門地により差別されない。","すべて国民は、健康で文化的な最低限度の生活を営む権利を有する。","国民は、すべての基本的人権の享有を妨げられない。"],"a":0,"e":"13条は個人の尊重と幸福追求権を定める。「法の下に平等」は14条、「健康で文化的な最低限度の生活」は25条（生存権）、「すべての基本的人権の享有を妨げられない」は11条の内容なので、いずれも13条ではない。"},{"t":"qa","s":"公共の福祉","imp":3,"q":"日本国憲法において、人権どうしの矛盾や衝突を調整するために人権を制約する根拠とされる原理を何というか。","a":"公共の福祉","e":"憲法は12条・13条で人権全般について、22条（居住・移転・職業選択の自由）と29条（財産権）で経済の自由について「公共の福祉」に言及している。国家や多数者の利益のために個人を犠牲にしてよいという意味ではない点に注意。"},{"t":"tf","s":"公共の福祉","imp":2,"q":"日本国憲法は、表現の自由を定める21条の中で、表現の自由は公共の福祉に反しない限り保障されると明記している。","a":false,"e":"正しくは、21条に「公共の福祉」の文言はない。個別の人権の条文で公共の福祉を明記しているのは、22条（居住・移転・職業選択の自由）と29条（財産権）という経済の自由の規定である（12条・13条は人権全般についての規定）。"},{"t":"tf","s":"公共の福祉","imp":2,"q":"公共の福祉とは、社会の多数者の利益になるのであれば、少数者の人権をいつでも制限できるという原理である。","a":false,"e":"正しくは、公共の福祉は人権と人権が衝突する場面でそれらを調整する原理（実質的公平の原理）である。多数者の利益を理由に少数者の人権を自由に制限できるという意味ではなく、人権の制約は必要最小限でなければならない。"},{"t":"ex","s":"公共の福祉","imp":3,"q":"公共の福祉による人権の制約について、精神の自由と経済の自由とではどのような違いがあるか、説明せよ。","a":"公共の福祉は人権どうしの衝突を調整する原理であり、すべての人権に内在する制約である。経済の自由は、これに加えて社会的・経済的弱者の保護など福祉国家の理念を実現するための政策的な制約も受けるため、より広く制約されうる。一方、精神の自由を制約する法律は厳しく審査すべきだとされる。","e":"ポイント：①公共の福祉＝人権相互の矛盾・衝突の調整 ②経済の自由には政策的制約もある（22条・29条に公共の福祉を明記） ③精神の自由の規制は厳格に審査（二重の基準）。"},{"t":"mc","s":"公共の福祉","imp":2,"q":"人権に対する制約のうち、社会的・経済的弱者を守るために経済の自由に加えられる政策的な制約の例として最も適当なものを一つ選べ。","c":["中小の小売商を過当競争から保護するため、小売市場の開設を許可制にして既存の市場との距離制限を設ける。","他人の名誉を傷つける記事を書いた出版社に、名誉毀損として損害賠償を命じる。","住民の安眠を守るため、深夜に拡声器を使った街頭演説を条例で制限する。","感染症のまん延を防ぐため、感染した患者に入院を勧告する。"],"a":0,"e":"小売市場の距離制限は、経済的弱者である小売商を保護する積極的な政策目的の規制であり、最高裁（1972年）も合憲とした。名誉毀損への損害賠償や深夜の拡声器の制限は、表現の自由と他人の権利（名誉・生活の平穏）との衝突の調整であり、感染症患者への入院勧告は社会の安全を守るための制約であって、いずれも経済的弱者保護のための政策的制約ではない。"},{"t":"qa","s":"公共の福祉","imp":1,"q":"精神の自由を規制する法律は、経済の自由を規制する法律よりも厳格な基準で違憲かどうかを審査すべきだとする考え方を何というか。","a":"二重の基準","alt":["二重の基準論","二重の基準理論"],"e":"精神の自由は民主政治の過程を支える重要な権利であり、いったん侵害されると選挙などの政治過程で回復しにくいため、厳しく審査すべきだとされる。経済の自由の規制は政策判断を伴うため、立法府の判断が比較的尊重される。"},{"t":"qa","s":"人権の私人間効力","imp":3,"q":"大学卒業後に採用された人が、在学中の学生運動歴を申告しなかったことを理由に試用期間終了時に本採用を拒否され、憲法の思想・良心の自由などが私人間にも適用されるかが争われた事件を何というか。","a":"三菱樹脂事件","alt":["三菱樹脂訴訟"],"e":"最高裁（1973年）は、憲法19条・14条は国家と個人の関係を規律するもので私人間には直接適用されないとし、企業には雇い入れの自由があるとして本採用拒否を当然に違法とはしなかった。その後、和解が成立し原告は復職した。"},{"t":"ex","s":"人権の私人間効力","imp":3,"q":"人権規定の私人間効力に関する間接適用説とはどのような考え方か、説明せよ。","a":"憲法の人権規定は本来、国家権力と国民との関係を規律するものなので、私人どうしの関係には直接適用しない。そのかわり、民法90条の公序良俗のような私法の一般条項を解釈・適用する際に憲法の趣旨を取り込み、間接的に人権を保障するという考え方である。判例・通説はこの立場をとっている。","e":"ポイント：①人権規定は本来、国家に向けられたもの ②私人間には直接適用しない ③民法90条（公序良俗）など私法の一般条項を通じて間接的に適用 ④三菱樹脂事件の最高裁判決もこの立場。"},{"t":"tf","s":"人権の私人間効力","imp":3,"q":"三菱樹脂事件で最高裁判所は、思想・信条を理由とする本採用拒否は憲法19条に直接違反するため無効であると判断した。","a":false,"e":"正しくは、最高裁は憲法19条・14条は私人間に直接適用されないとし、企業の雇い入れの自由を重視して、思想・信条を理由に採用を拒んでも当然に違法とはいえないとした（事件は高裁に差し戻され、のちに和解）。"},{"t":"mc","s":"人権の私人間効力","imp":2,"q":"憲法の人権規定が、私法の一般条項を通じて私人間に間接的に適用された例として最も適当なものを一つ選べ。","c":["企業が就業規則で女性の定年年齢を男性より低く定めていたことについて、最高裁判所が民法90条の公序良俗に反し無効とした。","刑法の尊属殺重罰規定について、最高裁判所が法の下の平等に反し違憲とした。","県が神社に玉串料を公金から支出したことについて、最高裁判所が政教分離原則に反し違憲とした。","在外国民に最高裁判所裁判官の国民審査を認めていなかった法律について、最高裁判所が違憲とした。"],"a":0,"e":"男女別定年制をめぐる日産自動車事件（1981年）で最高裁は、性別のみによる不合理な差別として民法90条により無効とし、憲法14条の趣旨を私人間に間接的に及ぼした。尊属殺重罰規定・玉串料の支出・国民審査法はいずれも国や地方公共団体の行為であり、憲法が直接適用される場面なので誤り。"},{"t":"qa","s":"人権の私人間効力","imp":1,"q":"憲法の人権規定を私人間に間接適用する際に用いられる、「公の秩序又は善良の風俗に反する法律行為は、無効とする」と定める民法の条文は第何条か。","a":"第90条","alt":["90条","民法90条","民法第90条","90"],"e":"民法90条は公序良俗違反の法律行為を無効とする規定である。私人間の契約や就業規則が人権を不当に侵害する場合、この条文の解釈に憲法の趣旨を取り込んで無効とする。"}]});</script>
<script>QDATA.push({"unit":"u07","questions":[{"t":"qa","s":"法の下の平等","imp":3,"q":"次の日本国憲法第14条1項の（　）に入る語を答えよ。「すべて国民は、法の下に平等であつて、人種、信条、性別、（　）又は門地により、政治的、経済的又は社会的関係において、差別されない。」","a":"社会的身分","e":"14条1項は差別禁止事由として人種・信条・性別・社会的身分・門地（家柄）の5つを挙げる。14条2項は華族などの貴族制度の否認、3項は栄典の授与に特権が伴わないことを定める。"},{"t":"qa","s":"法の下の平等","imp":2,"q":"日本国憲法第14条2項が「これを認めない」と定めて廃止した、明治憲法下の特権的な身分制度を何というか。","a":"華族制度","alt":["華族","貴族制度"],"e":"14条2項は「華族その他の貴族の制度は、これを認めない」と定める。明治憲法下では華族が貴族院議員になるなどの特権をもっていた。"},{"t":"qa","s":"法の下の平等","imp":3,"q":"次の日本国憲法第24条1項の（　）に入る語を答えよ。「婚姻は、（　）の合意のみに基いて成立し、夫婦が同等の権利を有することを基本として、相互の協力により、維持されなければならない。」","a":"両性","e":"24条2項は、家族に関する法律は「個人の尊厳と両性の本質的平等」に立脚して制定されなければならないと定める。これを受けて民法が改正され、戸主に強い権限を認めた家制度は廃止された。"},{"t":"qa","s":"法の下の平等","imp":2,"q":"次の日本国憲法第44条の（　）に入る語を答えよ。「両議院の議員及びその選挙人の資格は、法律でこれを定める。但し、人種、信条、性別、社会的身分、門地、（　）、財産又は収入によつて差別してはならない。」","a":"教育","e":"44条は14条の5つの事由に教育・財産・収入を加えている。戦前の一定額以上の納税者だけに選挙権を認めた制限選挙のような差別を禁じ、普通選挙を保障する規定である。"},{"t":"tf","s":"法の下の平等","imp":2,"q":"日本国憲法24条は婚姻が両性の合意のみに基づいて成立することなどを定めており、これを受けて1947年に民法が大幅に改正され、戸主に強い権限を認めた家制度が廃止された。","a":true,"e":"正しい。明治民法では、結婚に戸主の同意が必要であるなど、戸主が家族に強い権限をもつ家制度がとられていた。日本国憲法24条にもとづく1947年の民法改正でこれが廃止された。"},{"t":"ex","s":"法の下の平等","imp":3,"q":"形式的平等と実質的平等の違いを説明せよ。","a":"形式的平等とは、すべての人を法律上等しく扱い、機会の平等を保障することである。実質的平等とは、現実に存在する経済的・社会的な格差を是正して、結果の平等にも配慮することである。日本国憲法は形式的平等を基本としつつ、社会権の保障などを通じて実質的平等の実現もめざしている。","e":"ポイント：①形式的平等＝機会の平等・法律上の一律の取扱い ②実質的平等＝現実の格差の是正・結果の平等への配慮 ③社会権やアファーマティブ・アクションは実質的平等をめざすもの。"},{"t":"qa","s":"法の下の平等","imp":2,"q":"歴史的に差別されてきた人々や少数者に対して、進学や雇用などで一定の優遇措置をとり、実質的な平等を実現しようとする措置を何というか。","a":"アファーマティブ・アクション","alt":["積極的差別是正措置","積極的格差是正措置","ポジティブ・アクション"],"e":"アメリカの大学入試における人種への配慮などが代表例である。日本では男女の格差是正のための措置をポジティブ・アクションと呼ぶことが多い。行き過ぎると逆差別になるという批判もある。"},{"t":"tf","s":"法の下の平等","imp":2,"q":"法の下の平等は、すべての人をいかなる場合も全く同じに扱うことを求めるものであり、年齢や所得などによって法律上の扱いを区別することは一切許されない。","a":false,"e":"正しくは、合理的な理由のある区別は許される（相対的平等）。例えば、選挙権を18歳以上とすることや、所得が多い人ほど高い税率を課す累進課税は、不合理な差別にはあたらない。禁止されるのは合理的な理由のない差別である。"},{"t":"qa","s":"平等権をめぐる判例","imp":3,"q":"1973年に最高裁判所が、父母などの直系尊属を殺した場合の刑罰を死刑または無期懲役に限っていた刑法の規定を、法の下の平等に反するとして違憲とした判決を何というか。","a":"尊属殺重罰規定違憲判決","alt":["尊属殺人重罰規定違憲判決","尊属殺重罰規定違憲訴訟","尊属殺違憲判決","尊属殺人罪違憲判決"],"e":"最高裁判所による初めての法令違憲判決である。違憲とされた刑法200条は、その後も長く条文として残っていたが、1995年の刑法改正で削除された。"},{"t":"tf","s":"平等権をめぐる判例","imp":2,"q":"尊属殺重罰規定違憲判決で最高裁判所は、尊属への尊重報恩という立法目的自体は合理的だとしつつ、法定刑を死刑または無期懲役に限るのは重すぎて不合理な差別にあたるとして違憲とした。","a":true,"e":"正しい。最高裁は、尊属殺を普通殺人より重く処罰すること自体はただちに違憲ではないとしたうえで、刑の加重の程度が極端で、目的を達成する手段として著しく均衡を失していることを違憲の理由とした。"},{"t":"qa","s":"平等権をめぐる判例","imp":3,"q":"日本人の父と外国人の母の間に生まれ、出生後に父から認知された子について、父母が結婚していないことを理由に日本国籍の取得を認めなかった国籍法の規定を、最高裁判所が法の下の平等に反し違憲とした判決は何年か。","a":"2008年","alt":["平成20年","2008"],"e":"国籍法違憲判決である。判決を受けて同年に国籍法が改正され、父母の婚姻という要件が削除された。生まれた後の親の結婚という子ども自身にはどうにもできない事情で差別することは不合理だとされた。"},{"t":"tf","s":"平等権をめぐる判例","imp":2,"q":"国籍法違憲判決を受けて国籍法が改正され、日本人の父から出生後に認知された子は、父母が結婚していなくても届出によって日本国籍を取得できるようになった。","a":true,"e":"正しい。改正前の国籍法3条1項は、出生後の認知に加えて父母の婚姻（準正）を国籍取得の要件としていた。2008年の改正でこの婚姻要件が削除された。"},{"t":"qa","s":"平等権をめぐる判例","imp":3,"q":"2013年に最高裁判所が違憲と判断するまで、民法の規定では、結婚していない男女の間に生まれた子（婚外子）の法定相続分は、結婚した夫婦の間に生まれた子の何分の何とされていたか。","a":"2分の1","alt":["二分の一","1/2","半分"],"e":"最高裁大法廷は2013年の決定で、家族のあり方の多様化などを理由にこの規定を法の下の平等に反するとし、同年の民法改正で相続分は同等になった。父母が結婚していたかどうかは子どもが選べない事情である。"},{"t":"tf","s":"平等権をめぐる判例","imp":2,"q":"婚外子の法定相続分を婚内子の2分の1とする民法の規定は、1995年に最高裁判所が違憲と判断したことを受けて改正された。","a":false,"e":"正しくは、最高裁は1995年にはこの規定を合憲としていた。2013年の決定で判断を変更して違憲とし、同年の民法改正で婚外子の相続分が婚内子と同等になった。"},{"t":"mc","s":"平等権をめぐる判例","imp":3,"q":"女性の再婚禁止期間に関する記述として最も適当なものを一つ選べ。","c":["最高裁判所は2015年、6か月の再婚禁止期間のうち100日を超える部分を違憲と判断し、その後の法改正を経て、再婚禁止期間は2024年に廃止された。","最高裁判所は2015年、再婚禁止期間の規定全体を違憲と判断し、翌年の法改正で再婚禁止期間は直ちに廃止された。","最高裁判所は2015年、6か月の再婚禁止期間は父子関係の混乱を防ぐための合理的な規定であるとして合憲と判断した。","再婚禁止期間は男女ともに6か月とされていたが、最高裁判所の違憲判決を受けて男女ともに100日に短縮された。"],"a":0,"e":"2015年の判決は、100日を超える部分のみを14条1項・24条2項に反するとした。2016年の民法改正で100日に短縮され、さらに2022年の民法改正（2024年4月施行）で、嫡出推定の見直しとあわせて再婚禁止期間は廃止された。規定全体を違憲としたわけではなく、合憲とした判決でもない。また、再婚禁止期間は女性だけに課されていた。"},{"t":"ex","s":"平等権をめぐる判例","imp":1,"q":"2015年に最高裁判所が、女性の再婚禁止期間（6か月）のうち100日を超える部分を違憲とした理由を説明せよ。","a":"再婚禁止期間は、離婚後に生まれた子の父が前の夫か再婚相手かという推定が重なり、父子関係が混乱するのを防ぐためのものである。当時の民法の規定では、推定の重複を避けるには100日の禁止で足りたため、それを超える部分は女性の婚姻の自由を過剰に制約し、14条1項と24条2項に反するとされた。","e":"ポイント：①目的＝父性の推定の重複を防ぐ ②100日あれば推定の重複は避けられる ③100日を超える部分は必要以上の制約 ④14条1項（法の下の平等）・24条2項（両性の本質的平等）に違反。"},{"t":"tf","s":"平等権をめぐる判例","imp":3,"q":"最高裁判所は、夫婦が婚姻の際に夫または妻の氏を称すると定める民法の夫婦同氏規定について、法の下の平等に反するとして違憲と判断した。","a":false,"e":"正しくは、最高裁は2015年と2021年に夫婦同氏規定を合憲と判断している。規定自体は夫と妻のどちらの氏を選んでもよい形式で性別による差別を定めていないこと、夫婦の氏に関する制度のあり方は国会で議論し判断すべき事柄であることを理由とした。ただし現実には9割以上の夫婦が夫の氏を選んでいる。"},{"t":"qa","s":"平等権をめぐる判例","imp":2,"q":"夫婦が望む場合には、結婚後もそれぞれが結婚前の氏を名乗り続けることを認める制度を何というか。","a":"選択的夫婦別姓制度","alt":["選択的夫婦別姓","選択的夫婦別氏制度","選択的夫婦別氏"],"e":"法制審議会は1996年にこの制度の導入を答申したが、導入の是非をめぐって議論が続いてきた。最高裁は夫婦同氏規定を合憲としたうえで、制度のあり方は国会で議論すべきだとしている。"},{"t":"qa","s":"平等権をめぐる判例","imp":2,"q":"2023年に最高裁判所大法廷が、戸籍上の性別を変更するための要件のうち「生殖腺がないこと又は生殖腺の機能を永続的に欠く状態にあること」（生殖不能要件）を違憲と判断した法律を何というか。","a":"性同一性障害特例法","alt":["性同一性障害者の性別の取扱いの特例に関する法律","性同一性障害者特例法"],"e":"最高裁は、この要件は手術を受けるか性別変更をあきらめるかという過酷な二者択一を迫るものであり、13条が保障する「自己の意思に反して身体への侵襲を受けない自由」を制約するとして違憲とした。14条ではなく13条違反である点に注意。"},{"t":"qa","s":"平等権をめぐる判例","imp":3,"q":"障害などを理由に本人の同意なしに不妊手術を行うことを認めていた法律について、最高裁判所大法廷が2024年に、その規定は憲法13条・14条1項に違反するとして国に賠償を命じた。この法律を何というか。","a":"旧優生保護法","alt":["優生保護法"],"e":"旧優生保護法は1948年に制定され、1996年に優生思想にもとづく規定を削除して母体保護法に改められた。最高裁は、不法行為から20年で請求権が消滅する除斥期間を理由に国が賠償責任を免れることは、信義則に反し権利の濫用として許されないとした。同年、被害者に補償金を支給する法律が制定された。"},{"t":"mc","s":"平等権をめぐる判例","imp":2,"q":"旧優生保護法に関する記述として最も適当なものを一つ選べ。","c":["最高裁判所は2024年、不妊手術を強制した規定は憲法13条・14条1項に違反するとし、除斥期間を理由に国が賠償責任を免れることは許されないとした。","旧優生保護法は、障害を理由とする不妊手術を、本人が同意した場合に限って認めていた。","最高裁判所は2024年、旧優生保護法の規定は当時の社会状況からみて合理的で合憲であるが、被害者救済のため国が補償すべきだとした。","旧優生保護法は第二次世界大戦前に制定され、日本国憲法の施行と同時に廃止された。"],"a":0,"e":"2024年の最高裁大法廷判決は、規定を違憲とし、除斥期間の適用を認めずに国の賠償責任を認めた。旧優生保護法は本人の同意がなくても不妊手術を認めていたので「同意した場合に限って」は誤り。最高裁は規定を合憲とはしていない。また、同法は日本国憲法施行後の1948年に制定され、1996年に母体保護法に改められたので、戦前制定・憲法施行と同時に廃止という記述も誤り。"},{"t":"mc","s":"平等権をめぐる判例","imp":3,"q":"最高裁判所が、法の下の平等などに反するとして違憲と判断した法律の規定として適当でないものを一つ選べ。","c":["夫婦は婚姻の際に夫または妻の氏を称すると定めた民法の規定","婚外子の法定相続分を婚内子の2分の1と定めた民法の規定","日本国籍の取得に、出生後の認知に加えて父母の婚姻を要件とした国籍法の規定","尊属殺人の法定刑を死刑または無期懲役に限った刑法の規定"],"a":0,"e":"夫婦同氏規定は2015年・2021年に最高裁が合憲と判断している。婚外子相続分規定（2013年）、国籍法の婚姻要件（2008年）、尊属殺重罰規定（1973年）は、いずれも14条1項に反するとして違憲とされた。"}]});</script>
<script>QDATA.push({"unit":"u07","questions":[{"t":"qa","s":"部落差別の解消","imp":3,"q":"1922年に、被差別部落の人々がみずからの力で差別からの解放をめざして結成した団体を何というか。","a":"全国水平社","alt":["水平社"],"e":"創立大会で採択された水平社宣言は「人の世に熱あれ、人間に光あれ」と結ばれ、日本で最初の人権宣言ともいわれる。部落差別は、近代以前の身分制度に由来する根拠のない差別である。"},{"t":"qa","s":"部落差別の解消","imp":2,"q":"1965年に出され、同和問題の早急な解決は国の責務であり、同時に国民的課題であると指摘した政府の審議会の答申を何というか。","a":"同和対策審議会答申","alt":["同対審答申"],"e":"この答申を受けて1969年に同和対策事業特別措置法が制定され、生活環境の改善などの事業が進められた。特別措置法にもとづく国の事業は2002年に終了した。"},{"t":"qa","s":"部落差別の解消","imp":2,"q":"2016年に制定され、現在もなお部落差別が存在することを認めたうえで、その解消の推進を国や地方公共団体の責務とした法律を何というか。","a":"部落差別解消推進法","alt":["部落差別の解消の推進に関する法律"],"e":"罰則のない理念法である。インターネット上の差別的な書き込みなど、情報化の進展にともなう部落差別の状況の変化も制定の背景にある。同じ2016年にはヘイトスピーチ解消法も制定された。"},{"t":"tf","s":"部落差別の解消","imp":2,"q":"1965年の同和対策審議会答申は、部落差別は時間の経過とともに自然に解消していくので、行政が特別な対策をとる必要はないと結論づけた。","a":false,"e":"正しくは、答申は同和問題の解決を国の責務であり国民的課題であるとして、積極的な対策を求めた。放置すれば自然に解消するという「寝た子を起こすな」式の考え方には同意できないとしている。"},{"t":"qa","s":"アイヌ民族の権利","imp":3,"q":"1899年に制定され、アイヌの人々に農業を奨励するなどして同化政策を進めた法律を何というか。","a":"北海道旧土人保護法","e":"保護を名目としていたが、アイヌの伝統的な生活や文化を否定する同化政策の一環であった。1997年にアイヌ文化振興法が制定されたことにより廃止された。"},{"t":"qa","s":"アイヌ民族の権利","imp":3,"q":"2019年に制定され、アイヌの人々を法律上初めて「先住民族」と明記した法律を何というか。","a":"アイヌ施策推進法","alt":["アイヌ新法","アイヌの人々の誇りが尊重される社会を実現するための施策の推進に関する法律"],"e":"アイヌ民族であることを理由とする差別の禁止なども定めている。1997年のアイヌ文化振興法は文化の振興が中心で、先住民族とは明記していなかった。2020年には北海道白老町に民族共生象徴空間（ウポポイ）が開設された。"},{"t":"qa","s":"アイヌ民族の権利","imp":2,"q":"北海道でのダム建設のための土地収用をめぐり、1997年に札幌地方裁判所がアイヌ民族を先住民族と認め、その文化への配慮を欠いた収用の裁決を違法とした訴訟を何というか。","a":"二風谷ダム訴訟","alt":["二風谷ダム判決","二風谷ダム事件"],"e":"アイヌ民族を先住民族と認めた初めての司法判断とされる。ただし、ダムがすでに完成していたため、収用裁決の取消しは認めなかった（違法を宣言しつつ請求を棄却する事情判決）。"},{"t":"tf","s":"アイヌ民族の権利","imp":2,"q":"1997年に制定されたアイヌ文化振興法は、アイヌ民族を先住民族と明記した日本で最初の法律である。","a":false,"e":"正しくは、アイヌ文化振興法は北海道旧土人保護法に代わって制定され、アイヌ文化の振興を図ったが、先住民族とは明記していなかった。先住民族と初めて明記したのは2019年のアイヌ施策推進法である。"},{"t":"tf","s":"アイヌ民族の権利","imp":1,"q":"2008年、国会の衆参両院は、アイヌ民族を先住民族とすることを求める決議を全会一致で採択した。","a":true,"e":"正しい。前年の2007年に国連で「先住民族の権利に関する国際連合宣言」が採択されたことが背景にある。この決議を受けて政府もアイヌ民族を先住民族と認め、2019年のアイヌ施策推進法につながった。"},{"t":"mc","s":"アイヌ民族の権利","imp":2,"q":"アイヌ民族に関する次の出来事を古いものから順に並べたとき、3番目にくるものとして最も適当なものを一つ選べ。","c":["北海道旧土人保護法の制定","アイヌ文化振興法の制定","国会による、アイヌ民族を先住民族とすることを求める決議の採択","アイヌ施策推進法の制定"],"a":2,"e":"北海道旧土人保護法の制定（1899年）→アイヌ文化振興法の制定（1997年、旧土人保護法は廃止）→国会決議（2008年）→アイヌ施策推進法の制定（2019年）の順である。同化政策から文化の振興、そして先住民族としての位置づけへという流れでとらえよう。"},{"t":"qa","s":"外国人の人権","imp":3,"q":"アメリカ国籍の英語教師が在留期間の更新を申請したところ、在留中の政治活動などを理由に不許可とされ、その違法性が争われて1978年に最高裁判所が外国人の人権保障について判断を示した事件を何というか。","a":"マクリーン事件","alt":["マクリーン訴訟"],"e":"最高裁は、基本的人権の保障は権利の性質上日本国民のみを対象とするものを除き、在留外国人にも等しく及ぶとした（権利性質説）。一方、外国人の在留を認めるかどうかは国の広い裁量にゆだねられるとして、更新不許可を適法とした。"},{"t":"ex","s":"外国人の人権","imp":3,"q":"外国人の人権保障について最高裁判所が示した権利性質説とはどのような考え方か、説明せよ。","a":"憲法の人権保障は、権利の性質上日本国民のみを対象としていると解されるものを除き、日本に在留する外国人にも等しく及ぶという考え方である。精神の自由などは外国人にも保障されるが、国政選挙の選挙権のように国民主権に直接関わる権利や、日本に入国する自由は保障されないとされる。","e":"ポイント：①1978年のマクリーン事件判決で示された ②権利の性質によって外国人への保障の有無を判断する ③自由権などは原則として保障 ④国政の参政権や入国の自由は保障されない。"},{"t":"tf","s":"外国人の人権","imp":2,"q":"マクリーン事件で最高裁判所は、外国人の政治活動の自由についても、日本の政治的意思決定やその実施に影響を及ぼす活動など外国人の地位にかんがみ相当でないものを除き、保障されるとした。","a":true,"e":"正しい。ただし最高裁は、在留期間の更新の判断にあたって、在留中の政治活動を国が不利益に考慮することは許されるとして、更新不許可を適法とした。"},{"t":"tf","s":"外国人の人権","imp":3,"q":"最高裁判所は1995年、永住資格をもつ外国人に地方選挙の選挙権を認めないことは憲法に違反すると判断した。","a":false,"e":"正しくは、最高裁は、地方公共団体の長や議員を選挙するとした憲法93条2項の「住民」は日本国民を意味し、外国人に地方選挙の選挙権を保障したものではないとした。ただし、永住者などに法律で地方選挙権を与えることは憲法上禁止されていないとも述べている（傍論）。"},{"t":"mc","s":"外国人の人権","imp":2,"q":"日本に住む外国人の権利に関する記述として最も適当なものを一つ選べ。","c":["永住者などの定住外国人に法律で地方選挙の選挙権を与えることは、憲法上禁止されていないと最高裁判所は述べている。","日本国憲法の人権規定は「国民は」という表現を用いているので、外国人には一切適用されない。","最高裁判所は、外国人には精神の自由は保障されるが、政治活動の自由は一切保障されないとしている。","国政選挙の選挙権は、一定期間以上日本に住む外国人にも法律で認められている。"],"a":0,"e":"1995年の最高裁判決は、憲法は外国人に地方選挙権を保障していないとしつつ、永住者などに法律で地方選挙権を与えることは禁止されていないと述べた（傍論）。人権規定は権利の性質に応じて外国人にも適用されるので「一切適用されない」は誤り。政治活動の自由も一定の範囲で保障されるので「一切保障されない」も誤り。国政選挙の選挙権は日本国民に限られている。"},{"t":"qa","s":"外国人の人権","imp":1,"q":"公務員の採用試験などで、受験資格として日本国籍をもつことを求める定めを何というか。","a":"国籍条項","e":"公権力の行使や公の意思形成に関わる公務員には日本国籍が必要だとする政府見解があるが、地方公共団体では一般事務職などで国籍条項を撤廃する例も増えている。最高裁は2005年、東京都が外国籍の職員に管理職選考の受験を認めなかったことを合憲とした。"},{"t":"qa","s":"外国人の人権","imp":1,"q":"第二次世界大戦前から日本に住み、サンフランシスコ平和条約の発効により日本国籍を離脱することになった朝鮮半島・台湾出身の人々とその子孫に認められている在留資格を何というか。","a":"特別永住者","alt":["特別永住","特別永住資格"],"e":"在日韓国・朝鮮人の多くがこの資格をもつ。1991年に制定された入管特例法で定められた。歴史的な経緯をもつ人々であり、差別やヘイトスピーチの対象とされてきた問題がある。"},{"t":"qa","s":"障害者の権利","imp":3,"q":"2013年に制定（2016年施行）され、障害を理由とする不当な差別的取扱いを禁止し、障害のある人への合理的配慮の提供を求める法律を何というか。","a":"障害者差別解消法","alt":["障害を理由とする差別の解消の推進に関する法律"],"e":"合理的配慮の提供は、施行当初は行政機関などには義務、民間事業者には努力義務とされたが、2021年の改正（2024年4月施行）で民間事業者にも義務づけられた。"},{"t":"ex","s":"障害者の権利","imp":3,"q":"障害者差別解消法における合理的配慮とは何か、具体例を挙げて説明せよ。","a":"合理的配慮とは、障害のある人が社会生活で直面する障壁（社会的障壁）を取り除くため、本人からの申出に応じて、負担が重すぎない範囲で行う必要かつ適当な変更や調整のことである。例えば、車いすの利用者のために段差にスロープを渡すことや、聴覚障害のある人に筆談で対応することがあげられる。","e":"ポイント：①社会的障壁の除去 ②本人からの意思の表明（申出）に応じて行う ③過重な負担にならない範囲 ④2024年4月からは行政機関・民間事業者ともに法的義務。"},{"t":"tf","s":"障害者の権利","imp":2,"q":"障害者差別解消法は、合理的配慮の提供を、施行当初から行政機関と民間事業者の双方に法的義務として課していた。","a":false,"e":"正しくは、2016年の施行当初は、行政機関などには義務、民間事業者には努力義務とされていた。2021年の法改正（2024年4月施行）により、民間事業者にも合理的配慮の提供が義務づけられた。"},{"t":"mc","s":"障害者の権利","imp":2,"q":"次の事例のうち、障害者差別解消法の「合理的配慮の提供」にあたるものとして最も適当なものを一つ選べ。","c":["飲食店が、視覚障害のある客の求めに応じて、メニューを読み上げて説明した。","飲食店が、ほかの客の迷惑になることを理由に、車いすの利用者の入店を一律に断った。","企業が、障害があることだけを理由に、障害のある社員を昇進の対象から外した。","市役所が、障害のある人に対して、窓口での手続きの際には必ず家族を同伴するよう求めた。"],"a":0,"e":"本人の求めに応じてメニューを読み上げるのは、社会的障壁を取り除くための合理的配慮にあたる。一律の入店拒否、障害のみを理由とする昇進からの除外、必要もないのに家族の同伴を条件とすることは、いずれも障害を理由とする不当な差別的取扱いであり、法律で禁止されている。"},{"t":"qa","s":"障害者の権利","imp":2,"q":"2006年に国連総会で採択され、日本が国内法の整備を経て2014年に批准した、障害者の人権や基本的自由の確保を目的とする条約を何というか。","a":"障害者権利条約","alt":["障害者の権利に関する条約"],"e":"「私たちのことを、私たち抜きに決めないで」を合言葉に、障害者自身も策定に参加した。日本は批准に向けて2011年に障害者基本法を改正し、2013年に障害者差別解消法を制定した。"},{"t":"qa","s":"障害者の権利","imp":1,"q":"1970年制定の心身障害者対策基本法を改正・改称して1993年に成立し、障害者の自立と社会参加を支援する施策の基本理念を定めた法律を何というか。","a":"障害者基本法","e":"2011年の改正で、障害者を、障害と「社会的障壁」によって日常生活や社会生活に相当な制限を受ける状態にある者と定義した。障害を個人の問題ではなく社会との関係でとらえる考え方（社会モデル）を取り入れたものである。"},{"t":"qa","s":"障害者の権利","imp":2,"q":"障害のある人もない人も、ともに地域社会でふつうに生活できるのが本来の社会の姿であるとする考え方を何というか。","a":"ノーマライゼーション","e":"北欧で生まれた考え方である。物理的・制度的な障壁を取り除くバリアフリーや、はじめから誰もが使いやすいように設計するユニバーサルデザインとあわせて覚えよう。"}]});</script>
<script>QDATA.push({"unit":"u07","questions":[{"t":"qa","s":"女性の地位向上","imp":3,"q":"1979年に国連総会で採択され、日本が1985年に批准した、政治・経済・社会・文化などあらゆる分野での女性に対する差別の撤廃を求める条約を何というか。","a":"女子差別撤廃条約","alt":["女性差別撤廃条約","女子に対するあらゆる形態の差別の撤廃に関する条約"],"e":"日本は批准に向けて、1984年に国籍法を改正し、1985年に男女雇用機会均等法を制定し、家庭科の男女共修も進めた。男女雇用機会均等法の内容は労働問題の単元で詳しく学ぶ。"},{"t":"tf","s":"女性の地位向上","imp":2,"q":"女子差別撤廃条約の批准に向けて、日本は国籍法を改正し、父母のどちらかが日本国民であれば子が日本国籍を取得できる父母両系血統主義に改めた。","a":true,"e":"正しい。それまでの国籍法は、父が日本国民である場合にのみ子に日本国籍を認める父系血統主義をとっていた。1984年の改正で父母両系血統主義に改められた。"},{"t":"qa","s":"女性の地位向上","imp":3,"q":"1999年に制定され、男女が社会の対等な構成員として、あらゆる分野の活動に参画する機会が確保され、利益と責任をともに分かち合う社会の形成をめざす法律を何というか。","a":"男女共同参画社会基本法","e":"国や地方公共団体の責務、男女共同参画基本計画の策定などを定めている。男女間の格差を改善するために必要な範囲で機会を積極的に提供する積極的改善措置（ポジティブ・アクション）も、この法律の定める施策に含まれる。"},{"t":"qa","s":"女性の地位向上","imp":2,"q":"2015年に制定され、一定規模以上の企業などに、女性の活躍に関する状況の把握、行動計画の策定、情報の公表を義務づけた法律を何というか。","a":"女性活躍推進法","alt":["女性の職業生活における活躍の推進に関する法律"],"e":"国や地方公共団体にも同様の取組を求めている。民間企業で義務の対象となるのは、当初は常時雇用する労働者が301人以上の企業だったが、2022年4月から101人以上の企業に拡大された。"},{"t":"qa","s":"女性の地位向上","imp":2,"q":"2018年に制定され、国会や地方議会の選挙において、男女の候補者の数ができる限り均等になることをめざすよう政党などに求めた法律を何というか。","a":"政治分野における男女共同参画推進法","alt":["政治分野における男女共同参画の推進に関する法律","候補者男女均等法"],"e":"日本は国会議員に占める女性の割合が国際的に見て低い。この法律は罰則のない理念法であり、政党などには努力を求めるにとどまる。2021年の改正で、議員などに対するセクシュアル・ハラスメントやマタニティ・ハラスメントの防止なども盛り込まれた。"},{"t":"tf","s":"女性の地位向上","imp":1,"q":"政治分野における男女共同参画推進法は、政党に対して、選挙の候補者の一定割合を女性とすることを罰則つきで義務づけている。","a":false,"e":"正しくは、この法律は男女の候補者数ができる限り均等になることをめざすよう政党などに努力を求めるにとどまり、罰則はない。候補者や議席の一定割合を女性などに割り当てるクオータ制は、海外では導入している国があるが、日本では法制化されていない。"},{"t":"mc","s":"女性の地位向上","imp":2,"q":"女性の地位向上に関する法律や条約についての記述として最も適当なものを一つ選べ。","c":["女性活躍推進法は、一定規模以上の企業に、女性の活躍に関する行動計画の策定や情報の公表を義務づけている。","男女共同参画社会基本法は、女子差別撤廃条約の批准に先立って1985年に制定された。","女子差別撤廃条約は、国際労働機関（ILO）の総会で採択された条約である。","日本は女子差別撤廃条約を批准した後も、国籍法の父系血統主義を維持している。"],"a":0,"e":"女性活躍推進法（2015年）は企業に行動計画の策定や情報公表を義務づけている。男女共同参画社会基本法の制定は1999年で、条約の批准（1985年）より後なので誤り。女子差別撤廃条約は国連総会で採択されたので、ILO総会とするのは誤り。国籍法は批准に向けて1984年に父母両系血統主義に改正されたので、父系血統主義の維持も誤り。"},{"t":"qa","s":"ハンセン病問題","imp":3,"q":"ハンセン病の患者を療養所へ強制的に隔離する政策の根拠となり、1996年に廃止された法律を何というか。","a":"らい予防法","alt":["癩予防法"],"e":"1931年の癩予防法で全患者の隔離がめざされ、1953年に制定されたらい予防法でも、治療法が確立していたにもかかわらず隔離政策が続けられた。患者や元患者は、家族とも引き離され、厳しい差別と偏見にさらされた。"},{"t":"qa","s":"ハンセン病問題","imp":1,"q":"2001年、ハンセン病患者に対する隔離政策は違憲であり、国会がらい予防法を廃止しなかったことも違法であるとして、国に賠償を命じる判決を出した地方裁判所はどこか。","a":"熊本地方裁判所","alt":["熊本地裁"],"e":"国は控訴せずに判決が確定し、首相が元患者らに謝罪した。同年、補償金を支給する法律が制定された。2019年には元患者の家族が受けた差別被害についても熊本地裁が国の責任を認め、国は控訴しなかった。"},{"t":"ex","s":"ハンセン病問題","imp":2,"q":"2001年の熊本地方裁判所の判決が、ハンセン病患者の隔離政策について国の責任を認めた理由を説明せよ。","a":"ハンセン病は感染力が弱く、1940年代に特効薬が開発されて治療法が確立したにもかかわらず、国はらい予防法にもとづく強制隔離政策を続け、患者の居住・移転の自由などの人権を著しく侵害した。判決は、遅くとも1960年には隔離の必要性が失われていたとして厚生省（当時）の責任を認め、法を改廃しなかった国会の立法不作為も違法とした。","e":"ポイント：①感染力が弱く治療法も確立していた ②それでも強制隔離を継続 ③居住・移転の自由など人権の侵害 ④行政（厚生省）の責任と国会の立法不作為の違法を認めた。"},{"t":"mc","s":"ハンセン病問題","imp":2,"q":"ハンセン病問題に関する記述として最も適当なものを一つ選べ。","c":["2001年の熊本地方裁判所の判決に対して国は控訴を断念し、首相が元患者らに謝罪した。","らい予防法は、特効薬が開発されて治療法が確立した直後の1950年代に廃止された。","ハンセン病は感染力が非常に強いため、現在も患者の隔離が法律で義務づけられている。","2001年の熊本地方裁判所の判決は、隔離政策の違法性を認めたが、国会がらい予防法を廃止しなかったことの責任は否定した。"],"a":0,"e":"国は2001年の判決に控訴せず、首相が謝罪した。らい予防法が廃止されたのは1996年であり、治療法の確立後も長く隔離が続いたことが問題とされた。ハンセン病は感染力が弱く、現在は隔離の制度はない。また、判決は国会の立法不作為の違法も認めている。"},{"t":"qa","s":"ヘイトスピーチと性の多様性","imp":3,"q":"2016年に制定された、日本以外の国や地域の出身者とその子孫に対する不当な差別的言動の解消をめざす法律を何というか。","a":"ヘイトスピーチ解消法","alt":["ヘイトスピーチ対策法","本邦外出身者に対する不当な差別的言動の解消に向けた取組の推進に関する法律"],"e":"特定の民族などを排斥するような差別的言動は許されないと宣言し、国や地方公共団体に相談体制の整備や教育・啓発などを求めている。禁止規定や罰則のない理念法である。"},{"t":"tf","s":"ヘイトスピーチと性の多様性","imp":2,"q":"ヘイトスピーチ解消法は、特定の民族などを排斥する差別的な言動を禁止し、違反した者に刑事罰を科している。","a":false,"e":"正しくは、ヘイトスピーチ解消法には禁止規定も罰則もなく、差別的言動の解消に向けた取組を推進する理念法である。なお、神奈川県川崎市は2019年に、一定のヘイトスピーチに刑事罰を科す全国初の条例を制定した。"},{"t":"ex","s":"ヘイトスピーチと性の多様性","imp":1,"q":"ヘイトスピーチ解消法が、罰則のない理念法とされた理由を、表現の自由との関係から説明せよ。","a":"ヘイトスピーチは人の尊厳を傷つけ差別を助長するもので許されないが、言論を刑罰で規制すると、何が規制対象かを判断する過程で国家が表現の内容に介入し、正当な批判や議論まで萎縮させるおそれがある。そのため禁止規定や罰則を設けず、相談体制の整備や教育・啓発などの取組を国や地方公共団体に求める理念法とされた。","e":"ポイント：①ヘイトスピーチは許されない ②刑罰による言論規制は表現の自由を萎縮させるおそれ ③禁止規定・罰則なしの理念法 ④相談・教育・啓発による解消をめざす。"},{"t":"qa","s":"ヘイトスピーチと性の多様性","imp":2,"q":"2023年に制定された、性的指向やジェンダーアイデンティティの多様性に関する国民の理解の増進をめざす法律を一般に何というか。","a":"LGBT理解増進法","alt":["性的指向及びジェンダーアイデンティティの多様性に関する国民の理解の増進に関する法律","LGBT法"],"e":"性的指向やジェンダーアイデンティティを理由とする「不当な差別はあってはならない」という基本理念を定める。罰則のない理念法であり、国や地方公共団体に理解増進の施策を求めている。"},{"t":"qa","s":"ヘイトスピーチと性の多様性","imp":1,"q":"地方公共団体が、同性カップルなどを婚姻に相当する関係にあると認めて証明書を発行するなどの制度を一般に何というか。","a":"パートナーシップ制度","alt":["パートナーシップ宣誓制度","同性パートナーシップ制度","パートナーシップ証明制度"],"e":"2015年に東京都渋谷区と世田谷区が始め、その後全国の多くの地方公共団体に広がった。ただし法律上の婚姻とは異なり、相続や税制上の配偶者控除などの法的な効果はない。"},{"t":"mc","s":"ヘイトスピーチと性の多様性","imp":2,"q":"差別の解消に関する法律とその内容についての記述として最も適当なものを一つ選べ。","c":["ヘイトスピーチ解消法は、日本以外の国や地域の出身者に対する不当な差別的言動の解消に向けた取組を推進することを定めている。","部落差別解消推進法は、部落差別にあたる言動をした者に刑事罰を科すことを定めている。","LGBT理解増進法は、同性カップルに法律上の婚姻を認めることを定めている。","アイヌ施策推進法は、アイヌ民族を先住民族とは明記せず、文化の振興のみを定めている。"],"a":0,"e":"ヘイトスピーチ解消法の説明として正しい。部落差別解消推進法は罰則のない理念法なので誤り。LGBT理解増進法は国民の理解の増進をめざす理念法で、同性婚を認める規定はないので誤り。アイヌ施策推進法（2019年）はアイヌ民族を法律上初めて先住民族と明記したので誤り。"},{"t":"qa","s":"思想・良心の自由","imp":3,"q":"次の日本国憲法第19条の（　）に入る語を答えよ。「（　）及び良心の自由は、これを侵してはならない。」","a":"思想","e":"19条は内心の自由を保障する。国家が特定の思想を強制したり、思想を理由に不利益を与えたり、思想の表明を強制したりすることは許されない。明治憲法には思想・良心の自由の規定はなかった。"},{"t":"tf","s":"思想・良心の自由","imp":2,"q":"思想・良心の自由は、人の心の内面にとどまる限り絶対的に保障され、国家が個人に対して思想の表明を強制することも許されない。","a":true,"e":"正しい。内心にとどまる限り他者の人権と衝突しないため、絶対的に保障される。自分の考えを明らかにしない沈黙の自由も含まれ、江戸時代の踏絵のように内心を探ることも許されない。"},{"t":"tf","s":"思想・良心の自由","imp":1,"q":"最高裁判所は、公立学校の卒業式で教員に国歌斉唱の際の起立斉唱を命じた校長の職務命令について、思想・良心の自由を侵害し違憲であると判断した。","a":false,"e":"正しくは、最高裁は2011年、この職務命令は思想・良心の自由を間接的に制約する面があるものの、その目的や内容から必要性と合理性が認められるとして、19条に違反しないと判断した。"}]});</script>
<script>QDATA.push({"unit":"u07","questions":[{"t":"qa","s":"信教の自由と政教分離","imp":3,"q":"次の日本国憲法第20条1項の（　）に入る語を答えよ。「信教の自由は、何人に対してもこれを保障する。いかなる宗教団体も、国から（　）を受け、又は政治上の権力を行使してはならない。」","a":"特権","e":"20条1項後段と3項（国及びその機関は、宗教教育その他いかなる宗教的活動もしてはならない）が政教分離原則を定める。戦前、国家神道が事実上の国教とされ、他の宗教が弾圧されたことへの反省にもとづく。"},{"t":"tf","s":"信教の自由と政教分離","imp":2,"q":"日本国憲法が保障する信教の自由には、宗教を信じない自由や、宗教上の行為・儀式などへの参加を強制されない自由も含まれる。","a":true,"e":"正しい。20条2項は「何人も、宗教上の行為、祝典、儀式又は行事に参加することを強制されない」と定める。明治憲法の信教の自由は「安寧秩序ヲ妨ケス及臣民タルノ義務ニ背カサル限ニ於テ」認められたにすぎなかった。"},{"t":"qa","s":"信教の自由と政教分離","imp":3,"q":"国家が特定の宗教と結びつくことを禁じ、国家の宗教的中立性を求める原則を何というか。","a":"政教分離","alt":["政教分離原則","政教分離の原則"],"e":"日本国憲法では20条1項後段・3項と89条が根拠となる。国家と宗教が結びつくと、少数派の宗教が圧迫され信教の自由が脅かされるため、制度として両者を分離して信教の自由を確保しようとするものである。"},{"t":"qa","s":"信教の自由と政教分離","imp":2,"q":"次の日本国憲法第89条の（　）に入る語を答えよ。「公金その他の公の財産は、（　）上の組織若しくは団体の使用、便益若しくは維持のため、又は公の支配に属しない慈善、教育若しくは博愛の事業に対し、これを支出し、又はその利用に供してはならない。」","a":"宗教","e":"89条は、政教分離を財政面から裏づける規定である。愛媛玉串料訴訟や空知太神社訴訟では、公金の支出や公有地の無償提供がこの条文に違反するかが争われた。"},{"t":"qa","s":"信教の自由と政教分離","imp":3,"q":"三重県津市が市体育館の起工式を神道式の地鎮祭として行い公金を支出したことについて、1977年に最高裁判所が政教分離に反しないとした訴訟を何というか。","a":"津地鎮祭訴訟","alt":["津地鎮祭事件"],"e":"最高裁は、地鎮祭は一般人から見て世俗的な行事であり、その目的・効果からみて憲法が禁じる宗教的活動にはあたらないとして合憲とした。このとき示された判断の枠組みが目的効果基準である。"},{"t":"ex","s":"信教の自由と政教分離","imp":3,"q":"政教分離をめぐる判断基準である目的効果基準とはどのようなものか、説明せよ。","a":"国家と宗教のかかわりを完全になくすことはできないという前提に立ち、国や地方公共団体の行為の目的が宗教的意義をもち、その効果が特定の宗教に対する援助・助長・促進または圧迫・干渉などになる場合に、憲法が禁じる宗教的活動にあたるとする基準である。津地鎮祭訴訟の最高裁判決で示された。","e":"ポイント：①国家と宗教の完全な分離は不可能という前提 ②行為の目的が宗教的意義をもつか ③効果が宗教への援助・助長・促進または圧迫・干渉になるか ④津地鎮祭訴訟（合憲）で示され、愛媛玉串料訴訟（違憲）でも用いられた。"},{"t":"qa","s":"信教の自由と政教分離","imp":3,"q":"愛媛県が靖国神社や県護国神社の祭祀に際して玉串料などを公金から支出したことについて、1997年に最高裁判所が政教分離原則に反し違憲とした訴訟を何というか。","a":"愛媛玉串料訴訟","alt":["愛媛玉串料事件","愛媛玉串料違憲訴訟"],"e":"最高裁は目的効果基準を用いて、玉串料の奉納は宗教的意義をもち、特定の宗教団体への援助・助長・促進にあたるとして、20条3項と89条に違反するとした。政教分離をめぐる最高裁の初めての違憲判決である。"},{"t":"qa","s":"信教の自由と政教分離","imp":2,"q":"北海道砂川市が市有地を神社の敷地として無償で使用させていたことについて、2010年に最高裁判所が憲法89条・20条1項後段に違反するとした訴訟を何というか。","a":"空知太神社訴訟","alt":["空知太神社事件","砂川政教分離訴訟"],"e":"最高裁は目的効果基準を明示的には用いず、施設の性格や無償提供の経緯などの諸事情を考慮し、社会通念に照らして総合的に判断した。違憲状態を解消する方法として土地の譲与や有償での貸付けなども考えられるとして、審理を高裁に差し戻した。"},{"t":"mc","s":"信教の自由と政教分離","imp":3,"q":"政教分離をめぐる最高裁判所の判断に関する記述として最も適当なものを一つ選べ。","c":["北海道砂川市が市有地を神社の敷地として無償で使用させていたことは、憲法に違反するとされた。","三重県津市が神道式の地鎮祭に公金を支出したことは、宗教的活動にあたり違憲とされた。","愛媛県が靖国神社に玉串料を公金から支出したことは、社会的儀礼の範囲内であり合憲とされた。","沖縄県那覇市が孔子廟の敷地の使用料を全額免除したことは、孔子廟は宗教施設とはいえないため合憲とされた。"],"a":0,"e":"空知太神社訴訟（2010年）では違憲とされた。津地鎮祭訴訟（1977年）は世俗的行事として合憲、愛媛玉串料訴訟（1997年）は違憲なので、それぞれ結論が逆である。那覇孔子廟訴訟（2021年）でも、最高裁は孔子廟の宗教性を認め、使用料の全額免除は20条3項に違反するとした。"},{"t":"tf","s":"信教の自由と政教分離","imp":1,"q":"那覇市が市の公園内にある孔子廟の敷地の使用料を全額免除していたことについて、最高裁判所は2021年、憲法20条3項が禁止する宗教的活動にあたり違憲であると判断した。","a":true,"e":"正しい。那覇孔子廟訴訟である。最高裁は、孔子廟では孔子をまつる宗教的な儀式が行われており宗教性が認められるとし、使用料の全額免除は特定の宗教に特別の便益を与え援助していると評価されてもやむをえないとした。愛媛玉串料訴訟・空知太神社訴訟に続く政教分離違反の判断である。"},{"t":"qa","s":"表現の自由","imp":3,"q":"次の日本国憲法第21条1項の（　）に入る語を答えよ。「集会、結社及び言論、出版その他一切の（　）の自由は、これを保障する。」","a":"表現","e":"表現の自由には、報道の自由や、それを支える取材の自由も含まれると解されている。自分の考えを発表するだけでなく、情報を受け取る自由（知る権利）の根拠にもなる。"},{"t":"qa","s":"表現の自由","imp":3,"q":"次の日本国憲法第21条2項の（　）に入る語を答えよ。「（　）は、これをしてはならない。通信の秘密は、これを侵してはならない。」","a":"検閲","e":"検閲とは、行政権が表現物の内容を発表前に審査し、不適当と認めるものの発表を禁止することであり、例外なく禁止される。戦前は新聞・出版物などへの検閲が行われていた。"},{"t":"ex","s":"表現の自由","imp":2,"q":"表現の自由が、他の人権に比べて特に重要とされる（優越的地位にあるとされる）理由を説明せよ。","a":"表現の自由は、人が自分の考えを表明して人格を発展させるという個人的な価値（自己実現の価値）をもつとともに、国民が自由に情報を得て意見を交わし、政治に参加するという民主政治に欠かせない価値（自己統治の価値）をもつ。そのため、表現の自由を制約する法律は厳格に審査されるべきだとされる。","e":"ポイント：①自己実現の価値 ②自己統治の価値（民主政治の前提） ③いったん侵害されると民主的な過程での回復が困難 ④制約する法律は厳格に審査（二重の基準）。"},{"t":"tf","s":"表現の自由","imp":2,"q":"日本国憲法は表現の自由を保障しているので、他人の名誉を傷つける表現をしても、法的な責任を問われることはない。","a":false,"e":"正しくは、表現の自由も無制限ではなく、他人の人権との調整のために制約を受ける。他人の名誉を傷つける表現は、刑法の名誉毀損罪や民法上の損害賠償責任の対象となりうる。"},{"t":"tf","s":"表現の自由","imp":1,"q":"日本国憲法21条2項が保障する通信の秘密の対象には、手紙だけでなく、電話や電子メールなどによる通信も含まれる。","a":true,"e":"正しい。通信の秘密は、通信の内容だけでなく、誰と誰がいつ通信したかといった情報も保護の対象とされる。犯罪捜査のための通信傍受は、通信傍受法にもとづく厳格な手続きのもとでのみ認められている。"},{"t":"qa","s":"表現の自由","imp":2,"q":"高校日本史の教科書の執筆者が、文部省（当時）の教科書検定は表現の自由や学問の自由などを侵害し違憲だとして、1965年から30年以上にわたって争った裁判を何というか。","a":"家永教科書裁判","alt":["家永教科書訴訟","教科書裁判","家永訴訟"],"e":"最高裁は、検定で不合格になっても一般図書としての出版は可能であるから、教科書検定は検閲にあたらず合憲とした。ただし1997年の判決では、一部の検定意見について文部大臣の裁量権の逸脱を認め、違法とした。"},{"t":"qa","s":"表現の自由","imp":3,"q":"元外務大臣をモデルとした三島由紀夫の小説をめぐり、1964年に東京地方裁判所がプライバシーの権利を初めて認めた事件を何というか。","a":"「宴のあと」事件","alt":["宴のあと事件","宴のあと訴訟"],"e":"判決は、プライバシーの権利を「私生活をみだりに公開されないという法的保障ないし権利」と定義した。表現の自由とプライバシーの権利が衝突した代表的な事件である。"},{"t":"qa","s":"表現の自由","imp":2,"q":"モデルとされた女性のプライバシーや名誉を侵害するとして、2002年に最高裁判所が小説の出版の差し止めを認めた事件を何というか。","a":"「石に泳ぐ魚」事件","alt":["石に泳ぐ魚事件","石に泳ぐ魚訴訟"],"e":"柳美里の小説をめぐる事件で、最高裁が小説の出版差し止めを認めた初めての例とされる。公人ではない人物の私生活の暴露によって重大で回復困難な損害を受けるおそれがあるとして、表現の自由よりもプライバシーなどの保護を優先した。"},{"t":"qa","s":"表現の自由","imp":2,"q":"沖縄返還協定に関する外務省の秘密電文を新聞記者が外務省の女性事務官から入手したことが国家公務員法違反に問われ、1978年に最高裁判所が記者を有罪とした事件を何というか。","a":"外務省秘密漏洩事件","alt":["外務省機密漏洩事件","西山事件"],"e":"最高裁は、報道のための取材の自由は憲法21条の精神に照らし十分尊重に値するとしつつ、取材の手段・方法が社会観念上是認できないものであれば、正当な取材活動の範囲を逸脱するとした。国民の知る権利と国家機密の関係が問われた。"},{"t":"mc","s":"表現の自由","imp":3,"q":"表現の自由にかかわる事件と、裁判所の判断についての記述として最も適当なものを一つ選べ。","c":["「宴のあと」事件では、私生活をみだりに公開されないというプライバシーの権利が認められた。","家永教科書裁判では、教科書検定は憲法が禁止する検閲にあたり違憲であるとされた。","「石に泳ぐ魚」事件では、表現の自由が優先され、小説の出版の差し止めは認められなかった。","外務省秘密漏洩事件では、取材の自由が優先され、秘密を入手した新聞記者は無罪とされた。"],"a":0,"e":"「宴のあと」事件（1964年、東京地裁）の記述は正しい。家永教科書裁判で最高裁は、教科書検定は検閲にあたらないとした。「石に泳ぐ魚」事件では出版差し止めが認められた。外務省秘密漏洩事件では、取材方法が社会観念上是認できないとして記者は有罪となった。"},{"t":"qa","s":"学問の自由","imp":3,"q":"次の日本国憲法第23条の（　）に入る語を答えよ。「（　）の自由は、これを保障する。」","a":"学問","e":"学問の自由には、研究の自由、研究発表の自由、教授の自由が含まれ、それを支えるために大学の自治も保障されると解されている。明治憲法下で、滝川事件（1933年）や天皇機関説事件（1935年）のように学問が弾圧されたことへの反省にもとづく。"},{"t":"mc","s":"学問の自由","imp":2,"q":"学問の自由と大学の自治に関する記述として最も適当なものを一つ選べ。","c":["学問の自由には研究の自由・研究発表の自由・教授の自由が含まれ、これを支えるために大学の自治も認められると解されている。","日本国憲法には「大学の自治は、これを保障する」という明文の規定が置かれている。","東大ポポロ事件で最高裁判所は、大学構内での学生の集会は、その内容にかかわらずすべて大学の自治によって保護されるとした。","学問の自由は大学の教員だけがもつ権利であり、一般の国民には保障されていない。"],"a":0,"e":"大学の自治は憲法に明文はなく、23条の学問の自由から導かれるものである。東大ポポロ事件（1963年）で最高裁は、実社会の政治的・社会的活動にあたる学生の集会は大学の自治の保障を受けないとした。学問の自由はすべての国民に保障される（教授の自由などは特に大学で重視される）。"},{"t":"tf","s":"学問の自由","imp":1,"q":"明治憲法は学問の自由を「法律ノ範囲内ニ於テ」保障していたため、法律にもとづいて滝川事件や天皇機関説事件のような学問への弾圧が行われた。","a":false,"e":"正しくは、明治憲法には学問の自由の規定そのものがなかった。滝川事件（京都帝国大学の滝川幸辰の刑法学説が問題視された）や天皇機関説事件（美濃部達吉の学説が排撃された）などの反省から、日本国憲法23条で学問の自由が明記された。"}]});</script>
<script>QDATA.push({"unit":"u07","questions":[{"t":"qa","s":"人身の自由","imp":1,"q":"次の日本国憲法第18条の（　）に入る語を答えよ。「何人も、いかなる（　）拘束も受けない。又、犯罪に因る処罰の場合を除いては、その意に反する苦役に服させられない。」","a":"奴隷的","e":"18条は人身の自由の基本を定める。明治憲法下では、治安維持法のもとで特別高等警察（特高）による拷問などの人権侵害が行われた。その反省から、日本国憲法は31条から40条で刑事手続について詳しく定めている。"},{"t":"qa","s":"人身の自由","imp":3,"q":"次の日本国憲法第31条の（　）に入る語を答えよ。「何人も、法律の定める（　）によらなければ、その生命若しくは自由を奪はれ、又はその他の刑罰を科せられない。」","a":"手続","alt":["手続き"],"e":"31条は法定手続の保障（適正手続の保障）を定める。アメリカのデュー・プロセス条項に由来し、手続が法律で定められているだけでなく、その内容も適正でなければならないと解される。罪刑法定主義の根拠ともされる。"},{"t":"ex","s":"人身の自由","imp":3,"q":"罪刑法定主義とは何か、説明せよ。","a":"罪刑法定主義とは、どのような行為が犯罪となり、それにどのような刑罰が科されるかを、あらかじめ法律で定めておかなければならないという原則である。国家による恣意的な処罰を防いで国民の自由を守るためのもので、日本国憲法では31条などが根拠とされ、遡及処罰の禁止（39条）もその内容に含まれる。","e":"ポイント：①犯罪と刑罰をあらかじめ法律で定める ②国家の恣意的な処罰の防止 ③根拠は31条 ④後から作った法律で処罰しない（遡及処罰の禁止、39条）。"},{"t":"qa","s":"人身の自由","imp":3,"q":"逮捕や住居の捜索・押収にあたって、原則として裁判官が発する令状を必要とする原則を何というか。","a":"令状主義","e":"33条（逮捕）と35条（住居の捜索・押収）が定める。33条は、現行犯として逮捕される場合を除いて、権限を有する司法官憲（裁判官）が発する令状がなければ逮捕されないとする。捜査機関による不当な逮捕や捜索を防ぐためのしくみである。"},{"t":"mc","s":"人身の自由","imp":2,"q":"次のうち、日本国憲法のもとで裁判官の発する令状がなくても行うことができるものとして最も適当なものを一つ選べ。","c":["目の前で万引きをした人を、警察官がその場で逮捕すること。","逮捕とは関係なく、警察官が犯罪の疑いのある人の自宅を本人の同意なく捜索すること。","警察官が、捜査に必要だとして、令状なしに私人の電話の通話内容を傍受すること。","検察官が自ら逮捕状を作成して、容疑者を逮捕すること。"],"a":0,"e":"現行犯逮捕は令状主義の例外として令状なしに行える（33条）。住居の捜索には令状が必要であり（35条）、通信傍受も通信傍受法にもとづく裁判官の令状が必要である。令状を発するのは司法官憲（裁判官）であり、検察官が自ら逮捕状を作成することはできない。"},{"t":"qa","s":"人身の自由","imp":2,"q":"刑事事件の被告人が貧困などの理由で自ら弁護人を依頼できないときに、国が費用を負担して付ける弁護人を何というか。","a":"国選弁護人","e":"37条3項は「被告人が自らこれを依頼することができないときは、国でこれを附する」と定める。2006年からは起訴される前の被疑者にも国選弁護制度が導入され、現在は勾留されたすべての被疑者が対象になっている。"},{"t":"qa","s":"人身の自由","imp":2,"q":"次の日本国憲法第36条の（　）に入る語を答えよ。「公務員による（　）及び残虐な刑罰は、絶対にこれを禁ずる。」","a":"拷問","e":"憲法の中でも「絶対に」という強い表現が使われている条文である。なお最高裁は1948年、死刑そのものは36条の「残虐な刑罰」にあたらないとしている。"},{"t":"qa","s":"人身の自由","imp":3,"q":"日本国憲法第38条1項の「何人も、自己に不利益な供述を強要されない」という規定によって保障される権利を一般に何というか。","a":"黙秘権","alt":["供述拒否権","自己負罪拒否特権"],"e":"被疑者や被告人は、取調べや法廷で自分に不利益なことを話さなくてよい。刑事訴訟法では、被疑者・被告人は終始沈黙することができると定められている。"},{"t":"tf","s":"人身の自由","imp":3,"q":"日本国憲法のもとでは、本人の自白が唯一の証拠である場合でも、その自白が任意になされたものであれば有罪とすることができる。","a":false,"e":"正しくは、38条3項により、自己に不利益な唯一の証拠が本人の自白である場合には、有罪とされない（自白以外の補強証拠が必要）。また38条2項により、強制・拷問・脅迫による自白や、不当に長く抑留・拘禁された後の自白は証拠とすることができない。"},{"t":"qa","s":"人身の自由","imp":3,"q":"行為をした時には適法であった行為を、後から制定した法律によって処罰することを禁止する原則を何というか。","a":"遡及処罰の禁止","alt":["事後法の禁止","刑罰不遡及の原則","遡及処罰禁止の原則"],"e":"39条前段が定める。行為の時点で犯罪とされていなかったことで後から処罰されるのでは、人々は安心して行動できないからである。罪刑法定主義の重要な内容の一つである。"},{"t":"qa","s":"人身の自由","imp":2,"q":"判決が確定した同一の事件について、再び審理して処罰することを許さないという刑事裁判の原則を何というか。","a":"一事不再理","alt":["一事不再理の原則","二重処罰の禁止"],"e":"39条が根拠である。無罪が確定した後に新たな証拠が見つかっても、再び起訴して有罪にすることはできない。一方、有罪が確定した人を救済するための再審は認められている（有罪とされた人に不利益な再審は認められない）。"},{"t":"mc","s":"人身の自由","imp":2,"q":"日本国憲法の人身の自由に関する規定の内容として適当でないものを一つ選べ。","c":["刑事被告人は、公平な裁判所の迅速な公開裁判を受ける権利を有する。","強制、拷問もしくは脅迫による自白は、これを証拠とすることができない。","何人も、理由を直ちに告げられ、かつ、直ちに弁護人に依頼する権利を与えられなければ、抑留又は拘禁されない。","重大な犯罪については、行為の後に制定された法律によって処罰することができる。"],"a":3,"e":"39条は、実行の時に適法であった行為について刑事上の責任を問わないとしており、犯罪の重大さにかかわらず遡及処罰は禁止されている。公平な裁判所の迅速な公開裁判を受ける権利は37条1項、強制などによる自白の証拠能力の否定は38条2項、理由の告知と弁護人依頼権がなければ抑留・拘禁されないことは34条の内容であり、いずれも正しい。"},{"t":"ex","s":"人身の自由","imp":2,"q":"取調べの可視化とは何か、導入された背景とあわせて説明せよ。","a":"取調べの可視化とは、警察や検察による被疑者の取調べの過程を録音・録画し、後から検証できるようにすることである。密室での取調べで自白が強要され冤罪が生まれたという反省から、2016年の刑事訴訟法改正（2019年施行）により、裁判員裁判の対象事件などについて、取調べの全過程の録音・録画が義務づけられた。","e":"ポイント：①取調べを録音・録画して検証可能にする ②密室での自白の強要・冤罪への反省 ③2016年改正・2019年施行 ④義務づけの対象は裁判員裁判対象事件と検察の独自捜査事件に限られ、全事件ではない。"},{"t":"ex","s":"再審と冤罪","imp":2,"q":"再審制度とは何か、冤罪との関係から説明せよ。","a":"再審とは、確定した有罪判決について、無罪を言い渡すべき明らかな新しい証拠が見つかった場合などに、裁判をやり直す制度である。罪を犯していないのに有罪とされた冤罪の被害者を救済するためのもので、有罪とされた人の利益のためにのみ認められる。","e":"ポイント：①確定判決のやり直し ②無罪を言い渡すべき明らかな新証拠が必要 ③冤罪被害者の救済が目的 ④有罪とされた人の利益のためだけに認められる（一事不再理との関係）。"},{"t":"qa","s":"再審と冤罪","imp":1,"q":"1975年に最高裁判所が、再審を開始するかどうかの判断にも「疑わしきは被告人の利益に」という刑事裁判の鉄則が適用されると示した決定を何というか。","a":"白鳥決定","e":"この決定によって再審の門戸が広がり、1980年代に死刑囚の再審無罪が相次いだ（免田事件・財田川事件・松山事件・島田事件）。決定のきっかけとなった白鳥事件自体では、再審は認められなかった。"},{"t":"tf","s":"再審と冤罪","imp":2,"q":"1980年代に、死刑判決が確定していた免田事件・財田川事件・松山事件・島田事件の4つの事件で、再審により無罪判決が出された。","a":true,"e":"正しい。免田事件（1983年）、財田川事件・松山事件（1984年）、島田事件（1989年）である。いずれも捜査段階での自白の強要などが問題となった。"},{"t":"mc","s":"再審と冤罪","imp":1,"q":"死刑判決が確定した後に、再審によって無罪となった事件として適当でないものを一つ選べ。","c":["足利事件","免田事件","島田事件","袴田事件"],"a":0,"e":"足利事件は、無期懲役が確定した後にDNA型の再鑑定で犯人ではないことが判明し、2010年に再審無罪となった事件であり、死刑判決の事件ではない。免田事件（1983年）・島田事件（1989年）・袴田事件（2024年）は、いずれも死刑確定後の再審無罪である。"},{"t":"qa","s":"再審と冤罪","imp":1,"q":"1990年に栃木県で起きた女児殺害事件で無期懲役が確定した男性が、DNA型の再鑑定によって犯人ではないことが判明し、2010年に再審無罪となった事件を何というか。","a":"足利事件","e":"捜査段階での精度の低いDNA型鑑定と、取調べでの自白の強要が冤罪を生んだ。この事件は、取調べの可視化を求める議論を後押しした。"},{"t":"qa","s":"再審と冤罪","imp":2,"q":"1966年に静岡県で起きた一家4人殺害事件で死刑が確定していた男性が、2024年に再審で無罪となった事件を何というか。","a":"袴田事件","e":"死刑確定後の再審無罪は、1980年代の4事件に続いて戦後5例目である。判決は、犯行着衣とされた衣類などの証拠を捜査機関がねつ造したと認定し、検察は控訴せず無罪が確定した。再審開始までに長い年月を要したことから、再審制度の見直しを求める声が強まった。"}]});</script>
<script>QDATA.push({"unit":"u07","questions":[{"t":"qa","s":"経済の自由","imp":3,"q":"次の日本国憲法第22条1項の（　）に入る語を答えよ。「何人も、公共の福祉に反しない限り、居住、移転及び（　）の自由を有する。」","a":"職業選択","e":"職業選択の自由には、選んだ職業を営む営業の自由も含まれると解されている。22条2項は、外国に移住する自由と国籍を離脱する自由を定める。経済の自由の規定には「公共の福祉」が明記されている点に注意。"},{"t":"qa","s":"経済の自由","imp":3,"q":"1975年に最高裁判所が、薬局の開設に既存の薬局からの距離制限を設けた法律の規定を、職業選択の自由を侵害するとして違憲とした判決を何というか。","a":"薬事法距離制限違憲判決","alt":["薬事法違憲判決","薬局距離制限違憲判決","薬事法距離制限規定違憲判決"],"e":"最高裁は、不良医薬品の供給を防いで国民の健康を守るという目的は正当だが、距離制限という手段は目的を達成するために必要かつ合理的とはいえないとした。尊属殺重罰規定違憲判決に続く、二つ目の法令違憲判決である。"},{"t":"ex","s":"経済の自由","imp":1,"q":"小売市場の距離制限は合憲とされ（1972年）、薬局の距離制限は違憲とされた（1975年）。最高裁判所の結論が分かれた理由を、規制の目的に注目して説明せよ。","a":"小売市場の距離制限は、経済的弱者である中小の小売商を保護する積極的な政策目的の規制であり、立法府の判断を尊重して、著しく不合理であることが明白でない限り合憲とされた。これに対し薬局の距離制限は、国民の健康を守る消極的な目的の規制であり、より緩やかな手段でも目的を達成できるため、必要かつ合理的とはいえず違憲とされた。","e":"ポイント：①積極目的規制（社会的・経済的弱者の保護）は緩やかに審査→小売市場は合憲 ②消極目的規制（国民の生命・健康の保護）はより厳しく審査 ③薬局の距離制限は必要性・合理性を欠く→違憲（規制目的二分論）。"},{"t":"qa","s":"経済の自由","imp":3,"q":"次の日本国憲法第29条3項の（　）に入る語句を答えよ。「私有財産は、（　）の下に、これを公共のために用ひることができる。」","a":"正当な補償","e":"道路やダムの建設などのため、土地収用法にもとづいて私有地を取得する場合などには、正当な補償が必要である。29条1項は「財産権は、これを侵してはならない」、2項は財産権の内容は公共の福祉に適合するように法律で定めるとしている。"},{"t":"qa","s":"経済の自由","imp":2,"q":"1987年に最高裁判所が、共有林の持分が2分の1以下の共有者による分割請求を認めない法律の規定を、財産権を侵害するとして違憲とした判決を何というか。","a":"森林法共有林分割制限違憲判決","alt":["森林法違憲判決","森林法共有林分割規定違憲判決","森林法共有林事件"],"e":"森林の細分化を防いで森林経営を安定させるという目的は正当だが、分割請求を一律に制限する手段は必要な限度を超えているとして、29条2項に違反するとした。判決後、森林法の規定は削除された。"},{"t":"mc","s":"経済の自由","imp":2,"q":"日本国憲法が定める経済の自由に関する記述として最も適当なものを一つ選べ。","c":["職業選択の自由には、自分が選んだ職業を営む営業の自由も含まれると解されている。","財産権は侵してはならないとされているので、公共のために私有財産を用いることは一切できない。","外国に移住する自由は保障されているが、日本国籍を離脱する自由は保障されていない。","経済の自由を規制する法律は、精神の自由を規制する法律よりも厳格な基準で違憲審査が行われる。"],"a":0,"e":"営業の自由は職業選択の自由に含まれると解されている。29条3項により、正当な補償があれば私有財産を公共のために用いることができる。22条2項は外国移住の自由と国籍離脱の自由の両方を保障している。経済の自由の規制は、精神の自由の規制よりも緩やかな基準で審査されるとされる（二重の基準）。"},{"t":"qa","s":"社会権","imp":3,"q":"次の日本国憲法第25条1項の（　）に入る語を答えよ。「すべて国民は、（　）で文化的な最低限度の生活を営む権利を有する。」","a":"健康","e":"25条1項が定める権利を生存権といい、社会権の中心となる。2項は、国はすべての生活部面について社会福祉・社会保障・公衆衛生の向上及び増進に努めなければならないとする。社会権を初めて本格的に規定した憲法は、1919年のドイツのワイマール憲法である。"},{"t":"ex","s":"社会権","imp":3,"q":"生存権をめぐるプログラム規定説と法的権利説の違いを説明せよ。","a":"プログラム規定説は、25条は国の政治的・道義的な努力目標を示したにすぎず、個々の国民に裁判で請求できる具体的な権利を保障したものではないとする考え方である。法的権利説は、25条は国民に法的な権利を保障しており、国はそれを実現する法的な義務を負うとする考え方である。最高裁は朝日訴訟・堀木訴訟で前者に近い立場をとった。","e":"ポイント：①プログラム規定説＝国の努力目標にすぎず具体的な権利ではない ②法的権利説＝国民の法的権利であり国に法的義務がある ③判例は立法府・行政の広い裁量を認め、プログラム規定説に近い。"},{"t":"qa","s":"社会権","imp":3,"q":"結核で国立療養所に入所していた男性が、生活保護の基準が低すぎて健康で文化的な最低限度の生活を営むことができないとして、1957年に国を相手に起こした訴訟を何というか。","a":"朝日訴訟","e":"第一審（1960年）は原告勝訴だったが、第二審で敗訴した。上告中に原告が死亡したため最高裁は1967年に訴訟は終了したとし、そのうえで、何が健康で文化的な最低限度の生活かの判断は厚生大臣の裁量にゆだねられているとの見解を示した。「人間裁判」と呼ばれ、生活保護基準の改善につながった。"},{"t":"qa","s":"社会権","imp":2,"q":"視覚障害のある母子家庭の母親が、障害福祉年金と児童扶養手当の併給を禁止する規定は憲法25条・14条に反するとして争い、1982年に最高裁判所が立法府の広い裁量を認めて合憲とした訴訟を何というか。","a":"堀木訴訟","e":"最高裁は、25条を具体化する立法は立法府の広い裁量にゆだねられており、それが著しく合理性を欠き明らかに裁量の逸脱・濫用と見ざるをえない場合を除き、裁判所が審査判断するのに適しないとした。"},{"t":"mc","s":"社会権","imp":3,"q":"生存権をめぐる訴訟に関する記述として最も適当なものを一つ選べ。","c":["堀木訴訟で最高裁判所は、社会保障制度の具体的な内容は立法府の広い裁量にゆだねられているとして、年金と手当の併給禁止を合憲とした。","朝日訴訟で最高裁判所は、生活保護の基準が低すぎることは憲法25条に違反するとして、原告の請求を認めた。","朝日訴訟の第一審判決は、生活保護の基準は厚生大臣の裁量に属するとして、原告の請求を退けた。","最高裁判所は、憲法25条は国民に具体的な請求権を保障しているので、法律がなくても国に直接給付を請求できるとした。"],"a":0,"e":"堀木訴訟（1982年）の記述は正しい。朝日訴訟の最高裁判決（1967年）は、原告の死亡により訴訟は終了したとしたうえで厚生大臣の裁量を認めたので、請求を認めたとする記述は誤り。朝日訴訟の第一審（1960年）は原告勝訴だったので、請求を退けたとする記述も誤り。最高裁は25条から直接に具体的な請求権が生じるとはしていない。"},{"t":"mc","s":"社会権","imp":3,"q":"次の事例のうち、社会権の保障にもとづくものとして最も適当なものを一つ選べ。","c":["失業して収入がなくなった人が、生活保護を申請して生活費の支給を受ける。","新聞社が、政府の政策を批判する記事を掲載する。","市民が、市長選挙に立候補する。","無実の罪で拘禁された後に無罪となった人が、国に補償を求める。"],"a":0,"e":"生活保護の受給は、25条の生存権（社会権）にもとづく。政府を批判する記事の掲載は表現の自由（自由権）、選挙への立候補は参政権、無罪となった人が補償を求めるのは40条の刑事補償請求権（請求権）にあたる。"},{"t":"qa","s":"社会権","imp":3,"q":"次の日本国憲法第26条2項の（　）に入る語を答えよ。「すべて国民は、法律の定めるところにより、その保護する子女に普通教育を受けさせる義務を負ふ。義務教育は、これを（　）とする。」","a":"無償","e":"26条1項は、すべて国民が「その能力に応じて、ひとしく教育を受ける権利」を有すると定める。2項の前段は、子どもに普通教育を受けさせる保護者の義務であり、国民の三大義務の一つである。"},{"t":"tf","s":"社会権","imp":1,"q":"最高裁判所は、日本国憲法26条2項の「義務教育は、これを無償とする」という規定について、授業料だけでなく教科書代などの費用もすべて無償とすることを国に義務づけたものだと解している。","a":false,"e":"正しくは、最高裁（1964年）は、ここでいう無償とは授業料を徴収しないことを意味するとした。現在、義務教育の教科書が無償で配られているのは、憲法の直接の要請ではなく、法律にもとづく措置である。"},{"t":"qa","s":"社会権","imp":3,"q":"日本国憲法第28条が保障する、団結権・団体交渉権・団体行動権（争議権）の3つの権利をまとめて何というか。","a":"労働三権","alt":["労働基本権"],"e":"27条の勤労の権利と28条の労働三権をあわせて労働基本権と呼ぶ。労働者は使用者に対して弱い立場にあるため、団結して対等な立場で交渉できるよう保障したものである。公務員の労働基本権の制限など、詳しくは労働問題の単元で学ぶ。"}]});</script>
<script>QDATA.push({"unit":"u07","questions":[{"t":"qa","s":"参政権","imp":3,"q":"次の日本国憲法第15条1項の（　）に入る語を答えよ。「公務員を選定し、及びこれを罷免することは、国民（　）の権利である。」","a":"固有","e":"15条は参政権の根拠となる条文である。2項は「すべて公務員は、全体の奉仕者であつて、一部の奉仕者ではない」、3項は成年者による普通選挙の保障、4項は投票の秘密を定める。"},{"t":"mc","s":"参政権","imp":3,"q":"日本国憲法が定める、国民や住民が直接に投票して意思を示す制度として適当でないものを一つ選べ。","c":["内閣総理大臣を選ぶための国民投票","最高裁判所裁判官の国民審査","憲法改正の国民投票","一つの地方公共団体のみに適用される特別法の住民投票"],"a":0,"e":"内閣総理大臣は国会議員の中から国会の議決で指名される（67条）ので、首相を選ぶ国民投票の制度はない。最高裁判所裁判官の国民審査は79条、憲法改正の国民投票は96条、地方特別法の住民投票は95条に定められており、いずれも参政権の一つである。"},{"t":"qa","s":"参政権","imp":1,"q":"次の日本国憲法第95条の（　）に入る語を答えよ。「一の地方公共団体のみに適用される特別法は、法律の定めるところにより、その地方公共団体の住民の投票においてその（　）の同意を得なければ、国会は、これを制定することができない。」","a":"過半数","e":"地方特別法の住民投票の規定である。1949年の広島平和記念都市建設法などがこの手続きで制定された。国会が唯一の立法機関であることの例外の一つでもある。"},{"t":"mc","s":"参政権","imp":2,"q":"海外に住む日本国民（在外日本人）の選挙権に関する記述として最も適当なものを一つ選べ。","c":["最高裁判所は2005年、在外日本人の投票を比例代表選挙に限っていた公職選挙法の規定を違憲とし、その後の法改正で選挙区選挙でも投票できるようになった。","在外日本人は日本国内に住所がないため、現在も国政選挙で投票することはできない。","最高裁判所は2005年、在外日本人の選挙権をどこまで認めるかは国会の広い裁量にゆだねられるとして、公職選挙法の規定を合憲とした。","在外日本人選挙権制限違憲判決は、最高裁判所が初めて法律の規定を違憲とした判決である。"],"a":0,"e":"在外投票は1998年の法改正で比例代表選挙に限って認められたが、2005年に最高裁は選挙区選挙で投票できないことを違憲とし、2006年の法改正で選挙区選挙も対象となった。在外日本人も国政選挙で投票できる。最高裁は合憲とはしていない。初めての法令違憲判決は1973年の尊属殺重罰規定違憲判決である。"},{"t":"tf","s":"参政権","imp":2,"q":"最高裁判所は2022年、海外に住む日本国民が最高裁判所裁判官の国民審査に投票できないことは憲法に違反すると判断した。","a":true,"e":"正しい。在外国民審査違憲判決である。最高裁は、国民審査法が在外国民に審査権の行使を認めていないことは、15条1項、79条2項・3項に違反するとした。判決を受けて同年に国民審査法が改正された。"},{"t":"tf","s":"参政権","imp":1,"q":"日本国憲法は、選挙権を18歳以上の国民に与えることを条文で明記している。","a":false,"e":"正しくは、憲法15条3項は「成年者による普通選挙」を保障しているが、具体的な選挙権年齢は法律（公職選挙法）で定められている。2015年の公職選挙法改正（2016年施行）で、選挙権年齢は20歳以上から18歳以上に引き下げられた。"},{"t":"mc","s":"請求権","imp":2,"q":"日本国憲法が保障する請求権（国務請求権）に関する記述として最も適当なものを一つ選べ。","c":["請願権は「何人も」もつとされ、請願をしたことを理由に差別待遇を受けることはない。","国家賠償請求権は、公務員の不法行為による損害について、公務員個人に対してのみ賠償を求める権利である。","刑事補償請求権は、有罪判決が確定した人が、刑の執行によって受けた損害の補償を国に求める権利である。","裁判を受ける権利は日本国民にのみ保障され、外国人には保障されていない。"],"a":0,"e":"16条は「何人も」平穏に請願する権利を有し、請願をしたために差別待遇を受けないと定める。国家賠償請求権（17条）は国または公共団体に賠償を求める権利である。刑事補償請求権（40条）は抑留・拘禁された後に無罪の裁判を受けた人の権利である。裁判を受ける権利（32条）も「何人も」とされ、外国人にも保障される。"},{"t":"qa","s":"請求権","imp":3,"q":"公務員の不法行為によって損害を受けた人が、国や地方公共団体に賠償を求めることができる権利を何というか。","a":"国家賠償請求権","alt":["国家賠償請求","国家賠償を求める権利"],"e":"17条が保障し、国家賠償法によって具体化されている。警察官の違法な暴行や、公立学校での教員の過失による事故などで損害を受けた場合に、国や地方公共団体に賠償を求めることができる。"},{"t":"tf","s":"請求権","imp":2,"q":"2002年の郵便法違憲判決で最高裁判所は、郵便業務従事者の故意や重大な過失による損害についてまで国の賠償責任を免除・制限していた郵便法の規定を、憲法17条に違反するとした。","a":true,"e":"正しい。書留郵便物などについて国の損害賠償責任を過度に制限することは、17条の国家賠償請求権を侵害するとされた。判決を受けて郵便法が改正された。"},{"t":"qa","s":"請求権","imp":2,"q":"次の日本国憲法第40条の（　）に入る語を答えよ。「何人も、抑留又は拘禁された後、無罪の裁判を受けたときは、法律の定めるところにより、国にその（　）を求めることができる。」","a":"補償","e":"40条の権利を刑事補償請求権といい、刑事補償法で具体化されている。国家賠償と異なり、捜査機関の故意や過失を証明する必要はない。冤罪で長期間拘禁された人などの救済に関わる。"},{"t":"mc","s":"請求権","imp":3,"q":"次の事例と、それにかかわる日本国憲法上の権利の組合せとして最も適当なものを一つ選べ。","c":["警察官の違法な暴行でけがをした人が、県に損害賠償を求めることは、国家賠償請求権の行使にあたる。","再審で無罪が確定した人が、拘禁されていた期間について国に補償を求めることは、請願権の行使にあたる。","住民が、市に対して公園の整備を求める署名を提出することは、刑事補償請求権の行使にあたる。","会社から不当に解雇された人が、裁判所に訴えを起こすことは、国家賠償請求権の行使にあたる。"],"a":0,"e":"公務員である警察官の不法行為による損害の賠償を県に求めるのは、17条の国家賠償請求権である。無罪確定後に拘禁の補償を求めるのは40条の刑事補償請求権、公園整備を求める署名の提出は16条の請願権、解雇をめぐって訴えを起こすのは32条の裁判を受ける権利にあたる。"},{"t":"tf","s":"請求権","imp":1,"q":"明治憲法のもとでも、国は公務員の権力的な活動によって国民に生じた損害について広く賠償責任を負っており、日本国憲法17条はそれを引き継いだものである。","a":false,"e":"正しくは、明治憲法のもとでは、国の権力的な活動による損害について国は賠償責任を負わないとされていた（国家無答責）。日本国憲法17条で国家賠償請求権が保障され、1947年に国家賠償法が制定された。"},{"t":"mc","s":"新しい人権と環境権","imp":2,"q":"新しい人権と、その主な根拠とされる日本国憲法の条文の組合せとして最も適当なものを一つ選べ。","c":["知る権利は、主に21条（表現の自由）を根拠とする。","環境権は、主に22条（居住・移転の自由）を根拠とする。","プライバシーの権利は、主に25条（生存権）を根拠とする。","自己決定権は、主に20条（信教の自由）を根拠とする。"],"a":0,"e":"知る権利は21条の表現の自由を情報の受け手の側からとらえ直したものである。環境権は13条（幸福追求権）と25条（生存権）、プライバシーの権利と自己決定権は13条（幸福追求権）を主な根拠とする。"},{"t":"ex","s":"新しい人権と環境権","imp":3,"q":"環境権とは何か、その根拠と裁判所での扱いにふれて説明せよ。","a":"環境権とは、良好な環境を享受し、それを支配する権利であり、高度経済成長期の公害の深刻化を背景に主張されるようになった。憲法13条の幸福追求権と25条の生存権が根拠とされる。しかし、大阪空港公害訴訟などでも最高裁は環境権を認めておらず、1993年の環境基本法にも明記されていない。","e":"ポイント：①良好な環境を享受する権利 ②公害問題が背景 ③根拠は13条・25条 ④最高裁は認めておらず、環境基本法にも明記されていない。"},{"t":"qa","s":"新しい人権と環境権","imp":3,"q":"空港周辺の住民が航空機の騒音などによる被害を理由に夜間の飛行差し止めと損害賠償を求め、1981年に最高裁判所が過去の損害に対する賠償は認めたが、差し止めの請求は退けた訴訟を何というか。","a":"大阪空港公害訴訟","alt":["大阪空港訴訟","大阪国際空港公害訴訟","大阪空港騒音訴訟"],"e":"第二審の大阪高裁（1975年）は人格権にもとづいて夜間飛行の差し止めを認めたが、最高裁は差し止め請求を不適法として却下した。原告側が主張した環境権について、最高裁は判断を示さなかった。"},{"t":"qa","s":"知る権利","imp":3,"q":"行政機関が保有する情報について、誰でも開示を請求できることを定め、1999年に制定（2001年施行）された法律を何というか。","a":"情報公開法","alt":["行政機関の保有する情報の公開に関する法律"],"e":"情報公開の取組は地方が先行し、1982年に山形県金山町が全国で初めて情報公開条例を制定した。情報公開法では、個人情報や国の安全にかかわる情報などは不開示とすることができる。"},{"t":"tf","s":"知る権利","imp":1,"q":"情報公開法は、その目的として国民の「知る権利」を保障することを条文に明記している。","a":false,"e":"正しくは、情報公開法の目的規定には「国民主権の理念」や、政府がその諸活動を国民に説明する責務（説明責任、アカウンタビリティ）が掲げられているが、「知る権利」は明記されていない。なお、開示請求は「何人も」でき、外国人も請求できる。"},{"t":"ex","s":"知る権利","imp":2,"q":"知る権利とは何か、表現の自由との関係から説明せよ。","a":"知る権利とは、国民が情報を自由に受け取り、また国や地方公共団体などが持つ情報の公開を求める権利である。マスメディアが発達して情報の送り手と受け手が分かれた現代社会で、表現の自由を情報の受け手の側からとらえ直したものとして、21条を根拠に主張されるようになった。国民が主権者として政治に参加する前提となる。","e":"ポイント：①情報を受け取る自由と公開を求める権利 ②情報の送り手と受け手の分離 ③21条（表現の自由）が根拠 ④国民主権・民主政治の前提（情報公開制度で具体化）。"}]});</script>
<script>QDATA.push({"unit":"u07","questions":[{"t":"ex","s":"プライバシーの権利","imp":3,"q":"プライバシーの権利の内容は、情報化社会の進展とともにどのように変化してきたか、説明せよ。","a":"プライバシーの権利は、当初「私生活をみだりに公開されない権利」として主張され、「宴のあと」事件の判決（1964年）で認められた。その後、行政や企業が大量の個人情報を収集・利用する情報化社会になると、自分に関する情報を自分で管理・コントロールする権利（自己情報コントロール権）として、より積極的にとらえられるようになった。","e":"ポイント：①私生活をみだりに公開されない権利（「宴のあと」事件） ②情報化社会での個人情報の大量の収集・利用 ③自己情報コントロール権へ ④個人情報保護法などで具体化。根拠は13条（幸福追求権）。"},{"t":"qa","s":"プライバシーの権利","imp":3,"q":"個人情報を取り扱う事業者に、利用目的の特定や、本人の同意のない第三者への提供の制限などの義務を課し、2003年に制定された法律を何というか。","a":"個人情報保護法","alt":["個人情報の保護に関する法律"],"e":"2005年に全面施行された。2015年の改正で監督機関として個人情報保護委員会が設置され、2021年の改正では行政機関や地方公共団体などのルールもこの法律に一本化された。"},{"t":"mc","s":"プライバシーの権利","imp":3,"q":"プライバシーや知る権利にかかわる法律・制度に関する記述として最も適当なものを一つ選べ。","c":["特定秘密保護法は、防衛や外交などに関する情報のうち特に秘匿が必要なものを行政機関の長が特定秘密に指定し、その漏えいを処罰する法律である。","通信傍受法は、捜査機関が裁判官の令状なしに、あらゆる犯罪の捜査のために電話などの通信を傍受することを認めている。","マイナンバー制度について、最高裁判所はプライバシーの権利を侵害するとして違憲と判断した。","住民基本台帳ネットワークシステムについて、最高裁判所はプライバシーの権利を侵害するとして違憲と判断した。"],"a":0,"e":"特定秘密保護法（2013年制定）の説明として正しい。通信傍受法は裁判官の発する令状が必要で、対象となる犯罪も限定されている。最高裁は、住民基本台帳ネットワークシステム（住基ネット）を2008年に、マイナンバー制度を2023年に、いずれもプライバシーの権利を侵害しないとして合憲と判断している。"},{"t":"ex","s":"プライバシーの権利","imp":1,"q":"特定秘密保護法とはどのような法律か、どのような批判があるかとあわせて説明せよ。","a":"特定秘密保護法は、防衛・外交・特定有害活動（スパイ活動など）の防止・テロリズムの防止の4分野の情報のうち、特に秘匿が必要なものを行政機関の長が特定秘密に指定し、漏えいを重く処罰する法律である。何を秘密とするかを行政が判断するため秘密の範囲が広がるおそれがあり、国民の知る権利や報道の自由を侵害しかねないと批判されている。","e":"ポイント：①2013年制定 ②4分野の情報を行政機関の長が特定秘密に指定 ③漏えいには最高で10年の拘禁刑 ④秘密の範囲の拡大のおそれ、知る権利・報道の自由・取材活動への影響が懸念される。"},{"t":"qa","s":"プライバシーの権利","imp":1,"q":"組織的な犯罪の捜査のため、裁判官の令状にもとづいて捜査機関が電話などの通信を傍受することを認めた、1999年に制定された法律を何というか。","a":"通信傍受法","alt":["犯罪捜査のための通信傍受に関する法律"],"e":"当初、対象は薬物・銃器・集団密航・組織的殺人の4類型の犯罪に限られていたが、2016年の改正で詐欺や窃盗などにも広げられた。憲法21条2項の通信の秘密やプライバシーの権利との関係が問題とされる。"},{"t":"qa","s":"プライバシーの権利","imp":1,"q":"自分の顔や姿をみだりに撮影されたり、その写真を勝手に公表されたりしない権利を何というか。","a":"肖像権","e":"プライバシーの権利の一つとされる。最高裁は京都府学連事件（1969年）で、何人も承諾なしにみだりにその容ぼう・姿態を撮影されない自由を有するとした。インターネット上への写真の無断投稿なども、肖像権の侵害となりうる。"},{"t":"ex","s":"プライバシーの権利","imp":1,"q":"忘れられる権利とは何か、日本の裁判所での扱いにもふれて説明せよ。","a":"忘れられる権利とは、インターネット上に残り続ける自分の過去の情報について、検索サービスの事業者などに削除を求める権利である。EUでは一般データ保護規則（GDPR）で明文化された。日本の最高裁は2017年、この言葉は用いずに、事実を公表されない利益が情報を提供する理由に優越することが明らかな場合には検索結果の削除を求められるとした。","e":"ポイント：①ネット上に残る過去の個人情報の削除を求める権利 ②EUではGDPRで明文化 ③日本の法律に明文はない ④2017年の最高裁決定は利益の比較で判断（その事案では削除を認めず）。"},{"t":"qa","s":"自己決定権とアクセス権","imp":3,"q":"宗教上の信念から輸血を拒否する意思を明確に示していた患者に対し、医師が十分な説明をしないまま手術中に輸血を行い、2000年に最高裁判所が患者の意思決定をする権利を侵害したとして損害賠償を認めた事件を何というか。","a":"エホバの証人輸血拒否事件","alt":["エホバの証人輸血拒否訴訟","エホバの証人訴訟","輸血拒否事件"],"e":"最高裁は、輸血を伴う医療行為を拒否するという意思決定をする権利は、人格権の一内容として尊重されなければならないとした。自己決定権が問題となった代表的な事例であり、十分な説明と同意にもとづく医療（インフォームド・コンセント）の重要性を示した。"},{"t":"ex","s":"自己決定権とアクセス権","imp":2,"q":"自己決定権とは何か、具体例を挙げて説明せよ。","a":"自己決定権とは、個人が自分の生き方や生活にかかわる重要な事柄について、公権力などから干渉されずに自分で決定する権利であり、13条の幸福追求権を根拠とする。例えば、医師から十分な説明を受けたうえで治療方法を選ぶことや、延命治療を受けるかどうかを決めること、臓器提供の意思を示すことなどがあげられる。","e":"ポイント：①自分の生き方にかかわる事柄を自分で決める権利 ②13条（幸福追求権）が根拠 ③医療の場面（インフォームド・コンセント、延命治療、臓器提供）でとくに問題になる ④エホバの証人輸血拒否事件。"},{"t":"mc","s":"自己決定権とアクセス権","imp":2,"q":"アクセス権（反論権）に関する記述として最も適当なものを一つ選べ。","c":["アクセス権とは、国民がマスメディアに対して、意見広告や反論記事の掲載などを求める権利である。","サンケイ新聞事件で最高裁判所は、新聞の意見広告で批判された政党に、同じスペースで反論文を無料で掲載させる権利を認めた。","アクセス権とは、国民が行政機関に対して、その保有する情報の公開を求める権利である。","アクセス権は、日本国憲法21条に明文で規定されている。"],"a":0,"e":"アクセス権は、巨大化したマスメディアに国民が意見を発表する場を求める権利である。サンケイ新聞事件（1987年）で最高裁は、具体的な法律がないのに反論文の掲載請求権を認めることはできず、認めれば新聞の表現の自由を萎縮させるおそれがあるとして請求を退けた。行政機関に情報の公開を求めるのは知る権利（情報公開請求権）である。アクセス権は憲法に明文の規定はない。"},{"t":"qa","s":"国民の義務","imp":3,"q":"日本国憲法が定める国民の三大義務を3つ答えよ。","a":"子どもに普通教育を受けさせる義務・勤労の義務・納税の義務","alt":["普通教育を受けさせる義務・勤労の義務・納税の義務","教育を受けさせる義務・勤労の義務・納税の義務","教育の義務・勤労の義務・納税の義務"],"e":"26条2項（保護する子女に普通教育を受けさせる義務）、27条1項（勤労の義務）、30条（納税の義務）である。「教育を受ける義務」ではなく、保護者が子どもに「受けさせる」義務である点に注意。明治憲法では兵役の義務と納税の義務が定められていた。"},{"t":"tf","s":"国民の義務","imp":3,"q":"日本国憲法は、すべての国民に対して憲法を尊重し擁護する義務を課しており、これは国民の三大義務と並ぶ重要な義務とされている。","a":false,"e":"正しくは、99条で憲法尊重擁護義務を負うのは、天皇・摂政・国務大臣・国会議員・裁判官その他の公務員であり、国民は挙げられていない。憲法は国家権力を制限するためのものであるという立憲主義の考え方にもとづく。"},{"t":"ex","s":"国民の義務","imp":1,"q":"日本国憲法で国民の義務に関する規定が権利の規定に比べて少ない理由を、立憲主義の考え方から説明せよ。","a":"立憲主義のもとで、憲法は国家権力を制限して国民の権利を保障するためのものであり、国民に義務を課すことを主な目的とはしていない。そのため日本国憲法は、権利を詳しく定める一方で、国民の義務は教育・勤労・納税の三つにとどめ、憲法を尊重し擁護する義務も国民ではなく公務員などに課している。","e":"ポイント：①憲法は国家権力を縛るもの（立憲主義） ②国民の義務は三大義務に限られる ③憲法尊重擁護義務（99条）を負うのは公務員など。"},{"t":"ex","s":"違憲判決の整理","imp":2,"q":"最高裁判所の違憲判断のうち、法令違憲と、国や地方公共団体の行為を違憲とする判断の違いを、例を挙げて説明せよ。","a":"法令違憲とは、法律の規定そのものを憲法に違反するとする判断であり、尊属殺重罰規定違憲判決や薬事法距離制限違憲判決などがある。これに対し、愛媛玉串料訴訟や空知太神社訴訟のように、法律ではなく公金の支出や公有地の無償提供といった具体的な行為を違憲とする判断もある。法令違憲の判決が出ると、国会は法改正などの対応を迫られる。","e":"ポイント：①法令違憲＝法律の規定そのものが違憲 ②行為の違憲＝公金支出などの具体的な行為が違憲（政教分離訴訟） ③法令違憲判決は非常に少ない ④判決を受けて国会が法改正・規定の削除を行う。"},{"t":"mc","s":"違憲判決の整理","imp":3,"q":"最高裁判所が法律の規定そのものを違憲とした判決（法令違憲判決）として適当でないものを一つ選べ。","c":["愛媛玉串料訴訟の判決","郵便法違憲判決","在外国民審査違憲判決","森林法共有林分割制限違憲判決"],"a":0,"e":"愛媛玉串料訴訟（1997年）は、県による玉串料の公金支出という行為を違憲としたもので、法律の規定を違憲としたものではない。郵便法違憲判決（2002年）、在外国民審査違憲判決（2022年）、森林法共有林分割制限違憲判決（1987年）は、いずれも法律の規定を違憲とした法令違憲判決である。"},{"t":"mc","s":"違憲判決の整理","imp":1,"q":"次の最高裁判所の法令違憲判決を古いものから順に並べたとき、3番目にくるものとして最も適当なものを一つ選べ。","c":["薬事法距離制限違憲判決","尊属殺重罰規定違憲判決","郵便法違憲判決","国籍法違憲判決"],"a":2,"e":"尊属殺重罰規定違憲判決（1973年）→薬事法距離制限違憲判決（1975年）→郵便法違憲判決（2002年）→国籍法違憲判決（2008年）の順である。1970年代の2件が最初の法令違憲判決であり、2000年代以降に法令違憲判決が増えている。"},{"t":"mc","s":"違憲判決の整理","imp":2,"q":"最高裁判所が憲法に違反しないと判断したものとして最も適当なものを一つ選べ。","c":["障害福祉年金と児童扶養手当の併給を禁止した法律の規定（堀木訴訟）","愛媛県による靖国神社などへの玉串料の公金支出（愛媛玉串料訴訟）","薬局の開設に距離制限を設けた薬事法の規定","書留郵便物などの損害について国の賠償責任を免除・制限した郵便法の規定"],"a":0,"e":"堀木訴訟（1982年）で最高裁は、立法府の広い裁量を認めて併給禁止規定を合憲とした。愛媛玉串料訴訟（1997年）、薬事法距離制限（1975年）、郵便法（2002年）はいずれも違憲とされた。このほか津地鎮祭訴訟、夫婦同氏規定、住基ネットなども合憲とされている。"},{"t":"tf","s":"違憲判決の整理","imp":1,"q":"最高裁判所の法令違憲判決は1973年の尊属殺重罰規定違憲判決が最初であり、その後も数は少なく、2024年の旧優生保護法違憲判決までで十数件にとどまる。","a":true,"e":"正しい。2024年の旧優生保護法違憲判決は13件目の法令違憲判決である。さらに2026年2月には、被保佐人（成年後見制度の利用者）であることを警備員の欠格事由としていた旧警備業法の規定を、職業選択の自由（22条1項）と法の下の平等（14条1項）に反するとした14件目の法令違憲判決が出された。違憲判断に慎重な日本の裁判所の姿勢は司法消極主義と呼ばれる。"}]});</script>
<script>QDATA.push({"unit":"u08","questions":[{"t":"qa","s":"国会の地位","imp":3,"q":"日本国憲法第41条「国会は、国権の（　）であつて、国の唯一の立法機関である。」の空欄に入る語を答えよ。","a":"最高機関","e":"国会は主権者である国民が選んだ議員で組織されるため、国政の中心に位置づけられている。ただし「国権の最高機関」は、国会の重要性を強調した政治的美称と解するのが通説である。"},{"t":"tf","s":"国会の地位","imp":3,"q":"日本国憲法が国会を「国権の最高機関」としているのは、国会が内閣や裁判所を指揮監督し、その判断を取り消すことができるという意味である。","a":false,"e":"誤り。正しくは、国民の代表機関として国政の中心にあることを強調した政治的美称と解されている。三権分立のもとで、国会が制定した法律も裁判所の違憲審査を受け、衆議院は内閣による解散を受けることがある。"},{"t":"qa","s":"国会の地位","imp":2,"q":"国会が「唯一の立法機関」であることの意味のうち、国会以外の機関が法律を制定することは原則として認められないとする原則を何というか。","a":"国会中心立法の原則","alt":["国会中心立法"],"e":"例外として、両議院の規則制定権と最高裁判所の規則制定権が憲法で認められている。また、内閣の政令や地方公共団体の条例も、憲法や法律の範囲内で定めることができる。"},{"t":"qa","s":"国会の地位","imp":1,"q":"法律は国会の議決だけで成立し、他の機関の関与を必要としないとする原則を何というか。","a":"国会単独立法の原則","alt":["国会単独立法"],"e":"例外は、一つの地方公共団体だけに適用される特別法（地方特別法）で、その地方公共団体の住民投票で過半数の同意を得なければ国会は制定できない（95条）。"},{"t":"mc","s":"国会の地位","imp":1,"q":"国会以外の機関が日本国憲法に基づいて定めることのできるきまりに関する記述として適当でないものを一つ選べ。","c":["衆議院と参議院は、それぞれ会議の手続や内部の規律に関する規則を定めることができる。","最高裁判所は、訴訟に関する手続などについて規則を定めることができる。","地方公共団体は、法律の範囲内で条例を制定することができる。","内閣は、法律の委任がなくても、罰則を設けた政令を制定することができる。"],"a":3,"e":"政令に罰則を設けるには法律の特別の委任が必要である（73条6号ただし書）ので、「法律の委任がなくても罰則を設けた政令を制定できる」が誤り。議院規則（58条2項）、最高裁判所規則（77条）、条例（94条）は、いずれも憲法に根拠をもつ。"},{"t":"qa","s":"二院制","imp":3,"q":"衆議院議員の任期は何年か。","a":"4年","alt":["四年","4年間"],"e":"ただし衆議院が解散されると、任期の途中でも議員の身分を失う。参議院議員の任期は6年で、3年ごとに半数を改選し、解散はない。"},{"t":"qa","s":"二院制","imp":3,"q":"参議院議員の被選挙権は満何歳以上か。","a":"満30歳以上","alt":["30歳","30歳以上","満30歳"],"e":"衆議院議員の被選挙権は満25歳以上である。選挙権は衆議院・参議院ともに満18歳以上である。"},{"t":"mc","s":"二院制","imp":2,"q":"日本の衆議院と参議院に関する記述として最も適当なものを一つ選べ。","c":["衆議院議員の任期は6年であるが、解散によって任期が短くなることがある。","参議院議員の被選挙権は、衆議院議員と同じく満25歳以上である。","参議院議員の選挙は3年ごとに行われ、そのたびに全議員が改選される。","衆議院議員の総選挙は、任期満了のほか、衆議院の解散によっても行われる。"],"a":3,"e":"衆議院議員の総選挙は、任期満了（4年）または解散によって行われる。衆議院議員の任期は4年（6年は参議院議員）、参議院議員の被選挙権は満30歳以上、参議院は3年ごとに半数を改選するので、他の選択肢は誤り。2026年時点の議員定数は、衆議院465人（小選挙区289・比例代表176）、参議院248人（選挙区148・比例代表100）である。"},{"t":"ex","s":"二院制","imp":2,"q":"日本の国会が二院制（両院制）をとっている理由を、参議院に期待される役割にふれて説明せよ。","a":"一つの議院だけでは、審議が不十分なまま、そのときの多数派の意思だけで法律などが決まってしまうおそれがある。そこで、任期が6年と長く解散もない参議院が、衆議院とは異なる立場から慎重に審議し、衆議院の行き過ぎを抑えたり不十分な点を補ったりすることが期待されている。","e":"ポイント：①審議を慎重にし、一時的な多数派の暴走を防ぐ ②衆議院の抑制・補完（参議院は「良識の府」とよばれる） ③任期6年・解散なしで長期的な視点に立てる ④多様な民意の反映"},{"t":"qa","s":"衆議院の優越","imp":3,"q":"衆議院で可決し、参議院でこれと異なった議決をした法律案は、衆議院で出席議員の何分の何以上の多数で再び可決したとき法律となるか。","a":"3分の2以上","alt":["3分の2","三分の二","三分の二以上","2/3"],"e":"憲法59条2項の規定である。「総議員」ではなく「出席議員」の3分の2以上である点に注意する。"},{"t":"qa","s":"衆議院の優越","imp":3,"q":"参議院が、衆議院の可決した法律案を受け取った後、国会休会中の期間を除いて何日以内に議決しないとき、衆議院は参議院がその法律案を否決したものとみなすことができるか。","a":"60日","alt":["60日以内","六十日"],"e":"否決とみなした後、衆議院が出席議員の3分の2以上で再可決すれば法律となる（59条4項）。予算・条約の30日、首相指名の10日と区別して覚える。"},{"t":"qa","s":"衆議院の優越","imp":3,"q":"参議院が、衆議院の可決した予算を受け取った後、国会休会中の期間を除いて何日以内に議決しないとき、衆議院の議決が国会の議決となるか。","a":"30日","alt":["30日以内","三十日"],"e":"憲法60条2項の規定で、予算の自然成立とよばれる。条約の承認にも同じ規定が準用される（61条）。"},{"t":"qa","s":"衆議院の優越","imp":3,"q":"内閣総理大臣の指名について、衆議院が指名の議決をした後、国会休会中の期間を除いて何日以内に参議院が指名の議決をしないとき、衆議院の議決が国会の議決となるか。","a":"10日","alt":["10日以内","十日"],"e":"憲法67条2項の規定である。両院の指名が異なり、両院協議会を開いても意見が一致しない場合も、衆議院の議決が国会の議決となる。"},{"t":"tf","s":"衆議院の優越","imp":3,"q":"条約の承認についても、予算と同様に、必ず衆議院から先に審議しなければならない。","a":false,"e":"誤り。正しくは、衆議院に先議権があるのは予算だけで（60条1項）、条約は参議院から先に審議してもよい。ただし議決については予算と同じく、30日の規定や、両院協議会でも一致しないときは衆議院の議決が国会の議決となる規定が適用される。"},{"t":"tf","s":"衆議院の優越","imp":3,"q":"参議院が、衆議院の可決した法律案を受け取ってから60日以内に議決しない場合、その法律案は自動的に成立する。","a":false,"e":"誤り。正しくは、衆議院は参議院が否決したものとみなすことができ、そのうえで出席議員の3分の2以上の多数で再可決すれば法律となる。期間の経過によって衆議院の議決が国会の議決となるのは予算と条約で、その期間は30日である。"},{"t":"mc","s":"衆議院の優越","imp":3,"q":"総議員465人の衆議院の本会議に450人が出席した。参議院で否決された法律案を衆議院で再可決するために必要な、最も少ない賛成者の数として最も適当なものを一つ選べ。","c":["226人","233人","300人","310人"],"a":2,"e":"再可決の要件は出席議員の3分の2以上なので、450×2/3＝300人以上の賛成が必要である。310人は総議員465人の3分の2で、総議員を基準とする憲法改正の発議の要件と混同した誤り。226人は出席議員の過半数、233人は総議員の過半数である。"},{"t":"ex","s":"衆議院の優越","imp":3,"q":"衆議院の優越が認められている理由を説明せよ。","a":"衆議院は参議院より任期が4年と短く、解散もあるため、選挙を通じて国民の意思をより新しく、敏感に反映していると考えられるからである。また、両院の意見が対立したままでは予算や法律が決まらず国政が停滞するため、一定の場合には衆議院の議決を優先させている。","e":"ポイント：①任期が短い（4年） ②解散がある ③民意をより反映している ④国政の停滞を防ぐ"},{"t":"mc","s":"衆議院の優越","imp":2,"q":"衆議院の優越に関する記述として適当でないものを一つ選べ。","c":["予算は、先に衆議院に提出しなければならない。","内閣不信任の決議は、衆議院だけが行うことができる。","憲法改正の発議で両院の議決が異なる場合は、衆議院の議決が国会の議決となる。","条約の承認で両院の議決が異なり、両院協議会でも一致しないときは、衆議院の議決が国会の議決となる。"],"a":2,"e":"憲法改正の発議には、各議院でそれぞれ総議員の3分の2以上の賛成が必要で、衆議院の優越はない。予算先議権（60条1項）、内閣不信任決議（69条）、条約の承認における議決の優越（61条）は、いずれも衆議院の優越である。"},{"t":"ex","s":"衆議院の優越","imp":2,"q":"法律案と予算について、衆議院の優越の仕組みの違いを説明せよ。","a":"法律案は、参議院が衆議院と異なる議決をした場合も、60日以内に議決せず否決とみなされた場合も、衆議院が出席議員の3分の2以上で再可決しなければ成立しない。これに対し予算は、両院協議会でも意見が一致しないときや、参議院が30日以内に議決しないときは、衆議院の議決がそのまま国会の議決となる。","e":"ポイント：①法律案は出席議員の3分の2以上での再可決が必要 ②法律案の60日は「否決とみなす」規定 ③予算は衆議院の議決が国会の議決となる（30日で自然成立） ④予算は衆議院に先議権があり、両院協議会は必ず開く"},{"t":"qa","s":"両院協議会","imp":1,"q":"衆議院と参議院の議決が異なったときに、意見を調整するために開かれる、両院の代表者からなる協議の場を何というか。","a":"両院協議会","e":"各議院から選ばれた10人ずつの協議委員で構成され、出席協議委員の3分の2以上の多数で成案を得る。成案は両議院の議決を経て国会の議決となる。"},{"t":"tf","s":"両院協議会","imp":1,"q":"予算・条約の承認・内閣総理大臣の指名について両院の議決が異なった場合は、必ず両院協議会を開かなければならない。","a":true,"e":"正しい。これに対し法律案の場合、両院協議会を開くかどうかは任意で、衆議院は両院協議会を開かずに出席議員の3分の2以上で再可決することもできる。"},{"t":"qa","s":"問責決議とねじれ国会","imp":2,"q":"参議院が、内閣総理大臣や国務大臣の政治的責任を追及するために行う、法的拘束力のない決議を何というか。","a":"問責決議","e":"可決されても、衆議院の内閣不信任決議のように総辞職や解散の義務は生じない。2008年に、首相に対する問責決議が初めて参議院で可決された。"},{"t":"tf","s":"問責決議とねじれ国会","imp":3,"q":"参議院で内閣総理大臣に対する問責決議が可決されると、内閣は10日以内に衆議院を解散するか、総辞職しなければならない。","a":false,"e":"誤り。正しくは、参議院の問責決議には法的拘束力がなく、解散や総辞職の義務は生じない。10日以内に解散か総辞職かを選ばなければならないのは、衆議院で内閣不信任決議案が可決（または信任決議案が否決）された場合である（69条）。"},{"t":"qa","s":"問責決議とねじれ国会","imp":2,"q":"衆議院と参議院で多数派を占める政党（勢力）が異なり、法律案などが成立しにくくなる状態を何というか。","a":"ねじれ国会","alt":["ねじれ","ねじれ現象"],"e":"1990年前後や、2000年代後半から2010年代前半などにたびたび生じた。与党が衆議院で3分の2以上の議席をもたないと、参議院で否決された法律案を再可決できないため、参議院の影響力が大きくなる。"},{"t":"mc","s":"問責決議とねじれ国会","imp":1,"q":"与党が衆議院の過半数を占めるが3分の2には届かず、参議院では野党が過半数を占めている。内閣が提出した法律案が衆議院で可決され、参議院で否決された場合の説明として最も適当なものを一つ選べ。","c":["衆議院の可決から60日が過ぎれば、法律案は自動的に成立する。","衆議院が出席議員の3分の2以上で再可決しない限り、この法律案は成立しない。","内閣は参議院を解散し、参議院議員の選挙で国民の判断を仰ぐことができる。","両院協議会を開けば、意見が一致しなくても衆議院の議決が国会の議決となる。"],"a":1,"e":"参議院で否決された法律案は、衆議院が出席議員の3分の2以上で再可決しない限り成立しないので、与党は野党の協力を得たり法案を修正したりする必要がある。法律案には自然成立の規定はなく、参議院には解散がない。両院協議会で一致しないとき衆議院の議決が国会の議決となるのは、予算・条約の承認・首相指名である。"},{"t":"qa","s":"国会の種類","imp":3,"q":"毎年1回、1月中に召集され、主に次年度の予算を審議する、会期150日の国会を何というか。","a":"常会","alt":["通常国会","通常会"],"e":"憲法52条に基づく。会期の延長は常会が1回まで、臨時会と特別会は2回までできる。"},{"t":"qa","s":"国会の種類","imp":3,"q":"衆議院の解散による総選挙の日から30日以内に召集され、内閣総理大臣の指名を行う国会を何というか。","a":"特別会","alt":["特別国会"],"e":"憲法54条1項の規定である。特別会が召集されると内閣は総辞職し（70条）、国会は他のすべての案件に先立って首相を指名する。"},{"t":"qa","s":"国会の種類","imp":2,"q":"衆議院の解散中に国に緊急の必要が生じたとき、内閣の求めによって開かれる参議院の会議を何というか。","a":"参議院の緊急集会","alt":["緊急集会"],"e":"ここでとられた措置は臨時のもので、次の国会開会の後10日以内に衆議院の同意がなければ効力を失う（54条3項）。これまで開かれたのは1950年代の2回だけである。"},{"t":"mc","s":"国会の種類","imp":3,"q":"国会の種類とその説明の組合せとして最も適当なものを一つ選べ。","c":["常会 ― 衆議院の解散による総選挙の日から30日以内に召集される。","臨時会 ― いずれかの議院の総議員の4分の1以上の要求があれば、内閣は召集を決定しなければならない。","特別会 ― 毎年1回、1月中に召集され、会期は150日である。","参議院の緊急集会 ― 衆議院の解散中でなくても、参議院議員の要求があれば開かれる。"],"a":1,"e":"臨時会の説明が正しい（53条）。総選挙の日から30日以内に召集されるのは特別会、毎年1月中に召集され会期150日なのは常会である。参議院の緊急集会は、衆議院の解散中に、内閣の求めによってのみ開かれる。"},{"t":"tf","s":"国会の種類","imp":2,"q":"特別会は、衆議院の解散の日から40日以内に召集しなければならない。","a":false,"e":"誤り。正しくは、解散の日から40日以内に総選挙を行い、その選挙の日から30日以内に特別会を召集する（54条1項）。「40日」と「30日」が何から数える日数なのかを区別する。"},{"t":"tf","s":"国会の種類","imp":1,"q":"衆議院議員の任期満了にともなう総選挙の後に召集される国会は、特別会ではなく臨時会である。","a":true,"e":"正しい。特別会は、衆議院の解散による総選挙の後に召集される国会である。任期満了による総選挙や参議院の通常選挙の後には、国会法に基づいて臨時会が召集される。"},{"t":"ex","s":"国会の種類","imp":2,"q":"衆議院が解散されてから新しい内閣が成立するまでの流れを、憲法の定める日数にふれて説明せよ。","a":"衆議院が解散されると、解散の日から40日以内に総選挙が行われ、選挙の日から30日以内に特別会が召集される。特別会が召集されると内閣は総辞職し、国会は他のすべての案件に先立って内閣総理大臣を指名する。指名された首相が国務大臣を任命し、新しい内閣が成立する。","e":"ポイント：①解散から40日以内に総選挙 ②選挙から30日以内に特別会を召集 ③特別会の召集で内閣は総辞職（70条） ④他の案件に先立って首相を指名（67条）"}]});</script>
<script>QDATA.push({"unit":"u08","questions":[{"t":"qa","s":"議員の特権","imp":3,"q":"国会議員が、法律の定める場合を除いて、国会の会期中に逮捕されないという特権を何というか。","a":"不逮捕特権","e":"憲法50条の規定で、例外は院外での現行犯と、所属する議院が逮捕を許諾した場合である。会期前に逮捕された議員も、議院の要求があれば会期中は釈放される。"},{"t":"qa","s":"議員の特権","imp":3,"q":"国会議員が、議院で行った演説・討論・表決について、院外で責任を問われないという特権を何というか。","a":"免責特権","e":"憲法51条の規定で、議院での発言を理由に、損害賠償などの民事責任や刑事責任を問われない。自由な討論を保障するための特権である。"},{"t":"qa","s":"議員の特権","imp":1,"q":"国会議員が、法律の定めるところにより国庫から受け取る相当額の報酬を何というか。","a":"歳費","e":"憲法49条の規定で、議員が経済的な心配をせずに職務に専念できるようにするためのものである。不逮捕特権・免責特権とあわせて、国会議員の特権とよばれる。"},{"t":"tf","s":"議員の特権","imp":2,"q":"国会議員は、国会の会期中であれば、院外で現行犯として罪を犯した場合でも逮捕されない。","a":false,"e":"誤り。正しくは、院外における現行犯の場合は会期中でも逮捕される（国会法33条）。所属する議院が許諾した場合も、会期中に逮捕することができる。"},{"t":"tf","s":"議員の特権","imp":1,"q":"国会議員は、議院で行った発言について院外で責任を問われないが、院内の秩序を乱したとして所属する議院から懲罰を受けることはある。","a":true,"e":"正しい。免責特権は院外で民事・刑事の責任を問われないという特権であり、院内の秩序を乱した議員を議院が懲罰することはできる（58条2項）。懲罰のうち除名には、出席議員の3分の2以上の多数による議決が必要である。"},{"t":"ex","s":"議員の特権","imp":2,"q":"国会議員に不逮捕特権や免責特権が認められている理由を説明せよ。","a":"政府などの権力が逮捕権を濫用して議員の活動を妨げたり、議院での発言を理由に責任を追及して自由な討論を萎縮させたりすることを防ぐためである。国民の代表である議員が圧力を受けずに活動・発言できるようにし、国会の審議の自由を保障している。","e":"ポイント：①権力による不当な逮捕から議員を守る ②自由な発言・討論の保障 ③国民の代表としての職務の遂行"},{"t":"mc","s":"国会の権限","imp":3,"q":"日本国憲法が定める国会の権限として適当でないものを一つ選べ。","c":["最高裁判所長官を指名すること","内閣総理大臣を指名すること","裁判官を裁判する弾劾裁判所を設置すること","内閣が締結する条約を承認すること"],"a":0,"e":"最高裁判所長官は内閣が指名し、天皇が任命する（6条2項）ので、国会の権限ではない。首相の指名（67条）、弾劾裁判所の設置（64条）、条約の承認（61条・73条3号）は国会の権限である。このほか、法律の制定、予算の議決、憲法改正の発議などがある。"},{"t":"qa","s":"国会の権限","imp":3,"q":"罷免の訴追を受けた裁判官を裁判するため、両議院の議員で組織される裁判所を何というか。","a":"弾劾裁判所","alt":["裁判官弾劾裁判所"],"e":"衆参各10人の議員からなる訴追委員会が訴追し、衆参各7人の議員が裁判員となる弾劾裁判所が審理する。罷免の判決には、審理に関与した裁判員の3分の2以上の賛成が必要である。"},{"t":"qa","s":"国会の権限","imp":3,"q":"国会が憲法改正を発議するには、各議院の総議員の何分の何以上の賛成が必要か。","a":"3分の2以上","alt":["3分の2","三分の二","三分の二以上","2/3"],"e":"憲法96条の規定で、発議の後、国民投票で過半数の賛成を得ると改正が承認される。法律案の再可決の要件である「出席議員の3分の2以上」と区別する。"},{"t":"qa","s":"議院の権限","imp":3,"q":"衆議院と参議院がそれぞれ国政に関する調査を行い、証人の出頭や証言、記録の提出を要求することができる権限を何というか。","a":"国政調査権","e":"憲法62条の規定で、証人喚問でうその証言をすると偽証罪に問われる。ただし、裁判中の事件や判決の当否を調べるなど、司法権の独立を侵す調査は許されないとされる。"},{"t":"ex","s":"議院の権限","imp":2,"q":"国政調査権の内容と、その行使にあたっての限界を説明せよ。","a":"国政調査権は、各議院が国政について調査し、証人の出頭・証言や記録の提出を求めることができる権限で、行政の監視や立法のための情報収集に用いられる。ただし、裁判中の事件や判決の内容の当否を調べることは司法権の独立を侵すため許されず、個人のプライバシーなどの人権を侵害することも許されない。","e":"ポイント：①各議院が単独で行使できる（62条） ②証人喚問・記録の提出の要求 ③行政の監視・立法のための調査 ④司法権の独立や人権を侵してはならない（浦和事件）"},{"t":"mc","s":"議院の権限","imp":2,"q":"衆議院・参議院がそれぞれ単独で行使できる権限（議院の権限）として最も適当なものを一つ選べ。","c":["内閣総理大臣を指名すること","予算を議決すること","所属する議員の資格に関する争訟を裁判すること","弾劾裁判所を設置すること"],"a":2,"e":"議員の資格争訟の裁判（55条）は各議院の権限で、議席を失わせるには出席議員の3分の2以上の多数が必要である。首相の指名、予算の議決、弾劾裁判所の設置は国会の権限である。議院の権限には、このほか国政調査権、議員の懲罰、議院規則の制定、議長などの役員の選任がある。"},{"t":"qa","s":"議院の権限","imp":1,"q":"院内の秩序を乱した議員を、議院が懲罰として除名するために必要な議決の要件を答えよ。","a":"出席議員の3分の2以上","alt":["出席議員の3分の2以上の多数","出席議員の三分の二以上","出席議員の3分の2"],"e":"憲法58条2項の規定である。除名は議員の身分を奪う重い処分なので、特別多数が必要とされている。"},{"t":"qa","s":"定足数と議決","imp":2,"q":"両議院の本会議で議事を開き議決するために必要な出席者の数（定足数）は、総議員の何分の何以上か。","a":"3分の1以上","alt":["3分の1","三分の一","三分の一以上","1/3"],"e":"憲法56条1項の規定である。議事は、憲法に特別の定めがある場合を除き出席議員の過半数で決し、可否同数のときは議長が決する（56条2項）。"},{"t":"tf","s":"定足数と議決","imp":1,"q":"両議院の会議は公開が原則であるが、出席議員の3分の2以上の多数で議決したときは、秘密会を開くことができる。","a":true,"e":"正しい。憲法57条1項の規定である。国民が国会の審議を知ることができるよう会議の公開が原則とされ、会議の記録も原則として公表される。"},{"t":"mc","s":"定足数と議決","imp":3,"q":"各議院の「出席議員の3分の2以上」の賛成が必要とされるものとして適当でないものを一つ選べ。","c":["参議院で否決された法律案を衆議院で再可決すること","憲法改正を発議すること","院内の秩序を乱した議員を除名すること","議院の会議を秘密会とすること"],"a":1,"e":"憲法改正の発議は、各議院の「総議員」の3分の2以上の賛成が必要である（96条）。法律案の再可決（59条2項）、議員の除名（58条2項）、秘密会の開催（57条1項）は、いずれも出席議員の3分の2以上である。"},{"t":"ex","s":"定足数と議決","imp":2,"q":"国会の本会議における定足数と議決の原則を説明し、特別多数が必要となる例を挙げよ。","a":"本会議は総議員の3分の1以上が出席しなければ開くことができず、議事は出席議員の過半数で決し、可否同数のときは議長が決するのが原則である。ただし、法律案の再可決、議員の除名、秘密会の開催などには出席議員の3分の2以上、憲法改正の発議には各議院の総議員の3分の2以上の賛成が必要である。","e":"ポイント：①定足数は総議員の3分の1以上 ②原則は出席議員の過半数、可否同数なら議長が決する ③出席議員の3分の2以上（再可決・除名・秘密会・資格争訟で議席を失わせる場合） ④総議員の3分の2以上（憲法改正の発議）"},{"t":"qa","s":"委員会と立法過程","imp":2,"q":"国会で、法律案などを本会議で審議する前に、少人数の委員会で専門的・実質的に審査する仕組みを何というか。","a":"委員会中心主義","alt":["委員会制度"],"e":"日本の国会は戦後、アメリカ議会にならってこの仕組みを採用した。各議院には常設の常任委員会と、必要に応じて設けられる特別委員会がある。"},{"t":"qa","s":"委員会と立法過程","imp":2,"q":"国会の委員会が、重要な案件について利害関係者や学識経験者などから意見を聞くために開く会を何というか。","a":"公聴会","e":"国会法により、総予算と重要な歳入法案については公聴会を必ず開かなければならない。国会議員以外の人の意見を審議に反映させるための制度である。"},{"t":"qa","s":"委員会と立法過程","imp":1,"q":"国会議員が予算をともなわない法律案を発議するには、衆議院では議員何人以上の賛成が必要か。","a":"20人以上","alt":["20人","二十人"],"e":"国会法56条の規定で、参議院では10人以上である。予算をともなう法律案の場合は、衆議院で50人以上、参議院で20人以上の賛成が必要となる。"},{"t":"tf","s":"委員会と立法過程","imp":3,"q":"法律案を国会に提出できるのは国会議員だけであり、内閣には法律案を提出する権限がない。","a":false,"e":"誤り。正しくは、内閣も法律案を国会に提出でき（内閣提出法案、閣法）、成立する法律の多くは内閣提出法案である。国会議員が発議する法律案は議員立法とよばれる。"},{"t":"ex","s":"委員会と立法過程","imp":2,"q":"内閣提出法案と議員立法の違いを、日本の立法の実態にふれて説明せよ。","a":"内閣提出法案は、各省庁の官僚が原案を作成し、閣議決定を経て内閣が国会に提出する法律案で、提出数も成立率も高い。議員立法は国会議員が発議する法律案で、発議には一定数の議員の賛成が必要であり、成立する数は少ない。そのため法律づくりが官僚主導になっているとして、国会の立法機能の強化が課題とされている。","e":"ポイント：①閣法は官僚が原案を作り閣議決定を経て提出 ②閣法は成立率が高い ③議員立法には賛成者の数の要件がある ④官僚主導（行政国家化）と国会の立法機能の強化"},{"t":"mc","s":"委員会と立法過程","imp":2,"q":"日本の法律の制定過程に関する記述として最も適当なものを一つ選べ。","c":["法律案は、予算と同じく、必ず衆議院から先に審議しなければならない。","法律案は、通常、委員会で審査された後に本会議で審議・議決される。","両議院で可決された法律は、内閣総理大臣が国事行為として公布する。","法律案は、衆議院で可決されれば、参議院の議決を経ずに法律として成立する。"],"a":1,"e":"日本の国会は委員会中心主義をとり、法律案は委員会の審査を経て本会議で議決される。法律案はどちらの議院から先に審議してもよく、成立には原則として両議院の可決が必要である。成立した法律は、天皇が国事行為として公布する（7条1号）。"},{"t":"qa","s":"国会審議の活性化","imp":2,"q":"官僚主導の国会審議を改めて政治主導を確立するため1999年に制定され、政府委員制度の廃止や党首討論の導入などを定めた法律を何というか。","a":"国会審議活性化法","alt":["国会審議の活性化及び政治主導の政策決定システムの確立に関する法律"],"e":"この法律により、官僚が大臣に代わって国会で答弁する政府委員制度が廃止された。また政務次官が廃止され、2001年から副大臣と大臣政務官が置かれた。"},{"t":"qa","s":"国会審議の活性化","imp":2,"q":"イギリス議会のクエスチョン・タイムをモデルに導入された、首相と野党の党首が国会で直接議論する制度を何というか。","a":"党首討論","e":"国会審議活性化法に基づき、2000年から衆参両院の国家基本政策委員会の合同審査会として行われている。"},{"t":"qa","s":"国会審議の活性化","imp":1,"q":"政治主導を強めるため、政務次官に代えて2001年から各省に置かれた、主に国会議員が任命される役職を二つ答えよ。","a":"副大臣・大臣政務官","alt":["副大臣と大臣政務官","大臣政務官・副大臣","大臣政務官と副大臣"],"e":"副大臣は大臣を助けて政策の企画や政務を担い、大臣が不在のときはその職務を代行する。大臣政務官は大臣を助け、特定の政策や企画に参画する。"},{"t":"tf","s":"国会審議の活性化","imp":1,"q":"国会審議活性化法によって政府委員制度が廃止されたため、国会の委員会で官僚が答弁することは一切できなくなった。","a":false,"e":"誤り。正しくは、政府委員制度は廃止されたが、細かな事項については、官僚が政府参考人として委員会に出席し答弁することが認められている。改革の要点は、答弁の中心を大臣・副大臣・大臣政務官などの政治家にしたことである。"}]});</script>
<script>QDATA.push({"unit":"u08","questions":[{"t":"qa","s":"議院内閣制","imp":3,"q":"「行政権は、内閣に属する。」と定めた日本国憲法の条文は第何条か。","a":"第65条","alt":["65条","憲法65条","第六十五条"],"e":"立法権は国会（41条）、行政権は内閣（65条）、司法権は裁判所（76条）に属し、三権分立の仕組みがとられている。41条・65条・76条はセットで覚える。"},{"t":"qa","s":"議院内閣制","imp":3,"q":"内閣が国会の信任に基づいて成立し、行政権の行使について国会に対して連帯して責任を負う政治制度を何というか。","a":"議院内閣制","e":"18世紀のイギリスで発達した制度である。これに対しアメリカの大統領制では、大統領は議会に対して責任を負わず、議会を解散する権限ももたない。"},{"t":"qa","s":"議院内閣制","imp":3,"q":"内閣総理大臣は、何の中から国会の議決で指名されるか。","a":"国会議員","alt":["国会議員の中","国会議員の中から"],"e":"憲法67条1項の規定で、この指名は他のすべての案件に先立って行われる。憲法上は参議院議員でもよいが、実際には衆議院議員から選ばれるのが慣例となっている。"},{"t":"qa","s":"議院内閣制","imp":3,"q":"日本国憲法第66条2項で、内閣総理大臣その他の国務大臣は何でなければならないと定められているか。","a":"文民","e":"文民とは軍人でない者のことで、軍部が政治を動かした戦前の反省から設けられた文民統制（シビリアン・コントロール）の規定である。政府は、現職の自衛官は文民にあたらないとしている。"},{"t":"tf","s":"議院内閣制","imp":3,"q":"内閣総理大臣が任命する国務大臣は、全員が国会議員でなければならない。","a":false,"e":"誤り。正しくは、国務大臣は過半数が国会議員であればよく（68条1項）、民間人などを大臣に任命することもできる。一方、内閣総理大臣は必ず国会議員でなければならない。"},{"t":"mc","s":"議院内閣制","imp":3,"q":"日本の議院内閣制の仕組みに関する記述として最も適当なものを一つ選べ。","c":["内閣総理大臣は、国民の直接選挙によって選ばれる。","国会は内閣に対する不信任決議ができず、内閣も衆議院を解散できない。","内閣は、行政権の行使について、国会に対し連帯して責任を負う。","内閣総理大臣は、国会議員でない者の中からも国会の議決で指名できる。"],"a":2,"e":"憲法66条3項により、内閣は国会に対して連帯して責任を負う。首相は国会議員の中から国会が指名し（67条）、衆議院は内閣不信任決議ができ（69条）、内閣は衆議院を解散できる。首相を国民が直接選ぶ仕組みは日本にはなく、議会と行政府が不信任や解散で互いに対抗しないのはアメリカの大統領制の特徴である。"},{"t":"ex","s":"議院内閣制","imp":3,"q":"日本の議院内閣制の仕組みを、内閣と国会（特に衆議院）の関係に注目して説明せよ。","a":"内閣総理大臣は国会議員の中から国会の指名で選ばれ、国務大臣の過半数も国会議員でなければならないなど、内閣は国会の信任の上に成り立っている。内閣は行政権の行使について国会に連帯して責任を負い、衆議院は内閣不信任決議によって責任を追及でき、内閣は衆議院を解散して国民の判断を仰ぐことができる。","e":"ポイント：①首相は国会議員の中から国会が指名 ②国務大臣の過半数は国会議員 ③国会に対する連帯責任（66条3項） ④衆議院の内閣不信任決議と内閣の解散権"},{"t":"ex","s":"議院内閣制","imp":1,"q":"内閣総理大臣の地位について、大日本帝国憲法の下と日本国憲法の下での違いを説明せよ。","a":"大日本帝国憲法には内閣についての規定がなく、内閣総理大臣は他の国務大臣と対等な「同輩中の首席」にすぎず、各国務大臣がそれぞれ天皇を輔弼した。日本国憲法では、内閣総理大臣は内閣の「首長」とされ、国務大臣を任意に任命・罷免でき、内閣を代表して行政各部を指揮監督するなど、強い地位と権限をもつ。","e":"ポイント：①明治憲法には内閣の規定がない ②首相は「同輩中の首席」 ③日本国憲法では内閣の「首長」（66条1項） ④国務大臣の任免権（68条）と行政各部の指揮監督（72条）"},{"t":"qa","s":"内閣の総辞職","imp":3,"q":"衆議院で内閣不信任決議案が可決されたとき、内閣は何日以内に衆議院が解散されない限り総辞職しなければならないか。","a":"10日","alt":["10日以内","十日"],"e":"憲法69条の規定で、信任決議案が否決された場合も同じである。内閣は、10日以内に衆議院を解散して総選挙で国民の判断を仰ぐか、総辞職するかを選ぶことになる。"},{"t":"mc","s":"内閣の総辞職","imp":3,"q":"日本国憲法の規定により内閣が総辞職しなければならない場合として適当でないものを一つ選べ。","c":["衆議院で内閣不信任決議案が可決され、10日以内に衆議院が解散されなかったとき","内閣総理大臣が死亡したとき","衆議院議員総選挙の後に初めて国会が召集されたとき","参議院で内閣総理大臣に対する問責決議が可決されたとき"],"a":3,"e":"参議院の問責決議には法的拘束力がなく、総辞職の義務は生じない。不信任決議の可決後10日以内に解散しないとき（69条）、首相が死亡などで欠けたときと総選挙後に初めて国会が召集されたとき（70条）は、内閣は総辞職しなければならない。"},{"t":"tf","s":"内閣の総辞職","imp":2,"q":"内閣不信任決議案の可決を受けて内閣が衆議院を解散した場合でも、総選挙の後に初めて国会が召集されたときには、内閣は総辞職しなければならない。","a":true,"e":"正しい。憲法70条により、総選挙の後に初めて国会の召集があったときは、内閣は必ず総辞職する。総辞職した内閣は、新しい首相が任命されるまで引き続き職務を行う（71条）。"},{"t":"qa","s":"衆議院の解散","imp":2,"q":"内閣不信任決議によらず、天皇の国事行為を定めた条文を根拠として内閣の判断で行われる衆議院の解散を、その条文番号から何というか。","a":"7条解散","alt":["七条解散","第7条解散"],"e":"天皇は内閣の助言と承認により衆議院を解散する（7条3号）が、実質的に解散を決めるのは内閣である。戦後の解散の大部分は7条解散である。"},{"t":"qa","s":"衆議院の解散","imp":2,"q":"1952年の7条解散によって議員の地位を失った衆議院議員が、解散は違憲無効だと訴え、最高裁判所が統治行為論によって憲法判断を示さなかった事件を何というか。","a":"苫米地事件","alt":["苫米地訴訟"],"e":"1960年の最高裁判所判決は、衆議院の解散は高度に政治性のある国家行為であり、裁判所の審査権の外にあるとした。統治行為論の代表的な判例である。"},{"t":"tf","s":"衆議院の解散","imp":3,"q":"衆議院の解散は、衆議院で内閣不信任決議案が可決された場合にしか行うことができない。","a":false,"e":"誤り。正しくは、憲法7条を根拠に、不信任決議がなくても内閣の判断で衆議院を解散すること（7条解散）が慣行として定着しており、戦後の解散の多くはこれにあたる。なお参議院には解散がない。"},{"t":"ex","s":"衆議院の解散","imp":2,"q":"日本国憲法第69条に基づく解散と、第7条に基づく解散の違いを説明せよ。","a":"69条に基づく解散は、衆議院で内閣不信任決議案が可決されたり信任決議案が否決されたりしたときに、内閣が総辞職せずに10日以内に衆議院を解散し、国民の判断を仰ぐものである。7条に基づく解散は、不信任決議がなくても、天皇の国事行為への助言と承認という形で内閣が政治的な判断により行うもので、戦後の解散の多くはこちらである。","e":"ポイント：①69条解散は不信任決議の可決（信任決議の否決）が前提 ②10日以内に解散しなければ総辞職 ③7条解散は内閣の判断で行う（天皇の国事行為への助言と承認） ④戦後の解散の多くは7条解散"},{"t":"mc","s":"衆議院の解散","imp":1,"q":"衆議院の解散に関する記述として最も適当なものを一つ選べ。","c":["衆議院の解散を最終的に決定するのは、衆議院議長である。","衆議院が解散されると、参議院は同時に閉会となる。","衆議院が解散されると、参議院も同時に解散され、両院の選挙が同時に行われる。","衆議院の解散は、国会の議決を経なければ行うことができない。"],"a":1,"e":"憲法54条2項により、衆議院が解散されると参議院は同時に閉会となり、緊急の必要があれば内閣の求めで参議院の緊急集会が開かれる。解散は内閣の助言と承認による天皇の国事行為として行われ、実質的には内閣が決定する。参議院には解散がない。"},{"t":"qa","s":"内閣の職務","imp":3,"q":"憲法や法律の規定を実施するために内閣が制定する命令を何というか。","a":"政令","e":"憲法73条6号の規定で、法律の委任がなければ政令に罰則を設けることはできない。各省の大臣が出す命令は省令という。"},{"t":"mc","s":"内閣の職務","imp":3,"q":"日本国憲法第73条が定める内閣の職務として適当でないものを一つ選べ。","c":["予算を作成して国会に提出すること","締結された条約を承認すること","外国と条約を締結すること","大赦や特赦などの恩赦を決定すること"],"a":1,"e":"条約の「承認」は国会の権限であり、内閣は条約を「締結」する（73条3号）。予算の作成・提出（73条5号）、恩赦の決定（73条7号）は内閣の職務である。このほか、法律の誠実な執行、外交関係の処理、官吏に関する事務の掌理、政令の制定がある。"},{"t":"qa","s":"内閣の職務","imp":1,"q":"大赦・特赦・減刑・刑の執行の免除・復権をまとめて何というか。","a":"恩赦","e":"内閣が決定し（73条7号）、天皇が認証する（7条6号）。裁判で確定した刑の効力を行政権の判断で変更するものなので、慎重な運用が求められる。"},{"t":"qa","s":"内閣の職務","imp":2,"q":"天皇の国事に関するすべての行為に必要とされ、その責任を内閣が負うものは何か。","a":"内閣の助言と承認","alt":["助言と承認"],"e":"憲法3条の規定である。天皇は国政に関する権能をもたず、憲法の定める国事行為のみを行うため（4条）、その責任は内閣が負う。"},{"t":"qa","s":"内閣の職務","imp":3,"q":"最高裁判所長官を指名するのはどの機関か。","a":"内閣","e":"内閣の指名に基づき、天皇が任命する（6条2項）。長官以外の最高裁判所裁判官は内閣が任命し、天皇が認証する。"},{"t":"mc","s":"内閣の職務","imp":2,"q":"指名・任命の主体に関する記述として最も適当なものを一つ選べ。","c":["内閣総理大臣は、内閣が指名し、天皇が任命する。","最高裁判所長官は、国会が指名し、天皇が任命する。","最高裁判所長官以外の最高裁判所裁判官は、内閣が任命する。","下級裁判所の裁判官は、国会が作成した名簿によって内閣が任命する。"],"a":2,"e":"長官以外の最高裁判所裁判官は内閣が任命し、天皇が認証する（79条1項）。内閣総理大臣は国会が指名して天皇が任命し、最高裁判所長官は内閣が指名して天皇が任命する（6条）。下級裁判所の裁判官は、最高裁判所が指名した者の名簿によって内閣が任命する（80条1項）。"},{"t":"qa","s":"首相の権限と閣議","imp":3,"q":"内閣総理大臣が国務大臣を任命し、また任意に罷免することができる権限を何というか。","a":"国務大臣の任免権","alt":["任免権","国務大臣任免権"],"e":"憲法68条の規定で、罷免に国会や閣議の同意は必要ない。この権限によって首相は内閣の統一を保ち、内閣の「首長」としての地位を確保している。"},{"t":"qa","s":"首相の権限と閣議","imp":2,"q":"内閣がその職権を行うために開く、内閣総理大臣が主宰し全閣僚が出席する会議を何というか。","a":"閣議","e":"内閣法の規定により、内閣は閣議によって職権を行う。閣議は非公開で行われる。"},{"t":"tf","s":"首相の権限と閣議","imp":1,"q":"閣議の決定は、慣例として多数決ではなく全会一致で行われている。","a":true,"e":"正しい。内閣は国会に対して連帯して責任を負うため、閣議決定は全会一致が慣例である。反対する大臣がいる場合、首相はその大臣を罷免して決定することもできる。"},{"t":"mc","s":"首相の権限と閣議","imp":2,"q":"日本国憲法が定める内閣総理大臣の権限として適当でないものを一つ選べ。","c":["国会が可決した法律案に拒否権を行使して差し戻すこと","国務大臣を任命し、また任意に罷免すること","内閣を代表して議案を国会に提出すること","内閣を代表して行政各部を指揮監督すること"],"a":0,"e":"日本の首相には、国会が可決した法律案に対する拒否権はない。議会が可決した法案への拒否権は、アメリカの大統領がもつ権限である。国務大臣の任免（68条）、議案の提出と行政各部の指揮監督（72条）は首相の権限である。"},{"t":"tf","s":"首相の権限と閣議","imp":1,"q":"国務大臣は、その在任中、内閣総理大臣の同意がなければ訴追されない。","a":true,"e":"正しい。憲法75条の規定で、不当な訴追によって内閣の活動が妨げられないようにするためのものである。ただし、これによって訴追の権利そのものが失われるわけではない。"}]});</script>
<script>QDATA.push({"unit":"u08","questions":[{"t":"qa","s":"司法権と裁判所","imp":3,"q":"「すべて司法権は、最高裁判所及び法律の定めるところにより設置する下級裁判所に属する。」と定めた日本国憲法の条文は第何条か。","a":"第76条","alt":["76条","憲法76条","第七十六条"],"e":"司法権とは、具体的な争いに法を適用して解決する国家の作用である。下級裁判所には、高等裁判所・地方裁判所・家庭裁判所・簡易裁判所がある。"},{"t":"qa","s":"司法権と裁判所","imp":3,"q":"離婚や相続など家庭に関する事件（家事事件）と、少年事件を扱う下級裁判所を何というか。","a":"家庭裁判所","alt":["家裁"],"e":"罪を犯した少年の事件はすべて家庭裁判所に送られ（全件送致主義）、立ち直りを重視した少年審判が行われる。高等裁判所は全国8か所、地方裁判所と家庭裁判所は各都府県に1か所と北海道に4か所置かれている。"},{"t":"qa","s":"司法権と裁判所","imp":2,"q":"訴訟の目的の価額が140万円以下の民事事件や、罰金以下の刑にあたる罪などの軽い刑事事件の第一審を扱う下級裁判所を何というか。","a":"簡易裁判所","alt":["簡裁"],"e":"全国に最も多く置かれている身近な裁判所である。60万円以下の金銭の支払いを求める少額訴訟も、簡易裁判所で行われる。"},{"t":"mc","s":"司法権と裁判所","imp":3,"q":"日本国憲法が禁止する特別裁判所に関する記述として最も適当なものを一つ選べ。","c":["家庭裁判所は、家事事件や少年事件だけを扱うので、特別裁判所にあたる。","大日本帝国憲法の下で設けられていた軍法会議や行政裁判所は、特別裁判所にあたる。","日本国憲法は、行政機関が終審として裁判を行うことを認めている。","知的財産高等裁判所は、通常の裁判所の系列から独立した特別裁判所である。"],"a":1,"e":"特別裁判所とは、軍法会議や行政裁判所のように、最高裁判所を頂点とする通常の裁判所の系列から独立した裁判所をいい、日本国憲法76条2項で禁止されている。家庭裁判所は下級裁判所の一つ、知的財産高等裁判所は東京高等裁判所の特別の支部なので、特別裁判所ではない。また、行政機関が終審として裁判を行うことは禁止されている。"},{"t":"mc","s":"司法権と裁判所","imp":2,"q":"最高裁判所に関する記述として最も適当なものを一つ選べ。","c":["最高裁判所の裁判官は任期10年で、再任されることができる。","最高裁判所は、長官と14人の判事の計15人の裁判官で構成される。","法律が憲法に違反すると判断する場合でも、5人の裁判官からなる小法廷で裁判できる。","最高裁判所の裁判官には定年がなく、終身で在職できる。"],"a":1,"e":"最高裁判所は長官1人と最高裁判所判事14人の計15人で構成される。任期10年・再任可は下級裁判所の裁判官の規定であり、最高裁判所の裁判官の定年は70歳である。法令を違憲と判断するときや判例を変更するときは、15人全員による大法廷で裁判しなければならない。"},{"t":"qa","s":"司法権の独立","imp":3,"q":"日本国憲法第76条3項「すべて裁判官は、その（　）に従ひ独立してその職権を行ひ、この憲法及び法律にのみ拘束される。」の空欄に入る語を答えよ。","a":"良心","e":"裁判官の職権の独立を定めた規定である。裁判官は、国会や内閣はもちろん、上級の裁判所や裁判所長からも個々の裁判について指示を受けない。"},{"t":"qa","s":"司法権の独立","imp":3,"q":"1891年、来日中のロシア皇太子が警備の巡査に切りつけられて負傷した事件で、政府の圧力に抗して司法権の独立が守られたとされる事件を何というか。","a":"大津事件","e":"政府は日本の皇族に対する罪（大逆罪）を適用して死刑にするよう求めたが、大審院長の児島惟謙がこれに抵抗し、通常の謀殺未遂罪で無期徒刑とされた。ただし、児島が担当の裁判官を説得したことは、裁判官の職権の独立の点で問題があったとされる。"},{"t":"qa","s":"司法権の独立","imp":2,"q":"1949年、参議院法務委員会が国政調査権に基づいて地方裁判所の判決の量刑を不当とし、最高裁判所が司法権の独立を侵すものだと抗議した事件を何というか。","a":"浦和事件","e":"生活苦から子を殺害した母親に対する、浦和地方裁判所の執行猶予つきの判決が問題とされた。国会の国政調査権にも、司法権の独立による限界があることを示す事例である。"},{"t":"qa","s":"司法権の独立","imp":2,"q":"1969年、長沼ナイキ基地訴訟を担当する裁判長に対し、所属する地方裁判所の所長が判断について示唆する書簡を送り、裁判官の独立が問題となった事件を何というか。","a":"平賀書簡事件","alt":["平賀書簡問題"],"e":"札幌地方裁判所の所長が、自衛隊の違憲性が争われた訴訟の担当裁判長に、国側の判断を尊重するよう示唆する私信を送った。裁判所の内部から裁判官の職権の独立が侵されかけた事件である。"},{"t":"mc","s":"司法権の独立","imp":3,"q":"司法権の独立に関わる事件と、干渉の主体の組合せとして最も適当なものを一つ選べ。","c":["浦和事件 ― 裁判所内部の上司による干渉","平賀書簡事件 ― 国会（立法権）による干渉","大津事件 ― 政府（行政権）による干渉","苫米地事件 ― 内閣による裁判官の罷免"],"a":2,"e":"大津事件は、政府が大審院に圧力をかけた事件である。浦和事件は国会（参議院法務委員会）による干渉、平賀書簡事件は地方裁判所の所長による裁判所内部からの干渉である。苫米地事件は衆議院の解散の効力が争われた事件で、統治行為論が示された。"},{"t":"ex","s":"司法権の独立","imp":3,"q":"司法権の独立とは何か、またなぜ必要とされるのかを説明せよ。","a":"司法権の独立とは、裁判所が国会や内閣などほかの国家機関から干渉を受けないことと、個々の裁判官が上級の裁判官を含め誰からも指示を受けず、良心に従い憲法と法律にのみ拘束されて裁判を行うこと（裁判官の職権の独立）をいう。公正な裁判を保障し、国民の権利と自由を守るために必要である。","e":"ポイント：①ほかの国家機関からの独立（司法府の独立） ②裁判官の職権の独立（76条3項） ③裁判官の身分保障（78条）がこれを支える ④公正な裁判による人権保障"},{"t":"ex","s":"裁判官の身分保障","imp":2,"q":"裁判官が罷免される場合を三つ挙げて説明せよ。","a":"第一に、裁判によって、心身の故障のために職務を行うことができないと決定された場合である。第二に、国会に設けられた弾劾裁判所で罷免の裁判を受けた場合である。第三に、最高裁判所の裁判官については、国民審査で投票者の多数が罷免を可とした場合である。これら以外の理由で罷免されることはない。","e":"ポイント：①心身の故障（裁判による決定） ②公の弾劾（弾劾裁判所） ③国民審査（最高裁判所の裁判官のみ） ④行政機関による懲戒の禁止（78条）"},{"t":"mc","s":"裁判官の身分保障","imp":2,"q":"裁判官の身分保障に関する記述として最も適当なものを一つ選べ。","c":["裁判官の懲戒処分は、内閣が行う。","下級裁判所の裁判官も、国民審査によって罷免されることがある。","裁判官の報酬は、在任中であっても法律によって減額することができる。","裁判官は、国会の弾劾裁判所で罷免の裁判を受けた場合には罷免される。"],"a":3,"e":"弾劾裁判所による罷免の裁判（公の弾劾）は、裁判官が罷免される場合の一つである。行政機関は裁判官の懲戒処分を行うことができず（78条）、国民審査の対象は最高裁判所の裁判官だけである。裁判官の報酬は在任中減額することができない（79条6項・80条2項）。"},{"t":"qa","s":"裁判官の身分保障","imp":3,"q":"最高裁判所の裁判官が、任命後初めて行われる衆議院議員総選挙の際などに、国民の投票によって罷免すべきかどうかの審査を受ける制度を何というか。","a":"国民審査","alt":["最高裁判所裁判官国民審査","最高裁判所裁判官の国民審査"],"e":"憲法79条の規定で、その後は10年を経過した後の総選挙の際に再び審査される。投票者の多数が罷免を可とした裁判官は罷免される。"},{"t":"tf","s":"裁判官の身分保障","imp":2,"q":"国民審査によって実際に罷免された最高裁判所の裁判官は、これまで一人もいない。","a":true,"e":"正しい。罷免を可とする裁判官の欄に×を記入し、何も書かない票は罷免を可としない票として扱われる方式のため、制度が形骸化しているとの指摘もある。"},{"t":"qa","s":"裁判官の身分保障","imp":2,"q":"下級裁判所の裁判官の任期は何年か。","a":"10年","alt":["十年","10年間"],"e":"憲法80条により、任期は10年で、再任されることができる。最高裁判所の裁判官には任期がなく、定年は70歳である。"},{"t":"tf","s":"裁判官の身分保障","imp":1,"q":"最高裁判所は2022年、海外に住む日本国民が国民審査に投票できないことは憲法に違反すると判断した。","a":true,"e":"正しい。この判決を受けて国民審査法が改正され、海外に住む日本国民も国民審査に投票できるようになった。"},{"t":"qa","s":"違憲審査権","imp":3,"q":"一切の法律・命令・規則・処分が憲法に適合するかしないかを決定する、裁判所の権限を何というか。","a":"違憲審査権","alt":["違憲立法審査権","違憲法令審査権","法令審査権"],"e":"憲法81条の規定である。最高裁判所だけでなく下級裁判所もこの権限をもち、最高裁判所が終審裁判所として最終的な判断を下す。"},{"t":"qa","s":"違憲審査権","imp":3,"q":"違憲審査について最終的な判断を下す終審裁判所であることから、最高裁判所は何とよばれるか。","a":"憲法の番人","e":"最高裁判所は、国会や内閣の行為が憲法に違反していないかを最終的に判断し、憲法の最高法規性と国民の基本的人権を守る役割を担う。"},{"t":"tf","s":"違憲審査権","imp":3,"q":"違憲審査権は最高裁判所だけがもつ権限であり、地方裁判所などの下級裁判所は、法律が憲法に違反するかどうかを判断できない。","a":false,"e":"誤り。正しくは、違憲審査権はすべての裁判所がもち、下級裁判所も具体的な事件の中で違憲の判断を示すことができる。最高裁判所はその終審裁判所である（81条）。"},{"t":"ex","s":"違憲審査権","imp":3,"q":"付随的違憲審査制と抽象的違憲審査制の違いを、採用している国にふれて説明せよ。","a":"付随的違憲審査制は、通常の裁判所が具体的な訴訟事件を裁判する際に、その解決に必要な範囲で、適用される法令などの合憲性を判断する方式で、アメリカや日本が採用している。抽象的違憲審査制は、具体的な事件とは関係なく、特別に設けられた憲法裁判所が法令の合憲性を審査する方式で、ドイツなどが採用している。","e":"ポイント：①付随的＝具体的な事件の解決に必要な範囲で判断 ②日本・アメリカは通常の裁判所が行う ③抽象的＝具体的な事件と無関係に審査 ④ドイツの連邦憲法裁判所など"},{"t":"qa","s":"違憲審査権","imp":2,"q":"1952年、最高裁判所が、具体的な争いがないのに法令の合憲性を抽象的に判断する権限はないとして訴えを退け、日本が付随的違憲審査制をとることを示した訴訟は何か。","a":"警察予備隊違憲訴訟","alt":["警察予備隊訴訟","警察予備隊違憲事件"],"e":"警察予備隊の設置は違憲であるとして、具体的な事件がないまま直接最高裁判所に訴えが起こされた。最高裁判所は、裁判所が判断できるのは具体的な争訟がある場合に限られるとした。"},{"t":"ex","s":"違憲審査権","imp":2,"q":"統治行為論とはどのような考え方か、苫米地事件などの例にふれて説明せよ。","a":"統治行為論とは、国家統治の基本に関わる高度に政治性のある国家行為は、法律上の争いであっても裁判所の審査の対象外であり、その判断は国民に責任を負う内閣や国会、最終的には国民の判断に委ねるべきだとする考え方である。衆議院の解散が争われた苫米地事件などで用いられたが、司法の役割を放棄しているとの批判もある。","e":"ポイント：①高度に政治性のある国家行為 ②裁判所の審査の対象外とする ③政治部門や主権者である国民の判断に委ねる ④苫米地事件（衆議院の解散）、砂川事件（日米安全保障条約）"},{"t":"mc","s":"違憲審査権","imp":2,"q":"日本の違憲審査制の下で、裁判所が法律の合憲性を判断する場面として最も適当なものを一つ選べ。","c":["ある法律が成立した直後に、具体的な争いがないまま、国民が最高裁判所に法律の違憲確認を求めた場面","法律に基づく処分で不利益を受けた人が、処分の取消しを求める訴訟の中で、根拠となった法律の違憲を主張した場面","国会議員の一定数の申立てを受けて、最高裁判所が成立前の法律案の合憲性を審査した場面","内閣が、国会に提出する予定の法律案の合憲性について、最高裁判所に意見を求めた場面"],"a":1,"e":"日本は付随的違憲審査制をとるため、裁判所は具体的な訴訟の解決に必要な範囲でのみ法律の合憲性を判断する。具体的な争いのない違憲確認の訴えや、法律案の事前審査、内閣の求めに応じた意見の提示は認められていない。"},{"t":"tf","s":"違憲審査権","imp":1,"q":"最高裁判所がある法律の規定を違憲と判断すると、その規定は判決によって直ちに法律の条文から削除される。","a":false,"e":"誤り。正しくは、違憲判決はその事件でその規定を適用しないという効力をもつにとどまると考えられており、条文を改正・削除するのは国会である。実際には、違憲判決の後に国会が法律を改正している。"},{"t":"tf","s":"違憲審査権","imp":1,"q":"最高裁判所が法律の規定そのものを違憲と判断した例は少なく、日本の裁判所には違憲判断に慎重な司法消極主義の傾向があるといわれる。","a":true,"e":"正しい。日本国憲法の施行以来、最高裁判所が法令の規定を違憲とした例は十数件にとどまる。尊属殺重罰規定（1973年）、薬事法の距離制限（1975年）、婚外子の相続分（2013年）などがその例である。"},{"t":"qa","s":"裁判の公開","imp":2,"q":"裁判の対審と判決は公開の法廷で行うと定めた日本国憲法の条文は第何条か。","a":"第82条","alt":["82条","憲法82条","第八十二条"],"e":"裁判を国民の監視の下に置き、公正な裁判を確保するための規定である。対審とは、裁判官の前で当事者が主張を述べ合う審理のことである。"},{"t":"mc","s":"裁判の公開","imp":1,"q":"裁判の公開に関する記述として最も適当なものを一つ選べ。","c":["裁判官の全員一致で決めれば、対審だけでなく判決も非公開にできる。","政治犯罪や出版に関する犯罪の対審は、公の秩序を害するおそれがあれば非公開にできる。","傍聴人が法廷でメモを取ることは、最高裁判所の判断により全面的に禁止されている。","裁判官の全員一致で公の秩序や善良の風俗を害するおそれがあると決した場合は、対審を非公開にできる。"],"a":3,"e":"憲法82条2項により、裁判官の全員一致で公序良俗を害するおそれがあると決した場合は対審を非公開にできるが、判決は必ず公開しなければならない。政治犯罪、出版に関する犯罪、憲法第3章の保障する国民の権利が問題となっている事件の対審は常に公開である。傍聴人のメモについては、1989年のレペタ訴訟の最高裁判所判決が、故なく妨げられてはならないとした。"}]});</script>
