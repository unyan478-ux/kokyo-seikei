<script>QDATA.push({"unit":"u18","questions":[{"t":"qa","s":"財政投融資","imp":3,"q":"国が財投債の発行などで調達した資金を、政府系の金融機関や独立行政法人などに貸し付けたり出資したりして、社会資本の整備や中小企業への融資などを行うしくみを何というか。","a":"財政投融資","alt":["財投"],"e":"かつては規模が大きく、一般会計予算の半分程度に達したこともあったため、「第二の予算」とよばれた。毎年度の財政投融資計画は、予算とともに国会に提出される。"},{"t":"tf","s":"財政投融資","imp":2,"q":"2001年の財政投融資改革より前は、郵便貯金や年金積立金が資金運用部に預託され、財政投融資の主な資金源となっていた。","a":true,"e":"正しい。郵便貯金などが自動的に流れ込むしくみが、非効率な特殊法人の事業を温存させていると批判された。2001年の改革で預託義務が廃止され、財投債や財投機関債によって市場から資金を調達するしくみに改められた。"},{"t":"qa","s":"財政投融資","imp":1,"q":"2001年の財政投融資改革のあと、財投機関（独立行政法人など）が、政府の保証をつけずに自ら発行して市場から資金を調達する債券を何というか。","a":"財投機関債","e":"市場で買ってもらえるかどうかを通じて、財投機関の経営に市場の評価がはたらくことが期待された。これに対し、国が発行して財政投融資の資金を調達する国債の一種を財投債という。"},{"t":"mc","s":"財政投融資","imp":2,"q":"財政投融資についての記述として最も適当なものを一つ選べ。","c":["財投債は国債の一種であり、国が発行して財政投融資の資金を市場から調達する。","2001年の改革によって、郵便貯金を資金運用部に預託することが新たに義務づけられた。","財政投融資とは、民間の銀行が預金を資金源として企業に行う融資のことである。","財政投融資計画は国会に提出されず、財務省が単独で決定している。"],"a":0,"e":"財投債は国が発行する国債の一種である。2001年の改革では郵便貯金などの預託義務が廃止されたので、新たに義務づけられたとする記述は誤り。財政投融資は国が行う投融資であり、民間銀行の融資ではないので誤り。財政投融資計画は予算とともに国会に提出されるので誤り。"},{"t":"qa","s":"一般会計の歳出","imp":3,"q":"近年の日本の一般会計予算の歳出で、最も大きな割合（約3割）を占める経費は何か。","a":"社会保障関係費","alt":["社会保障費","社会保障関係経費"],"e":"年金・医療・介護・子ども子育てなどにかかる経費で、2026年度当初予算では約39兆円と、歳出総額（約122兆円）の約3割を占める。高齢化にともなって年々増加している。"},{"t":"qa","s":"一般会計の歳出","imp":3,"q":"国債の元金の返済（償還）や利子の支払いにあてられる歳出を何というか。","a":"国債費","e":"2026年度当初予算では約31兆円で、歳出の約4分の1を占める。国債の残高が大きいため、金利が上昇すると利払い費が増えて財政を圧迫するおそれがある。"},{"t":"qa","s":"一般会計の歳出","imp":2,"q":"地方公共団体の間の財政力の格差を是正するため、所得税・法人税などの国税の一定割合を、国が地方公共団体に配分する資金を何というか。","a":"地方交付税交付金","alt":["地方交付税","地方交付税交付金等"],"e":"使いみちが限定されない一般財源であり、使いみちが指定される国庫支出金と区別される。一般会計の歳出では、社会保障関係費・国債費に次いで大きい。"},{"t":"mc","s":"一般会計の歳出","imp":2,"q":"近年の日本の一般会計予算の歳出の構成について、金額の大きい順に並べたものとして最も適当なものを一つ選べ。","c":["社会保障関係費 → 国債費 → 地方交付税交付金等","国債費 → 社会保障関係費 → 地方交付税交付金等","社会保障関係費 → 防衛関係費 → 国債費","公共事業関係費 → 社会保障関係費 → 国債費"],"a":0,"e":"2026年度当初予算では、社会保障関係費（約39兆円）、国債費（約31兆円）、地方交付税交付金等（約21兆円）の順で、この三つで歳出の約4分の3を占める。そのため、教育や公共事業、防衛などに使える予算は限られている。"},{"t":"qa","s":"一般会計の歳入","imp":3,"q":"近年、国の税収のなかで最も税収額が大きい税目は何か。","a":"消費税","e":"消費税は2020年度の決算で初めて所得税を上回り、税目別で最大となった。景気に左右されにくく安定した税収が見込めるのが特徴である。消費税に次いで所得税、法人税の順に大きい。"},{"t":"qa","s":"一般会計の歳入","imp":3,"q":"一般会計の歳入のうち、国債を発行して得られる収入を何というか。","a":"公債金","alt":["公債金収入"],"e":"近年の当初予算では、歳入の約4分の1から3分の1を公債金に頼っている。歳入に占める公債金の割合を国債依存度（公債依存度）という。"},{"t":"tf","s":"一般会計の歳入","imp":2,"q":"近年の日本の一般会計予算では、歳入の9割以上が税収でまかなわれており、国債の発行による収入はごくわずかである。","a":false,"e":"誤り。正しくは、税収とその他の収入でまかなえるのは歳入の約3分の2から4分の3程度で、残りを公債金（国債の発行による収入）に頼っている。"},{"t":"mc","s":"一般会計の歳入","imp":1,"q":"日本の国の歳入についての記述として最も適当なものを一つ選べ。","c":["所得税・法人税・消費税の三つの税目で、国の税収の大部分を占めている。","法人税は、近年の国の税収のなかで最も大きな税目である。","一般会計の歳入には公債金は含まれず、すべて税収とその他の収入でまかなわれている。","消費税の税収は、所得税や法人税の税収よりも景気の変動の影響を大きく受ける。"],"a":0,"e":"消費税・所得税・法人税の三つで国の税収の8割以上を占める。近年最も大きいのは消費税なので、法人税とする記述は誤り。歳入には国債の発行による公債金が含まれるので誤り。消費税は消費額にかかるため景気の影響を受けにくく、景気によって大きく変動するのは企業の利益にかかる法人税なので誤り。"},{"t":"ex","s":"租税の分類","imp":3,"q":"直接税と間接税の違いを、納税者と担税者という語を用いて説明し、それぞれの例を挙げよ。","a":"直接税は、税を納める納税者と、実際に税を負担する担税者が同じ税であり、所得税・法人税・相続税・住民税などがある。間接税は、納税者と担税者が異なる税であり、たとえば消費税は消費者が負担し、商品を販売した事業者が納める。ほかに酒税・たばこ税・関税などがある。","e":"ポイント：①直接税＝納税者と担税者が同じ（所得税・法人税・相続税など） ②間接税＝納税者と担税者が異なる（消費税・酒税など） ③消費税は消費者が負担し、事業者が納める。"},{"t":"mc","s":"租税の分類","imp":3,"q":"次の税のうち、国税であり、かつ間接税であるものとして最も適当なものを一つ選べ。","c":["酒税","所得税","固定資産税","住民税"],"a":0,"e":"酒税は国が課す間接税である。所得税は国税だが直接税なので誤り。固定資産税は市町村が課す地方税で直接税なので誤り。住民税は都道府県・市町村が課す地方税で直接税なので誤り。"},{"t":"mc","s":"租税の分類","imp":1,"q":"次の税のうち、地方税であり、かつ間接税であるものとして最も適当なものを一つ選べ。","c":["地方消費税","法人税","固定資産税","関税"],"a":0,"e":"地方消費税は、消費税率10%のうち2.2%分にあたる都道府県の税で、間接税である。法人税は国税の直接税なので誤り。固定資産税は地方税だが直接税なので誤り。関税は輸入品にかかる国税の間接税なので誤り。"},{"t":"tf","s":"租税の分類","imp":1,"q":"相続税は、都道府県や市町村が課す地方税である。","a":false,"e":"誤り。正しくは、相続税は国が課す国税で、直接税である。相続税は、相続する財産が多いほど高い税率がかかる累進税率をとっており、所得の再分配の役割ももつ。"},{"t":"qa","s":"租税の分類","imp":1,"q":"企業（法人）の所得（利益）に対して課される国税を何というか。","a":"法人税","e":"所得税と異なり、税率は原則として一定の比例税率である（基本税率は23.2%）。国際的な企業誘致の競争などを背景に、1980年代後半以降、税率は段階的に引き下げられてきた。"},{"t":"qa","s":"税の公平","imp":3,"q":"所得が多い人ほど高い税率を適用する課税のしくみを何というか。","a":"累進課税","alt":["累進課税制度","超過累進課税","累進税制","累進税率"],"e":"日本の所得税は、課税される所得に応じて5%から45%までの7段階の税率が、所得の段階を超えた部分ごとに適用される（超過累進税率）。所得の再分配とビルト・イン・スタビライザーの役割を果たす。"},{"t":"qa","s":"税の公平","imp":3,"q":"所得の多い人ほど多くの税を負担すべきだという、税の公平の考え方を何というか。","a":"垂直的公平","e":"これに対し、所得が同じなら同じ税負担をすべきだという考え方を水平的公平という。累進課税は垂直的公平を重視したしくみである。"},{"t":"ex","s":"税の公平","imp":2,"q":"税の公平について、垂直的公平と水平的公平の違いを説明せよ。","a":"垂直的公平とは、所得や財産の多い人ほど多くの税を負担すべきだという考え方で、所得税の累進課税などが実現の手段となる。水平的公平とは、所得が同じであれば、職業や所得の種類などにかかわらず同じ税負担であるべきだという考え方である。給与所得者と自営業者などで税務署による所得の把握の程度が異なることは、水平的公平の問題とされる。","e":"ポイント：①垂直的公平＝負担する能力の高い人ほど多く負担する（累進課税） ②水平的公平＝同じ所得なら同じ負担 ③職業による所得の捕捉率の差（クロヨン）は水平的公平の問題。"},{"t":"qa","s":"税の公平","imp":2,"q":"日本の所得税の最高税率は何%か（住民税や復興特別所得税は含めない）。","a":"45%","alt":["45パーセント","45％"],"e":"2015年分から、課税所得4,000万円を超える部分に45%が適用されている。住民税（10%）と合わせると最高55%になる。所得税の最高税率は1980年代初めには75%だったが、段階的に引き下げられて1999年には37%となった。その後は引き上げられ、2015年分から45%となっている。"},{"t":"tf","s":"税の公平","imp":3,"q":"消費税は、所得の低い人ほど所得に占める税負担の割合が大きくなる逆進性をもつといわれる。","a":true,"e":"正しい。所得の低い人は所得の大部分を消費に使うため、所得に対する消費税の負担割合が高くなる。逆進性を緩和するため、2019年に飲食料品などへの軽減税率が導入された。"},{"t":"ex","s":"税の公平","imp":2,"q":"消費税が逆進的であるといわれる理由を説明せよ。","a":"消費税は、所得に関係なく消費額に同じ税率でかかる。所得の低い人は所得の大部分を生活に必要な消費に使うため、所得に占める消費税の負担の割合が高くなる。一方、所得の高い人は所得の一部を貯蓄に回すため、所得に占める消費税の負担の割合は低くなる。このように、所得が低い人ほど負担率が高くなるからである。","e":"ポイント：①消費額に一律の税率がかかる ②所得の低い人ほど所得に占める消費の割合が高い ③所得に対する負担率が低所得者ほど高くなる（対策として軽減税率など）。"},{"t":"mc","s":"税の公平","imp":2,"q":"年収300万円のうち270万円を消費するAさんと、年収1,000万円のうち600万円を消費するBさんがいる。消費税率を10%とし、すべての消費に税がかかる（消費額は税抜きの金額）とするとき、年収に対する消費税負担の割合の組合せとして正しいものを一つ選べ。","c":["Aさん9%、Bさん6%","Aさん10%、Bさん10%","Aさん6%、Bさん9%","Aさん27%、Bさん60%"],"a":0,"e":"Aさんの消費税額は270万円×10%＝27万円で、年収300万円に対して9%となる。Bさんは600万円×10%＝60万円で、年収1,000万円に対して6%となる。所得の低いAさんのほうが負担の割合が高く、これが消費税の逆進性である。27%・60%は税額（万円）を割合と取り違えたもので誤り。"},{"t":"tf","s":"税の公平","imp":2,"q":"所得税の累進課税制度は、主に水平的公平を実現するためのしくみである。","a":false,"e":"誤り。正しくは、所得の多い人ほど高い税率を課す累進課税は、垂直的公平を実現するためのしくみである。水平的公平は、同じ所得の人には同じ税負担を求める考え方である。"},{"t":"qa","s":"消費税の歩み","imp":2,"q":"日本で消費税が税率3%で導入されたのは何年か。","a":"1989年","alt":["1989","平成元年"],"e":"竹下登内閣のもとで導入された。その後、1997年に5%、2014年に8%、2019年に10%へと引き上げられた。"},{"t":"mc","s":"消費税の歩み","imp":3,"q":"日本の消費税率（標準税率）の推移として正しいものを一つ選べ。","c":["1989年3% → 1997年5% → 2014年8% → 2019年10%","1989年3% → 1994年5% → 2014年8% → 2019年10%","1989年5% → 1997年8% → 2014年10% → 2019年12%","1989年3% → 1997年5% → 2012年8% → 2015年10%"],"a":0,"e":"消費税は1989年に3%で導入され、1997年に5%（地方消費税1%を含む）、2014年に8%、2019年10月に10%へと引き上げられた。2012年は、税率の引上げを決めた社会保障と税の一体改革の関連法が成立した年である。10%への引上げは当初2015年に予定されていたが、2度延期された。"},{"t":"tf","s":"消費税の歩み","imp":2,"q":"2019年10月に消費税率が10%に引き上げられた際、酒類や外食も含めたすべての飲食料品に、軽減税率8%が適用された。","a":false,"e":"誤り。正しくは、軽減税率8%の対象は、酒類と外食を除く飲食料品と、定期購読契約にもとづく週2回以上発行の新聞である。持ち帰りの弁当は8%、店内での飲食は10%というように、線引きの複雑さも指摘されている。"},{"t":"qa","s":"消費税の歩み","imp":2,"q":"2023年10月に導入された、事業者が仕入れにかかった消費税額を差し引く（仕入税額控除を受ける）ために、登録番号や税率ごとの税額を記載した適格請求書の保存を必要とする制度を何というか。","a":"インボイス制度","alt":["適格請求書等保存方式","インボイス方式","適格請求書保存方式"],"e":"軽減税率の導入で税率が複数になったため、取引ごとの正確な税率と税額を把握することが目的である。免税事業者は登録しなければインボイスを発行できないため、取引で不利になるとの指摘もある。"},{"t":"ex","s":"消費税の歩み","imp":1,"q":"消費税の軽減税率の目的と、その問題点を説明せよ。","a":"軽減税率は、飲食料品などの生活必需品の税率を低くすることで、所得の低い人の負担を軽くし、消費税の逆進性をやわらげることを目的としている。しかし、所得の高い人も飲食料品を多く購入するため恩恵を受けることや、対象となる品目の線引きが複雑になること、税収が減ることなどが問題点として指摘されている。","e":"ポイント：①生活必需品の税率を低くする ②逆進性の緩和が目的 ③問題点＝高所得者も恩恵を受ける・線引きの複雑さ・税収の減少。"}]});</script>
<script>QDATA.push({"unit":"u18","questions":[{"t":"qa","s":"直間比率と国民負担","imp":3,"q":"1949年にアメリカの財政学者を団長とする使節団が行い、所得税などの直接税を中心とする戦後日本の税制の基礎となった勧告を何というか。","a":"シャウプ勧告","e":"所得税を中心とする直接税中心の税制のほか、地方税の独立（地方財政の強化）なども勧告した。これにより、戦後の日本の税制は直接税の比率が高い体系となった。"},{"t":"qa","s":"直間比率と国民負担","imp":2,"q":"税収全体に占める直接税と間接税の割合を何というか。","a":"直間比率","e":"シャウプ勧告以来、日本は直接税の比率が高かったが、1989年の消費税の導入とその後の税率の引上げによって、間接税の比率が高まってきた。"},{"t":"tf","s":"直間比率と国民負担","imp":2,"q":"アメリカは付加価値税などの間接税の比率が高く、ヨーロッパ諸国は所得税などの直接税の比率が高い。","a":false,"e":"誤り。正しくは、アメリカは所得課税が中心で直接税の比率が高く（国の税として付加価値税をもたない）、ヨーロッパ諸国は標準税率20%前後の付加価値税をもつため、間接税の比率が比較的高い。"},{"t":"qa","s":"直間比率と国民負担","imp":3,"q":"国民所得に対する、租税負担と社会保障負担（社会保険料など）の合計の割合を何というか。","a":"国民負担率","e":"日本は近年、40%台半ばから後半で推移している。これに財政赤字を加えたものを潜在的国民負担率という。高齢化にともない、社会保障負担の割合が高まってきた。"},{"t":"mc","s":"直間比率と国民負担","imp":2,"q":"国民負担率についての記述として最も適当なものを一つ選べ。","c":["日本の国民負担率は、アメリカより高く、フランスやスウェーデンより低い。","日本の国民負担率は、主要な先進国のなかで最も高い。","国民負担率とは、国内総生産（GDP）に対する租税負担だけの割合である。","北欧諸国は、手厚い福祉を実現するために国民負担率を低く抑えている。"],"a":0,"e":"日本の国民負担率はアメリカより高いが、フランスやスウェーデンなどのヨーロッパ諸国より低い。したがって主要先進国で最も高いとする記述は誤り。国民負担率は国民所得に対する租税負担と社会保障負担の合計の割合なので誤り。北欧諸国は高福祉・高負担であり、国民負担率は高いので誤り。"},{"t":"tf","s":"直間比率と国民負担","imp":1,"q":"ヨーロッパ諸国の付加価値税（日本の消費税にあたる税）の標準税率は、多くの国で日本の10%より低い。","a":false,"e":"誤り。正しくは、ヨーロッパ諸国の付加価値税の標準税率は、イギリスやフランスで20%、スウェーデンで25%など、日本の10%より高い国が多い。その一方で、食料品などに軽減税率を設けている国も多い。"},{"t":"qa","s":"国債の種類と原則","imp":3,"q":"道路や港湾などの公共事業費の財源にあてるため、財政法第4条のただし書きにもとづいて発行される国債を何というか。","a":"建設国債","alt":["建設公債","4条国債"],"e":"道路や橋などの社会資本は将来の世代も利用できるため、借金でまかなうことが認められている。1966年度から毎年発行されている。"},{"t":"qa","s":"国債の種類と原則","imp":3,"q":"財政法では発行が認められていないため、歳入の不足を補う目的で、特別の法律（特例法）を制定して発行される国債を何というか。","a":"特例国債","alt":["赤字国債","特例公債","赤字公債"],"e":"1965年度に戦後初めての国債として発行され、1975年度からは本格的に発行されるようになった。バブル景気による税収増で1990〜93年度は発行されなかったが、その後再び毎年発行されている。"},{"t":"tf","s":"国債の種類と原則","imp":3,"q":"財政法は、公共事業費などの財源にあてる場合に限って国債の発行を認めており、歳入の不足を補うための赤字国債の発行は原則として認めていない。","a":true,"e":"正しい。財政法第4条は、国の歳出は原則として公債以外の歳入でまかなうとし、ただし書きで公共事業費などの財源に限って国債の発行を認めている。赤字国債を発行するには、特例法を制定する必要がある。"},{"t":"qa","s":"国債の種類と原則","imp":3,"q":"財政法第5条にもとづき、国債を日本銀行に直接引き受けさせることを原則として禁止し、民間の金融機関などに買ってもらって発行する原則を何というか。","a":"市中消化の原則","alt":["市中消化","国債の市中消化の原則"],"e":"日本銀行が国債を直接引き受けると通貨が過剰に供給され、激しいインフレーションを招くおそれがあるためである。ただし、日本銀行が市場から国債を買い入れる買いオペは禁止されていない。"},{"t":"mc","s":"国債の種類と原則","imp":3,"q":"1965年度と1975年度の国債発行についての記述として最も適当なものを一つ選べ。","c":["1965年度には不況による税収不足から戦後初めて国債が発行され、1975年度からは特例国債が本格的に発行されるようになった。","1965年度には建設国債の発行が禁止され、1975年度には特例国債の発行が財政法の改正で恒久的に認められた。","1965年度には石油危機による税収不足から国債が発行され、1975年度には国債の発行額がゼロになった。","1965年度には国債の日本銀行引受けが始まり、1975年度に市中消化の原則が定められた。"],"a":0,"e":"1965年度は不況による税収不足を補うため、特例法にもとづいて戦後初の国債が発行され、翌1966年度からは建設国債が毎年発行されている。1975年度は石油危機後の不況による税収不足から特例国債が本格的に発行され、以後継続的に発行されるようになった。特例国債は財政法の改正ではなく特例法で発行されるので、恒久的に認められたとする記述は誤り。石油危機は1973年なので、1965年度の原因とする記述は誤り。市中消化の原則は1947年制定の財政法で定められたので、1975年度とする記述は誤り。"},{"t":"ex","s":"国債の種類と原則","imp":3,"q":"建設国債と特例国債（赤字国債）の違いを、発行の根拠と使いみちに着目して説明せよ。","a":"建設国債は、財政法第4条のただし書きにもとづいて、道路や港湾などの公共事業費などの財源にあてるために発行される国債である。特例国債は、財政法では認められていないため、特別の法律を制定して発行される国債で、税収などの不足を補い、社会保障費などの経常的な経費にもあてられる。","e":"ポイント：①建設国債＝財政法第4条にもとづく・公共事業費などの財源 ②特例国債＝財政法に規定がなく特例法で発行・歳入不足の補填 ③建設国債の対象となる社会資本は将来の世代も利用できる。"},{"t":"tf","s":"国債の種類と原則","imp":2,"q":"財政法第5条は国債の日本銀行による引受けを原則として禁止しているので、日本銀行が金融市場で国債を買い入れることも禁止されている。","a":false,"e":"誤り。正しくは、禁止されているのは政府が新たに発行する国債を日本銀行が直接引き受けることであり、すでに市場に出回っている国債を買いオペで買い入れることは禁止されていない。量的・質的金融緩和のもとで日本銀行は大量の国債を買い入れ、国債発行残高の約半分を保有するまでになった。"},{"t":"ex","s":"国債の種類と原則","imp":1,"q":"財政法第5条が、国債の日本銀行引受けを原則として禁止している理由を説明せよ。","a":"日本銀行が政府から国債を直接引き受けると、政府は必要なだけ資金を得られるようになり、財政の規律が失われて歳出が膨らみやすい。また、日本銀行が国債と引きかえに通貨を際限なく供給することになり、激しいインフレーションを招くおそれがある。戦前・戦中に日本銀行の国債引受けで軍事費をまかない、戦後に激しいインフレーションが起きたことへの反省にもとづいている。","e":"ポイント：①財政規律の喪失 ②通貨の過剰な供給→インフレーション ③戦前・戦中の日本銀行引受けと戦後インフレへの反省。"},{"t":"qa","s":"国債依存度と残高","imp":3,"q":"一般会計の歳入に占める公債金（国債の発行による収入）の割合を何というか。","a":"国債依存度","alt":["公債依存度"],"e":"近年の当初予算では約4分の1から3分の1である。新型コロナウイルス感染症への対策で大規模な補正予算が組まれた2020年度には、6割を超える異例の高さとなった。"},{"t":"mc","s":"国債依存度と残高","imp":2,"q":"ある年度の一般会計の歳入が120兆円で、その内訳は税収80兆円、その他の収入10兆円、公債金30兆円であった。この年度の国債依存度として正しいものを一つ選べ。","c":["25%","30%","約33%","約38%"],"a":0,"e":"国債依存度は、公債金÷歳入総額で求める。30兆円÷120兆円＝25%となる。約33%は公債金を公債金以外の収入（90兆円）で割った値、約38%は公債金を税収（80兆円）で割った値であり、いずれも誤り。"},{"t":"tf","s":"国債依存度と残高","imp":2,"q":"日本の普通国債の残高は、2020年代には1,000兆円を超え、国内総生産（GDP）を大きく上回る規模になっている。","a":true,"e":"正しい。国債残高は、バブル崩壊後の景気対策や、社会保障関係費の増加による歳出の拡大を背景に増え続けた。国と地方を合わせた長期債務残高はGDPの約2倍に達し、主要先進国のなかで最も高い水準である。"},{"t":"tf","s":"国債依存度と残高","imp":1,"q":"1980年代後半のバブル景気の時期も含めて、特例国債（赤字国債）は1975年度以降、毎年度途切れることなく発行されてきた。","a":false,"e":"誤り。正しくは、バブル景気による税収の増加で、1990年度から1993年度までは特例国債の発行がゼロになった。しかし、バブル崩壊後の税収の減少や景気対策のため、その後再び発行されるようになった。"},{"t":"qa","s":"財政の課題","imp":3,"q":"国債費や社会保障関係費など削減の難しい経費が増えて、政策に自由に使える予算が少なくなり、財政が景気対策や新たな課題に柔軟に対応できなくなることを何というか。","a":"財政の硬直化","alt":["財政硬直化"],"e":"社会保障関係費・国債費・地方交付税交付金等の三つで一般会計歳出の約4分の3を占めており、教育や公共事業などに使える予算は限られている。"},{"t":"qa","s":"財政の課題","imp":2,"q":"政府が大量の国債を発行して市場から資金を集めると、金利が上昇し、民間企業の資金調達や設備投資が抑えられてしまうことを何というか。","a":"クラウディング・アウト","alt":["クラウディングアウト"],"e":"「押しのける」という意味の英語に由来し、政府の資金需要が民間の資金需要を押しのけることをいう。財政支出を拡大しても、民間投資が減ってしまえば景気刺激の効果が弱まる。"},{"t":"tf","s":"財政の課題","imp":2,"q":"赤字国債で調達した資金を現在の世代のための支出にあてても、その返済の負担は現在の世代だけが負うので、世代間の不公平は生じない。","a":false,"e":"誤り。正しくは、国債の償還は長期にわたり、将来の世代が税で返済の負担を負うことになる。便益を受けない将来の世代に負担を先送りするため、世代間の不公平が生じると指摘されている。"},{"t":"mc","s":"財政の課題","imp":2,"q":"日本の財政の課題についての記述として適当でないものを一つ選べ。","c":["国債の残高が大きくても、金利が上昇すれば国債の利払い費は減るので、財政の負担は軽くなる。","国債費の増加は、教育や公共事業などに使える予算を圧迫する。","大量の国債の発行は、民間の資金需要と競合して金利を押し上げるおそれがある。","国債の大量発行が続くと、将来の世代の税負担が重くなるおそれがある。"],"a":0,"e":"金利が上昇すると、新たに発行する国債や借り換える国債の利払い費が増えるので、財政の負担は重くなる。したがって利払い費が減るとする記述は誤りである。国債費の増加による財政の硬直化、クラウディング・アウト、将来世代の負担の増加は、いずれも財政の課題として指摘されている。"},{"t":"ex","s":"財政の課題","imp":2,"q":"財政の硬直化とは何か、その原因とともに説明せよ。","a":"財政の硬直化とは、歳出のうち削減の難しい経費の割合が高まり、政策に自由に使える予算が少なくなって、財政が景気対策や新たな課題に柔軟に対応できなくなることである。日本では、国債の大量発行で元利払いのための国債費が増えていることや、高齢化によって社会保障関係費が増え続けていることが主な原因となっている。","e":"ポイント：①削減の難しい経費の増加で政策的経費が圧迫される ②原因の一つ目は国債費の増加 ③原因の二つ目は高齢化による社会保障関係費の増加。"},{"t":"qa","s":"プライマリー・バランス","imp":3,"q":"国債の発行による収入を除いた税収などの歳入と、国債費を除いた政策的経費（歳出）との差で、財政の健全性を示す指標を何というか。","a":"プライマリー・バランス","alt":["プライマリーバランス","基礎的財政収支","PB"],"e":"税収などで、その年度の政策的経費をどれだけまかなえているかを示す。黒字なら政策的経費を借金に頼らずにまかなえていることになる。日本は長く赤字が続いている。"},{"t":"mc","s":"プライマリー・バランス","imp":3,"q":"ある年度の一般会計で、歳出が100兆円（うち国債費25兆円）、歳入が100兆円（うち公債金30兆円）であった。この年度のプライマリー・バランスとして正しいものを一つ選べ。","c":["5兆円の赤字","5兆円の黒字","30兆円の赤字","25兆円の赤字"],"a":0,"e":"プライマリー・バランスは（歳入−公債金）−（歳出−国債費）で求める。（100−30）−（100−25）＝70−75＝−5兆円となり、5兆円の赤字である。歳入と歳出が等しいときは、国債費から公債金を引いた値（25−30＝−5）と一致する。"},{"t":"tf","s":"プライマリー・バランス","imp":2,"q":"プライマリー・バランスが黒字になれば、国債の残高は必ず減少する。","a":false,"e":"誤り。正しくは、プライマリー・バランスが均衡しても、国債の利払いの分は新たな借金でまかなうことになるため、国債の残高は増える。黒字が利払い費を上回らなければ残高は減らない。そのため、債務残高の対GDP比を安定的に引き下げることもあわせて目標とされている。"},{"t":"ex","s":"プライマリー・バランス","imp":2,"q":"プライマリー・バランスが赤字であるとはどのような状態か、説明せよ。","a":"プライマリー・バランスが赤字であるとは、国債費を除いた政策的経費を、税収など国債の発行以外の収入でまかなえず、その不足を新たな国債の発行で補っている状態である。この状態では、過去の借金の返済や利払いだけでなく、現在の行政サービスの費用まで将来の世代に負担を先送りしていることになり、国債の残高は増え続ける。","e":"ポイント：①政策的経費が税収などを上回っている ②不足分を新たな国債の発行で補っている ③将来世代への負担の先送りと国債残高の増加。"},{"t":"tf","s":"プライマリー・バランス","imp":1,"q":"政府は国と地方を合わせたプライマリー・バランスの黒字化を財政健全化の目標としてかかげてきたが、その達成目標の年度はこれまでに何度も先送りされてきた。","a":true,"e":"正しい。2010年には2020年度までの黒字化が目標とされたが、2018年に2025年度へ先送りされるなど、達成が難しい状況が続いてきた。財政再建の取り組みとしては、1997年に財政構造改革法が制定されたが、翌年の金融危機にともなう景気の悪化で停止された例もある。"}]});</script>
<script>QDATA.push({"unit":"u19","questions":[{"t":"qa","s":"経済の民主化","imp":3,"q":"第二次世界大戦後、GHQ（連合国軍総司令部）の指令のもとで進められた経済の民主化の三大改革は何か。3つ答えよ。","a":"財閥解体・農地改革・労働の民主化","alt":["財閥解体・農地改革・労働組合の育成","農地改革・財閥解体・労働の民主化","財閥解体・労働の民主化・農地改革"],"e":"財閥解体は経済力の集中を防ぎ、農地改革は寄生地主制をなくし、労働の民主化は労働者の権利を保障した。いずれも戦前の日本経済の独占的・封建的な性格を改め、戦争を支えた経済の仕組みを取り除くねらいがあった。"},{"t":"qa","s":"経済の民主化","imp":1,"q":"財閥解体の過程で1946年に設置され、財閥本社（持株会社）などが保有していた株式を譲り受けて一般に売却した機関は何か。","a":"持株会社整理委員会","e":"財閥解体では持株会社整理委員会が株式を処分し、1947年には独占禁止法と過度経済力集中排除法が制定された。独占禁止法は持株会社を禁止したが、1997年の改正で持株会社は解禁された。"},{"t":"tf","s":"経済の民主化","imp":3,"q":"農地改革では、政府が地主の土地をすべて無償で没収し、小作人に無償で分け与えた。","a":false,"e":"正しくは、政府が不在地主の全小作地と、在村地主の一定面積（都府県では平均1町歩、北海道では4町歩）を超える小作地を強制的に買い上げ、小作人に安い価格で売り渡した。無償の没収・分配ではない。"},{"t":"ex","s":"経済の民主化","imp":3,"q":"農地改革の内容と、その結果を説明せよ。","a":"農地改革では、政府が不在地主の小作地のすべてと、在村地主の一定面積を超える小作地を強制的に買い上げ、小作人に安く売り渡した。その結果、寄生地主制が解体され、自作農が大幅に増えて農村の民主化と農民の生活向上が進んだ。一方で、経営規模の小さな零細農家が多く生まれ、のちの農業の課題となった。","e":"ポイント：①政府による強制的な買い上げと小作人への売り渡し ②寄生地主制の解体と自作農の創設 ③零細な経営規模という課題が残った"},{"t":"qa","s":"経済の民主化","imp":2,"q":"労働の民主化のために1945〜47年に制定された労働三法をすべて答えよ。","a":"労働組合法・労働関係調整法・労働基準法","alt":["労働基準法・労働組合法・労働関係調整法","労働組合法・労働基準法・労働関係調整法"],"e":"最初に制定されたのは労働組合法（1945年）で、続いて労働関係調整法（1946年）、労働基準法（1947年）が制定された。労働組合の結成が奨励され、戦後の労働運動が高まった。"},{"t":"mc","s":"経済の民主化","imp":2,"q":"戦後の経済の民主化に関する記述として最も適当なものを一つ選べ。","c":["財閥解体の一環として独占禁止法が制定され、その運用機関として公正取引委員会が設置された。","農地改革で地主から買い上げられた農地は国有地とされ、小作人に貸し付けられた。","労働三法のうち最初に制定されたのは労働基準法であり、労働組合法はその後に制定された。","農地改革の対象は不在地主の土地に限られ、在村地主の小作地はすべて対象外とされた。"],"a":0,"e":"独占禁止法は1947年に制定され、公正取引委員会が設置されたので正しい。『国有地とされ貸し付けられた』は誤りで、農地は小作人に売り渡され自作農が生まれた。『労働基準法が最初』は誤りで、最初は労働組合法（1945年）である。『在村地主の小作地はすべて対象外』は誤りで、一定面積を超える部分は買い上げの対象となった。"},{"t":"qa","s":"戦後復興","imp":3,"q":"1947年から本格的に実施された、限られた資金や資材を石炭・鉄鋼などの基幹産業に重点的に配分して生産の回復を図った政策は何か。","a":"傾斜生産方式","e":"石炭を増産して鉄鋼業に回し、増産した鉄鋼を炭鉱に回すという形で基幹産業の回復をめざした。資金は主に復興金融金庫から供給された。"},{"t":"qa","s":"戦後復興","imp":1,"q":"傾斜生産方式を提唱した経済学者は誰か。","a":"有沢広巳","alt":["有澤廣巳","有沢廣巳"],"e":"有沢広巳は第1次吉田茂内閣の経済政策のブレーンとして傾斜生産方式を立案した。人名を問われることは少ないが、政策名とセットで押さえておく。"},{"t":"qa","s":"戦後復興","imp":2,"q":"傾斜生産方式の資金を供給するために1947年に設立され、債券を日本銀行に引き受けさせて融資を行った政府の金融機関は何か。","a":"復興金融金庫","alt":["復金"],"e":"復興金融金庫が発行した債券（復金債）を日本銀行が引き受けたため、通貨量が大きく増えて激しいインフレーション（復金インフレ）を招いた。"},{"t":"tf","s":"戦後復興","imp":1,"q":"復興金融金庫の融資は国民の預金を原資としていたため、通貨量を増やさず、戦後のインフレを抑える効果があった。","a":false,"e":"正しくは、復興金融金庫は復金債を日本銀行に引き受けさせて資金を調達したため、通貨量が増加し、インフレ（復金インフレ）をさらに激しくした。"},{"t":"qa","s":"戦後復興","imp":2,"q":"1948年にGHQが日本政府に指示した、予算の均衡・徴税の強化・賃金の安定・物価の統制などからなるインフレ収束のための経済政策は何か。","a":"経済安定9原則","alt":["経済安定九原則"],"e":"経済安定9原則を具体化するために翌1949年に実施されたのがドッジ・ラインである。9原則（方針）→ドッジ・ライン（実行）の順で覚える。"},{"t":"qa","s":"戦後復興","imp":3,"q":"1949年、GHQの経済顧問として来日したアメリカの銀行家が指導した、超均衡予算や復興金融金庫の融資停止などによるインフレ収束策を何というか。","a":"ドッジ・ライン","alt":["ドッジライン"],"e":"デトロイト銀行頭取のドッジが指導した。インフレは収束したが、通貨量が急に減ったため不況（安定恐慌）を招いた。"},{"t":"qa","s":"戦後復興","imp":3,"q":"ドッジ・ラインの一環として1949年に設定された円とドルの単一為替レートは、1ドル何円か。","a":"1ドル=360円","alt":["360円","1ドル360円","1ドル＝360円"],"e":"この固定レートは1971年のニクソン・ショックまで続いた。高度経済成長期には円が割安となり、日本の輸出に有利に働いた。"},{"t":"ex","s":"戦後復興","imp":3,"q":"ドッジ・ラインの内容と、それが日本経済に与えた影響を説明せよ。","a":"ドッジ・ラインでは、赤字を許さない超均衡予算の編成、復興金融金庫の新たな融資の停止、補助金の削減、1ドル=360円の単一為替レートの設定などが行われた。その結果、戦後のインフレは収束したが、通貨量が急に減ったため企業の倒産や失業が増え、安定恐慌（ドッジ不況）と呼ばれる深刻な不況となった。","e":"ポイント：①超均衡予算と復金融資の停止 ②1ドル=360円の単一為替レート ③インフレは収束したが安定恐慌を招いた"},{"t":"qa","s":"戦後復興","imp":3,"q":"1949年、アメリカの財政学者を団長とする使節団が行った、所得税などの直接税を中心とする税制への改革を求めた勧告は何か。","a":"シャウプ勧告","e":"シャウプ勧告にもとづき、直接税中心主義や申告納税制度などが導入され、戦後日本の税制の基礎となった。ドッジ・ライン（財政・金融）とシャウプ勧告（税制）は同じ1949年なので混同に注意する。"},{"t":"tf","s":"戦後復興","imp":3,"q":"1950年に始まった朝鮮戦争の際、在日アメリカ軍による物資やサービスの大量の調達（特需）が生じ、日本経済はドッジ・ライン後の不況から抜け出すきっかけをつかんだ。","a":true,"e":"朝鮮特需（特需景気）により、繊維や金属などの生産が拡大し、企業の業績が回復した。これが復興を加速させ、のちの高度経済成長への足がかりとなった。"},{"t":"qa","s":"戦後復興","imp":3,"q":"1956年度の『経済白書』は、日本経済が戦前の水準を回復し、復興による成長の時代は終わったと述べた。「もはや（　）ではない」の（　）に入る語を答えよ。","a":"戦後","e":"1950年代半ばまでに、生産や国民生活の水準は戦前の水準を回復していた。白書は、今後の成長は技術革新などの近代化によって支えられなければならないと説いた。"},{"t":"mc","s":"戦後復興","imp":2,"q":"戦後復興期の出来事を古い順に並べたものとして正しいものを一つ選べ。","c":["傾斜生産方式の開始 → 経済安定9原則の指示 → ドッジ・ラインの実施 → 朝鮮特需の発生","経済安定9原則の指示 → 傾斜生産方式の開始 → 朝鮮特需の発生 → ドッジ・ラインの実施","傾斜生産方式の開始 → ドッジ・ラインの実施 → 経済安定9原則の指示 → 朝鮮特需の発生","ドッジ・ラインの実施 → 傾斜生産方式の開始 → 経済安定9原則の指示 → 朝鮮特需の発生"],"a":0,"e":"傾斜生産方式は1947年、経済安定9原則は1948年、ドッジ・ラインは1949年、朝鮮特需は1950年である。インフレを生んだ傾斜生産方式→インフレ収束の方針（9原則）→その実行（ドッジ・ライン）→不況からの脱出（特需）という因果の流れで覚えるとよい。"}]});</script>
<script>QDATA.push({"unit":"u19","questions":[{"t":"qa","s":"高度経済成長","imp":3,"q":"1955年ごろから1973年ごろまでの高度経済成長期に、日本の実質経済成長率は年平均でおよそ何%であったか。","a":"約10%","alt":["10%","約10％","10％","10パーセント","約10パーセント"],"e":"年平均10%前後という高い成長が20年近く続いた。石油危機後の安定成長期は年平均4%前後、バブル崩壊後の1990年代以降は1%前後と、成長率は段階的に低下した。"},{"t":"mc","s":"高度経済成長","imp":3,"q":"高度経済成長期の好景気を古い順に並べたものとして正しいものを一つ選べ。","c":["神武景気 → 岩戸景気 → オリンピック景気 → いざなぎ景気","岩戸景気 → 神武景気 → いざなぎ景気 → オリンピック景気","神武景気 → オリンピック景気 → 岩戸景気 → いざなぎ景気","いざなぎ景気 → 神武景気 → 岩戸景気 → オリンピック景気"],"a":0,"e":"神武景気（1954〜57年）→岩戸景気（1958〜61年）→オリンピック景気（1962〜64年）→いざなぎ景気（1965〜70年）の順である。「神武天皇以来」「天の岩戸以来」「いざなぎの神以来」と、好景気が更新されるたびに名前が神話をさかのぼっていったことから覚えるとよい。"},{"t":"qa","s":"高度経済成長","imp":2,"q":"1965年から1970年まで57か月続いた、高度経済成長期で最も長い好景気を何というか。","a":"いざなぎ景気","e":"いざなぎ景気の時期に、日本のGNPは資本主義国で第2位となった。2002年から2008年まで続いた景気拡大（いざなみ景気）と名前が似ているので混同に注意する。"},{"t":"qa","s":"高度経済成長","imp":3,"q":"1960年に池田勇人内閣が打ち出した、10年間で国民所得を2倍にすることを目標とした計画は何か。","a":"国民所得倍増計画","alt":["所得倍増計画"],"e":"社会資本の充実や産業構造の高度化などを掲げた。実際の成長は計画を上回り、国民所得は目標より早く、約7年で2倍に達した。"},{"t":"tf","s":"高度経済成長","imp":1,"q":"国民所得倍増計画は目標を達成できず、国民所得が2倍になるまでには計画の2倍近い期間がかかった。","a":false,"e":"正しくは、実際の経済成長率は計画を上回り、国民所得は10年を待たず、約7年で2倍となった。"},{"t":"qa","s":"高度経済成長","imp":2,"q":"1968年、日本のGNP（国民総生産）は資本主義国の中で第2位となった。このとき第1位であった国はどこか。","a":"アメリカ","alt":["アメリカ合衆国","米国"],"e":"日本は1968年に西ドイツを抜いて、資本主義国でアメリカに次ぐ第2位の経済大国となった。その後、2010年に中国に抜かれるまで40年以上、第2位の地位を保った。"},{"t":"qa","s":"開放経済体制","imp":3,"q":"1963年に日本が移行した、国際収支の悪化を理由とする輸入制限ができなくなるGATT上の国の地位を何というか。","a":"GATT11条国","alt":["ガット11条国","GATT十一条国"],"e":"GATT11条国への移行で貿易の自由化が進んだ。翌1964年には、為替制限ができなくなるIMF8条国に移行した。「輸入制限の禁止＝GATT11条国」「為替制限の禁止＝IMF8条国」と区別する。"},{"t":"tf","s":"開放経済体制","imp":2,"q":"1963年に日本がIMF8条国に移行したことで、国際収支の悪化を理由とする輸入制限ができなくなった。","a":false,"e":"正しくは、1963年に移行して輸入制限ができなくなったのはGATT11条国である。IMF8条国への移行は1964年で、国際収支の悪化を理由とする為替制限ができなくなった。"},{"t":"qa","s":"開放経済体制","imp":2,"q":"1964年に日本が加盟した、「先進国クラブ」とも呼ばれ、加盟によって資本の自由化を求められることになった国際機関は何か。","a":"OECD","alt":["経済協力開発機構"],"e":"OECD加盟により、外国企業の日本への投資などを認める資本の自由化が1967年から段階的に進められた。1964年は東京オリンピックの年でもあり、日本が先進国の仲間入りをした年といえる。"},{"t":"ex","s":"開放経済体制","imp":2,"q":"1960年代に日本が開放経済体制に移行した内容を説明せよ。","a":"日本は1963年にGATT11条国へ移行して国際収支を理由とする輸入制限ができなくなり、貿易の自由化を進めた。1964年にはIMF8条国へ移行して為替制限ができなくなり、同年OECDにも加盟して資本の自由化を求められた。こうして日本は、先進国として国際競争に直接さらされる開放経済体制に入った。","e":"ポイント：①GATT11条国（1963年）＝貿易の自由化 ②IMF8条国（1964年）＝為替の自由化 ③OECD加盟（1964年）＝資本の自由化"},{"t":"ex","s":"高度成長の要因","imp":3,"q":"日本の高度経済成長を可能にした主な要因を説明せよ。","a":"国民の高い貯蓄率に支えられた豊富な資金が銀行を通じて企業に貸し出され（間接金融）、活発な民間設備投資が「投資が投資を呼ぶ」形で続いた。また、欧米からの技術導入による技術革新、農村から都市へ移動した豊富で質の高い労働力、安価な石油、1ドル=360円の固定相場による輸出の有利さなども成長を支えた。","e":"ポイント：①高い貯蓄率と間接金融による設備投資 ②技術革新と豊富な労働力 ③安価な原油と割安な固定相場（1ドル=360円）"},{"t":"qa","s":"高度成長の要因","imp":1,"q":"高度経済成長期に、ある産業の設備投資が関連する産業の設備投資を次々に誘発し、経済全体の投資が拡大していった状況を表す言葉は何か。「投資が（　）」の（　）に入る語句を答えよ。","a":"投資を呼ぶ","e":"岩戸景気のころの状況を表した言葉として知られる。鉄鋼・石油化学・機械などの重化学工業で大規模な設備投資が相次ぎ、太平洋ベルトに工業地帯が形成された。"},{"t":"mc","s":"高度成長の要因","imp":2,"q":"日本の高度経済成長の要因として適当でないものを一つ選べ。","c":["家計の高い貯蓄率を背景に、銀行を通じて企業に設備投資の資金が供給されたこと。","中東などから安価な原油を大量に輸入できたこと。","変動相場制のもとで円高が進み、輸入原材料が安く手に入ったこと。","農村から都市へ若い労働力が大量に移動したこと。"],"a":2,"e":"高度経済成長期は1ドル=360円の固定相場制で、円はむしろ割安だったので『変動相場制のもとで円高が進み』は適当でない。日本が変動相場制に移行したのは1973年である。高い貯蓄率と間接金融、安価な原油、農村からの豊富な労働力は、いずれも高度成長を支えた要因である。"},{"t":"qa","s":"高度成長の要因","imp":3,"q":"1950年代後半に普及し、「三種の神器」と呼ばれた家庭用電化製品は何か。3つ答えよ。","a":"白黒テレビ・電気洗濯機・電気冷蔵庫","alt":["白黒テレビ・洗濯機・冷蔵庫","テレビ・洗濯機・冷蔵庫","白黒テレビ・電気冷蔵庫・電気洗濯機"],"e":"所得の向上で耐久消費財が普及し、大量生産・大量消費の時代が始まった。国内の消費需要の拡大も高度成長を支えた。1960年代後半には、カラーテレビ・クーラー・自動車（カー）が「3C（新三種の神器）」と呼ばれた。"},{"t":"tf","s":"高度成長の要因","imp":1,"q":"1960年代後半には、カラーテレビ・クーラー・自動車が、それぞれの英語の頭文字から「3C」と呼ばれて普及した。","a":true,"e":"3C（新三種の神器）は、カラーテレビ（Color television）、クーラー（Cooler）、自動車（Car）の頭文字をとったものである。1950年代後半の「三種の神器」（白黒テレビ・電気洗濯機・電気冷蔵庫）と区別する。"},{"t":"ex","s":"高度成長のひずみ","imp":2,"q":"高度経済成長期の「国際収支の天井」とは何か、説明せよ。","a":"高度経済成長期の前半には、景気が拡大すると原材料などの輸入が増えて国際収支が赤字になり、外貨準備が不足した。そのため政府や日本銀行は金融引き締めなどで景気を抑えなければならず、これが成長の上限（天井）となった。輸出が大きく伸びた1960年代後半には、この制約はほぼ解消された。","e":"ポイント：①景気拡大→輸入増加→国際収支の赤字 ②外貨不足のため景気の引き締めが必要になった ③1960年代後半の輸出拡大で解消"},{"t":"qa","s":"高度成長のひずみ","imp":2,"q":"高度経済成長期に、若者を中心とする人口が都市へ流出した農山村などで、人口の減少によって地域社会の維持が困難になった状態を何というか。","a":"過疎","alt":["過疎化"],"e":"人口が流入した大都市では、住宅不足・交通渋滞・ごみ問題などの過密が深刻になった。過密と過疎は、公害とともに高度経済成長のひずみの代表例である。"},{"t":"mc","s":"高度成長のひずみ","imp":2,"q":"高度経済成長期に生じたひずみとして適当でないものを一つ選べ。","c":["工場の排煙や排水による公害が各地で深刻化した。","大都市への人口集中で、住宅不足や交通渋滞などの過密問題が生じた。","道路・下水道・公園など生活関連の社会資本の整備が、産業基盤の整備に比べて遅れた。","物価が長期にわたって下落し続けるデフレーションが進行した。"],"a":3,"e":"高度経済成長期には消費者物価はむしろ上昇傾向にあったので『物価が長期にわたって下落し続ける』は適当でない。日本で持続的な物価下落（デフレ）が問題となったのは1990年代後半以降である。公害、過密、生活関連社会資本の立ち遅れは、いずれも高度成長のひずみである。"},{"t":"qa","s":"高度成長の終わり","imp":3,"q":"1971年8月、アメリカのニクソン大統領が金とドルの交換停止などを発表し、国際通貨体制が大きく揺らいだ出来事を何というか。","a":"ニクソン・ショック","alt":["ニクソンショック","ドル・ショック","ドルショック"],"e":"1ドル=360円の固定相場という、高度成長を支えた条件の一つが失われるきっかけとなった。為替制度の変化の詳細は国際経済の単元で学ぶ。"},{"t":"qa","s":"高度成長の終わり","imp":1,"q":"1971年12月のスミソニアン協定で、円の対ドル為替レートは1ドル何円に改められたか。","a":"1ドル=308円","alt":["308円","1ドル308円","1ドル＝308円"],"e":"ニクソン・ショック後、固定相場制を維持するために円などの通貨が切り上げられたが、ドルへの信認は回復せず、1973年に主要国は変動相場制へ移行した。"},{"t":"qa","s":"高度成長の終わり","imp":2,"q":"1972年に首相となり、新幹線や高速道路網の整備によって工業の地方分散を進める「日本列島改造論」を掲げた人物は誰か。","a":"田中角栄","e":"列島改造ブームで土地への投機が広がり、地価が急騰した。積極的な財政支出や金融緩和も重なって物価が上昇していたところに、1973年の石油危機が追い打ちをかけた。"},{"t":"qa","s":"高度成長の終わり","imp":3,"q":"1973年の第四次中東戦争をきっかけに、アラブの産油国が原油の供給制限や大幅な値上げを行い、世界経済が混乱した出来事を何というか。","a":"第一次石油危機","alt":["第1次石油危機","第一次オイル・ショック","第一次オイルショック","石油危機","オイル・ショック"],"e":"OAPEC（アラブ石油輸出国機構）が石油戦略として供給を制限し、OPEC（石油輸出国機構）が原油価格を大幅に引き上げた。原油価格は短期間で約4倍になり、安価な石油に頼っていた日本経済は大きな打撃を受けた。"},{"t":"qa","s":"高度成長の終わり","imp":2,"q":"第一次石油危機の後、1974年に消費者物価が前年比20%を超えて上昇した激しいインフレは何と呼ばれたか。","a":"狂乱物価","e":"列島改造ブームによる地価上昇や金融緩和で物価が上がっていたところに、原油価格の高騰が重なった。トイレットペーパーなどの買いだめ騒ぎも起こった。"},{"t":"tf","s":"高度成長の終わり","imp":3,"q":"第一次石油危機の後も日本はプラス成長を続け、戦後初めて実質経済成長率がマイナスとなったのはバブル崩壊後の1990年代である。","a":false,"e":"正しくは、第一次石油危機の翌年の1974年に、日本は戦後初めてのマイナス成長となった。これにより高度経済成長は終わりを告げた。"},{"t":"ex","s":"高度成長の終わり","imp":3,"q":"スタグフレーションとは何か、第一次石油危機後の日本を例に説明せよ。","a":"スタグフレーションとは、景気の停滞（スタグネーション）と物価の上昇（インフレーション）が同時に進行する現象である。第一次石油危機後の日本では、原油価格の高騰で物価が急上昇する一方、生産が落ち込み、1974年には戦後初のマイナス成長となった。","e":"ポイント：①不況と物価上昇が同時に起こる ②原油価格の高騰というコスト面からの物価上昇（コスト・プッシュ・インフレ） ③通常の不況期と違い物価が下がらない"},{"t":"mc","s":"高度成長の終わり","imp":2,"q":"第一次石油危機に関する記述として最も適当なものを一つ選べ。","c":["OAPECやOPECによる供給制限と値上げで、原油価格は短期間に約4倍に上昇した。","1979年のイラン革命をきっかけに起こり、日本は省エネルギーの進展により影響を小さく抑えた。","原油価格が急落したため、日本では原材料費の低下によって物価が大きく下落した。","日本政府は石油危機に対応するため、変動相場制をやめて1ドル=360円の固定相場制に戻した。"],"a":0,"e":"原油価格は約4倍に高騰したので正しい。『1979年のイラン革命をきっかけ』は第二次石油危機の説明である。『原油価格が急落』は誤りで、価格は急騰し物価も上昇した（狂乱物価）。『固定相場制に戻した』は誤りで、1973年に移行した変動相場制はその後も続いている。"}]});</script>
<script>QDATA.push({"unit":"u19","questions":[{"t":"qa","s":"安定成長","imp":2,"q":"石油危機後、日本の企業が人員の削減や経費の節約、借入金の返済などによって経営体質を改善しようとした取組みを何というか。","a":"減量経営","e":"企業は減量経営に加え、省エネルギー技術の開発やME化による合理化を進めて、石油危機後の不況を乗り切った。"},{"t":"qa","s":"安定成長","imp":2,"q":"石油危機後に進んだ、コンピュータや産業用ロボットなどを導入して工場やオフィスの自動化を図る、集積回路などの微細な電子技術を用いた技術革新を何というか。","a":"ME化","alt":["マイクロエレクトロニクス化","ME革命","マイクロエレクトロニクス革命","ME技術革新"],"e":"MEはマイクロエレクトロニクスの略である。工場の自動化（FA）やオフィスの自動化（OA）が進み、生産性が向上した。"},{"t":"tf","s":"安定成長","imp":3,"q":"石油危機後の日本では、産業の中心が電子機器などの「軽薄短小」型の産業から、鉄鋼・造船・石油化学などの「重厚長大」型の産業へと移った。","a":false,"e":"正しくは逆で、エネルギーや資源を大量に使う「重厚長大」型の素材型産業から、省エネルギー型で付加価値の高い電子機器などの「軽薄短小」型の産業へと中心が移った。"},{"t":"ex","s":"安定成長","imp":2,"q":"石油危機後に、日本の産業の中心が「重厚長大」型から「軽薄短小」型へ移った理由と内容を説明せよ。","a":"石油危機で原油価格が高騰すると、大量のエネルギーと資源を使う鉄鋼・造船・石油化学などの素材型産業（重厚長大型）は不利になった。そこで日本の産業の中心は、エネルギー消費が少なく付加価値の高い加工組立型産業や知識集約型産業へと移り、半導体や電子機器などの軽薄短小型の製品が成長した。","e":"ポイント：①原油価格の高騰で素材型産業が不利になった ②省エネルギー型・高付加価値の加工組立型産業へ移行 ③知識集約型産業の成長"},{"t":"qa","s":"安定成長","imp":2,"q":"1979年のイラン革命をきっかけに原油価格が再び高騰した出来事を何というか。","a":"第二次石油危機","alt":["第2次石油危機","第二次オイル・ショック","第二次オイルショック"],"e":"日本は、第一次石油危機後に進めた減量経営や省エネルギー化によって、第二次石油危機の影響を他の先進国より小さく抑えることができた。"},{"t":"mc","s":"安定成長","imp":1,"q":"日本が第二次石油危機の影響を比較的小さく抑えられた理由として適当でないものを一つ選べ。","c":["第一次石油危機後に省エネルギー技術の開発が進んでいたこと。","企業が減量経営によって経営体質を強化していたこと。","ME化によって工場やオフィスの生産性が高まっていたこと。","国内の油田開発によって、原油の大部分を自給できるようになっていたこと。"],"a":3,"e":"日本は現在も原油のほぼすべてを輸入に頼っており、国内の油田開発で自給できるようになった事実はないので『原油の大部分を自給』は適当でない。省エネルギー技術、減量経営、ME化による生産性の向上は、いずれも日本が第二次石油危機を乗り切った要因である。"},{"t":"tf","s":"安定成長","imp":1,"q":"石油危機後の1970年代後半から80年代にかけての日本の実質経済成長率は、年平均4%前後の安定成長となった。","a":true,"e":"高度経済成長期（年平均約10%）よりは低いが、他の先進国と比べると高い成長率を保った。この時期は安定成長期と呼ばれる。"},{"t":"mc","s":"貿易摩擦","imp":3,"q":"日米貿易摩擦の対象となった主な品目の移り変わりとして最も適当なものを一つ選べ。","c":["繊維 → 鉄鋼 → カラーテレビ → 自動車 → 半導体","鉄鋼 → 繊維 → 自動車 → カラーテレビ → 半導体","繊維 → 自動車 → 鉄鋼 → 半導体 → カラーテレビ","半導体 → 繊維 → 鉄鋼 → カラーテレビ → 自動車"],"a":0,"e":"繊維（1950年代後半〜70年代初め）→鉄鋼（1960年代後半〜70年代）→カラーテレビ（1970年代）→自動車（1980年代初め）→半導体（1980年代後半）の順である。日本の輸出の中心が、軽工業から重化学工業、さらにハイテク産業へと高度化していった流れと対応している。"},{"t":"qa","s":"貿易摩擦","imp":2,"q":"1981年に日本が対米自動車輸出について行ったように、貿易摩擦を緩和するため、輸出国が自ら輸出量に上限を設ける措置を何というか。","a":"輸出自主規制","e":"相手国による輸入制限を避けるために行われた。自動車ではその後、日本企業がアメリカに工場を建てる現地生産も進んだ。輸出自主規制は、現在のWTO協定では原則として禁止されている。"},{"t":"qa","s":"貿易摩擦","imp":1,"q":"1986年に日米間で結ばれ、日本の半導体のダンピング（不当廉売）防止や、日本市場における外国製半導体のシェア拡大などを取り決めた協定は何か。","a":"日米半導体協定","e":"1980年代には、ハイテク製品である半導体も摩擦の対象となった。貿易摩擦の対象は、時代とともに日本の主力輸出品の変化を反映して移り変わった。"},{"t":"ex","s":"貿易摩擦","imp":2,"q":"1980年代に日米貿易摩擦が激しくなった背景を説明せよ。","a":"1980年代前半のアメリカでは、高金利によるドル高のもとで貿易赤字が拡大し、財政赤字とあわせて「双子の赤字」と呼ばれた。一方、日本は自動車や電子機器などの輸出を大きく伸ばし、対米貿易黒字が拡大した。そのためアメリカでは、日本の集中的な輸出や、閉鎖的とされた日本市場への批判が強まった。","e":"ポイント：①アメリカの双子の赤字（財政赤字と貿易赤字） ②日本の対米輸出の急増と貿易黒字の拡大 ③日本市場の閉鎖性への批判"},{"t":"qa","s":"貿易摩擦","imp":3,"q":"1989年から90年にかけて、アメリカが日本の流通制度や系列取引、公共投資のあり方などの改善を求めて行われた日米間の協議を何というか。","a":"日米構造協議","alt":["SII","日米構造問題協議"],"e":"個別の品目ではなく、日本の経済構造そのものが貿易不均衡の原因だとされた点に特徴がある。1993年からは日米包括経済協議が行われた。"},{"t":"tf","s":"貿易摩擦","imp":1,"q":"日米構造協議では、アメリカが日本に対して、大規模小売店舗法（大店法）による大型店の出店規制を強化するよう求めた。","a":false,"e":"正しくは、大店法による出店規制が外国企業の参入を妨げているとして、規制の緩和を求めた。大店法はその後緩和され、2000年に廃止された（大規模小売店舗立地法に移行）。"},{"t":"qa","s":"バブル経済","imp":3,"q":"1985年、先進5か国（G5）の財務相・中央銀行総裁が、ドル高を是正するために為替市場へ協調介入することで合意したことを何というか。","a":"プラザ合意","e":"ニューヨークのプラザホテルで合意された。その後、急激な円高・ドル安が進み、1ドル=240円前後だった為替レートは、2年余りで120円台にまで上昇した。"},{"t":"qa","s":"バブル経済","imp":2,"q":"プラザ合意後の急激な円高によって、輸出産業を中心に業績が悪化した1986年ごろの不況を何というか。","a":"円高不況","e":"円高で輸出品の外国での価格が上がり、輸出が伸び悩んだ。製造業の生産拠点を海外に移す動きも広がり、産業の空洞化が懸念されるようになった。"},{"t":"tf","s":"バブル経済","imp":3,"q":"プラザ合意後の円高不況に対応して、日本銀行は公定歩合を引き上げる金融引き締め政策をとった。","a":false,"e":"正しくは、日本銀行は公定歩合を引き下げ（1987年には当時として史上最低の2.5%）、低金利政策を長く続けた。この金融緩和がバブル経済の原因の一つとなった。"},{"t":"ex","s":"バブル経済","imp":3,"q":"1980年代後半にバブル経済が発生した仕組みを説明せよ。","a":"プラザ合意後の円高不況に対応して日本銀行が低金利政策を長く続けたため、市中に大量の資金があふれた。その資金が土地や株式の購入に向かい、値上がりを見込んだ投機的な取引が広がって、地価や株価が実体経済の水準とかけ離れて高騰した。これがバブル経済であり、資産価格の上昇は消費や設備投資も押し上げた。","e":"ポイント：①円高不況対策としての長期の低金利政策（金融緩和） ②余った資金が土地・株式へ流入 ③実体とかけ離れた資産価格の高騰"},{"t":"qa","s":"バブル経済","imp":2,"q":"保有する株式や土地などの資産の価格が上昇すると、人々が豊かになったと感じて消費を増やす効果を何というか。","a":"資産効果","e":"バブル期には資産効果で高級品の消費などが増えた。逆に資産価格が下落すると消費が減る逆資産効果が働き、バブル崩壊後の不況を深刻にした。"},{"t":"qa","s":"バブル経済","imp":3,"q":"1990年に大蔵省が金融機関に対して行った、不動産業向けの融資の伸びを抑える行政指導を何というか。","a":"総量規制","alt":["不動産融資総量規制","不動産融資の総量規制"],"e":"日本銀行による公定歩合の引き上げ（1989〜90年）と、この総量規制による金融引き締めをきっかけに、株価と地価は急落し、バブル経済は崩壊した。"},{"t":"mc","s":"バブル経済","imp":2,"q":"バブル経済とその崩壊に関する記述として最も適当なものを一つ選べ。","c":["1990年代初めに株価と地価が大幅に下落し、金融機関は回収が困難な不良債権を大量に抱えることになった。","バブル経済の時期には、消費者物価が毎年20%を超える率で上昇した。","バブル崩壊のきっかけは、日本銀行が公定歩合を大幅に引き下げたことである。","バブル崩壊後、地価はすぐに回復し、1990年代半ばには再び最高値を更新した。"],"a":0,"e":"株価は1990年から、地価は1991年ごろから下落し、土地を担保とした融資などが不良債権となったので正しい。『消費者物価が毎年20%を超える』は誤りで、バブル期の消費者物価は比較的安定しており、高騰したのは地価・株価などの資産価格である。『公定歩合を大幅に引き下げた』は誤りで、崩壊のきっかけは公定歩合の引き上げと総量規制である。『地価はすぐに回復』も誤りで、地価は長期にわたって下落した。"},{"t":"tf","s":"バブル経済","imp":2,"q":"バブル経済の時期には、地価や株価が急騰した一方で、消費者物価の上昇率は比較的低く安定していた。","a":true,"e":"バブル経済は、一般の物価よりも土地や株式などの資産価格が大きく上昇した点に特徴がある。消費者物価が安定していたことが、金融引き締めへの転換が遅れた一因ともいわれる。"}]});</script>
<script>QDATA.push({"unit":"u19","questions":[{"t":"qa","s":"平成不況","imp":3,"q":"バブル崩壊後、日本経済が長期の低迷に苦しんだ1990年代は、一般に何と呼ばれるか。「失われた（　）」の（　）に入る語を答えよ。","a":"10年","alt":["十年"],"e":"バブル崩壊後の長期不況は平成不況とも呼ばれる。その後の2000年代も低成長が続いたため、「失われた20年」「失われた30年」という言い方も使われる。"},{"t":"qa","s":"平成不況","imp":3,"q":"金融機関が企業などに貸し出したお金のうち、借り手の経営悪化などで回収が困難になった債権を何というか。","a":"不良債権","e":"バブル期に土地を担保として行われた融資の多くが、地価の下落によって不良債権となった。その処理の遅れが、日本経済の回復を長く妨げた。"},{"t":"ex","s":"平成不況","imp":3,"q":"バブル崩壊後の不良債権問題が、景気の低迷を長引かせた仕組みを説明せよ。","a":"地価や株価の下落によって、土地などを担保に融資していた銀行は回収困難な不良債権を大量に抱え、自己資本が減少した。そのため銀行は新たな融資を控える貸し渋りや、融資を引き揚げる貸しはがしを行い、企業は設備投資などの資金を調達しにくくなった。こうして投資や消費が冷え込み、景気の低迷が長引いた。","e":"ポイント：①資産価格の下落で担保価値が低下し不良債権が増大 ②銀行の貸し渋り・貸しはがし ③企業の投資の停滞と景気の長期低迷"},{"t":"qa","s":"平成不況","imp":2,"q":"バブル崩壊後に見られた、地価や株価などの資産価格が持続的に下落する現象を何というか。","a":"資産デフレ","e":"資産デフレのもとでは、保有資産の価値が目減りして消費が減る逆資産効果が働いた。1990年代後半からは、一般の物価が持続的に下落するデフレーションも進んだ。"},{"t":"mc","s":"平成不況","imp":2,"q":"1997〜98年の日本の出来事として適当でないものを一つ選べ。","c":["消費税率が3%から5%に引き上げられた。","タイの通貨バーツの暴落をきっかけに、アジア通貨危機が起こった。","北海道拓殖銀行や山一證券などの大手金融機関が経営破綻した。","アメリカの大手投資銀行リーマン・ブラザーズの経営破綻をきっかけに、世界金融危機が起こった。"],"a":3,"e":"リーマン・ブラザーズの経営破綻（リーマン・ショック）は2008年の出来事なので適当でない。1997年には消費税率の引き上げ（4月）、アジア通貨危機（7月）、北海道拓殖銀行・山一證券の破綻（11月）が重なり、翌1998年には日本長期信用銀行などが破綻して、深刻な金融危機とマイナス成長に陥った。"},{"t":"tf","s":"平成不況","imp":2,"q":"1990年代後半から、日本では物価が持続的に下落するデフレーションが続き、物価の下落と景気の悪化が悪循環をくり返すデフレ・スパイラルが懸念された。","a":true,"e":"物価の下落で企業の売上と利益が減り、賃金の引き下げや雇用の削減が起こって需要がさらに減り、物価が一段と下がるという悪循環をデフレ・スパイラルという。日本銀行は1999年にゼロ金利政策、2001年に量的緩和政策を導入して対応した。"},{"t":"tf","s":"平成不況","imp":1,"q":"1990年代の金融危機では、破綻した金融機関の処理に公的資金（税金）が使われることはなく、すべて民間の資金によって処理された。","a":false,"e":"正しくは、1998年に金融再生法や金融早期健全化法が制定され、大手銀行への公的資金の注入や、破綻した日本長期信用銀行・日本債券信用銀行の一時国有化などが行われた。"},{"t":"qa","s":"2000年代以降の経済","imp":3,"q":"小泉純一郎内閣が「民間にできることは民間に」を掲げて進め、2007年の日本郵政グループの発足によって実現した改革は何か。","a":"郵政民営化","e":"小泉内閣は「聖域なき構造改革」を掲げ、郵政民営化のほか、道路関係四公団の民営化、規制緩和、不良債権処理の加速などを進めた。"},{"t":"tf","s":"2000年代以降の経済","imp":2,"q":"小泉内閣の構造改革は、規制の強化と公共事業の拡大によって政府の役割を大きくし、景気の回復をめざすものであった。","a":false,"e":"正しくは、規制緩和や民営化、公共事業の削減などによって政府の役割を小さくする「小さな政府」をめざすものであった。一方で、所得格差の拡大を招いたという批判もある。"},{"t":"qa","s":"2000年代以降の経済","imp":2,"q":"2002年から2008年まで73か月にわたって続き、高度経済成長期のいざなぎ景気を上回る長さとなった景気拡大は、俗に何と呼ばれるか。","a":"いざなみ景気","e":"いざなぎ景気（57か月）を上回る長期の景気拡大だったが、賃金がほとんど上がらなかったため「実感なき景気回復」といわれた。名前が似ているので、時期とあわせて区別する。"},{"t":"ex","s":"2000年代以降の経済","imp":2,"q":"2000年代の景気拡大（いざなみ景気）が「実感なき景気回復」と呼ばれた理由を説明せよ。","a":"2000年代の景気拡大は、主に円安と海外の需要に支えられた輸出の増加によるもので、企業の収益は改善した。しかし、企業は人件費を抑えて賃金の低い非正規雇用を増やしたため、家計の所得はほとんど増えなかった。成長率も低かったため、多くの国民は景気回復を実感できなかった。","e":"ポイント：①輸出主導の景気拡大で企業収益は改善 ②賃金が伸びず非正規雇用が増加 ③低い成長率で家計に恩恵が及ばなかった"},{"t":"qa","s":"2000年代以降の経済","imp":3,"q":"2008年9月、アメリカの大手投資銀行の経営破綻をきっかけに世界的な金融危機が広がった出来事を何というか。","a":"リーマン・ショック","alt":["リーマンショック","世界金融危機"],"e":"低所得者向け住宅ローン（サブプライムローン）の焦げつきが背景にあった。日本は輸出が急減して大幅なマイナス成長となり、派遣労働者の契約打ち切り（派遣切り）などが社会問題となった。"},{"t":"tf","s":"2000年代以降の経済","imp":1,"q":"2011年の東日本大震災の後、原子力発電所の停止にともなって火力発電用の燃料の輸入が増えたことなどから、日本の貿易収支は赤字となった。","a":true,"e":"2011年の貿易収支（通関ベース）は、1980年以来31年ぶりの赤字となった。震災による生産の停滞、燃料輸入の増加、円高による輸出の伸び悩みなどが重なった。"},{"t":"qa","s":"2000年代以降の経済","imp":3,"q":"2012年末に発足した第2次安倍晋三内閣の経済政策（アベノミクス）の「三本の矢」は何か。3つ答えよ。","a":"大胆な金融政策・機動的な財政政策・民間投資を喚起する成長戦略","alt":["大胆な金融政策・機動的な財政出動・民間投資を喚起する成長戦略","金融緩和・財政出動・成長戦略","大胆な金融政策・機動的な財政政策・成長戦略"],"e":"第一の矢として、日本銀行は2013年に2%の物価安定目標を掲げ、大規模な金融緩和（量的・質的金融緩和）を開始した。長く続いたデフレからの脱却がめざされた。"},{"t":"tf","s":"2000年代以降の経済","imp":1,"q":"2020年からの新型コロナウイルス感染症の拡大では、主に製造業の輸出が打撃を受け、飲食・宿泊などの対面型サービス業への影響はほとんどなかった。","a":false,"e":"正しくは、外出自粛や営業時間の短縮、訪日外国人の激減などにより、飲食・宿泊・観光などの対面型サービス業が特に大きな打撃を受けた。2020年度の実質経済成長率は大幅なマイナスとなった。"},{"t":"tf","s":"2000年代以降の経済","imp":2,"q":"2022年以降の日本の物価上昇は、ロシアのウクライナ侵攻などによる資源・エネルギー価格の高騰と、円安による輸入物価の上昇が主な要因であった。","a":true,"e":"原材料費の上昇が価格に転嫁されたもので、コスト・プッシュ・インフレの性格が強い。消費者物価の上昇率は約40年ぶりの高い水準となり、賃金の上昇が物価に追いつかず、実質賃金の低下が問題となった。"},{"t":"mc","s":"2000年代以降の経済","imp":3,"q":"日本の名目GDP（国内総生産）の世界順位に関する記述として最も適当なものを一つ選べ。","c":["2010年に中国に抜かれて世界第3位となり、2023年にはドイツにも抜かれて第4位となった。","1968年にアメリカを抜き、資本主義国の中で第1位となった。","2010年にドイツに抜かれて第3位となり、2023年には中国にも抜かれて第4位となった。","バブル崩壊直後の1990年代前半に中国に抜かれ、世界第3位となった。"],"a":0,"e":"日本は2010年に中国に抜かれて第3位、2023年にはドイツに抜かれて第4位となったので正しい。2023年の順位の低下には、ドル換算で比較するため円安の影響も大きい。『アメリカを抜き第1位』は誤りで、1968年は西ドイツを抜いてアメリカに次ぐ第2位となった。中国とドイツの順序を逆にした選択肢と、『1990年代前半に中国に抜かれ』も誤りである。"},{"t":"mc","s":"2000年代以降の経済","imp":1,"q":"日本の首相と、その内閣が打ち出した経済政策の組合せとして誤っているものを一つ選べ。","c":["佐藤栄作 ― 国民所得倍増計画","田中角栄 ― 日本列島改造論","小泉純一郎 ― 郵政民営化","安倍晋三 ― 三本の矢"],"a":0,"e":"国民所得倍増計画を打ち出したのは池田勇人内閣（1960年）なので誤り。佐藤栄作は池田の次の首相で、いざなぎ景気の時期の首相である。田中角栄の日本列島改造論（1972年）、小泉純一郎の郵政民営化（2005年に法成立、2007年に実施）、安倍晋三の三本の矢（2013年〜）は正しい組合せである。"}]});</script>
<script>QDATA.push({"unit":"u19","questions":[{"t":"qa","s":"産業構造の変化","imp":3,"q":"経済の発展にともなって、就業人口や国民所得に占める比重が、第一次産業から第二次産業、さらに第三次産業へと移っていくという法則を何というか。","a":"ペティ・クラークの法則","alt":["ペティ=クラークの法則","ペティクラークの法則","ペティ＝クラークの法則"],"e":"17世紀イギリスのペティが指摘し、20世紀の経済学者コーリン・クラークが統計によって実証した。このように産業の比重が高次の産業へ移っていくことを産業構造の高度化という。"},{"t":"tf","s":"産業構造の変化","imp":2,"q":"ペティ・クラークの法則によれば、経済が発展するにつれて第三次産業の比重は低下し、第一次産業の比重が高まっていく。","a":false,"e":"正しくは、経済の発展につれて第一次産業の比重が低下し、第二次産業、さらに第三次産業の比重が高まっていく。日本でも高度経済成長期に第一次産業の就業者の割合が急速に低下した。"},{"t":"qa","s":"産業構造の変化","imp":2,"q":"産業構造の中で、商業・運輸・金融・情報通信・医療・福祉などの第三次産業の比重が高まることを何というか。","a":"経済のサービス化","alt":["サービス化","産業のサービス化"],"e":"日本では就業者の約7割が第三次産業で働いている。似た言葉の「経済のソフト化」は、産業を問わず知識や情報などの価値が重要になることを指すので区別する。"},{"t":"ex","s":"産業構造の変化","imp":2,"q":"経済のソフト化とは何か、経済のサービス化との違いにも触れて説明せよ。","a":"経済のソフト化とは、モノそのものよりも、情報・知識・技術・デザインなど形のないもの（ソフト）の価値が経済の中で重要になることである。第三次産業の比重が高まるサービス化に対し、ソフト化は製造業の内部でも、研究開発やソフトウェア、広告などの比重が高まるという形で進む点に特徴がある。","e":"ポイント：①情報・知識など形のないものの価値の高まり ②サービス化は第三次産業の比重の上昇 ③ソフト化は製造業を含む産業全体で進む"},{"t":"qa","s":"産業構造の変化","imp":3,"q":"円高などを背景に企業が生産拠点を海外に移すことで、国内の製造業が衰退し、雇用が失われる現象を何というか。","a":"産業の空洞化","alt":["空洞化","産業空洞化"],"e":"1985年のプラザ合意後や1990年代の円高の中で、製造業がアジアなどに工場を移す動きが強まった。国内の雇用の減少や、技術・技能の継承が難しくなることなどが懸念される。"},{"t":"mc","s":"産業構造の変化","imp":2,"q":"日本の産業別の就業者の構成に関する記述として最も適当なものを一つ選べ。","c":["現在は、第三次産業の就業者が全体の約7割を占めている。","高度経済成長期を通じて、第一次産業の就業者の割合は上昇し続けた。","現在も、第二次産業の就業者が全体の過半数を占めている。","第一次産業の就業者の割合は、現在も全体の約3割を維持している。"],"a":0,"e":"2020年の国勢調査では第三次産業の就業者が約7割を占めているので正しい。『第一次産業の割合は上昇』は誤りで、高度経済成長期には農村から都市へ労働力が移り、第一次産業の割合は急速に低下した。第二次産業の就業者は現在およそ4分の1で、過半数ではない。第一次産業の割合は現在わずか数%である。"},{"t":"qa","s":"中小企業","imp":3,"q":"中小企業基本法では、製造業の中小企業は、資本金が何円以下または常時使用する従業員が何人以下の企業と定められているか。","a":"3億円以下または300人以下","alt":["3億円・300人","資本金3億円以下または従業員300人以下","3億円以下・300人以下","3億円以下、300人以下"],"e":"卸売業は1億円以下または100人以下、小売業は5000万円以下または50人以下、サービス業は5000万円以下または100人以下である。資本金と従業員数のどちらか一方を満たせば中小企業にあたる。"},{"t":"mc","s":"中小企業","imp":2,"q":"中小企業基本法の定義にもとづくと、次の企業のうち中小企業にあたるものはどれか。","c":["資本金5億円、従業員200人の製造業の企業","資本金2億円、従業員150人の卸売業の企業","資本金1億円、従業員80人の小売業の企業","資本金8000万円、従業員120人のサービス業の企業"],"a":0,"e":"製造業は「資本金3億円以下または従業員300人以下」なので、資本金が5億円でも従業員200人であれば中小企業にあたる。卸売業は1億円以下または100人以下、小売業は5000万円以下または50人以下、サービス業は5000万円以下または100人以下なので、他の3社はどちらの基準も満たさず中小企業にあたらない。「または」なので一方を満たせばよい点がポイントである。"},{"t":"tf","s":"中小企業","imp":3,"q":"日本の中小企業は、企業数では全体の約99%を占めるが、従業者数では全体の約3割にとどまっている。","a":false,"e":"正しくは、中小企業は企業数の約99.7%、従業者数の約7割を占めており、日本の経済と雇用を支える重要な存在である。付加価値額でも全体の約半分を占める。"},{"t":"qa","s":"中小企業","imp":3,"q":"大企業と中小企業の間に、生産性・賃金・資本装備率などで大きな格差が存在する状態を何というか。","a":"二重構造","alt":["経済の二重構造"],"e":"1957年度の『経済白書』で指摘された。資本装備率とは労働者1人あたりの機械・設備などの額で、中小企業は大企業より低く、これが生産性や賃金の格差の原因となっている。"},{"t":"ex","s":"中小企業","imp":3,"q":"中小企業が大企業の下請けとして置かれやすい立場と、その問題点を説明せよ。","a":"多くの中小企業は、大企業から部品の製造などを請け負う下請けとして、系列に組み込まれている。下請けは安定した受注を得られる反面、親企業から納入価格の引き下げや短い納期を求められやすく、不況のときには発注を減らされるなど、「景気の調整弁」として扱われやすいという問題がある。","e":"ポイント：①大企業の系列に組み込まれた下請け ②納入価格の引き下げなど不利な取引条件 ③不況時に発注を減らされる景気の調整弁"},{"t":"mc","s":"中小企業","imp":2,"q":"中小企業に関する記述として最も適当なものを一つ選べ。","c":["独自の技術やアイデアで新しい分野に挑戦するベンチャー企業には、成長を見込んで出資するベンチャー・キャピタルなどが資金を提供している。","中小企業基本法では、資本金と従業員数の両方の基準を満たさなければ中小企業とは認められない。","地場産業とは、大企業の工場の周辺に集まり、その大企業から部品の製造を請け負う産業のことである。","中小企業の賃金水準は、平均すると大企業の賃金水準を上回っている。"],"a":0,"e":"ベンチャー企業とベンチャー・キャピタルの説明として正しい。中小企業の定義は資本金と従業員数のどちらか一方を満たせばよいので『両方の基準を満たさなければ』は誤り。『大企業から部品の製造を請け負う』は下請けの説明で、地場産業は地域の資源や伝統技術を生かして特産品をつくる産業である。二重構造のもとで中小企業の賃金は大企業より低いので『上回っている』も誤り。なお、大企業が参入しにくい小さな市場をねらうニッチ（すきま）産業で成功する中小企業もある。"},{"t":"qa","s":"中小企業","imp":2,"q":"新潟県燕市の金属洋食器や福井県鯖江市の眼鏡枠のように、特定の地域に中小企業が集まり、地域の資源や伝統的な技術を生かして特産品をつくる産業を何というか。","a":"地場産業","e":"地場産業は地域の雇用と経済を支えているが、安い輸入品との競争や後継者不足などの課題を抱えている。地域ブランドの確立や海外市場の開拓に取り組む産地もある。"},{"t":"tf","s":"中小企業","imp":1,"q":"中小企業基本法では、中小企業のうち、製造業などでは従業員20人以下、商業・サービス業では従業員5人以下の企業を小規模企業者としている。","a":true,"e":"小規模企業者は中小企業の中でも特に規模の小さな企業で、日本の企業数の大半を占める。経営資源が乏しいため、資金繰りや事業承継（後継者の確保）などへの支援が行われている。"},{"t":"ex","s":"中小企業","imp":2,"q":"1999年の中小企業基本法の改正で、法の基本理念がどのように変わったかを説明せよ。","a":"1963年に制定された中小企業基本法は、中小企業を弱い存在ととらえ、大企業との生産性や賃金の格差（二重構造）を是正することを目的としていた。1999年の改正では、中小企業を新たな産業や雇用を生み出す担い手と位置づけ、創業や経営革新など、多様で活力ある独立した中小企業の自主的な努力を支援することへと理念が転換された。","e":"ポイント：①旧法の目的は大企業との格差の是正 ②改正後は多様で活力ある独立した中小企業の育成・発展 ③創業や経営革新など自主的な努力の支援"}]});</script>
<script>QDATA.push({"unit":"u19","questions":[{"t":"qa","s":"農業と農政","imp":3,"q":"1961年に制定され、農業と他産業との生産性や所得の格差の是正、自立経営農家の育成などをめざした法律は何か。","a":"農業基本法","e":"需要の伸びる畜産・果樹などへの生産の転換（選択的拡大）も掲げた。しかし農家の規模拡大はあまり進まず、高度経済成長期には農業以外の収入に頼る兼業農家が増えた。1999年に食料・農業・農村基本法に代わった。"},{"t":"qa","s":"農業と農政","imp":3,"q":"米の生産過剰と食糧管理特別会計の赤字に対応するため、1970年ごろから始められた、米の作付面積を減らす生産調整の政策は一般に何と呼ばれるか。","a":"減反政策","alt":["減反","生産調整","米の生産調整"],"e":"国が生産目標を配分し、転作などに補助金を出した。国による生産数量目標の配分は2018年産米から廃止され、生産者や集荷業者が需要を見ながら生産量を決める仕組みに移行した。"},{"t":"ex","s":"農業と農政","imp":2,"q":"食糧管理制度の仕組みと、それがかかえた問題点を説明せよ。","a":"食糧管理制度は、1942年の食糧管理法にもとづき、政府が生産者から米を買い入れて消費者に売り渡す制度である。戦後は、生産者から買い入れる価格（生産者米価）が消費者に売り渡す価格（消費者米価）を上回る逆ざやが生じ、食糧管理特別会計の赤字が膨らんだ。また、米の消費が減って生産過剰となり、減反政策が行われた。","e":"ポイント：①政府による米の買い入れと売り渡し ②生産者米価が消費者米価を上回る逆ざやと赤字 ③米の生産過剰と減反政策"},{"t":"qa","s":"農業と農政","imp":2,"q":"1994年に制定され（1995年施行）、食糧管理法に代わって米の流通を大幅に自由化した法律は何か。","a":"食糧法","alt":["新食糧法","主要食糧の需給及び価格の安定に関する法律"],"e":"食糧法により、政府による米の管理は備蓄などに限られ、民間による流通が中心となった。2004年の改正では、届出をすれば誰でも米を販売できるようになり、流通はさらに自由化された。"},{"t":"qa","s":"農業と農政","imp":3,"q":"GATTのウルグアイ・ラウンドの合意にもとづき、日本が1995年から受け入れた、米の最低限の輸入機会（輸入量）を何というか。","a":"ミニマム・アクセス","alt":["ミニマムアクセス","最低輸入量","最低輸入機会","MA"],"e":"日本は米の関税化を猶予される代わりに、ミニマム・アクセスを受け入れた。その後1999年に米の関税化に移行したが、ミニマム・アクセスによる輸入は続いている。"},{"t":"tf","s":"農業と農政","imp":2,"q":"日本はウルグアイ・ラウンドの合意直後から米の関税化を受け入れ、その代わりにミニマム・アクセスを免除された。","a":false,"e":"正しくは、日本は米の関税化の猶予（特例措置）を受ける代わりにミニマム・アクセスを受け入れ、1999年に関税化へ移行した。関税化の後もミニマム・アクセスは続いている。"},{"t":"mc","s":"農業と農政","imp":1,"q":"日本の米をめぐる政策を古い順に並べたものとして正しいものを一つ選べ。","c":["食糧管理法の制定 → 減反政策の開始 → ミニマム・アクセスの受け入れ → 国による生産数量目標の配分の廃止","減反政策の開始 → 食糧管理法の制定 → 国による生産数量目標の配分の廃止 → ミニマム・アクセスの受け入れ","食糧管理法の制定 → ミニマム・アクセスの受け入れ → 減反政策の開始 → 国による生産数量目標の配分の廃止","ミニマム・アクセスの受け入れ → 食糧管理法の制定 → 減反政策の開始 → 国による生産数量目標の配分の廃止"],"a":0,"e":"食糧管理法の制定は1942年、減反政策の開始は1970年ごろ、ミニマム・アクセスの受け入れは1995年、国による生産数量目標の配分の廃止（いわゆる減反の廃止）は2018年である。政府による管理から、市場と国際化に開かれた方向への流れとして押さえる。"},{"t":"qa","s":"農業と農政","imp":3,"q":"1999年に農業基本法に代わって制定され、食料の安定供給の確保や農業の多面的機能の発揮などを基本理念とした法律は何か。","a":"食料・農業・農村基本法","alt":["食料農業農村基本法","新農業基本法"],"e":"農業だけでなく、食料や農村も視野に入れた点が特徴である。この法律にもとづく食料・農業・農村基本計画で、食料自給率の目標が定められている。"},{"t":"tf","s":"農業と農政","imp":2,"q":"2024年の食料・農業・農村基本法の改正では、気候変動や国際情勢の変化を背景に、食料安全保障の確保が基本理念の柱に位置づけられた。","a":true,"e":"制定から約25年ぶりの大きな改正である。食料安全保障を「良質な食料が合理的な価格で安定的に供給され、かつ、国民一人一人がこれを入手できる状態」と定義し、環境と調和のとれた食料システムの確立なども新たに盛り込んだ。"},{"t":"ex","s":"農業と農政","imp":2,"q":"農業の多面的機能とは何か、具体例を挙げて説明せよ。","a":"農業の多面的機能とは、農業や農村が、食料を生産する役割以外にもつさまざまな働きのことである。たとえば、水田が雨水をたくわえて洪水を防いだり地下水を養ったりする国土の保全・水源のかん養、生き物のすみかとなる自然環境の保全、美しい景観の形成、祭りなどの伝統文化の継承などがある。","e":"ポイント：①食料生産以外の役割 ②国土の保全・水源のかん養・自然環境の保全・景観の形成・文化の伝承 ③市場では価格がつきにくく、農業を支える政策の根拠とされる"},{"t":"mc","s":"農業と農政","imp":1,"q":"農地制度と企業の農業参入に関する記述として最も適当なものを一つ選べ。","c":["2009年の農地法改正により、一般の株式会社なども農地を借りて農業に参入することが原則として認められるようになった。","農地法は、農地改革の成果を守るため、現在も株式会社による農地の所有を一切認めていない。","農地法は1999年に制定され、それまで禁止されていた農地の売買を初めて認めた。","企業の農業参入が認められたことで、日本の耕作放棄地はほぼ解消された。"],"a":0,"e":"2009年の改正で、一般の法人による農地の賃借（リース方式）が原則として自由化されたので正しい。『株式会社による所有を一切認めていない』は誤りで、一定の要件を満たす農地所有適格法人であれば株式会社でも農地を所有できる。農地法の制定は1952年なので『1999年に制定』は誤り。耕作放棄地は依然として大きな課題であり、『ほぼ解消』も誤りである。"},{"t":"qa","s":"食料と農業の課題","imp":3,"q":"日本の食料自給率（カロリーベース）は、近年およそ何%か。","a":"約38%","alt":["38%","約4割","約40%","38％","約38％","4割","40%"],"e":"2020年代はおおむね38%前後で推移しており、主要先進国の中で最低の水準である。米はほぼ自給できるが、小麦・大豆や家畜の飼料の多くを輸入に頼っている。生産額ベースでは約6割となる。"},{"t":"mc","s":"食料と農業の課題","imp":2,"q":"日本の食料自給率に関する記述として最も適当なものを一つ選べ。","c":["カロリーベースの食料自給率は、生産額ベースの食料自給率よりも低い。","米・小麦・大豆は、いずれも国内生産でほぼ自給できている。","食料自給率は1960年代から上昇を続け、現在は主要先進国の中で最も高い。","カロリーベースの食料自給率は、国内生産額を国内消費仕向額で割って求める。"],"a":0,"e":"カロリーベースは約4割、生産額ベースは約6割で、カロリーベースのほうが低いので正しい。野菜などはカロリーが低いわりに金額が高いこと、輸入飼料で育てた畜産物の分がカロリーベースでは大きく差し引かれることなどが差の理由である。小麦・大豆の自給率は低い。自給率は長期的に低下し、主要先進国で最低水準である。金額で計算するのは生産額ベースである。"},{"t":"mc","s":"食料と農業の課題","imp":2,"q":"次の事例のうち、農業の6次産業化にあたるものとして最も適当なものを一つ選べ。","c":["果樹農家が自ら栽培したリンゴでジャムやジュースを製造し、農園内の直売所やインターネットで販売する。","食品メーカーが海外から輸入した原料で菓子を製造し、全国のスーパーマーケットに卸す。","地元のスーパーマーケットが、近隣の農家から仕入れた野菜を地場産コーナーで販売する。","稲作農家が、収穫した米をすべて農業協同組合に出荷する。"],"a":0,"e":"6次産業化は、農林漁業者自身が生産（第1次）に加えて加工（第2次）や販売・サービス（第3次）まで手がけ、付加価値を高める取組みで、1×2×3=6に由来する。『食品メーカーが輸入原料で製造』は農業者の取組みではない。『地元のスーパーが近隣の農家の野菜を販売』は地産地消の例である。『農協にすべて出荷』は生産だけにとどまっている。"},{"t":"qa","s":"食料と農業の課題","imp":2,"q":"地域で生産された農林水産物を、その地域で消費しようとする取組みを何というか。","a":"地産地消","e":"生産者の顔が見える安心感や地域経済の活性化に加え、輸送距離が短くなることで、食料の輸送にともなう環境負荷（フード・マイレージ）を減らす効果も期待される。"},{"t":"qa","s":"食料と農業の課題","imp":1,"q":"食品の生産・加工・流通の履歴を記録し、問題が起きたときにさかのぼって追跡できるようにする仕組みを何というか。","a":"トレーサビリティ","alt":["トレーサビリティー","トレーサビリティ制度"],"e":"BSE（牛海綿状脳症）問題をきっかけに、国産牛肉では個体識別番号による管理が義務づけられ、米や米加工品でも取引の記録などが義務づけられた。2003年には食品安全基本法が制定され、食品安全委員会が設置された。"}]});</script>
<script>QDATA.push({"unit":"u20","questions":[{"t":"qa","s":"公害の原点","imp":3,"q":"明治時代、栃木県の足尾銅山から流れ出た鉱毒が渡良瀬川流域の農漁業に大きな被害を与えた事件で、衆議院議員として政府の責任を追及し、1901年には天皇への直訴を試みた人物は誰か。","a":"田中正造","e":"足尾銅山鉱毒事件は「日本の公害の原点」と呼ばれる。政府は銅山の操業を止めず、下流の谷中村を廃村にして遊水池とする策をとった。"},{"t":"tf","s":"公害の原点","imp":2,"q":"足尾銅山鉱毒事件では、政府が被害の訴えを受けてただちに銅山の操業を停止させ、被害地域の住民の生活を守った。","a":false,"e":"正しくは、政府は殖産興業を優先して銅山の操業を停止させず、鉱毒対策も不十分であった。被害の激しかった谷中村は廃村とされ、遊水池がつくられた。"},{"t":"qa","s":"公害の原点","imp":3,"q":"環境基本法が定める典型7公害のうち、大気汚染・水質汚濁・土壌汚染・騒音・振動以外の2つは何か。","a":"地盤沈下・悪臭","alt":["悪臭・地盤沈下"],"e":"典型7公害は、大気汚染・水質汚濁・土壌汚染・騒音・振動・地盤沈下・悪臭である。1967年の公害対策基本法では土壌汚染を除く6つ（典型6公害）だったが、1970年に土壌汚染が加えられた。"},{"t":"ex","s":"公害の原点","imp":2,"q":"公害とは何か、その特徴にも触れて説明せよ。","a":"公害とは、事業活動などの人の活動にともなって相当範囲にわたって生じる大気汚染・水質汚濁・土壌汚染・騒音・振動・地盤沈下・悪臭によって、人の健康や生活環境に被害が生じることである。被害は広い範囲の住民に及び、加害者と被害者の力の差が大きく、原因や因果関係の証明が難しいことが多い。","e":"ポイント：①人の活動にともなって相当範囲にわたって生じる ②典型7公害による健康・生活環境の被害 ③被害の広がりと因果関係の証明の難しさ"},{"t":"mc","s":"四大公害訴訟","imp":3,"q":"四大公害病と、その発生地域・原因物質の組合せとして正しいものを一つ選べ。","c":["イタイイタイ病 ― 富山県神通川流域 ― カドミウム","水俣病 ― 新潟県阿賀野川流域 ― カドミウム","四日市ぜんそく ― 熊本県水俣湾周辺 ― 亜硫酸ガス","新潟水俣病 ― 三重県四日市市 ― 有機水銀"],"a":0,"e":"イタイイタイ病は富山県神通川流域でカドミウムが原因なので正しい。水俣病は熊本県水俣湾周辺（八代海沿岸）で有機水銀、新潟水俣病は新潟県阿賀野川流域で有機水銀、四日市ぜんそくは三重県四日市市で亜硫酸ガス（二酸化硫黄）が原因である。地域と原因物質の入れ替えに注意する。"},{"t":"mc","s":"四大公害訴訟","imp":3,"q":"四大公害訴訟と、その被告企業の組合せとして正しいものを一つ選べ。","c":["新潟水俣病訴訟 ― 昭和電工","水俣病訴訟 ― 三井金属鉱業","イタイイタイ病訴訟 ― チッソ","四日市ぜんそく訴訟 ― 昭和電工"],"a":0,"e":"新潟水俣病の被告は昭和電工なので正しい。水俣病（熊本）の被告はチッソ、イタイイタイ病の被告は三井金属鉱業、四日市ぜんそくの被告は石油化学コンビナートを構成する6社である。"},{"t":"qa","s":"四大公害訴訟","imp":3,"q":"熊本県水俣湾周辺で発生し、手足のしびれや言語障害などを引き起こした水俣病の原因物質は何か。","a":"有機水銀","alt":["メチル水銀","有機水銀化合物","メチル水銀化合物"],"e":"工場排水に含まれていた有機水銀（メチル水銀）が魚介類の体内に濃縮され、それを食べた人々に被害が出た。1956年に公式に確認されたが、政府が公害病と認めたのは1968年で、対応の遅れが被害を拡大させた。"},{"t":"qa","s":"四大公害訴訟","imp":3,"q":"富山県神通川流域で発生し、骨がもろくなって激しい痛みをともなうイタイイタイ病の原因物質は何か。","a":"カドミウム","e":"上流の岐阜県にある鉱山から流出したカドミウムが、川の水や米を通じて体内に取り込まれた。1968年に国が初めて公害病として認定した。"},{"t":"qa","s":"四大公害訴訟","imp":2,"q":"三重県四日市市で石油化学コンビナートから排出され、ぜんそくなどの呼吸器の病気を引き起こした主な原因物質は何か。","a":"亜硫酸ガス","alt":["二酸化硫黄","硫黄酸化物","SO2"],"e":"四日市ぜんそくは、四大公害の中で唯一の大気汚染による公害である。他の3つ（水俣病・新潟水俣病・イタイイタイ病）は水質汚濁による公害である。"},{"t":"tf","s":"四大公害訴訟","imp":3,"q":"四大公害訴訟では、いずれも被害者である原告側の主張が退けられ、企業の責任は認められなかった。","a":false,"e":"正しくは、四大公害訴訟は1971〜73年の判決で、いずれも原告（被害者側）が勝訴し、企業の責任が認められた。これが公害対策を前進させる大きな力となった。"},{"t":"ex","s":"四大公害訴訟","imp":2,"q":"四大公害訴訟の判決の意義を説明せよ。","a":"四大公害訴訟は1971〜73年にいずれも原告（被害者側）の勝訴に終わった。判決は、企業には高度な注意義務があるとしたほか、疫学的な調査による因果関係の証明や、複数の企業の共同不法行為を認めるなど、企業の責任を明確にした。これらは世論を高め、無過失責任の導入や公害健康被害補償法の制定など、公害対策の強化につながった。","e":"ポイント：①すべて原告側の勝訴 ②企業の注意義務・疫学的因果関係・共同不法行為を認めた ③無過失責任や被害者救済制度など公害対策の強化につながった"},{"t":"mc","s":"四大公害訴訟","imp":2,"q":"四大公害訴訟と、その判決の内容の組合せとして最も適当なものを一つ選べ。","c":["四日市ぜんそく訴訟 ― 石油化学コンビナートを構成する複数の企業の共同不法行為を認めた","イタイイタイ病訴訟 ― 工場の排煙による大気汚染と健康被害との因果関係を認めた","新潟水俣病訴訟 ― 被告企業の責任を否定し、原告が敗訴した","水俣病訴訟 ― 石油化学コンビナートの6社に損害賠償を命じた"],"a":0,"e":"四日市ぜんそく訴訟の判決（1972年）は、コンビナートの6社が共同して汚染を引き起こしたとして共同不法行為を認めたので正しい。イタイイタイ病はカドミウムによる水質汚濁が原因で、判決は疫学的な証明によって因果関係を認めた。新潟水俣病訴訟（1971年）は原告が勝訴している。水俣病訴訟（1973年）の被告はチッソで、コンビナートの6社は四日市ぜんそく訴訟の被告である。"},{"t":"tf","s":"四大公害訴訟","imp":1,"q":"水俣病をめぐっては、2004年に最高裁判所が、被害の拡大を防ぐための規制を行わなかった国と熊本県の責任を認める判決を出した。","a":true,"e":"水俣病関西訴訟の最高裁判決である。行政が規制の権限を行使しなかったことの責任を認めた点で重要である。その後、2009年には未認定の被害者を救済するための特別措置法が制定された。"},{"t":"qa","s":"四大公害訴訟","imp":1,"q":"イタイイタイ病訴訟では、被告企業の故意や過失を証明しなくても損害賠償を求めることができる、無過失責任の規定をもつ法律にもとづいて訴えが起こされた。この法律は何か。","a":"鉱業法","e":"鉱業法は鉱山の採掘による被害について、早くから無過失責任を定めていた。その後、1972年の大気汚染防止法と水質汚濁防止法の改正で、工場などの排出による健康被害にも無過失責任が導入された。"}]});</script>
<script>QDATA.push({"unit":"u20","questions":[{"t":"qa","s":"公害対策の歩み","imp":3,"q":"1967年に制定され、典型公害を定めて国・地方公共団体・事業者の責務を明らかにした、日本の公害対策の基本となった法律は何か。","a":"公害対策基本法","e":"制定当初は「経済調和条項」があり、経済成長を優先して公害対策を緩める根拠になると批判された。1993年に環境基本法が制定されたことにともない廃止された。"},{"t":"tf","s":"公害対策の歩み","imp":3,"q":"公害対策基本法の「経済調和条項」は、1993年に環境基本法が制定されたときに初めて削除された。","a":false,"e":"正しくは、経済調和条項は1970年のいわゆる公害国会で削除された。これにより、経済の発展よりも国民の健康と生活環境の保護を優先する姿勢が明確になった。"},{"t":"ex","s":"公害対策の歩み","imp":2,"q":"公害対策基本法の「経済調和条項」とは何か、またそれが削除された理由を説明せよ。","a":"経済調和条項とは、生活環境の保全は経済の健全な発展との調和が図られるようにするという、公害対策基本法の規定である。これは経済成長を優先して公害対策を緩める根拠になると批判されたため、1970年の公害国会で削除され、国民の健康と生活環境の保護を優先することが明確になった。","e":"ポイント：①生活環境の保全を経済の発展と調和させる規定 ②公害対策を後回しにする根拠になるとの批判 ③1970年の公害国会で削除"},{"t":"mc","s":"公害対策の歩み","imp":2,"q":"日本の公害対策の歩みを古い順に並べたものとして正しいものを一つ選べ。","c":["公害対策基本法の制定 → 公害国会での経済調和条項の削除 → 環境庁の設置 → 環境基本法の制定","公害国会での経済調和条項の削除 → 公害対策基本法の制定 → 環境基本法の制定 → 環境庁の設置","公害対策基本法の制定 → 環境庁の設置 → 環境基本法の制定 → 公害国会での経済調和条項の削除","環境庁の設置 → 公害対策基本法の制定 → 公害国会での経済調和条項の削除 → 環境基本法の制定"],"a":0,"e":"公害対策基本法の制定は1967年、公害国会は1970年、環境庁の設置は1971年、環境基本法の制定は1993年である。1970年の公害国会では、経済調和条項の削除のほか、水質汚濁防止法の制定など14の公害関係法が成立した。環境庁は2001年に環境省となった。"},{"t":"qa","s":"公害対策の歩み","imp":3,"q":"公害国会の翌年の1971年に、公害行政や自然保護行政を一元的に進めるために設置された国の機関は何か。","a":"環境庁","e":"環境庁は2001年の中央省庁再編で環境省に格上げされた。「1971年＝環境庁」「2001年＝環境省」と区別して覚える。"},{"t":"qa","s":"公害対策の歩み","imp":3,"q":"公害による健康被害について、加害企業に故意や過失がなくても損害賠償の責任を負わせる原則を何というか。","a":"無過失責任","alt":["無過失責任の原則","無過失責任主義","無過失賠償責任"],"e":"民法の不法行為では、原則として被害者が加害者の故意・過失を証明しなければならない（過失責任の原則）。公害ではその証明が困難なため、1972年の大気汚染防止法・水質汚濁防止法の改正で無過失責任が導入された。"},{"t":"qa","s":"公害対策の歩み","imp":2,"q":"1973年に制定され、汚染原因企業などから集めた費用をもとに、公害病と認定された患者に補償給付を行う制度を定めた法律は何か。","a":"公害健康被害補償法","alt":["公害健康被害の補償等に関する法律","公健法"],"e":"汚染者負担の原則にもとづく被害者救済の仕組みである。大気汚染の改善が進んだことから、1987年の改正で、大気汚染による新たな患者の認定は1988年以降打ち切られた。"},{"t":"ex","s":"公害対策の歩み","imp":3,"q":"公害の規制における「濃度規制」と「総量規制」の違いを説明せよ。","a":"濃度規制は、工場の排出口から出る汚染物質の濃度を一定の基準以下に抑える規制である。しかし、排ガスや排水を薄めれば基準を満たせるうえ、工場が集中する地域では全体の汚染量が減らないという欠点があった。そこで、地域全体の汚染物質の排出総量に上限を定め、各工場に割り当てる総量規制が導入された。","e":"ポイント：①濃度規制は排出口での濃度の規制 ②薄めれば基準を満たせ、地域全体の汚染量が減らない欠点 ③総量規制は地域全体の排出総量に上限を設ける"},{"t":"qa","s":"公害対策の歩み","imp":3,"q":"公害防止のための費用は、汚染物質を排出した者が負担すべきだとする原則で、1972年にOECDが提唱したものを何というか。","a":"汚染者負担の原則","alt":["PPP","汚染者負担原則","汚染者支払原則","汚染者支払い原則"],"e":"PPPはPolluter Pays Principleの略である。OECDは汚染防止の費用について示したが、日本ではさらに、汚染された環境の回復費用や被害者の救済費用にも適用されている。"},{"t":"mc","s":"公害対策の歩み","imp":2,"q":"汚染者負担の原則（PPP）の考え方に最も合致する事例を一つ選べ。","c":["工場が排水処理設備の設置費用を自ら負担して、排水基準を守る。","工場の排水で汚染された河川の浄化費用を、すべて国の税金でまかなう。","公害病の患者の治療費を、患者本人がすべて負担する。","汚染物質を出す工場の設備改善費用を、周辺住民から集めた寄付で負担する。"],"a":0,"e":"汚染を引き起こす事業者自身が公害防止の費用を負担しているので、PPPに合致する。『国の税金でまかなう』『患者本人が負担』『周辺住民の寄付で負担』は、いずれも汚染者以外の者が費用を負担しており、PPPの考え方に反する。"},{"t":"mc","s":"公害対策の歩み","imp":3,"q":"環境基本法に関する記述として最も適当なものを一つ選べ。","c":["公害対策基本法と自然環境保全法の考え方を引き継ぎ、地球環境の保全も対象として1993年に制定された。","1967年に制定され、典型公害の種類をはじめて定めた法律である。","この法律の制定と同時に、環境庁が環境省に改組された。","生活環境の保全は、経済の健全な発展との調和が図られるようにすることを定めている。"],"a":0,"e":"環境基本法は1992年の地球サミット（国連環境開発会議）を受けて1993年に制定され、地球環境問題も対象としたので正しい。『1967年に制定』は公害対策基本法の説明である。環境庁が環境省となったのは2001年なので『制定と同時に』は誤り。『経済の健全な発展との調和』は公害対策基本法の経済調和条項の内容で、1970年に削除されている。"},{"t":"qa","s":"公害対策の歩み","imp":3,"q":"大規模な開発事業を行う前に、その事業が環境に与える影響を事業者が調査・予測・評価し、住民などの意見も聞いて事業計画に反映させる制度を何というか。","a":"環境アセスメント","alt":["環境影響評価","環境アセスメント制度","環境影響評価制度"],"e":"国の制度としては1997年に環境影響評価法が制定された（1999年施行）。それ以前から、1976年の川崎市をはじめ、地方公共団体が条例で導入していた。"},{"t":"ex","s":"新しい環境問題","imp":2,"q":"都市・生活型公害とは何か、産業公害との違いに触れて説明せよ。","a":"都市・生活型公害とは、自動車の排出ガスや騒音、生活排水による河川の汚濁、ごみの増加など、都市への人口集中や日常生活から生じる公害である。特定の企業が原因となる産業公害と異なり、住民自身が加害者にも被害者にもなるため、規制だけでは解決が難しく、一人ひとりの生活の見直しが必要となる。","e":"ポイント：①自動車の排ガス・生活排水・ごみなど日常生活から生じる ②住民が加害者にも被害者にもなる ③企業への規制だけでは解決が難しい"},{"t":"qa","s":"新しい環境問題","imp":2,"q":"塩素を含むプラスチックなどを低い温度で焼却したときなどに発生し、強い毒性をもつことから、1999年に特別措置法で排出が規制された化学物質は何か。","a":"ダイオキシン","alt":["ダイオキシン類"],"e":"ごみ焼却場の周辺の汚染が問題となり、ダイオキシン類対策特別措置法が制定された。高温で焼却する施設への改善などにより、排出量は大きく減少した。"},{"t":"qa","s":"新しい環境問題","imp":2,"q":"断熱材などとして広く使われ、吸い込むと数十年後に中皮腫や肺がんを引き起こすおそれがあることから、現在は製造・使用などが禁止されている繊維状の鉱物は何か。","a":"アスベスト","alt":["石綿"],"e":"潜伏期間が数十年と長いため、使用が広がった時期から長い年月を経て被害が表面化した。アスベストを使った建物の解体時に飛び散らないようにする対策も重要である。"},{"t":"tf","s":"新しい環境問題","imp":1,"q":"アスベストによる健康被害は工場で働く労働者に限られ、工場の周辺に住む人々には被害が及ばなかった。","a":false,"e":"正しくは、2005年に大手機械メーカーの工場周辺の住民にも被害が出ていたことが明らかになり、大きな社会問題となった。これを受けて2006年に石綿健康被害救済法が制定され、労災補償の対象とならない住民なども救済されるようになった。"},{"t":"qa","s":"新しい環境問題","imp":1,"q":"産業廃棄物の処理を他の業者に委託する際に、排出事業者が廃棄物の流れを確認し、不法投棄を防ぐために用いる管理票を何というか。","a":"マニフェスト","alt":["産業廃棄物管理票","マニフェスト制度"],"e":"香川県の豊島で大量の産業廃棄物が不法投棄された事件などを背景に、規制が強化された。不法投棄は処理費用を逃れるために行われ、原状回復には莫大な費用と長い年月がかかる。"}]});</script>
<script>QDATA.push({"unit":"u20","questions":[{"t":"qa","s":"循環型社会","imp":3,"q":"2000年に制定され、廃棄物の処理の優先順位などを定めて、循環型社会の形成をめざす基本的な枠組みとなった法律は何か。","a":"循環型社会形成推進基本法","alt":["循環型社会基本法"],"e":"この法律を基本的な枠組みとして、容器包装・家電・自動車などの個別のリサイクル法が体系づけられている。生産者が製品の廃棄・リサイクルまで責任を負う拡大生産者責任の考え方も取り入れられた。"},{"t":"mc","s":"循環型社会","imp":3,"q":"循環型社会形成推進基本法が定める廃棄物などの処理の優先順位として正しいものを一つ選べ。","c":["発生抑制 → 再使用 → 再生利用 → 熱回収 → 適正処分","再生利用 → 再使用 → 発生抑制 → 熱回収 → 適正処分","熱回収 → 発生抑制 → 再使用 → 再生利用 → 適正処分","再使用 → 発生抑制 → 熱回収 → 再生利用 → 適正処分"],"a":0,"e":"まずごみを出さないこと（発生抑制＝リデュース）が最優先で、次に繰り返し使うこと（再使用＝リユース）、原材料として再利用すること（再生利用＝リサイクル）、燃やして熱を利用すること（熱回収）と続き、どうしても残るものを適正に処分する。リサイクルが最優先ではない点がひっかけになりやすい。"},{"t":"qa","s":"循環型社会","imp":3,"q":"3Rのうち、買い物にマイバッグを持参したり、詰め替え用の製品を選んだりして、ごみの発生そのものを減らすことを何というか。","a":"リデュース","alt":["Reduce","発生抑制"],"e":"3Rはリデュース（発生抑制）、リユース（再使用）、リサイクル（再生利用）の頭文字である。この順番がそのまま優先順位にもなっている。"},{"t":"mc","s":"循環型社会","imp":2,"q":"次の行動のうち、3Rの「リユース」にあたるものとして最も適当なものを一つ選べ。","c":["読み終えた本をフリマアプリで売り、別の人に読んでもらう。","買い物の際にマイバッグを持参し、レジ袋を受け取らない。","使用済みのペットボトルを回収して、衣料品の繊維の原料にする。","燃やすごみを焼却したときの熱を利用して発電する。"],"a":0,"e":"製品をそのままの形で繰り返し使うのがリユース（再使用）なので、本を別の人に読んでもらうのが正しい。『マイバッグを持参』はごみの発生を減らすリデュース、『ペットボトルを繊維の原料に』は原材料として再利用するリサイクル、『焼却の熱で発電』は熱回収（サーマル・リサイクル）である。"},{"t":"qa","s":"循環型社会","imp":2,"q":"生産者が、製品の生産・使用の段階だけでなく、廃棄・リサイクルの段階まで一定の責任を負うという考え方を何というか。","a":"拡大生産者責任","alt":["EPR"],"e":"生産者に廃棄後の責任を負わせることで、リサイクルしやすく、ごみになりにくい製品の設計を促すねらいがある。容器包装リサイクル法や家電リサイクル法などに取り入れられている。"},{"t":"mc","s":"循環型社会","imp":2,"q":"日本のリサイクル関連法に関する記述として最も適当なものを一つ選べ。","c":["家電リサイクル法は、エアコン・テレビ・冷蔵庫・洗濯機などを対象とし、消費者が廃棄する際にリサイクル料金などを負担する。","自動車リサイクル法では、リサイクル費用をすべて自動車メーカーが負担し、自動車の所有者の負担はない。","容器包装リサイクル法は、携帯電話やデジタルカメラに含まれるレアメタルの回収を主な目的としている。","食品リサイクル法は、一般家庭に対して生ごみの堆肥化を義務づけている。"],"a":0,"e":"家電リサイクル法（2001年施行）は、家電4品目について、消費者が廃棄時に収集運搬料金とリサイクル料金を負担するので正しい。自動車リサイクル法では、所有者が原則として新車購入時にリサイクル料金を前払いする。レアメタルなどの回収は小型家電リサイクル法（2013年施行）の目的である。容器包装リサイクル法（1995年制定）は、消費者が分別して出し、市町村が分別収集し、事業者が再商品化するという役割分担を定めている。食品リサイクル法は、食品の製造・販売・外食などの食品関連事業者を対象としている。"},{"t":"qa","s":"循環型社会","imp":2,"q":"国や独立行政法人などに、環境への負荷が少ない製品やサービスを優先して調達することを義務づけた、2000年制定の法律は何か。","a":"グリーン購入法","alt":["国等による環境物品等の調達の推進等に関する法律"],"e":"地方公共団体には努力義務が課されている。消費者や企業が環境に配慮した製品を選んで購入することを、一般にグリーン購入という。"},{"t":"tf","s":"循環型社会","imp":1,"q":"2020年7月から、容器包装リサイクル法にもとづく省令の改正により、小売業者にプラスチック製買物袋（レジ袋）の有料化が義務づけられた。","a":true,"e":"プラスチックごみの削減と、ライフスタイルの見直しを促すことがねらいである。ただし、繰り返し使える厚手の袋や、植物由来の素材を一定以上含む袋などは対象外とされている。"},{"t":"qa","s":"循環型社会","imp":1,"q":"2022年4月に施行され、使い捨てのスプーンやストローなどの提供方法の見直しを事業者に求めるなど、製品の設計から廃棄までプラスチックの資源循環を進める法律は何か。","a":"プラスチック資源循環促進法","alt":["プラスチック資源循環法","プラスチックに係る資源循環の促進等に関する法律","プラ新法"],"e":"海に流れ出たプラスチックごみや、細かく砕けたマイクロプラスチックによる海洋汚染が国際的な問題となっていることが背景にある。市町村によるプラスチック製品の分別回収も進められている。"},{"t":"ex","s":"循環型社会","imp":2,"q":"循環型社会とはどのような社会か、従来の経済社会のあり方と対比して説明せよ。","a":"従来の経済社会は大量生産・大量消費・大量廃棄を前提としており、資源の浪費や廃棄物の増加、環境への負荷をもたらした。これに対し循環型社会とは、廃棄物の発生を抑え、出たものはできるだけ再使用・再生利用し、最後に残ったものを適正に処分することで、天然資源の消費を抑え、環境への負荷をできる限り減らす社会である。","e":"ポイント：①大量生産・大量消費・大量廃棄からの転換 ②発生抑制・再使用・再生利用・適正処分 ③天然資源の消費の抑制と環境負荷の低減"},{"t":"qa","s":"ナショナル・トラスト","imp":2,"q":"市民から寄付を募って、すぐれた自然環境や歴史的建造物を買い取ったり寄贈を受けたりして、保存・管理する運動を何というか。","a":"ナショナル・トラスト運動","alt":["ナショナル・トラスト","ナショナルトラスト","ナショナルトラスト運動"],"e":"日本では、鎌倉の鶴岡八幡宮の裏山の保存運動や、北海道知床の「100平方メートル運動」、和歌山県田辺市の天神崎の保全運動などが知られる。"},{"t":"tf","s":"ナショナル・トラスト","imp":1,"q":"ナショナル・トラスト運動は19世紀末のイギリスで始まり、日本でも市民の寄付によって土地を買い取り、自然環境を守る活動が行われてきた。","a":true,"e":"イギリスでは1895年に民間団体のナショナル・トラストが設立され、現在では広大な土地や多くの歴史的建造物を保有・管理している。行政や企業に頼らず、市民の力で環境を守る運動である。"},{"t":"qa","s":"資源とエネルギー","imp":2,"q":"石油・石炭・天然ガス・水力・太陽光など、自然界に存在する形のまま利用されるエネルギーを何というか。","a":"一次エネルギー","alt":["1次エネルギー"],"e":"一次エネルギーを変換・加工してつくられる電気・ガソリン・都市ガスなどは二次エネルギーという。電気は使いやすいが、つくる過程でエネルギーの損失が生じる。"},{"t":"tf","s":"資源とエネルギー","imp":2,"q":"電気は自然界に存在する形のまま利用できるため、一次エネルギーに分類される。","a":false,"e":"正しくは、電気は石油・天然ガス・水力・原子力などの一次エネルギーを変換してつくられる二次エネルギーである。ガソリンや都市ガスも二次エネルギーである。"},{"t":"qa","s":"資源とエネルギー","imp":3,"q":"1950年代後半から60年代にかけて、日本の主要なエネルギー源が石炭から石油へと急速に転換したことを何というか。","a":"エネルギー革命","e":"安価な中東の石油が大量に輸入されるようになり、国内の炭鉱は次々と閉山した。石油への依存度が高まったことが、1970年代の石油危機で日本が大きな打撃を受ける原因となった。"},{"t":"mc","s":"資源とエネルギー","imp":3,"q":"日本のエネルギー事情に関する記述として最も適当なものを一つ選べ。","c":["日本のエネルギー自給率は近年10%台にとどまり、輸入する原油の9割以上を中東地域に依存している。","日本は石油危機以降、原油の中東依存度を下げることに成功し、現在は輸入の半分以下となっている。","日本の一次エネルギー供給に占める化石燃料の割合は、現在は約3割にまで低下している。","日本は国内のガス田の開発によって、天然ガスの大部分を自給している。"],"a":0,"e":"日本のエネルギー自給率は近年10%台と主要国の中でもきわめて低く、原油の中東依存度は9割を超えているので正しい。中東依存度は石油危機後にいったん低下したが、その後再び上昇した。一次エネルギー供給の約8割は化石燃料である。天然ガスもほぼ全量を液化天然ガス（LNG）として輸入している。"},{"t":"ex","s":"資源とエネルギー","imp":2,"q":"化石燃料の「可採年数」とは何か、またその値が年によって変化する理由を説明せよ。","a":"可採年数とは、ある時点の確認埋蔵量をその年の生産量で割った値で、そのときの生産量で採掘を続けた場合にあと何年採掘できるかを示す。新たな資源の発見や採掘技術の進歩、価格の上昇などで確認埋蔵量が増えたり、生産量が変化したりすると値も変わるため、資源が尽きる時期を正確に示すものではない。","e":"ポイント：①確認埋蔵量÷年間生産量 ②新たな発見や技術の進歩で確認埋蔵量が変化する ③化石燃料が有限で、いずれ枯渇する資源であることに変わりはない"}]});</script>
<script>QDATA.push({"unit":"u20","questions":[{"t":"qa","s":"原子力発電","imp":2,"q":"原子力発電所で使い終わった核燃料を再処理してウランやプルトニウムを取り出し、再び燃料として利用する仕組みを何というか。","a":"核燃料サイクル","alt":["原子燃料サイクル"],"e":"青森県六ヶ所村の再処理工場は完成が延期を重ねており、高速増殖炉もんじゅは2016年に廃炉が決まるなど、計画どおりには進んでいない。取り出したプルトニウムを混ぜたMOX燃料を通常の原発で使うプルサーマルも行われている。"},{"t":"tf","s":"原子力発電","imp":2,"q":"原子力発電で生じる高レベル放射性廃棄物については、最終処分地がすでに決定し、地下深くへの埋設が始まっている。","a":false,"e":"正しくは、高レベル放射性廃棄物を地下深くに埋める地層処分の方針は決まっているが、最終処分地は決まっていない。処分地の選定は、文献調査などの初期段階にとどまっている。"},{"t":"mc","s":"原子力発電","imp":3,"q":"原子力発電所の事故に関する記述として最も適当なものを一つ選べ。","c":["1986年に、ソ連（現在のウクライナ）のチェルノブイリ原子力発電所で事故が起こり、放射性物質が国境を越えて広範囲に拡散した。","1979年に、アメリカのスリーマイル島原子力発電所で事故が起こり、国際原子力事象評価尺度で最悪のレベル7とされた。","2011年の福島第一原子力発電所の事故は、阪神・淡路大震災にともなう津波によって引き起こされた。","チェルノブイリ原子力発電所の事故を受けて、ドイツは1980年代のうちにすべての原子力発電所の運転を停止した。"],"a":0,"e":"チェルノブイリ原発事故（1986年）は、放射性物質がヨーロッパ各地に拡散した史上最悪級の事故なので正しい。スリーマイル島原発事故（1979年）はレベル5で、レベル7とされたのはチェルノブイリと福島第一である。福島第一原発事故は2011年の東日本大震災による津波が原因で、阪神・淡路大震災は1995年である。ドイツがすべての原発を停止したのは2023年である。"},{"t":"qa","s":"原子力発電","imp":3,"q":"福島第一原発事故の反省から、原子力の利用を推進する組織と規制する組織を分離するため、2012年に環境省の外局として設置された機関は何か。","a":"原子力規制委員会","e":"それまで規制を担っていた原子力安全・保安院は、原発を推進する経済産業省のもとに置かれていた。原子力規制委員会は独立性の高い行政委員会で、新規制基準にもとづいて原発の再稼働の審査などを行う。"},{"t":"tf","s":"原子力発電","imp":2,"q":"福島第一原発事故の後に定められた原子力発電所の新規制基準では、地震・津波への対策の強化に加え、重大事故（シビアアクシデント）やテロへの対策も求められるようになった。","a":true,"e":"新規制基準は2013年に施行された。原発を再稼働するには、原子力規制委員会による新規制基準への適合審査に合格する必要がある。法律上の義務ではないが、立地する地元自治体の同意も事実上の条件とされている。"},{"t":"ex","s":"原子力発電","imp":1,"q":"原子力発電所の運転期間に関するルールと、2023年の法改正による変更点を説明せよ。","a":"福島第一原発事故後の法改正で、原発の運転期間は原則40年、原子力規制委員会の認可を受ければ1回に限り最長20年延長できるとされた。2023年の法改正では、運転期間の定めが電気事業法に移され、最長60年の枠は維持しつつ、審査などで停止していた期間を運転期間から除外できるようになり、実質的に60年を超える運転が可能になった。","e":"ポイント：①原則40年、延長は1回最長20年（いわゆる40年ルール） ②2023年改正で停止期間を除外し、60年を超える運転が可能に ③安全面では、運転開始から30年を超える原発を原子力規制委員会が定期的に審査する"},{"t":"qa","s":"原子力発電","imp":1,"q":"福島第一原発事故を受けて脱原発の方針を決定し、2023年4月に国内のすべての原子力発電所の運転を停止したヨーロッパの国はどこか。","a":"ドイツ","alt":["ドイツ連邦共和国"],"e":"ドイツは2011年に2022年末までの脱原発を決めたが、ロシアのウクライナ侵攻によるエネルギー危機で、最後の3基の運転を2023年4月まで延長した。一方、フランスのように発電の多くを原子力に頼る国もあり、各国の政策は分かれている。"},{"t":"qa","s":"再生可能エネルギー","imp":3,"q":"太陽光・風力・水力・地熱・バイオマスなど、自然の力で繰り返し補充され、枯渇する心配がないエネルギーを何というか。","a":"再生可能エネルギー","alt":["再エネ","自然エネルギー"],"e":"発電時に二酸化炭素をほとんど出さず、国内で生産できるためエネルギー自給率の向上にもつながる。一方で、天候によって発電量が変動する、発電コストが高い、適地が限られるなどの課題がある。"},{"t":"qa","s":"再生可能エネルギー","imp":3,"q":"再生可能エネルギーで発電した電気を、国が定めた価格で一定期間、電力会社が買い取ることを義務づけ、2012年に始まった制度を何というか。","a":"固定価格買取制度","alt":["FIT","固定価格買い取り制度","フィード・イン・タリフ","FIT制度"],"e":"この制度により、特に太陽光発電の導入が急速に進んだ。買取費用は、電気料金に上乗せされる再生可能エネルギー発電促進賦課金（再エネ賦課金）として電気の利用者が負担している。"},{"t":"ex","s":"再生可能エネルギー","imp":2,"q":"固定価格買取制度（FIT）の課題と、2022年に導入されたFIP制度の仕組みを説明せよ。","a":"FITは再生可能エネルギーの電気を固定価格で買い取る制度で、導入は大きく進んだが、買取費用を賄う再エネ賦課金が膨らみ、国民負担の増大が課題となった。また、市場の需給と関係なく発電されるという問題もあった。そこで2022年に、発電事業者が市場で電気を売り、市場価格に一定の補助額（プレミアム）を上乗せして受け取るFIP制度が導入された。","e":"ポイント：①FITは固定価格での買い取りで導入を促進 ②再エネ賦課金による国民負担の増大 ③FIPは市場価格にプレミアムを上乗せし、需給に応じた発電を促す"},{"t":"tf","s":"再生可能エネルギー","imp":2,"q":"固定価格買取制度の買取費用はすべて国の一般会計から支出されており、電気の利用者に負担は生じない。","a":false,"e":"正しくは、買取費用の多くは、電気料金に上乗せされる再エネ賦課金として、家庭や企業など電気の利用者が使用量に応じて負担している。"},{"t":"tf","s":"再生可能エネルギー","imp":1,"q":"バイオマス発電は、燃料となる植物が成長の過程で二酸化炭素を吸収しているため、燃焼させても大気中の二酸化炭素を増やさないとみなされる。","a":true,"e":"このような考え方をカーボンニュートラルという。バイオマスとは、木くず・家畜のふん尿・生ごみなど、動植物に由来する再生可能な資源のことである。"},{"t":"mc","s":"再生可能エネルギー","imp":2,"q":"再生可能エネルギーに関する記述として最も適当なものを一つ選べ。","c":["地熱発電は、火山の多い日本では資源量が豊富だが、適地の多くが国立公園内や温泉地にあることなどが開発の制約となっている。","太陽光発電や風力発電は、天候や時間帯にかかわらず常に一定の出力が得られる。","原子力発電は、発電時に二酸化炭素を排出しないため、再生可能エネルギーに分類される。","日本の発電電力量に占める再生可能エネルギーの割合は、すでに8割を超えている。"],"a":0,"e":"地熱発電の資源量は世界有数だが、国立公園や温泉との調整が課題となっているので正しい。太陽光や風力は天候や時間帯で出力が大きく変動する。原子力は発電時に二酸化炭素を出さないが、燃料のウランは枯渇性資源であり再生可能エネルギーではない。日本の発電電力量に占める再生可能エネルギーの割合は約2割である。"},{"t":"qa","s":"電力システム改革","imp":2,"q":"2016年4月に実施され、一般家庭なども電気を買う電力会社（小売電気事業者）を自由に選べるようになった改革を何というか。","a":"電力小売の全面自由化","alt":["電力小売全面自由化","電力の小売全面自由化","電力自由化","電力小売自由化"],"e":"電力の小売は2000年から大口の需要家向けに段階的に自由化されており、2016年に家庭向けを含めて全面自由化された。新たな事業者の参入で、料金やサービスの競争が進むことが期待された。"},{"t":"qa","s":"電力システム改革","imp":2,"q":"電力会社の発電部門と送配電部門を分け、送配電網を中立的に利用できるようにすることを何というか。","a":"発送電分離","e":"日本では2020年4月に、大手電力会社の送配電部門を別会社にする法的分離が行われた。発電した電気を公平な条件で送配電網に流せるようにして、新規参入や再生可能エネルギーの導入を促すねらいがある。"},{"t":"tf","s":"電力システム改革","imp":1,"q":"日本の電力システム改革では、2016年に大手電力会社の送配電部門を別会社にする発送電分離が行われ、その後2020年に家庭向けの電力小売が自由化された。","a":false,"e":"正しくは順序が逆で、2016年に家庭向けを含む電力小売の全面自由化が行われ、2020年に送配電部門を別会社にする発送電分離（法的分離）が行われた。"},{"t":"qa","s":"脱炭素社会","imp":3,"q":"温室効果ガスの排出量から、森林などによる吸収量を差し引いて、全体として実質ゼロにすることを何というか。","a":"カーボンニュートラル","alt":["カーボン・ニュートラル","ネットゼロ","ネット・ゼロ","脱炭素"],"e":"日本政府は2020年に「2050年カーボンニュートラル」を宣言し、2021年に改正された地球温暖化対策推進法にもその実現が明記された。2030年度に温室効果ガスを2013年度比で46%削減する目標も掲げている。国際的な取り組みは地球環境問題の単元で学ぶ。"},{"t":"qa","s":"脱炭素社会","imp":1,"q":"2012年に導入された、石油・石炭・天然ガスなどの化石燃料に、二酸化炭素の排出量に応じて上乗せして課される税を何というか。","a":"地球温暖化対策税","alt":["地球温暖化対策のための税","温対税","環境税","炭素税"],"e":"既存の石油石炭税に上乗せする形で課税され、税収は省エネルギーや再生可能エネルギーの普及などに使われる。二酸化炭素の排出に価格をつけるカーボンプライシングの一つである。"},{"t":"ex","s":"脱炭素社会","imp":2,"q":"カーボンプライシングとは何か、その代表的な2つの手法に触れて説明せよ。","a":"カーボンプライシングとは、二酸化炭素の排出に価格をつけることで、排出の削減を経済的に促す政策である。代表的な手法に、排出量に応じて課税する炭素税と、企業などに排出枠を割り当て、余った枠や足りない枠を市場で売買させる排出量取引がある。排出すると費用がかかるため、企業や家計が排出の少ない行動を選ぶようになる。","e":"ポイント：①二酸化炭素の排出に価格をつける ②炭素税と排出量取引（キャップ・アンド・トレード） ③市場の仕組みを利用して削減を促す"},{"t":"mc","s":"脱炭素社会","imp":2,"q":"ある国で、企業ごとに二酸化炭素の排出枠を割り当てる排出量取引制度が導入された。排出枠が100万トンのA社の実際の排出量は80万トン、排出枠が100万トンのB社の実際の排出量は120万トンであった。この制度のもとで起こりうることとして最も適当なものを一つ選べ。","c":["A社は余った20万トン分の排出枠をB社に売却でき、B社はそれを購入して不足分を補うことができる。","A社は排出枠が余ったので、翌年から自動的に排出枠が増やされる。","B社は排出枠を超えたため、他社から排出枠を購入することは一切できない。","排出枠の価格は政府が固定しており、市場の需給によって変動することはない。"],"a":0,"e":"排出量取引では、排出を枠より少なく抑えた企業が余った枠を売り、枠を超えた企業がそれを買うことができる。A社には削減の努力が利益になるという動機が生まれ、社会全体として少ない費用で削減を進められる。『翌年から自動的に排出枠が増やされる』『購入は一切できない』は制度の仕組みに反し、排出枠の価格は市場の需給で変動するのが基本である。"}]});</script>
<script>QDATA.push({"unit":"u21","questions":[{"t":"qa","s":"労働運動の歴史","imp":2,"q":"産業革命期のイギリスで、機械の普及によって仕事を奪われた手工業者らが、機械を打ち壊して抵抗した運動を何というか。","a":"ラッダイト運動","alt":["ラダイト運動","ラッダイト","機械打ちこわし運動","機械打ち壊し運動"],"e":"1810年代にイギリス中部・北部で起きた。機械そのものを敵とする素朴な抵抗だったが、その後労働者は団結して労働組合をつくり、労働条件の改善や参政権を求める運動（チャーティスト運動）へと進んでいった。"},{"t":"qa","s":"労働運動の歴史","imp":1,"q":"1833年にイギリスで制定され、繊維工場での9歳未満の児童の雇用禁止や年少者の労働時間の制限を定め、違反を取り締まる工場監督官を置いた法律を何というか。","a":"工場法","alt":["1833年工場法","一般工場法"],"e":"産業革命期の工場では児童労働や長時間労働が広がっていた。国家が労使の契約に介入して労働条件の最低基準を定めた初期の例であり、現代の労働基準法の源流にあたる。"},{"t":"qa","s":"労働運動の歴史","imp":3,"q":"第一次世界大戦後の1919年にヴェルサイユ条約に基づいて設立され、労働条件の改善を国際的に進めている機関を何というか。","a":"国際労働機関","alt":["ILO","国際労働機関（ILO）"],"e":"政府・使用者・労働者の代表が参加する三者構成が特徴で、労働時間や団結権などに関する条約・勧告を採択している。1946年に国際連合の専門機関となった。1944年のフィラデルフィア宣言では「労働は商品ではない」ことを確認した。"},{"t":"tf","s":"労働運動の歴史","imp":2,"q":"日本の工場法は1911年に制定されたが、資本家の反対などにより、施行は1916年まで遅れた。","a":true,"e":"正しい。日本最初の本格的な労働者保護立法で、12歳未満の者の就業禁止や、15歳未満の者と女性の労働時間を1日12時間までとすることなどを定めた。ただし適用は常時15人以上を使用する工場に限られ、例外も多く、保護は不十分だった。"},{"t":"qa","s":"労働運動の歴史","imp":1,"q":"1900年に制定され、労働者の団結やストライキの扇動などを取り締まって、日本の初期の労働運動を抑圧した法律を何というか。","a":"治安警察法","e":"第2次山県有朋内閣のもとで制定された。1925年には共産主義などの運動を取り締まる治安維持法も制定され、戦前の労働運動は厳しく抑えられた。これらの法律は戦後の民主化の中で廃止された。"},{"t":"tf","s":"労働運動の歴史","imp":1,"q":"日中戦争から太平洋戦争にかけての時期、労働組合は解散させられ、労使が一体となって戦争に協力する産業報国会に組み込まれていった。","a":true,"e":"正しい。1940年には全国組織として大日本産業報国会が結成され、労働組合は姿を消した。戦後はGHQの民主化政策のもとで労働組合の結成が奨励され、労働三法が制定された。"},{"t":"mc","s":"労働運動の歴史","imp":2,"q":"戦後に制定された労働三法についての記述として最も適当なものを一つ選べ。","c":["労働組合法は1945年に制定され、労働三法の中で最も早く成立した。","労働基準法は、占領が終わった後の1950年代に制定された。","労働関係調整法は、賃金や労働時間など労働条件の最低基準を定めることを目的とする。","労働者の団結権や団体交渉権を具体的に保障する中心的な法律は、労働基準法である。"],"a":0,"e":"労働三法は、労働組合法（1945年、1949年に全面改正）、労働関係調整法（1946年）、労働基準法（1947年）の順に制定された。『1950年代』は誤りで、労働基準法は1947年に制定された。労働条件の最低基準を定めるのは労働基準法であり、労働関係調整法は労働争議の予防・解決を目的とする。団結権や団体交渉権を具体的に保障するのは労働組合法である。"},{"t":"qa","s":"労働運動の歴史","imp":2,"q":"1955年に始まった、毎年春に各産業の労働組合が足並みをそろえて賃上げなどを要求し、一斉に交渉する方式を何というか。","a":"春闘","alt":["春季闘争","春季生活闘争","春季労使交渉"],"e":"企業別労働組合では交渉力が弱いという弱点を、産業別に連携して補う工夫として始まった。高度経済成長期には大幅な賃上げを実現した。2020年代には物価上昇を背景に、約30年ぶりの高い賃上げ率となった。"},{"t":"qa","s":"労働運動の歴史","imp":1,"q":"1989年に、民間部門と官公部門の労働組合が結集して発足した、日本最大の労働組合の全国中央組織を何というか。","a":"日本労働組合総連合会","alt":["連合"],"e":"略称は連合。それまで労働運動の中心だった総評（日本労働組合総評議会）などが解散・合流して結成された。同じ1989年には、連合に加わらなかった労働組合によって全労連（全国労働組合総連合）も結成された。"},{"t":"ex","s":"労働基本権","imp":3,"q":"国家が労働基準法などの法律で労働者と使用者の契約に介入する理由を、「契約自由の原則」という語を用いて説明せよ。","a":"近代市民社会では契約自由の原則により、労働条件も労使の自由な合意で決めるのが建前である。しかし生活のために働かざるをえない労働者は使用者より弱い立場にあり、低賃金や長時間労働などの不利な条件を受け入れざるをえない。そこで国家が法律で労働条件の最低基準を定め、労働者の団結を認めて、実質的に対等な関係で交渉できるようにした。","e":"ポイント：①契約自由の原則のもとでは形式上は対等 ②実際には労働者の立場が弱い（実質的な不平等） ③最低基準の設定と団結権などの保障によって実質的な対等を図る"},{"t":"qa","s":"労働基本権","imp":3,"q":"日本国憲法第28条が勤労者に保障している3つの権利をすべて答えよ。","a":"団結権・団体交渉権・団体行動権","alt":["団結権・団体交渉権・争議権","団結権、団体交渉権、団体行動権","団結権、団体交渉権、争議権","団結権・団体交渉権・団体行動権（争議権）"],"e":"この3つを労働三権という。団体行動権の中心はストライキなどの争議権である。第27条の勤労権とあわせて労働基本権と呼ばれ、いずれも国家に積極的な措置を求める社会権に分類される。"},{"t":"mc","s":"労働基本権","imp":3,"q":"次の行為のうち、日本国憲法第28条の団体交渉権の行使にあたるものとして最も適当なものを一つ選べ。","c":["労働組合が賃上げを求めて、会社側と労働条件について話し合う場をもつ。","労働者たちが、労働条件の改善を目指して新たに労働組合を結成する。","労働組合が要求を実現するため、組合員が一斉に仕事を放棄するストライキを行う。","失業中の人が、公共職業安定所で仕事の紹介を受ける。"],"a":0,"e":"団体交渉権は、労働組合が使用者と労働条件などについて交渉する権利である。労働組合を結成するのは団結権、ストライキを行うのは団体行動権（争議権）の行使にあたる。公共職業安定所での職業紹介は、第27条の勤労権を具体化する国の施策である。"},{"t":"qa","s":"労働基本権","imp":2,"q":"日本国憲法第27条2項によれば、賃金、就業時間、休息その他の勤労条件に関する基準は、何で定めるとされているか。","a":"法律","e":"この規定に基づいて労働基準法や最低賃金法などが制定された。同条1項は「すべて国民は、勤労の権利を有し、義務を負ふ」と定め、3項は児童の酷使を禁止している。"},{"t":"qa","s":"労働基準法の原則","imp":3,"q":"1947年に制定され、賃金・労働時間・休日など労働条件の最低基準を定めた法律を何というか。","a":"労働基準法","alt":["労基法"],"e":"憲法第27条2項に基づく。第1条は、労働条件は「労働者が人たるに値する生活を営むための必要を充たすべきもの」であるとし、この法律の基準は最低のものであるから、これを理由に労働条件を低下させてはならず、その向上を図るように努めなければならないとしている。"},{"t":"tf","s":"労働基準法の原則","imp":3,"q":"労働基準法の基準に達しない労働条件を定めた労働契約は、労働者と使用者が合意していても、契約全体が無効となる。","a":false,"e":"誤り。正しくは、無効となるのは基準に達しない部分だけであり、無効となった部分には労働基準法の基準が適用される（第13条）。たとえば所定労働時間を1日10時間と定めた契約では、契約全体ではなくその部分が無効となり、1日8時間が適用される。労使が合意していても基準を下回ることはできない。"},{"t":"qa","s":"労働基準法の原則","imp":2,"q":"労働基準法第3条が定める、使用者は労働者の国籍・信条・社会的身分を理由として、賃金・労働時間その他の労働条件について差別的取扱いをしてはならないという原則を何というか。","a":"均等待遇","alt":["均等待遇の原則"],"e":"続く第4条は、女性であることを理由として賃金について男性と差別的取扱いをすることを禁止している（男女同一賃金の原則）。賃金以外の募集・採用・配置・昇進などでの男女差別は、男女雇用機会均等法で規制されている。"},{"t":"mc","s":"労働基準法の原則","imp":2,"q":"労働基準法の内容として適当でないものを一つ選べ。","c":["使用者は、暴行や脅迫、監禁などの手段によって、労働者の意思に反して労働を強制してはならない。","使用者は、労働者が女性であることを理由として、賃金について男性と差別的取扱いをしてはならない。","労働者と使用者が合意すれば、この法律の基準を下回る労働条件で働く契約も有効となる。","何人も、法律で許される場合のほかは、業として他人の就業に介入して利益を得てはならない。"],"a":2,"e":"労働基準法の基準は強行的な最低基準であり、労使が合意しても下回ることはできず、基準に達しない部分は無効となる。暴行・脅迫などによる強制労働の禁止（第5条）、男女同一賃金の原則（第4条）、他人の就業に介入して利益を得る中間搾取の排除（第6条）は、いずれも労働基準法に定められている。"},{"t":"qa","s":"労働基準法の原則","imp":3,"q":"労働基準法などが守られているかを監督し、事業所への立入調査や違反の是正勧告などを行う、厚生労働省の機関を何というか。","a":"労働基準監督署","alt":["労基署"],"e":"都道府県労働局の下に全国に置かれている。所属する労働基準監督官は事業場に立ち入って調査できるほか、重大な法律違反については司法警察員として捜査し、検察庁に送検することもできる。"},{"t":"qa","s":"労働時間と休暇","imp":3,"q":"労働基準法が定める法定労働時間は、休憩時間を除いて1日何時間・1週間何時間か。","a":"1日8時間・1週間40時間","alt":["1日8時間・週40時間","1日8時間、1週間40時間","1日8時間、週40時間","8時間・40時間"],"e":"これを超えて働かせるには36協定の締結と届出が必要で、超えた分には割増賃金を支払わなければならない。週40時間制は1987年の法改正で定められ、段階的に実施された（それ以前は週48時間）。"},{"t":"mc","s":"労働時間と休暇","imp":1,"q":"労働基準法が定める休憩・休日についての記述として最も適当なものを一つ選べ。","c":["労働時間が6時間を超える場合は少なくとも45分、8時間を超える場合は少なくとも1時間の休憩を、労働時間の途中に与えなければならない。","休憩時間は、労働者の同意があれば、その日の勤務が終わった後にまとめて与えてもよい。","使用者は、労働者に少なくとも毎週2日の休日を与えなければならない。","休憩時間中であっても、使用者は労働者に電話番などの業務を自由に命じることができる。"],"a":0,"e":"休憩は労働時間の途中に与えなければならず、勤務終了後にまとめて与えることはできない。また休憩時間は労働者が自由に利用できるものでなければならず、電話番などを命じればその時間は労働時間となる。休日は毎週少なくとも1日（または4週間を通じて4日以上）でよく、週休2日は法律上の義務ではない。"},{"t":"qa","s":"労働時間と休暇","imp":3,"q":"使用者が法定労働時間を超える時間外労働や休日労働をさせるために、労働者の過半数で組織する労働組合（ない場合は労働者の過半数を代表する者）と結び、労働基準監督署長に届け出る協定を何というか。","a":"36協定","alt":["三六協定","サブロク協定","さぶろく協定","時間外・休日労働に関する協定"],"e":"労働基準法第36条に基づくことからこう呼ばれる。協定なしに時間外労働をさせることは違法である。協定を結んでも無制限に働かせられるわけではなく、2018年の法改正で時間外労働に罰則付きの上限が設けられた。"},{"t":"mc","s":"労働時間と休暇","imp":2,"q":"時給1,200円で働く人が、ある日、法定労働時間を超えて2時間の時間外労働をした（深夜労働や休日労働にはあたらない）。労働基準法が定める最低限の割増率で計算した場合、この2時間分の賃金として最も適当なものを一つ選べ。","c":["2,400円","3,000円","3,240円","3,600円"],"a":1,"e":"時間外労働の割増率は25%以上なので、1,200円×1.25×2時間＝3,000円となる。『2,400円』は割増をしなかった場合、『3,240円』は休日労働の割増率35%で、『3,600円』は1か月60時間を超える時間外労働の割増率50%で計算した場合である。なお深夜（午後10時〜午前5時）の労働にはさらに25%以上が上乗せされる。"},{"t":"tf","s":"労働時間と休暇","imp":1,"q":"年次有給休暇は、雇い入れの日から6か月間継続して勤務し、全労働日の8割以上出勤した正社員だけに与えられ、パートタイム労働者には与えられない。","a":false,"e":"誤り。正しくは、要件を満たせばパートタイム労働者にも、週の所定労働日数に応じた日数の年次有給休暇が与えられる（比例付与）。フルタイムの場合は最初に10日が与えられ、勤続年数に応じて最大20日まで増える。"},{"t":"qa","s":"労働時間と休暇","imp":2,"q":"2019年から、年10日以上の年次有給休暇が与えられる労働者に対して、使用者が時季を指定するなどして毎年確実に取得させることが義務づけられた日数は何日か。","a":"5日","alt":["年5日","5"],"e":"働き方改革関連法による労働基準法の改正で導入された。日本では年休の取得率が低く、周囲に気兼ねして取得をためらう傾向があったことが背景にある。年休をどのような目的で使うかは労働者の自由である。"},{"t":"tf","s":"解雇と就業規則","imp":3,"q":"労働基準法では、使用者が労働者を解雇しようとする場合、原則として少なくとも14日前にその予告をしなければならない。","a":false,"e":"誤り。正しくは少なくとも30日前に予告するか、30日分以上の平均賃金（解雇予告手当）を支払わなければならない。ただし予告さえすれば自由に解雇できるわけではなく、客観的に合理的な理由がなく社会通念上相当と認められない解雇は、労働契約法により無効となる。"},{"t":"qa","s":"解雇と就業規則","imp":2,"q":"常時10人以上の労働者を使用する使用者が作成して労働基準監督署長に届け出なければならない、始業・終業の時刻や賃金、退職などについて定めた職場のルールを何というか。","a":"就業規則","e":"作成や変更の際には、労働者の過半数で組織する労働組合（ない場合は過半数代表者）の意見を聴かなければならないが、同意までは必要とされない。就業規則は法令や労働協約に反してはならず、就業規則の基準に達しない労働契約の部分は無効となる。"},{"t":"mc","s":"年少者・妊産婦の保護","imp":1,"q":"労働基準法による年少者や妊産婦の保護についての記述として最も適当なものを一つ選べ。","c":["満18歳未満の者を、原則として午後10時から午前5時までの深夜に働かせてはならない。","出産した女性であっても、本人が希望すれば出産の翌日から就業させることができる。","中学生であっても、本人と保護者が同意すれば、工場で他の労働者と同じように働かせることができる。","妊娠中の女性が請求しても、使用者は他の軽易な業務に転換させる必要はない。"],"a":0,"e":"18歳未満の年少者は深夜業が原則禁止され、危険・有害な業務への就業も制限される。児童は原則として満15歳に達した日以後の最初の3月31日が終わるまで（中学校卒業まで）働かせてはならない。出産後8週間は原則として就業させてはならず、6週間を経過して本人が請求し医師が認めた業務に限り就業できる。妊娠中の女性が請求した場合は、軽易な業務に転換させなければならない。"},{"t":"tf","s":"労働組合法","imp":2,"q":"労働組合を結成するには、行政機関に届け出て許可を受けなければならない。","a":false,"e":"誤り。正しくは、労働組合は労働者が自主的に結成するもので、行政機関の許可や届出は必要ない（自由設立主義）。ただし労働委員会で不当労働行為の救済を受けるなど労働組合法上の手続きを利用するには、使用者の利益を代表する者が加入していないなど、法律の要件を満たしている必要がある。"},{"t":"qa","s":"労働組合法","imp":3,"q":"労働組合と使用者が団体交渉で合意した労働条件などを書面にし、両者が署名または記名押印したものを何というか。","a":"労働協約","e":"労働協約に定めた労働条件の基準に反する労働契約の部分は無効となり、協約の基準が適用される（規範的効力）。有効期間を定める場合は3年が上限である。使用者が作成する就業規則とは異なり、労使の合意によって成立する。"},{"t":"ex","s":"労働組合法","imp":2,"q":"法令・労働協約・就業規則・労働契約の効力の優先関係を説明せよ。","a":"労働条件を定めるものの効力は、法令が最も強く、次いで労働協約、就業規則、労働契約の順となる。就業規則は法令や労働協約に反してはならず、労働契約のうち労働協約や就業規則の基準に達しない部分は無効となって、それらの基準が適用される。","e":"ポイント：①法令＞労働協約＞就業規則＞労働契約の順 ②上位の定めに反する下位の定めは無効 ③無効となった部分は上位の基準によって補われる"},{"t":"qa","s":"労働組合法","imp":3,"q":"使用者が、組合員であることを理由に労働者を不利益に扱ったり、正当な理由なく団体交渉を拒んだりするなど、労働者の団結権・団体交渉権などを侵害する行為として労働組合法が禁止しているものを何というか。","a":"不当労働行為","e":"労働組合法第7条が定める。組合員であることや組合活動を理由とする解雇などの不利益取扱い、組合に加入しないことを雇用の条件とする黄犬契約、正当な理由のない団体交渉の拒否、組合の結成・運営への支配介入や経費援助などがある。"},{"t":"mc","s":"労働組合法","imp":3,"q":"次の事例のうち、労働組合法が禁止する不当労働行為にあたるものとして最も適当なものを一つ選べ。","c":["会社が、労働組合の委員長を務めていることを理由に、その社員の昇進を見送った。","会社が、労働組合の賃上げ要求に対し、団体交渉の場で経営資料を示して説明したうえで、要求額には応じられないと回答した。","会社が、就業時間中に無断で職場を離れることを繰り返した社員を、就業規則に従って懲戒処分にした。","会社が、労働組合と結んだ労働協約に従って、組合員の賃金を引き上げた。"],"a":0,"e":"組合員であることや組合活動を理由とする不利益な取扱いは不当労働行為である。使用者には団体交渉に誠実に応じる義務があるが、要求を受け入れる義務まではないので、資料を示して説明したうえで要求を断ることは団体交渉の拒否にあたらない。組合活動と無関係な正当な理由による懲戒処分や、労働協約に従った賃上げも不当労働行為ではない。"},{"t":"ex","s":"労働組合法","imp":2,"q":"不当労働行為の主な類型をあげ、労働者が不当労働行為を受けた場合の救済の手続きを説明せよ。","a":"不当労働行為には、組合員であることなどを理由とする解雇などの不利益取扱い、組合に加入しないことを雇用条件とする黄犬契約、正当な理由のない団体交渉の拒否、組合の結成や運営への支配介入などがある。労働者や労働組合は都道府県労働委員会に救済を申し立てることができ、労働委員会は審査のうえ救済命令を出す。命令に不服があれば中央労働委員会に再審査を求めたり、裁判所に訴えたりできる。","e":"ポイント：①不利益取扱い・黄犬契約 ②団体交渉の拒否 ③支配介入（経費援助を含む） ④労働委員会への申立てと救済命令（中央労働委員会での再審査、裁判所での訴訟）"},{"t":"qa","s":"労働組合法","imp":3,"q":"不当労働行為の救済の申立てを審査して救済命令を出したり、労働争議の斡旋・調停・仲裁を行ったりする行政委員会を何というか。","a":"労働委員会","alt":["都道府県労働委員会","中央労働委員会"],"e":"都道府県に都道府県労働委員会、国に中央労働委員会が置かれ、中央労働委員会は都道府県労働委員会の命令に対する再審査などを行う。中立的な立場で労使の紛争を扱うため、行政から独立した合議制の機関とされている。"},{"t":"tf","s":"労働組合法","imp":3,"q":"労働組合が正当な争議行為を行った結果、会社に損害が生じた場合でも、会社は労働組合や組合員に損害賠償を請求することはできない。","a":true,"e":"正しい。労働組合法は、正当な争議行為について損害賠償の責任を負わない民事免責（第8条）と、刑罰を科されない刑事免責（第1条2項）を定めている。ただし暴力の行使は、いかなる場合も労働組合の正当な行為とは認められない。"},{"t":"qa","s":"労働組合法","imp":1,"q":"労働組合と使用者の協定により、採用された労働者は一定期間内に労働組合に加入しなければならず、組合員でなくなった場合には使用者が解雇する義務を負う制度を何というか。","a":"ユニオン・ショップ","alt":["ユニオンショップ","ユニオン・ショップ制","ユニオン・ショップ協定"],"e":"労働組合の組織を強める仕組み（ショップ制）の一つで、日本の大企業に多い。組合員だけを採用するクローズド・ショップや、組合への加入を労働者の自由とするオープン・ショップと区別される。"}]});</script>
<script>QDATA.push({"unit":"u21","questions":[{"t":"qa","s":"争議行為","imp":3,"q":"労働者が団結して、使用者に対する労務の提供を集団的に拒否する争議行為を何というか。","a":"ストライキ","alt":["同盟罷業","スト"],"e":"日本語では同盟罷業という。労働者側の争議行為には、作業能率を意図的に低下させるサボタージュ（怠業）や、スト破りを防ぐために職場の入口などで見張りや説得を行うピケッティングもある。正当な争議行為であれば、刑事上・民事上の責任を問われない。"},{"t":"mc","s":"争議行為","imp":2,"q":"争議行為についての記述として最も適当なものを一つ選べ。","c":["ロックアウトは、使用者が作業所を閉鎖して労働者の就労を拒否する、使用者側の争議行為である。","サボタージュは、労働者が職場を離れて一斉に仕事を休む争議行為である。","ピケッティングは、使用者が労働組合の活動を監視するために職場の入口に見張りを置く行為である。","ストライキ中の労働者に対しても、使用者は通常どおり賃金の全額を支払わなければならない。"],"a":0,"e":"ロックアウト（作業所閉鎖）は、労働組合の争議行為に対抗して使用者が行う争議行為である。職場を離れて一斉に休むのはストライキで、サボタージュは職場にとどまりながら作業能率を落とす怠業である。ピケッティングは労働者側がスト破りを防ぐために行う行為である。ストライキで働かなかった時間の賃金は支払われないのが原則である（ノーワーク・ノーペイの原則）。"},{"t":"qa","s":"労働関係調整法","imp":3,"q":"1946年に制定され、労働争議の予防と解決を目的として、労働委員会による斡旋・調停・仲裁などの手続きを定めた法律を何というか。","a":"労働関係調整法","alt":["労調法"],"e":"労働組合法・労働基準法とともに労働三法の一つである。労働争議は労使が自主的に解決することが基本であり、労働委員会はそれを助ける立場で関与する。"},{"t":"qa","s":"労働関係調整法","imp":2,"q":"労働委員会を構成する3種類の委員をすべて答えよ。","a":"使用者委員・労働者委員・公益委員","alt":["労働者委員・使用者委員・公益委員","公益委員・労働者委員・使用者委員","使用者委員、労働者委員、公益委員","労働者委員、使用者委員、公益委員"],"e":"使用者を代表する委員、労働者を代表する委員、中立的な立場で公益を代表する委員が同数ずつで構成される（三者構成）。国に中央労働委員会、都道府県に都道府県労働委員会が置かれる。仲裁は、公益委員などから選ばれた3人で構成する仲裁委員会が行う。"},{"t":"ex","s":"労働関係調整法","imp":3,"q":"労働関係調整法が定める斡旋・調停・仲裁の違いを説明せよ。","a":"斡旋は、斡旋員が労使の間に入って双方の主張を確かめ、当事者による自主的な解決を促す方法である。調停は、三者構成の調停委員会が調停案を作成して受け入れを勧告するが、受け入れるかどうかは当事者の自由である。仲裁は、仲裁委員会が仲裁裁定を下し、この裁定は労働協約と同一の効力をもって当事者を拘束する。","e":"ポイント：①斡旋は当事者の自主的な解決の手助け ②調停案には拘束力がない（受諾は任意） ③仲裁裁定は労働協約と同一の効力をもち当事者を拘束する"},{"t":"tf","s":"労働関係調整法","imp":3,"q":"労働委員会の調停委員会が示した調停案は、労働協約と同一の効力をもち、労使双方はこれに従わなければならない。","a":false,"e":"誤り。正しくは、調停案を受け入れるかどうかは当事者の自由であり、拘束力はない。労働協約と同一の効力をもち当事者を拘束するのは、仲裁委員会が下す仲裁裁定である。仲裁は原則として労使双方の申請によって始まる。"},{"t":"qa","s":"労働関係調整法","imp":1,"q":"争議行為が公益事業に関するものであったり大規模であったりして、国民経済の運行や国民の日常生活を著しく危うくするおそれがある場合に、内閣総理大臣が決定し、公表の日から50日間は争議行為が禁止される制度を何というか。","a":"緊急調整","e":"内閣総理大臣は決定にあたって中央労働委員会の意見を聴かなければならず、中央労働委員会はその事件を他の事件に優先して処理する。1952年の炭鉱労働者のストライキの際に一度発動されただけである。"},{"t":"tf","s":"労働関係調整法","imp":1,"q":"運輸・郵便・電気通信・電気・ガス・水道・医療などの公益事業で争議行為を行う場合は、少なくとも10日前までに、労働委員会と厚生労働大臣または都道府県知事に予告しなければならない。","a":true,"e":"正しい。公益事業の争議行為は国民生活への影響が大きいため、事前の予告が義務づけられている。突然の争議で国民が不利益を受けないよう、備える時間を確保するためである。"},{"t":"mc","s":"公務員の労働基本権","imp":3,"q":"日本の公務員の労働基本権についての記述として最も適当なものを一つ選べ。","c":["警察官や消防職員、自衛隊員などには、団結権・団体交渉権・争議権のいずれも認められていない。","一般職の国家公務員には、団結権・団体交渉権・争議権のすべてが制限なく認められている。","地方公務員には争議権が認められているが、国家公務員には認められていない。","公務員の争議行為を一律に禁止することについて、最高裁判所は一貫して違憲と判断している。"],"a":0,"e":"警察官・消防職員・自衛隊員・海上保安庁職員・刑事施設職員には労働三権のすべてが認められていない。一般職の公務員は団結権は認められるが、団体交渉権は労働協約を結ぶ権利がないなど制限され、争議権は国家公務員・地方公務員とも認められていない。最高裁判所は全農林警職法事件判決（1973年）で、公務員の争議行為の一律禁止を合憲と判断した。"},{"t":"qa","s":"公務員の労働基本権","imp":3,"q":"労働基本権が制限されている国家公務員の代償措置として、給与などの勤務条件の改定について国会と内閣に勧告を行う国の機関を何というか。","a":"人事院","e":"人事院が行う勧告を人事院勧告といい、民間企業の給与水準に合わせること（民間準拠）を原則とする。地方公務員については、都道府県などに置かれる人事委員会が同様の勧告を行う。"},{"t":"tf","s":"公務員の労働基本権","imp":3,"q":"一般職の国家公務員には、職員団体（労働組合）を結成する団結権も認められていない。","a":false,"e":"誤り。正しくは、一般職の国家公務員にも団結権は認められており、職員団体を結成できる。団体交渉権は労働協約を結ぶ権利がないなど制限され、争議権は認められていない。三権すべてが否定されているのは、警察官・消防職員・自衛隊員などである。"},{"t":"ex","s":"公務員の労働基本権","imp":2,"q":"公務員の労働基本権が制限されている理由と、その代償措置を説明せよ。","a":"公務員は全体の奉仕者であり、職務の公共性が高いため、争議行為で業務が止まると国民生活に大きな影響が出る。また公務員の給与などの勤務条件は、国会や地方議会が定める法律・条例や予算によって決まるため、労使の交渉だけで決めることになじまない。そこで争議権などが制限される代わりに、人事院や人事委員会が給与などの改定を勧告する制度が設けられている。","e":"ポイント：①全体の奉仕者・職務の公共性 ②勤務条件は法律・条例や予算で定められる ③代償措置としての人事院勧告・人事委員会勧告"},{"t":"qa","s":"日本的雇用慣行","imp":3,"q":"高度経済成長期に大企業を中心に定着した、日本的雇用慣行の3つの特徴を答えよ。","a":"終身雇用・年功序列型賃金・企業別労働組合","alt":["終身雇用制・年功序列型賃金・企業別労働組合","終身雇用、年功序列型賃金、企業別労働組合","終身雇用・年功賃金・企業別組合","終身雇用・年功序列賃金・企業別労働組合"],"e":"新卒で一括採用した正社員を定年まで雇用し（終身雇用）、年齢や勤続年数に応じて賃金を上げ（年功序列型賃金）、労働組合は企業ごとに正社員を中心に組織する（企業別労働組合）。労働者の生活の安定と企業への帰属意識を生み、日本経済の成長を支えたとされる。"},{"t":"tf","s":"日本的雇用慣行","imp":2,"q":"日本の労働組合は、欧米と同じく産業別・職業別に組織されるものが中心で、同じ産業で働く労働者は企業の枠をこえて一つの組合に加入している。","a":false,"e":"誤り。正しくは、日本の労働組合は企業ごとに組織される企業別労働組合が中心である。労使協調が進みやすい一方で、企業をこえた交渉力が弱く、非正規雇用の労働者が組合に加入していないことも多い。欧米では産業別・職業別の労働組合が中心である。"},{"t":"ex","s":"日本的雇用慣行","imp":2,"q":"日本的雇用慣行が労働者と企業にもたらした利点と、近年その見直しが進んでいる理由を説明せよ。","a":"終身雇用や年功序列型賃金は、労働者に雇用と生活の安定をもたらし、企業も長期的な人材育成や労働者の高い帰属意識を得られるという利点があった。しかしバブル経済の崩壊後の低成長やグローバル化による国際競争の激化、従業員の高齢化による人件費の増加などから、成果主義の導入や非正規雇用・中途採用の拡大などの見直しが進んでいる。","e":"ポイント：①雇用・生活の安定と長期的な人材育成 ②低成長・国際競争の激化・人件費の増加 ③成果主義、非正規雇用や中途採用の拡大"},{"t":"ex","s":"日本的雇用慣行","imp":2,"q":"成果主義とは何か、その長所と問題点を含めて説明せよ。","a":"成果主義とは、年齢や勤続年数ではなく、仕事の成果や業績に応じて賃金や昇進を決める考え方である。能力や意欲のある人が若くても報われやすく、人件費を業績に見合ったものにできる長所がある。一方で、成果を公正に評価することが難しく、短期的な成果ばかりが追求されたり、職場での協力や人材育成が軽視されたりするといった問題点が指摘されている。","e":"ポイント：①年功ではなく成果・業績で処遇を決める ②意欲のある人が報われる・人件費の抑制 ③評価の難しさ、短期志向、協力や人材育成の軽視"},{"t":"qa","s":"日本的雇用慣行","imp":2,"q":"あらかじめ職務の内容を明確に定め、その職務に必要な能力をもつ人を採用・配置する雇用のあり方を何というか。","a":"ジョブ型雇用","alt":["ジョブ型","ジョブ型雇用制度"],"e":"これに対し、新卒一括採用で人を採用してから仕事を割り当て、配置転換を通じて社内で育成する日本の従来の雇用のあり方をメンバーシップ型雇用という。転職市場の拡大とともに、中途採用やジョブ型雇用を取り入れる企業が増えている。"},{"t":"tf","s":"日本的雇用慣行","imp":2,"q":"日本の労働組合の推定組織率は、戦後一貫して上昇を続けており、現在では雇用者の約4割が労働組合に加入している。","a":false,"e":"誤り。正しくは、推定組織率は戦後間もない1949年の5割台をピークに長期的に低下しており、近年は16%程度と過去最低の水準にある。サービス業の拡大や非正規雇用の増加、組合に関心をもたない若者の増加などが背景にある。"},{"t":"qa","s":"非正規雇用","imp":3,"q":"パートタイマー・アルバイト・契約社員・派遣社員など、正社員以外の雇用形態で働く労働者をまとめて何というか。","a":"非正規雇用労働者","alt":["非正規雇用","非正規労働者","非正社員","非正規社員"],"e":"期間の定めのある有期契約で働く人が多く、正社員に比べて賃金が低い、雇用が不安定、教育訓練の機会が少ないといった問題がある。企業にとっては人件費を抑え、景気に応じて雇用量を調整しやすいため、1990年代以降に大きく増加した。"},{"t":"tf","s":"非正規雇用","imp":2,"q":"役員を除く雇用者に占める非正規雇用労働者の割合は、2020年代には4割近くに達しており、女性では5割を超えている。","a":true,"e":"正しい。非正規雇用の割合は1980年代半ばには2割に満たなかったが、その後上昇し、2020年代は37%前後で推移している。女性は男性に比べて非正規雇用の割合が高い。正社員を希望しながら非正規雇用で働く不本意非正規も問題となっている。"},{"t":"ex","s":"労働者派遣","imp":3,"q":"労働者派遣における派遣元（派遣会社）・派遣先・派遣労働者の三者の関係を説明せよ。","a":"派遣労働者は派遣元（派遣会社）と雇用契約を結び、賃金も派遣元から支払われる。派遣元は派遣先と労働者派遣契約を結んで労働者を派遣し、派遣労働者は派遣先の指揮命令を受けて働く。このように、労働者を雇用する者と、実際に仕事の指示をする者が分かれている点に特徴がある。","e":"ポイント：①雇用契約と賃金の支払いは派遣元 ②仕事の指揮命令は派遣先 ③派遣元と派遣先は労働者派遣契約を結ぶ（雇用と使用の分離）"},{"t":"mc","s":"労働者派遣","imp":2,"q":"労働者派遣法の歩みについての記述として最も適当なものを一つ選べ。","c":["1999年の改正で、派遣できる業務が原則として自由化され、派遣を禁止する業務を列挙する方式に改められた。","1985年の制定当初から、製造業を含むあらゆる業務へ
