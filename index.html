定、多国籍企業の規制など、途上国の利益を守る内容が中心である。"},{"t":"qa","s":"南南問題","imp":3,"q":"発展途上国の間で、資源をもつ国や工業化に成功した国と、開発の遅れた国との経済格差が広がっている問題を何というか。","a":"南南問題","e":"1970年代以降、産油国やNIEsが経済力を高める一方、資源に乏しいアフリカなどの後発発展途上国は貧困から抜け出せず、途上国の間の格差が問題となった。"},{"t":"qa","s":"南南問題","imp":2,"q":"1970年代以降、輸出向けの工業化によって急速な経済成長をとげた、韓国・台湾・香港・シンガポールなどを何というか。","a":"新興工業経済地域","alt":["NIEs","アジアNIEs","ニーズ"],"e":"台湾や香港を含むため「国」ではなく「経済地域」と呼ぶ。外国の資本や技術を取り入れ、安い労働力を生かした輸出指向型の工業化で成長した。ブラジルやメキシコなど中南米の国々を含めることもある。"},{"t":"qa","s":"南南問題","imp":2,"q":"発展途上国の中でも特に開発が遅れているとして、所得水準などの基準によって国連が認定している国々を何というか。","a":"後発発展途上国","alt":["LDC","後発開発途上国","最貧国"],"e":"多くはサハラ砂漠以南のアフリカに集中している。国連は、1人あたりの所得、保健・教育などの人的資源、経済の脆弱性という基準で認定し、基準を満たして卒業する国もある。"},{"t":"qa","s":"南南問題","imp":3,"q":"2000年代に急成長した新興国であるブラジル・ロシア・インド・中国・南アフリカの頭文字をとった呼び名を何というか。","a":"BRICS","alt":["ブリックス"],"e":"当初は南アフリカを除く4か国でBRICsと呼ばれ、2011年に南アフリカが加わった。首脳会議を開いて協力を深めている。広い国土や豊富な資源、多くの人口が成長の背景にある。"},{"t":"qa","s":"南南問題","imp":2,"q":"アジア・アフリカ・中南米などの新興国・途上国の総称で、近年、国際社会での存在感を増しているものを何というか。","a":"グローバル・サウス","alt":["グローバルサウス"],"e":"南半球の国だけでなく、北半球にあるインドなども含む。先進国とも中国・ロシアとも異なる立場をとる国が多く、国際政治・経済での発言力を強めている。"},{"t":"mc","s":"南南問題","imp":2,"q":"南南問題に関する記述として最も適当なものを一つ選べ。","c":["途上国の中で、産油国や工業化に成功した国と、後発発展途上国との間の格差が広がった","先進国の中で、工業化の進んだ国と農業中心の国との間の格差が広がった","南半球の先進国と北半球の先進国との間で、経済格差が広がった","NIEsは一次産品の輸出に依存し続けたため、後発発展途上国に分類されるようになった"],"a":0,"e":"南南問題は途上国どうしの格差の問題である。先進国どうしや、南北の先進国の間の格差をさすものではない。NIEsは輸出指向型の工業化に成功して高い成長をとげた国・地域であり、後発発展途上国とは対照的な存在である。"},{"t":"tf","s":"南南問題","imp":1,"q":"BRICSは、ブラジル・ロシア・インド・中国・南アフリカの5か国に参加国を限定しており、新たな国の参加を認めていない。","a":false,"e":"誤り。正しくは、参加国は拡大しており、2024年にはエジプト・エチオピア・イラン・アラブ首長国連邦などが加わった。新興国の発言力を高める枠組みとして、参加を希望する国も多い。"}]});</script>
<script>QDATA.push({"unit":"u24","questions":[{"t":"qa","s":"累積債務問題","imp":3,"q":"発展途上国が外国から借りた資金の返済に行き詰まり、対外債務が膨らみ続ける問題を何というか。","a":"累積債務問題","e":"1970年代、石油危機で産油国に集まった資金（オイルマネー）が先進国の銀行を通じて中南米などの途上国に貸し付けられた。1980年代にアメリカの高金利や一次産品価格の下落で返済が難しくなり、問題が表面化した。"},{"t":"qa","s":"累積債務問題","imp":2,"q":"1982年に対外債務の返済が困難になったことを表明し、累積債務問題が表面化するきっかけとなった国はどこか。","a":"メキシコ","e":"その後、ブラジルやアルゼンチンなど中南米の国々でも債務危機が続き、経済が停滞した1980年代は中南米にとって「失われた10年」と呼ばれた。"},{"t":"qa","s":"累積債務問題","imp":1,"q":"債務の返済が困難になった国に対して、債権者が返済の期限を先に延ばすことを何というか。","a":"リスケジューリング","alt":["債務繰り延べ","返済繰り延べ","リスケ"],"e":"返済額そのものを減らす債務削減や債務免除とは区別する。公的な債務については、主要な債権国の会合（パリクラブ）で繰り延べなどが話し合われる。"},{"t":"ex","s":"累積債務問題","imp":2,"q":"1980年代に中南米諸国で累積債務問題が深刻化した理由を説明せよ。","a":"1970年代、石油危機で産油国に集まったオイルマネーが、先進国の銀行を通じて変動金利で中南米などの途上国に大量に貸し付けられた。ところが1980年代初めにアメリカが高金利政策をとると利払いの負担が急増し、さらに世界的な不況で一次産品の価格が下がって輸出収入が減ったため、返済が困難になった。","e":"ポイント：①オイルマネーの途上国への大量の貸し付け ②アメリカの高金利による利払い負担の増加 ③一次産品価格の下落による輸出収入の減少 ④1982年のメキシコの債務危機"},{"t":"tf","s":"累積債務問題","imp":1,"q":"累積債務問題に対しては、返済期限の繰り延べや債務の一部の削減のほか、特に貧しい重債務国に対する債務の免除も行われてきた。","a":true,"e":"正しい。1990年代後半から重債務貧困国（HIPC）に対する債務救済の取り組みが進められ、先進国による債務免除も行われた。一方、IMFが融資の条件として求めた緊縮財政などの構造調整政策は、貧困層の生活を圧迫したとの批判もある。"},{"t":"qa","s":"貧困と開発","imp":2,"q":"世界銀行が定める国際貧困ライン（1日あたりの生活費の基準）を下回り、生きていくのに最低限必要な食料や衣服などを確保できない状態を何というか。","a":"絶対的貧困","e":"国際貧困ラインは2022年から1日2.15ドルとされていたが、2025年に物価水準の見直しにともない1日3ドルに改定された。その社会の標準的な生活水準と比べて貧しい状態を相対的貧困といい、区別する。"},{"t":"qa","s":"貧困と開発","imp":3,"q":"途上国の生産者から農産物や製品を適正な価格で継続的に購入することで、生産者の生活改善と自立を支援する取り組みを何というか。","a":"フェアトレード","alt":["フェア・トレード","公正貿易"],"e":"コーヒー・カカオ・バナナなどで広がっており、基準を満たした製品には国際フェアトレード認証ラベルが付けられる。買いたたきを防ぎ、児童労働の撤廃や環境保全にもつなげることをめざす。"},{"t":"qa","s":"貧困と開発","imp":3,"q":"担保をもたない貧しい人々に少額の資金を無担保で貸し付け、事業を始めて自立することを支援する仕組みを何というか。","a":"マイクロクレジット","alt":["マイクロ・クレジット","マイクロファイナンス","少額融資"],"e":"融資だけでなく貯蓄や保険なども含めてマイクロファイナンスということもある。バングラデシュのグラミン銀行が代表例で、借り手の多くは女性である。"},{"t":"qa","s":"貧困と開発","imp":2,"q":"バングラデシュでグラミン銀行を創設し、マイクロクレジットの普及に貢献して、2006年にノーベル平和賞を受賞した経済学者は誰か。","a":"ユヌス","alt":["ムハマド・ユヌス","ムハンマド・ユヌス"],"e":"グラミン銀行とともにノーベル平和賞を受賞した。借り手を少人数のグループにして互いに支え合う仕組みで、高い返済率を実現した。"},{"t":"qa","s":"貧困と開発","imp":2,"q":"所得階層のピラミッドの底辺にあたる世界の低所得層を対象に、その社会的な課題の解決に役立つ商品やサービスを提供して利益もあげようとするビジネスを何というか。","a":"BOPビジネス","alt":["BOP","BOP（ベース・オブ・ザ・ピラミッド）ビジネス"],"e":"BOPはBase of the Pyramidの略で、年間所得3000ドル未満の約40億人とされる。一回分ずつ小分けにした安価な日用品や、マラリアを防ぐ防虫剤入りの蚊帳の販売などの例がある。"},{"t":"qa","s":"貧困と開発","imp":3,"q":"国連開発計画（UNDP）が1990年から発表している、平均寿命・教育・1人あたり所得をもとに各国の人々の暮らしの豊かさを測る指標を何というか。","a":"人間開発指数","alt":["HDI"],"e":"GDPのような経済的な豊かさだけでなく、健康で長生きできるか、教育を受けられるかといった暮らしの質に注目する。アマルティア・センの潜在能力（ケイパビリティ）の考え方が背景にある。"},{"t":"ex","s":"貧困と開発","imp":2,"q":"人間開発指数（HDI）が、GDPとは別に作られた理由を説明せよ。","a":"GDPは経済活動の規模を測る指標であり、所得が増えても、人々が健康に長生きできるか、教育を受けられるかといった暮らしの質は十分にわからない。そこで国連開発計画は、平均寿命・教育・所得を組み合わせたHDIを作り、人々が選べる生き方の幅（潜在能力）の広がりから開発の度合いを測ろうとした。","e":"ポイント：①GDPは経済規模の指標で暮らしの質を十分に表さない ②平均寿命（健康）・教育・所得の3つの側面 ③国連開発計画が1990年から発表 ④センの潜在能力の考え方にもとづく人間中心の開発"},{"t":"mc","s":"貧困と開発","imp":3,"q":"次の事例のうち、フェアトレードにあたるものとして最も適当なものを一つ選べ。","c":["日本の小売店が、途上国のカカオ農家から生産費をまかなえる最低価格を保証して継続的にカカオを買い付け、チョコレートを販売する","日本の団体が、担保をもたない途上国の女性に少額の資金を無担保で貸し付け、小さな商売を始める手助けをする","日本の企業が、途上国の低所得層向けに、一回分ずつ小分けにした安価なシャンプーを開発して販売する","日本政府が、途上国の道路や港湾の建設のために、低い金利で長期の資金を貸し付ける"],"a":0,"e":"生産者に適正な価格を保証して継続的に買い付けるのがフェアトレードである。担保のない人への少額の無担保融資はマイクロクレジット、低所得層向けの安価な商品で社会課題の解決と利益をめざすのはBOPビジネス、低金利・長期の資金の貸し付けはODAの円借款にあたる。"},{"t":"tf","s":"貧困と開発","imp":2,"q":"マイクロクレジットは、十分な担保をもつ中小企業を対象に、大規模な資金を低い金利で貸し付ける仕組みである。","a":false,"e":"誤り。正しくは、担保をもたない貧困層を対象に、少額の資金を無担保で貸し付ける仕組みである。通常の銀行からは融資を受けられない人々の自立を支援する点に意義がある。"},{"t":"qa","s":"ODA","imp":3,"q":"先進国などの政府や政府機関が、発展途上国の経済開発や福祉の向上を目的として行う資金や技術の援助を何というか。","a":"政府開発援助","alt":["ODA"],"e":"相手国に直接行う二国間援助（贈与＝無償資金協力・技術協力、貸付＝円借款）と、国際機関への拠出・出資を通じた多国間援助がある。"},{"t":"qa","s":"ODA","imp":2,"q":"OECD（経済協力開発機構）の下部組織で、先進国による途上国援助の調整や評価を行う委員会を何というか。","a":"開発援助委員会","alt":["DAC"],"e":"日本も加盟している。加盟国のODAの実績を集計し、援助の量や質（贈与の割合など）を比較・評価している。"},{"t":"qa","s":"ODA","imp":3,"q":"国連は先進国に対し、ODAの総額をGNI（国民総所得）の何％にすることを目標として求めているか。","a":"0.7％","alt":["0.7%","0.7","0.7パーセント"],"e":"1970年の国連総会で目標とされた。スウェーデンやノルウェーなどの北欧諸国は達成しているが、日本やアメリカは大きく下回っている。"},{"t":"mc","s":"ODA","imp":3,"q":"日本のODAの特徴に関する記述として最も適当なものを一つ選べ。","c":["援助額はかつて世界一だったが、GNIに対する比率は国連の目標を大きく下回っている","すべて返済の必要がない贈与で行っており、貸付（円借款）は行っていない","援助先はアフリカが中心で、アジア向けの援助はほとんど行っていない","GNIに対する比率は1％を超えており、DAC加盟国の中で最も高い"],"a":0,"e":"日本は1989年に初めて世界一の援助国となり、1991年から2000年まで10年連続で世界一だったが、GNI比は0.7％の目標を大きく下回る。返済を必要とする円借款の割合が高く贈与の比率が低いこと、地理的・歴史的に関係の深いアジアへの援助が多いことも特徴である。"},{"t":"tf","s":"ODA","imp":3,"q":"日本は1991年から2000年まで、ODAの供与額で10年連続世界第1位であった。","a":true,"e":"正しい。日本は1989年にアメリカを抜いて初めて世界一となり、1991年から2000年まで10年連続で第1位だった。その後は財政難などで援助額が減り、順位を下げた。"},{"t":"qa","s":"ODA","imp":2,"q":"1992年に閣議決定されたODA大綱を改定し、2015年に名称を改めて定められた日本の援助の基本方針を何というか。","a":"開発協力大綱","e":"ODA大綱は、環境と開発の両立や、援助を軍事的用途に使わないことなどの原則を定めた。開発協力大綱はこれらの原則を引き継ぎつつ、国益の確保への貢献や民間との連携を打ち出した。2023年にも改定された。"},{"t":"tf","s":"ODA","imp":1,"q":"2015年に定められた開発協力大綱は、援助を軍事目的に使わないという原則を維持しつつ、相手国の軍が関わる災害救助などの非軍事目的の活動への支援も、個別に検討して行えるようにした。","a":true,"e":"正しい。軍事的用途や国際紛争の助長への使用を避ける原則は維持されたうえで、民生目的や災害救助などの非軍事目的であれば、相手国の軍が関わる活動への協力も実質的な意義に注目して個別に検討するとされた。"},{"t":"qa","s":"ODA","imp":2,"q":"日本のODAの実施機関で、技術協力・有償資金協力（円借款）・無償資金協力を一元的に行い、海外協力隊の派遣も行う独立行政法人を何というか。","a":"国際協力機構","alt":["JICA","ジャイカ"],"e":"2008年に、国際協力銀行（JBIC）が担っていた円借款の業務を統合し、援助の実施体制を一本化した。"},{"t":"ex","s":"ODA","imp":2,"q":"日本のODAの特徴を、援助の量と質の両面から説明せよ。","a":"量の面では、日本は1990年代に10年連続で世界最大の援助国となるなど、援助額は大きい。しかしGNIに対する比率は国連目標の0.7％を大きく下回っている。質の面では、返済を必要とする円借款の割合が高く贈与の比率が低いこと、地理的・歴史的に関係の深いアジア向けの援助が多いことが特徴である。","e":"ポイント：①援助額は大きく、かつて世界一 ②GNI比は0.7％を大きく下回る ③円借款の割合が高く、贈与の比率が低い ④アジア向けが中心（近年はアフリカなどへも拡大）"}]});</script>
<script>QDATA.push({"unit":"u24","questions":[{"t":"qa","s":"MDGsとSDGs","imp":2,"q":"2000年の国連ミレニアム・サミットで採択された宣言をもとにまとめられ、極度の貧困と飢餓の撲滅など、2015年までに達成すべき8つの目標を定めたものを何というか。","a":"ミレニアム開発目標","alt":["MDGs"],"e":"主に途上国の課題を対象とした。極度の貧困の割合を半減させるなどの成果をあげたが、サハラ以南のアフリカなどでは達成が遅れ、課題はSDGsに引き継がれた。"},{"t":"qa","s":"MDGsとSDGs","imp":3,"q":"2015年の国連サミットで採択された、2030年までに達成すべき17の目標と169のターゲットからなる国際目標を何というか。","a":"持続可能な開発目標","alt":["SDGs","エスディージーズ"],"e":"「持続可能な開発のための2030アジェンダ」に盛り込まれた。貧困・飢餓・教育・ジェンダー平等・気候変動・海や陸の豊かさなど、経済・社会・環境にわたる幅広い課題を扱う。"},{"t":"qa","s":"MDGsとSDGs","imp":3,"q":"SDGsが掲げる理念「誰一人（　）」の（　）に入る語を答えよ。","a":"取り残さない","e":"貧困層や障害者、女性、子どもなど、弱い立場にある人々を含め、すべての人が開発の恩恵を受けられるようにするという理念である。"},{"t":"ex","s":"MDGsとSDGs","imp":3,"q":"MDGsとSDGsの違いを説明せよ。","a":"MDGsは2000年の国連ミレニアム宣言をもとに定められた、2015年を期限とする8つの目標で、主に途上国の貧困・保健・教育などの課題を対象とした。SDGsは2015年に採択された、2030年を期限とする17の目標で、気候変動や不平等、持続可能な消費と生産なども含み、先進国を含むすべての国が取り組む普遍的な目標である。","e":"ポイント：①MDGsは2015年期限・8目標・主に途上国が対象 ②SDGsは2015年採択・2030年期限・17目標 ③SDGsは先進国も含むすべての国が対象 ④環境や不平等など対象が広がり、「誰一人取り残さない」を掲げる"},{"t":"tf","s":"MDGsとSDGs","imp":3,"q":"SDGsは発展途上国の貧困や飢餓の解決を目的としたもので、先進国は目標を達成する対象に含まれていない。","a":false,"e":"誤り。正しくは、SDGsは先進国を含むすべての国が取り組む普遍的な目標である。主に途上国を対象としたのは前身のMDGsである。"},{"t":"mc","s":"MDGsとSDGs","imp":2,"q":"SDGsに関する記述として最も適当なものを一つ選べ。","c":["政府だけでなく、企業や市民社会、個人など、さまざまな主体の取り組みが求められている","2000年に採択され、2015年までに達成すべき8つの目標を定めている","目標を達成できなかった国には、国連安全保障理事会が経済制裁を科すことになっている","気候変動などの環境問題は対象外で、貧困と教育に限った目標である"],"a":0,"e":"SDGsは政府だけでなく企業・市民社会・個人など多様な主体の参加を求めている。2000年採択・2015年期限・8目標はMDGsの説明である。SDGsに法的な拘束力はなく、未達成に対する制裁の仕組みもない。気候変動（目標13）や海・陸の生態系なども対象に含まれる。"},{"t":"qa","s":"人口問題と食料問題","imp":2,"q":"第二次世界大戦後、発展途上国で医療や衛生の改善によって死亡率が下がる一方、出生率が高いままであったために起きた急激な人口増加を何というか。","a":"人口爆発","e":"多産多死から多産少死へ移行したことで人口が急増した。人口の急増は食料不足や貧困、環境破壊などの原因となる。一方、先進国では少子高齢化が課題となっている。"},{"t":"tf","s":"人口問題と食料問題","imp":2,"q":"国連の推計によると、世界の人口は2022年に80億人に達し、2023年にはインドが中国を抜いて世界で最も人口の多い国になった。","a":true,"e":"正しい。世界人口は1987年に50億人、1999年に60億人、2011年に70億人に達した。現在の人口増加の中心はアフリカやアジアの途上国である。"},{"t":"qa","s":"人口問題と食料問題","imp":2,"q":"本来はまだ食べられるのに廃棄されてしまう食品を何というか。","a":"食品ロス","alt":["フードロス"],"e":"世界では生産された食料の約3分の1が失われたり捨てられたりしているとされる（FAO）。日本でも年間約500万トン前後発生しており（2020年代の推計）、2019年には食品ロス削減推進法が制定された。"},{"t":"ex","s":"人口問題と食料問題","imp":2,"q":"世界の食料問題で、飢餓と飽食が同時に存在するといわれる理由を説明せよ。","a":"世界全体では、すべての人を養えるだけの食料が生産されているが、その分配がかたよっている。先進国では食料が大量に消費され、多くが廃棄される一方、途上国では貧困のために食料を十分に買えない人々や、紛争・干ばつで食料を得られない人々が多い。さらに穀物が家畜の飼料やバイオ燃料にも回されていることも、かたよりを生む一因である。","e":"ポイント：①食料の総量は足りているが分配がかたよる ②先進国の大量消費・大量廃棄（食品ロス） ③途上国の貧困・紛争・干ばつによる飢餓（約7億人前後、2020年代） ④穀物の飼料やバイオ燃料への利用"},{"t":"mc","s":"人口問題と食料問題","imp":2,"q":"世界の人口問題・食料問題に関する記述として最も適当なものを一つ選べ。","c":["途上国では、子どもが家計を支える労働力となることや乳幼児の死亡率が高いことなどから、出生率が高くなりやすい","現在の世界人口の増加は、主に先進国の出生率の上昇によってもたらされている","世界で生産される食料は全人口の必要量の半分にも満たないため、飢餓が生じている","先進国の多くでは人口爆発が続き、人口が急増している"],"a":0,"e":"途上国では、子どもが労働力や老後の支えとなることや、乳幼児の死亡率が高いことなどから、多くの子どもをもつ傾向がある。人口増加の中心は先進国ではなく途上国であり、先進国の多くはむしろ少子高齢化や人口減少に直面している。飢餓の主な原因は、食料の絶対量の不足よりも分配のかたよりや貧困である。"},{"t":"qa","s":"地球環境問題","imp":3,"q":"大気中の二酸化炭素やメタンなどが増え、地表から放出される熱がとどめられることで、地球の平均気温が上昇する現象を何というか。","a":"地球温暖化","alt":["温暖化"],"e":"熱をとどめる気体を温室効果ガスといい、化石燃料の燃焼や森林の減少による二酸化炭素の増加が主な原因とされる。海面の上昇による島国の水没の危機、異常気象、生態系の変化などが心配されている。"},{"t":"qa","s":"地球環境問題","imp":3,"q":"冷蔵庫やエアコンの冷媒、スプレーなどに使われ、成層圏のオゾン層を破壊する原因となった化学物質を何というか。","a":"フロン","alt":["フロンガス","特定フロン","クロロフルオロカーボン","CFC"],"e":"オゾン層が破壊されると有害な紫外線が地表に多く届き、皮膚がんや白内障が増えるおそれがある。南極上空では、オゾン層が極端に薄くなるオゾンホールが観測されている。"},{"t":"qa","s":"地球環境問題","imp":2,"q":"化石燃料の燃焼で出る硫黄酸化物や窒素酸化物が大気中で変化して溶け込み、森林の枯死や湖沼の生物の死滅などを引き起こす雨を何というか。","a":"酸性雨","e":"汚染物質は風に乗って国境を越えるため、発生源の国以外にも被害が広がる（越境汚染）。ヨーロッパでは1979年に長距離越境大気汚染条約が結ばれた。"},{"t":"ex","s":"地球環境問題","imp":2,"q":"アフリカのサヘル地域などで砂漠化が進んでいる原因を説明せよ。","a":"サハラ砂漠の南縁にあたるサヘル地域では、人口の増加にともなって、家畜の過放牧、農地の過耕作、燃料にするための樹木の過剰な伐採が進み、植物が失われて土地が荒れている。こうした人為的な原因に干ばつなどの気候的な原因が重なり、土地が不毛になる砂漠化が進んでいる。","e":"ポイント：①人口の増加 ②過放牧・過耕作・薪炭材の過剰な伐採（人為的な原因） ③干ばつなどの気候的な原因 ④1994年に砂漠化対処条約が採択された"},{"t":"ex","s":"地球環境問題","imp":2,"q":"熱帯林が減少している原因と、その減少がもたらす問題を説明せよ。","a":"アマゾンや東南アジアなどの熱帯林は、農地や牧場への転換、油やしなどのプランテーションの開発、商業的な木材の伐採、焼畑の拡大などによって減少している。熱帯林は多くの生物のすみかであるため生物多様性が失われるほか、二酸化炭素の吸収源が減って地球温暖化を進めることにもなる。","e":"ポイント：①農地・牧場・プランテーションへの転換 ②商業伐採や焼畑の拡大 ③生物多様性の喪失 ④二酸化炭素の吸収源の減少による温暖化の促進"},{"t":"qa","s":"地球環境問題","imp":2,"q":"海に流れ出たプラスチックごみが紫外線や波の力で細かく砕かれるなどしてできた、大きさ5mm以下のプラスチックを何というか。","a":"マイクロプラスチック","e":"魚などの生物が取り込み、食物連鎖を通じて生態系や人の健康に影響するおそれがある。2019年のG20大阪サミットでは、2050年までに海洋プラスチックごみによる追加的な汚染をゼロにする「大阪ブルー・オーシャン・ビジョン」が共有された。"},{"t":"mc","s":"地球環境問題","imp":3,"q":"地球環境問題とその主な原因の組み合わせとして最も適当なものを一つ選べ。","c":["オゾン層の破壊 ― フロンの放出","酸性雨 ― 森林の減少による二酸化炭素の吸収量の低下","砂漠化 ― 冷蔵庫やエアコンからのフロンの放出","地球温暖化 ― 硫黄酸化物や窒素酸化物が溶け込んだ雨"],"a":0,"e":"オゾン層の破壊の主な原因はフロンである。酸性雨の原因は硫黄酸化物や窒素酸化物であり、森林の減少による二酸化炭素の吸収量の低下は地球温暖化の原因である。砂漠化の主な原因は過放牧・過耕作・樹木の過剰な伐採や干ばつである。原因と結果の取り違えは共テの典型的なひっかけである。"},{"t":"tf","s":"地球環境問題","imp":2,"q":"酸性雨の被害は、原因となる汚染物質を排出した国の内部にとどまるため、各国がそれぞれ国内で対策をとれば十分である。","a":false,"e":"誤り。汚染物質は風に乗って国境を越えて運ばれるため、排出国以外にも被害が及ぶ（越境汚染）。正しくは「国境を越えて被害が広がるため、国際的な協力が必要である」。"},{"t":"tf","s":"地球環境問題","imp":2,"q":"オゾン層を破壊しない代替フロンとして普及したハイドロフルオロカーボン（HFC）は強い温室効果をもつため、2016年に国際的な削減の対象に加えられた。","a":true,"e":"正しい。2016年のモントリオール議定書のキガリ改正で、HFCの生産と消費を段階的に削減することが決まった。オゾン層の保護と温暖化対策が互いに関係していることを示す例である。"},{"t":"tf","s":"地球環境問題","imp":1,"q":"生物多様性とは生物の種類の多さだけをさす言葉であり、同じ種の中の遺伝子の違いや生態系の多様さは含まない。","a":false,"e":"誤り。正しくは、生物多様性には生態系の多様性、種の多様性、遺伝子（種内）の多様性という3つのレベルが含まれ、生物多様性条約もこの3つで多様性をとらえている。生物多様性は、開発や乱獲、外来種の持ち込み、気候変動などによって失われつつある。"}]});</script>
<script>QDATA.push({"unit":"u24","questions":[{"t":"qa","s":"環境問題への国際協力","imp":3,"q":"1972年にスウェーデンのストックホルムで開かれ、「かけがえのない地球」をスローガンとして人間環境宣言を採択した、環境問題に関する初めての大規模な国際会議を何というか。","a":"国連人間環境会議","alt":["人間環境会議","ストックホルム会議"],"e":"この会議をきっかけに、同年、環境問題を専門に扱う国連環境計画（UNEP）が設立された。先進国が公害対策を重視したのに対し、途上国は貧困の解決と開発を優先すべきだと主張し、立場の違いも表面化した。"},{"t":"qa","s":"環境問題への国際協力","imp":2,"q":"国連人間環境会議の決議にもとづいて1972年に設立され、ケニアのナイロビに本部を置く、環境問題を専門に扱う国連の機関を何というか。","a":"国連環境計画","alt":["UNEP","ユネップ"],"e":"国連の環境に関する活動を調整する役割を担う。気候変動を科学的に評価するIPCCは、UNEPと世界気象機関（WMO）が共同で設立した組織である。"},{"t":"qa","s":"環境問題への国際協力","imp":2,"q":"1972年に発表され、人口増加や環境汚染、資源の消費がこのまま続けば、100年以内に地球上の成長は限界に達すると警告したローマ・クラブの報告書は何か。","a":"成長の限界","alt":["『成長の限界』"],"e":"ローマ・クラブは、科学者や経済人などでつくる民間の研究組織である。資源や環境の有限性を示し、経済成長のあり方を見直すきっかけとなった。国連人間環境会議と同じ1972年である点も押さえておく。"},{"t":"qa","s":"環境問題への国際協力","imp":3,"q":"国連の「環境と開発に関する世界委員会」（ブルントラント委員会）が1987年の報告書で提唱した、「将来の世代の必要を満たす能力を損なうことなく、現在の世代の必要を満たす開発」を何というか。","a":"持続可能な開発","alt":["持続可能な発展","サステナブル・ディベロップメント"],"e":"報告書の題名は『われら共有の未来（Our Common Future）』。環境の保全と開発を対立するものではなく両立すべきものととらえ、1992年の地球サミットの基本理念となった。委員長はノルウェーのブルントラントである。"},{"t":"qa","s":"環境問題への国際協力","imp":3,"q":"1992年にブラジルのリオデジャネイロで開かれ、「持続可能な開発」を基本理念として、リオ宣言やアジェンダ21を採択した国連の会議を何というか。","a":"国連環境開発会議","alt":["地球サミット","UNCED","環境と開発に関する国際連合会議"],"e":"リオ宣言は環境と開発に関する27の原則で、先進国と途上国の「共通だが差異ある責任」や予防的な取り組みなどを示した。アジェンダ21はその具体的な行動計画である。この会議で気候変動枠組条約と生物多様性条約の署名も始まった。"},{"t":"mc","s":"環境問題への国際協力","imp":2,"q":"1992年の国連環境開発会議（地球サミット）に関する記述として最も適当なものを一つ選べ。","c":["気候変動枠組条約と生物多様性条約の署名が始まり、多くの国が署名した","先進国に温室効果ガスの削減を義務づける京都議定書が採択された","「かけがえのない地球」をスローガンとし、人間環境宣言が採択された","ローマ・クラブが報告書『成長の限界』を発表し、資源の有限性を警告した"],"a":0,"e":"地球サミットでは、リオ宣言・アジェンダ21・森林原則声明が採択され、気候変動枠組条約と生物多様性条約の署名が始まった。京都議定書は1997年のCOP3、「かけがえのない地球」と人間環境宣言は1972年の国連人間環境会議、『成長の限界』は1972年のローマ・クラブの報告書である。"},{"t":"mc","s":"環境問題への国際協力","imp":1,"q":"環境問題に関する次の国際的な出来事を古い順に並べたとき、2番目にくるものとして正しいものを一つ選べ。","c":["ブルントラント委員会が報告書で「持続可能な開発」を提唱した","ストックホルムで国連人間環境会議が開かれた","リオデジャネイロで国連環境開発会議（地球サミット）が開かれた","ヨハネスブルグで持続可能な開発に関する世界首脳会議（環境開発サミット）が開かれた"],"a":0,"e":"国連人間環境会議（1972年）→ブルントラント委員会の報告（1987年）→地球サミット（1992年）→環境開発サミット（2002年）の順である。環境開発サミットは南アフリカのヨハネスブルグで開かれ、地球サミットから10年間の取り組みを検証し、アジェンダ21の実施を進める計画を採択した。"},{"t":"qa","s":"気候変動対策","imp":3,"q":"1992年に採択され、大気中の温室効果ガスの濃度を安定させることを目的として、締約国会議（COP）を毎年開いている条約を何というか。","a":"気候変動枠組条約","alt":["国連気候変動枠組条約","気候変動に関する国際連合枠組条約","UNFCCC"],"e":"1994年に発効した。条約自体には具体的な削減の数値目標はなく、締約国会議で京都議定書（COP3）やパリ協定（COP21）が採択された。先進国と途上国の「共通だが差異ある責任」の考え方が示されている。"},{"t":"qa","s":"気候変動対策","imp":3,"q":"1997年に京都で開かれたCOP3で採択され、先進国に温室効果ガスの排出削減を数値目標として義務づけた取り決めを何というか。","a":"京都議定書","e":"2008〜2012年の平均排出量を、1990年に比べて先進国全体で少なくとも5％（日本6％、アメリカ7％、EU8％）削減することを定め、2005年に発効した。中国やインドなどの途上国には削減義務がなかった。"},{"t":"mc","s":"気候変動対策","imp":1,"q":"京都議定書で導入された京都メカニズムのうち、クリーン開発メカニズム（CDM）にあたる事例として最も適当なものを一つ選べ。","c":["日本の企業が途上国で省エネルギー設備を導入する事業を行い、その削減分を日本の削減量に算入する","日本が、削減目標を超えて削減した他の先進国から、余った排出枠を買い取る","日本の企業が他の先進国と共同で削減事業を行い、その削減分を両国で分け合う","日本が、国内で使われる化石燃料に、含まれる炭素の量に応じて課税する"],"a":0,"e":"CDMは、先進国が途上国で温室効果ガスを減らす事業を行い、その削減分を自国の削減に算入できる仕組みである。他国の余った排出枠を買い取るのは排出量取引、先進国どうしが共同で事業を行って削減分を分け合うのは共同実施で、この3つを京都メカニズムという。化石燃料への課税は炭素税であり、京都メカニズムではない。"},{"t":"tf","s":"気候変動対策","imp":2,"q":"アメリカは京都議定書に署名したものの、2001年にブッシュ政権が離脱を表明し、議定書を批准しなかった。","a":true,"e":"正しい。途上国に削減義務がないことや自国経済への悪影響を理由とした。当時世界最大の排出国だったアメリカが参加せず、中国などの途上国にも削減義務がなかったことが、京都議定書の大きな限界とされた。"},{"t":"qa","s":"気候変動対策","imp":3,"q":"2015年のCOP21で採択され、途上国を含むすべての締約国が温室効果ガスの削減目標を作成・提出することを定めた、2020年以降の温暖化対策の国際的な枠組みを何というか。","a":"パリ協定","e":"世界の平均気温の上昇を産業革命前に比べて2℃より十分低く保ち、1.5℃に抑える努力を追求することを目的とする。今世紀後半に温室効果ガスの排出と吸収の均衡（実質ゼロ）をめざす。2016年に発効した。"},{"t":"ex","s":"気候変動対策","imp":3,"q":"京都議定書とパリ協定の違いを説明せよ。","a":"京都議定書は先進国だけに温室効果ガスの削減を義務づけ、国ごとの削減目標を定めて、その達成を法的な義務とした。これに対しパリ協定は、途上国を含むすべての締約国が自ら削減目標を決めて提出し、5年ごとに更新する仕組みであり、目標の提出や国内対策の実施は義務だが、目標の達成そのものは義務とされていない。","e":"ポイント：①京都議定書は先進国のみに削減義務 ②京都議定書は目標の達成が法的義務 ③パリ協定はすべての締約国が目標を自ら決めて提出し、5年ごとに更新 ④パリ協定は目標の達成自体は義務ではない"},{"t":"tf","s":"気候変動対策","imp":3,"q":"パリ協定では、各国が提出した温室効果ガスの削減目標を達成することが法的に義務づけられており、達成できない国には罰則が科される。","a":false,"e":"誤り。パリ協定では、削減目標の作成・提出とその達成に向けた国内対策の実施は義務だが、目標の達成そのものは義務ではなく、罰則もない。正しくは「目標の達成自体は義務ではない」。代わりに、5年ごとに目標を更新し、世界全体の進み具合を確認する（グローバル・ストックテイク）仕組みがある。"},{"t":"mc","s":"気候変動対策","imp":2,"q":"アメリカとパリ協定の関係に関する記述として最も適当なものを一つ選べ。","c":["トランプ政権のもとで2020年に離脱し、バイデン政権のもとで2021年に復帰したが、第2次トランプ政権が再び離脱を表明し、2026年に離脱した","アメリカは採択当初からパリ協定に参加しておらず、一度も締約国になったことがない","アメリカはオバマ政権のもとでパリ協定の採択に反対し、署名を拒否した","アメリカは一度離脱したのち2021年に復帰し、それ以降は離脱することなく締約国であり続けている"],"a":0,"e":"アメリカはオバマ政権のもとでパリ協定を締結したが、トランプ政権が2017年に離脱を表明し、2020年11月に正式に離脱した。バイデン政権は就任直後に復帰を決め、2021年2月に復帰した。2025年に発足した第2次トランプ政権が再び離脱を表明し、2026年1月に離脱が発効した。"},{"t":"qa","s":"気候変動対策","imp":2,"q":"1988年に世界気象機関（WMO）と国連環境計画（UNEP）が設立し、地球温暖化に関する科学的な知見を評価して報告書にまとめている組織を何というか。","a":"気候変動に関する政府間パネル","alt":["IPCC"],"e":"2007年にアメリカの元副大統領ゴアとともにノーベル平和賞を受賞した。2021〜2023年に公表された第6次評価報告書は、人間の影響が温暖化を引き起こしてきたことには「疑う余地がない」とした。"},{"t":"qa","s":"気候変動対策","imp":3,"q":"温室効果ガスの排出量から、森林などによる吸収量を差し引いて、実質的にゼロにすることを何というか。","a":"カーボンニュートラル","alt":["カーボン・ニュートラル","ネットゼロ","温室効果ガス排出実質ゼロ"],"e":"日本は2020年に「2050年カーボンニュートラル」の実現を宣言した。その後、2025年には温室効果ガスを2035年度に60％、2040年度に73％削減する（2013年度比）という目標も示した。"},{"t":"tf","s":"気候変動対策","imp":2,"q":"日本は、2030年度の温室効果ガスの排出量を、2013年度に比べて46％削減するという目標を掲げている。","a":true,"e":"正しい。2021年に目標を26％から46％に引き上げ、さらに50％の高みに向けて挑戦を続けるとした。基準年が京都議定書の1990年ではなく2013年度である点に注意する。"},{"t":"ex","s":"気候変動対策","imp":2,"q":"温暖化対策の手法である排出量取引と炭素税の違いを説明せよ。","a":"排出量取引は、政府が企業などに温室効果ガスの排出枠を割り当て、枠より多く削減した企業が余った枠を、枠を超えて排出する企業に売ることを認める制度で、排出の総量を管理できる。炭素税は、化石燃料に含まれる炭素の量に応じて課税する制度で、排出に費用をかけて削減を促す。どちらも排出に価格をつけるカーボンプライシングの手法である。","e":"ポイント：①排出量取引は排出枠を割り当てて売買し、総量を管理する ②炭素税は炭素の量に応じて化石燃料に課税し、価格を通じて削減を促す ③どちらもカーボンプライシング ④日本は2012年から地球温暖化対策のための税を導入"}]});</script>
<script>QDATA.push({"unit":"u24","questions":[{"t":"qa","s":"環境に関する条約","imp":3,"q":"1985年のウィーン条約にもとづいて1987年に採択され、オゾン層を破壊するフロンなどの生産・消費を段階的に削減し全廃することを定めた取り決めを何というか。","a":"モントリオール議定書","alt":["オゾン層を破壊する物質に関するモントリオール議定書"],"e":"先進国では特定フロンの生産が1995年末までに全廃された。国際的な環境条約の成功例とされ、オゾン層は回復に向かっている。条約が枠組みを定め、議定書で具体的な規制を定める形は、気候変動枠組条約と京都議定書の関係と同じである。"},{"t":"qa","s":"環境に関する条約","imp":2,"q":"1971年にイランで採択された、特に水鳥の生息地として国際的に重要な湿地を保全するための条約を何というか。","a":"ラムサール条約","e":"日本は1980年に加入し、釧路湿原が最初の登録地となった。湿地の保全とともに、その「賢明な利用（ワイズユース）」をめざしている。"},{"t":"qa","s":"環境に関する条約","imp":2,"q":"1973年に採択された、絶滅のおそれのある野生動植物の種の国際的な取引を規制する条約を何というか。","a":"ワシントン条約","alt":["CITES","サイテス","絶滅のおそれのある野生動植物の種の国際取引に関する条約"],"e":"象牙やトラの毛皮などの取引が規制されている。国際的な「取引」の規制が目的であり、生息地である湿地の保全を目的とするラムサール条約と区別する。"},{"t":"qa","s":"環境に関する条約","imp":2,"q":"1989年に採択された、有害廃棄物の国境を越える移動とその処分を規制する条約を何というか。","a":"バーゼル条約","e":"先進国の有害廃棄物が途上国に持ち込まれ、不適切に処分される問題をきっかけに結ばれた。2019年の改正で、リサイクルに適さない汚れたプラスチックごみも規制の対象に加えられた。"},{"t":"mc","s":"環境に関する条約","imp":2,"q":"環境に関する条約とその内容の組み合わせとして最も適当なものを一つ選べ。","c":["生物多様性条約 ― 生物多様性の保全や、遺伝資源の利用から生じる利益の公正な配分などを目的とする","ワシントン条約 ― 水鳥の生息地として国際的に重要な湿地を保全する","バーゼル条約 ― 絶滅のおそれのある野生動植物の国際的な取引を規制する","ラムサール条約 ― 有害廃棄物の国境を越える移動を規制する"],"a":0,"e":"生物多様性条約は1992年の地球サミットで署名が始まり、生物多様性の保全、その持続可能な利用、遺伝資源の利用から生じる利益の公正な配分を目的とする。湿地の保全はラムサール条約、野生動植物の国際取引の規制はワシントン条約、有害廃棄物の越境移動の規制はバーゼル条約である。"},{"t":"mc","s":"環境に関する条約","imp":1,"q":"生物多様性条約にもとづく取り決めに関する記述として最も適当なものを一つ選べ。","c":["名古屋議定書は、遺伝資源を利用して得られた利益を、資源の提供国と公正に分け合うためのルールを定めた","カルタヘナ議定書は、オゾン層を破壊する物質の生産と消費を段階的に削減することを定めた","名古屋議定書は、先進国に温室効果ガスの排出削減を義務づけた","カルタヘナ議定書は、水銀の採掘から廃棄までを国際的に規制することを定めた"],"a":0,"e":"名古屋議定書は2010年に名古屋で開かれた生物多様性条約のCOP10で採択され、遺伝資源の取得と利益配分のルールを定めた。カルタヘナ議定書（2000年採択）は、遺伝子組み換え生物の国境を越える移動について、輸入国の事前の同意などの手続きを定めたものである。オゾン層破壊物質の削減はモントリオール議定書、先進国の温室効果ガス削減義務は京都議定書、水銀の規制は水俣条約の内容である。"},{"t":"qa","s":"環境に関する条約","imp":1,"q":"水俣病の教訓をふまえ、2013年に熊本で開かれた外交会議で採択された、水銀の採掘から使用・廃棄までを国際的に規制する条約を何というか。","a":"水銀に関する水俣条約","alt":["水俣条約"],"e":"2017年に発効した。水銀を使った製品の製造や輸出入、水銀の大気への排出なども規制している。"},{"t":"tf","s":"環境に関する条約","imp":1,"q":"砂漠化対処条約は、深刻な干ばつや砂漠化に直面する国、特にアフリカの国々を支援するために、1994年に採択された。","a":true,"e":"正しい。1992年の地球サミットで交渉の開始が求められ、1994年に採択された（1996年発効）。先進国による資金や技術の支援なども定めている。"},{"t":"tf","s":"環境に関する条約","imp":1,"q":"世界遺産条約は、国連環境計画（UNEP）が中心となって採択したもので、自然遺産だけを保護の対象とし、文化遺産は対象としていない。","a":false,"e":"誤り。正しくは、世界遺産条約は1972年にユネスコ（国連教育科学文化機関）の総会で採択され、文化遺産と自然遺産の両方を人類共通の遺産として保護する。日本は1992年に締結し、屋久島・白神山地・知床・小笠原諸島などが自然遺産に登録されている。"},{"t":"qa","s":"環境思想","imp":2,"q":"地球を、限られた資源のなかで乗組員全員が生きていかなければならない宇宙船にたとえ、資源の有限性と環境保全の必要性を説いた考え方を何というか。","a":"宇宙船地球号","e":"アメリカの経済学者ボールディングらが唱えた。資源を無限にあるかのように使い捨てる「カウボーイの経済」から、資源を循環させる「宇宙飛行士の経済」への転換を説いた。"},{"t":"qa","s":"環境思想","imp":3,"q":"誰もが自由に利用できる共有の牧草地で、各人が自分の利益のために飼う家畜を増やすと、牧草地が荒れて全員が損をしてしまうというたとえを何というか。","a":"共有地の悲劇","alt":["コモンズの悲劇"],"e":"アメリカの生物学者ハーディンが1968年に示した。大気や海洋など、誰のものでもない地球環境の問題にあてはまり、国際的なルールや協力の必要性を説明する際に用いられる。"},{"t":"mc","s":"環境思想","imp":2,"q":"次の事例のうち、「共有地の悲劇」の考え方で説明できるものとして最も適当なものを一つ選べ。","c":["どの国も自由に漁業を行える公海で、各国の漁船が競って魚をとった結果、資源が枯渇して漁業全体が衰退した","ある企業が独自の技術を特許で保護したため、他の企業がその技術を自由に使えなくなった","政府が河川の水質基準を定めて工場の排水を厳しく規制した結果、川の水質が改善した","ある国が国内の森林を国有林として管理し、計画的に伐採と植林を行った"],"a":0,"e":"誰もが自由に利用できる公海の水産資源を各国が自国の利益のために取り合い、資源が枯渇して全員が損をするのは、共有地の悲劇の典型である。特許による技術の保護は知的財産権の問題、排水規制による水質の改善は規制による解決の例、国有林の計画的な管理は管理の主体が明確な例であり、いずれも共有地の悲劇にはあたらない。"},{"t":"qa","s":"環境思想","imp":3,"q":"環境に深刻な、または取り返しのつかない被害が生じるおそれがある場合には、科学的に十分に確実でないことを理由に対策を先延ばしにしてはならないという考え方を何というか。","a":"予防原則","alt":["予防的アプローチ","予防的取り組み","予防的方策"],"e":"1992年のリオ宣言（第15原則）にも盛り込まれた。地球温暖化のように、因果関係が完全に証明されるのを待っていては手遅れになるおそれがある問題で重視される。"},{"t":"ex","s":"環境思想","imp":2,"q":"環境問題を考えるうえで、世代間倫理が重視される理由を説明せよ。","a":"世代間倫理とは、現在の世代は将来の世代の生存や生活の可能性に対して責任を負うという考え方である。資源の使い過ぎや環境破壊の影響は長い時間をかけて将来に及ぶが、まだ生まれていない将来の世代は、現在の決定に参加することも反対の声をあげることもできない。そのため、現在の世代が自らの行動を制約してでも、良好な環境を将来に引き継ぐ責任があると考えられている。","e":"ポイント：①現在の世代は将来の世代に対して責任を負う ②環境破壊の影響は将来に及ぶ ③将来の世代は現在の意思決定に参加できない ④「持続可能な開発」の考え方と結びつく"},{"t":"ex","s":"環境思想","imp":2,"q":"地球環境問題の解決に国際的な協力が必要とされる理由を、「共有地の悲劇」の考え方を用いて説明せよ。","a":"大気や海洋などの地球環境は、どの国も自由に利用できる共有の資源である。各国が自国の利益だけを考えて温室効果ガスなどを排出し続けると、地球環境が悪化して、結局はすべての国が損害を受ける。一国だけが対策をとっても他国が排出を続ければ効果は小さいため、条約などの国際的なルールをつくり、各国が協力して対策を進める必要がある。","e":"ポイント：①地球環境は誰もが利用できる共有の資源 ②各国が自国の利益を優先すると環境が悪化し全員が損をする ③一国だけの対策では効果が小さい（他国の努力へのただ乗りの問題） ④条約などの国際的なルールと協力が必要"}]});</script>

const inScope = q => q.imp >= 2 || Store.prefs.star1;

}

    if (tier.imp === 1 && !Store.prefs.star1) continue;

}

  for (let k = 0; k < 7; k++) { const L = Store.log[addD(t, -k)]; if (!L) continue; n += L[0]; s += L[4]; e += L[2] * 34 + L[3] * 16; }

/* ---------- pools & sessions ---------- */
function buildPool(p) {
  const units = new Set(p.units), types = new Set(p.types), minImp = +p.imp || 1, t = today();
  return Q.filter(q => {
    if (!units.has(q.u) || !types.has(q.t) || q.imp < minImp) return false;
    if (p.target === 'all') return true;
    if (p.target === 'new') return boxOf(q.id) === 0;
    if (p.target === 'ng') return boxOf(q.id) === 1;
    if (p.target === 'due') { const s = srs(q.id); return !!s && s.due <= t; }
    if (p.target === 'mark') return Store.marked(q.id);
    return true;
  });
}
function orderPool(pool, order) {
  if (order === 'random') return shuffle(pool.slice());
  if (order === 'seq') return pool.slice().sort((a, b) => a.n - b.n);
  const t = today(), due = [], nw = [], rest = [];
  for (const q of pool) { const s = srs(q.id); (!s ? nw : s.due <= t ? due : rest).push(q); }
  const key = q => { const s = srs(q.id); return s ? s.due * 10 + s.box : 0; };
  due.sort((a, b) => key(a) - key(b)); nw.sort((a, b) => b.imp - a.imp || a.n - b.n); rest.sort((a, b) => key(a) - key(b));
  return due.concat(nw, rest);
}
function startSession(ids, label) {
  ids = ids.filter(id => QBY.has(id));
  if (!ids.length) { toast('出題できる問題がありません'); return; }
  S = { ids, i: 0, res: [], label: label || '', re: [] };
  LS.set(K_SESSION, S);
  show('quiz'); renderQuestion();
}
function startWith(opts, label) {
  const p = Object.assign({}, Store.prefs, opts);
  const pool = orderPool(buildPool(p), p.order);
  startSession(pool.slice(0, p.count || pool.length).map(q => q.id), label);
}
function todaySession(mode) {
  const p = todayPlan(), noEx = q => q.t !== 'ex';
  let list;
  if (mode === 'ng') list = Q.filter(q => lvOf(q.id) === 1).sort((a, b) => srs(a.id).due - srs(b.id).due || a.n - b.n).slice(0, Store.prefs.chunk);
  else {
    let r = p.reviews, n = p.news;
    if (mode === 'quick') { r = r.filter(noEx); n = n.filter(noEx); }
    list = interleave(r, n).slice(0, mode === 'quick' ? 10 : Store.prefs.chunk);
    if (!list.length) {
      const more = p.due.concat(p.nq).filter(q => mode !== 'quick' || noEx(q));
      list = more.slice(0, 10);
    }
  }
  startSession(list.map(q => q.id), mode === 'quick' ? 'スキマ用' : mode === 'ng' ? '×だけ' : '今日の分');
}
function unitSession(u) {
  const t = today(), inU = q => q.u === u;
  let list = dueList(t, inU).concat(BYUNIT[u].filter(q => !Store.prog[q.id] && inScope(q)), BYUNIT[u].filter(q => !Store.prog[q.id] && !inScope(q)));
  if (!list.length) list = BYUNIT[u].slice().sort((a, b) => srs(a.id).box - srs(b.id).box || srs(a.id).due - srs(b.id).due);
  startSession(list.slice(0, Store.prefs.chunk).map(q => q.id), UNIT_INFO[u][0]);
}
function resume() {
  const s = LS.get(K_SESSION);
  if (!s || !Array.isArray(s.ids) || (s.i >= s.ids.length && !freshLook(s))) { refreshHome(); return; }
  S = { ids: s.ids, i: s.i | 0, res: Array.isArray(s.res) ? s.res : [], label: s.label || '', re: Array.isArray(s.re) ? s.re : [] };
  show('quiz');
  if (freshLook(s)) restoreLook(s.look); else renderQuestion();
}
function renderQuestion() {
  if (S) delete S.look;
  while (S.i < S.ids.length && !QBY.has(S.ids[S.i])) S.i++;
  if (S.i >= S.ids.length) { finish(); return; }
  const q = QBY.get(S.ids[S.i]);
  cur = { q, n: S.i + 1, phase: 'ask', perm: q.t === 'mc' ? shuffle([0, 1, 2, 3]) : null, picked: null, ok: null, typed: '', matched: false,
    t0: Date.now(), typing: Store.prefs.typing, again: S.res.some(r => r.id === q.id), grade: null, info: null, undo: null, fluke: false };
  drawQuiz();
  if (!gallery) window.scrollTo(0, 0);
  if (q.t === 'qa' && cur.typing && window.matchMedia && window.matchMedia('(pointer: fine)').matches) { const inp = $('#ans-in'); if (inp) inp.focus({ preventScroll: true }); }
}
function commit(grade) {
  const id = cur.q.id, t = today();
  cur.undo = { rec: Store.prog[id] ? Store.prog[id].slice() : null, day: t, log: Store.log[t] ? Store.log[t].slice() : null };
  cur.grade = grade; cur.ok = grade !== 'ng';
  cur.info = Store.record(id, grade, (Date.now() - cur.t0) / 1000);
  S.res.push({ id, ok: cur.ok, g: grade, b: cur.info.box });
  S.i = cur.n;
  if (grade === 'ng' && !S.re.includes(id)) { S.re.push(id); S.ids.splice(Math.min(S.ids.length, S.i + 4), 0, id); }
  if (S.i < S.ids.length) LS.set(K_SESSION, S); else LS.del(K_SESSION);
}
function markFluke() {
  if (!cur || cur.phase !== 'done' || cur.grade !== 'ok' || cur.fluke) return;
  const id = cur.q.id, u = cur.undo;
  Store.restore(id, u.rec, u.day, u.log);
  cur.info = Store.record(id, 'meh', (Date.now() - cur.t0) / 1000);
  cur.grade = 'meh'; cur.fluke = true;
  const last = S.res[S.res.length - 1]; if (last && last.id === id) { last.g = 'meh'; last.b = cur.info.box; }
  LS.set(K_SESSION, S);
  drawQuiz();
}

}

}
function reveal() {
  if (!cur || cur.phase !== 'ask' || (cur.q.t !== 'qa' && cur.q.t !== 'ex')) return;
  const inp = $('#ans-in');
  cur.typed = inp ? inp.value.trim() : '';
  if (cur.q.t === 'qa' && cur.typed && isMatch(cur.typed, cur.q)) { cur.matched = true; cur.phase = 'done'; commit('ok'); }
  else cur.phase = 'reveal';
  drawQuiz();
}
function grade(g) {
  if (!cur || cur.phase !== 'reveal') return;
  commit(g);
  const msg = g === 'ng' ? '× このあと、もう一度出ます' : (g === 'meh' ? '△ ' : '○ ') + nextText(cur.info.due);
  toast(msg);
  next();
}
function pickChoice(i) {
  if (!cur || cur.phase !== 'ask' || cur.q.t !== 'mc' || !(i >= 0 && i < 4)) return;
  cur.picked = cur.perm[i]; cur.phase = 'done'; commit(cur.picked === cur.q.a ? 'ok' : 'ng'); drawQuiz();
}
function pickTF(v) {
  if (!cur || cur.phase !== 'ask' || cur.q.t !== 'tf') return;
  cur.picked = v; cur.phase = 'done'; commit(v === cur.q.a ? 'ok' : 'ng'); drawQuiz();
}

/* ---------- result ---------- */
const HANAMARU = '<svg class="hanamaru" viewBox="0 0 110 96" aria-hidden="true"><path d="M58 8 C88 6 104 26 102 48 C100 72 80 88 54 88 C27 88 8 72 9 48 C10 26 28 10 62 12 C80 13 93 22 97 33"/></svg>';
function renderResult() {
  const R = lastResult;
  if (!R) { goHome(); return; }
  const firsts = new Map();
  for (const r of R.res) if (!firsts.has(r.id)) firsts.set(r.id, r);
  const uniq = [...firsts.values()];
  const n = uniq.length, ok = uniq.filter(r => r.ok).length;
  const wrongIds = uniq.filter(r => !r.ok).map(r => r.id).filter(id => QBY.has(id));
  const rate = n ? Math.round(ok / n * 100) : 0;
  const lv = [0, 0, 0, 0, 0]; for (const r of uniq) lv[lvOf(r.id)]++;
  const p = todayPlan(), remain = p.reviews.length + p.news.length;
  const msg = !n ? 'まだ1問も答えていません。' : rate === 100 ? '全問正解です。' : rate >= 80 ? 'よくできています。×の解説だけ読み直そう。'
    : rate >= 50 ? '半分以上できています。×の問題は明日また出ます。' : '1周目はこれで普通です。×の問題は明日また出るので、解説を読んでおけば十分。';
  V.result.innerHTML = `
  <div class="wrap">
    <section class="sheet">
      <p class="eyebrow">答え合わせの結果（1回目の答えで集計）</p>
      <div class="score">${rate >= 80 && n ? HANAMARU : ''}<span class="big">${ok}</span><span class="of">/ ${n}問 正解</span><span class="rate">${rate}%</span></div>
      <p class="msg">${msg}</p>
      <ul class="moved">${[4, 3, 2, 1].map(l => `<li><span class="lv" data-l="${l}">${LEVELS[l]}</span> <b>${lv[l]}</b>問</li>`).join('')}</ul>
      <p class="hint">${remain ? `今日の分は、あと ${remain}問（約${p.est}分）。` : '今日の目安はクリアです。'}</p>
      <div class="btnrow">
        ${remain ? `<button type="button" class="btn primary" data-act="go">続けて ${Math.min(Store.prefs.chunk, remain)}問</button>` : ''}
        ${wrongIds.length ? `<button type="button" class="btn" data-act="retry-wrong">まちがえた${wrongIds.length}問をもう一度</button>` : ''}
        <button type="button" class="btn ${remain ? '' : 'primary'}" data-act="home">ホームへ</button>
      </div>
    </section>
    ${wrongIds.length ? `<section class="sheet"><h2>まちがえた問題と解説</h2>${wrongIds.map(id => itemHtml(QBY.get(id), { unit: true })).join('')}</section>` : ''}
  </div>`;
  V.result.dataset.wrong = wrongIds.join(',');
}

/* ---------- reading mode, lists ---------- */
function itemHtml(q, o) {
  o = o || {};
  const lv = lvOf(q.id), s = srs(q.id);
  let ans;
  if (q.t === 'qa') ans = `<span class="r-ans">${esc(q.a)}</span>${q.alt.length ? `<span class="r-alt">（別解：${esc(q.alt.join('／'))}）</span>` : ''}`;
  else if (q.t === 'ex') ans = `<span class="r-ans long">${esc(q.a)}</span>`;
  else if (q.t === 'mc') ans = `<span class="r-ans">正解：${esc(q.c[q.a])}</span>`;
  else ans = `<span class="r-ans">${q.a ? '○ 正しい' : '× 誤り'}</span>`;
  const choices = q.t === 'mc' ? `<ol class="r-choices">${q.c.map((c, i) => `<li><span>${i + 1}.</span><span>${esc(c)}</span></li>`).join('')}</ol>` : '';
  return `<div class="ritem">
    <div class="r-meta">${o.unit ? `<span class="chip">${unitNo(q.u)} ${esc(UNIT_INFO[q.u][0])}</span>` : ''}<span class="lv" data-l="${lv}">${LEVELS[lv]}${s ? '・次 ' + md(s.due) : ''}</span><span class="chip type">${TYPE_LABEL[q.t]}</span>${stars(q.imp)}</div>
    <p class="r-q">${esc(q.q)}</p>${choices}
    <div class="r-a" data-act="peek" role="button" tabindex="0" aria-label="答えと解説（タップでめくる）">${ans}${q.e ? `<p class="r-e">${esc(q.e)}</p>` : ''}</div>
  </div>`;
}
function renderRead(u) {
  readUnit = u;
  const list = BYUNIT[u] || [], info = UNIT_INFO[u];
  const groups = [];
  for (const q of list) { let g = groups[groups.length - 1]; if (!g || g.s !== q.s) { g = { s: q.s, items: [] }; groups.push(g); } g.items.push(q); }
  V.read.innerHTML = `
  <div class="readbar"><div class="wrap">
    <button type="button" class="btn ghost small" data-act="home">← もどる</button>
    <h1>${unitNo(u)} ${esc(info[0])}</h1>
    <button type="button" class="btn small toggle" data-act="sheet" aria-pressed="${sheetOn}">赤シート</button>
  </div></div>
  <div class="wrap ${sheetOn ? 'sheet-on' : ''}" id="read-body">
    <p class="read-intro">${list.length}問。問題と答え・解説を上から読んでいこう。「赤シート」をONにすると答えが隠れ、タップするとめくれます。読むだけでは記録は変わりません。</p>
    ${groups.length ? groups.map(g => `<section class="sheet topic"><h2>${esc(g.s)}<span class="count">${g.items.length}問</span></h2>${g.items.map(q => itemHtml(q)).join('')}</section>`).join('') : '<p class="empty">この単元の問題はまだありません。</p>'}
    <div class="btnrow">
      <button type="button" class="btn primary" data-act="unit-go" data-unit="${u}">この単元を解く（${Store.prefs.chunk}問）</button>
      <button type="button" class="btn" data-act="home">ホームへ</button>
    </div>
  </div>`;
}
let searchTimer = 0;
function doSearch(term) {
  const box = $('#search-results'); if (!box) return;
  const t = normSearch(term);
  if (!t) { box.innerHTML = ''; return; }
  const hits = [];
  for (const q of Q) {
    if (q._k === undefined) q._k = normSearch([q.s, q.q, answerText(q), q.alt.join(' '), q.e].join(' '));
    if (q._k.includes(t)) { hits.push(q); if (hits.length >= 50) break; }
  }
  box.innerHTML = hits.length ? hits.map(q => itemHtml(q, { unit: true })).join('') + (hits.length >= 50 ? '<p class="res-note">最初の50件を表示しています。言葉を足して絞りこめます。</p>' : '')
    : '<p class="res-note">見つかりませんでした。別の言い方でさがしてみてください。</p>';
}

/* ---------- events ---------- */
const UI = { dataChanged() { if (view === 'home') refreshHome(); } };
function setOpt(key, raw) {
  const P = Store.prefs, o = OPTS.find(x => x.key === key); if (!o) return;
  const item = o.items.find(([v]) => String(v) === raw); if (!item) return;
  const v = item[0];
  if (o.multi) {
    const set = new Set(P[key]);
    if (set.has(v)) { if (set.size > 1) set.delete(v); } else set.add(v);
    P[key] = o.items.map(([x]) => x).filter(x => set.has(x));
  } else P[key] = v;
  Store.savePrefs();
  V.home.querySelectorAll(`[data-act="opt"][data-key="${key}"]`).forEach(b => b.setAttribute('aria-pressed', String(optPressed(o, o.items.find(([x]) => String(x) === b.dataset.val)[0]))));
  updateCustomInfo();
}
function setSetting(key, raw) {
  const o = SETTINGS.find(x => x.key === key); if (!o) return;
  const item = o.items.find(([v]) => String(v) === raw); if (!item) return;
  Store.prefs[key] = item[0]; Store.savePrefs();
  $('#settings').innerHTML = settingsHtml();
  $('#today').innerHTML = todayHtml();
  $('#progress').innerHTML = progressHtml();
}
function setUnits(list) { Store.prefs.units = ORDER.filter(u => list.includes(u)); Store.savePrefs(); refreshPicker(); }

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || !document.getElementById('app').contains(el) || el.disabled) return;
  const act = el.dataset.act;
  switch (act) {
    case 'go': todaySession('today'); break;
    case 'go-quick': todaySession('quick'); break;
    case 'go-ng': todaySession('ng'); break;
    case 'unit-go': unitSession(el.dataset.unit); break;
    case 'start': startWith({}, '選んだ条件'); break;
    case 'resume': resume(); break;
    case 'opt': setOpt(el.dataset.key, el.dataset.val); break;
    case 'set': setSetting(el.dataset.key, el.dataset.val); break;
    case 'units-all': setUnits(ORDER); break;
    case 'units-none': setUnits([]); break;
    case 'part': {
      const p = PARTS[+el.dataset.part], sel = new Set(Store.prefs.units);
      const allOn = p.units.every(u => sel.has(u));
      p.units.forEach(u => allOn ? sel.delete(u) : sel.add(u));
      setUnits([...sel]); break;
    }
    case 'read': show('read'); renderRead(el.dataset.unit); break;
    case 'sheet': {
      sheetOn = !sheetOn; el.setAttribute('aria-pressed', String(sheetOn));
      const body = $('#read-body'); if (body) body.classList.toggle('sheet-on', sheetOn);
      V.read.querySelectorAll('.r-a.peek').forEach(x => x.classList.remove('peek'));
      break;
    }
    case 'peek': if (el.closest('.sheet-on')) el.classList.toggle('peek'); break;
    case 'home': goHome(); break;
    case 'quit': if (S) { delete S.look; if (S.i < S.ids.length) LS.set(K_SESSION, S); else LS.del(K_SESSION); } goHome(); break;
    case 'reveal': reveal(); break;
    case 'typing': if (cur) { cur.typing = true; drawQuiz(); const inp = $('#ans-in'); if (inp) inp.focus(); } break;
    case 'choice': pickChoice(+el.dataset.i); break;
    case 'tf': pickTF(el.dataset.v === '1'); break;
    case 'grade': grade(el.dataset.g); break;
    case 'fluke': markFluke(); break;
    case 'next': next(); break;
    case 'mark': if (cur) { Store.toggleMark(cur.q.id); drawQuiz(); } break;
    case 'retry-wrong': { const ids = (V.result.dataset.wrong || '').split(',').filter(Boolean); startSession(shuffle(ids), 'まちがえた問題'); break; }
    case 'reset-ask': {
      $('#reset-area').innerHTML = '<div class="reset-confirm"><span>すべての学習記録・☆印・カレンダーを消します。元に戻せません。</span><button type="button" class="btn small red" data-act="reset-yes">消す</button><button type="button" class="btn small" data-act="reset-no">やめる</button></div>';
      break;
    }
    case 'reset-yes': Store.reset(); renderHome(); break;
    case 'reset-no': $('#reset-area').innerHTML = '<button type="button" class="linkbtn" data-act="reset-ask">学習記録をリセット</button>'; break;
    case 'retry-load': location.reload(); break;
    case 'export': exportBackup(); break;
    case 'import': { const f = $('#import-file'); if (f) { f.value = ''; f.click(); } break; }
  }
});
document.addEventListener('change', e => {
  if (e.target.id !== 'import-file') return;
  const f = e.target.files && e.target.files[0];
  if (f) importBackup(f);
});
document.addEventListener('change', e => {
  const cb = e.target.closest && e.target.closest('input[data-pick]'); if (!cb) return;
  const sel = new Set(Store.prefs.units);
  if (cb.checked) sel.add(cb.dataset.pick); else sel.delete(cb.dataset.pick);
  setUnits([...sel]);
});
document.addEventListener('submit', e => { if (e.target.dataset && e.target.dataset.form === 'reveal') { e.preventDefault(); reveal(); } });
document.addEventListener('input', e => { if (e.target.id === 'search') { clearTimeout(searchTimer); const v = e.target.value; searchTimer = setTimeout(() => doSearch(v), 160); } });
document.addEventListener('keydown', e => {
  if (e.isComposing || e.keyCode === 229) return;
  const tag = (e.target.tagName || '').toLowerCase();
  const typing = tag === 'input' || tag === 'textarea';
  if (view === 'read' && e.target.dataset && e.target.dataset.act === 'peek' && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); e.target.click(); return; }
  if (view !== 'quiz' || !cur || e.ctrlKey && e.key !== 'Enter' || e.altKey) return;
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  if (cur.phase === 'ask') {
    if (cur.q.t === 'mc' && !typing && k >= '1' && k <= '4') { e.preventDefault(); pickChoice(+k - 1); }
    else if (cur.q.t === 'tf' && !typing && (k === '1' || k === 'o')) { e.preventDefault(); pickTF(true); }
    else if (cur.q.t === 'tf' && !typing && (k === '2' || k === 'x')) { e.preventDefault(); pickTF(false); }
    else if (cur.q.t === 'ex' && tag === 'textarea' && k === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); reveal(); }
    else if ((cur.q.t === 'qa' || cur.q.t === 'ex') && tag !== 'textarea' && tag !== 'button' && k === 'Enter') { e.preventDefault(); reveal(); }
  } else if (cur.phase === 'reveal' && !typing) {
    if (k === '1' || k === 'x') { e.preventDefault(); grade('ng'); }
    else if (k === '2') { e.preventDefault(); grade('meh'); }
    else if (k === '3' || k === 'o') { e.preventDefault(); grade('ok'); }
  } else if (cur.phase === 'done' && !typing && tag !== 'button' && (k === 'Enter' || k === 'ArrowRight')) { e.preventDefault(); next(); }
});
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') { Sync.flush(); if (view === 'quiz' && S && cur) saveLook(); }
  else if (view === 'home') refreshHome();
});

/* ---------- self-check and screenshot modes (local testing only) ---------- */
function selfTest() {
  const out = [], errs = [];
  out.push('questions=' + Q.length + ' dataErrors=' + dataErrors.length);
  const types = { qa: 0, ex: 0, mc: 0, tf: 0 };
  Q.forEach(q => types[q.t]++);
  out.push('types=' + JSON.stringify(types));
  try {
    // migration of an old-format record: [ok, ng, lastOk, ts]
    const a = Q[0].id, b = Q[1].id, ts = now() - 3 * 86400;
    Store.prog[a] = [1, 0, 1, ts]; Store.prog[b] = [0, 1, 0, ts];
    const sa = srs(a), sb = srs(b);
    if (sa.box !== 2 || sa.due !== addD(dayOf(ts * 1000), 4)) errs.push('migrate ok-record ' + JSON.stringify(sa));
    if (sb.box !== 1 || sb.due !== addD(dayOf(ts * 1000), 1)) errs.push('migrate ng-record ' + JSON.stringify(sb));
    // scheduling rules
    const c = Q[2].id;
    let r = Store.record(c, 'ok', 5); if (r.box !== 2 || r.due !== addD(today(), 4)) errs.push('new ok ' + JSON.stringify(r));
    r = Store.record(c, 'ok', 5); if (r.box !== 2) errs.push('same-day ok should not promote ' + JSON.stringify(r));
    r = Store.record(c, 'ng', 5); if (r.box !== 1 || r.due !== addD(today(), 1)) errs.push('ng ' + JSON.stringify(r));
    Store.prog[c][3] = now() - 86400 * 2; Store.prog[c][4] = 3; Store.prog[c][5] = today();
    r = Store.record(c, 'ok', 5); if (r.box !== 4) errs.push('promote 3->4 ' + JSON.stringify(r));
    Store.prog[c][3] = now() - 86400 * 2;
    r = Store.record(c, 'ng', 5); if (r.box !== 2) errs.push('lapse 4->2 ' + JSON.stringify(r));
    Store.prog[c][3] = now() - 86400 * 2;
    r = Store.record(c, 'meh', 5); if (r.box !== 2 || r.due !== addD(today(), 1)) errs.push('meh ' + JSON.stringify(r));
    if (addD(20261231, 1) !== 20270101 || dayGap(20261123, 20270116) !== 54) errs.push('date math');
    const p = todayPlan();
    out.push('plan: due=' + p.due.length + ' reviews=' + p.reviews.length + ' news=' + p.news.length + ' pace=' + p.pace + ' est=' + p.est + 'min tier=' + (p.tier && p.tier.label));
    if (interleave([1, 2, 3, 4], ['a', 'b']).join('') !== '1a23b4') errs.push('interleave ' + interleave([1, 2, 3, 4], ['a', 'b']).join(''));
    // run sessions through every question type
    for (const u of ORDER) if (BYUNIT[u].length) renderRead(u);
    const sample = shuffle(Q.slice()).slice(0, 300);
    startSession(sample.map(q => q.id), 'test');
    out.push('gptPromptLen=' + fullPrompt().length + ' urlLen=' + gptUrl(fullPrompt()).length + ' selUrlLen=' + gptUrl(selPrompt('信用創造', cur.q.q)).length);
    DEMO = false; saveLook(); const L0 = LS.get(K_SESSION).look; DEMO = true;
    if (!L0 || L0.id !== cur.q.id) errs.push('saveLook');
    else { restoreLook(L0); if (cur.q.id !== L0.id || !$('.btn.gpt')) errs.push('restoreLook'); }
    try { localStorage.removeItem(K_SESSION); } catch (e) { /* ignore */ }
    let guard = 0;
    while (S && guard++ < 1500) {
      const q = cur.q;
      if (q.t === 'mc') { pickChoice(Math.floor(Math.random() * 4)); if (cur.grade === 'ok' && Math.random() < .3) markFluke(); }
      else if (q.t === 'tf') pickTF(Math.random() < .5);
      else {
        if (Math.random() < .3) { cur.typing = true; drawQuiz(); const inp = $('#ans-in'); if (inp && Math.random() < .5) inp.value = q.a; }
        reveal();
        if (cur.phase === 'reveal') { grade(['ng', 'meh', 'ok'][Math.floor(Math.random() * 3)]); continue; }
      }
      if (!$('#next-btn')) errs.push('no next button for ' + q.id);
      next();
    }
    if (guard >= 1500) errs.push('session did not finish');
    renderResult(); goHome();
    doSearch('ロック'); out.push('searchHits=' + V.home.querySelectorAll('#search-results .ritem').length);
    todaySession('today'); out.push('todaySession=' + (S ? S.ids.length : 0)); goHome();
    todaySession('quick'); out.push('quickSession=' + (S ? S.ids.length : 0) + ' exInQuick=' + (S ? S.ids.filter(id => QBY.get(id).t === 'ex').length : 0)); goHome();
    unitSession('u07'); out.push('unitSession=' + (S ? S.ids.length : 0)); goHome();
    const c5 = levelCounts(Q); out.push('levels=' + c5.join('/') + ' log=' + JSON.stringify(Store.log[today()]));
    for (const id of ['today', 'progress', 'heat', 'units', 'settings']) if (!$('#' + id) || !$('#' + id).innerHTML.trim()) errs.push('empty section ' + id);
    // backup file round trip: export, wipe, import, compare; then importing an older copy must not overwrite newer records
    const bk = JSON.parse(JSON.stringify(backupDoc()));
    const canon = o => JSON.stringify(Object.keys(o).sort().map(k => [k, o[k]]));
    const nBk = Object.keys(bk.prog).length, keyBefore = canon(Store.prog), logBefore = canon(Store.log);
    Store.prog = {}; Store.log = {}; Store.marks = {};
    let mr = mergeBackup(bk);
    if (canon(Store.prog) !== keyBefore || canon(Store.log) !== logBefore || mr.updated !== nBk) errs.push('backup round trip ' + JSON.stringify(mr) + ' n=' + nBk);
    const id0 = Object.keys(Store.prog)[0], newer = Store.prog[id0].slice(); newer[3] = +newer[3] + 100; newer[0] = 99; Store.prog[id0] = newer;
    mr = mergeBackup(bk);
    if (Store.prog[id0][0] !== 99 || mr.updated !== 0) errs.push('backup kept newer ' + JSON.stringify(mr));
    out.push('backup=' + nBk + ' records ok');
  } catch (e) { errs.push('EXC ' + e.message + ' @ ' + (e.stack || '').split('\n').slice(0, 3).join(' | ')); }
  out.push('errors=' + errs.length); errs.slice(0, 20).forEach(x => out.push(x));
  dataErrors.slice(0, 20).forEach(x => out.push('dataError ' + x));
  const pre = document.createElement('pre'); pre.id = 'selftest'; pre.textContent = out.join('\n'); document.body.appendChild(pre);
}
function seedDemo() {
  const t = today(), base = now();
  let i = 0;
  for (const q of Q) {
    if (q.imp !== 3 && !(q.imp === 2 && q.n % 5 === 0)) continue;
    if (i++ > 520) break;
    const box = [1, 2, 2, 3, 3, 4, 4, 5][q.n % 8], age = q.n % 9;
    Store.prog[q.id] = [box > 1 ? 2 : 1, box > 2 ? 0 : 1, box > 1 ? 1 : 0, base - age * 86400, box, addD(t, (q.n % 5) - 1)];
  }
  for (let k = 0; k < 20; k++) { const n = [0, 35, 48, 62, 20, 0, 75, 90, 41, 55][k % 10]; if (n) Store.log[addD(t, -k)] = [n, Math.round(n * .7), Math.round(n * .5), Math.round(n * .5), n * 18]; }
}
function galleryMode() {
  gallery = true; DEMO = true;
  seedDemo();
  for (const k in V) V[k].hidden = false;
  renderHome();
  const qa = Q.find(q => q.t === 'qa' && q.u === 'u04' && q.imp === 3) || Q.find(q => q.t === 'qa');
  S = { ids: [qa.id], i: 0, res: [], label: 'gallery', re: [] };
  renderQuestion(); reveal();
  view = 'home';
}

/* ---------- boot ---------- */
function bootError(e) {
  const box = $('#loading');
  if (box) box.innerHTML = `<p>問題を読み込めませんでした（${esc(e && e.message || e)}）。通信の状態を確かめて、もう一度読み込んでください。</p><button type="button" class="btn primary" data-act="retry-load">もう一度読み込む</button>`;
}
function boot() {
  if (booted) return; booted = true;
  getData().then(raw => {
    loadData(raw); Store.load();
    const h = location.hash;
    if (h === '#gallery-dark') document.documentElement.setAttribute('data-theme', 'dark');
    if (h.indexOf('#gallery') === 0) { galleryMode(); return; }
    renderHome(); show('home');
    if (h === '#selftest') { DEMO = true; selfTest(); return; }
    if (freshLook(LS.get(K_SESSION))) resume();
    Sync.init(); initDownloads();
  }).catch(bootError);
}
boot();
