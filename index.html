とは区別される。","a":true,"e":"脳死になると人工呼吸器なしでは呼吸ができず、回復することはない。植物状態は大脳の機能が失われても脳幹の機能が残っている状態で、回復する場合もある。脳死を人の死とみなすかどうかが、臓器移植をめぐって議論されてきた。"},{"t":"qa","s":"脳死と臓器移植","imp":3,"q":"1997年に制定され、本人の書面による意思表示などを条件に、脳死した人からの臓器の摘出と移植を認めた日本の法律は何か。","a":"臓器移植法","alt":["臓器の移植に関する法律"],"e":"制定当初は、本人が生前に書面で臓器提供の意思を示し、家族も拒まない場合に限って脳死下での臓器提供が認められ、15歳未満の人からの提供はできなかった。2009年の改正（2010年施行）で条件が緩和された。"},{"t":"mc","s":"脳死と臓器移植","imp":3,"q":"2009年に改正された臓器移植法の内容についての記述として最も適当なものを一つ選べ。","c":["15歳未満の人からの脳死下での臓器提供は、家族が承諾しても一切認められないことになった。","本人の意思が不明な場合でも、家族が書面で承諾すれば、脳死下での臓器提供ができるようになった。","本人が生前に臓器提供を拒否する意思を示していても、家族が承諾すれば臓器提供ができるようになった。","脳死下での臓器提供は廃止され、心臓が停止した後の臓器提供だけが認められることになった。"],"a":1,"e":"2009年の改正（2010年施行）により、本人の意思が不明な場合には家族の書面による承諾で臓器提供ができるようになり、15歳未満の子どもからの脳死下での提供も可能になった。親族へ優先的に提供する意思表示も認められた。本人が拒否の意思を示している場合は提供できないので、家族の承諾で提供できるとする選択肢は誤り。15歳未満からの提供を一切認めないとする選択肢や、脳死下での提供を廃止したとする選択肢も誤り。"},{"t":"ex","s":"終末期医療","imp":3,"q":"安楽死と尊厳死の違いを説明せよ。","a":"安楽死は、回復の見込みがなく耐えがたい苦痛に苦しむ患者に対し、本人の意思に基づいて、医師が薬物を投与するなどして死期を早めることをいう。尊厳死は、回復の見込みのない患者が、本人の意思に基づいて延命治療を差し控えたり中止したりして、人間としての尊厳を保ったまま自然な死を迎えることをいう。","e":"ポイント：①安楽死＝積極的に死期を早める（オランダなど一部の国では法律で容認） ②尊厳死＝延命治療を行わず自然な死を迎える ③いずれも本人の意思（自己決定）が前提。日本には安楽死や尊厳死を認める法律はない"},{"t":"qa","s":"終末期医療","imp":2,"q":"回復の見込みがなくなった場合に延命治療を望まないことなど、終末期の医療についての希望を、判断能力があるうちに文書で示しておくことを何というか。","a":"リヴィング・ウィル","alt":["リビング・ウィル","リビングウィル","リヴィングウィル"],"e":"「生前の意思表示」と訳され、尊厳死を望む意思を示す手段とされる。近年は、本人が家族や医療・ケアのチームとくり返し話し合って終末期の方針を決めておく取り組み（アドバンス・ケア・プランニング、愛称「人生会議」）も勧められている。"},{"t":"tf","s":"終末期医療","imp":2,"q":"ホスピスは、治癒の見込みのない末期患者に対して、延命のための治療を最優先に行う施設である。","a":false,"e":"正しくは、ホスピスは延命よりも、身体的な痛みや精神的な苦しみを和らげる緩和ケアを行い、患者が残された時間を自分らしく過ごせるよう支える施設や取り組みである。QOLを重視する医療の代表例である。"},{"t":"tf","s":"生殖補助医療","imp":1,"q":"着床前診断とは、妊娠中の胎児の染色体や遺伝子の異常の有無を、母親の血液や羊水を採取して調べる検査である。","a":false,"e":"正しくは、それは出生前診断の説明である。着床前診断は、体外受精によってできた受精卵が子宮に着床する前に、その染色体や遺伝子を調べる検査である。どちらも、障害や病気の有無によって生まれてくる命を選別することにつながるという倫理的な問題が指摘されている。"},{"t":"qa","s":"生殖補助医療","imp":1,"q":"子を望む夫婦の受精卵を別の女性の子宮に移植するなどして、その女性に妊娠・出産してもらうことを何というか。","a":"代理出産","alt":["代理母出産","代理懐胎","代理母"],"e":"体外受精などの生殖補助医療の発達によって可能になった。日本では代理出産を直接禁止する法律はないが、日本産科婦人科学会は認めていない。法律上は出産した女性が母とされ、親子関係のあり方や、女性の身体を手段として利用することなどの倫理的な問題が議論されている。"},{"t":"qa","s":"先端医療技術","imp":1,"q":"イギリスで体細胞クローン羊ドリーが誕生したことなどを受けて2000年に制定され、ヒトクローン胚を人の胎内に移植すること（クローン人間の産生）を禁止した日本の法律は何か。","a":"クローン技術規制法","alt":["ヒトに関するクローン技術等の規制に関する法律"],"e":"クローン人間をつくることは、人間の尊厳や個人の唯一性を損なうなどとして、多くの国で禁止されている。日本のクローン技術規制法は、違反に刑事罰を定めている。"},{"t":"qa","s":"先端医療技術","imp":3,"q":"皮膚などの体細胞に特定の遺伝子を導入してつくられる、さまざまな組織や臓器の細胞に分化する能力をもつ人工多能性幹細胞を何というか。","a":"iPS細胞","alt":["iPS","人工多能性幹細胞"],"e":"山中伸弥が作製に成功し（マウスで2006年、ヒトで2007年）、2012年にノーベル生理学・医学賞を受賞した。受精卵（胚）を壊してつくるES細胞（胚性幹細胞）と異なり、受精卵を使わないため倫理的な問題が少ないとされ、再生医療や新薬開発への応用が期待されている。"},{"t":"mc","s":"先端医療技術","imp":2,"q":"ES細胞とiPS細胞についての記述として最も適当なものを一つ選べ。","c":["iPS細胞は受精卵を壊して作製するため、ES細胞以上に生命倫理上の問題が大きいとされる。","ES細胞は皮膚などの体細胞から作製されるため、受精卵を利用することにともなう倫理的な問題は生じない。","iPS細胞は体のどの組織の細胞にも分化することができないため、再生医療には利用できない。","ES細胞は受精後間もない胚を壊して作製するため、生命の萌芽を壊すという倫理的な問題が指摘されてきた。"],"a":3,"e":"ES細胞（胚性幹細胞）は受精卵が分裂して育った初期の胚から作製されるため、人の生命の萌芽を壊すという批判がある。「iPS細胞は受精卵を壊して作製する」とする選択肢と「ES細胞は体細胞から作製される」とする選択肢は、両者の作り方を取り違えており誤り。iPS細胞はさまざまな細胞に分化でき、再生医療への応用が進められているので、「再生医療には利用できない」とする選択肢も誤り。"},{"t":"qa","s":"先端医療技術","imp":1,"q":"人間の細胞がもつ遺伝情報の全体を何というか。2003年に、国際的な計画によってその解読の完了が宣言された。","a":"ヒトゲノム","alt":["ゲノム"],"e":"ヒトゲノムの解読は、病気の原因の解明や、一人ひとりの体質に合った医療（個別化医療）に役立つ。一方で、遺伝情報による就職や保険などでの差別や、プライバシーの侵害が懸念されている。"},{"t":"tf","s":"先端医療技術","imp":1,"q":"ゲノム編集は遺伝子の狙った部分を切断・改変できる技術であり、受精卵に用いれば親が望む性質をもつ子ども（デザイナー・ベビー）をつくることにつながりかねないとして、倫理的な懸念が示されている。","a":true,"e":"ゲノム編集は、農作物の品種改良や病気の治療などへの応用が期待されている。一方、2018年には中国の研究者がゲノム編集した受精卵から双子を誕生させたと発表し、安全性や倫理の面から国際的な批判を浴びた。"}]});</script>
<script>QDATA.push({"unit":"u03","questions":[{"t":"ex","s":"環境倫理","imp":3,"q":"環境倫理の主要な3つの主張（自然の生存権・世代間倫理・地球有限主義）について、それぞれ説明せよ。","a":"自然の生存権は、人間だけでなく動植物などの生物や生態系にも、それ自体として生存する権利があるとする主張である。世代間倫理は、現在の世代は将来の世代の生存可能性に対して責任を負うとする主張である。地球有限主義は、地球の資源や環境は有限であり、その維持を優先して資源の消費や開発などを制限すべきだとする主張である。","e":"ポイント：①自然の生存権＝人間以外の生物や生態系にも生存の権利がある ②世代間倫理＝将来世代への責任 ③地球有限主義（地球全体主義ともいう）＝有限な地球環境の維持を優先する。日本の倫理学者加藤尚武による整理が知られる"},{"t":"qa","s":"環境倫理","imp":2,"q":"現在の世代は、まだ生まれていない将来の世代の生存や生活環境に対して責任を負うべきだとする考え方を何というか。","a":"世代間倫理","alt":["世代間の倫理"],"e":"将来の世代は現在の意思決定に参加できないため、現在の世代が資源を使い尽くしたり環境を破壊したりすれば、一方的に不利益を負わせることになる。ドイツ出身の哲学者ヨナスは『責任という原理』で、未来に対する責任の倫理を説いた。「持続可能な開発」の考え方とも結びつく。"},{"t":"qa","s":"情報社会とメディア","imp":3,"q":"パソコンやインターネットなどの情報通信技術を利用できる人とできない人との間に生じる、情報の入手や活用の機会と、それにともなう経済的・社会的な格差を何というか。","a":"デジタル・デバイド","alt":["デジタルデバイド","情報格差"],"e":"情報格差ともいう。年齢・所得・地域などによる個人間の格差のほか、先進国と発展途上国との間の格差も問題となる。行政手続きのデジタル化などが進むなかで、誰も取り残さないための支援が課題である。"},{"t":"qa","s":"情報社会とメディア","imp":2,"q":"新聞・テレビやインターネットなどのメディアが伝える情報をうのみにせず、主体的・批判的に読み解き、活用する能力を何というか。","a":"メディア・リテラシー","alt":["メディアリテラシー"],"e":"メディアの情報は、送り手の意図や編集によって選ばれ、構成されたものであると理解することが出発点である。似た言葉の情報リテラシーは、情報機器などを用いて必要な情報を収集・選択・活用し、適切に発信する能力をさす。"},{"t":"mc","s":"情報社会とメディア","imp":3,"q":"次の行動のうち、メディア・リテラシーを発揮した行動として最も適当なものを一つ選べ。","c":["多くの人が共有している投稿は正しい情報に違いないと考え、内容を確かめずにすぐに友人に転送した。","SNSで拡散されている衝撃的な情報について、発信元を確認し、複数の報道機関の記事やファクトチェックの結果と照らし合わせた。","新聞やテレビの報道は常に中立で正確なので、その内容を疑わずにそのまま受け入れた。","自分の考えに合わない情報は誤りだと判断し、反対の意見を述べるアカウントをすべてブロックした。"],"a":1,"e":"発信元を確かめ、複数の情報源と比べて真偽を検討する態度がメディア・リテラシーである。共有数の多さを正しさの根拠にすると、虚偽の情報（フェイクニュース）の拡散に加担しかねない。マスメディアも送り手の視点で情報を選んで伝えており、常に中立とは限らない。考えの合わない情報を遮断すると、エコーチェンバーに陥りやすくなる。"},{"t":"qa","s":"情報社会とメディア","imp":2,"q":"インターネット上で、アルゴリズムが利用者の検索や閲覧の履歴をもとに好みに合う情報を優先的に表示する結果、利用者が自分の見たい情報だけに囲まれ、異なる意見にふれにくくなる状態を何というか。","a":"フィルターバブル","e":"利用者自身が気づかないうちに、泡（バブル）の中に閉じこめられたような状態になることから名づけられた。社会の分断や、偏った情報に基づく判断を招くおそれが指摘されている。"},{"t":"ex","s":"情報社会とメディア","imp":2,"q":"エコーチェンバーとは何か、フィルターバブルとの違いにふれて説明せよ。","a":"エコーチェンバーとは、SNSなどで自分と似た意見や価値観をもつ人々とばかりつながることで、同じような意見がこだまのように反響・増幅し、それが正しく多数派の意見であると思い込みやすくなる現象である。フィルターバブルがアルゴリズムによる情報の選別で生じるのに対し、エコーチェンバーは主に利用者どうしのつながり方から生じる。","e":"ポイント：①似た意見の人とばかりつながり、意見が反響・増幅する ②自分の意見が正しい・多数派だと思い込む ③フィルターバブルはアルゴリズムによる情報の選別が原因。どちらも社会の分断や極端な意見への偏りを招くおそれがある"},{"t":"tf","s":"情報社会とメディア","imp":2,"q":"ニュースや政治家の発言、SNSで広まっている情報などの真偽を、根拠となる資料にあたって検証し、その結果を公表する活動をファクトチェックという。","a":true,"e":"事実に基づかない虚偽の情報（フェイクニュース）は、SNSを通じて短時間で大量に拡散することがある。報道機関や専門の団体によるファクトチェックとともに、受け手一人ひとりが情報の真偽を確かめる姿勢が求められる。"},{"t":"qa","s":"情報社会と法","imp":3,"q":"2003年に制定され、個人情報を取り扱う事業者に対し、利用目的の特定や、本人の同意のない第三者への提供の制限などを義務づけた日本の法律は何か。","a":"個人情報保護法","alt":["個人情報の保護に関する法律"],"e":"高度情報社会では、氏名や住所、購買履歴などの個人情報が、本人の知らないうちに収集・利用される危険がある。個人情報保護法は、プライバシーの権利を「自己に関する情報をコントロールする権利」としてとらえる考え方とも結びついている。その後の改正で、個人情報保護委員会の設置なども定められた。"},{"t":"mc","s":"情報社会と法","imp":2,"q":"個人情報の保護についての記述として最も適当なものを一つ選べ。","c":["日本の個人情報保護法は、国の行政機関だけを対象としており、民間企業には適用されない。","「忘れられる権利」は、日本国憲法に新しい人権として明文で規定されている。","EUの一般データ保護規則（GDPR）は、個人が自分に関するデータの消去を求める権利（忘れられる権利）を定めている。","EUの一般データ保護規則（GDPR）は、EU域外の企業がEU域内の人々の個人データを扱う場合には一切適用されない。"],"a":2,"e":"GDPRは2018年に適用が始まり、データの消去を求める権利（忘れられる権利）などを定め、EU域内の人々の個人データを扱う域外の企業にも適用される。日本の個人情報保護法は民間の事業者を主な対象として制定された法律なので誤り。忘れられる権利は日本国憲法に明文の規定がないので誤り。日本では2017年に最高裁判所が、インターネットの検索結果の削除を求める訴えについて判断の基準を示した。"},{"t":"tf","s":"情報社会と法","imp":2,"q":"著作権は、特許権と同じく、国の機関に出願して登録を受けなければ権利が発生しない。","a":false,"e":"正しくは、著作権は著作物を創作した時点で自動的に発生し、登録などの手続きは必要ない（無方式主義）。特許権・商標権・意匠権などは特許庁への出願と登録が必要である。これらの、人間の知的な創作活動の成果を保護する権利を総称して知的財産権という。日本の著作権の保護期間は、原則として著作者の死後70年である。"},{"t":"tf","s":"情報社会と法","imp":1,"q":"他人のIDやパスワードを無断で使い、ネットワークを通じて他人のコンピュータにログインする行為は、日本では不正アクセス禁止法によって禁止されている。","a":true,"e":"不正アクセス禁止法（1999年制定）は、他人のIDやパスワードを無断で用いたログインや、それらを不正に取得・提供する行為などを禁止し、罰則を設けている。サイバー犯罪の防止には、パスワードの使い回しを避けるなど利用者側の対策も重要である。"},{"t":"ex","s":"AIと未来社会","imp":1,"q":"IoT・ビッグデータ・AIとはそれぞれ何か、日本政府がめざす「Society 5.0」との関係にふれて説明せよ。","a":"IoT（モノのインターネット）は家電や自動車などのさまざまなモノがインターネットにつながる仕組み、ビッグデータはそこから集まる膨大で多様なデータ、AI（人工知能）はデータを分析・学習して判断などを行う技術である。Society 5.0は、これらを活用して仮想空間と現実空間を高度に融合させ、経済発展と社会的課題の解決を両立する人間中心の社会をさす。","e":"ポイント：①IoT＝モノがインターネットにつながる ②ビッグデータ＝膨大なデータ、AI＝データの分析・判断 ③Society 5.0＝狩猟・農耕・工業・情報社会に続く第5の社会。一方で、プライバシーの保護、AIの判断の偏りや責任の所在、雇用への影響などが課題となる"},{"t":"qa","s":"ジェンダー","imp":3,"q":"生物学的な性別（セックス）に対して、「男らしさ」「女らしさ」のように社会的・文化的につくられた性別や性差を何というか。","a":"ジェンダー","e":"ジェンダーに基づく固定的な見方は、性別役割分担意識や差別を生みやすい。日本では1999年に男女共同参画社会基本法が制定され、男女が性別にかかわりなく個性と能力を発揮できる社会がめざされている。"},{"t":"tf","s":"ジェンダー","imp":2,"q":"「男性は仕事、女性は家事・育児」という性別役割分担意識は、男女の生物学的な違いから必然的に生じるものであり、社会や文化によって変わることはない。","a":false,"e":"正しくは、性別役割分担意識は、時代や社会・文化の中で形成された社会的・文化的な性差（ジェンダー）の典型例であり、社会のあり方によって変化しうる。こうした固定的な意識は、女性の就業や昇進の機会を狭めたり、男性の家事・育児への参加を妨げたりする要因になってきた。"},{"t":"qa","s":"ジェンダー","imp":1,"q":"性的指向（どの性別の人を恋愛や性愛の対象とするか）と性自認（自分の性別をどう認識しているか）の英語の頭文字をとった言葉で、すべての人がもつ性のあり方をさす言葉は何か。","a":"SOGI","alt":["ソジ","ソギ"],"e":"LGBTQ（レズビアン・ゲイ・バイセクシュアル・トランスジェンダー・クエスチョニングまたはクィア）が性的少数者をさすのに対し、SOGIは少数者に限らずすべての人にかかわる概念である。日本では2023年に、性の多様性に関する国民の理解の増進を目的とする法律（LGBT理解増進法）が制定された。"},{"t":"mc","s":"ジェンダー","imp":1,"q":"ダイバーシティ（多様性）とインクルージョン（包摂）の考え方に最も合致する企業の取り組みを一つ選べ。","c":["多様な人材を採用したが、少数派の社員には、多数派の社員の慣習や働き方に合わせることを求めた。","業務を効率化するため、同じような経歴や価値観をもつ人材だけを採用することにした。","女性社員を一律に補助的な業務に配置し、管理職への登用は男性社員に限ることにした。","性別・国籍・障害の有無などにかかわらず多様な人材を採用し、誰もが能力を発揮できるよう働き方や職場環境を見直した。"],"a":3,"e":"ダイバーシティは多様な人々がいること、インクルージョンはその一人ひとりが受け入れられ、能力を発揮できる状態をいう。多様な人材を採用しても多数派への同調を求めるだけではインクルージョンにならないので、その選択肢は誤り。同質な人材だけの採用や、性別による一律の配置・登用の制限は、多様性の尊重に反する。"}]});</script>
<script>QDATA.push({"unit":"u04","questions":[{"t":"tf","s":"政治と権力","imp":2,"q":"政治権力は、最終的には軍隊や警察などの物理的な強制力に支えられているが、人々がその権力を正しいものとして受け入れる正統性がなければ、安定して維持することは難しい。","a":true,"e":"政治とは、社会の中の利害の対立を調整し、秩序を形成・維持する営みであり、そのために人々を従わせる力が政治権力である。権力が強制力だけに頼ると反発を招くため、支配が正しいと認められる根拠（正統性）が重要になる。ウェーバーは正統性の根拠を3つに分類した。"},{"t":"qa","s":"国家の三要素","imp":3,"q":"国家が成立するために必要な3つの要素を答えよ。","a":"領域・国民・主権","alt":["領域・主権・国民","国民・領域・主権","国民・主権・領域","主権・領域・国民","主権・国民・領域","領土・国民・主権"],"e":"ドイツの法学者イェリネックが示した国家三要素説による。領域は領土・領海・領空からなり、国民は国家を構成する人々、主権は国家の最高・独立の権力である。この3つがそろって初めて国家とみなされる。"},{"t":"tf","s":"国家の三要素","imp":1,"q":"国家の領域は領土・領海・領空からなり、沿岸から200海里までの排他的経済水域も、領海と同じく国家の領域に含まれる。","a":false,"e":"正しくは、排他的経済水域は国家の領域ではない。沿岸国は排他的経済水域の水産資源や鉱物資源などに対する権利（主権的権利）をもつが、他国の船舶の航行などは認められる。領海は基線から12海里までで、領空は領土と領海の上空である（宇宙空間は含まない）。"},{"t":"qa","s":"主権","imp":1,"q":"16世紀のフランスで『国家論』を著し、主権を「国家の絶対的かつ永続的な権力」と定義して、主権の概念を初めて体系的に論じた思想家は誰か。","a":"ボーダン","alt":["ジャン・ボーダン"],"e":"ボーダンは、宗教戦争で混乱したフランスにおいて、国王に主権を集中させることで秩序を回復しようとし、絶対王政を理論的に支えた。ただし、主権者も神の法や自然法には従うべきだとした。"},{"t":"ex","s":"主権","imp":3,"q":"「主権」という言葉がもつ3つの意味を、それぞれ説明せよ。","a":"第一に、国家の支配権そのもの（統治権）を意味し、領域や国民を支配する国家の権力をさす。第二に、国家権力が国内では最高であり、対外的には他国から独立していること（最高独立性）を意味する。第三に、国の政治のあり方を最終的に決定する力（最高決定権）を意味し、「国民主権」というときの主権はこの意味である。","e":"ポイント：①統治権（例：ポツダム宣言の「日本国ノ主権ハ本州、北海道、九州及四国並ニ吾等ノ決定スル諸小島ニ局限セラルベシ」） ②最高独立性（例：憲法前文の「自国の主権を維持し」） ③最高決定権（例：憲法前文の「ここに主権が国民に存することを宣言し」）"},{"t":"mc","s":"主権","imp":2,"q":"次の文中の「主権」のうち、「国の政治のあり方を最終的に決定する力」という意味で用いられているものとして最も適当なものを一つ選べ。","c":["ポツダム宣言の「日本国ノ主権ハ本州、北海道、九州及四国並ニ吾等ノ決定スル諸小島ニ局限セラルベシ」","日本国憲法前文の「自国の主権を維持し、他国と対等関係に立たうとする各国の責務である」","日本国憲法前文の「ここに主権が国民に存することを宣言し、この憲法を確定する」","主権国家は、他国から干渉されることなく、自国の政治体制を自ら選ぶことができる。"],"a":2,"e":"「主権が国民に存する」は、国の政治のあり方を最終的に決めるのは国民であるという国民主権を示しており、最高決定権の意味である。ポツダム宣言の例は国家の支配権が及ぶ範囲を示すので統治権の意味である。「自国の主権を維持し」や、他国から干渉されないという意味の主権は、対外的な独立性（最高独立性）の意味である。"},{"t":"qa","s":"国家の役割の変化","imp":3,"q":"国家の役割を国防や治安の維持など必要最小限にとどめ、経済活動には干渉しない18〜19世紀の自由主義的な国家を、ドイツの社会主義者ラッサールが批判的に何とよんだか。","a":"夜警国家","alt":["消極国家"],"e":"自由放任（レッセ・フェール）を原則とし、「小さな政府」「消極国家」ともいう。ラッサールは、国家が夜回りの番人のように財産の警備しかしないと皮肉った。これに対し、20世紀に登場した、国民の生活の保障に積極的に取り組む国家を福祉国家（積極国家）という。"},{"t":"ex","s":"国家の役割の変化","imp":3,"q":"夜警国家から福祉国家へと国家の役割が変化した理由と、福祉国家の特徴を説明せよ。","a":"19世紀に資本主義が発展すると、貧富の差の拡大や失業、劣悪な労働条件などの社会問題が深刻になり、国家が経済に介入しない自由放任のままでは人々の生活を守れなくなった。そこで20世紀には、国家が経済に積極的に介入して景気や雇用の安定を図り、社会保障などを通じて国民の人間らしい生活を保障する福祉国家（積極国家、大きな政府）が登場した。","e":"ポイント：①資本主義の発展による貧富の差・失業などの社会問題 ②自由放任では生活を守れない ③福祉国家は経済への積極的な介入と社会保障で国民の生存を保障する（社会権の保障と結びつく）"},{"t":"qa","s":"国家の役割の変化","imp":2,"q":"福祉国家化にともなって行政の役割が拡大し、行政部が政策の立案や執行の中心となって議会に対して優位に立つようになった現代の国家を何というか。","a":"行政国家","e":"19世紀の、議会が中心となって法律を制定し、国家の役割が小さかった国家を立法国家という。行政国家では、法律の細部を行政機関が命令で定める委任立法が増え、専門知識をもつ官僚の影響力が強まるため、行政に対する民主的な統制が課題となる。"},{"t":"mc","s":"国家の役割の変化","imp":2,"q":"国家の役割の変化についての記述として最も適当なものを一つ選べ。","c":["夜警国家は、国家の役割を国防や治安の維持などに限定し、経済活動は個人の自由な競争に委ねた。","福祉国家では、国家は経済活動に一切介入せず、生活に困った人の救済は民間の慈善活動にまかされる。","19世紀には、行政部が議会よりも優位に立つ行政国家が一般的であった。","夜警国家という言葉は、自由放任の国家を理想としたアダム・スミスが、その長所をたたえて名づけたものである。"],"a":0,"e":"夜警国家は自由放任を原則とする「小さな政府」である。福祉国家は経済に積極的に介入して社会保障を整える「大きな政府」なので誤り。19世紀は議会中心の立法国家の時代であり、行政国家化が進んだのは20世紀なので誤り。夜警国家はラッサールが自由主義国家を批判して用いた言葉なので誤り。"},{"t":"qa","s":"支配の正統性","imp":3,"q":"支配が人々に正しいものとして受け入れられる根拠（正統性）によって、支配を伝統的支配・カリスマ的支配・合法的支配の3つに分類したドイツの社会学者は誰か。","a":"マックス・ウェーバー","alt":["ウェーバー","ヴェーバー","マックス・ヴェーバー","M.ウェーバー"],"e":"ウェーバーは『職業としての政治』などで知られ、近代国家を「正当な物理的暴力の行使を独占する組織」と定義したことや、近代官僚制の分析でも有名である。"},{"t":"ex","s":"支配の正統性","imp":2,"q":"マックス・ウェーバーが示した支配の3類型（伝統的支配・カリスマ的支配・合法的支配）を、それぞれ説明せよ。","a":"伝統的支配は、昔から続いてきた慣習や血統などの伝統の神聖さを根拠とする支配で、世襲の君主による支配がその例である。カリスマ的支配は、支配者の超人的で非凡な能力や資質に対する人々の情緒的な帰依を根拠とする支配である。合法的支配は、正当な手続きで定められた法や規則に従うことを根拠とする支配で、近代の官僚制がその典型である。","e":"ポイント：①伝統的支配＝伝統・慣習・血統の神聖さ（世襲の君主制） ②カリスマ的支配＝支配者個人の非凡な資質への帰依（英雄・預言者・革命の指導者） ③合法的支配＝合法的に定められた規則への服従（近代官僚制）"},{"t":"mc","s":"支配の正統性","imp":3,"q":"次の事例のうち、ウェーバーのいうカリスマ的支配にあたるものとして最も適当なものを一つ選べ。","c":["先祖代々受け継がれてきた王位にあることを理由に、国王が臣民を従わせている。","憲法と法律に定められた手続きで選ばれた大統領が、法に基づいて行政を指揮している。","戦乱の中で現れた英雄が、その非凡な能力と人格的な魅力によって人々の熱狂的な支持を集め、統治している。","官僚が、法律や規則で定められた権限の範囲内で、上司の命令に従って職務を遂行している。"],"a":2,"e":"支配者個人の非凡な資質への帰依が根拠となっているので、カリスマ的支配である。代々受け継がれた王位を根拠とするのは伝統的支配である。法の手続きで選ばれた大統領の統治や、規則に基づく官僚の職務遂行は、合法的支配にあたる。"},{"t":"qa","s":"王権神授説","imp":3,"q":"国王の権力は神から直接授けられたものであり、国王は神に対してのみ責任を負い、人民は国王に絶対的に服従しなければならないとする説を何というか。","a":"王権神授説","alt":["王権神授論","帝王神権説"],"e":"16〜18世紀のヨーロッパで絶対王政を正当化した理論で、イギリスのジェームズ1世やフィルマー、フランスのボシュエらが唱えた。ロックは『統治二論』でフィルマーの説を批判し、社会契約説を展開した。"},{"t":"tf","s":"王権神授説","imp":3,"q":"王権神授説は、国王の権力は人民との契約に由来すると説き、市民革命を理論的に支えた。","a":false,"e":"正しくは、王権神授説は国王の権力は神から授けられたと説いて絶対王政を正当化した。国家の権力は人々の契約（合意）に由来すると説いたのは社会契約説であり、とくにロックやルソーの思想が市民革命を理論的に支えた。"}]});</script>
<script>QDATA.push({"unit":"u04","questions":[{"t":"qa","s":"社会契約説","imp":3,"q":"国家や政府は、生まれながらに自由で平等な個人どうしが、自らの権利を守るために結んだ契約（合意）によってつくられたとする考え方を何というか。","a":"社会契約説","alt":["社会契約論"],"e":"17〜18世紀にホッブズ・ロック・ルソーらが唱えた。国家のない「自然状態」を想定し、そこで人々がもつ「自然権」を守るために「社会契約」を結んで国家をつくると考える。国王の権力は神に由来するとした王権神授説を否定し、近代民主政治の理論的な基礎となった。"},{"t":"qa","s":"社会契約説","imp":2,"q":"人間が国家や法律によって与えられたのではなく、生まれながらにしてもっている権利を何というか。","a":"自然権","alt":["天賦人権","天賦の権利"],"e":"社会契約説では、自然権をどのように守るかが国家をつくる目的とされた。また、人間の理性に基づき、時代や場所を超えて普遍的に妥当する法を自然法という。自然権の内容は思想家によって異なり、ロックは生命・自由・財産を挙げた。"},{"t":"qa","s":"ホッブズ","imp":3,"q":"『リヴァイアサン』を著し、人々は自己保存のために自然権を国家（主権者）に全面的に譲渡し、それに服従すべきだと説いた17世紀イギリスの思想家は誰か。","a":"ホッブズ","alt":["トマス・ホッブズ","ホッブス"],"e":"『リヴァイアサン』は1651年に刊行された。リヴァイアサンは『旧約聖書』に登場する巨大な怪物の名で、強大な国家権力をたとえたものである。ホッブズはピューリタン革命期の内乱を経験し、秩序と平和のためには強力な国家が必要だと考えた。"},{"t":"qa","s":"ホッブズ","imp":3,"q":"ホッブズは、国家のない自然状態では、人々が自己保存のために互いに争い合う「（　）」の状態になると考えた。（　）に入る語句を答えよ。","a":"万人の万人に対する闘争","alt":["万人の万人に対する戦い","万人の万人に対する戦争","万人の万人に対する闘い"],"e":"ホッブズは、人間は自己保存の欲求に基づいて行動し、能力もほぼ平等なので、ものを奪い合う自然状態は「人間は人間に対して狼」であるような悲惨な状態になると考えた。この状態から逃れるために、人々は社会契約を結ぶとした。"},{"t":"ex","s":"ホッブズ","imp":3,"q":"ホッブズの社会契約説を、自然状態・社会契約・その結果の順に説明せよ。","a":"ホッブズは、人間は自己保存の欲求をもち、国家のない自然状態では各人が自然権を行使して争い合う「万人の万人に対する闘争」に陥ると考えた。そこで人々は平和と安全を得るため、契約によって自然権を主権者に全面的に譲渡し、その命令に服従すべきだとした。主権者への抵抗を基本的に認めないこの理論は、結果として絶対王政を擁護するものとなった。","e":"ポイント：①自然状態＝万人の万人に対する闘争 ②自己保存のため自然権を主権者に全面的に譲渡 ③主権者に服従し抵抗権は認めない→結果として絶対王政を擁護"},{"t":"tf","s":"ホッブズ","imp":2,"q":"ホッブズは、政府が人民の自然権を侵害した場合には、人民は抵抗権を行使して政府を取りかえることができると説き、名誉革命を正当化した。","a":false,"e":"正しくは、ホッブズは自然権を主権者に全面的に譲渡して服従すべきだと説き、抵抗権を基本的に認めなかったため、結果として絶対王政を擁護した。抵抗権（革命権）を認め、名誉革命を正当化したのはロックである。"},{"t":"qa","s":"ロック","imp":3,"q":"『統治二論（市民政府二論）』を著し、政府が人民の自然権を侵害した場合には、人民は抵抗権（革命権）を行使できると説いたイギリスの思想家は誰か。","a":"ロック","alt":["ジョン・ロック"],"e":"『統治二論』は名誉革命の直後に刊行され、名誉革命を理論的に正当化した。また、アメリカ独立宣言にも大きな影響を与えた。人間の心は生まれたときは白紙（タブラ・ラサ）であるとした経験論の哲学者としても知られる。"},{"t":"qa","s":"ロック","imp":3,"q":"ロックが、人間が生まれながらにもつ自然権の内容として挙げた3つの権利を答えよ。","a":"生命・自由・財産","alt":["生命、自由、財産","生命・自由・財産権","生命と自由と財産"],"e":"ロックはとくに財産（所有権）を重視し、自分の身体を使った労働によって得たものは、その人の所有物になると考えた。アメリカ独立宣言では「生命、自由および幸福の追求」と表現されている。"},{"t":"qa","s":"ロック","imp":2,"q":"ロックの社会契約説において、人々が自然権をより確実に守る目的のために、政府をつくって権力の行使を任せることを何というか。","a":"信託","e":"ホッブズが自然権の全面的な「譲渡」を説いたのに対し、ロックは「信託」とした。政府は人民から信託された目的の範囲内でしか権力を行使できず、信託に反して自然権を侵害すれば、人民は抵抗権を行使して政府を取りかえることができる。"},{"t":"ex","s":"ロック","imp":3,"q":"ロックの社会契約説を、自然状態・社会契約・抵抗権の順に説明せよ。","a":"ロックは、自然状態を、人々が自然法のもとで自由・平等に暮らす基本的に平和な状態と考えたが、争いを公平に裁く機関がないため、自然権（生命・自由・財産）の保障は不安定であるとした。そこで人々は契約によって政府をつくり、自然権を守るための権力を政府に信託する。政府が信託に反して自然権を侵害した場合、人民は抵抗権（革命権）を行使して政府を取りかえることができる。","e":"ポイント：①自然状態＝基本的に平和だが自然権の保障は不安定 ②契約で政府をつくり権力を信託 ③信託違反には抵抗権（革命権）→名誉革命の正当化、アメリカ独立宣言に影響。人民の代表による議会を重視する間接民主制を説いた"},{"t":"tf","s":"ロック","imp":2,"q":"ロックの思想は、名誉革命を正当化するとともに、のちにアメリカ独立宣言に大きな影響を与えた。","a":true,"e":"ロックの抵抗権の思想は、アメリカ独立宣言の「いかなる政治の形体といえども、もしこれらの目的を毀損するものとなった場合には、人民はそれを改廃し、新たな政府を組織する権利を有する」という部分に反映されている。"},{"t":"tf","s":"ロック","imp":2,"q":"ロックは、人民が代表者を選ぶ議会政治を否定し、人民が直接集まって法をつくる直接民主制を主張した。","a":false,"e":"正しくは、ロックは人民が選んだ代表者による議会に立法権を委ねる間接民主制（代議制）を主張し、議会の立法権を最高の権力とした。代表制を批判して直接民主制を主張したのはルソーである。"},{"t":"qa","s":"ルソー","imp":3,"q":"『社会契約論』を著し、人民主権と直接民主制を主張した、ジュネーヴ生まれでフランスで活躍した18世紀の思想家は誰か。","a":"ルソー","alt":["ジャン=ジャック・ルソー","ジャン・ジャック・ルソー","J.J.ルソー"],"e":"『社会契約論』は1762年刊。ルソーの人民主権の思想は、フランス革命に大きな影響を与えた。同じ年に刊行された『エミール』では、子どもの自然な成長を重んじる教育論を説いた。"},{"t":"qa","s":"ルソー","imp":3,"q":"ルソーが、個人の私的な利益を求める特殊意志や、その総和である全体意志とは区別した、つねに社会全体の共通の利益（公共の利益）をめざす人民の意志を何というか。","a":"一般意志","alt":["一般意思"],"e":"ルソーは、人々が社会契約によって共同体をつくり、すべての人が一般意志に従うことで、自然状態の自由に代わる真の自由（市民的自由）が得られるとした。一般意志は譲り渡すことも代表されることもできないため、主権は人民にあり（人民主権）、人民が直接政治に参加すべきだとした。"},{"t":"mc","s":"ルソー","imp":2,"q":"ルソーは「イギリスの人民は自由だと思っているが、それは大まちがいだ。彼らが自由なのは議員を選挙する間だけのことで、議員が選ばれるやいなや、イギリス人民は奴隷となり、無に帰してしまう」と述べた。ルソーがこのように主張した理由として最も適当なものを一つ選べ。","c":["議会が国王の権力を制限しすぎたため、国家の統一が失われたと考えたから。","主権は一般意志の行使であり、他人によって代表されえないと考えたから。","人民は自然権を主権者に全面的に譲渡しているので、選挙は不要だと考えたから。","議会の立法権は最高の権力であり、人民の抵抗権は認められないと考えたから。"],"a":1,"e":"ルソーは、主権は一般意志の行使であって譲り渡すことも代表されることもできないと考え、議員に政治を任せるイギリスの代議制を批判して直接民主制を主張した。自然権の全面的な譲渡はホッブズの考え方である。議会の立法権を最高とするのはロックの考え方であり、ロックは抵抗権も認めている。国家の統一の喪失は、ルソーの主張とは関係がない。"},{"t":"ex","s":"ルソー","imp":2,"q":"ルソーの社会契約説を、自然状態・社会契約・政治体制の順に説明せよ。","a":"ルソーは、自然状態の人間は自由・平等で、自己愛とあわれみの情をもって平和に暮らしていたが、私有財産の発生とともに不平等や支配が生まれたと考えた。そこで人々は社会契約によって共同体をつくり、公共の利益をめざす一般意志に従うことで真の自由を回復すべきだとした。一般意志は代表されえないため、人民主権に基づく直接民主制を主張した。","e":"ポイント：①自然状態＝自由・平等で平和（私有財産の発生で不平等が生まれた：『人間不平等起源論』） ②社会契約で共同体をつくり一般意志に従う ③人民主権・直接民主制→フランス革命に影響"},{"t":"qa","s":"ルソー","imp":1,"q":"ルソーが、自然状態では自由で平等だった人間の間に、私有財産の発生などによって不平等が生まれた過程を論じた著書は何か。","a":"『人間不平等起源論』","alt":["人間不平等起源論","不平等起源論"],"e":"1755年刊。ルソーは、土地に囲いをして「これはおれのものだ」と言い出した最初の人が文明社会の創始者であると述べ、私有財産が不平等の起源であるとした。この問題意識が『社会契約論』へとつながった。"},{"t":"tf","s":"ルソー","imp":2,"q":"ルソーは、主権は人民にあり、それは譲り渡すことも分割することもできず、代表されることもないと考えた。","a":true,"e":"ルソーにとって主権とは一般意志の行使であり、人民自身が行使しなければならない。このため、代表者に主権を委ねる代議制を批判し、人民が直接立法に参加する直接民主制を理想とした。"},{"t":"mc","s":"社会契約説の比較","imp":3,"q":"ホッブズ・ロック・ルソーの思想についての記述として最も適当なものを一つ選べ。","c":["ホッブズは、政府が自然権を侵害した場合には、人民は抵抗権を行使できると説いた。","ロックは、一般意志に基づく人民主権を唱え、代表制を否定して直接民主制を主張した。","ホッブズは、人民の代表である議会に権力を信託する間接民主制を主張した。","ルソーは、自然状態を自由で平等な状態ととらえ、一般意志に基づく直接民主制を主張した。"],"a":3,"e":"ルソーの説明として正しい。抵抗権を説いたのはロックであり、ホッブズは自然権の全面的な譲渡と主権者への服従を説いたので誤り。一般意志・人民主権・直接民主制はルソーの思想であり、ロックは間接民主制を説いたので誤り。議会への信託と間接民主制はロックの思想なので、ホッブズの説明としては誤り。"},{"t":"mc","s":"社会契約説の比較","imp":1,"q":"社会契約説を唱えた思想家と、その思想が理論的な影響を与えた出来事の組合せとして最も適当なものを一つ選べ。","c":["ホッブズ：フランス革命","ルソー：名誉革命","ロック：アメリカ独立宣言","ルソー：権利章典"],"a":2,"e":"ロックの自然権・抵抗権の思想は、アメリカ独立宣言に大きな影響を与えた。ルソーの人民主権の思想が影響を与えたのはフランス革命である。名誉革命（1688〜89年）と権利章典（1689年）は、ルソー（1712年生まれ）が生まれる前の出来事であり、名誉革命を正当化したのはロックである。ホッブズの思想は、結果として絶対王政を擁護するものだった。"},{"t":"tf","s":"社会契約説の比較","imp":2,"q":"ホッブズとロックはいずれも、国家のない自然状態を、人々が争うことなく平和に暮らしている状態と考えた。","a":false,"e":"正しくは、ホッブズは自然状態を「万人の万人に対する闘争」の状態ととらえた。ロックは自然状態を基本的には平和な状態としたが、自然権の保障は不安定であると考えた。自然状態のとらえ方の違いが、ホッブズの全面的な譲渡とロックの信託という違いにつながっている。"},{"t":"mc","s":"社会契約説の比較","imp":2,"q":"次の主張をした思想家として最も適当なものを一つ選べ。「人々が政府をつくるのは、自然状態でもっていた生命・自由・財産をより確実に守るためである。したがって、政府がこの目的に反して人々の権利を侵害するならば、人々は政府に抵抗し、新たな政府をつくることができる。」","c":["ホッブズ","ルソー","ロック","モンテスキュー"],"a":2,"e":"生命・自由・財産の自然権、政府への信託、抵抗権（革命権）はロックの思想の特徴である。ホッブズは抵抗権を基本的に認めず、ルソーは一般意志と直接民主制を説いた。モンテスキューは『法の精神』で三権分立を説いた思想家である。"},{"t":"mc","s":"社会契約説の比較","imp":2,"q":"ある国で、政府が法律の根拠なく反対派の人々の財産を没収し、言論を弾圧し始めた。この状況についてロックの立場から述べた主張として最も適当なものを一つ選べ。","c":["政府は人民の自然権を守るという信託に反したのだから、人民は抵抗し、政府を取りかえることができる。","人民は自然権を主権者に全面的に譲渡したのだから、政府のどのような命令にも服従しなければならない。","国王の権力は神から授けられたものなので、人民には政府に抵抗する権利はない。","主権は代表されえないのだから、人民は議会を廃止し、直ちに直接民主制に移行しなければならない。"],"a":0,"e":"ロックによれば、政府は人民の自然権を守るために権力を信託されたにすぎず、信託に反すれば人民は抵抗権（革命権）を行使できる。全面的な譲渡と服従はホッブズ、神から授けられた権力は王権神授説、主権は代表されえないとするのはルソーの考え方である。"}]});</script>
<script>QDATA.push({"unit":"u04","questions":[{"t":"qa","s":"権力分立","imp":3,"q":"『法の精神』を著し、国家権力を立法権・行政権（執行権）・司法権の三権に分け、それぞれを別の機関に担わせて相互に抑制と均衡を図るべきだと説いたフランスの思想家は誰か。","a":"モンテスキュー","e":"『法の精神』は1748年刊。モンテスキューはイギリスの政治制度を参考にして三権分立を体系化した。三権分立の考え方は、とくにアメリカ合衆国憲法で厳格に採用された。"},{"t":"qa","s":"権力分立","imp":3,"q":"権力分立において、それぞれの権力が互いに抑え合い、つり合いを保つことで権力の濫用を防ぐしくみを何というか。","a":"抑制と均衡","alt":["チェック・アンド・バランス","チェックアンドバランス","抑制均衡"],"e":"英語でチェック・アンド・バランスという。日本国憲法でも、衆議院の内閣不信任決議と内閣の衆議院解散、裁判所の違憲審査、国会による弾劾裁判所の設置など、三権が互いを抑制するしくみが設けられている。"},{"t":"ex","s":"権力分立","imp":3,"q":"権力分立とはどのようなしくみか、また何のために必要とされるのかを説明せよ。","a":"権力分立とは、国家権力を立法・行政・司法などに分け、それぞれを別の機関に担当させて、互いに抑制と均衡を図らせるしくみである。権力が一つの機関や人物に集中すると濫用されて国民の自由や権利が侵害されるおそれがあるため、権力を分散させて相互に監視させることで、権力の濫用を防ぎ、国民の自由を守ることを目的とする。","e":"ポイント：①国家権力を立法・行政・司法に分ける ②別々の機関に担わせ、抑制と均衡を図る ③権力の集中・濫用を防ぎ、国民の自由と権利を守る"},{"t":"qa","s":"権力分立","imp":2,"q":"ロックは、国家権力を立法権と執行権・同盟権（連合権）とに分けたが、そのうち最高の権力として位置づけたのはどの権力か。","a":"立法権","e":"ロックは、人民の代表からなる議会がもつ立法権を最高の権力とし、執行権と同盟権（外交に関する権力）は国王がもつとした。司法権を独立させ、三権を対等なものとして抑制と均衡を図らせたのはモンテスキューである。"},{"t":"tf","s":"権力分立","imp":3,"q":"ロックは、立法権・行政権・司法権の三権を対等なものとし、それぞれを別の機関に担わせて相互に抑制と均衡を図る三権分立を説いた。","a":false,"e":"正しくは、三権分立を説いたのはモンテスキューである。ロックは国家権力を立法権と執行権・同盟権に分け、議会の立法権を優位に置く権力分立を説いた（ロックの分類では司法権は独立した権力として扱われていない）。"},{"t":"tf","s":"権力分立","imp":2,"q":"モンテスキューは、同一の人間や機関が立法権と行政権をあわせもつと自由は失われると考え、さらに裁判をする権力も立法権・行政権から分離されていなければ自由はないと述べた。","a":true,"e":"モンテスキューは、権力をもつ者はすべてそれを濫用しがちであると考え、権力の濫用を防ぐには「権力が権力を抑制する」しくみが必要だとした。司法権の独立を明確に位置づけた点が、ロックとの大きな違いである。"},{"t":"mc","s":"権力分立","imp":2,"q":"次の事例のうち、権力分立の考え方に反するものとして最も適当なものを一つ選べ。","c":["裁判所が、議会の制定した法律を憲法に違反すると判断し、その適用を認めなかった。","議会が、行政の長である大統領の不正について調査し、責任を追及した。","国王が、議会の同意を得ずに自ら法律を制定し、その法律に基づいて自ら裁判を行い刑罰を科した。","行政の長である大統領が、議会の可決した法案に対して拒否権を行使した。"],"a":2,"e":"一人の国王が立法権と司法権（さらに行政権）をあわせもっており、権力の集中にあたるので、権力分立に反する。裁判所の違憲審査、議会による行政の監視、大統領の法案拒否権は、いずれも権力どうしが互いに抑制し合う「抑制と均衡」の例である。"},{"t":"qa","s":"法の支配","imp":3,"q":"国王や政府などの権力者も法に従わなければならず、法によって権力を拘束することで国民の権利や自由を守ろうとする原理を何というか。","a":"法の支配","e":"中世以来のイギリスで発達した原理である。ここでいう「法」は、権力者が自由に定めたものではなく、国民の権利や自由を守る正しい内容をもつ法（イギリスではコモン・ロー）をさす。権力者が恣意的に支配する「人の支配」と対比される。"},{"t":"qa","s":"法の支配","imp":3,"q":"13世紀イギリスの法律家ブラクトンの言葉「国王は何人の下にもあるべきではない。しかし国王といえども神と（　）の下にあるべきである」の（　）に入る語を答えよ。","a":"法","alt":["法律"],"e":"国王も法に従うべきだという法の支配の考え方を示す言葉である。17世紀にコーク（クック）が、国王ジェームズ1世に対してこの言葉を引用し、コモン・ローの優位を主張した。"},{"t":"qa","s":"法の支配","imp":1,"q":"17世紀前半のイギリスで、王権神授説をとる国王ジェームズ1世に対してブラクトンの言葉を引用し、国王もコモン・ローに従うべきだと主張した裁判官は誰か。","a":"エドワード・コーク","alt":["コーク","クック","エドワード・クック"],"e":"コーク（クック）は、のちに議会の指導者として1628年の権利請願の起草にも中心的な役割を果たした。法の支配の確立に大きく貢献した人物である。"},{"t":"qa","s":"法の支配","imp":1,"q":"イギリスで、中世以来の裁判所の判例が積み重なって形成されてきた、国王をも拘束するとされた慣習法を何というか。","a":"コモン・ロー","alt":["コモンロー","普通法"],"e":"コモン・ローは、議会が制定した成文の法律（制定法）とは異なり、裁判の積み重ねによって形成された判例法である。法の支配の「法」とは、このように国民の権利を守るものとして長い歴史の中で形成されてきた法を意味した。"},{"t":"ex","s":"法の支配","imp":3,"q":"「法の支配」と、19世紀のドイツで発達した（形式的）法治主義との違いを説明せよ。","a":"法の支配は、イギリスで発達した原理で、権力者も法に従わなければならないとするとともに、その法の内容が国民の権利や自由を守る正しいものであることを求める。これに対し形式的法治主義は、行政は議会が制定した法律に基づいて行われなければならないとするが、法律の内容の正しさは問わないため、法律の形式さえ整えば人権を制限することも可能であった。","e":"ポイント：①法の支配＝イギリスで発達、法の内容の正しさ（人権の保障）を重視 ②形式的法治主義＝ドイツで発達、法律の形式を重視し内容は問わない ③法律による人権の制限が可能になる危険（ナチスの全権委任法など）。第二次世界大戦後のドイツは、法律の内容の正しさも求める実質的法治主義へと転換した"},{"t":"mc","s":"法の支配","imp":3,"q":"法の支配と法治主義についての記述として最も適当なものを一つ選べ。","c":["法の支配はドイツで発達した原理で、法律の形式が整っていれば、その内容が人権を侵害するものであっても問題としない。","法の支配の考え方では、国王や政府も法に従わなければならず、その法の内容も国民の権利を守る正しいものであることが求められる。","形式的法治主義は法律の内容の正しさを重視するため、人権を制限する法律の制定は一切認められなかった。","法の支配の原理は、国王の権力は法を超越するものであるとして、イギリスの絶対王政を正当化した。"],"a":1,"e":"法の支配は、権力者も法に従い、その法の内容も正しいものであることを求める原理である。「ドイツで発達し、形式が整っていれば内容は問わない」とする記述は、形式的法治主義の説明なので誤り。形式的法治主義は内容の正しさを問わないため、法律による人権の制限も可能であったので誤り。法の支配は国王の権力を法によって制限する原理なので、絶対王政を正当化したとする記述も誤り。"},{"t":"tf","s":"法の支配","imp":2,"q":"形式的法治主義のもとでは、議会が制定した法律に基づきさえすれば、その法律によって国民の権利や自由を制限することも可能であった。","a":true,"e":"形式的法治主義は法律の内容の正しさを問わないため、権利は「法律の範囲内」でしか保障されないことになりやすい。ナチス・ドイツが全権委任法によって独裁体制を築いたことは、その危険性を示す例とされる。"},{"t":"qa","s":"立憲主義","imp":3,"q":"憲法によって国家権力を制限し、国民の権利や自由を保障しようとする考え方を何というか。","a":"立憲主義","e":"立憲主義の考え方では、憲法は国民を縛るものではなく、国家権力を縛るためのものである。フランス人権宣言第16条は「権利の保障が確保されず、権力の分立が定められていないすべての社会は、憲法をもつものではない」と述べ、人権保障と権力分立を憲法に不可欠な要素とした。"},{"t":"tf","s":"立憲主義","imp":2,"q":"立憲主義における憲法は、主として国民の行動を規制するための規範であり、国家権力を制限することを目的としたものではない。","a":false,"e":"正しくは、立憲主義における憲法は、国家権力を制限して国民の権利や自由を守るための規範である。日本国憲法第99条も、憲法を尊重し擁護する義務を負う者として、天皇・摂政・国務大臣・国会議員・裁判官その他の公務員を挙げており、国民は挙げられていない。"},{"t":"qa","s":"立憲主義","imp":1,"q":"憲法は制定されているものの、君主の権力が強く、国民の権利も法律の範囲内でしか保障されないなど、立憲主義が形だけのものにとどまっている体制を何というか。","a":"外見的立憲主義","alt":["外見的立憲制","外見的立憲君主制"],"e":"19世紀のプロイセン憲法や、それを参考にした大日本帝国憲法がその例とされる。大日本帝国憲法では、臣民の権利は「法律の範囲内」で認められるにとどまった（法律の留保）。"}]});</script>
<script>QDATA.push({"unit":"u04","questions":[{"t":"qa","s":"イギリスの人権保障","imp":3,"q":"1215年、イギリスの貴族たちが国王ジョンに認めさせた、国王による勝手な課税の制限や、法によらない逮捕・投獄の禁止などを定めた文書は何か。","a":"マグナ・カルタ","alt":["大憲章","マグナカルタ"],"e":"大憲章ともいう。本来は貴族などの封建的な特権を国王に確認させたものであり、国民一般の人権を保障したものではない。しかし、国王の権力も法によって制限されるという考え方の出発点となり、のちに法の支配や人権保障の源流と位置づけられた。"},{"t":"qa","s":"イギリスの人権保障","imp":2,"q":"1628年にイギリス議会が国王チャールズ1世に提出し、議会の同意のない課税や、法によらない逮捕・投獄の禁止などを認めさせた文書は何か。","a":"権利請願","alt":["権利の請願"],"e":"コーク（クック）が起草の中心となった。チャールズ1世はいったん承認したが、翌年に議会を解散して専制政治を続けたため議会との対立が深まり、1640年代のピューリタン革命へとつながった。"},{"t":"qa","s":"イギリスの人権保障","imp":3,"q":"名誉革命の翌年の1689年に制定され、議会の同意のない課税や国王による法律の停止を禁止し、議会内での言論の自由などを定めて議会の優位を確立したイギリスの法律は何か。","a":"権利章典","alt":["権利の章典"],"e":"名誉革命（1688〜89年）で即位したウィリアム3世とメアリ2世が承認した権利宣言を、法律として制定したものである。これにより、イギリスでは国王の権力が議会によって制限される立憲君主制の基礎が確立した。"},{"t":"mc","s":"イギリスの人権保障","imp":2,"q":"イギリスの人権保障の歴史についての記述として最も適当なものを一つ選べ。","c":["マグナ・カルタは、イギリスのすべての国民に、生まれながらの人権を初めて保障した文書である。","権利請願は、名誉革命によって即位したウィリアム3世とメアリ2世が承認したものである。","権利章典は、すべての成年男女に選挙権を保障し、イギリスの民主政治を完成させた。","権利章典は、議会の同意のない課税を禁止するなど議会の権限を確立し、立憲君主制の基礎となった。"],"a":3,"e":"権利章典の説明として正しい。マグナ・カルタは貴族などの特権を確認したもので、国民一般の人権を保障したものではないので誤り。名誉革命で即位したウィリアム3世とメアリ2世が承認したのは権利宣言（これを法律化したのが権利章典）であり、権利請願はチャールズ1世に提出されたものなので誤り。イギリスで男女平等の普通選挙が実現したのは20世紀（1928年）なので誤り。"},{"t":"ex","s":"イギリスの人権保障","imp":1,"q":"イギリスで国王の権力が法と議会によって制限されていった過程を、マグナ・カルタ・権利請願・権利章典にふれて説明せよ。","a":"1215年のマグナ・カルタは、貴族が国王に課税の制限などを認めさせたもので、国王も法に従うべきだという考え方の出発点となった。1628年の権利請願では、議会がチャールズ1世に、議会の同意のない課税や不当な逮捕の禁止を認めさせた。名誉革命後の1689年の権利章典で議会の権限が法的に確立し、立憲君主制の基礎が築かれた。","e":"ポイント：①マグナ・カルタ（1215年）＝国王ジョン、貴族の特権の確認、法の支配の出発点 ②権利請願（1628年）＝チャールズ1世、コークが起草の中心 ③権利章典（1689年）＝名誉革命後、議会の優位と立憲君主制の確立"},{"t":"qa","s":"アメリカの独立","imp":2,"q":"1776年6月に採択され、すべての人が生まれながらにもつ権利として生命と自由の享受、財産の取得・所有などを明記した、近代的な人権宣言の先駆とされるアメリカの州の権利章典は何か。","a":"バージニア権利章典","alt":["ヴァージニア権利章典","バージニア州権利章典","バージニア権利宣言","ヴァージニア権利宣言"],"e":"アメリカ独立宣言（1776年7月）に先立って採択され、自然権の思想や、政府が目的に反する場合に人民が政府を改革・廃止する権利などを定めた。成文で人権を保障した最初の例とされる。"},{"t":"qa","s":"アメリカの独立","imp":3,"q":"アメリカ独立宣言の一節「われわれは、自明の真理として、すべての人は平等に造られ、造物主によって一定の奪いがたい天賦の権利を付与され、その中に生命、自由および（　）の追求の含まれることを信ずる」の（　）に入る語を答えよ。","a":"幸福","e":"アメリカ独立宣言は1776年7月4日に発表され、ジェファーソンらが起草した。ロックの自然権思想の影響を強く受けている。"},{"t":"tf","s":"アメリカの独立","imp":2,"q":"アメリカ独立宣言は、政府の正当な権力は被治者の同意に由来し、政府が人民の権利を損なう場合には、人民はその政府を改廃し新たな政府を組織する権利をもつと述べている。","a":true,"e":"政府は人民の権利を守るためにつくられ、その目的に反すれば人民は政府を取りかえることができるという考え方は、ロックの信託と抵抗権（革命権）の思想を受け継いだものである。"},{"t":"tf","s":"アメリカの独立","imp":1,"q":"アメリカ独立宣言は、フランス人権宣言の理念を取り入れて起草された。","a":false,"e":"正しくは、アメリカ独立宣言（1776年）のほうがフランス人権宣言（1789年）よりも先であり、アメリカ独立革命の理念がフランス人権宣言に影響を与えた。フランス人権宣言の起草にかかわったラ・ファイエットは、アメリカ独立戦争に参加した人物である。"},{"t":"qa","s":"フランス人権宣言","imp":3,"q":"1789年、フランス革命の中で国民議会が採択し、「人は、自由かつ権利において平等なものとして出生し、かつ生存する」とうたった宣言は何か。","a":"フランス人権宣言","alt":["人権宣言","人および市民の権利宣言","人間と市民の権利の宣言","人間および市民の権利宣言"],"e":"正式名称は「人および市民の権利宣言」。自由・所有権・安全・圧政への抵抗を自然権とし、国民主権、法の前の平等、権力分立、所有権の神聖不可侵などを定めた。ロックやルソーの思想の影響を受けている。"},{"t":"qa","s":"フランス人権宣言","imp":3,"q":"フランス人権宣言第16条「権利の保障が確保されず、（　）が定められていないすべての社会は、憲法をもつものではない」の（　）に入る語句を答えよ。","a":"権力の分立","alt":["権力分立","権力の分離"],"e":"憲法には人権の保障と権力分立の2つが不可欠であるとし、立憲主義の核心を示した条文である。「憲法」という名前の文書があるだけでは、本当の意味で憲法をもつとはいえないという考え方である。"},{"t":"tf","s":"フランス人権宣言","imp":2,"q":"フランス人権宣言は、所有権の不可侵とともに、生存権などの社会権を初めて体系的に保障した宣言である。","a":false,"e":"正しくは、フランス人権宣言が保障したのは主に自由権であり、所有権は「神聖で不可侵の権利」とされた。生存権などの社会権を本格的に憲法で保障したのは、20世紀の1919年に制定されたドイツのワイマール憲法である。"},{"t":"qa","s":"ワイマール憲法","imp":3,"q":"第一次世界大戦後の1919年にドイツで制定され、世界で初めて生存権などの社会権を本格的に保障したとされる憲法は何か。","a":"ワイマール憲法","alt":["ヴァイマル憲法","ワイマル憲法","ヴァイマール憲法"],"e":"第151条で「経済生活の秩序は、すべての者に人間たるに値する生存を保障することを目的とする正義の原則に適合しなければならない」と定め、生存権を保障した。男女平等の普通選挙も定めるなど、当時最も民主的な憲法といわれた。"},{"t":"qa","s":"ワイマール憲法","imp":2,"q":"ワイマール憲法第153条「所有権は（　）を伴う。その行使は、同時に公共の福祉に役立つべきである」の（　）に入る語を答えよ。","a":"義務","e":"18世紀の人権宣言では所有権は「神聖不可侵」とされたが、ワイマール憲法では、所有権も社会全体の利益のために制約を受けるものとされた。財産権の社会的な制約という考え方は、日本国憲法第29条（財産権の内容は公共の福祉に適合するように法律で定める）にも受け継がれている。"},{"t":"ex","s":"ワイマール憲法","imp":3,"q":"18世紀の人権宣言で保障された人権と、ワイマール憲法で新たに保障された人権の違いを、その背景にふれて説明せよ。","a":"18世紀の市民革命期の人権宣言は、国家権力の干渉を排除して個人の自由を守る自由権（国家からの自由）が中心で、所有権は神聖不可侵とされた。しかし資本主義の発展で貧富の差や失業などが深刻になると、国家が積極的に介入して人間らしい生活を保障する必要が生じた。そこでワイマール憲法は生存権などの社会権（国家による自由）を保障し、所有権にも社会的な制約があるとした。","e":"ポイント：①18世紀＝自由権中心（国家からの自由）、所有権の不可侵 ②資本主義の発展による貧富の差・失業などの社会問題 ③20世紀＝社会権（国家による自由）の保障、所有権の社会的制約（「所有権は義務を伴う」）"},{"t":"mc","s":"人権の歴史","imp":2,"q":"人権に関する文書と、その文書の内容の組合せとして最も適当なものを一つ選べ。","c":["バージニア権利章典：「所有権は義務を伴う。その行使は、同時に公共の福祉に役立つべきである」","ワイマール憲法：「すべての人は平等に造られ、…生命、自由および幸福の追求の含まれることを信ずる」","フランス人権宣言：「権利の保障が確保されず、権力の分立が定められていないすべての社会は、憲法をもつものではない」","アメリカ独立宣言：「経済生活の秩序は、すべての者に人間たるに値する生存を保障することを目的とする正義の原則に適合しなければならない」"],"a":2,"e":"フランス人権宣言第16条であり、正しい組合せである。「所有権は義務を伴う」と「人間たるに値する生存」はいずれもワイマール憲法の規定であり、「すべての人は平等に造られ…幸福の追求」はアメリカ独立宣言の一節なので、それぞれ組合せが誤り。"},{"t":"mc","s":"人権の歴史","imp":2,"q":"次の人権に関する文書を、制定・採択された年代の古いものから順に並べたものとして正しいものを一つ選べ。","c":["権利章典→バージニア権利章典→フランス人権宣言→ワイマール憲法","バージニア権利章典→権利章典→フランス人権宣言→ワイマール憲法","権利章典→フランス人権宣言→バージニア権利章典→ワイマール憲法","権利章典→バージニア権利章典→ワイマール憲法→フランス人権宣言"],"a":0,"e":"権利章典は1689年、バージニア権利章典は1776年、フランス人権宣言は1789年、ワイマール憲法は1919年である。17世紀のイギリス、18世紀後半のアメリカ・フランス、20世紀のドイツという流れを、自由権から社会権へという人権の発展とあわせて押さえるとよい。"}]});</script>
<script>QDATA.push({"unit":"u04","questions":[{"t":"ex","s":"人権の発展","imp":3,"q":"自由権・参政権・社会権が、それぞれ「国家からの自由」「国家への自由」「国家による自由」とよばれる理由を説明せよ。","a":"自由権は、国家権力の干渉を排除して、個人の思想や信仰、経済活動などの自由を守る権利なので「国家からの自由」とよばれる。参政権は、国民が選挙などを通じて政治に参加し、国家の意思決定にかかわる権利なので「国家への自由」とよばれる。社会権は、国家に積極的な施策を求めて人間らしい生活を保障してもらう権利なので「国家による自由」とよばれる。","e":"ポイント：①自由権＝国家の干渉の排除（18世紀の市民革命期に確立） ②参政権＝政治への参加（19〜20世紀に普通選挙として拡大） ③社会権＝国家に積極的な施策を求める（20世紀、ワイマール憲法）"},{"t":"tf","s":"人権の発展","imp":3,"q":"社会権は18世紀の市民革命期に確立した権利であり、自由権は20世紀になって初めて憲法で保障されるようになった。","a":false,"e":"正しくは逆で、まず18世紀の市民革命期に自由権（国家からの自由）が確立し、19世紀から20世紀にかけて普通選挙の実現により参政権（国家への自由）が拡大し、20世紀に社会権（国家による自由）が保障されるようになった。"},{"t":"mc","s":"人権の発展","imp":2,"q":"次の権利のうち、「国家による自由」とよばれる社会権にあたるものとして最も適当なものを一つ選べ。","c":["国から干渉されずに、自分の信じる宗教を信仰する権利","失業や病気で生活に困ったときに、国に対して人間らしい生活の保障を求める権利","選挙で投票し、国の政治に参加する権利","正当な理由なく身体を拘束されない権利"],"a":1,"e":"国に生活の保障を求める権利（生存権）は、社会権の代表例である。信仰の自由や身体を拘束されない権利（人身の自由）は国家の干渉を排除する自由権（国家からの自由）、選挙で投票する権利は参政権（国家への自由）にあたる。"},{"t":"qa","s":"参政権の拡大","imp":1,"q":"1830年代後半から1840年代のイギリスで、選挙権をもたない労働者たちが、男子普通選挙などを要求する人民憲章を掲げて展開した運動を何というか。","a":"チャーティスト運動","alt":["チャーチスト運動","チャーティズム"],"e":"人民憲章は、男子普通選挙・秘密投票・議員の財産資格の廃止・議員への歳費支給・平等な選挙区・毎年の議会選挙の6か条からなる。運動自体は弾圧などで衰えたが、その後の選挙法改正によって要求の多くが実現した。"},{"t":"qa","s":"参政権の拡大","imp":3,"q":"日本で、納税額による制限が撤廃され、満25歳以上のすべての男子に衆議院議員の選挙権が認められた（男子普通選挙が実現した）のは何年か。","a":"1925年","alt":["1925","大正14年"],"e":"1925年の普通選挙法による。同じ年に、社会運動を取り締まる治安維持法も制定された。普通選挙法による最初の総選挙は1928年に行われた。それ以前は、直接国税を一定額以上納める男子に選挙権が限られていた（制限選挙）。"},{"t":"qa","s":"参政権の拡大","imp":3,"q":"日本で、女性に初めて参政権が認められ、満20歳以上の男女に選挙権が与えられたのは何年か。","a":"1945年","alt":["1945","昭和20年"],"e":"第二次世界大戦の敗戦後、1945年12月の衆議院議員選挙法の改正による。翌1946年4月の総選挙では、39人の女性議員が誕生した。その後、2015年の公職選挙法の改正で、選挙権年齢は満18歳以上に引き下げられた（2016年施行）。"},{"t":"tf","s":"参政権の拡大","imp":2,"q":"日本では、1925年の普通選挙法によって、満20歳以上の男女に選挙権が認められた。","a":false,"e":"正しくは、1925年の普通選挙法で選挙権が認められたのは満25歳以上の男子だけである。女性に選挙権が認められ、満20歳以上の男女による普通選挙となったのは1945年である。"},{"t":"qa","s":"民主政治の原理","imp":3,"q":"アメリカのリンカーン大統領が、南北戦争中の1863年にゲティスバーグで行った演説の中で、民主政治の本質を示した言葉は何か。","a":"人民の、人民による、人民のための政治","alt":["人民の人民による人民のための政治","人民の・人民による・人民のための政治"],"e":"「人民の」は主権が人民にあること、「人民による」は人民自身が政治を行うこと、「人民のための」は政治の目的が人民の利益にあることを示すと解釈される。日本国憲法前文の「その権威は国民に由来し、その権力は国民の代表者がこれを行使し、その福利は国民がこれを享受する」もこの考え方に通じる。"},{"t":"qa","s":"民主政治の原理","imp":2,"q":"国民（住民）が代表者を介さずに、直接、政治的な決定に参加するしくみを何というか。","a":"直接民主制","alt":["直接民主主義"],"e":"古代ギリシアのアテネの民会や、スイスの一部の州の住民集会、アメリカのタウン・ミーティングなどが例である。ルソーは直接民主制を理想とした。"},{"t":"qa","s":"民主政治の原理","imp":2,"q":"国民が選挙で選んだ代表者が議会を構成し、その議会を通じて国の意思を決定するしくみを何というか。","a":"間接民主制","alt":["代表民主制","間接民主主義","議会制民主主義","代議制","代議制民主主義"],"e":"人口が多く、課題も複雑な近代国家では、すべての国民が直接議論して決めることは難しいため、間接民主制が基本とされる。日本国憲法前文も「日本国民は、正当に選挙された国会における代表者を通じて行動し」と定めている。"},{"t":"tf","s":"民主政治の原理","imp":2,"q":"日本国憲法は間接民主制を原則としつつ、憲法改正の国民投票や最高裁判所裁判官の国民審査など、直接民主制的な制度も取り入れている。","a":true,"e":"このほか、地方自治では、条例の制定・改廃や議会の解散などを求める直接請求、特定の地方公共団体のみに適用される特別法の住民投票など、直接民主制的な制度がより多く取り入れられている。"},{"t":"ex","s":"民主政治の原理","imp":1,"q":"議会制民主主義を支える3つの原理（国民代表の原理・審議の原理・監督の原理）を、それぞれ説明せよ。","a":"国民代表の原理は、議員は選出された地域や団体の利益の代弁者ではなく、全国民の代表として行動すべきだとする原理である。審議の原理は、議会では公開の場で十分に討論し、少数意見も尊重したうえで多数決によって決定すべきだとする原理である。監督の原理は、議会が国民に代わって行政を監督し、その活動をチェックすべきだとする原理である。","e":"ポイント：①国民代表の原理＝議員は全国民の代表（日本国憲法第43条「全国民を代表する選挙された議員」） ②審議の原理＝公開の討論と少数意見の尊重を経た多数決 ③監督の原理＝議会による行政の監督（国政調査権など）"},{"t":"qa","s":"民主政治の原理","imp":1,"q":"18世紀後半、選挙区の有権者に対し、議員は選挙区の利益の代理人ではなく国民全体の利益を考える代表であると演説し、国民代表の原理を示したイギリスの政治家は誰か。","a":"バーク","alt":["エドマンド・バーク","エドモンド・バーク"],"e":"1774年のブリストルでの演説が知られる。バークはフランス革命を批判し、伝統や慣習を重んじる保守主義の思想家としても有名である。"},{"t":"tf","s":"多数決と少数者","imp":2,"q":"民主政治では多数決によって最終的な決定が行われるので、決定に至るまでの過程で少数意見を尊重する必要はない。","a":false,"e":"正しくは、多数決は、十分な討論を通じて少数意見にも耳を傾け、できるだけ多くの人が納得できる結論を探る努力をしたうえで用いられるべきものである。また、少数者の基本的人権は多数決によっても奪うことはできない。"},{"t":"qa","s":"多数決と少数者","imp":2,"q":"『アメリカのデモクラシー』を著し、民主主義のもとで多数派が少数派を抑圧する「多数者の専制」の危険を指摘したフランスの思想家は誰か。","a":"トクヴィル","alt":["トックビル","トクビル","アレクシ・ド・トクヴィル"],"e":"トクヴィルは19世紀前半にアメリカを視察し、平等が進んだ民主社会の活力を評価する一方で、世論や多数派の意見が個人の自由を圧迫する危険を指摘した。また、地域の自治や自発的な結社が民主主義を支えると考えた。"},{"t":"tf","s":"多数決と少数者","imp":1,"q":"J.S.ミルは『自由論』で、他人に危害を加えない限り個人の自由は尊重されるべきだと説き、多数派の意見や社会の慣習が少数派の個性を抑圧する「多数者の専制」を警戒した。","a":true,"e":"他者に危害を及ぼす場合にのみ個人の自由への干渉が正当化されるという考えを、他者危害原理（危害原理）という。ミルは、少数意見を表明する自由が、真理の発見と社会の進歩に欠かせないと考えた。"},{"t":"ex","s":"多数決と少数者","imp":2,"q":"「多数者の専制」とは何か、それを防ぐために立憲民主主義がどのようなしくみをとっているかにふれて説明せよ。","a":"多数者の専制とは、民主主義のもとで、多数派が数の力によって少数派の意見や権利を抑圧することをいう。これを防ぐため、立憲民主主義では、憲法によって基本的人権を保障して多数決でも侵すことのできない領域を定め、裁判所の違憲審査によって、多数派がつくった法律が人権を侵害していないかをチェックしている。","e":"ポイント：①多数派による少数派の意見・権利の抑圧（トクヴィル・J.S.ミルが警告） ②憲法による人権保障＝多数決でも侵せない領域 ③違憲審査制などによるチェック"},{"t":"qa","s":"熟議民主主義","imp":2,"q":"投票や多数決による決定だけでなく、市民どうしが情報を共有し、理由を示し合いながら十分に話し合うことを通じて、よりよい合意の形成をめざす民主主義のあり方を何というか。","a":"熟議民主主義","alt":["討議民主主義","熟議デモクラシー","討議デモクラシー"],"e":"ドイツの哲学者ハーバーマスらの議論が知られる。単に人々の意見を集計するのではなく、話し合いを通じて人々の意見そのものが変化し、成熟することを重視する。無作為に選ばれた市民が討論を行う討論型世論調査などの試みがある。"},{"t":"mc","s":"熟議民主主義","imp":1,"q":"熟議民主主義の考え方に最も合致する取り組みを一つ選べ。","c":["インターネット上で賛否を一度だけ投票させ、多数を占めた案をただちに採用する。","議会の多数派が、少数派との討論を省略して法案を可決する。","無作為に選ばれた市民が、専門家から資料や説明を受けたうえで少人数での討論を重ね、討論の前後で意見がどう変化したかを調べて政策づくりに生かす。","政府が専門家だけで政策を決定し、市民には決定の結果だけを知らせる。"],"a":2,"e":"十分な情報に基づいて市民どうしが話し合い、意見を深めていく過程を重視するのが熟議民主主義であり、この取り組みは討論型世論調査とよばれる。討論を経ずに一度の投票で決める方法、少数派との討論の省略、市民の参加を認めない決定は、いずれも熟議の考え方に反する。"},{"t":"qa","s":"ファシズム","imp":2,"q":"第一次世界大戦後のイタリアでムッソリーニが率いた運動に始まり、議会制民主主義や自由主義を否定し、独裁者のもとで国家や民族の利益を個人の自由よりも優先させた政治体制や思想を何というか。","a":"ファシズム","e":"ドイツのナチズムなどもファシズムの一種とされる。一党独裁、指導者への崇拝、言論や思想の統制、反対派の弾圧、対外的な侵略などを特徴とし、国家が個人の生活のすみずみまで支配しようとする全体主義の典型である。"},{"t":"qa","s":"ファシズム","imp":3,"q":"1933年にドイツで制定され、政府に議会の承認なしに法律を制定する権限を与えて、ヒトラーの率いるナチスの独裁を可能にした法律は何か。","a":"全権委任法","alt":["授権法"],"e":"全権委任法によって、政府は憲法と異なる内容の法律も制定できるとされ、ワイマール憲法は形式上は廃止されないまま空洞化した。民主的な憲法のもとでも、議会の議決という合法的な手続きによって独裁が生まれうることを示した例である。"},{"t":"tf","s":"ファシズム","imp":1,"q":"ナチスは、武力によるクーデタで政権を奪取し、議会の議決を経ることなく独裁体制を樹立した。","a":false,"e":"正しくは、ナチスは選挙で議会の第一党となり、ヒトラーが首相に任命されたのち、議会の議決によって全権委任法を成立させ、合法的な手続きを通じて独裁体制を築いた。"},{"t":"ex","s":"ファシズム","imp":2,"q":"ナチスの独裁が民主的な手続きを通じて成立したことから、民主政治にとってどのような教訓が得られるかを説明せよ。","a":"ナチスは選挙で議会の第一党となり、ヒトラーが首相に就任したのち、議会の議決によって全権委任法を成立させ、合法的な手続きを通じて独裁体制を築いた。このことは、選挙や多数決といった民主的な手続きだけでは自由や人権は守られないことを示している。憲法によって権力を制限する立憲主義や、多数決でも侵すことのできない人権の保障が重要であるという教訓が得られる。","e":"ポイント：①選挙で第一党→首相就任→全権委任法という合法的な手続きで独裁が成立 ②民主的な手続きだけでは人権は守られない ③立憲主義・人権保障（多数者の専制を防ぐしくみ）の重要性"}]});</script>
<script>QDATA.push({"unit":"u05","questions":[{"t":"qa","s":"議院内閣制と大統領制","imp":3,"q":"内閣が議会（下院）の信任に基づいて成立し、議会に対して連帯して責任を負う政治制度を何というか。","a":"議院内閣制","e":"18世紀のイギリスで発達し、日本やドイツなども採用している。内閣は議会の信任を失えば、総辞職するか議会を解散して国民に信を問う。対になる制度はアメリカの大統領制である。"},{"t":"qa","s":"議院内閣制と大統領制","imp":3,"q":"国民の選挙で選ばれた行政の長が、議会から独立して行政権を行使する政治制度を何というか。","a":"大統領制","e":"アメリカが典型である。大統領は議会に対して責任を負わず、議会は不信任決議で大統領を辞めさせることができない。立法と行政が厳格に分離される点が議院内閣制との大きな違いである。"},{"t":"ex","s":"議院内閣制と大統領制","imp":3,"q":"議院内閣制と大統領制の違いを、立法府と行政府の関係に着目して説明せよ。","a":"議院内閣制では、内閣が議会の信任に基づいて成立し議会に対して責任を負うため、立法府と行政府が協力・融合する関係にある。大統領制では、国民が選んだ大統領が議会から独立して行政権を行使し、立法府と行政府が厳格に分離されて互いに抑制し合う。","e":"ポイント：①議院内閣制は議会の信任と内閣の責任による融合 ②内閣不信任と議会の解散がある ③大統領制は厳格な権力分立と相互の抑制 ④大統領は国民が選び、議会に責任を負わない"},{"t":"mc","s":"議院内閣制と大統領制","imp":2,"q":"議院内閣制についての記述として最も適当なものを一つ選べ。","c":["内閣は議会の信任を存立の基盤とし、信任を失えば総辞職するか議会を解散する。","行政の長は国民の直接選挙で選ばれ、議会に対して責任を負わない。","行政府の長は議会に議席をもつことができず、法案を提出する権限ももたない。","議会は不信任決議によって内閣を辞めさせることができるが、内閣が議会を解散することは認められない。"],"a":0,"e":"議院内閣制の内閣は議会の信任を基盤とし、不信任を受ければ総辞職か解散を選ぶので、「内閣は議会の信任を存立の基盤とし…」が正しい。「国民の直接選挙で選ばれ議会に責任を負わない」は大統領制の説明なので誤り。「議会に議席をもてず法案提出権もない」はアメリカの大統領の特徴なので誤り。議院内閣制では内閣が不信任に対抗して議会（下院）を解散できるのが一般的なので、「解散は認められない」は誤り。"},{"t":"qa","s":"イギリスの政治","imp":3,"q":"イギリスの憲法のように、まとまった一つの憲法典をもたず、マグナ・カルタや権利章典などの重要な法律、判例、慣習が憲法の役割を果たしているものを何というか。","a":"不文憲法","alt":["不文法","不成典憲法"],"e":"憲法典をもつ成文憲法と対になる。イギリスでは憲法にあたる事項も議会が通常の法律と同じ手続で変更できるため、軟性憲法の典型ともいわれる。"},{"t":"qa","s":"イギリスの政治","imp":3,"q":"イギリスの立憲君主制を表す「国王は（　）すれども統治せず」という言葉の空欄に入る語は何か。","a":"君臨","e":"国王は国家元首として存在するが、政治の実権は議会と内閣にあるという原則を表す。18世紀前半、ウォルポール首相が下院の支持を失って辞職したことをきっかけに、内閣が下院の信任に基づいて政治を行う責任内閣制が成立した。"},{"t":"qa","s":"イギリスの政治","imp":2,"q":"イギリス議会で、国民の選挙で選ばれ、上院に対して優越的な地位をもつ下院を何というか。","a":"庶民院","e":"上院は貴族院で、選挙を経ずに任命された一代貴族や聖職貴族などで構成される。下院は650の小選挙区から1人ずつ選ばれる議員で構成され、首相は下院から選ばれる。"},{"t":"tf","s":"イギリスの政治","imp":3,"q":"イギリスでは、上院（貴族院）と下院（庶民院）の権限は対等であり、両院の議決が一致しなければ法律は成立しない。","a":false,"e":"正しくは、1911年の議会法などによって下院優位の原則が確立している。予算に関する金銭法案は上院が反対しても成立し、その他の法案についても上院は成立を一定期間遅らせることしかできない。"},{"t":"qa","s":"イギリスの政治","imp":2,"q":"1911年に制定され、イギリスで下院（庶民院）が上院（貴族院）に優越することを定めた法律を何というか。","a":"議会法","e":"上院は金銭法案を否決できなくなり、その他の法案も成立を遅らせることしかできなくなった。1949年の議会法で、遅らせることのできる期間はさらに短縮された。"},{"t":"qa","s":"イギリスの政治","imp":3,"q":"イギリスで、野党第一党が政権交代に備えて組織する、閣僚に対応した担当者からなる組織を何というか。","a":"影の内閣","alt":["シャドー・キャビネット","シャドーキャビネット"],"e":"野党第一党の党首を中心に、各分野の担当者が与党の政策を批判・監視し、政権担当能力を示す。二大政党制のもとで政権交代を円滑にするしくみである。"},{"t":"tf","s":"イギリスの政治","imp":3,"q":"イギリスの首相は、慣行として下院（庶民院）で多数を占める第一党の党首が国王によって任命される。","a":true,"e":"正しい。首相や閣僚は原則として議員の中から選ばれ、内閣は下院に対して連帯して責任を負う。下院で不信任を受けた内閣は、総辞職するか下院を解散する。"},{"t":"ex","s":"イギリスの政治","imp":2,"q":"イギリスの下院議員選挙で採用されている選挙制度と、それが政党のあり方に与える影響を説明せよ。","a":"イギリスの下院議員は、1つの選挙区から1人を選ぶ小選挙区制で選ばれる。小選挙区制は大政党に有利で死票が多くなりやすいため、保守党と労働党による二大政党制が形成されやすく、単独政権が生まれやすい。","e":"ポイント：①小選挙区制（1区1人） ②大政党に有利で死票が多い ③保守党と労働党の二大政党制 ④単独政権ができやすく、政権交代も起こりやすい。なお近年は自由民主党やスコットランド国民党など第三党も議席を得ている。"},{"t":"qa","s":"イギリスの政治","imp":2,"q":"イギリスで2009年に設置され、それまで上院（貴族院）が担っていた最上級審の役割を引き継いだ裁判所は何か。","a":"最高裁判所","alt":["連合王国最高裁判所"],"e":"それまでは貴族院の法律貴族が最上級審を担当しており、司法を立法から分離する改革として設置された。ただし議会主権の国であるため、この最高裁判所も議会が制定した法律を無効にすることはできない。"},{"t":"ex","s":"イギリスの政治","imp":2,"q":"イギリスの「議会主権」とは何か。裁判所による違憲審査との関係にも触れて説明せよ。","a":"議会主権とは、議会が法的に最高の権力をもち、どのような法律でも制定・改廃でき、他の機関がそれを無効にできないという原則である。このため、イギリスの最高裁判所は、議会が制定した法律を違憲として無効にすることはできない。","e":"ポイント：①議会が最高の立法権をもつ ②名誉革命以降に確立した ③不文憲法のため憲法的な法律も通常の手続で変更できる ④裁判所は議会制定法を無効にできない（判例で違憲審査権が確立したアメリカとの違い）"},{"t":"mc","s":"イギリスの政治","imp":3,"q":"イギリスの政治制度についての記述として適当でないものを一つ選べ。","c":["成文の憲法典をもたず、議会制定法や判例、慣習などが憲法の役割を果たしている。","下院の多数党の党首が首相となり、内閣は下院に対して連帯して責任を負う。","野党第一党は影の内閣を組織し、政権交代に備えている。","国民の直接選挙で選ばれた大統領が首相を任命し、下院を解散する権限をもつ。"],"a":3,"e":"「直接選挙で選ばれた大統領が首相を任命し下院を解散する」のはフランスの半大統領制の説明であり、国王を元首とする立憲君主制のイギリスに大統領はいないので誤り。他の三つは、イギリスの不文憲法、議院内閣制、影の内閣の説明として正しい。"},{"t":"tf","s":"イギリスの政治","imp":1,"q":"イギリスでは2011年の議会任期固定法で首相による任期途中の解散が制限されたが、2022年にこの法律は廃止され、首相の助言に基づいて国王が議会を解散するしくみが復活した。","a":true,"e":"正しい。議会任期固定法のもとでは、下院の3分の2以上の賛成などがなければ任期途中の総選挙ができなかった。2022年の法律でこれが廃止され、従来の解散のしくみに戻った。"}]});</script>
<script>QDATA.push({"unit":"u05","questions":[{"t":"qa","s":"アメリカの政治","imp":3,"q":"アメリカの大統領の任期は何年か。","a":"4年","alt":["4"],"e":"大統領に選ばれるのは2回までで、三選は禁止されている（1951年の憲法修正第22条）。フランスの大統領は任期5年、ロシアの大統領は任期6年と区別して覚える。"},{"t":"tf","s":"アメリカの政治","imp":3,"q":"アメリカの大統領は、国民の直接選挙によって選ばれる。","a":false,"e":"正しくは、国民が州ごとに大統領選挙人を選び、その選挙人が大統領を選ぶ間接選挙である。選挙人はあらかじめ支持する候補者を表明しているため実質的には直接選挙に近く、多くの州では得票が最も多い候補者がその州の選挙人をすべて獲得する。"},{"t":"ex","s":"アメリカの政治","imp":3,"q":"アメリカの大統領制が「厳格な三権分立」といわれる理由を、大統領と議会の関係から説明せよ。","a":"アメリカの大統領は議会とは別に国民から選ばれ、議会に対して責任を負わない。議会は大統領を不信任できず、大統領も議会の解散権や法案提出権をもたない。閣僚も議員を兼ねられないなど立法と行政が明確に分離され、拒否権や上院の同意権などで互いに抑制し合っている。","e":"ポイント：①大統領は議会と別に選ばれ、議会に責任を負わない ②不信任決議も解散もない ③法案提出権がなく、教書で立法を勧告する ④拒否権・上院の同意・弾劾などによる抑制と均衡"},{"t":"qa","s":"アメリカの政治","imp":3,"q":"法案提出権をもたないアメリカの大統領が、議会に対して政策を示し、必要な立法を勧告するために送る文書を何というか。","a":"教書","alt":["一般教書","大統領教書","予算教書"],"e":"年頭に国の現状と政策の方針を示す一般教書のほか、予算教書などがある。大統領は法案を直接提出できないため、教書や与党議員を通じて立法に影響を与える。"},{"t":"qa","s":"アメリカの政治","imp":3,"q":"アメリカの大統領が、議会で可決された法案に署名せず議会に差し戻すことで、その成立を阻む権限を何というか。","a":"拒否権","alt":["法案拒否権"],"e":"大統領が議会を抑制する手段である。議会は上院・下院それぞれで3分の2以上の多数により再可決すれば、拒否権を乗り越えて法律を成立させることができる。"},{"t":"mc","s":"アメリカの政治","imp":2,"q":"アメリカで、連邦議会が可決した法案に対して大統領が拒否権を行使した。この法案を法律として成立させるために必要な手続として最も適当なものを一つ選べ。","c":["上院と下院がそれぞれ3分の2以上の多数で再可決する。","下院が出席議員の過半数で再可決する。","連邦最高裁判所が法案の合憲性を確認する判決を出す。","上院と下院の合同会議を開き、総議員の過半数で再可決する。"],"a":0,"e":"拒否権を覆すには、上院・下院それぞれで3分の2以上の多数による再可決が必要である。「下院の過半数」は要件が軽すぎるので誤り（日本の衆議院の再可決の規定とも混同しないこと）。連邦最高裁判所は法案を成立させる手続には関与しないので誤り。両院合同会議で総議員の過半数という手続も存在しないので誤り。"},{"t":"qa","s":"アメリカの政治","imp":3,"q":"アメリカ連邦議会の上院議員は、各州から何名ずつ選ばれるか。","a":"2名","alt":["2人","2"],"e":"人口に関係なく各州2名で計100名、任期は6年で、2年ごとに約3分の1ずつ改選される。州の代表という性格をもち、条約の承認や高官の任命への同意などの権限をもつ。"},{"t":"qa","s":"アメリカの政治","imp":2,"q":"アメリカ連邦議会の下院議員の任期は何年か。","a":"2年","alt":["2"],"e":"下院議員は各州の人口に比例して配分された435名で、2年ごとに全員が改選される。歳入法案は下院から先に審議するという先議権がある。"},{"t":"mc","s":"アメリカの政治","imp":2,"q":"アメリカ連邦議会の上院がもつ権限として最も適当なものを一つ選べ。","c":["大統領が締結した条約の承認や、大統領による高官の任命への同意を行う。","大統領に対して不信任を決議し、大統領を辞職させる。","大統領が拒否した法案を、上院だけの議決で成立させる。","歳入法案を下院よりも先に審議する先議権をもつ。"],"a":0,"e":"上院は条約の承認（出席議員の3分の2以上）や、閣僚・連邦最高裁判所の裁判官・大使などの任命への同意を行う。大統領制のアメリカに不信任決議の制度はないので誤り。拒否された法案の成立には両院それぞれの3分の2以上の再可決が必要なので誤り。歳入法案の先議権は下院にあるので誤り。"},{"t":"qa","s":"アメリカの政治","imp":2,"q":"アメリカで、大統領などの重大な違法行為に対し、下院が訴追し上院が裁判を行って罷免する手続を何というか。","a":"弾劾","alt":["弾劾裁判"],"e":"上院で出席議員の3分の2以上が有罪とすれば罷免される。これまでに弾劾訴追された大統領はいるが、上院で有罪とされて罷免された大統領はいない。不信任決議とは異なり、政治責任ではなく違法行為を問う手続である。"},{"t":"tf","s":"アメリカの政治","imp":2,"q":"アメリカの連邦最高裁判所がもつ違憲審査権は、合衆国憲法に明文で定められた権限である。","a":false,"e":"正しくは、合衆国憲法には違憲審査権を定めた明文の規定はなく、1803年のマーベリー対マディソン事件の判決などを通じて判例によって確立した。日本国憲法は81条で違憲審査権を明文で定めている。"},{"t":"qa","s":"アメリカの政治","imp":2,"q":"アメリカのように、各州が独自の憲法・議会・政府をもちつつ、外交や国防などは中央政府が担う国家の形態を何というか。","a":"連邦制","e":"アメリカでは、合衆国憲法が連邦政府に与えた権限以外は州に留保される。ドイツも連邦制をとる。日本は中央政府のもとに地方公共団体を置く単一国家である。"},{"t":"mc","s":"アメリカの政治","imp":3,"q":"アメリカの大統領がもつ権限として適当でないものを一つ選べ。","c":["議会が可決した法案に対して拒否権を行使する権限","議会に教書を送り、必要な立法を勧告する権限","下院を解散して国民の信を問う権限","軍の最高司令官として軍隊を指揮する権限"],"a":2,"e":"アメリカの大統領は議会を解散する権限をもたない（議会も大統領を不信任できない）ので、「下院を解散する権限」が誤り。拒否権、教書による立法の勧告、軍の最高司令官としての権限は、いずれも大統領がもつ。"},{"t":"tf","s":"アメリカの政治","imp":2,"q":"アメリカでは、大統領を補佐する各省の長官（閣僚）は、在任中に連邦議会の議員を兼ねることができない。","a":true,"e":"正しい。合衆国憲法は連邦の公職にある者が在任中に議員となることを禁じており、立法と行政の分離が徹底されている。これに対し日本の議院内閣制では、国務大臣の過半数は国会議員でなければならない。"},{"t":"tf","s":"アメリカの政治","imp":2,"q":"アメリカでは共和党と民主党による二大政党制が続いており、大統領選挙もこの二党の候補者の争いが中心となっている。","a":true,"e":"正しい。議会選挙が小選挙区制であることや、多くの州で得票1位の候補者が選挙人を独占する方式がとられていることから、第三党は議席や選挙人を得にくい。イギリスの二大政党（保守党と労働党）と区別して覚える。"},{"t":"qa","s":"フランスの政治","imp":3,"q":"フランスのように、国民の直接選挙で選ばれた大統領が強い権限をもつ一方で、首相が率いる内閣が議会に対して責任を負う政治制度を何というか。","a":"半大統領制","alt":["準大統領制"],"e":"大統領制と議院内閣制の要素をあわせもつ制度である。フランスの大統領は首相の任命権や国民議会（下院）の解散権をもち、外交・国防で大きな役割を果たす。"},{"t":"ex","s":"フランスの政治","imp":2,"q":"フランスの半大統領制の仕組みを、大統領と首相・議会の関係に着目して説明せよ。","a":"フランスでは、国民の直接選挙で選ばれる任期5年の大統領が、首相の任命権や国民議会（下院）の解散権などの強い権限をもつ。一方、首相が率いる内閣は議会に対して責任を負い、議会は内閣を不信任できるため、大統領制と議院内閣制の要素をあわせもつ。","e":"ポイント：①大統領は国民の直接選挙で選ばれ任期5年 ②首相の任命権と下院の解散権をもつ ③内閣は議会に責任を負う ④大統領制と議院内閣制の混合型"},{"t":"tf","s":"フランスの政治","imp":3,"q":"フランスの大統領は、アメリカの大統領と同様に、議会を解散する権限をもたない。","a":false,"e":"正しくは、フランスの大統領は国民議会（下院）を解散する権限をもち、首相の任命権もある。議会の解散権をもたないのはアメリカの大統領である。"},{"t":"qa","s":"フランスの政治","imp":2,"q":"1958年にド・ゴールのもとで制定された憲法によって始まり、大統領の権限が強化された現在のフランスの体制を何というか。","a":"第五共和制","alt":["第5共和制","第五共和政","第5共和政"],"e":"それ以前の第四共和制は議会の力が強く、政権が短命で不安定だった。アルジェリア問題による危機の中で、強い大統領権限をもつ新憲法が制定された。大統領の任期は2000年の憲法改正で7年から5年に短縮された。"},{"t":"qa","s":"フランスの政治","imp":1,"q":"フランスで、大統領の所属する党派と議会の多数派が異なるため、大統領が反対党派から首相を任命して政権を運営する状態を何というか。","a":"コアビタシオン","alt":["保革共存"],"e":"内閣は議会の信任を必要とするため、大統領は議会の多数派が受け入れる人物を首相に任命せざるをえない。1980年代以降、たびたび生じた。"}]});</script>
<script>QDATA.push({"unit":"u05","questions":[{"t":"qa","s":"ドイツの政治","imp":2,"q":"ドイツで、連邦議会が後任の首相を過半数で選出することによってのみ、現職の首相に対する不信任を表明できるとする制度を何というか。","a":"建設的不信任","alt":["建設的不信任制度","建設的不信任決議"],"e":"ドイツは議院内閣制で、首相は連邦議会が選出する。不信任には後任の選出が必要なため、政権の空白や不安定化を防ぐことができる。"},{"t":"ex","s":"ドイツの政治","imp":1,"q":"ドイツで建設的不信任の制度が設けられた理由を、ワイマール共和国の経験と関連づけて説明せよ。","a":"ワイマール共和国では、小党が分立して内閣が短命に終わることが多く、政治の不安定がナチスの台頭を招く一因となった。この反省から、ドイツでは議会が後任の首相を選出しなければ不信任を表明できないようにし、反対のためだけの不信任による政権の空白を防いで、政権の安定を図った。","e":"ポイント：①ワイマール期の政治の不安定 ②ナチスの台頭への反省 ③後任の首相の選出と不信任を一体化 ④政権の空白を防ぎ安定させる"},{"t":"qa","s":"ドイツの政治","imp":2,"q":"ドイツで、具体的な訴訟がなくても、法律が憲法に適合するかどうかを審査できる、憲法問題を専門に扱う裁判所は何か。","a":"連邦憲法裁判所","e":"具体的な事件と切り離して法律の合憲性を審査する方式を抽象的違憲審査制という。日本やアメリカは、通常の裁判所が具体的な事件の解決に必要な範囲で審査する付随的違憲審査制である。"},{"t":"qa","s":"ドイツの政治","imp":2,"q":"ドイツの連邦議会選挙で採用されている、比例代表の得票によって各党の議席数を決め、その枠の中で小選挙区の当選者を優先して割り当てる選挙制度を何というか。","a":"小選挙区比例代表併用制","alt":["併用制"],"e":"比例代表の性格が強い制度である。日本の衆議院の小選挙区比例代表並立制（小選挙区と比例代表の議席を別々に決める）と取り違えないこと。"},{"t":"mc","s":"ドイツの政治","imp":2,"q":"ドイツの政治制度についての記述として最も適当なものを一つ選べ。","c":["連邦大統領は国家元首だが、その権限は儀礼的なものが中心であり、行政の実権は首相にある。","連邦大統領は国民の直接選挙で選ばれ、首相を任命して行政を指揮する強い権限をもつ。","連邦議会の選挙は小選挙区制のみで行われ、二大政党以外の政党は議席を得られない。","違憲審査は通常の裁判所が具体的な事件を通じて行い、憲法問題を専門に扱う裁判所は存在しない。"],"a":0,"e":"ドイツの連邦大統領は連邦議会議員と州の代表からなる連邦会議で選ばれ、権限は儀礼的なものが中心で、行政の実権は連邦議会が選ぶ首相にある。「直接選挙で選ばれ強い権限をもつ」はフランスの大統領に近い説明なので誤り。連邦議会選挙は小選挙区比例代表併用制で多党制なので誤り。ドイツには連邦憲法裁判所があるので誤り。"},{"t":"tf","s":"ドイツの政治","imp":1,"q":"ドイツの連邦議会選挙では、得票率が5％に満たない政党には、原則として比例代表による議席が配分されない。","a":true,"e":"正しい。5％条項（阻止条項）と呼ばれ、小党が乱立して政治が不安定になるのを防ぐねらいがある。ワイマール共和国で小党が分立した反省に立つ制度である。"},{"t":"qa","s":"中国の政治","imp":3,"q":"中華人民共和国の憲法で「国家権力の最高機関」と位置づけられ、立法権をもつ機関は何か。","a":"全国人民代表大会","alt":["全人代"],"e":"全人代は年1回開かれ、閉会中は常務委員会が権限を行使する。国家主席の選出や国務院総理（首相）の決定なども行う。"},{"t":"qa","s":"中国の政治","imp":3,"q":"中国などの社会主義国家で採られている、権力を人民の代表機関に集中させ、三権分立を否定する原理を何というか。","a":"民主集中制","alt":["権力集中制","民主的中央集権制"],"e":"全人代に権力を集中させるたてまえだが、実際には中国共産党が国家と社会を指導している。議会・政府・裁判所が互いに抑制し合う権力分立とは対照的な原理である。"},{"t":"mc","s":"中国の政治","imp":1,"q":"中国の国家機関についての記述として最も適当なものを一つ選べ。","c":["国務院は最高行政機関であり、全国人民代表大会に対して責任を負う。","国家主席は国民の直接選挙で選ばれ、国務院を指揮する。","全国人民代表大会は、三権分立のもとで行政機関や裁判所と互いに抑制し合っている。","最高人民法院は、全国人民代表大会が制定した法律を違憲として無効にすることができる。"],"a":0,"e":"国務院は総理が率いる最高行政機関で、全人代に対して責任を負う。国家主席は国民の直接選挙ではなく全人代で選出されるので誤り。中国は三権分立を否定する民主集中制をとるので誤り。裁判所が法律を違憲無効とする違憲審査制はとられていないので誤り。"},{"t":"ex","s":"中国の政治","imp":2,"q":"中国の政治体制の特徴を、権力分立をとる国との違いに着目して説明せよ。","a":"中国では、民主集中制のもとで国家権力の最高機関である全国人民代表大会に権力が集中し、行政機関の国務院や裁判所はその下に置かれる。また憲法で中国共産党の指導が定められて事実上の一党支配となっており、権力分立や複数政党による政権交代はない。","e":"ポイント：①民主集中制（権力集中制） ②全人代が国家権力の最高機関 ③中国共産党の指導による事実上の一党支配 ④権力分立や政権交代がない"},{"t":"tf","s":"中国の政治","imp":2,"q":"中国では、複数の政党が選挙で政権を争い、選挙の結果に応じて政権交代が行われている。","a":false,"e":"正しくは、憲法で中国共産党の指導が定められており、事実上の一党支配である。共産党以外にも民主諸党派と呼ばれる政党は存在するが、共産党の指導を受け入れており、政権交代は起こらない。"},{"t":"tf","s":"中国の政治","imp":1,"q":"中国の国家主席の任期は、現在も連続2期までに制限されている。","a":false,"e":"正しくは、2018年の憲法改正で、国家主席と副主席の任期を連続2期までとする制限が撤廃された。国家主席は国家元首にあたり、全国人民代表大会で選出される。"},{"t":"qa","s":"中国の政治","imp":2,"q":"1997年にイギリスから返還された香港などで、社会主義の中国の中に資本主義の制度を維持することを認めた方式を何というか。","a":"一国二制度","alt":["一国両制"],"e":"香港では返還後50年間、資本主義の制度と高度な自治を維持すると約束された。1999年にポルトガルから返還されたマカオにも適用されている。"},{"t":"mc","s":"中国の政治","imp":2,"q":"香港についての記述として最も適当なものを一つ選べ。","c":["2020年に香港国家安全維持法が施行され、国家の分裂や政権の転覆などをはかる行為が処罰の対象とされ、民主派の活動が大きく制限された。","1997年にポルトガルから中国に返還され、一国二制度が適用された。","一国二制度のもとで、香港の行政長官は返還当初から住民の直接選挙で選ばれてきた。","香港国家安全維持法は、香港の立法会が独自に審議して制定した法律である。"],"a":0,"e":"2020年、中国の全人代常務委員会が香港国家安全維持法を制定し、国家分裂・政権転覆・テロ活動・外国勢力との結託を処罰の対象とした。これにより言論の自由や民主派の活動が大きく制限され、一国二制度の形骸化が指摘されている。香港はイギリスから返還されたので「ポルトガルから」は誤り（マカオと混同している）。行政長官は選挙委員会による間接選挙で選ばれてきたので誤り。同法は香港の立法会ではなく全人代常務委員会が制定したので誤り。"},{"t":"tf","s":"ロシアの政治","imp":2,"q":"ロシアでは、議会が選んだ首相が行政の実権を握り、大統領の権限は儀礼的なものに限られている。","a":false,"e":"正しくは、ロシアは国民の直接選挙で選ばれる大統領に強い権限が集中する体制であり、大統領は首相の任命（下院の同意が必要）や下院の解散などの権限をもつ。大統領の任期は6年で、2020年の憲法改正では、それまでの大統領の在任期間を任期制限の回数に数えないこととされた。"},{"t":"qa","s":"開発独裁と権威主義","imp":3,"q":"発展途上国で、経済開発を最優先の目標とし、軍や官僚を基盤とする強権的な政府が、国民の政治的自由を制限しながら工業化を進めた体制を何というか。","a":"開発独裁","e":"韓国の朴正煕政権、フィリピンのマルコス政権、インドネシアのスハルト政権などが代表例である。経済成長を実現した一方で、人権の抑圧が問題となった。"},{"t":"ex","s":"開発独裁と権威主義","imp":2,"q":"開発独裁とはどのような体制か。その後の変化にも触れて説明せよ。","a":"開発独裁とは、発展途上国で経済開発を最優先とし、軍や官僚を背景にした強権的な政府が、言論や政治活動の自由を制限しながら工業化を進めた体制である。経済成長によって中間層が育つと民主化を求める運動が高まり、フィリピンや韓国などでは1980年代後半に民主化が進んだ。","e":"ポイント：①経済開発の優先 ②強権的な政府による政治的自由の制限 ③韓国・フィリピン・インドネシアなどの例 ④経済成長にともなう民主化"},{"t":"mc","s":"開発独裁と権威主義","imp":1,"q":"開発独裁についての記述として適当でないものを一つ選べ。","c":["韓国の朴正煕政権やフィリピンのマルコス政権が、その例として挙げられる。","経済開発を優先する一方で、言論の自由や政治活動を制限した。","経済成長にともなって中間層が増えると、民主化を求める運動が高まった国もある。","議会の多数派が首相を選ぶ議院内閣制のもとで、選挙による政権交代を繰り返しながら発展した。"],"a":3,"e":"開発独裁は、強権的な政府が長期にわたって権力を握り、選挙による政権交代や政治的自由を制限した体制なので、「選挙による政権交代を繰り返しながら発展した」が誤り。他の三つは、開発独裁の例、特徴、その後の民主化の説明として正しい。"},{"t":"tf","s":"開発独裁と権威主義","imp":1,"q":"権威主義体制とは、自由な選挙と複数の政党の競争によって、権力が国民に民主的に統制されている体制をいう。","a":false,"e":"正しくは、権威主義体制とは、選挙などが形式的に行われることはあっても、権力が特定の指導者・政党・軍などに集中し、言論の自由や野党の活動が制限されている体制をいう。国民を思想的に全面的に動員する全体主義とは区別される。"},{"t":"mc","s":"各国の政治体制の比較","imp":3,"q":"次のA〜Cは、アメリカ・イギリス・フランスのいずれかの国の政治制度について述べたものである。A〜Cと国名の組合せとして最も適当なものを一つ選べ。A：大統領は議会の解散権をもたず、議会も大統領を不信任できない。B：国民が直接選ぶ大統領が首相を任命し、首相が率いる内閣は議会に責任を負う。C：成文の憲法典がなく、下院の多数党の党首が首相となる。","c":["A－アメリカ　B－フランス　C－イギリス","A－アメリカ　B－イギリス　C－フランス","A－フランス　B－アメリカ　C－イギリス","A－イギリス　B－フランス　C－アメリカ"],"a":0,"e":"Aは大統領と議会が互いに解散も不信任もできない厳格な三権分立なのでアメリカ。Bは直接選挙で選ばれる大統領と、議会に責任を負う内閣が並び立つ半大統領制なのでフランス。Cは不文憲法と議院内閣制なのでイギリスである。"}]});</script>
<script>QDATA.push({"unit":"u06","questions":[{"t":"qa","s":"大日本帝国憲法","imp":3,"q":"大日本帝国憲法が発布されたのは西暦何年か。","a":"1889年","alt":["1889","明治22年"],"e":"1889年2月11日に発布され、翌1890年11月の第1回帝国議会の開会とともに施行された。伊藤博文らが中心となって起草した。"},{"t":"qa","s":"大日本帝国憲法","imp":3,"q":"大日本帝国憲法のように、君主が制定して国民に与えるという形式をとった憲法を何というか。","a":"欽定憲法","e":"国民が制定する憲法は民定憲法といい、日本国憲法は民定憲法である。大日本帝国憲法は、天皇が定めて臣民に与えるという形をとった。"},{"t":"qa","s":"大日本帝国憲法","imp":2,"q":"大日本帝国憲法を起草する際に主な手本とされた、君主の権限が強い19世紀ドイツの王国の憲法は何か。","a":"プロイセン憲法","alt":["プロシア憲法","プロシャ憲法"],"e":"伊藤博文はヨーロッパに渡ってグナイストやシュタインから憲法理論を学び、君主権の強いプロイセンの憲法を参考にした。議会の権限が強いイギリス流の考え方は採用されなかった。"},{"t":"qa","s":"大日本帝国憲法","imp":3,"q":"大日本帝国憲法第4条は「天皇ハ国ノ元首ニシテ統治権ヲ（　）シ此ノ憲法ノ条規ニ依リ之ヲ行フ」と定めた。空欄に入る語は何か。","a":"総攬","e":"天皇は立法・行政・司法のすべての統治権を一手に握る統治権の総攬者とされ、天皇主権が定められた。ただし「憲法の条規によって行う」とされ、形式上は立憲主義の体裁をとった。"},{"t":"qa","s":"大日本帝国憲法","imp":2,"q":"大日本帝国憲法で、帝国議会の協賛を経ずに天皇が行使できた、緊急勅令の発布、宣戦・講和・条約の締結、陸海軍の統帥などの広い権限を総称して何というか。","a":"天皇大権","alt":["大権"],"e":"議会が関与できない広い権限が天皇に認められていた。特に軍の作戦・指揮にかかわる統帥権は、内閣からも独立していた。"},{"t":"qa","s":"大日本帝国憲法","imp":3,"q":"大日本帝国憲法のもとで、陸海軍の作戦や指揮を行う権限が、内閣や議会の関与を受けずに天皇に直属していたことを何というか。","a":"統帥権の独立","e":"軍部は統帥権の独立を盾に政府の統制を拒むようになり、1930年のロンドン海軍軍縮条約の調印をめぐる統帥権干犯問題などを経て、政治への影響力を強めた。日本国憲法のもとでの文民統制は、この反省に立つ。"},{"t":"tf","s":"大日本帝国憲法","imp":3,"q":"大日本帝国憲法のもとで、帝国議会は国の唯一の立法機関であり、天皇の立法権を制約する国権の最高機関とされていた。","a":false,"e":"正しくは、立法権は天皇にあり、帝国議会は天皇の立法権に協賛（同意）する機関にすぎなかった。国会を「国権の最高機関」であり「唯一の立法機関」と定めているのは日本国憲法第41条である。"},{"t":"qa","s":"大日本帝国憲法","imp":2,"q":"大日本帝国憲法下の帝国議会で、公選制の衆議院とともに置かれ、皇族・華族や天皇が任命した議員などで構成された議院は何か。","a":"貴族院","e":"選挙によらない議員で構成され、衆議院とほぼ対等の権限をもって、民意を反映する衆議院を抑える役割を果たした。日本国憲法のもとで廃止され、公選制の参議院が置かれた。"},{"t":"tf","s":"大日本帝国憲法","imp":1,"q":"大日本帝国憲法では、国務各大臣は天皇を輔弼し、帝国議会に対して連帯して責任を負うと定められていた。","a":false,"e":"正しくは、第55条は「国務各大臣ハ天皇ヲ輔弼シ其ノ責ニ任ス」と定め、各大臣は議会ではなく天皇に対して個別に責任を負った。憲法には内閣についての規定もなかった。輔弼は、日本国憲法の国事行為に必要な内閣の「助言と承認」とは異なる。"},{"t":"tf","s":"大日本帝国憲法","imp":3,"q":"大日本帝国憲法は、国民の権利を、人が生まれながらにもつ自然権として保障し、法律によっても制限できないものとした。","a":false,"e":"正しくは、国民の権利は天皇が臣民に与えた「臣民の権利」とされ、「法律ノ範囲内ニ於テ」認められるにすぎなかった（法律の留保）。そのため治安維持法などの法律によって大きく制限された。"},{"t":"qa","s":"大日本帝国憲法","imp":2,"q":"大日本帝国憲法の権利保障のように、権利が「法律の範囲内」でのみ認められ、法律によって制限できるとする仕組みを何というか。","a":"法律の留保","e":"法律さえ制定すれば権利を制限できたため、人権の保障は不十分だった。これに対し日本国憲法は、基本的人権を「侵すことのできない永久の権利」（11条）として保障している。"},{"t":"ex","s":"大日本帝国憲法","imp":2,"q":"大日本帝国憲法が「外見的立憲主義」の憲法といわれる理由を説明せよ。","a":"大日本帝国憲法は、議会の設置や権利の保障、権力分立の形式を備えた立憲的な憲法であった。しかし主権は天皇にあり、議会は天皇の協賛機関にすぎず、天皇大権や統帥権の独立が認められ、権利も法律の範囲内でしか保障されなかったため、権力を制限して人権を守るという立憲主義の実質を欠いていた。","e":"ポイント：①形式上は議会・権利保障・権力分立がある ②天皇主権・天皇大権・統帥権の独立 ③議会は天皇の協賛機関 ④臣民の権利と法律の留保"},{"t":"mc","s":"大日本帝国憲法","imp":1,"q":"大日本帝国憲法についての記述として最も適当なものを一つ選べ。","c":["司法権は天皇の名において裁判所が行い、特別裁判所として行政裁判所や軍法会議が設けられていた。","内閣総理大臣は帝国議会の議決によって指名され、内閣は議会に対して連帯して責任を負った。","地方自治について章が設けられ、府県知事は住民の直接選挙で選ばれていた。","憲法改正は国民投票によって行われ、天皇が改正を発議することはできなかった。"],"a":0,"e":"大日本帝国憲法は、司法権は「天皇ノ名ニ於テ」裁判所が行うと定め、行政裁判所や軍法会議などの特別裁判所が置かれていた。首相は議会の指名ではなく天皇が任命し、大臣は天皇に対して責任を負ったので誤り。地方自治の規定はなく、府県知事は政府が任命する官選だったので誤り。憲法改正は天皇の命令で改正案を帝国議会の議決にかけるものだったので誤り。"},{"t":"qa","s":"大正デモクラシー","imp":3,"q":"大正時代に、主権がどこにあるかは問わず、政治の目的は民衆の利益と幸福にあり、政策の決定は民衆の意向に基づくべきだと説いた吉野作造の主張を何というか。","a":"民本主義","e":"天皇主権の大日本帝国憲法のもとで、普通選挙の実現や政党内閣の確立を求める理論的な支えとなった。主権が国民にあるとする民主主義とは区別して用いられた。"},{"t":"tf","s":"大正デモクラシー","imp":1,"q":"1918年に成立した原敬内閣は、陸軍・海軍・外務の3大臣以外の閣僚をすべて立憲政友会の党員で組織した、本格的な政党内閣であった。","a":true,"e":"正しい。原敬は衆議院に議席をもつ初めての首相で「平民宰相」と呼ばれた。1924年から1932年の五・一五事件までは、衆議院の多数党が内閣を組織する「憲政の常道」が続いた。"},{"t":"qa","s":"大正デモクラシー","imp":3,"q":"国家を法人とみなし、統治権は国家に属し、天皇は国家の最高機関として憲法に従って統治権を行使するという、美濃部達吉が唱えた学説を何というか。","a":"天皇機関説","e":"天皇主権を前提としつつ、天皇の権力を憲法で制約し、議会や政党内閣の役割を重視する学説で、大正期には憲法学の通説となった。国民主権を主張したものではない点に注意。"},{"t":"tf","s":"大正デモクラシー","imp":2,"q":"1935年、美濃部達吉の天皇機関説は貴族院で反国体的な学説として攻撃され、政府は国体明徴声明を出してこの学説を否定した。","a":true,"e":"正しい。この天皇機関説事件で美濃部の著書は発売禁止となり、美濃部は貴族院議員を辞職した。学問の自由が国家によって否定された事件であり、日本国憲法が学問の自由（23条）を保障する背景の一つとなった。"},{"t":"qa","s":"大正デモクラシー","imp":3,"q":"1925年に制定され、納税額による制限を廃止して、満25歳以上の男子に選挙権を与えた法律を通称何というか。","a":"普通選挙法","alt":["男子普通選挙法"],"e":"加藤高明内閣のもとで成立した。女性には選挙権が認められず、満20歳以上の男女による普通選挙が実現したのは1945年の選挙法改正である。"},{"t":"qa","s":"大正デモクラシー","imp":3,"q":"普通選挙法と同じ1925年に制定され、国体の変革や私有財産制度の否認を目的とする結社を組織した者などを処罰した法律は何か。","a":"治安維持法","e":"共産主義運動の取締りを主な目的としたが、のちに労働運動や宗教団体、自由主義者にまで適用が広がり、思想・言論の自由を抑圧した。1928年の改正で最高刑が死刑となり、1945年に廃止された。"},{"t":"ex","s":"大正デモクラシー","imp":2,"q":"1925年に普通選挙法と治安維持法が同じ年に制定されたことには、どのような意味があったか説明せよ。","a":"普通選挙法によって納税額による制限が廃止され、満25歳以上の男子に選挙権が与えられて、政治参加が大きく広がった。一方で、選挙権の拡大によって労働者や農民の政治運動、共産主義運動が勢いを増すことが警戒され、治安維持法によってこれらを取り締まる体制が同時に整えられた。","e":"ポイント：①普通選挙法による男子普通選挙 ②治安維持法による国体変革・私有財産否認の結社の処罰 ③政治参加の拡大と社会運動の取締りが同時に進められた ④同年の日ソ国交樹立による共産主義の広がりへの警戒"},{"t":"mc","s":"大正デモクラシー","imp":2,"q":"大正デモクラシーの時期の思想や制度についての記述として最も適当なものを一つ選べ。","c":["吉野作造は民本主義を唱え、普通選挙の実現や政党内閣の確立を主張した。","美濃部達吉の天皇機関説は、主権は国民にあるとして天皇主権を否定する学説であった。","1925年に成立した普通選挙法によって、満20歳以上の男女に選挙権が与えられた。","治安維持法は普通選挙法の制定と引きかえに廃止され、言論・結社の自由が広く認められた。"],"a":0,"e":"吉野作造の民本主義は、普通選挙と政党内閣の実現を求める理論となったので正しい。天皇機関説は天皇主権を前提に天皇を国家の最高機関とする学説で、国民主権を主張したものではないので誤り。1925年の普通選挙法で選挙権を得たのは満25歳以上の男子だけなので誤り。治安維持法は普通選挙法と同じ1925年に制定され、1945年まで存続したので誤り。"}]});</script>
<script>QDATA.push({"unit":"u06","questions":[{"t":"qa","s":"日本国憲法の制定","imp":3,"q":"1945年に日本が受諾した、軍国主義の除去、民主主義的傾向の復活強化、基本的人権の尊重などを求めた連合国の宣言を何というか。","a":"ポツダム宣言","e":"1945年7月にアメリカ・イギリス・中国の名で発表され、日本は8月14日に受諾を連合国に通告した。この宣言の受諾により、天皇主権の大日本帝国憲法の改正が避けられなくなった。"},{"t":"qa","s":"日本国憲法の制定","imp":2,"q":"幣原内閣が設置した憲法問題調査委員会がまとめた、天皇が統治権を総攬するという原則を維持するなど、大日本帝国憲法の部分的な手直しにとどまった憲法改正案を一般に何というか。","a":"松本案","alt":["松本試案","憲法改正要綱"],"e":"委員長の松本烝治の名からこう呼ばれる。1946年2月、GHQは保守的すぎるとしてこれを受け入れず、独自に草案を作成することになった。"},{"t":"qa","s":"日本国憲法の制定","imp":3,"q":"1946年2月、連合国軍最高司令官が憲法草案の作成にあたって示した、天皇の地位、戦争の放棄、封建制度の廃止の3項目からなる基本原則を何というか。","a":"マッカーサー三原則","alt":["マッカーサー・ノート","マッカーサーノート","マッカーサー3原則"],"e":"①天皇は国の元首の地位にあるが、その権能は憲法に基づき国民の意思に応えて行使される、②自国の安全を守るための戦争も含めて戦争を放棄し、軍隊をもたず交戦権も認めない、③封建制度を廃止する、という内容である。GHQ民政局はこれに基づいて草案を作成した。"},{"t":"qa","s":"日本国憲法の制定","imp":2,"q":"連合国軍最高司令官総司令部（GHQ）の民政局が短期間で作成し、1946年2月に日本政府に示した憲法草案を何というか。","a":"GHQ草案","alt":["マッカーサー草案"],"e":"日本政府はこの草案をもとに政府の憲法改正草案を作成し、帝国議会に提出した。GHQは、日本政府を通じて占領政策を実施する間接統治の方式をとっていた。"},{"t":"tf","s":"日本国憲法の制定","imp":2,"q":"鈴木安蔵らの憲法研究会が1945年末に発表した憲法草案要綱は、国民主権の考え方を盛り込んでおり、GHQ草案の作成にあたって参考にされた。","a":true,"e":"正しい。憲法草案要綱は、統治権は国民から発するとし、天皇は国家的儀礼をつかさどるものとした。生存権にあたる規定も含んでおり、GHQはこれを高く評価して草案作成の参考にした。"},{"t":"tf","s":"日本国憲法の制定","imp":2,"q":"生存権を定めた日本国憲法第25条1項の規定は、GHQ草案にはなく、帝国議会での審議の過程で追加された。","a":true,"e":"正しい。社会党の森戸辰男らの主張により、「すべて国民は、健康で文化的な最低限度の生活を営む権利を有する」という規定が加えられた。このほか9条2項冒頭の「前項の目的を達するため」（芦田修正）や、国務大臣の文民規定（66条2項）なども議会審議の中で加えられた。"},{"t":"qa","s":"日本国憲法の制定","imp":3,"q":"日本国憲法が公布されたのは何年何月何日か。","a":"1946年11月3日","alt":["昭和21年11月3日"],"e":"施行は半年後の1947年5月3日である。現在、公布日の11月3日は「文化の日」、施行日の5月3日は「憲法記念日」として国民の祝日になっている。"},{"t":"tf","s":"日本国憲法の制定","imp":3,"q":"日本国憲法は1947年5月3日に公布され、その半年後の11月3日に施行された。","a":false,"e":"正しくは、1946年11月3日に公布され、半年後の1947年5月3日に施行された。公布と施行の日付を入れ替えるひっかけに注意する。"},{"t":"tf","s":"日本国憲法の制定","imp":1,"q":"日本国憲法は、大日本帝国憲法の改正手続とは関係なく、新たに設けられた国会の審議と議決によって制定された。","a":false,"e":"正しくは、日本国憲法は形式上、大日本帝国憲法第73条の改正手続に従って制定された。政府の改正案は、男女普通選挙で選ばれた衆議院と貴族院からなる帝国議会で審議・修正のうえ可決され、天皇の裁可を経て公布された。国会は日本国憲法によって初めて設けられた機関である。"},{"t":"ex","s":"日本国憲法の制定","imp":2,"q":"日本国憲法の制定過程を、ポツダム宣言の受諾から施行まで順を追って説明せよ。","a":"ポツダム宣言の受諾後、日本政府は松本案を作成したが、大日本帝国憲法の手直しにとどまったためGHQに拒否された。GHQはマッカーサー三原則に基づいてGHQ草案を作成し、政府はこれをもとに改正案をつくった。改正案は帝国議会で審議・修正のうえ可決され、1946年11月3日に公布、1947年5月3日に施行された。","e":"ポイント：①松本案とGHQによる拒否 ②マッカーサー三原則とGHQ草案 ③帝国議会での審議と修正（形式は大日本帝国憲法の改正） ④1946年11月3日公布・1947年5月3日施行"},{"t":"mc","s":"日本国憲法の制定","imp":2,"q":"日本国憲法の制定過程についての記述として最も適当なものを一つ選べ。","c":["政府の改正案は、男女普通選挙で選ばれた議員からなる衆議院を含む帝国議会で審議され、一部修正のうえ可決された。","日本国憲法は、帝国議会で可決されたのち、国民投票によって承認されて成立した。","GHQは日本側の案を一切参考にせず、民間の憲法草案も草案作成に影響を与えなかった。","松本案は国民主権を明記していたが、天皇制の廃止を求めるGHQによって拒否された。"],"a":0,"e":"政府案は1946年の男女普通選挙で選ばれた衆議院と貴族院からなる帝国議会で審議され、25条1項の追加などの修正を経て可決されたので正しい。日本国憲法の制定時に国民投票は行われていないので誤り。GHQは憲法研究会の草案要綱などを参考にしたので誤り。松本案は天皇の統治権総攬を維持した保守的な案であり、GHQも天皇制の廃止は求めず象徴として残したので誤り。"},{"t":"qa","s":"三大原則と前文","imp":3,"q":"日本国憲法の三大原則（基本原理）を3つ答えよ。","a":"国民主権・基本的人権の尊重・平和主義","alt":["国民主権・平和主義・基本的人権の尊重","基本的人権の尊重・国民主権・平和主義","基本的人権の尊重・平和主義・国民主権","平和主義・国民主権・基本的人権の尊重","平和主義・基本的人権の尊重・国民主権"],"e":"大日本帝国憲法の天皇主権、法律の範囲内での臣民の権利、統帥権の独立と軍の存在などと対比して理解する。前文は、国政は国民の信託によるという原理を人類普遍の原理とし、これに反する一切の憲法・法令・詔勅を排除するとしている。"},{"t":"qa","s":"三大原則と前文","imp":3,"q":"日本国憲法前文の「ここに（　）が国民に存することを宣言し、この憲法を確定する」という一節の空欄に入る語は何か。","a":"主権","e":"前文と第1条で国民主権を明らかにしている。大日本帝国憲法の天皇主権からの転換であり、天皇の地位も「主権の存する日本国民の総意に基く」（1条）ものとなった。"},{"t":"qa","s":"三大原則と前文","imp":3,"q":"日本国憲法前文の「われらは、全世界の国民が、ひとしく恐怖と欠乏から免かれ、（　）のうちに生存する権利を有することを確認する」という一節の空欄に入る語は何か。","a":"平和","e":"この権利は平和的生存権と呼ばれる。長沼ナイキ基地訴訟の一審判決（1973年）は、平和的生存権を、住民が訴えを起こす利益を認める根拠の一つとした。"},{"t":"ex","s":"三大原則と前文","imp":2,"q":"日本国憲法の前文が述べる「国政は国民の厳粛な信託による」という考え方を、国民主権と関連づけて説明せよ。","a":"国民主権とは、国の政治のあり方を最終的に決める力が国民にあるという原理である。前文は、国政は国民の厳粛な信託によるもので、その権威は国民に由来し、権力は国民の代表者が行使し、その福利は国民が享受すると述べており、ロックの社会契約説に通じる考え方に立っている。","e":"ポイント：①主権は国民にある ②国政は国民の信託による ③権威は国民に由来し、権力は代表者が行使し、福利は国民が受ける ④代表民主制とロックの信託の考え方"},{"t":"tf","s":"三大原則と前文","imp":2,"q":"日本国憲法の前文は、日本国民だけが恐怖と欠乏から免かれ、平和のうちに生存する権利を有することを確認している。","a":false,"e":"正しくは、前文は「全世界の国民が」平和のうちに生存する権利を有することを確認している。また「政府の行為によつて再び戦争の惨禍が起ることのないやうにすることを決意し」と述べ、国際協調主義の立場も示している。"}]});</script>
<script>QDATA.push({"unit":"u06","questions":[{"t":"qa","s":"象徴天皇制","imp":3,"q":"日本国憲法第1条で、天皇は日本国および日本国民統合の何であると定められているか。","a":"象徴","e":"第1条は「天皇は、日本国の象徴であり日本国民統合の象徴であつて、この地位は、主権の存する日本国民の総意に基く」と定める。天皇の地位の根拠は、主権者である国民の総意に変わった。"},{"t":"qa","s":"象徴天皇制","imp":3,"q":"天皇が行う、憲法に定められた形式的・儀礼的な行為を何というか。","a":"国事行為","alt":["国事に関する行為"],"e":"天皇は憲法の定める国事に関する行為のみを行い、国政に関する権能を有しない（4条）。内閣総理大臣の任命、法律・条約の公布、国会の召集、衆議院の解散などがある。"},{"t":"qa","s":"象徴天皇制","imp":3,"q":"天皇の国事行為に必要とされ、その責任を内閣が負うこととされているものは何か。","a":"内閣の助言と承認","alt":["助言と承認"],"e":"第3条は「天皇の国事に関するすべての行為には、内閣の助言と承認を必要とし、内閣が、その責任を負ふ」と定める。天皇が政治的な判断を行わず、責任も負わない仕組みである。"},{"t":"mc","s":"象徴天皇制","imp":2,"q":"日本国憲法が定める天皇の国事行為として適当でないものを一つ選べ。","c":["国会の指名に基づいて内閣総理大臣を任命すること","内閣の指名に基づいて最高裁判所長官を任命すること","内閣の助言と承認により衆議院を解散すること","外国と条約を締結すること"],"a":3,"e":"条約の締結は内閣の職務（73条3号）であり、天皇は条約を公布したり批准書などを認証したりするにとどまるので、「条約を締結すること」が適当でない。内閣総理大臣の任命（6条1項）、最高裁判所長官の任命（6条2項）、衆議院の解散（7条3号）はいずれも国事行為である。"},{"t":"tf","s":"象徴天皇制","imp":2,"q":"天皇は国政に関する権能を有しないが、内閣の助言と承認があれば、国政に関する重要な決定を自ら行うことができる。","a":false,"e":"正しくは、天皇は憲法の定める国事に関する行為のみを行い、国政に関する権能を有しない（4条）。内閣の助言と承認があっても、天皇が政治的な決定を行うことはない。"},{"t":"qa","s":"象徴天皇制","imp":2,"q":"皇位の継承や皇族の範囲など皇室に関する事項を定め、日本国憲法のもとでは国会が議決する法律とされているものは何か。","a":"皇室典範","e":"大日本帝国憲法のもとでは憲法と並ぶ法典とされ、議会は関与できなかったが、日本国憲法のもとでは国会の議決した法律である（2条）。2017年には天皇の退位を認める特例法が制定され、2019年に退位と即位が行われた。"},{"t":"ex","s":"象徴天皇制","imp":2,"q":"大日本帝国憲法と日本国憲法とで、天皇の地位と権限はどのように変わったか説明せよ。","a":"大日本帝国憲法では、天皇は神聖不可侵の元首として統治権を総攬し、天皇大権や統帥権をもつ主権者であった。日本国憲法では、天皇は日本国と日本国民統合の象徴とされ、その地位は主権者である国民の総意に基づく。天皇は国政に関する権能をもたず、内閣の助言と承認のもとで形式的・儀礼的な国事行為のみを行う。","e":"ポイント：①主権者・統治権の総攬者から象徴へ ②地位の根拠は国民の総意 ③国政に関する権能をもたない ④国事行為には内閣の助言と承認が必要"},{"t":"qa","s":"憲法改正","imp":3,"q":"日本国憲法の改正手続を定めているのは第何条か。","a":"第96条","alt":["96条","96"],"e":"各議院の総議員の3分の2以上の賛成で国会が発議し、国民投票で過半数の賛成を得ると承認される。承認された改正は、天皇が国民の名で公布する。"},{"t":"qa","s":"憲法改正","imp":3,"q":"日本国憲法の改正を国会が発議するには、各議院でどれだけの賛成が必要か。","a":"総議員の3分の2以上","alt":["総議員の三分の二以上","3分の2以上","三分の二以上"],"e":"「出席議員」ではなく「総議員」の3分の2以上である点に注意する。法律案の議決は原則として出席議員の過半数、衆議院による法律案の再可決は出席議員の3分の2以上である。"},{"t":"mc","s":"憲法改正","imp":2,"q":"衆議院の議員定数が465人、参議院の議員定数が248人で、欠員がないとする。国会が憲法改正を発議するために各議院で最低限必要な賛成議員の数の組合せとして最も適当なものを一つ選べ。","c":["衆議院310人・参議院166人","衆議院233人・参議院125人","衆議院310人・参議院165人","衆議院310人（参議院の賛成は不要）"],"a":0,"e":"発議には各議院の総議員の3分の2以上の賛成が必要である。衆議院は465×2/3＝310なので310人以上、参議院は248×2/3＝165.33…なので166人以上が必要となる。233人・125人は総議員の過半数なので誤り。参議院165人では3分の2に届かないので誤り。憲法改正の発議に衆議院の優越はなく、参議院の賛成も必要なので誤り。"},{"t":"tf","s":"憲法改正","imp":3,"q":"憲法改正の発議について衆議院と参議院の議決が異なった場合には、衆議院の議決が国会の議決となる。","a":false,"e":"正しくは、憲法改正の発議には衆議院の優越は認められておらず、衆議院と参議院がそれぞれ総議員の3分の2以上の賛成で可決しなければならない。"},{"t":"qa","s":"憲法改正","imp":2,"q":"2007年に制定され、憲法改正の国民投票の具体的な手続を定めた法律を一般に何というか。","a":"国民投票法","alt":["日本国憲法の改正手続に関する法律","憲法改正国民投票法"],"e":"2010年に施行された。投票できるのは満18歳以上の日本国民で、最低投票率の定めはなく、賛成票が賛成票と反対票の合計の過半数となれば承認される。"},{"t":"tf","s":"憲法改正","imp":2,"q":"国民投票法では、投票率が50％に満たない場合には、憲法改正の国民投票は無効になると定められている。","a":false,"e":"正しくは、国民投票法には最低投票率の定めはない。投票率が低くても、賛成票が賛成票と反対票の合計の過半数となれば憲法改正は承認される。このため、低い投票率でも改正が成立しうることが議論になっている。"},{"t":"tf","s":"憲法改正","imp":2,"q":"憲法改正の国民投票で投票できるのは、満18歳以上の日本国民である。","a":true,"e":"正しい。2014年の国民投票法の改正により、2018年から投票権年齢が18歳以上となった。公職選挙法の選挙権年齢も2016年から18歳以上である。"},{"t":"qa","s":"憲法改正","imp":3,"q":"日本国憲法のように、改正するために通常の法律よりも厳しい手続を必要とする憲法を何というか。","a":"硬性憲法","e":"通常の法律と同じ手続で改正できる憲法は軟性憲法という。日本国憲法は施行以来、一度も改正されていない。"},{"t":"ex","s":"憲法改正","imp":2,"q":"日本国憲法の改正手続を、発議から公布まで説明せよ。","a":"憲法改正は、衆議院と参議院のそれぞれで総議員の3分の2以上の賛成によって国会が発議し、国民に提案する。国民投票で過半数の賛成が得られると承認され、天皇が国民の名で、この憲法と一体を成すものとして直ちに公布する。","e":"ポイント：①各議院の総議員の3分の2以上で発議 ②衆議院の優越はない ③国民投票で過半数の賛成 ④天皇が国民の名で公布する"},{"t":"qa","s":"最高法規と尊重擁護","imp":3,"q":"日本国憲法第98条1項は、憲法が国の何であると定めているか。","a":"最高法規","e":"98条1項は「この憲法は、国の最高法規であつて、その条規に反する法律、命令、詔勅及び国務に関するその他の行為の全部又は一部は、その効力を有しない」と定める。98条2項は、条約と確立された国際法規を誠実に遵守することを定めている。"},{"t":"tf","s":"最高法規と尊重擁護","imp":1,"q":"日本国憲法第97条は、基本的人権を、天皇が国民に恩恵として与えた権利であると定めている。","a":false,"e":"正しくは、97条は基本的人権を「人類の多年にわたる自由獲得の努力の成果」であり、現在及び将来の国民に「侵すことのできない永久の権利として信託されたもの」と定めている。恩恵として与えられた権利という考え方は、大日本帝国憲法の臣民の権利のものである。"},{"t":"tf","s":"最高法規と尊重擁護","imp":3,"q":"日本国憲法第99条は、天皇や国務大臣、国会議員、裁判官などの公務員とともに、国民にも憲法を尊重し擁護する義務を課している。","a":false,"e":"正しくは、99条で憲法尊重擁護義務を負うのは、天皇又は摂政及び国務大臣、国会議員、裁判官その他の公務員であり、国民は挙げられていない。憲法は国家権力を縛るものという立憲主義の考え方の表れである。"},{"t":"ex","s":"最高法規と尊重擁護","imp":2,"q":"日本国憲法第99条の憲法尊重擁護義務の対象に国民が含まれていない理由を、立憲主義の考え方から説明せよ。","a":"立憲主義では、憲法は国民が国家権力を制限し、自らの権利と自由を守るために定めるものと考える。そのため、憲法を守る義務を負うのは、権力を行使する天皇や国務大臣・国会議員・裁判官などの公務員であり、権力を制限する側の国民は義務の対象とされていない。","e":"ポイント：①憲法は国家権力を縛るもの ②義務を負うのは権力を行使する公務員 ③国民は権力を制限する主体 ④99条は立憲主義の表れ"},{"t":"mc","s":"最高法規と尊重擁護","imp":2,"q":"日本国憲法の最高法規性についての記述として最も適当なものを一つ選べ。","c":["憲法の条規に反する法律や命令は、その全部または一部が効力を有しない。","憲法を尊重し擁護する義務は、公務員だけでなくすべての国民に課されている。","国会が法律を制定すれば、憲法改正の手続を経なくても憲法の内容を変更できる。","条約は憲法よりも上位にあるため、憲法に反する条約も国内では有効とされている。"],"a":0,"e":"98条1項により、憲法に反する法律・命令・詔勅などは効力を有しないので正しい。憲法尊重擁護義務（99条）は公務員に課され、国民は挙げられていないので誤り。憲法の変更には96条の改正手続が必要で、法律で変えることはできないので誤り。条約は98条2項で誠実な遵守が求められるが、通説では憲法が条約に優位すると解されているので誤り。"}]});</script>
<script>QDATA.push({"unit":"u06","questions":[{"t":"qa","s":"憲法第9条と政府解釈","imp":3,"q":"日本国憲法第9条1項の「日本国民は、正義と秩序を基調とする国際平和を誠実に希求し、国権の発動たる戦争と、武力による威嚇又は武力の行使は、国際紛争を解決する手段としては、永久にこれを（　）する」という一節の空欄に入る語は何か。","a":"放棄","e":"9条1項は戦争の放棄、2項は戦力の不保持と交戦権の否認を定める。前文の平和的生存権とあわせて、日本国憲法の平和主義の中心となる規定である。"},{"t":"qa","s":"憲法第9条と政府解釈","imp":3,"q":"日本国憲法第9条2項の「前項の目的を達するため、陸海空軍その他の（　）は、これを保持しない。国の交戦権は、これを認めない」という一節の空欄に入る語は何か。","a":"戦力","e":"2項は戦力の不保持と交戦権の否認を定める。冒頭の「前項の目的を達するため」という語句は、帝国議会の審議で芦田均の提案により加えられた（芦田修正）。"},{"t":"ex","s":"憲法第9条と政府解釈","imp":3,"q":"自衛隊は憲法第9条2項が保持を禁じる「戦力」にあたらないとする政府の解釈を説明せよ。","a":"政府は、憲法9条は主権国家に固有の自衛権まで否定しておらず、自衛のための必要最小限度の実力を保持することは禁じられていないと解釈している。9条2項が保持を禁じる「戦力」とは自衛のための必要最小限度を超える実力をいい、自衛隊はこれにあたらないので合憲であるとしている。","e":"ポイント：①自衛権は否定されていない ②自衛のための必要最小限度の実力は保持できる ③それを超えるものが「戦力」 ④自衛隊は戦力にあたらない（大陸間弾道ミサイルや攻撃型空母などの攻撃的兵器の保有は許されないとする）"},{"t":"mc","s":"憲法第9条と政府解釈","imp":2,"q":"自衛隊と憲法第9条の関係について、政府の解釈に沿って説明している生徒の発言として最も適当なものを一つ選べ。","c":["憲法は自衛権を否定していないので、自衛のための必要最小限度の実力をもつことは許されるという立場だね。","憲法9条は自衛のための戦争も含めてすべての武力の行使を禁じているので、自衛隊は違憲だという立場だね。","自衛隊は9条2項の戦力にあたるけれど、日米安全保障条約があるので保持が認められるという立場だね。","自衛のための実力であれば、どれほど強大な攻撃的兵器をもっても憲法上の限界はないという立場だね。"],"a":0,"e":"政府は、自衛権は否定されておらず、自衛のための必要最小限度の実力は9条2項の戦力にあたらないとしているので、最初の発言が正しい。自衛隊を違憲とするのは一部の学説などの立場で、政府の解釈ではないので誤り。政府は自衛隊は戦力にあたらないとしているので、「戦力にあたるが保持が認められる」は誤り。政府は大陸間弾道ミサイルや攻撃型空母などの攻撃的兵器は必要最小限度を超え、保有できないとしているので誤り。"},{"t":"tf","s":"憲法第9条と政府解釈","imp":1,"q":"日本国憲法を審議した帝国議会で、吉田茂首相は、憲法9条は自衛権の発動としての戦争も放棄したものであると答弁した。","a":true,"e":"正しい。1946年の吉田首相の答弁はこのような立場であった。その後、警察予備隊・保安隊・自衛隊と実力組織がつくられる中で、政府は自衛のための必要最小限度の実力は戦力にあたらないとする解釈を示すようになった。"},{"t":"qa","s":"自衛隊の創設","imp":3,"q":"1950年に朝鮮戦争が始まると、GHQの指令によって創設された、自衛隊の前身となる組織は何か。","a":"警察予備隊","e":"在日米軍が朝鮮半島に出動した後の国内の治安維持を目的として創設された。1952年に保安隊（海上は警備隊）に改組され、1954年に自衛隊が発足した。"},{"t":"mc","s":"自衛隊の創設","imp":2,"q":"自衛隊の創設をめぐる記述として最も適当なものを一つ選べ。","c":["朝鮮戦争の勃発を機に警察予備隊が創設され、保安隊への改組を経て、1954年に自衛隊が発足した。","サンフランシスコ平和条約の締結と同時に、警察予備隊にかえて自衛隊が発足した。","1954年に防衛省が設置され、その指揮のもとで自衛隊が発足した。","自衛隊は、1960年の日米安全保障条約の改定にともなって創設された。"],"a":0,"e":"警察予備隊（1950年）→保安隊（1952年）→自衛隊（1954年）という流れが正しい。平和条約の締結（1951年）と同時に自衛隊が発足したわけではないので誤り。1954年に設置されたのは防衛庁であり、防衛省に昇格したのは2007年なので誤り。自衛隊の発足は1954年で、安保条約の改定（1960年）より前なので誤り。"},{"t":"qa","s":"日米安全保障条約","imp":3,"q":"1951年、サンフランシスコ平和条約と同じ日に調印され、日本の独立後もアメリカ軍が日本に駐留することを認めた条約は何か。","a":"日米安全保障条約","alt":["日米安保条約","安保条約","旧日米安全保障条約"],"e":"旧条約は米軍の駐留を認める一方で、アメリカの日本防衛義務が明記されていないなど片務的な内容だった。1960年に岸信介内閣のもとで改定され、激しい反対運動（安保闘争）が起こった。"},{"t":"ex","s":"日米安全保障条約","imp":3,"q":"1960年に改定された日米安全保障条約で、旧条約からどのような点が改められたか説明せよ。","a":"旧条約は米軍の駐留を認める一方で、アメリカの日本防衛義務が明記されていなかった。新条約では、日本の施政下にある領域への武力攻撃に日米が共同で対処する共同防衛が定められ、在日米軍の配置や装備の重要な変更などについて日本政府と協議する事前協議制度が設けられた。","e":"ポイント：①旧条約は片務的だった ②日本の施政下の領域への武力攻撃に対する共同防衛（第5条） ③日本による米軍への基地提供（第6条） ④事前協議制度"},{"t":"tf","s":"日米安全保障条約","imp":2,"q":"日米安全保障条約の共同防衛の対象は日米両国の全領域に及ぶため、アメリカ本土が武力攻撃を受けた場合には、日本も共同で防衛する義務を負う。","a":false,"e":"正しくは、共同防衛の対象は「日本国の施政の下にある領域」への武力攻撃に限られ、日本はアメリカ本土を防衛する義務を負わない。そのかわりに、日本は米軍に施設・区域（基地）を提供している（第6条）。"},{"t":"qa","s":"日米安全保障条約","imp":2,"q":"日米安全保障条約にともない、在日米軍の配置や装備の重要な変更、日本からの戦闘作戦行動のための基地使用について、事前に日本政府と協議するとされた制度を何というか。","a":"事前協議","alt":["事前協議制度","事前協議制"],"e":"1960年の条約改定時の交換公文で定められたが、これまで実際に事前協議が行われたことは一度もない。核兵器の持ち込みをめぐる密約の存在も指摘されてきた。"},{"t":"qa","s":"日米安全保障条約","imp":2,"q":"在日米軍の施設・区域の使用や、米軍人とその家族などの法的地位について定めた日米間の協定は何か。","a":"日米地位協定","alt":["地位協定"],"e":"1960年に新安保条約とともに結ばれた。公務中の米軍人の犯罪については米側が優先的に裁判権をもつなど日本側の権限が制限されており、沖縄などから改定を求める声が強い。"},{"t":"qa","s":"日米安全保障条約","imp":1,"q":"日米の防衛協力のあり方を定めた文書で、1978年に策定され、1997年と2015年に改定されたものを一般に何というか。","a":"日米防衛協力のための指針","alt":["ガイドライン","日米ガイドライン","防衛協力の指針"],"e":"1997年の改定では日本周辺地域の事態での協力が定められ、周辺事態法の制定につながった。2015年の改定では地理的な制約をなくし、平時から緊急事態まで切れ目のない協力を掲げた。"},{"t":"mc","s":"日米安全保障条約","imp":2,"q":"日米安全保障体制についての記述として適当でないものを一つ選べ。","c":["1951年の旧日米安全保障条約は、サンフランシスコ平和条約と同じ日に調印された。","1960年の新条約では、日本の施政下にある領域への武力攻撃に共同で対処することが定められた。","日本は在日米軍の駐留経費の一部を負担しており、その予算は「思いやり予算」とも呼ばれてきた。","新条約の締結により、在日米軍基地は日本政府の管理下に置かれ、公務中の米軍人の行為にも日本の裁判権がすべて及ぶようになった。"],"a":3,"e":"日米地位協定により、施設・区域の運営や管理に必要な権限は米側がもち、公務中の米軍人の犯罪は米側が優先して裁判権をもつので、「日本の裁判権がすべて及ぶようになった」とする記述が適当でない。旧条約は1951年9月8日に平和条約と同じ日に調印された。新条約は第5条で共同防衛を定めた。日本は1978年度から在日米軍の駐留経費の一部を負担しており、思いやり予算と呼ばれてきた（2022年度からは政府が同盟強靱化予算とも呼んでいる）。"}]});</script>
<script>QDATA.push({"unit":"u06","questions":[{"t":"qa","s":"平和主義と裁判","imp":3,"q":"1957年、東京都の米軍立川飛行場の拡張に反対するデモ隊の一部が基地内に立ち入って起訴され、在日米軍の駐留の合憲性が争われた事件を何というか。","a":"砂川事件","e":"1959年の東京地裁判決（伊達判決）は、在日米軍は9条2項が禁じる戦力にあたり違憲であるとして被告人を無罪とした。しかし最高裁は、検察の跳躍上告を受けて同年にこの判決を破棄した。"},{"t":"qa","s":"平和主義と裁判","imp":3,"q":"高度な政治性をもつ国家の行為は、一見極めて明白に違憲無効と認められない限り、裁判所の司法審査の対象外であるとする考え方を何というか。","a":"統治行為論","alt":["統治行為"],"e":"最高裁は砂川事件判決（1959年）で、日米安全保障条約は高度な政治性をもち、一見極めて明白に違憲無効とはいえないとして、合憲・違憲の判断を避けた。衆議院の解散の効力が争われた苫米地事件（1960年）でも用いられた。"},{"t":"tf","s":"平和主義と裁判","imp":2,"q":"最高裁判所は砂川事件の判決で、日米安全保障条約に基づく米軍の駐留は憲法第9条に違反すると判断した。","a":false,"e":"正しくは、最高裁は、9条2項が保持を禁じる戦力とは日本が指揮権・管理権を行使できる戦力をいい、外国の軍隊は含まれないとした。そのうえで日米安全保障条約については統治行為論により判断を避けた。米軍の駐留を違憲としたのは一審の伊達判決である。"},{"t":"qa","s":"平和主義と裁判","imp":1,"q":"北海道で自衛隊の演習に抗議した酪農家が自衛隊の通信線を切断して起訴され、1967年に裁判所が自衛隊の憲法判断に立ち入らずに無罪とした事件を何というか。","a":"恵庭事件","e":"札幌地裁は、通信線は自衛隊法が保護する「防衛の用に供する物」にあたらないとして無罪とし、自衛隊が合憲か違憲かの判断を示さなかった。検察が控訴しなかったため、判決は確定した。"},{"t":"mc","s":"平和主義と裁判","imp":2,"q":"北海道に航空自衛隊のミサイル基地を建設するため国が保安林の指定を解除したことに対し、住民がその取消しを求めた訴訟で、一審は自衛隊を違憲と判断したが、二審と最高裁は住民に訴えの利益がないとした。この訴訟として最も適当なものを一つ選べ。","c":["長沼ナイキ基地訴訟","砂川事件","恵庭事件","百里基地訴訟"],"a":0,"e":"保安林の指定解除をめぐる長沼ナイキ基地訴訟である。1973年の札幌地裁判決（福島判決）は、自衛隊を9条2項の戦力にあたり違憲とした初めての判決となった。1976年の札幌高裁は訴えの利益がないとして一審判決を取り消し、統治行為論にも言及した。1982年に最高裁は上告を棄却した。砂川事件は米軍基地への立ち入り、恵庭事件は通信線の切断、百里基地訴訟は基地用地の売買契約をめぐる事件である。"},{"t":"mc","s":"平和主義と裁判","imp":2,"q":"平和主義をめぐる裁判についての記述として最も適当なものを一つ選べ。","c":["砂川事件の最高裁判決は、日米安全保障条約について、一見極めて明白に違憲無効とは認められないとして、司法審査の対象外とした。","長沼ナイキ基地訴訟の最高裁判決は、一審判決を支持して自衛隊を違憲と判断した。","恵庭事件の判決は、自衛隊を合憲と明確に判断したうえで、被告人を有罪とした。","百里基地訴訟の最高裁判決は、自衛隊を違憲と判断し、基地用地の売買契約を無効とした。"],"a":0,"e":"砂川事件の最高裁判決は統治行為論により安保条約の憲法判断を避けたので正しい。長沼ナイキ基地訴訟で自衛隊を違憲としたのは一審だけであり、最高裁は訴えの利益がないとして上告を棄却したので誤り。恵庭事件は憲法判断に立ち入らずに無罪としたので誤り。百里基地訴訟の最高裁は、9条は私法上の契約に直接適用されないとし、自衛隊の憲法判断を示さなかったので誤り。"},{"t":"tf","s":"平和主義と裁判","imp":1,"q":"百里基地訴訟で最高裁判所は、憲法9条は国が私人と対等の立場で結ぶ売買契約に直接適用されるものではないとして、自衛隊の合憲性について判断を示さなかった。","a":true,"e":"正しい。茨城県の航空自衛隊百里基地の用地売買をめぐる訴訟で、1989年の最高裁判決は、国の私法上の行為に9条は直接適用されないとし、自衛隊の憲法判断に立ち入らなかった。"},{"t":"ex","s":"平和主義と裁判","imp":2,"q":"自衛隊や日米安全保障条約の合憲性について、最高裁判所がどのような態度をとってきたか説明せよ。","a":"最高裁判所は、砂川事件で日米安全保障条約は高度な政治性をもつとして統治行為論を示し、一見極めて明白に違憲無効とはいえないとして判断を避けた。長沼ナイキ基地訴訟では住民に訴えの利益がないとし、百里基地訴訟では9条は私法上の行為に直接適用されないとするなど、自衛隊の合憲性について正面から判断したことはない。","e":"ポイント：①砂川事件と統治行為論 ②長沼ナイキ基地訴訟は訴えの利益なし ③百里基地訴訟は私法上の行為に9条は直接適用されない ④自衛隊の憲法判断は示されていない"},{"t":"qa","s":"専守防衛と文民統制","imp":3,"q":"相手から武力攻撃を受けたときに初めて防衛力を行使し、その行使も保持する防衛力も自衛のための必要最小限度にとどめるという、日本の防衛の基本方針を何というか。","a":"専守防衛","e":"憲法の平和主義に基づく受動的な防衛の姿勢である。2022年の安保3文書で反撃能力の保有が決められたが、政府は専守防衛の考え方は変わらないとしている。"},{"t":"qa","s":"専守防衛と文民統制","imp":3,"q":"軍事に対する政治の優位を確保するため、軍隊（自衛隊）を国民の代表である文民が統制するという原則を何というか。","a":"文民統制","alt":["シビリアン・コントロール","シビリアンコントロール"],"e":"憲法66条2項は「内閣総理大臣その他の国務大臣は、文民でなければならない」と定める。自衛隊の最高指揮監督権は内閣総理大臣がもち、防衛出動には原則として国会の事前の承認が必要である。"},{"t":"ex","s":"専守防衛と文民統制","imp":2,"q":"日本で文民統制が重視される理由と、それを実現するための主なしくみを説明せよ。","a":"戦前の日本では、統帥権の独立などを背景に軍部が政治に介入し、戦争に突き進んだ。この反省から、憲法66条2項で内閣総理大臣と国務大臣は文民でなければならないと定め、自衛隊の最高指揮監督権を内閣総理大臣がもち、防衛出動には原則として国会の承認を必要とするなど、国民の代表が自衛隊を統制するしくみがとられている。","e":"ポイント：①戦前の軍部の政治介入への反省 ②66条2項の文民規定 ③内閣総理大臣の最高指揮監督権 ④防衛出動への国会の承認や国家安全保障会議"},{"t":"mc","s":"専守防衛と文民統制","imp":2,"q":"日本の文民統制のしくみとして適当でないものを一つ選べ。","c":["内閣総理大臣その他の国務大臣は、文民でなければならない。","内閣総理大臣が、内閣を代表して自衛隊の最高指揮監督権をもつ。","防衛出動を命じるには、原則として事前に国会の承認を得なければならない。","現職の自衛官の中から防衛大臣を任命し、自衛隊の運用を直接指揮させる。"],"a":3,"e":"防衛大臣を含む国務大臣は文民でなければならない（66条2項）ので、現職の自衛官を防衛大臣にすることは文民統制に反し、適当でない。内閣総理大臣の最高指揮監督権、防衛出動への国会の承認は、いずれも文民統制のしくみである。"},{"t":"qa","s":"専守防衛と文民統制","imp":1,"q":"外交・防衛など国家安全保障に関する重要事項を審議するため2013年に内閣に設置された、内閣総理大臣・内閣官房長官・外務大臣・防衛大臣による4大臣会合を中核とする機関は何か。","a":"国家安全保障会議","alt":["日本版NSC","NSC"],"e":"それまでの安全保障会議を改組して設置され、事務局として国家安全保障局が置かれた。安全保障政策の司令塔とされ、文民統制を担う機関の一つでもある。"},{"t":"qa","s":"防衛政策の原則","imp":3,"q":"核兵器を「持たず、つくらず、持ち込ませず」という日本政府の方針を何というか。","a":"非核三原則","e":"1967年に佐藤栄作首相が国会で表明し、1971年には衆議院で決議された。法律で定められたものではなく、国是とされる政府の基本方針である。"},{"t":"tf","s":"防衛政策の原則","imp":1,"q":"非核三原則は、原子力基本法によって法律上の義務として定められている。","a":false,"e":"正しくは、非核三原則は国会決議などで確認されてきた政府の基本方針であり、法律で定められたものではない。なお原子力基本法は、原子力の利用を平和の目的に限ると定めている。"},{"t":"qa","s":"防衛政策の原則","imp":2,"q":"2014年に、それまで武器の輸出を事実上禁止してきた武器輸出三原則にかわって閣議決定された、一定の条件のもとで防衛装備品の輸出を認める原則を何というか。","a":"防衛装備移転三原則","e":"武器輸出三原則は1967年に佐藤内閣が表明し、1976年の三木内閣の政府統一見解で事実上の全面禁止となっていた。2014年に、移転を禁止する場合を明確にしたうえで、厳格な審査のもとで移転を認める方式に転換した。"},{"t":"mc","s":"防衛政策の原則","imp":2,"q":"日本の防衛政策の原則についての記述として最も適当なものを一つ選べ。","c":["防衛費をGNPの1％以内に抑えるとする枠は、1980年代に撤廃された。","非核三原則とは、核兵器を持たず、つくらず、使わずという方針である。","武器輸出三原則は現在も維持され、防衛装備品の海外への移転は全面的に禁止されている。","専守防衛とは、攻撃を受けるおそれがあれば先制して相手国を攻撃し、被害を未然に防ぐ方針である。"],"a":0,"e":"防衛費のGNP1％枠は1976年に三木内閣が閣議決定したが、1987年度予算の編成にあたって中曽根内閣が撤廃し、総額明示方式に改めたので正しい。非核三原則は「持たず、つくらず、持ち込ませず」なので誤り。武器輸出三原則は2014年に防衛装備移転三原則に改められたので誤り。専守防衛は攻撃を受けて初めて防衛力を行使する方針なので誤り。"},{"t":"qa","s":"防衛政策の原則","imp":2,"q":"2022年に閣議決定された安保3文書で保有が決められた、ミサイルなどによる攻撃を受けた場合に、相手の領域内のミサイル発射拠点などに有効な反撃を加える能力を何というか。","a":"反撃能力","alt":["敵基地攻撃能力"],"e":"安保3文書とは、国家安全保障戦略・国家防衛戦略・防衛力整備計画のことである。反撃能力は以前は敵基地攻撃能力とも呼ばれ、政府は武力行使の三要件を満たす場合に限って行使でき、先制攻撃は許されないとしている。"},{"t":"ex","s":"防衛政策の原則","imp":1,"q":"2022年に閣議決定された安保3文書によって、日本の防衛政策がどのように転換したか説明せよ。","a":"2022年、国家安全保障戦略・国家防衛戦略・防衛力整備計画の安保3文書が閣議決定され、相手のミサイル発射拠点などに反撃する反撃能力の保有が決められた。また、2027年度に防衛費とその関連経費をあわせてGDP比2％の水準とする方針が示された。政府は専守防衛を維持するとしているが、その整合性をめぐって議論がある。","e":"ポイント：①安保3文書の名称 ②反撃能力の保有 ③防衛費と関連経費をGDP比2％の水準に ④専守防衛との関係をめぐる議論"}]});</script>
<script>QDATA.push({"unit":"u06","questions":[{"t":"qa","s":"集団的自衛権と安保法制","imp":3,"q":"自国と密接な関係にある外国が武力攻撃を受けたとき、自国が直接攻撃されていなくても、その攻撃を実力で阻止する権利を何というか。","a":"集団的自衛権","e":"国連憲章51条は、安全保障理事会が必要な措置をとるまでの間、個別的自衛権と集団的自衛権を国家の「固有の権利」として認めている。自国への攻撃に反撃する個別的自衛権と区別する。"},{"t":"mc","s":"集団的自衛権と安保法制","imp":3,"q":"次の事例のうち、集団的自衛権の行使にあたるものとして最も適当なものを一つ選べ。","c":["A国と密接な関係にあるB国が武力攻撃を受け、A国は直接攻撃されていないが、B国とともに攻撃国に反撃する。","A国の領土が武力攻撃を受けたため、A国の軍隊が攻撃国に反撃する。","国連安全保障理事会の決議に基づき、加盟国が協力して侵略国に軍事的な制裁を加える。","停戦合意が成立した地域で、国連の指揮のもと、各国の部隊が停戦の監視を行う。"],"a":0,"e":"自国が直接攻撃されていなくても、密接な関係にある他国への攻撃を実力で阻止するのが集団的自衛権である。自国への攻撃に反撃するのは個別的自衛権なので誤り。安保理の決議に基づく制裁は国連の集団安全保障の措置なので誤り。停戦の監視は国連平和維持活動（PKO）なので誤り。"},{"t":"tf","s":"集団的自衛権と安保法制","imp":3,"q":"日本政府は、日本国憲法の制定当初から一貫して、集団的自衛権の行使は憲法上認められると解釈してきた。","a":false,"e":"正しくは、政府は長く、日本は国際法上は集団的自衛権を保有しているが、その行使は憲法上許されないと解釈してきた。2014年の閣議決定でこの解釈を変更し、一定の要件のもとで限定的に行使できるとした。"},{"t":"qa","s":"集団的自衛権と安保法制","imp":3,"q":"日本と密接な関係にある他国への武力攻撃が発生し、これにより日本の存立が脅かされ、国民の生命・自由・幸福追求の権利が根底から覆される明白な危険がある事態を、2015年の安全保障関連法で何というか。","a":"存立危機事態","e":"この事態で、他に適当な手段がなく、必要最小限度の実力行使にとどまるという「武力行使の新三要件」を満たす場合に限り、集団的自衛権の限定的な行使が認められる。"},{"t":"ex","s":"集団的自衛権と安保法制","imp":3,"q":"2014年の閣議決定と2015年の安全保障関連法によって、集団的自衛権についての政府の立場がどのように変わったか説明せよ。","a":"政府は従来、集団的自衛権は国際法上保有しているが、憲法9条のもとでは行使できないと解釈してきた。2014年の閣議決定でこの解釈を変更し、2015年の安全保障関連法で、存立危機事態において武力行使の新三要件を満たす場合に限り、集団的自衛権を限定的に行使できるとした。これに対しては、憲法改正によらない解釈の変更は立憲主義に反するとの批判もある。","e":"ポイント：①従来は保有しているが行使できないとしていた ②2014年の閣議決定による解釈の変更 ③存立危機事態と新三要件による限定的な行使 ④解釈改憲であるとの批判"},{"t":"mc","s":"集団的自衛権と安保法制","imp":2,"q":"2015年に成立した安全保障関連法についての記述として適当でないものを一つ選べ。","c":["存立危機事態において、集団的自衛権を限定的に行使することが可能になった。","周辺事態法が改められ、重要影響事態において米軍などへの後方支援を地理的な制約なく行えるようになった。","国際平和支援法により、国際社会の平和のために活動する外国軍隊への後方支援を、そのつど特別措置法を制定せずに行えるようになった。","日本と密接な関係にある国が攻撃を受けた場合には、日本の存立が脅かされていなくても、集団的自衛権を無制限に行使できるようになった。"],"a":3,"e":"集団的自衛権の行使は、存立危機事態において武力行使の新三要件を満たす場合に限られるので、「無制限に行使できる」は言い過ぎで適当でない。周辺事態法は重要影響事態安全確保法に改められ、「周辺」という地理的な限定がなくなった。国際平和支援法は、テロ対策特別措置法などの期限付きの特別措置法にかわる恒久法であり、派遣には例外なく国会の事前承認が必要とされる。"},{"t":"ex","s":"自衛隊の海外派遣","imp":2,"q":"湾岸戦争をきっかけに、自衛隊の海外派遣がどのように始まったか説明せよ。","a":"1991年の湾岸戦争で、日本は多額の資金を拠出したが、人的な貢献がないとの批判を受けた。戦争後、海上自衛隊の掃海艇がペルシャ湾に派遣されて機雷の除去にあたり、自衛隊が実際の任務で海外に派遣された初めての例となった。さらに1992年にはPKO協力法が制定され、自衛隊が国連平和維持活動に参加できるようになった。","e":"ポイント：①湾岸戦争での資金協力と批判 ②ペルシャ湾への掃海艇派遣（1991年） ③PKO協力法の制定（1992年） ④カンボジアへの派遣"},{"t":"qa","s":"自衛隊の海外派遣","imp":3,"q":"1992年に制定され、自衛隊が国連平和維持活動（PKO）に参加する道を開いた法律は何か。","a":"PKO協力法","alt":["国際平和協力法","国連平和維持活動協力法"],"e":"この法律に基づき、1992年にカンボジアへ自衛隊が派遣された。その後もモザンビーク、ゴラン高原、東ティモール、南スーダンなどに派遣された。"},{"t":"qa","s":"自衛隊の海外派遣","imp":2,"q":"1992年、PKO協力法に基づいて自衛隊が初めて国連平和維持活動に派遣された国はどこか。","a":"カンボジア","e":"国連カンボジア暫定統治機構（UNTAC）のもとで、陸上自衛隊の施設部隊が道路や橋の補修などを行った。"},{"t":"mc","s":"自衛隊の海外派遣","imp":2,"q":"PKO協力法に定められたPKO参加5原則に含まれないものを一つ選べ。","c":["紛争当事者の間で停戦の合意が成立していること","受入れ国と紛争当事者が、PKOと日本の参加に同意していること","中立的な立場を厳守すること","国連安全保障理事会のすべての常任理事国が、日本の参加に賛成していること"],"a":3,"e":"常任理事国すべての賛成という条件はPKO参加5原則にない。5原則は、停戦合意の成立、受入れ国と紛争当事者の同意、中立的立場の厳守、これらの条件が満たされなくなった場合の撤収、武器の使用は要員の生命等の防護のための必要最小限を基本とすること、の五つである。"},{"t":"tf","s":"自衛隊の海外派遣","imp":2,"q":"1999年に制定された周辺事態法は、日本周辺の地域で日本の平和と安全に重要な影響を与える事態が起きた場合に、自衛隊が米軍への後方地域支援を行うことを定めた。","a":true,"e":"正しい。1997年の日米ガイドラインの改定を受けて制定された。2015年の安全保障関連法で重要影響事態安全確保法に改められ、「周辺」という地理的な限定がなくなった。"},{"t":"mc","s":"自衛隊の海外派遣","imp":2,"q":"自衛隊の海外での活動と、その根拠となった法律の組合せとして最も適当なものを一つ選べ。","c":["インド洋での外国艦船への給油活動－テロ対策特別措置法","イラクのサマワでの人道復興支援活動－PKO協力法","カンボジアでの道路や橋の補修－周辺事態法","ソマリア沖・アデン湾での船舶の護衛－国際平和支援法"],"a":0,"e":"2001年のアメリカ同時多発テロ後に制定されたテロ対策特別措置法に基づき、海上自衛隊はインド洋で給油活動を行った。イラクでの活動の根拠は2003年のイラク復興支援特別措置法なので誤り。カンボジアへの派遣の根拠はPKO協力法なので誤り。ソマリア沖での船舶の護衛は2009年に制定された海賊対処法などに基づくので誤り。"},{"t":"qa","s":"自衛隊の海外派遣","imp":1,"q":"2003年に制定され、陸上自衛隊がイラク南部のサマワで給水や医療、施設の復旧などの人道復興支援活動を行う根拠となった法律は何か。","a":"イラク復興支援特別措置法","alt":["イラク特措法","イラク復興支援特措法","イラク人道復興支援特別措置法"],"e":"活動は「非戦闘地域」に限るとされた。陸上自衛隊は2004年から2006年までサマワで活動し、航空自衛隊は2008年まで輸送活動を行った。"},{"t":"tf","s":"自衛隊の海外派遣","imp":1,"q":"南スーダンのPKOに派遣された陸上自衛隊には、2016年、安全保障関連法に基づいて、離れた場所で襲われた国連職員などを救助に向かう「駆け付け警護」の任務が初めて付与された。","a":true,"e":"正しい。2015年のPKO協力法の改正で駆け付け警護が可能となり、任務の遂行のための武器使用も一定の範囲で認められた。南スーダンに派遣されていた施設部隊は2017年に撤収した。"}]});</script>
<script>QDATA.push({"unit":"u06","questions":[{"t":"qa","s":"有事法制","imp":2,"q":"2003年に有事関連3法の一つとして制定され、日本が外国から武力攻撃を受けた場合などの国・地方公共団体の責務や対処の手続を定めた法律を一般に何というか。","a":"武力攻撃事態対処法","alt":["武力攻撃事態法","事態対処法"],"e":"有事法制の中心となる法律で、2004年には住民の避難や救援を定めた国民保護法などが整備された。2015年の安全保障関連法による改正で存立危機事態への対処も加わり、事態対処法と略されるようになった。"},{"t":"mc","s":"有事法制","imp":1,"q":"日本の有事法制についての記述として最も適当なものを一つ選べ。","c":["国民保護法は、武力攻撃事態などにおける住民の避難や救援について、国や地方公共団体の役割を定めている。","有事法制は、1954年の自衛隊の発足と同時にすべて整備された。","武力攻撃事態対処法は、PKOに参加する自衛隊員の武器使用の基準を定めた法律である。","有事法制の整備によって、自衛隊の防衛出動に国会の承認は不要とされた。"],"a":0,"e":"国民保護法（2004年）は、住民の避難・救援や武力攻撃災害への対処について国や地方公共団体の役割を定め、国民の協力は自発的な意思にゆだねられるとしているので正しい。有事法制は長く整備されず、2003年の有事関連3法や2004年の国民保護法などで整えられたので誤り。武力攻撃事態対処法は武力攻撃を受けた場合などの対処の手続を定める法律で、PKOとは関係がないので誤り。防衛出動には原則として国会の事前の承認が必要なので誤り。"},{"t":"mc","s":"沖縄の基地問題","imp":2,"q":"沖縄の米軍基地問題についての記述として最も適当なものを一つ選べ。","c":["沖縄は1972年に日本に返還されたが、その後も広大な米軍基地が残された。","沖縄はサンフランシスコ平和条約の発効と同時に、日本に返還された。","普天間飛行場は日米の合意によって閉鎖され、辺野古への移設計画は中止された。","在日米軍専用施設の面積のうち、沖縄県にあるのは全体の約1割にすぎない。"],"a":0,"e":"沖縄は1972年に返還されたが、多くの米軍基地が残されたので正しい。サンフランシスコ平和条約の発効（1952年）後も、沖縄はアメリカの施政権下に置かれ続けたので誤り。普天間飛行場の返還は1996年に日米で合意されたが、移設先をめぐる対立が続いて返還は実現しておらず、移設計画も中止されていないので誤り。在日米軍専用施設の面積の約7割が沖縄県に集中しているので誤り。"},{"t":"tf","s":"沖縄の基地問題","imp":3,"q":"国土面積の約0.6％にすぎない沖縄県に、在日米軍専用施設・区域の面積の約7割が集中している。","a":true,"e":"正しい。沖縄の基地負担の大きさを示す数字としてよく問われる。基地の存在は、騒音や事故、米軍人による事件、地域の開発の制約などの問題をもたらしている。"},{"t":"qa","s":"沖縄の基地問題","imp":2,"q":"沖縄県宜野湾市の市街地の中心にあり、名護市辺野古への移設が計画されている米軍の飛行場は何か。","a":"普天間飛行場","alt":["普天間基地","米軍普天間飛行場"],"e":"1995年の米兵による少女暴行事件をきっかけに基地の整理・縮小を求める声が高まり、1996年に日米が普天間飛行場の返還に合意した。移設先の辺野古沿岸部の埋め立てをめぐっては、国と沖縄県の対立が続いている。"},{"t":"tf","s":"沖縄の基地問題","imp":1,"q":"2019年に行われた沖縄県民投票では、辺野古沿岸部の埋め立てに賛成する票が反対する票を上回った。","a":false,"e":"正しくは、反対票が投票総数の7割を超えた。ただし県民投票の結果には法的な拘束力がなく、国は埋め立て工事を続けた。1996年にも、米軍基地の整理・縮小と日米地位協定の見直しの賛否を問う県民投票が行われ、賛成が約9割を占めた。"},{"t":"ex","s":"沖縄の基地問題","imp":2,"q":"沖縄の米軍基地問題とはどのような問題か、その背景と現状を説明せよ。","a":"沖縄は戦後アメリカの統治下に置かれ、1972年の返還後も多くの米軍基地が残された。国土面積の約0.6％の沖縄県に在日米軍専用施設の面積の約7割が集中し、騒音や事故、米兵による事件などの負担が続いている。普天間飛行場の辺野古への移設をめぐっては、県民投票で反対が多数を占めるなど、国と沖縄県の対立が続いている。","e":"ポイント：①戦後のアメリカ統治と1972年の返還 ②在日米軍専用施設の面積の約7割が集中 ③事件・事故・騒音と日米地位協定の問題 ④普天間飛行場の辺野古移設と県民投票"}]});</script>
